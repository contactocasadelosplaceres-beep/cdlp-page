name: Reglas de Firestore
# Prueba tools/reglas/firestore.rules en el emulador (datos ficticios) en cada cambio. Manual: con
# publicar = 1 las publica en Firebase solo si todas las pruebas pasan. regresar_a = nombre de un
# conjunto anterior (sale en las anotaciones) para deshacer.
on:
  push:
    branches: [main]
    paths: ['tools/reglas/**']
  workflow_dispatch:
    inputs:
      publicar:
        description: '1 = publicar en Firebase si las pruebas pasan · 0 = solo probar'
        default: '0'
        required: true
      regresar_a:
        description: 'Opcional: nombre de un conjunto de reglas anterior para volver a él'
        default: ''
        required: false
permissions:
  contents: read
jobs:
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Pruebas en el emulador
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.regresar_a == '' }}
        run: cd tools/reglas && npm install --prefix test --no-audit --no-fund && test/node_modules/.bin/firebase emulators:exec --only firestore --project demo-cdlp "node test/rules.test.mjs"
      - name: Publicar
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publicar == '1' || inputs.regresar_a != '') }}
        run: npm install --prefix tools/diag --no-audit --no-fund && node tools/reglas/publicar.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REGRESAR_A: ${{ inputs.regresar_a }}
