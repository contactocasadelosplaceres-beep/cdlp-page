/* ============== MODO DE VENTA SIN CONEXIÓN ==============
   Si el internet falla justo cuando alguien está pagando, la venta no se pierde: se guarda
   completa en este mismo dispositivo (localStorage) y el inventario se descuenta igual en
   memoria para no vender dos veces lo mismo mientras sigue sin conexión — solo se aplaza el
   folio consecutivo y la escritura real en Firestore, que se asignan/mandan en cuanto regresa
   la señal. Mientras haya ventas pendientes de subir, no cierres esta pestaña ni la de otro
   dispositivo en este mismo centro sin haber recuperado internet primero. */
const POS_OFFLINE_QUEUE_KEY = 'cdlp_pos_offline_queue';
function loadOfflineQueue(){
  try{ return JSON.parse(localStorage.getItem(POS_OFFLINE_QUEUE_KEY)||'[]'); }catch(e){ return []; }
}
function saveOfflineQueue(queue){
  try{ localStorage.setItem(POS_OFFLINE_QUEUE_KEY, JSON.stringify(queue)); }catch(e){}
  state.offlineQueueCount = queue.length;
}
function queueOfflineSale(saleData){
  const queue = loadOfflineQueue();
  queue.push({...saleData, queuedAt:new Date().toISOString()});
  saveOfflineQueue(queue);
}
let posSyncingOffline = false;
async function trySyncOfflineQueue(){
  if(posSyncingOffline || typeof navigator!=='undefined' && 'onLine' in navigator && !navigator.onLine) return;
  let queue = loadOfflineQueue();
  if(!queue.length) return;
  posSyncingOffline = true;
  const touchedProductIds = new Set();
  while(queue.length){
    const sale = queue[0];
    try{
      const orderNumber = await getNextOrderNumber();
      const {stockUpdates, ...saleFields} = sale;
      await db.collection('sales').add({...saleFields, orderNumber, source:'pos', syncedFromOffline:true});
      for(const upd of (stockUpdates||[])){
        await db.collection('products').doc(upd.id).update(upd.payload);
        touchedProductIds.add(upd.id);
      }
      if(sale.couponCode){
        try{ await db.collection('couponUsage').add({code: sale.couponCode, date:new Date().toISOString()}); }catch(e){}
      }
      queue.shift();
      saveOfflineQueue(queue);
    }catch(e){
      console.error('No se pudo sincronizar una venta pendiente de conexión', e);
      break; // deja el resto en la cola para el siguiente intento, no se pierde nada
    }
  }
  if(touchedProductIds.size){
    const kitsToRefresh = state.products.filter(k=>k.isKit && (k.kitItems||[]).some(ki=>touchedProductIds.has(ki.productId)));
    await Promise.all(kitsToRefresh.map(k=>{
      k.stock = computeKitStock(k);
      return db.collection('products').doc(k.id).update({stock:k.stock}).catch(()=>{});
    }));
  }
  posSyncingOffline = false;
  if(queue.length===0) showToast('Ventas pendientes sincronizadas ✓');
  render();
}
window.addEventListener('online', ()=>{ state.posOffline=false; render(); trySyncOfflineQueue(); });
window.addEventListener('offline', ()=>{ state.posOffline=true; render(); });
setInterval(()=>{ if(!(typeof navigator!=='undefined' && 'onLine' in navigator && !navigator.onLine)) trySyncOfflineQueue(); }, 20000);
/* ============== RESERVA TRANSACCIONAL DE STOCK AL COBRAR ==============
   Antes el stock se leía una sola vez al abrir el POS y se descontaba con una escritura simple
   al cobrar, basada en esa copia en memoria. Si dos ventas ocurrían al mismo tiempo en distintos
   centros/cajeros (la arquitectura lo permite), ambas podían "ver" la misma última pieza
   disponible y venderla dos veces, sin que ninguna se enterara hasta después de cobrar.
   Ahora, antes de registrar la venta (solo cuando hay conexión — sin internet no hay con quién
   competir por el mismo stock, así que se mantiene el descuento local de siempre), se abre una
   transacción de Firestore que vuelve a leer el stock real de cada producto/variante/componente
   de kit involucrado, verifica que siga alcanzando, y si no alcanza aborta toda la venta sin
   cobrar ni descontar nada — como si nunca se hubiera intentado. */
class InsufficientStockError extends Error {
  constructor(items){ super('insufficient_stock'); this.name = 'InsufficientStockError'; this.insufficientItems = items; }
}
// Lotes con caducidad (los captura el admin): al vender se gastan primero las piezas que caducan antes.
function posEarliestExpiry(batches){
  const d = (batches||[]).filter(b=>(b.qty||0)>0 && b.expirationDate).map(b=>b.expirationDate).sort();
  return d[0] || '';
}
function posFefoConsume(batches, qty){
  const list = (batches||[]).map(b=>({...b}));
  const order = list.map((_,i)=>i).sort((a,b)=> String(list[a].expirationDate||'9999-99-99').localeCompare(String(list[b].expirationDate||'9999-99-99')));
  let left = qty;
  for(const i of order){ if(left<=0) break; const take = Math.min(list[i].qty||0, left); list[i].qty = (list[i].qty||0) - take; left -= take; }
  return list.filter(b=>(b.qty||0)>0);
}
async function reserveStockForSale(items, centerId){
  const demandByDoc = new Map(); // docId -> {center: qty, variants: Map(variantId->qty)}
  function addCenterDemand(docId, qty){
    const d = demandByDoc.get(docId) || {center:0, variants:new Map()};
    d.center += qty; demandByDoc.set(docId, d);
  }
  function addVariantDemand(docId, variantId, qty){
    const d = demandByDoc.get(docId) || {center:0, variants:new Map()};
    d.variants.set(variantId, (d.variants.get(variantId)||0) + qty);
    demandByDoc.set(docId, d);
  }
  items.forEach(it=>{
    const p = state.products.find(x=>x.id===it.id);
    if(p && p.isKit){
      // El kit en sí no guarda existencias propias — se descuenta de sus componentes reales.
      (p.kitItems||[]).forEach(ki=>{ if(ki.variantId) addVariantDemand(ki.productId, ki.variantId, (ki.qty||1)*it.qty); else addCenterDemand(ki.productId, (ki.qty||1)*it.qty); });
      return;
    }
    if(it.variantId){ addVariantDemand(it.id, it.variantId, it.qty); return; }
    addCenterDemand(it.id, it.qty);
  });
  const docIds = Array.from(demandByDoc.keys());
  if(!docIds.length) return {};
  return await db.runTransaction(async (tx)=>{
    const refs = docIds.map(id=>db.collection('products').doc(id));
    const snaps = await Promise.all(refs.map(r=>tx.get(r)));
    const insufficient = [];
    const updates = [];
    snaps.forEach((snap, idx)=>{
      const docId = docIds[idx];
      const demand = demandByDoc.get(docId);
      const localP = state.products.find(x=>x.id===docId);
      const name = (localP && localP.name) || docId;
      if(!snap.exists){ insufficient.push({id:docId, name}); return; }
      const data = snap.data();
      let payload = {};
      let ok = true;
      if(demand.center > 0){
        const stockByCenter = {...(data.stockByCenter||{})};
        const current = stockByCenter[centerId] || 0;
        if(current < demand.center){ ok = false; }
        else{
          stockByCenter[centerId] = current - demand.center;
          payload.stockByCenter = stockByCenter;
          payload.stock = Object.values(stockByCenter).reduce((s,n)=>s+(n||0),0);
          if(Array.isArray(data.batches) && data.batches.length){
            payload.batches = posFefoConsume(data.batches, demand.center);
            payload.expirationDate = posEarliestExpiry(payload.batches);
          }
        }
      }
      if(ok && demand.variants.size){
        const variants = (data.variants||[]).map(v=>({...v}));
        let variantQtyUsed = 0;
        for(const [variantId, qty] of demand.variants){
          const v = variants.find(x=>x.id===variantId);
          const current = v ? vCenterStock(v, centerId) : 0;
          if(!v || current < qty){ ok = false; break; }
          if(v.stockByCenter) v.stockByCenter = {...v.stockByCenter};
          vSetCenterStock(v, centerId, current - qty); variantQtyUsed += qty;
        }
        if(ok){
          const tmp = {variants, stockByCenter:data.stockByCenter}; vProductSync(tmp);
          payload.variants = variants; payload.stock = tmp.stock; payload.stockByCenter = tmp.stockByCenter;
          if(Array.isArray(data.batches) && data.batches.length){
            payload.batches = posFefoConsume(payload.batches || data.batches, variantQtyUsed);
            payload.expirationDate = posEarliestExpiry(payload.batches);
          }
        }
      }
      if(!ok){ insufficient.push({id:docId, name}); return; }
      updates.push({ref: refs[idx], payload, docId});
    });
    if(insufficient.length) throw new InsufficientStockError(insufficient);
    updates.forEach(u=> tx.update(u.ref, u.payload));
    const map = {};
    updates.forEach(u=>{ map[u.docId] = u.payload; });
    return map;
  });
}
/* WhatsApp rápido al cobrar: si el cajero captura un número (y no hay cliente elegido), se busca en la lista;
   si existe se asocia solo y si no se crea el cliente al momento. Es opcional y nunca bloquea el cobro. */
function quickPhoneDigits(){ return String(state.quickPhone||'').replace(/\D/g,''); }
function findCustomerByPhonePOS(digits){
  const k = digits.slice(-10); if(k.length<10) return null;
  return state.customers.find(c=>{ const d=String(c.phone||'').replace(/\D/g,''); return d.slice(-10)===k || (c.altPhones||[]).some(a=>String(a).replace(/\D/g,'').slice(-10)===k); }) || null;
}
function escQuickAttr(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function onQuickPhoneInput(v){
  state.quickPhone = String(v||'').replace(/[^0-9+\s-]/g,'').slice(0,18);
  const m = findCustomerByPhonePOS(quickPhoneDigits());
  if(m){ state.activeCustomer = m; state.quickPhone = ''; showToast('Cliente encontrado: '+m.name); render(); return; }
  const hint = document.getElementById('quick-phone-hint');
  if(hint) hint.textContent = quickPhoneDigits().length>=10 ? 'Se guardará como cliente nuevo al cobrar' : '';
}
async function ensureQuickCustomer(){
  if(state.activeCustomer) return;
  const digits = quickPhoneDigits(); if(digits.length<10) return;
  const found = findCustomerByPhonePOS(digits);
  if(found){ state.activeCustomer = found; return; }
  const phone = digits.slice(-10);
  const payload = {name:'Cliente '+phone.slice(-4), phone, email:'', address:'', city:'', state:'', country:'', notes:'Creado desde el cobro en el Punto de Venta', createdAt:new Date().toISOString(), source:'pos-rapido'};
  const offline = typeof navigator!=='undefined' && 'onLine' in navigator && !navigator.onLine;
  if(offline){ state.activeCustomer = {id:null, ...payload}; return; }
  try{
    const ref = await db.collection('customers').add(payload);
    const c = {id:ref.id, ...payload}; state.customers.push(c); state.activeCustomer = c;
  }catch(e){ console.error('No se pudo crear el cliente rápido', e); state.activeCustomer = {id:null, ...payload}; }
}
async function chargeSale(){
  if(cartCount()===0 || state.sending) return;
  if(!state.activeCashRegister){ showToast('Abre la caja antes de vender'); return; }
  let payments;
  if(state.payMethod === 'Dividido'){
    payments = PAY_METHODS.map(m=>({method:m, amount: Math.round(Number(state.splitAmounts[m])||0)})).filter(p=>p.amount>0);
    if(payments.length < 2){ showToast('Ingresa al menos dos métodos de pago para dividir la venta'); return; }
    if(splitRemaining() !== 0){ showToast('La suma de los pagos divididos debe ser igual al total'); return; }
  }
  state.sending = true; render();
  await ensureQuickCustomer();
  const centerId = state.activeCenter.id;
  const items = Object.entries(state.cart).map(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    return {id:p.id, variantId: v?v.id:null, name: p.name+(v?` (${variantLabel(v)})`:''), price:itemPrice(p,v), qty};
  });
  const subtotal = items.reduce((s,it)=>s+it.price*it.qty,0);
  const discountAmount = currentDiscountAmount();
  const total = subtotal - discountAmount;
  if(!payments) payments = [{method: state.payMethod, amount: total}];
  let manualDiscountPayload = null;
  if(state.manualDiscount){
    manualDiscountPayload = { type: state.manualDiscount.type, amount: discountAmount, reason: state.manualDiscount.reason };
    if(state.manualDiscount.type==='coupon') manualDiscountPayload.code = state.manualDiscount.coupon.code;
    else manualDiscountPayload.value = state.manualDiscount.value;
  }
  const isOffline = typeof navigator!=='undefined' && 'onLine' in navigator && !navigator.onLine;
  // Con conexión, antes de tocar nada en memoria, se reserva el stock en una transacción de
  // Firestore: así, si dos ventas chocan por la misma última pieza (dos cajeros, dos centros,
  // al mismo tiempo), sólo una gana y la otra se cancela limpiamente en vez de dejar el
  // inventario en negativo. Sin conexión no hay con quién competir, así que se mantiene el
  // flujo de siempre (descuento en memoria + cola para sincronizar después).
  if(!isOffline){
    try{
      await reserveStockForSale(items, centerId);
    }catch(e){
      if(e instanceof InsufficientStockError){
        const names = e.insufficientItems.map(i=>i.name).join(', ');
        showToast(`Ya no alcanza el stock de: ${names}. Revisa el carrito.`);
        try{
          await Promise.all(e.insufficientItems.map(async it=>{
            const snap = await db.collection('products').doc(it.id).get();
            if(snap.exists){
              const idx = state.products.findIndex(x=>x.id===it.id);
              const fresh = {id:snap.id, ...snap.data()};
              if(idx>=0) state.products[idx] = fresh; else state.products.push(fresh);
            }
          }));
        }catch(e2){ console.error('No se pudo refrescar el stock local', e2); }
      } else {
        console.error(e); showToast('No se pudo registrar la venta');
      }
      state.sending = false; render();
      return;
    }
  }
  try{
    // El inventario se descuenta en memoria siempre, aquí mismo, esté o no la conexión, para que
    // la interfaz se vea consistente de inmediato. Con conexión, el descuento real y a prueba de
    // carreras ya quedó aplicado arriba por reserveStockForSale (transacción); lo de aquí sólo
    // actualiza la copia local y el caché de stock de los kits. Sin conexión, esto es lo único
    // que hay: se guarda en "stockUpdates" para mandarlo en cuanto regrese la señal.
    const touchedComponentIds = new Set();
    const stockUpdates = [];
    const kitCacheUpdates = [];
    items.forEach(it=>{
      const p = state.products.find(x=>x.id===it.id);
      if(!isOffline) logStockMovement(it.id, 'venta_pos', -it.qty, `Venta`, centerId);
      if(p && p.isKit){
        // Un kit se vende como un solo ítem, pero descuenta el inventario real de cada
        // producto que lo compone — el kit en sí no guarda existencias propias.
        (p.kitItems||[]).forEach(ki=>{
          const comp = state.products.find(x=>x.id===ki.productId);
          if(!comp) return;
          if(ki.variantId){
            const kv = (comp.variants||[]).find(x=>x.id===ki.variantId);
            if(kv){
              vSetCenterStock(kv, centerId, vCenterStock(kv, centerId) - (ki.qty||1)*it.qty);
              vProductSync(comp); touchedComponentIds.add(comp.id);
              if(!isOffline) logStockMovement(comp.id, 'venta_pos_kit', -(ki.qty||1)*it.qty, `Componente de "${p.name}"`, centerId);
              stockUpdates.push({id:comp.id, payload:{variants: comp.variants, stock: comp.stock, stockByCenter: comp.stockByCenter}});
            }
            return;
          }
          if(!comp.stockByCenter) comp.stockByCenter = {};
          comp.stockByCenter[centerId] = Math.max(0, (comp.stockByCenter[centerId]||0) - (ki.qty||1)*it.qty);
          comp.stock = totalStock(comp);
          touchedComponentIds.add(comp.id);
          if(!isOffline) logStockMovement(comp.id, 'venta_pos_kit', -(ki.qty||1)*it.qty, `Componente de "${p.name}"`, centerId);
          stockUpdates.push({id:comp.id, payload:{stockByCenter: comp.stockByCenter, stock: comp.stock}});
        });
        return;
      }
      if(it.variantId){
        const v = (p.variants||[]).find(x=>x.id===it.variantId);
        if(v) vSetCenterStock(v, centerId, vCenterStock(v, centerId) - it.qty);
        vProductSync(p);
        stockUpdates.push({id:it.id, payload:{variants: p.variants, stock: p.stock, stockByCenter: p.stockByCenter}});
        return;
      }
      if(!p.stockByCenter) p.stockByCenter = {};
      p.stockByCenter[centerId] = Math.max(0, (p.stockByCenter[centerId]||0) - it.qty);
      p.stock = Math.max(0, (p.stock||0) - it.qty);
      touchedComponentIds.add(it.id);
      stockUpdates.push({id:it.id, payload:{stockByCenter: p.stockByCenter, stock: p.stock}});
    });
    // Refresca el stock cacheado de cualquier kit (incluido el que se acaba de vender) cuyos
    // componentes se hayan movido, para que se muestre "Agotado" en cuanto ya no alcance.
    if(touchedComponentIds.size){
      const kitsToRefresh = state.products.filter(k=>k.isKit && (k.kitItems||[]).some(ki=>touchedComponentIds.has(ki.productId)));
      kitsToRefresh.forEach(k=>{ k.stock = computeKitStock(k); if(!isOffline) kitCacheUpdates.push({id:k.id, payload:{stock:k.stock}}); });
    }
    const couponCode = state.manualDiscount && state.manualDiscount.type==='coupon' ? state.manualDiscount.coupon.code : null;
    const saleFields = {
      date: new Date().toISOString(),
      cashierId: state.activeCashier.id, cashierName: state.activeCashier.name,
      centerId, centerName: state.activeCenter.name,
      cashRegisterId: state.activeCashRegister.id,
      items, subtotal, total, paymentMethod: state.payMethod, payments,
      manualDiscount: manualDiscountPayload, couponCode,
      customerId: state.activeCustomer ? state.activeCustomer.id : null,
      customerName: state.activeCustomer ? state.activeCustomer.name : null,
      customerPhone: state.activeCustomer ? (state.activeCustomer.phone||'') : null,
      customerAddress: state.activeCustomer ? (state.activeCustomer.address||'') : null,
      notes: state.saleNotes || '',
    };
    let orderNumber = null;
    if(isOffline){
      queueOfflineSale({...saleFields, stockUpdates});
      showToast('Sin conexión: la venta se guardó en este dispositivo y se subirá sola cuando regrese el internet');
    } else {
      orderNumber = await getNextOrderNumber();
      // Los productos/variantes/componentes ya se descontaron de forma atómica en reserveStockForSale;
      // aquí sólo falta refrescar el stock cacheado de los kits afectados (no es sensible a carreras).
      await Promise.all(kitCacheUpdates.map(u=>db.collection('products').doc(u.id).update(u.payload)));
      await db.collection('sales').add({...saleFields, orderNumber, source:"pos"});
      if(couponCode){
        try{ await db.collection('couponUsage').add({code: couponCode, date:new Date().toISOString()}); }
        catch(e){ console.error('No se pudo registrar el uso del cupón', e); }
      }
    }
    clearPosCart();
    state.lastSaleTotal = total; state.lastOrderNumber = orderNumber; state.lastPayments = payments; state.cart = {}; state.cartCollapsed = true; state.saleDone = true; state.checkoutReminderShown = false;
    state.lastSale = {...saleFields, orderNumber};
    state.lastSaleItems = items; state.lastCustomerName = state.activeCustomer ? state.activeCustomer.name : ''; state.lastCustomerPhone = state.activeCustomer ? (state.activeCustomer.phone||'') : '';
    // Aviso interno a Slack (en paralelo, opcional) — ver Configuración → Datos operativos en el admin. Sin conexión no se puede mandar; se omite (no se reintenta al sincronizar).
    if(!isOffline){
      const productLines = items.map(it=>`• ${it.qty}x ${it.name}`).join('\n');
      const clienteLine = state.activeCustomer ? `\nCliente: ${state.activeCustomer.name}${state.activeCustomer.phone?` (${state.activeCustomer.phone})`:''}` : '';
      sendSlackNotification(`💰 *Nueva venta* ${orderNumber?`#${orderNumber}`:''} — ${state.activeCenter.name}\nAtendió: ${state.activeCashier.name}\nProducto:\n${productLines}${clienteLine}\nTotal: ${money(total)}`);
    }
    state.manualDiscount = null; state.activeCustomer = null; state.quickPhone = ''; state.saleNotes = ''; state.splitAmounts = {}; state.payMethod = 'Efectivo';
  }catch(e){
    console.error(e); showToast('No se pudo registrar la venta');
  }
  state.sending = false; render();
}

/* ============== BÚSQUEDA TOLERANTE (misma lógica que la tienda) ==============
   Ignora acentos y mayúsculas, acepta las palabras en cualquier orden, entiende plurales y perdona
   una letra mal escrita en palabras largas ("lubrikante"). Respeta los sinónimos de Configuración.
   searchProducts(q, lista) devuelve las coincidencias con las mejores primero; tolMatch(q, ...textos)
   sirve para clientes, pedidos, mensajes, etc. */
function searchClean(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function searchStem(t){
  if(t.length>4 && t.endsWith('es')) return t.slice(0,-2);
  if(t.length>3 && t.endsWith('s')) return t.slice(0,-1);
  return t;
}
function withinOneEdit(a,b){
  if(a===b) return true;
  const la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  let i=0, j=0, edits=0;
  while(i<la && j<lb){
    if(a[i]===b[j]){ i++; j++; continue; }
    if(++edits>1) return false;
    if(la>lb) i++; else if(lb>la) j++; else { i++; j++; }
  }
  return edits + (la-i) + (lb-j) <= 1;
}
const _searchIdx = new Map();
function productSearchEntry(p){
  const cats = ((p.categories&&p.categories.length)?p.categories:(p.cat?[p.cat]:[])).join(' ');
  const vs = (p.variants||[]).map(v=>(v.sku||'')+' '+(v.name||'')+' '+Object.values(v.combo||{}).join(' ')).join(' ');
  const sig = (p.name||'')+'|'+cats+'|'+(p.sku||'')+'|'+(p.barcode||'')+'|'+(p.location||'')+'|'+vs;
  let e = _searchIdx.get(p.id);
  if(e && e.sig===sig) return e;
  const name = searchClean(p.name), catsN = searchClean(cats), loc = searchClean(p.location), code = searchClean((p.sku||'')+' '+(p.barcode||'')+' '+vs);
  e = {sig, name, cats:catsN, loc, code, words:new Set((name+' '+catsN).split(' ').filter(w=>w.length>=3))};
  _searchIdx.set(p.id, e);
  return e;
}
function productSearchScore(p, tokens, full){
  const e = productSearchEntry(p);
  let score = 0;
  if(e.name.includes(full)) score += 10;
  if(e.name.startsWith(full)) score += 5;
  for(const t of tokens){
    const s = searchStem(t);
    if(e.name.includes(s)) score += 4;
    else if(e.cats.includes(s)) score += 3;
    else if(e.code && e.code.includes(t)) score += 3;
    else if(e.loc && e.loc.includes(s)) score += 2;
    else if(s.length>=5){
      let hit = false;
      for(const w of e.words){ if(withinOneEdit(searchStem(w), s) || withinOneEdit(w, t) || withinOneEdit(w.slice(0,s.length), s) || withinOneEdit(w.slice(0,s.length+1), s)){ hit = true; break; } }
      if(hit) score += 1.5; else return -1;
    } else return -1;
  }
  return score;
}
let _synSig = '', _synGroups = [];
function synonymGroups(){
  const raw = state.settings && state.settings.searchSynonyms;
  const sig = JSON.stringify(raw||[]);
  if(sig!==_synSig){
    _synSig = sig;
    _synGroups = (Array.isArray(raw)?raw:[]).map(line=>String(line).split(',').map(x=>searchClean(x)).filter(Boolean)).filter(g=>g.length>=2);
  }
  return _synGroups;
}
function queryVariants(full){
  const out = [full], groups = synonymGroups();
  if(!groups.length) return out;
  const tokens = full.split(' ');
  groups.forEach(g=>{
    g.forEach((phrase,pi)=>{
      let build = null;
      if((' '+full+' ').includes(' '+phrase+' ')) build = (other)=>(' '+full+' ').replace(' '+phrase+' ', ' '+other+' ').trim();
      else if(!phrase.includes(' ')){
        const t = tokens.find(x=>x.length>=4 && phrase.startsWith(x));
        if(t) build = (other)=>tokens.map(x=>x===t?other:x).join(' ');
      }
      if(!build) return;
      g.forEach((other,oi)=>{ if(oi!==pi){ const v = build(other); if(v && !out.includes(v)) out.push(v); } });
    });
  });
  return out.slice(0, 8);
}
function searchProducts(q, pool){
  const full = searchClean(q);
  const tokens = full.split(' ').filter(Boolean);
  const list = pool || state.products;
  if(!tokens.length) return list;
  const variants = queryVariants(full).map(v=>({v, toks:v.split(' ').filter(Boolean)}));
  const out = [];
  list.forEach((p,i)=>{
    let best = -1;
    variants.forEach((x,vi)=>{
      const sc = productSearchScore(p, x.toks, x.v);
      if(sc>=0){ const adj = vi===0 ? sc : sc-0.5; if(adj>best) best = adj; }
    });
    if(best>=0) out.push({p, sc:best, i});
  });
  out.sort((a,b)=> b.sc-a.sc || a.i-b.i);
  return out.map(x=>x.p);
}
// Texto libre (clientes, pedidos, mensajes…): todas las palabras escritas deben aparecer, sin importar acentos ni orden.
function tolMatch(q, ...fields){
  const toks = searchClean(q).split(' ').filter(Boolean);
  if(!toks.length) return true;
  const hay = ' ' + fields.map(searchClean).join(' ') + ' ';
  const hayDigits = fields.map(f=>String(f==null?'':f).replace(/\D/g,'')).join(' ');
  return toks.every(t=> hay.includes(t) || (/^\d{3,}$/.test(t) && hayDigits.includes(t)) || (t.length>=5 && hay.split(' ').some(w=>w.length>=4 && (withinOneEdit(w,t)||withinOneEdit(w.slice(0,t.length),t)))));
}
function posSearchMatches(q){
  q = (q||'').trim(); if(!q) return [];
  return searchProducts(q);
}

function normalizePhone(phone){ return (phone||'').replace(/\D/g,''); }
// Aviso interno a Slack (opcional, ver admin.html → Configuración → Datos operativos). Mismo
// mecanismo que en index.html: se manda "a ciegas" (no-cors) para evitar el bloqueo de CORS de
// un webhook de Slack llamado sin servidor propio, y nunca debe interrumpir el cobro si falla.
function sendSlackNotification(text){
  const url = state.settings.slackWebhookUrl;
  if(!url) return;
  try{
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({text}) }).catch(()=>{});
  }catch(e){ /* silencioso a propósito: Slack es un aviso extra, no debe tronar el cobro */ }
}
function receiptWhatsappMessage(){
  const lines = (state.lastSaleItems||[]).map(it=>`• ${it.qty}x ${it.name} — ${money(it.price*it.qty)}`).join('\n');
  const storeName = (state.settings && state.settings.storeName) || 'La Casa de los Placeres';
  return `¡Gracias por tu compra en ${storeName}!${state.lastOrderNumber?` Venta ${formatFolio(state.lastOrderNumber)}`:''}\n\n${lines}\n\nTotal: ${money(state.lastSaleTotal)}\n\n¡Que lo disfrutes!`;
}
function sendReceiptWhatsapp(){
  const phone = normalizePhone(state.lastCustomerPhone);
  if(!phone) return;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(receiptWhatsappMessage())}`, '_blank');
}
// "Enviar al repartidor" desde el punto de venta: mismo mensaje que el botón del detalle de
// pedido en el admin (folio, origen, destino, teléfono, monto), sin nombre del cliente ni productos. Usa el WhatsApp del repartidor y la dirección de origen
// de Configuración → Datos operativos.
function buildSaleDeliveryMessage(v){
  const origen = (state.settings && state.settings.storeAddress) || '(configura tu dirección de origen en Configuración)';
  const direccion = v.address || v.customerAddress || 'Retirado en Punto de Venta';
  const destino = [direccion, v.notes].filter(Boolean).join(' — ');
  const telefono = v.phone || v.customerPhone || '';
  return `*PEDIDO ${v.orderNumber || ''}*\n\n` +
         `*De* ${origen}\n\n` +
         `*A* ${destino}\n${telefono}\n\n` +
         `*Producto* $${Math.round(v.total||0)}\n\n` +
         `*Cobrar al cliente* $`;
}
function sendSaleToDelivery(v){
  if(!v){ showToast('No se encontró la venta'); return; }
  const wa = ((state.settings && state.settings.deliveryWhatsapp) || '').replace(/\D/g,'');
  if(!wa){ showToast('Falta el WhatsApp del repartidor (admin → Configuración → Datos operativos)'); return; }
  window.open(`https://wa.me/${wa}?text=${encodeURIComponent(buildSaleDeliveryMessage(v))}`, '_blank');
}

/* ============== PRESERVAR EL CAMPO QUE SE ESTÁ EDITANDO AL VOLVER A DIBUJAR LA PANTALLA ==============
   Mismo mecanismo que en admin.html: captura qué campo tenía el foco y en qué posición iba el
   cursor justo antes de que render() reconstruya el HTML, y lo restaura después. */
function captureFocusState(root){
  const el = document.activeElement;
  if(!el || !root || !root.contains(el) || !el.id) return null;
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return null;
  const info = { id: el.id, value: el.value, scrollTop: root.scrollTop };
  if(typeof el.selectionStart === 'number'){ info.selStart = el.selectionStart; info.selEnd = el.selectionEnd; }
  return info;
}
function restoreFocusState(root, info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  if('value' in el && el.value !== info.value) el.value = info.value;
  el.focus();
  if(info.selStart!=null && el.setSelectionRange){
    try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
  }
  root.scrollTop = info.scrollTop;
}
const SCROLLABLE_SELECTOR = '[style*="overflow-y:auto"],[style*="overflow-y: auto"],[style*="overflow:auto"],[style*="overflow: auto"]';
function captureScrollPositions(root){
  return Array.from(root.querySelectorAll(SCROLLABLE_SELECTOR)).map(el=>el.scrollTop);
}
function restoreScrollPositions(root, positions){
  if(!positions || !positions.length) return;
  const els = root.querySelectorAll(SCROLLABLE_SELECTOR);
  els.forEach((el,i)=>{ if(positions[i]) el.scrollTop = positions[i]; });
}
/* Menús desplegables siempre dentro de la pantalla: se abren alineados a la derecha de su botón,
   pero en celular el botón puede quedar del lado izquierdo (ej. "Herramientas" en Productos) y el
   menú se salía cortado por la izquierda. Después de cada render se mide cada menú abierto y, si
   se sale por cualquier lado, se recorre lo necesario para que quepa completo. */
function fitFloatingMenus(){
  const vw = document.documentElement.clientWidth, pad = 8;
  document.querySelectorAll('.row-more-menu,.order-actions-menu,.top-more-menu').forEach(el=>{
    el.style.transform = ''; el.style.maxWidth = `calc(100vw - ${pad*2}px)`;
    const r = el.getBoundingClientRect();
    let dx = 0;
    if(r.left < pad) dx = pad - r.left;
    else if(r.right > vw - pad) dx = (vw - pad) - r.right;
    if(dx) el.style.transform = `translateX(${Math.round(dx)}px)`;
  });
}
function render(){
  const root = document.getElementById('root');
  const focusInfo = captureFocusState(root);
  const scrollPositions = captureScrollPositions(root);
  if(!state.authChecked){ root.innerHTML = `<div class="loading-screen">Verificando sesión…</div>`; restoreFocusState(root, focusInfo); return; }
  if(!state.user){ root.innerHTML = renderLogin(); restoreFocusState(root, focusInfo); return; }
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando…</div>`; restoreFocusState(root, focusInfo); return; }
  if(state.loadFailed){ root.innerHTML = `<div class="loading-screen" style="flex-direction:column;gap:14px;padding:24px;text-align:center;"><div style="font-size:18px;">No se pudo conectar</div><div style="font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--ink-soft);max-width:320px;">Revisa el internet del dispositivo y vuelve a intentar.</div><button class="btn-primary" style="width:auto;padding:12px 22px;" onclick="state.loaded=false;state.loadFailed=false;render();loadData()">Reintentar</button></div>`; restoreFocusState(root, focusInfo); return; }
  if(!state.activeCashier){ root.innerHTML = renderCashierSelect(); }
  else if(!state.pinConfirmed){ root.innerHTML = renderPinScreen(); }
  else if(!state.activeCenter){ root.innerHTML = renderCenterSelect(); }
  else if(!state.cashRegisterChecked){
    if(!state.cashRegisterLoading) loadCashRegister();
    root.innerHTML = `<div class="loading-screen">Verificando caja…</div>`;
  }
  else if(!state.activeCashRegister){ root.innerHTML = renderCashOpenScreen(); }
  else{
    if(!state.posSessionReported) reportActivePosSession();
    let html = state.saleDone ? renderReceipt() : (state.closingLoading ? `<div class="loading-screen">Preparando cierre…</div>` : (state.closingOpen ? renderCashCloseScreen() : renderPOS()));
    if(state.cashPanelOpen) html += renderCashPanelModal();
    if(state.movementModalOpen) html += renderMovementModal();
    if(state.customerPickerOpen) html += renderCustomerPickerModal();
    if(state.discountModalOpen) html += renderDiscountModal();
    if(state.notesModalOpen) html += renderNotesModal();
    if(state.barcodeScannerOpen) html += renderBarcodeScannerModal();
    if(state.salesListOpen) html += renderSalesListModal();
    if(state.voidModal) html += renderVoidModal();
    if(state.heldOpen) html += renderHeldModal();
    if(state.exchangeModalOpen) html += renderExchangeModal();
    if(state.checkoutReminderOpen) html += renderCheckoutReminderModal();
    if(state.warehouseOpen) html += renderWarehouseModal();
    root.innerHTML = html;
  }
  toastStack();
  restoreFocusState(root, focusInfo);
  restoreScrollPositions(root, scrollPositions);
  try{ fitFloatingMenus(); }catch(e){}
}
render();


/* ============== BOTÓN "ATRÁS" ==============
   El botón atrás del teléfono/navegador sacaba de la aplicación porque todo ocurre en una sola
   página. Aquí cada "pantalla" abierta (cajón, ventana, sub-panel…) cuenta como un paso del
   historial: al abrirla se agrega una entrada y al presionar atrás se cierra la de encima, en vez
   de salir. navLayers() lista (de arriba hacia abajo) lo que está abierto y cómo cerrarlo; no toca
   ninguna lógica de la página, solo lee su estado y reutiliza las mismas funciones de cierre. */
const NAV = {depth:0, ignore:0, busy:false};
try{ if(history.state && history.state.cdlpNav) history.replaceState(null,''); }catch(e){}
function navSync(){
  if(NAV.busy || NAV.ignore>0) return;
  let n = 0; try{ n = navLayers().length; }catch(e){}
  if(n > NAV.depth){
    while(NAV.depth < n){ NAV.depth++; try{ history.pushState({cdlpNav:NAV.depth}, ''); }catch(e){} }
  } else if(n < NAV.depth){
    const d = NAV.depth - n; NAV.depth = n; NAV.ignore++;
    setTimeout(()=>{ if(NAV.ignore>0){ NAV.ignore=0; navSync(); } }, 900);
    try{ history.go(-d); }catch(e){ NAV.ignore=0; }
  }
}
window.addEventListener('popstate', (e)=>{
  if(NAV.ignore>0){ NAV.ignore--; if(NAV.ignore===0) navSync(); return; }
  const target = (e.state && e.state.cdlpNav) || 0;
  let n = 0; try{ n = navLayers().length; }catch(_){}
  NAV.busy = true;
  try{
    for(let i = n - target; i > 0; i--){
      const cur = navLayers(); if(!cur.length) break;
      try{ cur[0](); }catch(_){}
    }
  } finally { NAV.busy = false; }
  NAV.depth = target;
  navSync();
});

function navLayers(){
  const s = state, L = [];
  if(!s.user || !s.loaded || !s.activeCashier || !s.pinConfirmed || !s.activeCenter || !s.activeCashRegister) return L;
  if(s.posMoreMenuOpen) L.push(()=>{ s.posMoreMenuOpen=false; render(); });
  if(s.checkoutReminderOpen) L.push(()=>closeCheckoutReminder(false));
  if(s.warehouseOpen) L.push(()=>closeWarehouseView());
  if(s.exchangeModalOpen) L.push(()=>closeExchangeModal());
  if(s.voidModal) L.push(()=>{ s.voidModal=null; render(); });
  if(s.heldOpen) L.push(()=>{ s.heldOpen=false; render(); });
  if(s.salesListOpen) L.push(()=>closeSalesList());
  if(s.barcodeScannerOpen) L.push(()=>closeBarcodeScanner());
  if(s.notesModalOpen) L.push(()=>{ s.notesModalOpen=false; render(); });
  if(s.discountModalOpen) L.push(()=>{ s.discountModalOpen=false; render(); });
  if(s.customerPickerOpen) L.push(()=>{ s.customerPickerOpen=false; render(); });
  if(s.movementModalOpen) L.push(()=>{ s.movementModalOpen=false; render(); });
  if(s.cashPanelOpen) L.push(()=>{ s.cashPanelOpen=false; render(); });
  if(s.variantPickerProduct) L.push(()=>{ s.variantPickerProduct=null; render(); });
  if(s.catalogOpen && posDesktop()) L.push(()=>closeCatalog());
  if(s.closingOpen) L.push(()=>{ s.closingOpen=false; render(); });
  if(s.saleDone) L.push(()=>newSale());
  else if(!s.closingOpen && s.cartCollapsed===false && !posDesktop()) L.push(()=>{ s.cartCollapsed=true; render(); });
  return L;
}

{ const _renderBase = render; render = function(){ _renderBase(); navSync(); }; }

/* ===== AVISO ANTES DE PERDER UNA VENTA A MEDIAS =====
   Si se recarga o se cierra la pestaña con productos en el carrito y la venta sin cobrar, el
   navegador pregunta antes de salir (un jalón accidental hacia abajo en el celular recarga todo). */
window.addEventListener('beforeunload', (e)=>{
  if(state.saleDone || !state.cart || !Object.keys(state.cart).length) return;
  e.preventDefault(); e.returnValue = ''; return '';
});
