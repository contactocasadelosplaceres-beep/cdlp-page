name: Diagnóstico de lecturas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install --prefix tools/diag --no-audit --no-fund
      - run: node tools/diag/emu/getrules.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: cd tools/diag/emu && npm install --no-audit --no-fund && npx firebase emulators:exec --only firestore --project demo-cdlp "node rules.test.mjs"
