<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Casa de los Placeres — Catálogo</title>
<link rel="icon" type="image/png" href="favicon.png">
<!-- Vista previa al compartir el enlace (WhatsApp, redes, etc.) — antes no existía ninguna,
     así que un enlace compartido se veía como un cuadro gris sin nombre ni descripción. -->
<meta property="og:title" content="La Casa de los Placeres">
<meta property="og:description" content="Tu catálogo con total discreción. Explora, arma tu pedido y recíbelo en la puerta de tu casa.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://contactocasadelosplaceres-beep.github.io/cdlp-page/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="La Casa de los Placeres">
<meta name="twitter:description" content="Tu catálogo con total discreción. Explora, arma tu pedido y recíbelo en la puerta de tu casa.">
<meta name="twitter:image" content="https://contactocasadelosplaceres-beep.github.io/cdlp-page/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700;800&family=Lora:wght@400;500;600&family=Poppins:wght@500;600;700;800&family=Fraunces:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style id="custom-css-injected"></style>
<style>
  :root{
    --bg: #F9F6F8; --surface: #FFFFFF; --surface-soft: #F6E9E6;
    --ink: #1A1A1A; --ink-soft: #666666;
    --primary: #993477; --primary-deep: #5C1F49; --rose: #BC355C;
    --coral: #ED7578; --amber: #F6A030; --green: #7AB71A; --teal: #20B7CA; --navy: #0A4A5B;
    --border: #EBD9D3; --radius-card: 16px; --radius-sm:10px; --radius-md:14px; --radius-lg:20px; --radius-pill: 999px;
    --shadow-sm:0 2px 10px -6px rgba(43,22,32,0.18);
    --shadow-md:0 16px 32px -16px rgba(74,22,66,0.28);
    --shadow-lg:0 28px 56px -24px rgba(74,22,66,0.38);
    --font-heading:'League Spartan',sans-serif; --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;position:relative;}
  h1,h2,h3,.display{font-family:var(--font-heading);letter-spacing:0.01em;margin:0;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit;touch-action:manipulation;}
  a{touch-action:manipulation;}
  img{max-width:100%;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1160px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ===== HEADER ===== */
  .topbar{position:fixed;top:0;left:0;right:0;width:100%;z-index:30;background:var(--primary-deep);color:#fff;box-shadow:0 6px 20px -12px rgba(0,0,0,0.4);padding-top:env(safe-area-inset-top, 0px);}
  .topbar-spacer{width:100%;}
  .topbar-main{padding:8px 12px;display:flex;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex-shrink:1;padding:0;margin:0;}
  .brand-mark-img{width:32px;height:32px;border-radius:9px;object-fit:cover;flex-shrink:0;display:block;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--rose),var(--amber));flex-shrink:0;display:none;}
  .brand-text{line-height:1.15;min-width:0;overflow:hidden;}
  .brand-name{font-family:var(--font-heading);font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-sub{font-size:10.5px;color:#e9c9dc;letter-spacing:0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-nav{display:none;flex:1;justify-content:center;gap:22px;font-size:13.5px;font-weight:600;}
  .header-nav a{opacity:.88;white-space:nowrap;}
  .header-nav a:hover{opacity:1;}
  @media(min-width:860px){.header-nav{display:flex;}}
  .header-actions{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0;}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,0.12);}
  .cart-btn{position:relative;background:rgba(255,255,255,0.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cart-count{position:absolute;top:2px;right:2px;background:var(--amber);color:#3a2200;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--primary-deep);}
  .search-bar{overflow:hidden;max-height:0;transition:max-height .2s ease;}
  .search-bar.open{max-height:60px;}
  .search-toggle{display:none;}
  html.search-collapsed .search-bar.open{max-height:0;}
  html.search-collapsed .search-toggle{display:flex;}
  .search-bar-inner{padding:0 12px 8px;}
  .search-input{width:100%;height:40px;padding:0 14px;border-radius:var(--radius-pill);border:none;font-size:16px;font-family:inherit;background:rgba(255,255,255,0.14);color:#fff;}
  .search-input::placeholder{color:#e9c9dc;}
  @media(max-width:480px){
    /* Antes "Discreto · Confidencial..." se veía a medias ("Discreto · Confid…") en casi
       cualquier celular porque el header no tenía espacio para el logo + nombre + 4 botones +
       ese subtítulo completo. Es el mensaje de discreción más importante del sitio, así que en
       vez de mostrarlo cortado se oculta aquí (ya se repite completo más abajo, en la franja de
       confianza "Compra segura · Empaque discreto..."). */
    .brand-sub{display:none;}
    .brand-name{font-size:14.5px;}
    .topbar-main{gap:6px;}
    .header-actions{gap:0;}
    .header-actions .icon-btn,.header-actions .cart-btn{width:40px;height:40px;}
  }
  @media(max-width:359px){
    .topbar-main{padding:10px 12px;gap:8px;}
    .brand-name{font-size:14px;}
    .cart-btn{width:40px;height:40px;}
    .icon-btn{width:40px;height:40px;}
  }


  /* ===== HERO ===== */
  .hero{position:relative;padding:34px 20px 24px;background:linear-gradient(180deg,var(--primary-deep) 0%,var(--primary-deep) 58%,var(--bg) 58%);}
  .hero-inner{background:var(--surface);border-radius:20px;padding:28px 24px;box-shadow:0 20px 40px -24px rgba(74,22,66,0.5);}
  .hero h1{font-size:27px;font-weight:800;color:var(--primary-deep);max-width:480px;line-height:1.14;}
  .hero p{margin-top:10px;color:var(--ink-soft);max-width:460px;font-size:14.5px;line-height:1.55;}
  .hero-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;max-width:420px;}
  .hero-btn-primary{background:var(--rose);color:#fff;min-height:48px;padding:0 20px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;font-weight:600;box-shadow:0 10px 22px -12px rgba(188,53,92,0.55);transition:transform .12s ease;}
  .hero-btn-outline{text-decoration:none;min-height:44px;padding:0 20px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid var(--primary);color:var(--primary);background:transparent;font-size:14px;font-weight:600;}
  .hero-btn-primary:active{transform:scale(0.97);}
  .hero-btn-ghost{background:var(--surface-soft);color:var(--primary-deep);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;}
  .hero-btn-wa{color:var(--navy);min-height:44px;padding:0 6px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;}
  .load-more-btn{background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:15px 30px;border-radius:999px;font-size:15px;font-weight:800;box-shadow:0 14px 28px -12px rgba(188,53,92,0.55);display:inline-flex;align-items:center;gap:9px;transition:transform .12s ease, box-shadow .12s ease;animation:loadMorePulse 2.6s ease-in-out infinite;}
  .load-more-btn:active{transform:scale(0.96);}
  .load-more-btn .lm-chev{display:inline-flex;animation:loadMoreChev 1.4s ease-in-out infinite;}
  .load-more-wrap{text-align:center;padding:26px 0 8px;}
  .load-more-count{display:block;margin-top:9px;color:var(--ink-soft);font-size:12.5px;font-weight:600;}
  @keyframes loadMorePulse{0%,100%{box-shadow:0 14px 28px -12px rgba(188,53,92,0.55);}50%{box-shadow:0 16px 32px -10px rgba(188,53,92,0.8);}}
  @keyframes loadMoreChev{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
  @media(max-width:359px){
    .hero{padding:24px 14px 20px;}
    .hero-inner{padding:20px 16px;border-radius:16px;}
    .hero h1{font-size:22px;}
    .hero p{font-size:13.5px;}
    .hero-btn-primary{font-size:14px;}
  }

  /* ===== TRUST BAR ===== */
  .trust-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 12px;border-bottom:1px solid var(--border);max-width:640px;margin:0 auto;}
  .trust-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:11px;line-height:1.25;font-weight:600;color:var(--ink-soft);}
  .trust-item .ic{display:flex;color:var(--primary);}
  .trust-item .ic svg{width:20px;height:20px;}

  /* ===== QUÉ BUSCAS ===== */
  .needs-block{padding:30px 20px 6px;}
  .needs-row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .needs-row::-webkit-scrollbar{display:none;}
  .need-pill{flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--primary-deep);padding:12px 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;text-decoration:none;}
  .need-pill:hover{border-color:var(--primary);}
  .need-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ===== GENERIC SECTION ===== */
  .section-block{padding:32px 20px 6px;}
  .section-heading{font-family:var(--font-heading);font-size:20px;font-weight:800;color:var(--primary-deep);margin:0;}
  .section-sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .section-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;}

  /* ===== CATEGORY CHIPS ===== */
  .cats{display:flex;gap:8px;overflow-x:auto;padding:26px 36px 6px 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;padding:10px 16px;min-height:40px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);font-size:13.5px;font-weight:600;white-space:nowrap;}
  .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ===== PRODUCT GRID / CARD ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 16px 8px;}
  @media(min-width:400px){.grid{gap:16px;padding:16px 20px 8px;}}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:visible;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease;cursor:pointer;}
  .card:hover{box-shadow:var(--shadow-sm);}
  .card:active{transform:scale(0.98);}
  .card-media{position:relative;}
  .card-image-wrap{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius-card) var(--radius-card) 0 0;background:linear-gradient(135deg,var(--surface-soft),var(--border));}
  .card-image-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-image-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;}
  .badge-row{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:9.5px;font-weight:700;padding:5px 9px;border-radius:7px;letter-spacing:0.02em;color:#fff;}
  .badge-stock{background:#FFF0F0;color:#D32F2F;font-size:10px;font-weight:600;border:1px solid #F7D2D2;}
  .badge-best{background:var(--amber);color:#3a2200;}
  .card-add{margin-top:8px;width:100%;height:38px;border-radius:8px;background:var(--rose);color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .12s ease;}
  .card-add:active{transform:scale(.97);}
  .card-add:disabled{background:var(--surface-soft);color:var(--ink-soft);cursor:not-allowed;}
  .card-add.alt{background:transparent;color:var(--rose);border:1.5px solid var(--rose);}
  .wishlist-fab{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.9);color:var(--rose);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.18);}
  .card-body{padding:12px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card-cat{min-width:0;font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
  .load-error-box{margin:16px 20px 0;padding:18px;border-radius:14px;background:#FDEBD3;color:#7a4a12;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:14px;}
  .load-error-box button{margin-top:6px;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;}
  .cart-item-loading .cart-item-swatch{background:var(--surface-soft,#f4ece8);animation:cdlpPulse 1.2s ease-in-out infinite;}
  @keyframes cdlpPulse{0%,100%{opacity:.5}50%{opacity:1}}
  .card-name{min-width:0;overflow-wrap:anywhere;word-break:break-word;font-size:14px;font-weight:700;line-height:1.3;font-family:var(--font-heading);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;}
  /* En celulares angostos la tarjeta mide ~130px: un nombre largo llegaba a 6 renglones. Se corta a 3
     con "…" (el nombre completo se ve al abrir el producto), igual que ya hace el punto de venta. */
  .card-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-price{font-weight:700;color:var(--primary);font-size:19px;margin-top:auto;padding-top:4px;line-height:1.2;}
  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;}
  .filter-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:var(--radius-pill);background:var(--surface);border:1.5px solid var(--border);color:var(--ink);font-size:13.5px;font-weight:600;}
  .filter-btn.on{border-color:var(--primary);color:var(--primary);}
  .filter-chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--radius-pill);background:var(--surface-soft);border:1px solid var(--border);color:var(--primary-deep);font-size:13px;font-weight:600;}
  .price-presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .price-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .price-inputs label{min-width:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .price-inputs input{width:100%;min-width:0;height:46px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--surface);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}

  /* ===== FIRST-TIME BAND ===== */
  .first-band{margin:34px 20px 6px;border-radius:20px;background:var(--surface);border:1.5px solid var(--primary);padding:24px 22px;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;}
  .first-band h3{font-size:19px;font-weight:800;max-width:340px;color:var(--primary);}
  .first-band p{margin-top:8px;font-size:13.5px;line-height:1.55;max-width:380px;color:var(--ink-soft);}
  .first-band .hero-btn-outline{margin-top:16px;display:inline-flex;gap:8px;padding:0 20px;border-color:var(--rose);color:var(--rose);}

  /* ===== CROSS-SELL SUGGESTION (carrito) ===== */
  .cross-sell-card{display:flex;align-items:center;gap:10px;background:var(--surface-soft);border:1px solid var(--border);border-radius:14px;padding:10px;margin-top:14px;}
  .cross-sell-swatch{width:48px;height:48px;border-radius:10px;flex-shrink:0;object-fit:cover;background:linear-gradient(135deg,var(--surface-soft),var(--border));}
  .cross-sell-info{flex:1;min-width:0;font-size:12.5px;line-height:1.4;}
  .cross-sell-info b{color:var(--primary-deep);}
  .cross-sell-add{flex-shrink:0;background:var(--primary);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;}

  /* ===== SUGERENCIAS GENÉRICAS DEL CARRITO ("también te puede interesar") ===== */
  .cart-suggestions{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .cart-suggestions-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em;}
  .cart-suggestions-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .cart-suggestions-row::-webkit-scrollbar{display:none;}
  .suggestion-card{flex-shrink:0;width:118px;cursor:pointer;display:flex;flex-direction:column;gap:4px;}
  .suggestion-swatch{width:118px;height:118px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--surface-soft),var(--border));}
  .suggestion-name{font-size:11.5px;font-weight:600;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .suggestion-price{font-size:12.5px;font-weight:800;color:var(--primary-deep);}
  .suggestion-add{width:100%;background:var(--surface-soft);border:1px solid var(--border);color:var(--primary-deep);padding:7px;border-radius:var(--radius-sm);font-size:11px;font-weight:700;margin-top:2px;}

  /* ===== PROMO BANNER ===== */
  .promo-banner{margin:0 20px 6px;border-radius:20px;overflow:hidden;background:var(--surface-soft);border:1px solid var(--border);display:flex;flex-direction:column;}
  @media(min-width:640px){.promo-banner{flex-direction:row;align-items:stretch;}}
  .promo-banner-img{width:100%;max-height:220px;object-fit:cover;display:block;}
  @media(min-width:640px){.promo-banner-img{width:38%;max-height:none;}}
  .promo-banner-body{padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .promo-banner-title{font-family:var(--font-heading);font-size:20px;font-weight:800;color:var(--rose);}
  .promo-banner-text{color:var(--ink-soft);font-size:13.5px;line-height:1.5;}
  .btn-promo{align-self:flex-start;margin-top:6px;background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;box-shadow:0 8px 18px -10px rgba(188,53,92,0.5);}

  /* ===== KITS ===== */
  .kits-row{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 20px 8px;}
  @media(min-width:640px){.kits-row{grid-template-columns:repeat(2,1fr);}}
  .kit-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;}
  .kit-thumb{width:64px;height:64px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--surface-soft),var(--border));display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px;color:#fff;}
  .kit-thumb img{width:100%;height:100%;object-fit:cover;}
  .kit-info{flex:1;min-width:0;}
  .kit-name{font-weight:700;font-size:14px;font-family:var(--font-heading);}
  .kit-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .kit-price{font-weight:800;color:var(--primary-deep);font-size:14.5px;margin-top:6px;}
  .kit-add{background:var(--primary);color:#fff;padding:9px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;flex-shrink:0;transition:transform .12s ease;}
  .kit-add:active{transform:scale(0.95);}

  /* ===== TESTIMONIALS ===== */
  .rating-line{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
  .testimonial-row{display:grid;grid-template-columns:1fr;gap:12px;padding:0 20px 6px;}
  @media(min-width:640px){.testimonial-row{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:980px){.testimonial-row{grid-template-columns:repeat(3,1fr);}}
  .faq-list{padding:0 20px;display:flex;flex-direction:column;gap:10px;}
  .faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .faq-question{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;text-align:left;font-weight:700;font-size:14.5px;color:var(--ink);background:none;border:none;cursor:pointer;}
  .faq-chevron{flex-shrink:0;color:var(--ink-soft);transition:transform .2s ease;}
  .faq-chevron.open{transform:rotate(180deg);}
  .faq-answer{padding:0 16px 16px;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .testimonial-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;color:var(--ink);line-height:1.5;}
  .testimonial-card .stars{color:var(--amber);font-size:12px;margin-bottom:6px;display:block;}
  .testimonial-card p{margin:0;}
  .testimonial-name{margin-top:10px;font-size:11.5px;color:var(--ink-soft);font-weight:700;}

  /* ===== DISCRETION BAND ===== */
  .discretion-band{margin:34px 20px 0;background:var(--navy);color:#fff;padding:26px 22px;border-radius:20px;}
  .discretion-inner{max-width:1160px;margin:0 auto;}
  .discretion-band h3{font-size:20px;font-weight:800;max-width:360px;text-align:left;}
  .discretion-band>.discretion-inner>p{margin-top:8px;color:#cfe3e8;font-size:13.5px;max-width:420px;line-height:1.55;text-align:left;}
  .discretion-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:18px;}
  @media(min-width:640px){.discretion-grid{grid-template-columns:repeat(2,1fr);gap:10px 24px;}}
  .discretion-item{display:flex;flex-direction:row;align-items:center;gap:12px;font-size:13.5px;color:#fff;text-align:left;min-height:44px;}
  .discretion-item .ic{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}

  /* ===== WHATSAPP CTA ===== */
  .newsletter-block{text-align:center;background:var(--surface-soft);border-radius:20px;margin:34px 20px 6px;padding:32px 20px;}
  .newsletter-block .section-heading{margin-bottom:8px;}
  .newsletter-text{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;max-width:360px;margin-left:auto;margin-right:auto;}

  /* ===== CART / CHECKOUT (unchanged behavior) ===== */
  .overlay{position:fixed;inset:0;background:rgba(43,22,32,0.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:400px;background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:calc(18px + env(safe-area-inset-top, 0px)) 20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .drawer-head h2{font-size:18px;color:var(--primary-deep);font-weight:700;}
  .close-x{background:none;color:var(--ink-soft);font-size:20px;line-height:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:-8px;}

  /* ===== FICHA DE PRODUCTO (GALERÍA) ===== */
  .drawer.drawer-detail{max-width:480px;}
  .detail-main-img-wrap{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface-soft);flex-shrink:0;touch-action:pan-y;}
  .detail-main-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .detail-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(43,22,32,0.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .detail-nav-btn.prev{left:10px;}
  .detail-nav-btn.next{right:10px;}
  .detail-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .detail-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.6);transition:width .15s ease;}
  .detail-dot.active{background:#fff;width:18px;border-radius:4px;}
  .detail-thumbs{display:flex;gap:8px;padding:10px 20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .detail-thumbs::-webkit-scrollbar{display:none;}
  .detail-thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;border:2px solid transparent;flex-shrink:0;padding:0;margin:0;}
  .detail-thumb.active{border-color:var(--primary);}
  .detail-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .detail-info{padding:6px 20px 16px;}
  .detail-cat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;letter-spacing:.04em;}
  .detail-name{font-size:19px;font-weight:800;font-family:var(--font-heading);color:var(--ink);margin:4px 0 8px;line-height:1.25;}
  .detail-price{font-size:20px;font-weight:800;color:var(--primary-deep);margin-bottom:4px;}
  .detail-stock{font-size:12px;font-weight:700;margin-bottom:14px;display:inline-flex;align-items:center;padding:4px 10px;border-radius:7px;}
  .detail-stock.ok{color:var(--green);background:#EAF3D8;}
  .detail-stock.low{color:#3a2200;background:var(--amber);}
  .detail-stock.out{color:var(--rose);background:#FBE2E6;}
  .detail-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap;}
  .detail-qty-row{display:flex;align-items:center;gap:12px;margin:16px 0 4px;}
  .drawer-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px;}
  .cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .cart-item-swatch{width:48px;height:48px;border-radius:10px;flex-shrink:0;object-fit:cover;}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-name{font-size:13.5px;font-weight:700;overflow-wrap:anywhere;word-break:break-word;}
  .cart-item-price{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .qty-row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;row-gap:4px;}
  .qty-btn{width:44px;height:44px;border-radius:8px;background:var(--surface-soft);color:var(--primary-deep);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qty-val{font-size:13px;font-weight:700;min-width:20px;text-align:center;}
  /* Antes el subtotal y "Quitar" vivían en la misma fila que los botones +/-, y en 320-375px
     ese grupo (dos botones de 44px + cantidad + precio + Quitar) ya no cabía: "Quitar" quedaba
     cortado fuera de la pantalla. Ahora van en su propia fila, siempre con su propio espacio. */
  .cart-item-bottom-row{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:4px;}
  .cart-item-subtotal{font-size:13px;font-weight:800;color:var(--primary-deep);}
  .remove-link{font-size:11.5px;color:var(--rose);font-weight:600;padding:8px 0 8px 10px;flex-shrink:0;}
  .drawer-foot{position:relative;z-index:5;background:var(--surface);padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--border);box-shadow:0 -8px 18px -14px rgba(0,0,0,.25);}
  .total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:800;margin-bottom:12px;color:var(--primary-deep);}
  .btn-primary{width:100%;background:var(--rose);color:#fff;padding:14px;min-height:52px;border-radius:8px;font-size:15px;font-weight:700;display:block;text-align:center;text-decoration:none;box-shadow:0 10px 22px -10px rgba(188,53,92,0.5);transition:transform .12s ease,opacity .12s ease;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{width:100%;background:var(--surface-soft);color:var(--primary-deep);padding:14px;min-height:48px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;margin-top:8px;transition:background .15s ease;}
  .btn-secondary:hover{background:#efd9d3;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input,.form-field textarea,.form-field select{width:100%;min-height:48px;padding:12px;border-radius:8px;border:1px solid #CCCCCC;font-size:16px;font-family:inherit;background:#FFFFFF;color:var(--ink);}
  .form-field input:focus,.form-field textarea:focus,.form-field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(153,52,119,.14);}
  .form-field textarea{resize:vertical;min-height:60px;}
  .note-box{background:var(--surface-soft);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-deep);color:#fff;padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;box-shadow:var(--shadow-md);}
  /* AVISOS APILADOS: varios avisos a la vez, sin taparse entre sí ni con "Deshacer" */
  .toast-stack{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 32px);max-width:480px;z-index:90;pointer-events:none;}
  .toast-stack .toast{position:static;transform:none;opacity:0;max-width:100%;text-align:center;overflow-wrap:anywhere;line-height:1.3;animation:toastIn .22s ease forwards;}
  .toast-stack .toast.show{opacity:1;transform:none;}
  .toast-stack .toast.out{animation:toastOut .22s ease forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(6px)}}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-family:var(--font-heading);text-align:center;padding:20px;}
  .age-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--primary-deep),var(--primary));}
  .age-gate-card{background:#fff;border-radius:20px;padding:32px 26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);}
  .age-gate-logo{max-width:120px;max-height:70px;object-fit:contain;margin-bottom:16px;}
  .age-gate-title{font-family:var(--font-heading);font-size:20px;font-weight:700;color:var(--primary-deep);margin-bottom:10px;}
  .age-gate-text{color:var(--ink-soft);font-size:14px;margin-bottom:22px;}
  .age-gate-actions{display:flex;flex-direction:column;gap:10px;}
  .success-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .success-card{background:#fff;border-radius:18px;padding:34px 26px;max-width:360px;text-align:center;}
  .success-card .mark{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
  .success-card h2{color:var(--primary-deep);font-size:19px;margin-bottom:8px;font-weight:700;}
  .success-card p{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin-bottom:18px;}

  /* ===== MOBILE STICKY CART BAR ===== */
  .mobile-cart-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--primary-deep);color:#fff;display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px -10px rgba(0,0,0,0.4);}
  .mobile-cart-bar.show{display:flex;}
  .mobile-cart-bar-info{display:flex;flex-direction:column;line-height:1.25;}
  .mobile-cart-bar-count{font-size:11px;color:#e9c9dc;}
  .mobile-cart-bar-total{font-size:16px;font-weight:800;}
  .mobile-cart-bar-btn{background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:12px 20px;min-height:44px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:700;flex-shrink:0;box-shadow:0 8px 18px -8px rgba(0,0,0,0.35);}
  .mobile-cart-spacer{height:0;}
  .mobile-cart-spacer.show{height:74px;}
  @media(min-width:640px){.mobile-cart-bar{display:none!important;}.mobile-cart-spacer{display:none;}}

  /* ===== FOOTER ===== */
  .site-foot{background:var(--primary-deep);color:#e9d3e0;margin-top:auto;padding:36px 20px 26px;}
  .site-foot-inner{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:24px;}
  @media(min-width:640px){.site-foot-inner{grid-template-columns:1.3fr 1fr 1fr;}}
  .foot-brand-name{color:#fff;font-family:var(--font-heading);font-size:17px;font-weight:700;}
  .foot-tagline{font-size:12.5px;color:#c99cba;margin-top:4px;}
  .foot-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#c99cba;font-weight:700;margin-bottom:10px;}
  .site-foot{line-height:1.6;}
  .foot-col div,.foot-col a{font-size:13.5px;line-height:1.6;color:#e9d3e0;display:flex;align-items:center;gap:6px;min-height:40px;text-decoration:none;}
  .foot-col div{min-height:0;margin-bottom:6px;}
  .foot-pay{max-width:1160px;margin:22px auto 0;padding-top:18px;border-top:1px solid rgba(255,255,255,0.12);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .foot-pay-label{font-size:11.5px;color:#c99cba;width:100%;}
  .pay-badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:11.5px;font-weight:600;}
  .pay-badge.seal{background:rgba(255,255,255,.18);}
  .foot-col a:hover{color:#fff;}
  .foot-bottom{max-width:1160px;margin:24px auto 0;padding-top:18px;border-top:1px solid rgba(255,255,255,0.12);font-size:11.5px;color:#a97f9d;}
  /* ===== FLUJO DE COMPRA: detalle, carrito, upsell, checkout, salida ===== */
  .detail-assure{margin-top:14px;border:1px solid var(--border);background:var(--surface-soft);border-radius:12px;padding:6px 14px;color:#2D2D2D;}
  .assure-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:13.5px;line-height:1.45;color:#2D2D2D;}
  .assure-row + .assure-row{border-top:1px solid var(--border);}
  .assure-row .ic{flex:0 0 20px;color:var(--primary);display:flex;padding-top:1px;}
  .cart-item .qty-btn{width:36px;height:36px;border-radius:8px;background:#F0F0F0;border:1px solid #D9D9D9;color:var(--ink);font-size:18px;font-weight:800;}
  .cart-item .qty-val{font-size:14px;color:var(--ink);min-width:24px;}
  .cross-sell-add,.suggestion-add{background:#fff;color:var(--rose);border:1px solid var(--rose);height:32px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .suggestion-add{width:100%;margin-top:4px;}
  .cross-sell-add:active,.suggestion-add:active{background:var(--rose);color:#fff;}
  .coupon-toggle{display:flex;align-items:center;gap:6px;min-height:44px;color:var(--primary);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;}
  .coupon-toggle .chev{transition:transform .15s ease;display:inline-flex;}
  .coupon-toggle.open .chev{transform:rotate(180deg);}
  .ship-badge{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;padding:7px 12px;border-radius:999px;background:var(--surface-soft);border:1px solid var(--border);color:#2D2D2D;font-size:12px;font-weight:600;line-height:1.35;}
  .btn-neutral{width:100%;min-height:48px;margin-top:8px;border-radius:8px;border:1.5px solid #CCCCCC;background:transparent;color:#444;font-size:14.5px;font-weight:600;text-align:center;}
  .btn-link{display:block;width:100%;min-height:44px;margin-top:4px;background:none;color:var(--ink-soft);font-size:14px;font-weight:600;text-align:center;text-decoration:underline;text-underline-offset:3px;}
  .reminder-row{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:var(--surface);border:1px solid var(--border);}
  .reminder-row .r-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;}
  .reminder-row .r-price{font-weight:700;color:var(--primary);font-size:14px;margin-top:2px;}
  .reminder-add{flex:0 0 auto;height:38px;padding:0 14px;border-radius:8px;background:var(--rose);color:#fff;font-size:13px;font-weight:700;}
  .ck-pills{display:flex;flex-direction:column;gap:2px;margin-bottom:16px;padding:8px 14px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--border);}
  .ck-pill{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12.5px;line-height:1.4;color:#2D2D2D;}
  .ck-pill .ic{flex:0 0 16px;color:var(--primary);padding-top:1px;display:flex;}
  .ck-check{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink);margin-top:12px;min-height:44px;}
  .ck-check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--rose);}
  .abandon-opt{display:block;width:100%;min-height:48px;padding:12px 14px;margin-bottom:8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--ink);font-size:14px;font-weight:600;line-height:1.35;text-align:left;white-space:normal;}
  .abandon-opt:active{border-color:var(--primary);}
  .abandon-skip{display:block;width:100%;padding:12px;margin-top:4px;background:none;color:#666666;font-size:14px;text-align:center;text-decoration:underline;text-underline-offset:3px;}
  .coupon-apply{flex:0 0 auto;height:48px;padding:0 16px;border-radius:8px;border:1.5px solid var(--rose);color:var(--rose);background:#fff;font-size:14px;font-weight:700;}

  /* ===== Pantalla de carga con siluetas ===== */
  .sk{background:linear-gradient(90deg,#ECE6EA 25%,#F7F3F6 37%,#ECE6EA 63%);background-size:400% 100%;animation:skShimmer 1.4s ease infinite;border-radius:10px;}
  @keyframes skShimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
  @media(prefers-reduced-motion:reduce){.sk{animation:none;}}
  .sk-top{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid #EFE9ED;}
  .sk-wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px;}
  .sk-hero{height:210px;margin:16px 0;border-radius:14px;}
  .sk-chips{display:flex;gap:8px;overflow:hidden;margin-bottom:16px;}
  .sk-chip{height:34px;width:92px;border-radius:999px;flex:none;}
  .sk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  @media(min-width:640px){.sk-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media(min-width:960px){.sk-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
  .sk-card{background:#fff;border-radius:12px;padding:8px;}
  .sk-img{aspect-ratio:1/1;width:100%;}
  .sk-l1{height:14px;margin:10px 0 6px;width:85%;}
  .sk-l2{height:14px;width:50%;}
  .sk-btn{height:40px;margin-top:10px;}
  /* ===== Búsqueda sin resultados ===== */
  .noresults{text-align:center;padding:34px 12px 26px;max-width:520px;margin:0 auto;}
  .noresults .nr-ico{width:54px;height:54px;border-radius:50%;background:#F5E4EA;color:var(--rose);display:inline-flex;align-items:center;justify-content:center;}
  .noresults h3{font-family:var(--font-heading);font-size:20px;line-height:1.25;margin:14px 0 8px;color:var(--ink);word-break:break-word;}
  .noresults p{color:var(--ink-soft);font-size:15px;line-height:1.5;margin:0 0 18px;}
  .noresults .hero-btn-primary{width:100%;text-decoration:none;gap:8px;}
  .nr-sub{margin:24px 0 10px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .nr-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}

  /* ===== Barra de anuncio superior (editable en Diseño → Barra de anuncio) ===== */

/* ============== REGISTRO DE ERRORES DEL SISTEMA ==============
   Si algo truena sin que nadie lo esté viendo (un error de JavaScript no capturado, una promesa
   rechazada), se guarda automáticamente en Firestore para que Ale lo pueda ver después en el
   panel — en vez de perderse solo en la consola del navegador de quien lo vivió. Con un tope por
   sesión para no inundar la base de datos si algo entra en bucle de errores. */
let systemErrorsLoggedThisSession = 0;
const SYSTEM_ERROR_LOG_LIMIT = 5;
function logSystemError(message, stack){
  if(systemErrorsLoggedThisSession >= SYSTEM_ERROR_LOG_LIMIT) return;
  systemErrorsLoggedThisSession++;
  try{
    db.collection('systemErrors').add({
      message: String(message||'Error desconocido').slice(0,500),
      stack: String(stack||'').slice(0,2000),
      source: 'index',
      page: location.pathname + location.search,
      userAgent: (navigator.userAgent||'').slice(0,300),
      date: new Date().toISOString(),
    }).catch(()=>{});
  }catch(e){}
}
window.addEventListener('error', (ev)=>{ logSystemError(ev.message, ev.error && ev.error.stack ? ev.error.stack : ''); });
window.addEventListener('unhandledrejection', (ev)=>{
  const r = ev.reason;
  logSystemError(r && r.message ? r.message : String(r), r && r.stack ? r.stack : '');
});

// Folio consecutivo compartido con el Punto de Venta: cada pedido/venta obtiene
// un número único e incremental (#0001, #0002, ...) sin importar de dónde venga.
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}
function formatFolio(n){ return n ? '#' + String(n).padStart(4,'0') : ''; }

  // Mismo texto por defecto que en admin.html (DEFAULT_SETTINGS.privacyPolicyText) — se repite

  // por admin.html. Así el enlace "Leer el aviso completo" funciona con algo real desde el

  privacyPolicyText: `AVISO DE PRIVACIDAD

La Casa de los Placeres, con domicilio en Ciudad Guzmán, Jalisco, México, es responsable del uso y protección de tus datos personales conforme a la Ley Federal de Protección de Datos Personales en Posesión de los Particulares.

¿Qué datos recabamos?
Para procesar tu pedido te pedimos únicamente: nombre, número de WhatsApp o teléfono, dirección de entrega y, si lo indicas, notas adicionales para la entrega. No te pedimos datos de tarjetas ni información bancaria a través de este catálogo: el pago se acuerda directamente contigo al momento de la entrega o por el medio que hayamos hablado por WhatsApp.

Al marcar la casilla de aceptación antes de confirmar tu pedido, declaras que leíste y aceptas este aviso de privacidad.`,
  // Mismo texto por defecto que en admin.html (DEFAULT_SETTINGS.returnPolicyText), por la misma

/* ============== PERSISTENCIA DEL CARRITO ==============
   Antes el carrito solo vivía en memoria: un refresh accidental, cerrar la pestaña, o que el
   celular descargue la pestaña en segundo plano lo borraba por completo sin ningún aviso. Ahora
   se guarda en este mismo celular/navegador (igual que el perfil y la lista de deseos) y se
   restaura solo al volver a entrar. Si algún producto del carrito guardado ya no existe o aún no
   cargó, simplemente no se muestra hasta que el catálogo completo esté disponible (parseCartKey
   ya maneja eso) — no se cae la página. */
const CART_STORAGE_KEY = 'cdlp_cart';
function loadStoredCart(){
  try{
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return (parsed && typeof parsed==='object' && !Array.isArray(parsed)) ? parsed : {};
  }catch(e){ return {}; }
}
function saveCart(){
  try{ localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(state.cart)); }catch(e){ /* almacenamiento no disponible, se ignora */ }
}

let state = { products:[], settings:{...DEFAULT_SETTINGS}, orderCount:0, cart: loadStoredCart(), activeCat:"Todos", activeNeed:null, activeBestSellers:false, searchQuery:"", searchOpen:false, cartOpen:false, checkoutOpen:false, profileOpen:false, profileDraft:null, orderPlaced:false, loaded:false, loadError:false, catalogIncomplete:false, detailProductId:null, detailImageIndex:0, detailSelectedVariant:{}, lastOrderNumber:null, gridRenderLimit:20, submittingOrder:false, couponInput:"", appliedCoupon:null, couponError:"", messageDrawerOpen:false, sendingMessage:false, messageSent:false, messageDraft:{name:'',phone:'',type:'pregunta',text:''}, checkoutReminderOpen:false, checkoutReminderShown:false, openFaqIndex:null, notifySent:{}, notifyName:'', notifyPhone:'', fullCatalogLoaded:false, wishlistOpen:false, compareIds:[], compareOpen:false, cartAbandonSurveyOpen:false, cartAbandonSurveyShown:false, priceMin:'', priceMax:'', privacyPolicyOpen:false, priceFilterOpen:false, couponOpen:false, quizOpen:false, quizStep:0, quizAnswers:{need:null,cat:null,budget:null}, zoomOpen:false, zoomPct:100 };

async function loadData(attempt){
  attempt = attempt || 1;
  try{
    const [prodSnap, setSnap, counterSnap] = await Promise.all([
      db.collection('products').orderBy('name').limit(40).get(),
      db.collection('settings').doc('store').get(),
      db.collection('counters').doc('orders').get(),
    ]);
    // "counters/orders" es de lectura pública (lo usa también el checkout para sacar el
    // folio) y se incrementa en cada pedido de la tienda y cada venta del Punto de Venta,
    // así que sirve como número real de pedidos para el rating-line, sin exponer ningún
    // dato de pedidos individuales (eso sigue protegido detrás del permiso "pedidos").
    state.orderCount = counterSnap.exists ? Math.max(0, (counterSnap.data().next||1) - 1) : 0;
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>!p.hidden && !p.deletedAt);
    state.settings = setSnap.exists ? {...DEFAULT_SETTINGS, ...setSnap.data()} : {...DEFAULT_SETTINGS};
    if(!state.settings.categories || !state.settings.categories.length) state.settings.categories = [...DEFAULT_CATEGORIES];
    if(!state.settings.hiddenCategories) state.settings.hiddenCategories = [];
    if(!state.settings.needs || !state.settings.needs.length) state.settings.needs = JSON.parse(JSON.stringify(DEFAULT_NEEDS));
    if(!state.settings.sections || !state.settings.sections.length) state.settings.sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
    if(!state.settings.promoBanner) state.settings.promoBanner = {title:"",text:"",image:"",buttonText:"",buttonLink:""};
    if(!state.settings.featuredProductIds) state.settings.featuredProductIds = [];
    if(!state.settings.testimonials) state.settings.testimonials = [];
    if(!state.settings.wholesaleTiers) state.settings.wholesaleTiers = [];
    if(!state.settings.coupons) state.settings.coupons = [];
    if(!state.settings.promotions) state.settings.promotions = [];
    if(!state.settings.theme) state.settings.theme = {};
  }catch(e){
    console.error(e);
    // Antes esta primera carga se intentaba UNA sola vez: con señal débil o en el navegador
    // interno de WhatsApp/Instagram, un solo tropiezo dejaba la tienda sin productos (y por lo
    // mismo sin sugerencias en el carrito, y con el carrito viéndose vacío). Ahora reintenta.
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, 1500*attempt));
      return loadData(attempt+1);
    }
    state.products = []; state.settings = {...DEFAULT_SETTINGS}; state.loadError = true;
  }
  state.loaded = true;
  captureWholesaleCodeFromURL();
  captureKioskModeFromURL();
  captureCampaignFromURL();
  render();
  const cssTag = document.getElementById('custom-css-injected');
  if(cssTag) cssTag.textContent = state.settings.customCss || '';
  applyThemeVars();
  trackVisit();
  openProductFromURL();
  if(!state.loadError) loadSavedCartProducts();
  // En segundo plano, sin bloquear la primera pantalla: trae el resto del catálogo completo
  // (arriba solo se cargaron los primeros 40, para que la primera pantalla aparezca rápido).
  // Antes, si esto fallaba (señal débil, la app pasó a segundo plano, etc.) no se reintentaba
  // ni se avisaba nada — la persona se quedaba viendo solo esos 40 productos (los primeros en
  // orden alfabético) para siempre, sin enterarse. Si por casualidad ninguno de esos 40 coincidía
  // con la categoría que tenía abierta, o con nada relacionado a lo que llevaba en el carrito,
  // se sentía como si "no hubiera productos" o "no aparecieran sugerencias" — cuando en realidad
  // sí existían, solo que no habían terminado de cargar. Ahora si falla, reintenta solo unas
  // cuantas veces, y si de plano no puede, avisa con un botón para intentar de nuevo a mano.
  if(!state.loadError) loadFullCatalogWithRetry();
}
// Enlace directo a un producto (ej. compartido por WhatsApp): ?producto=ID en la URL. Si ese
// producto no viene entre los primeros 40 que se cargaron de entrada, se trae solo, sin esperar
// a que termine de bajar el catálogo completo — así el enlace abre rápido sin importar qué tan
// grande sea el catálogo. Antes no existía forma de mandar a alguien directo a un producto: todo
// enlace compartido caía en la página principal y la persona tenía que buscarlo desde cero.
// También soporta ?categoria=NombreDeCategoria, para compartir el catálogo ya filtrado a una
// categoría completa (ej. "todo lo de Ropa femenina") en vez de un solo producto.
async function openProductFromURL(){
  const params = new URLSearchParams(location.search);
  const id = params.get('producto');
  const catParam = params.get('categoria');
  if(catParam){
    const url = new URL(location.href); url.searchParams.delete('categoria');
    history.replaceState(history.state, '', url.toString());
    const match = visibleCategories().find(c=>c.toLowerCase()===catParam.toLowerCase());
    if(match) goToCatalog(match);
    else showToast('Esa categoría ya no está disponible');
  }
  if(!id) return;
  let p = state.products.find(x=>x.id===id);
  if(!p){
    try{
      const doc = await db.collection('products').doc(id).get();
      if(doc.exists && !doc.data().deletedAt){
        p = {id: doc.id, ...doc.data()};
        if(!state.products.find(x=>x.id===p.id)) state.products.push(p);
      }
    }catch(e){ console.error('No se pudo cargar el producto del enlace directo', e); }
  }
  const url = new URL(location.href); url.searchParams.delete('producto');
  history.replaceState(history.state, '', url.toString());
  if(p && !p.hidden){ openProductDetail(p.id); }
  else { showToast('Ese producto ya no está disponible'); }
}
// Lo que la persona ya tenía en su carrito o en favoritos (guardado en su teléfono) se trae
// de inmediato, sin esperar al catálogo completo: antes, si esos productos no venían entre los
// primeros 40 (en orden alfabético), el carrito se veía VACÍO al recargar o al regresar de
// contestar un WhatsApp, hasta que terminaba de bajar todo — y con señal lenta parecía borrado.
async function loadSavedCartProducts(){
  const ids = new Set([
    ...Object.keys(state.cart).map(k=>k.split('::')[0]),
    ...loadWishlist(),
  ]);
  const missing = [...ids].filter(id=>id && !state.products.some(p=>p.id===id));
  if(!missing.length) return;
  try{
    const docs = await Promise.all(missing.map(id=>db.collection('products').doc(id).get().catch(()=>null)));
    let added = 0;
    docs.forEach(d=>{
      if(!d || !d.exists) return;
      const data = d.data();
      if(data.hidden || data.deletedAt) return;
      if(!state.products.some(p=>p.id===d.id)){ state.products.push({id:d.id, ...data}); added++; }
    });
    if(added) render();
  }catch(e){ console.error('No se pudieron traer los productos del carrito', e); }
}
// Cuando ya está el catálogo completo, lo que siga en el carrito sin existir (se ocultó o se
// eliminó desde el admin) se quita del carrito con aviso, en vez de quedarse "fantasma" sumando
// piezas al contador sin verse en ningún lado.
function pruneUnavailableCartItems(){
  const gone = Object.keys(state.cart).filter(k=>!parseCartKey(k).p);
  if(!gone.length) return;
  gone.forEach(k=>delete state.cart[k]);
  saveCart();
  showToast(gone.length===1 ? 'Un producto de tu carrito ya no está disponible' : `${gone.length} productos de tu carrito ya no están disponibles`);
}
async function loadFullCatalogWithRetry(attempt){
  attempt = attempt || 1;
  try{
    const fullSnap = await db.collection('products').orderBy('name').get();
    state.products = fullSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>!p.hidden && !p.deletedAt);
    state.catalogIncomplete = false; state.fullCatalogLoaded = true;
    pruneUnavailableCartItems();
    render();
  }catch(e){
    console.error(`No se pudo completar el catálogo en segundo plano (intento ${attempt})`, e);
    if(attempt < 3){
      setTimeout(()=>loadFullCatalogWithRetry(attempt+1), 2000*attempt);
    } else {
      state.catalogIncomplete = true;
      render();
    }
  }
}
/* ============== CAMPAÑAS (?ref=nombre) ==============
   Un enlace como .../index.html?ref=instagram-bio marca de dónde llegó la persona. La visita se
   guarda con esa campaña, y si compra dentro de 30 días (aunque vuelva otro día), el pedido
   también queda marcado — así el admin ve visitas, pedidos y ventas por campaña (Estadísticas →
   Campañas). Se limpia de la URL para que, si la persona comparte el enlace, no arrastre la marca. */
const CAMPAIGN_KEY = 'cdlp_campaign', CAMPAIGN_SESSION_KEY = 'cdlp_campaign_session', CAMPAIGN_DAYS = 30;
function campaignSlug(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}
function captureCampaignFromURL(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('ref') != null ? params.get('ref') : params.get('utm_campaign');
  if(raw==null) return;
  const slug = campaignSlug(raw);
  if(slug){
    try{ localStorage.setItem(CAMPAIGN_KEY, JSON.stringify({c:slug, t:Date.now()})); }catch(e){}
    try{ sessionStorage.setItem(CAMPAIGN_SESSION_KEY, slug); }catch(e){}
  }
  const url = new URL(location.href); url.searchParams.delete('ref'); url.searchParams.delete('utm_campaign');
  history.replaceState(history.state, '', url.toString());
}
function sessionCampaign(){ try{ return sessionStorage.getItem(CAMPAIGN_SESSION_KEY) || ''; }catch(e){ return ''; } }
function activeCampaign(){
  try{
    const o = JSON.parse(localStorage.getItem(CAMPAIGN_KEY)||'null');
    if(o && o.c && Date.now()-o.t < CAMPAIGN_DAYS*86400000) return o.c;
  }catch(e){}
  return '';
}
function trackVisit(){
  try{ const camp = sessionCampaign(); db.collection('visits').add(Object.assign({date: new Date().toISOString(), source: trafficSourceBucket()}, camp?{campaign:camp}:{})); }catch(e){ /* silencioso */ }
}
/* ============== ANALÍTICA: eventos de embudo (vistas de producto, agregar al carrito, inicio de checkout) ==============
   Se guardan en una colección aparte ('analyticsEvents') en vez de 'visits' para no
   inflar esa colección (el admin la trae con límite de 3000 documentos, y mezclar
   eventos de alta frecuencia ahí reduciría la ventana de tiempo que cubre ese límite). */
function trafficSourceBucket(){
  try{
    const ref = document.referrer;
    if(!ref) return 'directo';
    const host = new URL(ref).hostname.replace(/^www\./,'');
    if(/google\./.test(host)) return 'google';
    if(/facebook\.|instagram\.|fb\.com/.test(host)) return 'meta';
    if(/whatsapp\./.test(host)) return 'whatsapp';
    if(/tiktok\./.test(host)) return 'tiktok';
    if(host === location.hostname) return 'directo';
    return host || 'otro';
  }catch(e){ return 'directo'; }
}
function trackEvent(type, extra){
  try{ db.collection('analyticsEvents').add(Object.assign({type, date:new Date().toISOString()}, extra||{})); }catch(e){ /* silencioso */ }
}

/* ============== BORRADOR DE CARRITO (para recuperación por WhatsApp desde el admin) ==============
   En cuanto el cliente escribió su nombre y teléfono en el checkout (y tiene productos en el
   carrito), se guarda un borrador en "abandonedCarts" (un documento por teléfono, se sobreescribe
   con cada cambio). Si completa el pedido, ese borrador se borra. Si lo abandona, el admin puede
   verlo en Pedidos → "Carritos abandonados" y escribirle por WhatsApp. Todo silencioso: nunca debe
   interrumpir el checkout si falla. */
let abandonedCartTimer = null;
function scheduleAbandonedCartSave(){
  clearTimeout(abandonedCartTimer);
  abandonedCartTimer = setTimeout(saveAbandonedCartDraft, 1500);
}
function saveAbandonedCartDraft(){
  try{
    const nameEl = document.getElementById('ck-name'), phoneEl = document.getElementById('ck-phone');
    const addressEl = document.getElementById('ck-address'), notesEl = document.getElementById('ck-notes');
    if(!nameEl || !phoneEl) return;
    const name = nameEl.value.trim(), phone = phoneEl.value.trim();
    const address = addressEl ? addressEl.value.trim() : '', notes = notesEl ? notesEl.value.trim() : '';
    const phoneDigits = phone.replace(/\D/g,'');
    if(!name || phoneDigits.length<8 || cartCount()===0) return;
    const items = Object.entries(state.cart).map(([key,qty])=>{
      const {p,v} = parseCartKey(key);
      if(!p) return null;
      const price = v && v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p);
      return {id:p.id, name: p.name + (v?` (${variantLabel(v)})`:''), price, qty};
    }).filter(Boolean);
    if(!items.length) return;
    db.collection('abandonedCarts').doc(phoneDigits).set({
      name, phone, address, notes, items, total: cartTotal(),
      updatedAt: new Date().toISOString(), completed:false
    });
  }catch(e){ /* silencioso, no debe interrumpir el checkout */ }
}
function clearAbandonedCartDraft(phone){
  try{
    const phoneDigits = (phone||'').replace(/\D/g,'');
    if(phoneDigits) db.collection('abandonedCarts').doc(phoneDigits).delete();
  }catch(e){ /* silencioso */ }
}

/* ============== ENCUESTA RÁPIDA AL ABANDONAR EL CARRITO ==============
   Si el cliente cierra el carrito (la X o tocando fuera) mientras todavía tiene productos
   adentro — es decir, se va sin pasar a pagar — se le pregunta una sola vez por sesión, con
   opciones de un clic, por qué no completó su pedido. Es opcional (se puede cerrar sin
   responder) y nunca vuelve a aparecer en la misma sesión, para no ser invasivos. Las respuestas
   se guardan en Firestore para que el admin las revise en conjunto. */
const CART_ABANDON_REASONS = [
  'Los precios me parecieron altos',
  'Solo estaba viendo, sin intención de compra todavía',
  'El costo o tiempo de envío no me convenció',

  'Otro motivo',
];
function closeCartDrawer(){
  const hadItems = cartCount() > 0;
  state.cartOpen = false;
  if(hadItems && !state.cartAbandonSurveyShown && state.settings.cartAbandonSurveyEnabled!==false){
    state.cartAbandonSurveyShown = true;
    state.cartAbandonSurveyOpen = true;
  }
  render();
}
function submitCartAbandonSurvey(reason){
  try{
    db.collection('cartAbandonSurveys').add({
      reason, cartTotal: cartTotal(), itemCount: cartCount(), date: new Date().toISOString()
    });
  }catch(e){ /* silencioso, no debe interrumpir la navegación */ }
  state.cartAbandonSurveyOpen = false;
  showToast('Gracias por tu respuesta');
  render();
}
function dismissCartAbandonSurvey(){ state.cartAbandonSurveyOpen = false; render(); }
function renderCartAbandonSurveyDrawer(){
  return `
    <div class="drawer-head"><h2>Antes de irte…</h2><button class="close-x" onclick="dismissCartAbandonSurvey()">${icon('x')}</button></div>
    <div class="drawer-body">
      <div class="panel-sub" style="margin-bottom:14px;">Dejaste productos en tu carrito. ¿Nos dices por qué no completaste tu pedido? Nos ayuda a mejorar.</div>
      ${CART_ABANDON_REASONS.map(r=>`<button class="abandon-opt" onclick="submitCartAbandonSurvey('${r.replace(/'/g,"\\'")}')">${r}</button>`).join('')}
      <button class="abandon-skip" onclick="dismissCartAbandonSurvey()">No, gracias</button>
    </div>`;
}
