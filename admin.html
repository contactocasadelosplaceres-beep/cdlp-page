function tolMatch(q, ...fields){
  const toks = searchClean(q).split(' ').filter(Boolean);
  if(!toks.length) return true;
  const hay = ' ' + fields.map(searchClean).join(' ') + ' ';
  const hayDigits = fields.map(f=>String(f==null?'':f).replace(/\D/g,'')).join(' ');
  return toks.every(t=> hay.includes(t) || (/^\d{3,}$/.test(t) && hayDigits.includes(t)) || (t.length>=5 && hay.split(' ').some(w=>w.length>=4 && (withinOneEdit(w,t)||withinOneEdit(w.slice(0,t.length),t)))));
}
async function logAdminAction(action, targetType, targetName, details, targetId){
  try{
    await db.collection('adminAuditLog').add({
      action, targetType, targetName: targetName||'', details: details||'', targetId: targetId||null,
      userEmail: state.user ? state.user.email : '', date: new Date().toISOString(),
    });
  }catch(e){ console.error('No se pudo registrar en la bitácora', e); }
}
async function updateOrderStatus(id,status,fromUndo){
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const prevStatus = o.status;
  o.status=status;
  await saveOrdersStatus(id,status,o.source);
  if(o.source!=='pos' && prevStatus!==status) await syncOnlineOrderStock(o, status);
  if(status==='Cancelado' && prevStatus!=='Cancelado'){
    logAdminAction('cancelacion', o.source==='pos'?'venta':'pedido', formatFolio(o.orderNumber), `Total: ${money(o.total)}`);
  }
  // Cancelar una venta de Punto de Venta debe devolver al inventario lo que esa venta había
  // descontado al momento de cobrarse — si no, ese stock se pierde para siempre. Los pedidos
  // de la tienda en línea NUNCA descuentan stock al crearse (Ale lo ajusta a mano al
  // prepararlos), así que ahí cancelar no tiene nada que restaurar.
  if(o.source==='pos' && prevStatus!==status){
    if(status==='Cancelado' && prevStatus!=='Cancelado') await adjustStockForSale(o, 1);
    else if(prevStatus==='Cancelado' && status!=='Cancelado') await adjustStockForSale(o, -1);
  }
  render();
  if(status==='Cancelado' && prevStatus!=='Cancelado' && !fromUndo){
    showUndo(`${o.source==='pos'?'Venta':'Pedido'} ${formatFolio(o.orderNumber)} cancelado`, ()=>updateOrderStatus(id, prevStatus, true));
  } else if(status==='Entregado' && prevStatus!=='Entregado' && o.source!=='pos' && orderPayState(o)!=='pagado' && !fromUndo){
    showUndo(`${formatFolio(o.orderNumber)} entregado. ¿Ya cobraste?`, ()=>setOrderPayment(id,{paymentStatus:'pagado'}), 9000, 'Marcar pagado');
  }
}
// sign=1 restaura stock (venta cancelada); sign=-1 lo vuelve a descontar (venta reactivada
// desde "Cancelado" a cualquier otro estado). Refleja exactamente el descuento que hace
// chargeSale() en pos.html: por variante (v.stock + p.stock) o por centro (stockByCenter + p.stock).
// Lo ya devuelto por el cliente (sale.returns) ya movió su propio inventario: al cancelar o reactivar
// el pedido solo se ajusta lo que NO se devolvió, para no restaurar dos veces la misma pieza.
function saleItemsNetOfReturns(sale){
  const ret = {}; (sale.returns||[]).forEach(r=>(r.items||[]).forEach(i=>{ ret[i.idx] = (ret[i.idx]||0) + (i.qty||0); }));
  return (sale.items||[]).map((it,idx)=>({...it, qty: Math.max(0,(it.qty||0)-(ret[idx]||0))})).filter(it=>it.qty>0);
}
async function adjustStockForSale(sale, sign, opts){
  opts = opts || {};
  const isOnline = opts.kind==='tienda';
  const short = [];
  const centerId = sale.centerId;
  const updates = [];
  const touchedComponentIds = [];
  (opts.itemsOverride || saleItemsNetOfReturns(sale)).forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    const p = state.products.find(x=>x.id===it.id);
    if(!p) return;
    logStockMovement(p.id, opts.logType || (isOnline ? (sign>0?'cancelacion_tienda':'pedido_tienda') : (sign>0?'cancelacion_pos':'reactivacion_pos')), sign*it.qty, opts.logNote || `${isOnline?'Pedido':'Venta'} ${formatFolio(sale.orderNumber)}`, centerId||null);
    if(p.isKit){
      // Un kit no tiene stock propio por centro: cancelar/reactivar su venta ajusta a cada uno
      // de sus productos componentes, igual que se descontaron al venderse (ver chargeSale).
      (p.kitItems||[]).forEach(ki=>{
        const comp = state.products.find(x=>x.id===ki.productId);
        if(!comp) return;
        if(!comp.stockByCenter) comp.stockByCenter = {};
        if(sign<0 && centerId && (comp.stockByCenter[centerId]||0) + sign*(ki.qty||1)*it.qty < 0) short.push(comp.name);
        if(centerId) comp.stockByCenter[centerId] = Math.max(0, (comp.stockByCenter[centerId]||0) + sign*(ki.qty||1)*it.qty);
        comp.stock = totalStock(comp);
        touchedComponentIds.push(comp.id);
        const compUpd = {stockByCenter: comp.stockByCenter, stock: comp.stock};
        if(sign<0 && comp.batches && comp.batches.length){ comp.batches = fefoConsume(comp.batches, (ki.qty||1)*it.qty); comp.expirationDate = earliestExpiry(comp.batches); compUpd.batches = comp.batches; compUpd.expirationDate = comp.expirationDate; }
        updates.push(db.collection('products').doc(comp.id).update(compUpd));
      });
    } else if(it.variantId){
      const v = (p.variants||[]).find(x=>x.id===it.variantId);
      const vcid = centerId || defaultCenterId();
      if(sign<0 && v && vCenterStock(v, vcid) + sign*it.qty < 0) short.push(`${p.name}`);
      if(v) vSetCenterStock(v, vcid, vCenterStock(v, vcid) + sign*it.qty);
      vProductSync(p);
      const varUpd = {variants: p.variants, stock: p.stock, stockByCenter: p.stockByCenter};
      if(sign<0 && p.batches && p.batches.length){ p.batches = fefoConsume(p.batches, it.qty); p.expirationDate = earliestExpiry(p.batches); varUpd.batches = p.batches; varUpd.expirationDate = p.expirationDate; }
      updates.push(db.collection('products').doc(p.id).update(varUpd));
    } else {
      if(!p.stockByCenter) p.stockByCenter = {};
      if(sign<0 && (centerId ? (p.stockByCenter[centerId]||0) : (p.stock||0)) + sign*it.qty < 0) short.push(p.name);
      if(centerId) p.stockByCenter[centerId] = Math.max(0, (p.stockByCenter[centerId]||0) + sign*it.qty);
      p.stock = Math.max(0, (p.stock||0) + sign*it.qty);
      const plainUpd = {stockByCenter: p.stockByCenter, stock: p.stock};
      if(sign<0 && p.batches && p.batches.length){ p.batches = fefoConsume(p.batches, it.qty); p.expirationDate = earliestExpiry(p.batches); plainUpd.batches = p.batches; plainUpd.expirationDate = p.expirationDate; }
      updates.push(db.collection('products').doc(p.id).update(plainUpd));
      touchedComponentIds.push(p.id);
    }
  });
  if(!updates.length) return {ok:true, short};
  try{
    await Promise.all(updates);
    if(touchedComponentIds.length) await recomputeKitStocksFor(touchedComponentIds);
    if(!isOnline) showToast(sign>0 ? 'Inventario restaurado' : 'Inventario descontado de nuevo');
    return {ok:true, short};
  }
  catch(e){ console.error('No se pudo ajustar el inventario de esta venta', e); showToast('No se pudo ajustar el inventario de esta venta'); return {ok:false, short}; }
}
/* ============== INVENTARIO AUTOMÁTICO EN PEDIDOS DE LA TIENDA ==============
   Opcional (Configuración → Datos operativos). Al pasar un pedido de la tienda a "En camino" o
   "Entregado" se descuenta del centro principal; si vuelve atrás o se cancela, se devuelve.
   "stockDeducted" evita descontar dos veces el mismo pedido. */
/* Pedidos de la tienda: el inventario se descuenta cuando el pedido se marca "Entregado" (una sola vez,
   "stockDeducted") y se devuelve si el pedido sale de "Entregado" (regresa a otro estado, se cancela o se
   elimina). Las ventas del POS descuentan al cobrar (ver chargeSale en pos.html). */
const ONLINE_DEDUCT_STATUSES = ['Entregado'];
function autoDeductOnlineOn(){ return state.settings.autoDeductOnlineStock !== false; }
function defaultCenterId(){ return (state.centers.find(c=>c.isDefault)||state.centers[0]||{}).id || null; }
async function syncOnlineOrderStock(o, newStatus){
  if(!o || o.source==='pos') return;
  const should = ONLINE_DEDUCT_STATUSES.includes(newStatus);
  try{
    if(should && !o.stockDeducted && autoDeductOnlineOn()){
      const cid = defaultCenterId();
      const r = await adjustStockForSale({...o, centerId:cid}, -1, {kind:'tienda'});
      if(r && r.ok===false) return;
      o.stockDeducted = true; o.stockCenterId = cid;
      await db.collection('orders').doc(o.id).update({stockDeducted:true, stockCenterId:cid||null});
      const uniq = [...new Set((r&&r.short)||[])];
      showToast(uniq.length ? `Inventario descontado. Se quedó en 0: ${uniq.slice(0,2).join(', ')}${uniq.length>2?'…':''}` : 'Inventario descontado');
    } else if(!should && o.stockDeducted){
      const r = await adjustStockForSale({...o, centerId:o.stockCenterId||defaultCenterId()}, 1, {kind:'tienda'});
      if(r && r.ok===false) return;
      o.stockDeducted = false;
      await db.collection('orders').doc(o.id).update({stockDeducted:false});
      showToast('Inventario devuelto');
    }
  }catch(e){ console.error(e); showToast('No se pudo ajustar el inventario del pedido'); }
}

/* ============== PAGO DEL PEDIDO (tienda) ==============
   Los pedidos de la tienda se cobran contra entrega, pero también hay transferencias y tarjeta
   coordinadas por WhatsApp: aquí queda anotado si ya se cobró, cómo, y qué falta conciliar. */
const PAYMENT_STATUS_LABELS = {pendiente:'Pendiente', por_conciliar:'Por conciliar', pagado:'Pagado'};
function orderPayState(o){ return (o && o.paymentStatus) || 'pendiente'; }
function orderIsUnpaidDelivered(o){ return o.source!=='pos' && !o.archived && o.status==='Entregado' && orderPayState(o)!=='pagado'; }
function snapshotOrderFields(o, keys){ const s={}; keys.forEach(k=>{ s[k] = (o[k]&&typeof o[k]==='object') ? JSON.parse(JSON.stringify(o[k])) : o[k]; }); return s; }
async function restoreOrderFields(id, snap, msg){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const del = firebase.firestore.FieldValue.delete();
  const payload = {};
  Object.keys(snap).forEach(k=>{ payload[k] = snap[k]===undefined ? del : snap[k]; });
  await db.collection('orders').doc(id).update(payload);
  Object.keys(snap).forEach(k=>{ if(snap[k]===undefined) delete o[k]; else o[k]=snap[k]; });
  if(msg) showToast(msg);
  render();
}
async function setOrderPayment(id, patch, quiet){
  const o = state.orders.find(x=>x.id===id); if(!o || o.source==='pos') return;
  const keys = ['paymentStatus','paymentMethod','paidAt'];
  const prev = snapshotOrderFields(o, keys);
  const del = firebase.firestore.FieldValue.delete();
  const upd = {...patch};
  const newStatus = patch.paymentStatus || orderPayState(o);
  if(patch.paymentStatus==='pagado'){ upd.paidAt = o.paidAt || new Date().toISOString(); if(!patch.paymentMethod && !o.paymentMethod) upd.paymentMethod = 'Efectivo'; }
  else if(patch.paymentStatus){ upd.paidAt = del; }
  try{
    await db.collection('orders').doc(id).update(upd);
    Object.keys(upd).forEach(k=>{ if(upd[k]===del) delete o[k]; else o[k]=upd[k]; });
    render();
    if(!quiet) showUndo(newStatus==='pagado' ? `Pedido ${formatFolio(o.orderNumber)} marcado como pagado` : 'Pago actualizado', ()=>restoreOrderFields(id, prev, 'Pago restaurado'));
  }catch(e){ console.error(e); showToast('No se pudo guardar el pago'); }
}
function renderOrderPaymentBox(o){
  const st = orderPayState(o);
  const m = o.paymentMethod || '';
  return `<div class="pay-box">
    <div class="row-title">Pago</div>
    <div class="row-sub" style="margin-top:6px;">Estado</div>
    <div class="pay-seg">${Object.keys(PAYMENT_STATUS_LABELS).map(k=>`<button type="button" class="${st===k?'on':''}" onclick="setOrderPayment('${o.id}',{paymentStatus:'${k}'})">${PAYMENT_STATUS_LABELS[k]}</button>`).join('')}</div>
    <div class="row-sub">Cómo pagó</div>
    <div class="pay-seg" style="margin-bottom:4px;">${PAY_METHODS.map(x=>`<button type="button" class="${m===x?'on':''}" onclick="setOrderPayment('${o.id}',{paymentMethod:'${x}'})">${x}</button>`).join('')}</div>
    ${o.paidAt ? `<div class="row-sub">Cobrado el ${new Date(o.paidAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
    ${o.stockDeducted ? `<div class="row-sub" style="margin-top:4px;">${icon('package',12)} Inventario ya descontado de este pedido</div>` : ''}
  </div>`;
}

/* ============== PEDIDO NO RECIBIDO O RECHAZADO ==============
   Marca por qué no se pudo entregar. El pedido pasa a "Cancelado" (el inventario se devuelve solo
   si ya se había descontado) y queda guardado en el pedido para avisar si ese teléfono vuelve a
   pedir: sale "Revisar" con el motivo, igual que otras señales de riesgo. */
const FAIL_REASONS = {rechazado:'Rechazó el pedido', no_estaba:'No estaba en casa', no_contesto:'No contestó', direccion:'Dirección incorrecta o no se encontró', otro:'Otro motivo'};
function openFailModal(id){ state.orderActionsMenu=null; state.failModal={id, reason:'rechazado', note:''}; render(); }
function closeFailModal(){ state.failModal=null; render(); }
function phoneFailureCount(phone, exceptId){
  const k = riskPhoneKey(phone); if(!k) return 0;
  const ex = state.orders.find(x=>x.id===exceptId);
  return Math.max(0, (riskIndex().fails[k]||0) - (ex && ex.deliveryFailure && riskPhoneKey(ex.phone)===k ? 1 : 0));
}
function renderFailModal(){
  const m = state.failModal; if(!m) return '';
  const o = state.orders.find(x=>x.id===m.id); if(!o) return '';
  return `<div class="modal-overlay"><div class="modal" style="max-width:460px;">
    <h3>No se pudo entregar</h3>
    <div class="panel-sub" style="margin:-8px 0 8px;">${formatFolio(o.orderNumber)} · ${escDescHtml(o.customer||'Cliente')}</div>
    <div class="note-box" style="margin-bottom:6px;">El pedido pasará a <strong>Cancelado</strong> y, si ya se había descontado, el inventario se devuelve. Si este teléfono vuelve a pedir, te saldrá un aviso.</div>
    <div class="fail-reasons">${Object.keys(FAIL_REASONS).map(k=>`<label class="${m.reason===k?'on':''}"><input type="radio" name="fail-reason" ${m.reason===k?'checked':''} onchange="state.failModal.reason='${k}';render()"> ${FAIL_REASONS[k]}</label>`).join('')}</div>
    <div class="form-field"><label>Nota (opcional)</label><input id="fail-note" type="text" placeholder="Ej. dijo que ya no lo quería" value="${escDescHtml(m.note||'')}" oninput="state.failModal.note=this.value"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeFailModal()">Cancelar</button>
      <button class="btn-primary" style="background:#BC355C;" onclick="saveDeliveryFailure()">Marcar como no entregado</button>
    </div>
  </div></div>`;
}
async function saveDeliveryFailure(){
  const m = state.failModal; if(!m) return;
  const o = state.orders.find(x=>x.id===m.id); if(!o) return;
  const failure = {reason:m.reason, note:(m.note||'').trim(), date:new Date().toISOString(), by: state.user ? state.user.email : ''};
  const prevStatus = o.status;
  try{ await db.collection('orders').doc(o.id).update({deliveryFailure:failure}); }
  catch(e){ console.error(e); showToast('No se pudo guardar'); return; }
  o.deliveryFailure = failure; state.failModal = null;
  await updateOrderStatus(o.id, 'Cancelado', true);
  logAdminAction('entrega_fallida', 'pedido', formatFolio(o.orderNumber), `${FAIL_REASONS[failure.reason]||failure.reason}${failure.note?' — '+failure.note:''}`);
  showUndo(`Marcado como no entregado: ${FAIL_REASONS[failure.reason]||failure.reason}`, async()=>{
    await db.collection('orders').doc(o.id).update({deliveryFailure: firebase.firestore.FieldValue.delete()});
    delete o.deliveryFailure;
    await updateOrderStatus(o.id, prevStatus, true);
  }, 10000);
}
async function clearDeliveryFailure(id){
  const o = state.orders.find(x=>x.id===id); if(!o || !o.deliveryFailure) return;
  const prev = snapshotOrderFields(o, ['deliveryFailure']);
  await db.collection('orders').doc(id).update({deliveryFailure: firebase.firestore.FieldValue.delete()});
  delete o.deliveryFailure; render();
  showUndo('Se quitó la marca de entrega fallida', ()=>restoreOrderFields(id, prev, 'Marca restaurada'));
}
function failureTagHtml(o, withBtn){
  const f = o.deliveryFailure; if(!f) return '';
  return `<div class="order-fail-tag">${icon('alert-triangle',12)} <span>No recibido: ${escDescHtml(FAIL_REASONS[f.reason]||f.reason)}${f.note?' · '+escDescHtml(f.note):''}</span>${withBtn?`<button type="button" class="btn-outline" style="width:auto;min-height:28px;padding:0 10px;font-size:11.5px;" onclick="clearDeliveryFailure('${o.id}')">Quitar marca</button>`:''}</div>`;
}
async function toggleArchiveOrder(id,archived,silent,fromUndo){ const o=state.orders.find(x=>x.id===id); if(!o) return; o.archived=archived; await saveOrderArchived(id,archived,o.source); if(!silent){ render(); if(archived && !fromUndo) showUndo('Pedido archivado', ()=>toggleArchiveOrder(id,false,false,true)); else showToast(archived?'Pedido archivado':'Pedido restaurado'); } }
async function saveSettingsForm(s){ state.settings={...state.settings,...s}; await saveSettings(); showToast('Configuración guardada'); render(); }

/* ============== USUARIOS Y NOTIFICACIONES (antes "Cajeros") ============== */
async function saveCashierForm(){
  const name = document.getElementById('cash-name').value.trim();
  const email = document.getElementById('cash-email').value.trim();
  const role = document.getElementById('cash-role').value;
  const pin = document.getElementById('cash-pin').value.trim();
  if(!name){ showToast('Ponle un nombre'); return; }
  if(role==='cajero' && !pin){ showToast('Los cajeros necesitan un PIN para el Punto de Venta'); return; }
  if(role==='colaborador' && !email){ showToast('Los colaboradores necesitan el correo con el que van a iniciar sesión'); return; }
  if(role==='colaborador' && (state.user.email||'').trim().toLowerCase()===email.trim().toLowerCase()){ showToast('No puedes usar tu propio correo — te quedarías sin acceso completo'); return; }
  const notify = state.cashierModal.notify || {};
  const permissions = role==='colaborador' ? (state.cashierModal.permissions||{}) : {};
  const existing = state.cashierModal.id ? state.cashiers.find(c=>c.id===state.cashierModal.id) : null;
  const oldEmail = existing ? existing.email : null;
  const c = existing ? {...existing, name, email, role, pin, notify, permissions} : {name, email, role, pin, notify, permissions, active:true};
  await saveCashierDoc(c);
  // El acceso real siempre lo decide "staffPermissions", no la lista de cajeros: si el
  // rol dejó de ser "colaborador" o se cambió el correo, hay que revocar el correo anterior.
  await syncStaffPermissions(role==='colaborador' ? email : '', role==='colaborador' ? permissions : {}, oldEmail);
  if(!existing){
    logAdminAction('alta_personal', 'persona', name, role==='colaborador' ? `Colaborador · ${email}` : 'Cajero');
  }else if(role==='colaborador'){
    const changed = permissionsDiffSummary(existing.permissions||{}, permissions);
    if(changed) logAdminAction('cambio_permisos', 'persona', name, changed);
  }
  if(!existing) state.cashiers.push(c);
  else Object.assign(existing, {name, email, role, pin, notify, permissions});
  if(state.user && (state.user.email||'').trim().toLowerCase()===(email||'').trim().toLowerCase()) computeMyPermissions();
  state.cashierModal=null; showToast('Guardado'); render();
}
function permissionsDiffSummary(oldPerms, newPerms){
  const changes = [];
  PERMISSION_DEFS.forEach(def=>{
    const before = !!oldPerms[def.key], after = !!newPerms[def.key];
    if(before !== after) changes.push(`${def.label.split(' (')[0]}: ${before?'sí':'no'}→${after?'sí':'no'}`);
  });
  return changes.join(', ');
}
async function toggleCashierActive(id){
  const c = state.cashiers.find(x=>x.id===id); if(!c) return;
  c.active = !c.active; await saveCashierDoc(c);
  // Desactivar a un colaborador debe revocar su acceso real de inmediato, no solo la
  // etiqueta visual — si no, su cuenta de Firebase seguiría entrando con sus permisos viejos.
  if(c.role==='colaborador') await syncStaffPermissions(c.active ? c.email : '', c.active ? (c.permissions||{}) : {}, c.active ? null : c.email);
  logAdminAction(c.active?'activacion_personal':'desactivacion_personal', 'persona', c.name);
  computeMyPermissions(); render();
}
async function deleteCashier(id){
  const c = state.cashiers.find(x=>x.id===id);
  try{
    await deleteCashierDoc(id);
    // Igual que al desactivar: si era colaborador, hay que revocarle el acceso real,
    // no solo quitarlo de esta lista.
    if(c && c.role==='colaborador' && c.email) await syncStaffPermissions('', {}, c.email);
    if(c) logAdminAction('eliminacion_personal', 'persona', c.name);
    state.cashiers = state.cashiers.filter(c=>c.id!==id);
    showToast('Eliminado'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }
}

  };

async function sendAiTestMessage(){
  const input = document.getElementById('ai-chat-input');
  const text = input ? input.value.trim() : state.aiChatInput.trim();
  if(!text || !state.aiSettings.apiKey){ showToast('Escribe un mensaje y guarda tu API key primero'); return; }
  state.aiChatLog.push({role:'user', text});
  state.aiChatInput=''; state.aiSending=true; render();
  try{
    let replyText = '';
    if(state.aiSettings.provider==='anthropic'){
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{ 'content-type':'application/json', 'x-api-key': state.aiSettings.apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model: state.aiSettings.model || 'claude-sonnet-5', max_tokens: 500, system: state.aiSettings.systemPrompt, messages: [{role:'user', content: text}] }),
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      replyText = (data.content||[]).map(b=>b.text||'').join('\n');
    }else{
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST',
        headers:{ 'content-type':'application/json', 'Authorization': 'Bearer '+state.aiSettings.apiKey },
        body: JSON.stringify({ model: state.aiSettings.model || 'gpt-4o-mini', messages: [{role:'system', content: state.aiSettings.systemPrompt},{role:'user', content: text}] }),
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      replyText = data.choices[0].message.content;
    }
    state.aiChatLog.push({role:'assistant', text: replyText});
  }catch(e){
    console.error(e);
    state.aiChatLog.push({role:'assistant', text: 'Error al conectar con la IA: '+e.message});
  }
  state.aiSending=false; render();
}

/* ============== DESCRIPCIONES CON IA (ficha de producto) ==============
   Usa la misma clave de "Configuración → Asistente IA". La IA solo PROPONE un texto: se muestra
   en una vista previa y nada cambia hasta que la persona pulsa "Usar este texto". Solo se le
   manda nombre, categorías, para quién es y variantes — nunca costos, precios ni datos de clientes. */
const AI_DESC_TONES = [
  {key:'calido',   label:'Cálido y sugerente', hint:'Tono cálido, elegante y sugerente, sin ser explícito.'},
  {key:'directo',  label:'Claro y directo',    hint:'Tono claro, directo e informativo: qué es y para qué sirve.'},
  {key:'divertido',label:'Divertido y ligero', hint:'Tono divertido, cómplice y ligero, sin groserías.'},
];
async function callAI(system, userText, maxTokens){
  const a = state.aiSettings;
  if(!a.apiKey) throw new Error('Primero guarda tu API key en Configuración → Asistente IA.');
  if(a.provider==='anthropic'){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key': a.apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model: a.model || 'claude-sonnet-5', max_tokens: maxTokens||500, system, messages:[{role:'user', content:userText}] }),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    return (data.content||[]).map(b=>b.text||'').join('\n').trim();
  }
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'Authorization':'Bearer '+a.apiKey },
    body: JSON.stringify({ model: a.model || 'gpt-4o-mini', max_tokens: maxTokens||500, messages:[{role:'system', content:system},{role:'user', content:userText}] }),
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return String(data.choices[0].message.content||'').trim();
}
function aiDescState(){
  const p = state.productModal; const key = p ? (p.id||'nuevo') : '';
  if(!state.aiDesc || state.aiDesc.key!==key) state.aiDesc = {key, tone:'calido', loading:false, result:'', error:''};
  return state.aiDesc;
}
function aiDescBoxHtml(){
  if(!state.productModal) return '';
  const st = aiDescState();
  const hasDesc = !!(state.productModal.desc||'').trim();
  const btnLabel = hasDesc ? 'Mejorar con IA' : 'Redactar con IA';
  const noKey = !state.aiSettings.apiKey;
  return `
    <div class="ai-desc-bar">
      <select aria-label="Tono de la descripción" onchange="aiDescState().tone=this.value">
        ${AI_DESC_TONES.map(t=>`<option value="${t.key}" ${st.tone===t.key?'selected':''}>${t.label}</option>`).join('')}
      </select>
      <button type="button" class="btn-tertiary" onclick="aiDescGenerate()" ${st.loading?'disabled':''}>${icon('star',13)} ${st.loading?'Escribiendo…':btnLabel}</button>
    </div>
    ${noKey ? `<div class="row-sub" style="margin-top:6px;">Para usar esto conecta tu clave en Configuración → Asistente IA.</div>` : ''}
    ${st.error ? `<div class="ai-desc-err">${escDescHtml(st.error)}</div>` : ''}
    ${st.result ? `
      <div class="ai-desc-preview">
        <div class="row-sub" style="font-weight:700;color:var(--primary-deep);margin-bottom:4px;">Propuesta de la IA — revísala antes de usarla</div>
        <div class="ai-desc-text">${escDescHtml(st.result)}</div>
        <div class="ai-desc-actions">
          <button type="button" class="btn-primary" onclick="aiDescUse()">Usar este texto</button>
          <button type="button" class="btn-tertiary" onclick="aiDescGenerate()" ${st.loading?'disabled':''}>Otra versión</button>
          <button type="button" class="btn-tertiary" onclick="aiDescDiscard()">Descartar</button>
        </div>
      </div>` : ''}`;
}
function paintAiDescBox(){
  const el = document.getElementById('ai-desc-box');
  if(el) el.innerHTML = aiDescBoxHtml();
}
async function aiDescGenerate(){
  const p = state.productModal; if(!p) return;
  const st = aiDescState();
  if(st.loading) return;
  const name = (p.name||'').trim();
  if(!name){ st.error='Escribe primero el nombre del producto.'; paintAiDescBox(); return; }
  const tone = AI_DESC_TONES.find(t=>t.key===st.tone) || AI_DESC_TONES[0];
  const needLabels = (p.needs||[]).map(k=>{ const n=(state.settings.needs||DEFAULT_NEEDS).find(x=>x.key===k); return n?n.label:''; }).filter(Boolean);
  const variants = (p.variants||[]).map(v=>{ try{ return variantLabel(v); }catch(e){ return ''; } }).filter(Boolean);
  const current = (p.desc||'').trim();
  const system = `Eres redactor de fichas de producto de "${state.settings.storeName||'una tienda'}", una tienda en línea de bienestar íntimo para adultos en México.
Reglas:
- Español de México, trato de "tú", ${tone.hint}
- Entre 35 y 70 palabras, en un solo párrafo, sin viñetas, sin emojis y sin comillas.
- Elegante y respetuoso: nada explícito, vulgar ni gráfico.
- No prometas resultados médicos, curas ni garantías.
- No inventes medidas, materiales, potencia, baterías ni funciones que no aparezcan en los datos; si no los sabes, habla de forma general.
- Responde SOLO con el texto de la descripción.`;
  const user = [
    `Producto: ${name}`,
    prodCats(p).length ? `Categorías: ${prodCats(p).join(', ')}` : '',
    needLabels.length ? `Pensado para: ${needLabels.join(', ')}` : '',
    variants.length ? `Variantes: ${variants.join(', ')}` : '',
    current ? `Descripción actual (mejórala conservando los datos que da):\n${current}` : 'No tiene descripción todavía: escríbela desde cero.',
  ].filter(Boolean).join('\n');
  st.loading = true; st.error = ''; paintAiDescBox();
  try{
    let out = await callAI(system, user, 400);
    out = out.replace(/^["“”\s]+|["“”\s]+$/g,'');
    if(!out) throw new Error('La IA no devolvió texto, intenta de nuevo.');
    st.result = out;
  }catch(e){
    console.error(e);
    st.error = 'No se pudo generar: ' + (e.message||'error desconocido');
  }
  st.loading = false; paintAiDescBox();
}
function aiDescUse(){
  const st = aiDescState(); const p = state.productModal;
  if(!p || !st.result) return;
  p.desc = st.result;
  const ta = document.getElementById('pf-desc'); if(ta) ta.value = st.result;
  st.result = ''; st.error = '';
  paintAiDescBox();
  showToast('Descripción aplicada — recuerda guardar el producto');
}
function aiDescDiscard(){ const st = aiDescState(); st.result=''; st.error=''; paintAiDescBox(); }

const CROP_SIZE = 280, CROP_OUT = 700;
let cropCtx = null;
function clampCropOffsets(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const dw = cropCtx.natW*scale, dh = cropCtx.natH*scale;
  cropCtx.offX = Math.min(0, Math.max(CROP_SIZE-dw, cropCtx.offX));
  cropCtx.offY = Math.min(0, Math.max(CROP_SIZE-dh, cropCtx.offY));
}
function updateCropImgTransform(){
  const el = document.getElementById('crop-img'); if(!el || !cropCtx) return;
  const scale = cropCtx.baseScale*cropCtx.zoom;
  el.style.width = (cropCtx.natW*scale)+'px';
  el.style.height = (cropCtx.natH*scale)+'px';
  el.style.transform = `translate(${cropCtx.offX}px, ${cropCtx.offY}px)`;
}
function handleImageFileSelected(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const baseScale = CROP_SIZE/Math.min(img.naturalWidth, img.naturalHeight);
      cropCtx = { img, natW:img.naturalWidth, natH:img.naturalHeight, zoom:1, baseScale, offX:0, offY:0 };
      cropCtx.offX = (CROP_SIZE - cropCtx.natW*baseScale)/2;
      cropCtx.offY = (CROP_SIZE - cropCtx.natH*baseScale)/2;
      clampCropOffsets();
      state.cropOpen = true; render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function cropPointerDown(e){
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.dragging = true; cropCtx.startX = pt.clientX; cropCtx.startY = pt.clientY;
  cropCtx.startOffX = cropCtx.offX; cropCtx.startOffY = cropCtx.offY;
}
function cropPointerMove(e){
  if(!cropCtx || !cropCtx.dragging) return;
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.offX = cropCtx.startOffX + (pt.clientX - cropCtx.startX);
  cropCtx.offY = cropCtx.startOffY + (pt.clientY - cropCtx.startY);
  clampCropOffsets();
  updateCropImgTransform();
}
function cropPointerUp(){ if(cropCtx) cropCtx.dragging = false; }
document.addEventListener('mousemove', cropPointerMove);
document.addEventListener('mouseup', cropPointerUp);
document.addEventListener('touchmove', cropPointerMove, {passive:false});
document.addEventListener('touchend', cropPointerUp);
function cropSetZoom(val){
  if(!cropCtx) return;
  cropCtx.zoom = parseFloat(val);
  clampCropOffsets(); updateCropImgTransform();
}
const MAX_IMG_BYTES = 90*1024; // peso máximo por imagen — más ajustado que antes para que el catálogo pese bastante menos en total, sin recurrir a un servicio de imágenes aparte
function dataUrlBytes(dataUrl){
  const b64 = dataUrl.slice(dataUrl.indexOf(',')+1);
  const len = b64.length;
  const padding = b64.endsWith('==') ? 2 : (b64.endsWith('=') ? 1 : 0);
  return Math.floor(len*3/4) - padding;
}
// Prueba calidades de mayor a menor hasta que el JPEG resultante quepa en maxBytes.
// Devuelve null si ni la calidad más baja alcanza (entonces hay que reducir resolución).
function canvasToLimitedJpeg(canvas, maxBytes){
  const qualities = [0.85,0.8,0.75,0.7,0.65,0.6,0.55,0.5,0.45,0.4,0.35,0.3,0.25,0.2];
  for(const q of qualities){
    const url = canvas.toDataURL('image/jpeg', q);
    if(dataUrlBytes(url) <= maxBytes) return url;
  }
  return null;
}
// "Aligerar fotos ya guardadas": recorre las fotos que ya están en tus productos y, a las que
// pesan más de lo necesario (por ejemplo, subidas antes de este ajuste), las vuelve a comprimir
// con el mismo tope nuevo — sin volver a pedirte que las recortes, solo achicando el archivo.
function scanForRecompress(){
  const candidates = [];
  state.products.forEach(p=>{
    (p.images||[]).forEach((img,idx)=>{
      if(typeof img==='string' && img.startsWith('data:image')){
        const bytes = dataUrlBytes(img);
        if(bytes > MAX_IMG_BYTES) candidates.push({productId:p.id, productName:p.name, imageIndex:idx, originalBytes:bytes});
      }
    });
  });
  state.recompressCandidates = candidates;
  state.recompressScanning = false;
  render();
}

function recompressOneImage(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const size = Math.min(img.width, img.height, CROP_OUT); // nunca agranda, solo achica o deja igual
      const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, size, size);
      let out = canvasToLimitedJpeg(canvas, MAX_IMG_BYTES);
      if(!out){
        const canvas2 = document.createElement('canvas'); canvas2.width=300; canvas2.height=300;
        const ctx2 = canvas2.getContext('2d');
        ctx2.fillStyle='#ffffff'; ctx2.fillRect(0,0,300,300);
        ctx2.drawImage(img,0,0,img.width,img.height,0,0,300,300);
        out = canvas2.toDataURL('image/jpeg', 0.3);
      }
      resolve(out);
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}
async function applyRecompress(){
  state.recompressProcessing = true; state.recompressProgress = 0; render();
  let savedBytes = 0, fixedCount = 0;
  const byProduct = {};
  state.recompressCandidates.forEach(c=>{ (byProduct[c.productId]=byProduct[c.productId]||[]).push(c); });
  const productIds = Object.keys(byProduct);
  for(let i=0;i<productIds.length;i++){
    const pid = productIds[i];
    const p = state.products.find(x=>x.id===pid);
    if(p){
      for(const c of byProduct[pid]){
        const original = p.images[c.imageIndex];
        if(!original) continue;
        const newUrl = await recompressOneImage(original);
        if(newUrl){
          const newBytes = dataUrlBytes(newUrl);
          if(newBytes < c.originalBytes){
            savedBytes += (c.originalBytes - newBytes);
            p.images[c.imageIndex] = newUrl;
            fixedCount++;
          }
        }
      }
      try{ await db.collection('products').doc(pid).update({images: p.images}); }
      catch(e){ console.error('No se pudo guardar', pid, e); }
    }
    state.recompressProgress = i+1; render();
  }
  state.recompressProcessing = false;
  state.recompressResult = { count: fixedCount, savedMB: (savedBytes/1024/1024).toFixed(1), products: productIds.length };
  render();
}
function renderRecompressModal(){
  const cands = state.recompressCandidates||[];
  const byProduct = {}; cands.forEach(c=>{ (byProduct[c.productId]=byProduct[c.productId]||[]).push(c); });
  const productCount = Object.keys(byProduct).length;
  const totalOriginalMB = (cands.reduce((s,c)=>s+c.originalBytes,0)/1024/1024).toFixed(1);
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:480px;">
      <h3>Aligerar fotos ya guardadas</h3>
      ${state.recompressScanning ? `<div class="empty-state">Buscando fotos pesadas…</div>` :
        state.recompressResult ? `
          <div class="note-box" style="color:var(--green);">Listo: se aligeraron ${state.recompressResult.count} foto(s) en ${state.recompressResult.products} producto(s), ahorrando ~${state.recompressResult.savedMB} MB en total.</div>
        ` : cands.length===0 ? `
          <div class="empty-state">Todas tus fotos ya están dentro del peso ideal — no hay nada que aligerar.</div>
        ` : `
          <div class="note-box">Se encontraron ${cands.length} foto(s) en ${productCount} producto(s) más pesadas de lo necesario (suman ~${totalOriginalMB} MB). Se van a achicar un poco en tamaño y calidad — se siguen viendo bien, solo pesan menos. Puede tardar varios minutos según cuántas sean; no cierres esta ventana mientras corre.</div>
        `}
      <div class="modal-actions">
        <button class="btn-cancel" ${state.recompressProcessing?'disabled':''} onclick="closeRecompressTool()">Cerrar</button>
        ${!state.recompressScanning && !state.recompressResult && cands.length>0 ? `<button class="btn-primary" style="flex:1;" ${state.recompressProcessing?'disabled':''} onclick="applyRecompress()">${state.recompressProcessing?`Aligerando… ${state.recompressProgress}/${productCount}`:'Aligerar ahora'}</button>` : ''}
      </div>
    </div>
  </div>`;
}
function applyCrop(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const sx = -cropCtx.offX/scale, sy = -cropCtx.offY/scale, ssize = CROP_SIZE/scale;
  // Primero se intenta con la resolución normal (700x700) bajando la calidad; solo si una imagen
  // muy detallada no cabe ni en la calidad más baja, se reduce el tamaño y se repite.
  // Se rellena el canvas de blanco antes de dibujar: el formato de salida es JPEG (sin canal
  // alfa), así que si la foto original tiene fondo transparente (PNG), sin este relleno esas
  // zonas se verían negras en vez de blancas al exportar.
  let outSize = CROP_OUT, dataUrl = null;
  while(outSize >= 300 && !dataUrl){
    const canvas = document.createElement('canvas'); canvas.width=outSize; canvas.height=outSize;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,outSize,outSize);
    ctx.drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, outSize, outSize);
    dataUrl = canvasToLimitedJpeg(canvas, MAX_IMG_BYTES);
    if(!dataUrl) outSize = Math.round(outSize*0.85);
  }
  if(!dataUrl){
    // último recurso (imagen extremadamente compleja): tamaño mínimo, calidad mínima, se acepta lo que salga
    const canvas = document.createElement('canvas'); canvas.width=300; canvas.height=300;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,300,300);
    ctx.drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, 300, 300);
    dataUrl = canvas.toDataURL('image/jpeg', 0.2);
  }
  if(!state.productModal.images) state.productModal.images = [];
  if(state.productModal.images.length>=10){ showToast('Máximo 10 imágenes por producto'); }
  else state.productModal.images.push(dataUrl);
  state.cropOpen = false; cropCtx = null; render();
}
function removeImage(idx){
  state.productModal.images.splice(idx,1);
  (state.productModal.variants||[]).forEach(v=>{ if(typeof v.imageIdx==='number'){ if(v.imageIdx===idx) delete v.imageIdx; else if(v.imageIdx>idx) v.imageIdx--; } });
  render();
}
function moveImage(idx,dir){
  const arr = state.productModal.images;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  (state.productModal.variants||[]).forEach(v=>{ if(v.imageIdx===idx) v.imageIdx=j; else if(v.imageIdx===j) v.imageIdx=idx; });
  render();
}

// llamando resetShowMore(key) cuando cambia el filtro/búsqueda que la alimenta.
const SHOW_MORE_PAGE_SIZE = 20;
function showMoreSlice(key, items, pageSize){
  pageSize = pageSize || SHOW_MORE_PAGE_SIZE;
  if(state[key]==null) state[key] = pageSize;
  return { shown: items.slice(0, state[key]), remaining: Math.max(0, items.length - state[key]) };

function renderShowMoreButton(key, remaining, pageSize){

/* ============== MÉTRICAS ============== */
function computeMetrics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const cancelled = state.orders.filter(o=>o.status==='Cancelado');
  const totalRevenue = valid.reduce((s,o)=>s+o.total,0);
  const avgOrder = valid.length ? totalRevenue/valid.length : 0;
  const avgItems = valid.length ? valid.reduce((s,o)=>s+o.items.reduce((a,it)=>a+it.qty,0),0)/valid.length : 0;
  const pendingNuevo = state.orders.filter(o=>o.status==='Nuevo').length;
  const pendingPreparando = state.orders.filter(o=>o.status==='Preparando').length;
  const pendingCamino = state.orders.filter(o=>o.status==='En camino').length;
  const pending = pendingNuevo + pendingPreparando + pendingCamino;
  const lowStock = state.products.filter(p=>p.stock<=(p.lowStockThreshold>0?p.lowStockThreshold:3));
  const cancelRate = state.orders.length ? Math.round((cancelled.length/state.orders.length)*100) : 0;

  const byPhone = {};
  state.orders.forEach(o=>{ if(!o.phone) return; (byPhone[o.phone] = byPhone[o.phone]||[]).push(o); });
  const uniqueCustomers = Object.keys(byPhone).length;
  const repeatCustomers = Object.values(byPhone).filter(list=>list.length>1).length;
  const repeatRate = uniqueCustomers ? Math.round((repeatCustomers/uniqueCustomers)*100) : 0;
  const topCustomers = Object.entries(byPhone).map(([phone,list])=>({
    phone, name:list[0].customer, spend: list.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0), count:list.length
  })).sort((a,b)=>b.spend-a.spend).slice(0,5);

  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const dayRevenue = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=d && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: rev}; });

  const months = []; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-i); months.push(d); }
  const monthRevenue = months.map((m,idx)=>{
    const next = idx<months.length-1 ? months[idx+1] : new Date(m.getFullYear(), m.getMonth()+1, 1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=m && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: m.toLocaleDateString('es-MX',{month:'short'}), value: rev};
  });

  const now = new Date();
  const startThis = new Date(now); startThis.setDate(now.getDate()-6); startThis.setHours(0,0,0,0);
  const startLast = new Date(startThis); startLast.setDate(startThis.getDate()-7);
  const revThis = valid.filter(o=>new Date(o.date)>=startThis).reduce((s,o)=>s+o.total,0);
  const revLast = valid.filter(o=>{const d=new Date(o.date); return d>=startLast && d<startThis;}).reduce((s,o)=>s+o.total,0);
  const revDelta = revLast>0 ? Math.round(((revThis-revLast)/revLast)*100) : (revThis>0?100:0);

  const catUnits = {}, catRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.id);
    const cat = prod ? prod.cat : 'Otros';
    catUnits[cat] = (catUnits[cat]||0)+it.qty;
    catRevenue[cat] = (catRevenue[cat]||0)+it.price*it.qty;
  }));
  const catUnitRows = Object.entries(catUnits).sort((a,b)=>b[1]-a[1]);
  const catRevRows = Object.entries(catRevenue).sort((a,b)=>b[1]-a[1]);
  const maxCatUnit = catUnitRows.length ? catUnitRows[0][1] : 1;
  const maxCatRev = catRevRows.length ? catRevRows[0][1] : 1;

  const prodUnits = {}, prodRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{ prodUnits[it.name]=(prodUnits[it.name]||0)+it.qty; prodRevenue[it.name]=(prodRevenue[it.name]||0)+it.price*it.qty; }));
  const topByUnits = Object.entries(prodUnits).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topByRevenue = Object.entries(prodRevenue).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const soldNames = new Set(Object.keys(prodUnits));
  const noSales = state.products.filter(p=>!soldNames.has(p.name));

  const weekdayTotals = [0,0,0,0,0,0,0]; const weekdayCounts=[0,0,0,0,0,0,0];
  valid.forEach(o=>{ const d=new Date(o.date).getDay(); weekdayTotals[d]+=o.total; weekdayCounts[d]+=1; });
  const weekdayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const weekdayAvg = weekdayTotals.map((t,i)=> weekdayCounts[i] ? t/weekdayCounts[i] : 0);
  const bestDayIdx = weekdayAvg.indexOf(Math.max(...weekdayAvg));

  const inventoryValue = state.products.reduce((s,p)=>s+p.price*p.stock,0);
  const invByCat = {};
  state.products.forEach(p=>{ invByCat[p.cat]=(invByCat[p.cat]||0)+p.price*p.stock; });
  const invRows = Object.entries(invByCat).sort((a,b)=>b[1]-a[1]);
  const maxInv = invRows.length ? invRows[0][1] : 1;

  const statusCounts = {}; STATUS_FLOW.forEach(s=>statusCounts[s]=0);
  state.orders.forEach(o=>statusCounts[o.status]=(statusCounts[o.status]||0)+1);

  const expiringOrExpired = state.products.filter(p=>{
    if(!p.expirationDate) return false;
    const days = Math.ceil((new Date(p.expirationDate+'T00:00:00') - new Date())/86400000);
    return days<=30;
  }).length;

  // Comparación mes contra mes (calendario, no "últimos 30 días"): este mes de corrido vs. el
  // mismo tramo de días del mes pasado, para que la comparación sea justa aunque el mes actual
  // todavía no termine (ej. comparar los primeros 12 días de este mes contra los primeros 12
  // días del mes pasado, no el mes pasado completo).
  const startOfThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfLastMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const sameDayLastMonth = new Date(now.getFullYear(), now.getMonth()-1, now.getDate(), 23,59,59,999);
  const ordersThisMonth = valid.filter(o=>new Date(o.date)>=startOfThisMonth);
  const ordersLastMonthSameSpan = valid.filter(o=>{ const d=new Date(o.date); return d>=startOfLastMonth && d<=sameDayLastMonth; });
  const pct = (curr, prev) => prev>0 ? Math.round(((curr-prev)/prev)*100) : (curr>0?100:0);
  const sumTotal = (list)=>list.reduce((s,o)=>s+o.total,0);
  const avgTicket = (list)=>list.length? sumTotal(list)/list.length : 0;
  const monthComparison = {
    thisMonth: {revenue: sumTotal(ordersThisMonth), orders: ordersThisMonth.length, avgTicket: avgTicket(ordersThisMonth)},
    lastMonth: {revenue: sumTotal(ordersLastMonthSameSpan), orders: ordersLastMonthSameSpan.length, avgTicket: avgTicket(ordersLastMonthSameSpan)},
    revenueDeltaPct: pct(sumTotal(ordersThisMonth), sumTotal(ordersLastMonthSameSpan)),
    ordersDeltaPct: pct(ordersThisMonth.length, ordersLastMonthSameSpan.length),
    avgTicketDeltaPct: pct(avgTicket(ordersThisMonth), avgTicket(ordersLastMonthSameSpan)),
    dayOfMonth: now.getDate(),
  };

  return {totalRevenue,avgOrder,avgItems,pending,pendingNuevo,pendingPreparando,pendingCamino,lowStock,cancelRate,uniqueCustomers,repeatCustomers,repeatRate,topCustomers,
    dayRevenue,monthRevenue,revDelta,catUnitRows,catRevRows,maxCatUnit,maxCatRev,topByUnits,topByRevenue,noSales,
    weekdayNames,weekdayAvg,bestDayIdx,inventoryValue,invRows,maxInv,statusCounts,totalOrders:state.orders.length,expiringOrExpired,
    monthComparison};
}
const VISIT_PERIODS = [
  {key:'hoy', label:'Hoy'},
  {key:'semana', label:'Esta semana'},
  {key:'mes', label:'Este mes'},
  {key:'semana_pasada', label:'Semana pasada'},
];
function getVisitsPeriodRange(period){
  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  if(period==='semana'){
    const dow = (now.getDay()+6)%7; // lunes=0
    const start = new Date(startOfToday); start.setDate(start.getDate()-dow);
    return {start, end: now};
  }
  if(period==='mes'){
    return {start: new Date(now.getFullYear(), now.getMonth(), 1), end: now};
  }
  if(period==='semana_pasada'){
    const dow = (now.getDay()+6)%7;
    const startThisWeek = new Date(startOfToday); startThisWeek.setDate(startThisWeek.getDate()-dow);
    const start = new Date(startThisWeek); start.setDate(start.getDate()-7);
    return {start, end: startThisWeek};
  }
  return {start: startOfToday, end: now}; // 'hoy' por default
}
function computeVisitMetrics(){
  const period = state.visitsPeriod || 'hoy';
  const {start, end} = getVisitsPeriodRange(period);
  const periodVisits = state.visits.filter(v=>{ const d=new Date(v.date); return d>=start && d<=end; });
  const totalVisits = periodVisits.length;
  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const visitsByDay = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const count = state.visits.filter(v=>{const vd=new Date(v.date); return vd>=d && vd<next;}).length;
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: count}; });
  const hourCounts = new Array(24).fill(0);
  periodVisits.forEach(v=>{ const h = new Date(v.date).getHours(); hourCounts[h]++; });
  const visitsByHour = hourCounts.map((c,h)=>({label: h+'h', value:c}));
  const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
  const last24h = state.visits.filter(v=>(Date.now()-new Date(v.date).getTime())<86400000).length;
  return {totalVisits, visitsByDay, visitsByHour, peakHour, last24h, period};
}

function adminTabLabel(t){

// El umbral de "bajo stock" es personalizable por producto (lowStockThreshold, editable en su
// ficha) — si no se ha puesto uno, se usa 3 como antes. Esto solo decide CÓMO se etiqueta cada
// uno (Agotado/Crítico/Bajo), nunca cuáles productos entran a la lista de Reabastecer pronto,
// que usa el mismo criterio (ver computeMetrics). El texto y el ícono acompañan al color para
// que no dependa solo de éste.
function stockStatusBadge(p){
  const threshold = p.lowStockThreshold>0 ? p.lowStockThreshold : 3;
  if(p.stock<=0) return `<span class="status-badge status-out">${icon('x',11)} Agotado</span>`;
  if(p.stock===1) return `<span class="status-badge status-critical">${icon('alert-triangle',11)} Crítico · ${p.stock}</span>`;
  if(p.stock<=threshold) return `<span class="status-badge status-low">${icon('alert-triangle',11)} Bajo · ${p.stock}</span>`;
  return `<span class="status-badge status-ok">${icon('check',11)} Disponible · ${p.stock}</span>`;
}
// En productos con variantes avisa cuántas están agotadas aunque el total del producto todavía alcance.
function variantStockBadge(p){
  const vs = p.variants||[]; if(!vs.length) return '';
  const out = vs.filter(v=>!(v.stock>0)).length;
  if(!out) return `<span class="status-badge status-ok" title="Todas con existencia">${vs.length} variante${vs.length===1?'':'s'}</span>`;
  if(out===vs.length) return '';
  return `<span class="status-badge status-low" title="${escDescHtml(vs.filter(v=>!(v.stock>0)).map(varLabelOf).join(', '))}">${icon('alert-triangle',11)} ${out} de ${vs.length} agotada${out===1?'':'s'}</span>`;
}
function expirationBadge(p){
  if(!p.expirationDate) return '';
  const days = Math.ceil((new Date(p.expirationDate+'T00:00:00') - new Date())/86400000);
  if(days < 0) return `<span class="status-badge status-out">${icon('alert-triangle',11)} Caducado</span>`;
  if(days <= 30) return `<span class="status-badge status-low">${icon('alert-triangle',11)} Caduca en ${days} día${days===1?'':'s'}</span>`;
  return '';
}

/* ============== OFERTAS RELÁMPAGO ==============
   Descuento por horas sobre productos o categorías. Vive en settings.flashSales
   [{id,name,percent,start,end,productIds,categories,active}] con fechas "YYYY-MM-DDTHH:MM" en hora
   local. La tienda y el POS lo aplican solos mientras esté en curso (flashFor en index.html y pos.html)
   y el precio vuelve al normal al terminar, sin tener que editar productos. */
function flashList(){ return state.settings.flashSales || []; }
function flashCovers(f, p){
  const cats = (p.categories && p.categories.length) ? p.categories : [p.cat];
  return (f.productIds||[]).includes(p.id) || (f.categories||[]).some(c=>cats.includes(c));
}
function flashProducts(f){ return state.products.filter(p=>!p.isKit && flashCovers(f,p)); }
function flashBelowCost(f){ return flashProducts(f).filter(p=>p.cost>0 && p.price*(1-(Number(f.percent)||0)/100) < p.cost); }
function flashStatus(f){
  if(f.active===false) return 'pausada';
  const now = Date.now(), s = new Date(f.start).getTime(), e = new Date(f.end).getTime();
  if(now>=e) return 'terminada';
  if(now<s) return 'programada';
  return 'en_curso';
}
const FLASH_STATUS = {en_curso:['En curso','var(--green)'], programada:['Programada','var(--amber)'], terminada:['Terminada','#8a6b78'], pausada:['Pausada','#8a6b78']};
function toLocalInput(d){ return localDateStr(d)+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtFlashDate(s){ return new Date(s).toLocaleString('es-MX',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function openFlashModal(id, asCopy){
  const ex = id ? flashList().find(x=>x.id===id) : null;
  const s = new Date(); s.setSeconds(0,0);
  const e = new Date(s.getTime()+3*3600000);
  if(ex && !asCopy) state.flashModal = JSON.parse(JSON.stringify(ex));
  else if(ex) state.flashModal = {...JSON.parse(JSON.stringify(ex)), id:uid('fl_'), start:toLocalInput(s), end:toLocalInput(new Date(s.getTime()+(new Date(ex.end)-new Date(ex.start)))), active:true};
  else state.flashModal = {id:uid('fl_'), name:'', percent:20, start:toLocalInput(s), end:toLocalInput(e), productIds:[], categories:[], active:true};
  state.flashProductSearch = ''; render();
}
function closeFlashModal(){ state.flashModal = null; render(); }
function toggleFlashProduct(pid, checked){
  const f = state.flashModal; if(!f) return;
  if(checked){ if(!f.productIds.includes(pid)) f.productIds.push(pid); } else f.productIds = f.productIds.filter(x=>x!==pid);
  render();
}
function toggleFlashCategory(cat, checked){
  const f = state.flashModal; if(!f) return;
  if(checked){ if(!f.categories.includes(cat)) f.categories.push(cat); } else f.categories = f.categories.filter(x=>x!==cat);
  render();
}
function setFlashDuration(h){
  const f = state.flashModal; if(!f) return;
  const s = new Date(f.start); if(isNaN(s.getTime())) return;
  f.end = toLocalInput(new Date(s.getTime()+h*3600000)); render();
}
function renderFlashModal(){
  const f = state.flashModal;
  const q = (state.flashProductSearch||'').trim().toLowerCase();
  const cands = q ? searchProducts(q, state.products.filter(p=>!p.isKit)).slice(0,12) : [];
  const covered = flashProducts(f);
  const below = flashBelowCost(f);
  const picked = f.productIds.map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
  const secBase = pmSection('fl_base','La oferta',{icon:'clock', body:`
    <div class="form-field"><label>Nombre (lo ve la clienta)</label><input id="fl-name" value="${escDescHtml(f.name||'')}" placeholder="Ej. Relámpago de viernes" oninput="state.flashModal.name=this.value"></div>
    <div class="form-field"><label>Descuento (%)</label><input id="fl-pct" type="number" inputmode="decimal" min="1" max="90" value="${f.percent}" oninput="state.flashModal.percent=this.value" onchange="render()"></div>`});
  const secWhen = pmSection('fl_cuando','Cuándo',{icon:'calendar', body:`
    <div class="form-field"><label>Empieza</label><input id="fl-start" type="datetime-local" value="${f.start}" onchange="state.flashModal.start=this.value;render()"></div>

    <div class="flash-chips">${[1,3,6,12,24].map(h=>`<button type="button" onclick="setFlashDuration(${h})">${h} h</button>`).join('')}</div>`});
  const secWhat = pmSection('fl_que','Qué entra en la oferta',{icon:'grid', badge:`${covered.length} producto${covered.length===1?'':'s'}`, body:`
    <div class="form-field"><label>Categorías completas</label>
      <div class="pm-chips">${(state.settings.categories||[]).map(c=>`<label><input type="checkbox" ${(f.categories||[]).includes(c)?'checked':''} onchange="toggleFlashCategory('${c.replace(/'/g,"\\'")}',this.checked)"> ${escDescHtml(c)}</label>`).join('')}</div>

    ${cands.length ? `<div style="max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;">${cands.map(p=>`<label class="list-row" style="margin:0;border-radius:0;border:none;border-bottom:1px solid var(--border);cursor:pointer;"><input type="checkbox" ${(f.productIds||[]).includes(p.id)?'checked':''} onchange="toggleFlashProduct('${p.id}',this.checked)"><div class="row-main"><div class="row-title" style="font-size:13px;">${escDescHtml(p.name)}</div></div></label>`).join('')}</div>` : ''}
    ${picked.length ? `<div class="flash-chips">${picked.map(p=>`<button type="button" onclick="toggleFlashProduct('${p.id}',false)">${escDescHtml(p.name.length>26?p.name.slice(0,25)+'…':p.name)} ✕</button>`).join('')}</div>` : ''}

  return `<div class="modal-overlay"><div class="modal" style="max-width:560px;">
    <h3>${flashList().some(x=>x.id===f.id)?'Editar':'Nueva'} oferta relámpago</h3>
    ${secBase}${secWhen}${secWhat}
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeFlashModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveFlashSale()">Guardar</button>
    </div>
  </div></div>`;
}
async function saveFlashSale(){
  const f = state.flashModal; if(!f) return;
  const name = (f.name||'').trim() || 'Oferta relámpago';
  const percent = Number(f.percent);
  if(!(percent>=1 && percent<=90)){ showToast('El descuento debe estar entre 1% y 90%'); return; }
  const s = new Date(f.start), e = new Date(f.end);
  if(isNaN(s.getTime()) || isNaN(e.getTime())){ showToast('Pon la fecha y hora de inicio y de fin'); return; }
  if(e<=s){ showToast('El fin debe ser después del inicio'); return; }
  if(!(f.productIds.length || f.categories.length)){ showToast('Elige al menos un producto o una categoría'); return; }
  const upd = {...f, name, percent};
  const list = (state.settings.flashSales||[]).slice();
  const i = list.findIndex(x=>x.id===f.id);
  if(i>=0) list[i] = upd; else list.push(upd);
  state.settings.flashSales = list;
  await saveSettings();
  logAdminAction('oferta_relampago','promoción',name,`${percent}% · ${fmtFlashDate(f.start)} a ${fmtFlashDate(f.end)}`);
  state.flashModal = null; showToast('Oferta relámpago guardada'); render();
}
async function toggleFlashActive(id){
  const f = flashList().find(x=>x.id===id); if(!f) return;
  f.active = (f.active===false); await saveSettings(); render();
}
async function deleteFlashSale(id){
  const prev = flashList(); const f = prev.find(x=>x.id===id); if(!f) return;
  state.settings.flashSales = prev.filter(x=>x.id!==id);
  await saveSettings(); render();
  showUndo(`Oferta "${f.name}" eliminada`, async()=>{ state.settings.flashSales = [...(state.settings.flashSales||[]), f]; await saveSettings(); render(); });

function copyFlashMessage(id){

/* ============== LIQUIDACIÓN DE PRODUCTOS POR CADUCAR ==============
   Revisa lo que caduca en los próximos 45 días (por lote si el producto tiene lotes), sugiere un
   descuento según los días que faltan, nunca por debajo del costo, y lo pone en oferta con un toque
   (promoPrice del producto). Si a tu ritmo de venta alcanzas a venderlo antes, lo avisa. */
const LIQ_WINDOW_DAYS = 45;
function liqSuggestPct(days){ return days<=7 ? 40 : days<=15 ? 30 : days<=30 ? 20 : 10; }
function liqPriceFor(p, pct){
  let price = p.price*(1-pct/100);
  if(p.cost>0 && price<p.cost) price = p.cost;
  price = Math.round(price);
  return price;
}
function liqUnitsSold30(){
  const since = Date.now()-30*86400000, m = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime()<since) return;
    (o.items||[]).forEach(it=>{ if(it.id) m[it.id] = (m[it.id]||0) + (it.qty||0); });
  });
  return m;
}
function computeLiquidation(){
  const todayStr = localDateStr();
  const limitStr = localDateStr(new Date(Date.now()+LIQ_WINDOW_DAYS*86400000));
  const sold = liqUnitsSold30();
  const rows = [], expired = [];
  const dayDiff = (s)=> Math.ceil((new Date(s+'T00:00:00') - new Date(todayStr+'T00:00:00'))/86400000);
  state.products.forEach(p=>{
    if(p.isKit || p.deletedAt) return;
    const stock = totalStock(p); if(stock<=0) return;
    const bs = (p.batches||[]).filter(b=>(b.qty||0)>0 && b.expirationDate);
    let exp, qty, expQty = 0;
    if(bs.length){
      expQty = bs.filter(b=>b.expirationDate<todayStr).reduce((s,b)=>s+b.qty,0);
      const live = bs.filter(b=>b.expirationDate>=todayStr && b.expirationDate<=limitStr);
      exp = live.map(b=>b.expirationDate).sort()[0]; qty = live.reduce((s,b)=>s+b.qty,0);
    } else if(p.expirationDate){
      if(p.expirationDate<todayStr) expQty = stock;
      else if(p.expirationDate<=limitStr){ exp = p.expirationDate; qty = stock; }
    }
    if(expQty>0) expired.push({p, qty:expQty});
    if(!exp || !(qty>0)) return;
    const days = dayDiff(exp);
    const perDay = (sold[p.id]||0)/30;
    const sellsOut = perDay>0 && (qty/perDay) <= days;
    const onPromo = p.promoPrice>0 && p.promoPrice<p.price;
    rows.push({p, days, exp, qty, perDay, sellsOut, onPromo, other: Math.max(0, stock-qty)});
  });
  rows.sort((a,b)=>a.days-b.days);
  return {rows, expired};
}
function setLiqPct(id, v){ state.liqPct = state.liqPct||{}; state.liqPct[id] = v; render(); }
async function applyLiquidation(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  const g = computeLiquidation().rows.find(r=>r.p.id===id);
  const pct = Number((state.liqPct||{})[id] ?? (g ? liqSuggestPct(g.days) : 20));
  if(!(pct>=1 && pct<=90)){ showToast('El descuento debe estar entre 1% y 90%'); return; }
  const price = liqPriceFor(p, pct);
  if(!(price<p.price)){ showToast('No hay margen para descontar este producto sin bajar del costo'); return; }
  const prev = {promoPrice:p.promoPrice||0, promoSince:p.promoSince||null};
  try{
    await db.collection('products').doc(id).update({promoPrice:price, promoSince:new Date().toISOString()});
  }catch(e){ console.error(e); showToast('No se pudo guardar la oferta'); return; }
  p.promoPrice = price; p.promoSince = new Date().toISOString();
  logAdminAction('liquidacion','producto',p.name,`-${pct}% por caducar → ${money(price)}`, id);
  render();
  showUndo(`"${p.name}" en oferta a ${money(price)}`, async()=>{
    await db.collection('products').doc(id).update(prev);
    p.promoPrice = prev.promoPrice; p.promoSince = prev.promoSince; render();
  }, 10000);
}
async function removeLiquidation(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  const prev = {promoPrice:p.promoPrice||0, promoSince:p.promoSince||null};
  try{ await db.collection('products').doc(id).update({promoPrice:0, promoSince:null}); }
  catch(e){ console.error(e); showToast('No se pudo quitar la oferta'); return; }
  p.promoPrice = 0; p.promoSince = null; render();
  showUndo(`Oferta quitada de "${p.name}"`, async()=>{ await db.collection('products').doc(id).update(prev); p.promoPrice=prev.promoPrice; p.promoSince=prev.promoSince; render(); });
}
function renderLiquidationPanel(){
  const {rows, expired} = computeLiquidation();
  if(!rows.length && !expired.length) return '';
  const rowHtml = (r)=>{
    const p = r.p;
    const pct = Number((state.liqPct||{})[p.id] ?? liqSuggestPct(r.days));
    const price = liqPriceFor(p, pct);
    const atCost = p.cost>0 && price<=Math.round(p.cost);
    const margin = (p.cost>0 && price>0) ? Math.round((price-p.cost)/price*100) : null;
    const when = r.days===0 ? 'caduca hoy' : r.days===1 ? 'caduca mañana' : `caduca en ${r.days} días`;
    return `<div class="liq-row">
      <div class="row-title">${escDescHtml(p.name)}</div>
      <div class="row-sub">${when} · ${r.qty} pza${r.qty===1?'':'s'} en riesgo${r.other>0?` (+${r.other} con fecha posterior; la oferta aplica a todas)`:''}</div>
      ${r.sellsOut ? `<div class="row-sub" style="color:var(--green);font-weight:700;">A tu ritmo (${(r.perDay*7).toFixed(1)} por semana) alcanzas a venderlas antes</div>` : (r.perDay>0 ? `<div class="row-sub">Vendes ~${(r.perDay*7).toFixed(1)} por semana: no alcanzan a salir solas</div>` : `<div class="row-sub">Sin ventas en 30 días</div>`)}
      ${r.onPromo ? `<div class="liq-ctl"><span class="status-badge status-ok">En oferta a ${money(p.promoPrice)}</span><button class="btn-tertiary" onclick="removeLiquidation('${p.id}')">Quitar oferta</button></div>` : `
      <div class="liq-ctl">
        <input type="number" inputmode="numeric" min="1" max="90" value="${pct}" aria-label="Descuento en porcentaje" onchange="setLiqPct('${p.id}',this.value)"><span>%</span>
        <span class="row-sub" style="margin:0;">→ <strong>${money(price)}</strong> (antes ${money(p.price)})${margin!==null?` · margen ${margin}%`:''}</span>
      </div>
      ${atCost ? `<div class="row-sub" style="color:var(--rose);">Quedaría a costo: no se baja más para no vender con pérdida.</div>` : ''}

/* ============== CIERRE DE MES GUIADO ==============
   Revisa lo que suele quedar suelto al terminar el mes (pedidos abiertos, cobros pendientes, cajas,
   costos sin capturar, conteo, respaldo), deja marcar a mano lo que no se puede medir y guarda una
   foto de las cifras al cerrar: settings.monthCloses[YYYY-MM] = {checks, closedAt, closedBy, snapshot}. */
const CLOSE_MANUAL = [
  {id:'gastos', text:'Capturé todos los gastos del mes', sub:'Renta, luz, internet, sueldos, paquetería, publicidad.'},
  {id:'proveedores', text:'Registré lo que pagué o debo a proveedores', sub:'Para que la utilidad no salga inflada.'},
  {id:'cambios', text:'Revisé devoluciones y cambios', sub:'Que cada devolución esté registrada y su stock repuesto.'},
];
function monthLabelOf(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'}); }
function prevMonthKey(key){ const [y,m]=key.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function monthCloseOf(key){ return (state.settings.monthCloses||{})[key] || null; }
function defaultCloseMonth(){
  const now = new Date(), cur = currentMonthKey(), prev = prevMonthKey(cur);
  if(now.getDate()<=7){ const c = monthCloseOf(prev); if(!(c && c.closedAt)) return prev; }
  return cur;
}
function computeMonthClose(key){
  const {start,end} = monthRangeOf(key);
  const np = computeNetProfit(key);
  const inMonth = state.orders.filter(o=>{ if(o.status==='Cancelado') return false; const d=new Date(o.date); return !isNaN(d.getTime()) && d>=start && d<end; });
  const orders = inMonth.length;
  const prev = computeNetProfit(prevMonthKey(key));
  const byProd = {};
  inMonth.forEach(o=>(o.items||[]).forEach(it=>{ if(!it.id||it.id==='promo_buyxpayy') return; const n=String(it.name||'').replace(/\s*\(.*\)$/,''); byProd[n]=(byProd[n]||0)+(it.qty||0); }));
  const top = Object.entries(byProd).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const summary = {revenue:np.revenue, cogs:np.cogs, gross:np.grossMargin, expenses:np.expensesTotal, net:np.net, orders, avg: orders? np.revenue/orders : 0, prevRevenue:prev.revenue, top};
  const checks = [];
  const openOld = state.orders.filter(o=>!o.archived && ['Nuevo','Preparando','En camino'].includes(o.status) && new Date(o.date)<end && Date.now()-new Date(o.date).getTime()>3*86400000);
  checks.push({id:'abiertos', ok:openOld.length===0, text: openOld.length ? `${openOld.length} pedido${openOld.length===1?'':'s'} sin cerrar con más de 3 días` : 'Todos los pedidos están cerrados o recientes', sub: openOld.length ? 'Entrégalos, cancélalos o archívalos para que las cifras sean reales.' : '', go:"state.adminTab='pedidos';state.orderStatusFilter='Todos';state.orderRiskOnly=false;state.orderUnpaidOnly=false;render()"});
  const unpaid = state.orders.filter(o=>orderIsUnpaidDelivered(o) && new Date(o.date)>=start && new Date(o.date)<end);
  const unpaidSum = unpaid.reduce((a,o)=>a+(o.total||0),0);
  checks.push({id:'cobros', ok:unpaid.length===0, text: unpaid.length ? `${unpaid.length} pedido${unpaid.length===1?'':'s'} entregado${unpaid.length===1?'':'s'} sin cobrar (${money(unpaidSum)})` : 'Todo lo entregado está cobrado', sub: unpaid.length ? 'Cóbralos o márcalos como pagados.' : '', go:"state.adminTab='pedidos';state.orderStatusFilter='Todos';state.orderRiskOnly=false;state.orderUnpaidOnly=true;render()"});
  const regs = (state.cashRegisters||[]).filter(r=>{ const d=new Date(r.openedAt); return d>=start && d<end; });
  const regOpen = regs.filter(r=>r.status==='abierta').length;
  const regDiff = regs.filter(r=>r.status==='cerrada' && Math.abs(r.difference||0)>0).length;
  checks.push({id:'cajas', ok:regOpen===0, text: regOpen ? `${regOpen} caja${regOpen===1?'':'s'} sin cerrar` : (regs.length ? `${regs.length} cierre${regs.length===1?'':'s'} de caja hechos` : 'Sin cajas del POS este mes'), sub: regDiff ? `${regDiff} cierre${regDiff===1?'':'s'} con diferencia: revísalo${regDiff===1?'':'s'}.` : '', go:"state.adminTab='caja';render()"});
  checks.push({id:'costos', ok:np.soldWithoutCost===0, text: np.soldWithoutCost ? `${np.soldWithoutCost} pieza${np.soldWithoutCost===1?'':'s'} vendida${np.soldWithoutCost===1?'':'s'} sin costo capturado` : 'Todo lo vendido tiene costo', sub: np.soldWithoutCost ? 'La utilidad sale más alta de lo real hasta que captures esos costos.' : '', go:"state.adminTab='productos';render()"});
  const aud = (state.audits||[]).filter(a=>{ const d=new Date(a.date); return d>=start && d<end; }).length;
  checks.push({id:'conteo', ok:aud>0, text: aud ? `${aud} conteo${aud===1?'':'s'} de inventario en el mes` : 'No hiciste conteo de inventario este mes', sub: aud ? '' : 'Un conteo rápido de lo más vendido ayuda a detectar faltantes.', go:"state.adminTab='centros';state.centersSubview='auditorias';render()"});
  const exp = state.settings.lastExportAt ? Math.floor((Date.now()-new Date(state.settings.lastExportAt).getTime())/86400000) : null;
  checks.push({id:'respaldo', ok: exp!==null && exp<=30, text: exp===null ? 'Nunca has exportado un respaldo del catálogo' : exp<=30 ? `Respaldo hecho hace ${exp} día${exp===1?'':'s'}` : `Último respaldo hace ${exp} días`, sub: (exp===null||exp>30) ? 'Expórtalo desde Productos → Herramientas.' : '', go:"state.adminTab='productos';state.productToolsOpen=true;render()"});
  const mc = monthCloseOf(key); const manual = (mc && mc.checks) || {};
  CLOSE_MANUAL.forEach(m=>checks.push({id:m.id, manual:true, ok:!!manual[m.id], text:m.text, sub:m.sub}));
  const pending = checks.filter(c=>!c.ok).length;
  return {key, summary, checks, pending, expensesCount: np.expenses.length, closed: mc && mc.closedAt ? mc : null};
}

/* ============== LOTES CON CADUCIDAD (primero en caducar, primero en salir) ==============
   Un producto puede tener varios lotes {id, qty, expirationDate, note}. La fecha más próxima de los
   lotes con piezas se copia a "expirationDate" del producto, así todos los avisos de caducidad que
   ya existían siguen funcionando. Al vender (POS) o descontar un pedido, se gastan primero los
   lotes que caducan antes. */
function earliestExpiry(batches){
  const d = (batches||[]).filter(b=>(b.qty||0)>0 && b.expirationDate).map(b=>b.expirationDate).sort();
  return d[0] || '';
}
function fefoConsume(batches, qty){
  const list = (batches||[]).map(b=>({...b}));
  const order = list.map((_,i)=>i).sort((a,b)=> String(list[a].expirationDate||'9999-99-99').localeCompare(String(list[b].expirationDate||'9999-99-99')));
  let left = qty;
  for(const i of order){ if(left<=0) break; const take = Math.min(list[i].qty||0, left); list[i].qty = (list[i].qty||0) - take; left -= take; }
  return list.filter(b=>(b.qty||0)>0);
}
function addBatch(){ const m = state.productModal; if(!m) return; if(!m.batches) m.batches=[]; m.batches.push({id:uid('lot_'), qty:'', expirationDate:'', note:''}); state.pmOpen = {...(state.pmOpen||{}), lotes:true}; render(); }
function setBatchField(id, field, value){
  const b = ((state.productModal||{}).batches||[]).find(x=>x.id===id); if(!b) return;
  b[field] = field==='qty' ? Math.max(0, Math.floor(Number(value)||0)) : value;
  if(field!=='note') render();
}

  const near = earliestExpiry(bs);

/* ============== VENTAS POR DÍA, PROYECCIÓN DE CIERRE DE MES Y CALENDARIO ============== */
function moneyK(n){
  n = Math.round(n||0);
  if(n<1000) return '$'+n;
  if(n<10000) return '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return '$'+Math.round(n/1000)+'k';
}
// Venta por día (fecha local), sin pedidos cancelados; tienda y Punto de Venta juntos.
function dailyRevenueMap(){
  const m = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const d = new Date(o.date); if(isNaN(d.getTime())) return;
    const k = localDateStr(d); m[k] = (m[k]||0) + (o.total||0);
  });
  return m;
}
function computeMonthProjection(){
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();
  const dim = new Date(y, mo+1, 0).getDate(), day = now.getDate();
  const map = dailyRevenueMap();
  const ymd = (i)=> y+'-'+pad2(mo+1)+'-'+pad2(i);
  let before = 0; for(let i=1;i<day;i++) before += map[ymd(i)]||0;
  const today = map[ymd(day)]||0;
  const dates = state.orders.map(o=>new Date(o.date).getTime()).filter(t=>!isNaN(t));
  const first = dates.length ? Math.min(...dates) : Date.now();
  const histDays = Math.floor((now.getTime()-first)/86400000);
  // Promedio por día de la semana en las últimas 8 semanas (solo días posteriores al primer pedido).
  const sums=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  for(let i=1;i<=56;i++){
    const d = new Date(now); d.setDate(now.getDate()-i);
    if(d.getTime() < first - 86400000) continue;
    sums[d.getDay()] += map[localDateStr(d)]||0; cnt[d.getDay()]++;
  }
  const enough = histDays >= 21 && cnt.every(c=>c>=2);
  const runRate = day>0 ? (before+today)/day : 0;
  const avg = sums.map((v,i)=> enough ? v/cnt[i] : runRate);
  const expToday = avg[now.getDay()];
  let future = 0;
  for(let i=day+1;i<=dim;i++){ future += avg[new Date(y,mo,i).getDay()]; }
  const toDate = before + today;
  const remaining = Math.max(0, Math.max(today, expToday) - today) + future;
  const projected = toDate + remaining;
  const low = toDate + remaining*0.8, high = toDate + remaining*1.2;
  const goal = state.settings.salesGoalMonthly||0;
  const prevKey = (()=>{ const d=new Date(y,mo-1,1); return d.getFullYear()+'-'+pad2(d.getMonth()+1); })();
  const prevRev = computeNetProfit(prevKey).revenue;
  const np = computeNetProfit(currentMonthKey());
  const marginRate = (np.revenue>0 && np.cogs>0) ? np.grossMargin/np.revenue : null;
  const profit = marginRate!=null ? projected*marginRate - np.expensesTotal : null;
  return {dim, day, daysLeft: dim-day, toDate, projected, low, high, goal, prevRev, profit, expensesSoFar: np.expensesTotal, soldWithoutCost: np.soldWithoutCost, enough, monthName: now.toLocaleDateString('es-MX',{month:'long'})};
}
function renderProjectionPanel(){
  const p = computeMonthProjection();
  const pct = p.projected>0 ? Math.min(100, p.toDate/p.projected*100) : 0;
  const vsPrev = p.prevRev>0 ? Math.round((p.projected-p.prevRev)/p.prevRev*100) : null;
  const goalLine = p.goal>0 ? (p.projected>=p.goal ? `Superarías tu meta de ${money(p.goal)} (${Math.round(p.projected/p.goal*100)}%)` : `Llegarías al ${Math.round(p.projected/p.goal*100)}% de tu meta de ${money(p.goal)}`) : '';
  return `<div class="panel" id="proj-panel">
    <div class="panel-title" style="margin:0;">Proyección de cierre de ${p.monthName}</div>
    <div class="proj-main">${money(p.projected)}</div>
    <div class="panel-sub" style="margin:0;">Rango probable ${money(p.low)} – ${money(p.high)} · ${p.daysLeft===0?'último día del mes':`quedan ${p.daysLeft} día${p.daysLeft===1?'':'s'}`}</div>
    <div class="proj-bar"><i style="width:${pct.toFixed(0)}%"></i></div>
    <div class="row-sub">Llevas ${money(p.toDate)} (${pct.toFixed(0)}% de lo proyectado)</div>

function computeMonthProgress(){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const revenue = state.orders
    .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= monthStart)
    .reduce((s,o)=>s+(o.total||0), 0);
  const goal = state.settings.salesGoalMonthly||0;
  const pct = goal>0 ? Math.min(100, (revenue/goal*100)) : 0;
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const dayOfMonth = now.getDate();
  const expectedPct = (dayOfMonth/daysInMonth)*100;
  // Desglose semanal: cuánto llevas vendido ESTA semana (lunes a hoy) contra cuánto necesitarías
  // vender por semana, en promedio, en lo que queda del mes para sí llegar a la meta.
  const daysSinceMonday = (now.getDay()+6)%7; // lunes=0 ... domingo=6
  const weekStart = new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate()-daysSinceMonday);
  const weekRevenue = state.orders
    .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= weekStart)
    .reduce((s,o)=>s+(o.total||0), 0);
  const daysLeftInMonth = daysInMonth - dayOfMonth + 1; // incluye hoy
  const weeksLeft = Math.max(daysLeftInMonth/7, 1/7);
  const remainingGoal = Math.max(0, goal-revenue);
  const neededPerWeek = goal>0 ? remainingGoal/weeksLeft : 0;
  const weekPct = neededPerWeek>0 ? Math.min(100,(weekRevenue/neededPerWeek)*100) : (goal>0?100:0);
  return { revenue, goal, pct, onTrack: goal===0 || pct>=expectedPct-5, monthName: now.toLocaleDateString('es-MX',{month:'long'}),
    weekRevenue, neededPerWeek, weekPct };
}
