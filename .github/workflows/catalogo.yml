name: Catálogo estático (catalogo.json)
# Genera catalogo.json con los productos y ajustes PÚBLICOS para que la tienda no lea Firestore.
# Se revisa cada 20 min (cuesta 1 lectura si no hay nada que publicar) y regenera cuando:
#   · el panel pidió publicar (botón "Publicar tienda" o al guardar productos/ajustes), o
#   · el punto de venta agotó un producto que la tienda mostraba disponible, o
#   · pasaron 6 h desde la última publicación (refresca existencias), o
#   · lo lanzas a mano: Actions → "Catálogo estático" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      force:
        description: '1 = regenerar aunque no haya cambios'
        default: '1'
        required: false
      dry_run:
        description: '1 = solo reporte (no escribe nada)'
        default: '0'
        required: false
      existencias:
        description: '1 = el punto de venta agotó un producto (publica aunque el panel no lo haya pedido)'
        default: '0'
        required: false
      pdf:
        description: '1 = rehacer el catálogo en PDF aunque el catálogo no haya cambiado'
        default: '0'
        required: false
  schedule:
    - cron: '*/20 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: catalogo
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/catalogo/package-lock.json
      - run: npm ci --prefix tools/catalogo --no-audit --no-fund
      - name: Generar catalogo.json
        id: json
        run: node tools/catalogo/build.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          EXISTENCIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.existencias || '0' }}
          MAX_AGE_HORAS: '6'
      # Catálogo en PDF (casaplaceres.com/catalogo-pdf). Se rehace solo cuando catalogo.json cambió.
      # NO se guarda en el repositorio (pesaría ~6 MB por publicación y no gasta compilaciones de
      # Cloudflare): se sube como archivo de la versión "catalogo" de GitHub y la página lo entrega.
      - uses: actions/setup-python@v5
        if: ${{ steps.json.outputs.cambio == '1' || (github.event_name == 'workflow_dispatch' && inputs.pdf == '1') }}
        with: { python-version: '3.12' }
      - name: Catálogo en PDF
        if: ${{ steps.json.outputs.cambio == '1' || (github.event_name == 'workflow_dispatch' && inputs.pdf == '1') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet reportlab pillow
          python3 tools/catalogo-pdf/generar.py --out "$RUNNER_TEMP/catalogo.pdf"
          gh release view catalogo >/dev/null 2>&1 || gh release create catalogo --title "Catálogo en PDF" \
            --notes "Se actualiza solo cada vez que se publica la tienda. Enlace para clientas: https://casaplaceres.com/catalogo-pdf" --latest=false
          gh release upload catalogo "$RUNNER_TEMP/catalogo.pdf" --clobber
