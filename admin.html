const EXPENSE_CATEGORIES = ['Renta','Sueldos','Empaque','Publicidad','Servicios (luz, agua, internet)','Transporte y envíos','Otros'];
function pad2(n){ return String(n).padStart(2,'0'); }
function localDateStr(d){ d = d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function currentMonthKey(){ const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function monthRangeOf(key){ const [y,m] = key.split('-').map(Number); return {start:new Date(y,m-1,1), end:new Date(y,m,1)}; }
function monthLabel(key){ const [y,m] = key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'}); }
function lastMonthKeys(n){ const out = []; const d = new Date(); d.setDate(1); for(let i=0;i<n;i++){ out.push(d.getFullYear()+'-'+pad2(d.getMonth()+1)); d.setMonth(d.getMonth()-1); } return out; }
// Utilidad neta del mes = ventas − costo de lo vendido − gastos (− retiros de caja, si se cuentan).
// El costo usa el costo ACTUAL de cada producto (no guardamos el costo histórico por venta).
function computeNetProfit(monthKey){
  const {start,end} = monthRangeOf(monthKey);
  let revenue = 0, cogs = 0, soldWithoutCost = 0;
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const d = new Date(o.date);
    if(isNaN(d.getTime()) || d<start || d>=end) return;
    revenue += (o.total||0);
    (o.items||[]).forEach(it=>{
      if(!it.id || it.id==='promo_buyxpayy') return;
      const p = state.products.find(x=>x.id===it.id);
      if(p && p.cost>0) cogs += p.cost*it.qty; else soldWithoutCost += it.qty;
    });
  });
  const expenses = state.expenses.filter(e=>{ const d = new Date(e.date); return d>=start && d<end; });
  const byCategory = {};
  expenses.forEach(e=>{ const c = e.category||'Otros'; byCategory[c] = (byCategory[c]||0)+(e.amount||0); });
  const expensesTotal = expenses.reduce((s,e)=>s+(e.amount||0),0);
  const withdrawals = [];
  state.cashRegisters.forEach(r=>(r.movements||[]).forEach(m=>{
    if(m.type!=='retiro') return;
    const d = new Date(m.date||r.openedAt);
    if(d>=start && d<end) withdrawals.push({date:d.toISOString(), amount:m.amount||0, note:m.note||'', cashier:r.cashierName});
  }));
  const withdrawalsTotal = withdrawals.reduce((s,w)=>s+w.amount,0);
  const grossMargin = revenue - cogs;
  const net = grossMargin - expensesTotal - (state.includeCashWithdrawals ? withdrawalsTotal : 0);
  return {revenue, cogs, grossMargin, expenses, expensesTotal, byCategory, withdrawals, withdrawalsTotal, net, soldWithoutCost};
}

async function saveExpenseEdit(){
  const id = state.expenseEditId; const e = state.expenses.find(x=>x.id===id); if(!e) return cancelExpenseEdit();
  const amount = Number((document.getElementById('exp-amount')||{}).value)||0;
  const category = (document.getElementById('exp-cat')||{}).value || 'Otros';
  const note = ((document.getElementById('exp-note')||{}).value||'').trim();
  const dateStr = (document.getElementById('exp-date')||{}).value || localDateStr();
  if(!(amount>0)){ showToast('Escribe el monto del gasto'); return; }
  const upd = {date:new Date(dateStr+'T12:00:00').toISOString(), amount, category, note};
  try{
    await db.collection('expenses').doc(id).update(upd);
    Object.assign(e, upd);
    state.expenses.sort((a,b)=>new Date(b.date)-new Date(a.date));
    logAdminAction('gasto_editado','gasto',category+(note?': '+note:''),money(amount));
    state.expenseEditId=null; state.expenseDraftAmount=''; state.expenseDraftNote='';
    showToast('Gasto actualizado'); render();
  }catch(err){ console.error(err); showToast('No se pudo actualizar el gasto'); }
}
async function deleteExpense(id){
  const e = state.expenses.find(x=>x.id===id); if(!e) return;
  try{
    const backup = {...e}; delete backup.id;
    await db.collection('expenses').doc(id).delete();
    state.expenses = state.expenses.filter(x=>x.id!==id);
    logAdminAction('gasto_eliminado', 'gasto', e.category+(e.note?': '+e.note:''), money(e.amount));
    render();
    showUndo(`Gasto de ${money(e.amount)} borrado`, async()=>{
      await db.collection('expenses').doc(id).set(backup);
      state.expenses = [{id, ...backup}, ...state.expenses];
      showToast('Gasto recuperado'); render();
    });
  }catch(err){ console.error(err); showToast('No se pudo borrar'); }
}

const SHRINK_REASONS = ['Dañado','Caducado','Perdido / robo','Muestra o regalo','Otro'];
function openShrinkForProduct(productId){
  const p = state.products.find(x=>x.id===productId);
  state.adminTab = 'centros'; state.centersSubview = 'mermas';
  state.shrinkProductId = productId; state.shrinkSearch = '';
  render();
  const r = document.getElementById('shrink-reason');
  if(r && p && p.expirationDate && new Date(p.expirationDate+'T00:00:00') < new Date(Date.now()+30*86400000)) r.value = 'Caducado';
}
async function registerShrinkage(){
  const p = state.products.find(x=>x.id===state.shrinkProductId);
  if(!p){ showToast('Elige primero el producto'); return; }
  const hasVars = !!(p.variants && p.variants.length);
  const sv = hasVars ? p.variants.find(v=>v.id===state.shrinkVariantId) : null;
  if(hasVars && !sv){ showToast('Elige la variante que se dio de baja'); return; }
  const centerId = state.shrinkCenterId || (state.centers.find(c=>c.isDefault)||state.centers[0]||{}).id;
  const center = state.centers.find(c=>c.id===centerId);
  const qty = Math.floor(Number((document.getElementById('shrink-qty')||{}).value)||0);
  const reason = (document.getElementById('shrink-reason')||{}).value || 'Otro';
  const note = ((document.getElementById('shrink-note')||{}).value||'').trim();
  const available = sv ? vCenterStock(sv, centerId) : ((p.stockByCenter && p.stockByCenter[centerId]) || 0);
  if(qty<=0){ showToast('Escribe cuántas piezas'); return; }
  if(qty>available){ showToast(`Solo hay ${available} pieza(s) de "${p.name}" en ${center?center.name:'ese centro'}`); return; }
  try{
    if(sv){ vSetCenterStock(sv, centerId, available - qty); vProductSync(p); await db.collection('products').doc(p.id).update({variants:p.variants, stockByCenter:p.stockByCenter, stock:p.stock}); }
    else{ p.stockByCenter[centerId] = available - qty; p.stock = totalStock(p); await db.collection('products').doc(p.id).update({stockByCenter:p.stockByCenter, stock:p.stock}); }
    const unitCost = (sv && Number(sv.cost)>0) ? Number(sv.cost) : (p.cost||0);
    const rec = {date:new Date().toISOString(), productId:p.id, productName:p.name+(sv?' — '+Object.values(sv.combo||{}).join(' / '):''), variantId: sv?sv.id:null, qty, reason, note, centerId, centerName:center?center.name:'', unitCost, totalCost:unitCost*qty, user: state.user ? state.user.email : ''};
    const ref = await db.collection('shrinkage').add(rec);
    state.shrinkage.unshift({id:ref.id, ...rec});
    logStockMovement(p.id, 'merma', -qty, `Merma: ${reason}${note?' — '+note:''}`, centerId);
    logAdminAction('merma', 'producto', p.name, `${qty} pza · ${reason} · ${money(unitCost*qty)}`, p.id);
    state.shrinkProductId = null; state.shrinkSearch = ''; state.shrinkVariantId = '';
    showToast('Merma registrada y descontada del inventario');
    render();
  }catch(e){ console.error('No se pudo registrar la merma', e); showToast('No se pudo registrar la merma'); }
}
async function undoShrinkage(id){
  const sh = state.shrinkage.find(x=>x.id===id); if(!sh) return;
  const p = state.products.find(x=>x.id===sh.productId);
  if(!p){ showToast('El producto ya no existe; solo se puede borrar el registro'); }
  if(!confirm(`¿Deshacer la merma de ${sh.qty} × ${sh.productName}? ${p?`Las piezas regresan al inventario de ${sh.centerName||'su centro'}.`:'Se borrará el registro.'}`)) return;
  try{
    if(p){
      const cid = sh.centerId || defaultCenterId();
      const sv = sh.variantId ? (p.variants||[]).find(v=>v.id===sh.variantId) : null;
      if(sh.variantId && !sv){ showToast('Esa variante ya no existe'); return; }
      if(sv){ vSetCenterStock(sv, cid, vCenterStock(sv,cid)+sh.qty); vProductSync(p); await db.collection('products').doc(p.id).update({variants:p.variants, stockByCenter:p.stockByCenter, stock:p.stock}); }
      else{ if(!p.stockByCenter) p.stockByCenter={}; p.stockByCenter[cid]=(p.stockByCenter[cid]||0)+sh.qty; p.stock=totalStock(p); await db.collection('products').doc(p.id).update({stockByCenter:p.stockByCenter, stock:p.stock}); }
      logStockMovement(p.id,'merma_deshecha',sh.qty,'Se deshizo una merma',cid);
    }
    await db.collection('shrinkage').doc(id).delete();
    state.shrinkage = state.shrinkage.filter(x=>x.id!==id);
    logAdminAction('merma_deshecha','producto',sh.productName,`${sh.qty} pza`,sh.productId);
    showToast('Merma deshecha'); render();
  }catch(e){ console.error(e); showToast('No se pudo deshacer la merma'); }
}

      ${p.variants && p.variants.length ? `<div class="form-field" style="margin-top:10px;"><label>Variante</label><select onchange="state.shrinkVariantId=this.value;render()"><option value="">Elige la variante…</option>${p.variants.map(v=>`<option value="${v.id}" ${v.id===state.shrinkVariantId?'selected':''}>${Object.values(v.combo||{}).join(' / ')} (${vCenterStock(v,centerId)} en este centro)</option>`).join('')}</select></div>` : ''}
      <div class="two-col" style="margin-top:10px;">
        <div class="form-field"><label>Centro</label><select onchange="state.shrinkCenterId=this.value;render()">${state.centers.map(c=>`<option value="${c.id}" ${c.id===centerId?'selected':''}>${c.name}</option>`).join('')}</select></div>
        <div class="form-field"><label>Piezas</label><input id="shrink-qty" type="number" min="1" placeholder="1"></div>

function waNumberMX(phone){ const d = (phone||'').replace(/\D/g,''); return d.length===10 ? '52'+d : d; }
function productShareLink(id){ return location.href.replace(/admin\.html.*$/, 'index.html') + '?producto=' + encodeURIComponent(id); }
// Variante que pidió la persona: por su variantId o, en avisos viejos, por el texto "(Azul)" que quedó en el nombre.
function restockVariantOf(r, p){
  if(!p || !(p.variants||[]).length) return null;
  if(r.variantId){ const v = p.variants.find(x=>x.id===r.variantId); if(v) return v; }
  const m = /\(([^()]+)\)\s*$/.exec(r.productName||'');
  if(m){ const lab = searchClean(m[1]); const v = p.variants.find(x=>searchClean(varLabelOf(x))===lab); if(v) return v; }
  return null;
}
function restockKey(r){ const v = restockVariantOf(r, state.products.find(x=>x.id===r.productId)); return r.productId + (v ? '::'+v.id : ''); }
function computeRestockDemand(){
  const byKey = {};
  state.restockRequests.forEach(r=>{
    if(r.notified) return;
    const p = state.products.find(x=>x.id===r.productId);
    const v = restockVariantOf(r, p);
    const key = r.productId + (v ? '::'+v.id : '');
    const g = byKey[key] || (byKey[key] = {key, productId:r.productId, variantId:v?v.id:null, variant:v, name:r.productName, people:[], product:p});
    g.people.push(r);
  });
  return Object.values(byKey).map(g=>{
    const unresolved = !g.variant && g.product && (g.product.variants||[]).length>0;   // pidió "el producto" sin elegir variante
    return {...g, unresolved, stock: g.variant ? (g.variant.stock||0) : (g.product ? (g.product.stock||0) : 0)};
  }).sort((a,b)=>b.people.length-a.people.length);
}
// Igual que con los carritos abandonados: un aviso ya contactado hace tiempo (o pendiente desde
// hace mucho y que ya ni vale la pena seguir mostrando) no se borra solo — se ofrece un botón
// para archivar en bloque todo lo de más de 60 días, para que la lista no se llene de avisos
// viejos que ya se resolvieron o que la persona seguramente ya ni recuerda haber pedido.
const RESTOCK_REQUEST_STALE_MS = 60*24*60*60*1000;
function staleRestockRequests(){
  const cutoff = Date.now() - RESTOCK_REQUEST_STALE_MS;
  return state.restockRequests.filter(r=>new Date(r.date||0).getTime() < cutoff);
}
function renderRestockDemandPanel(){
  const demand = computeRestockDemand();
  const stale = staleRestockRequests();
  if(!demand.length && !stale.length) return '';
  return `
  <div class="panel">
    <div class="panel-title">Clientes esperando producto</div>
    <div class="panel-sub">Personas que dejaron su WhatsApp para que les avises cuando llegue. Arriba están los que más gente espera.</div>
    ${stale.length ? `<div class="note-box" style="margin-bottom:10px;">${stale.length} aviso${stale.length===1?'':'s'} de más de 60 días. <button class="btn-tertiary" onclick="archiveStaleRestockRequests()">Eliminar avisos viejos</button></div>` : ''}
    ${demand.length ? demand.map(g=>`
      <div class="list-row row-wrap">
        <div class="row-main">
          <div class="row-title">${escDescHtml(g.product ? g.product.name : g.name)}${g.variant ? ` <span class="status-badge" style="background:var(--primary);">${escDescHtml(varLabelOf(g.variant))}</span>` : ''}</div>
          <div class="row-sub">${g.people.length} persona${g.people.length===1?'':'s'} esperando${g.variant?` ${escDescHtml(varLabelOf(g.variant))}`:''} · ${g.stock>0 ? `Ya hay ${g.stock} ${g.variant?'de esa variante ':''}en stock — ¡avísales!` : (g.variant ? 'Esa variante está agotada' : 'Agotado')}${g.unresolved ? ' · no indicó variante (aviso anterior)' : ''}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${g.stock<=0 && g.product ? `<button class="btn-outline" onclick="addProductToRestock('${g.productId}', ${Math.max(g.people.length,3)}, ${g.variantId?`'${g.variantId}'`:'null'})">${icon('package',14)} Agregar a reabasto</button>` : ''}
          <button class="btn-primary" style="width:auto;padding:8px 14px;" onclick="state.notifyModalProductId='${g.key}';render()">Avisar a ${g.people.length}</button>
        </div>
      </div>`).join('') : `<div class="empty-state">Nadie pendiente por avisar en este momento.</div>`}
  </div>`;
}
async function markRequestNotified(id){
  const r = state.restockRequests.find(x=>x.id===id); if(!r || r.notified) return;
  try{
    await db.collection('restockRequests').doc(id).set({notified:true, notifiedAt:new Date().toISOString()}, {merge:true});
    r.notified = true; r.notifiedAt = new Date().toISOString();
    const storeName = state.settings.storeName || 'nuestra tienda';
    const link = productShareLink(r.productId);
    const msg = `Hola ${r.name||''}! 💕 Te escribimos de ${storeName}: ya llegó "${(r.productName||'').replace(/"/g,'')}", el producto que querías. Aquí lo puedes ver: ${link}`;
    logCustomerMessage(r.phone, r.name, msg, 'restock');
  }catch(e){ console.error('No se pudo marcar como avisado', e); }
  render();
}
// Botón manual de "ya se contactó" — independiente del enlace de WhatsApp de arriba. Antes solo
// se marcaba como avisado automáticamente al abrir ese enlace, así que si Ale le avisaba a
// alguien por otro medio (llamada, en persona, un mensaje directo fuera de este botón) no había
// forma de reflejarlo aquí sin pasar por WhatsApp igual.
async function markRequestContactedManually(id){
  const r = state.restockRequests.find(x=>x.id===id); if(!r || r.notified) return;
  try{
    await db.collection('restockRequests').doc(id).set({notified:true, notifiedAt:new Date().toISOString(), notifiedManually:true}, {merge:true});
    r.notified = true; r.notifiedAt = new Date().toISOString(); r.notifiedManually = true;
  }catch(e){ console.error('No se pudo marcar como contactado', e); showToast('No se pudo marcar como contactado'); }
  render();
}
async function removeRestockRequest(id){
  if(!confirm('¿Quitar a esta persona de la lista?')) return;
  try{ await db.collection('restockRequests').doc(id).delete(); state.restockRequests = state.restockRequests.filter(x=>x.id!==id); }
  catch(e){ console.error(e); showToast('No se pudo quitar'); }
  render();
}
async function archiveStaleRestockRequests(){
  const stale = staleRestockRequests();
  if(stale.length===0) return;
  if(!confirm(`¿Archivar ${stale.length} aviso(s) de más de 60 días? Esto los elimina de la lista — no se puede deshacer.`)) return;
  try{
    for(let i=0;i<stale.length;i+=400){
      const batch = db.batch();
      stale.slice(i,i+400).forEach(r=>batch.delete(db.collection('restockRequests').doc(r.id)));
      await batch.commit();
    }
  }catch(e){ console.error('No se pudieron archivar los avisos de reabasto', e); showToast('No se pudo archivar'); return; }
  const staleIds = new Set(stale.map(r=>r.id));
  state.restockRequests = state.restockRequests.filter(r=>!staleIds.has(r.id));
  showToast(`${stale.length} aviso(s) archivado(s)`);
  render();
}

function attrEnc(s){ return encodeURIComponent(s).replace(/'/g,'%27'); }
function computeSearchMisses(days){
  const since = Date.now() - days*86400000;
  const map = {};
  state.searchMisses.forEach(m=>{
    if(m.quiz || /^\[Quiz\]/.test(m.query||'')) return;
    if(new Date(m.date).getTime() < since) return;
    const k = m.normalized || (m.query||'').toLowerCase();
    const e = map[k] || (map[k] = {term:m.query, normalized:k, count:0, last:m.date, ids:[]});
    e.count++; e.ids.push(m.id);
    if(m.date > e.last) e.last = m.date;
  });
  return Object.values(map).sort((a,b)=>b.count-a.count || (b.last>a.last?1:-1));
}
async function dismissSearchMiss(normalized){
  const ids = state.searchMisses.filter(m=>(m.normalized||(m.query||'').toLowerCase())===normalized).map(m=>m.id);
  if(!ids.length) return;
  try{
    for(let i=0;i<ids.length;i+=400){
      const batch = db.batch();
      ids.slice(i,i+400).forEach(id=>batch.delete(db.collection('searchMisses').doc(id)));
      await batch.commit();
    }
    state.searchMisses = state.searchMisses.filter(m=>!ids.includes(m.id));
  }catch(e){ console.error(e); showToast('No se pudo descartar'); }
  render();
}

/* ============== ENCUESTA DE CARRITO ABANDONADO (vista de resultados) ==============
   Agrupa las respuestas de "¿por qué no completaste tu compra?" por motivo, para ver de un
   vistazo cuál es la razón más común, y deja la lista de respuestas recientes con el contexto
   del carrito (total y número de artículos) que traían al momento de abandonarlo. Son anónimas:
   nunca se guarda nombre, teléfono ni ningún otro dato de quien responde. */
function computeCartAbandonSurveyStats(){
  const rows = state.cartAbandonSurveys || [];
  const byReason = {};
  rows.forEach(r=>{ const key = r.reason || 'Sin especificar'; byReason[key] = (byReason[key]||0) + 1; });
  const total = rows.length;
  const breakdown = Object.entries(byReason).map(([reason,count])=>({reason, count, pct: total? (count/total*100) : 0})).sort((a,b)=>b.count-a.count);
  const recent = [...rows].sort((a,b)=> new Date(b.date) - new Date(a.date)).slice(0,50);
  return { total, breakdown, recent };
}
function clearCartAbandonSurveys(){
  if(!confirm('¿Borrar todas las respuestas de la encuesta de carrito abandonado? Esta acción no se puede deshacer.')) return;
  const ids = state.cartAbandonSurveys.map(r=>r.id);
  const batch = db.batch();
  ids.slice(0,400).forEach(id=>batch.delete(db.collection('cartAbandonSurveys').doc(id)));
  batch.commit().then(()=>{
    state.cartAbandonSurveys = [];
    showToast('Respuestas borradas'); render();
  });
}
function renderStatsCarritoAbandonado(){
  const { total, breakdown, recent } = computeCartAbandonSurveyStats();
  return `
    <div class="panel-title" style="margin-bottom:4px;">Encuesta de carrito abandonado</div>
    <div class="panel-sub" style="margin-bottom:12px;">Cuando alguien cierra su carrito sin pasar a pagar, se le pregunta una sola vez por sesión por qué — de forma opcional y anónima. Aquí ves las razones más comunes.</div>

/* ============== DEVOLUCIÓN DE UN PEDIDO / VENTA ==============
   El cliente regresa piezas de un pedido ya entregado (o de una venta del POS). Cada pieza vuelve al
   inventario del centro del que salió (buen estado) o se da de baja como merma (dañada). Queda anotado
   en el pedido y en "Cambios de producto"; si luego se cancela el pedido, no se restaura dos veces. */
function orderReturnedQty(o, idx){ let n=0; (o.returns||[]).forEach(r=>(r.items||[]).forEach(i=>{ if(i.idx===idx) n+=(i.qty||0); })); return n; }
function orderCanReturn(o){
  if(!o || o.status==='Cancelado') return false;
  if(o.source==='pos') return true;
  return o.status==='Entregado' && !!o.stockDeducted;
}
function openReturnModal(orderId){
  const o = state.orders.find(x=>x.id===orderId); if(!o) return;
  state.returnModal = {orderId, qty:{}, condition:'bueno', reason:'', method:'Efectivo', refund:'', busy:false};
  render();
}
function closeReturnModal(){ state.returnModal = null; render(); }
function returnRefundAuto(){
  const m = state.returnModal; const o = state.orders.find(x=>x.id===m.orderId); if(!o) return 0;
  return (o.items||[]).reduce((s,it,idx)=>s + (Number(m.qty[idx])||0)*(Number(it.price)||0), 0);
}
function setReturnQty(idx, v){
  const m = state.returnModal; const o = state.orders.find(x=>x.id===m.orderId); if(!o) return;
  const it = (o.items||[])[idx]; const max = Math.max(0,(it.qty||0) - orderReturnedQty(o, idx));
  m.qty[idx] = Math.max(0, Math.min(max, Math.floor(Number(v)||0)));
  render();
}
async function confirmOrderReturn(){
  const m = state.returnModal; if(!m || m.busy) return;
  const o = state.orders.find(x=>x.id===m.orderId); if(!o) return;
  const items = (o.items||[]).map((it,idx)=>({it,idx,qty:Number(m.qty[idx])||0})).filter(x=>x.qty>0 && x.it.id && x.it.id!=='promo_buyxpayy');
  if(!items.length){ showToast('Elige cuántas piezas regresan'); return; }
  const refund = m.refund!=='' ? Math.max(0, Number(m.refund)||0) : returnRefundAuto();
  const toStock = m.condition!=='merma';
  const centerId = o.source==='pos' ? o.centerId : (o.stockCenterId || defaultCenterId());
  const center = state.centers.find(c=>c.id===centerId);
  const retItems = items.map(x=>({idx:x.idx, id:x.it.id, variantId:x.it.variantId||null, name:x.it.name, qty:x.qty, price:x.it.price}));
  m.busy = true; render();
  try{
    if(toStock){
      await adjustStockForSale({centerId, orderNumber:o.orderNumber}, 1, {kind:o.source==='pos'?'pos':'tienda', itemsOverride: items.map(x=>({...x.it, qty:x.qty})), logType:'devolucion_cliente', logNote:`Devolución ${formatFolio(o.orderNumber)}${m.reason?' — '+m.reason:''}`});
    }else{
      for(const x of items){
        const p = state.products.find(q=>q.id===x.it.id);
        const v = p && x.it.variantId ? (p.variants||[]).find(q=>q.id===x.it.variantId) : null;
        const unitCost = (v && Number(v.cost)>0) ? Number(v.cost) : ((p&&p.cost)||0);
        const rec = {date:new Date().toISOString(), productId:x.it.id, productName:x.it.name, variantId:x.it.variantId||null, qty:x.qty, reason:'Devuelto dañado', note:m.reason||`Devolución ${formatFolio(o.orderNumber)}`, centerId:centerId||null, centerName:center?center.name:'', unitCost, totalCost:unitCost*x.qty, user:state.user?state.user.email:'', source:'admin_devolucion'};
        const ref = await db.collection('shrinkage').add(rec); state.shrinkage.unshift({id:ref.id, ...rec});
      }
    }
    const ret = {date:new Date().toISOString(), items:retItems, condition:toStock?'bueno':'merma', reason:m.reason||'', refund, method:refund?m.method:'', by:state.user?state.user.email:''};
    await db.collection('orders').doc(o.id).update({returns: firebase.firestore.FieldValue.arrayUnion(ret)});
    if(!o.returns) o.returns = []; o.returns.push(ret);
    const ex = {type:'devolucion', source:'admin', date:ret.date, centerId:centerId||null, centerName:center?center.name:'', cashierName:state.user?state.user.email:'', orderNumber:o.orderNumber,
      outProduct:{name:retItems.map(i=>`${i.qty}× ${i.name}`).join(', '), qty:retItems.reduce((s,i)=>s+i.qty,0)}, inProduct:null, priceDifference:-refund, condition:ret.condition, reason:ret.reason, method:ret.method};
    const er = await db.collection('productExchanges').add(ex); state.productExchanges.unshift({id:er.id, ...ex});
    logAdminAction('devolucion','pedido',formatFolio(o.orderNumber),`${retItems.reduce((s,i)=>s+i.qty,0)} pza · ${toStock?'al inventario':'a merma'} · reembolso ${money(refund)}`, o.id);
    state.returnModal = null;
    showToast(toStock ? 'Devolución registrada y piezas regresadas al inventario' : 'Devolución registrada; las piezas se dieron de baja como merma');
    render();
  }catch(e){ console.error(e); if(state.returnModal) state.returnModal.busy=false; showToast('No se pudo registrar la devolución'); render(); }
}

/* ============== CAMBIOS DE PRODUCTO (POS) ==============
   Cada vez que en el POS se usa "Cambio de producto" (el cliente regresa uno y se lleva otro),
   se guarda un registro completo del cambio -- esto ya pasaba desde hace tiempo, pero ningún
   lugar de Admin lo mostraba todavía (el ajuste de stock sí quedaba en el historial del
   producto, pero el cambio en sí, con ambos productos y la diferencia de precio, no se veía en
   ningún lado). Se agrega aquí: total de cambios, cuánto se ha cobrado de más / regresado de
   menos en total, y el detalle de cada cambio reciente. */
function computeProductExchangeStats(days){
  const since = days ? Date.now() - days*86400000 : 0;
  const rows = (state.productExchanges||[]).filter(r=> new Date(r.date).getTime() >= since);
  const total = rows.length;
  let extraCharged = 0, refunded = 0, returns = 0, toShrink = 0;
  rows.forEach(r=>{ const d = r.priceDifference||0; if(d>0) extraCharged += d; else refunded += -d; if(r.type==='devolucion') returns++; if(r.condition==='merma') toShrink++; });
  const recent = [...rows].sort((a,b)=> new Date(b.date) - new Date(a.date)).slice(0,100);
  return { total, extraCharged, refunded, recent, returns, toShrink };
}
function renderStatsCambiosProducto(){

    <div class="panel-sub" style="margin-bottom:12px;">Devoluciones de dinero y cambios de producto hechos en el POS o desde un pedido. Cuando en el POS se regresa un producto y se lleva otro distinto ("Devolución o cambio"), el cambio queda registrado aquí con ambos productos, quién lo hizo y la diferencia de precio.</div>

    ${total===0 ? `<div class="empty-state">No hay cambios de producto registrados en este periodo.</div>` : `

        <div><div class="panel-sub">Piezas a merma</div><div style="font-size:20px;font-weight:700;">${toShrink}</div></div>

        return `

            <div class="row-sub">${diffLabel} · ${r.cashierName||'—'}${center?' · '+center.name:''} · ${r.date?new Date(r.date).toLocaleDateString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</div>

/* ============== REPORTE DE HORAS PICO POR CAJERO ==============
   Cruza los turnos de caja (apertura/cierre, quién y cuándo) con las ventas del Punto de Venta
   para saber, hora por hora, cuánta gente estuvo atendiendo contra cuánto se vendió en esa
   hora — así se ve si hay horas de mucha venta con poco personal (o al revés). También arma un
   ranking por cajero: horas trabajadas, ventas atendidas y su "ritmo" (ventas por hora). Las
   horas de un turno se reparten en fracciones si cruzan de una hora a otra, para que el reparto
   sea exacto y no solo redondeado a la hora de apertura. */
function computeCashierPeakHours(days){
  days = days || 30;
  const periodStart = new Date(Date.now() - days*86400000);
  const periodEnd = new Date();
  const staffedHours = Array(24).fill(0);
  const byCashier = {};
  const ensureCashier = (name) => byCashier[name] || (byCashier[name] = {name, hoursWorked:0, sales:0, revenue:0});
  state.cashRegisters.forEach(r=>{
    if(!r.openedAt) return;
    const start = new Date(Math.max(new Date(r.openedAt).getTime(), periodStart.getTime()));
    const endRaw = r.closedAt ? new Date(r.closedAt) : new Date();
    const end = new Date(Math.min(endRaw.getTime(), periodEnd.getTime()));
    if(!(end > start)) return;
    const cashier = ensureCashier(r.cashierName || 'Sin nombre');
    let cursor = new Date(start);
    while(cursor < end){
      const nextHourBoundary = new Date(cursor); nextHourBoundary.setMinutes(0,0,0); nextHourBoundary.setHours(nextHourBoundary.getHours()+1);
      const segEnd = new Date(Math.min(nextHourBoundary.getTime(), end.getTime()));
      const fraction = (segEnd.getTime() - cursor.getTime()) / 3600000;
      staffedHours[cursor.getHours()] += fraction;
      cashier.hoursWorked += fraction;
      cursor = segEnd;
    }
  });
  const salesByHour = Array(24).fill(0);
  const revenueByHour = Array(24).fill(0);
  state.orders.forEach(o=>{
    if(o.source!=='pos' || o.status==='Cancelado' || !o.date) return;
    const d = new Date(o.date);
    if(d < periodStart || d > periodEnd) return;
    salesByHour[d.getHours()] += 1;
    revenueByHour[d.getHours()] += (o.total||0);
    const cashier = ensureCashier(o.cashierName || 'Sin nombre');
    cashier.sales += 1; cashier.revenue += (o.total||0);
  });
  const hourly = [];
  for(let h=0; h<24; h++){
    const staffed = staffedHours[h], sales = salesByHour[h];
    hourly.push({ hour:h, staffedHours: staffed, sales, revenue: revenueByHour[h], salesPerStaffHour: staffed>0 ? sales/staffed : null });
  }
  const busiestUnderstaffed = hourly.filter(h=>h.salesPerStaffHour!==null && h.sales>0).sort((a,b)=>b.salesPerStaffHour-a.salesPerStaffHour).slice(0,3);
  const cashierRows = Object.values(byCashier)
    .map(c=>({...c, salesPerHour: c.hoursWorked>0 ? c.sales/c.hoursWorked : null}))
    .sort((a,b)=>b.sales-a.sales);
  const maxSales = Math.max(1, ...hourly.map(h=>h.sales));
  return { hourly, cashierRows, busiestUnderstaffed, maxSales };
}

/* ============== EMBUDO DE CONVERSIÓN POR PRODUCTO ==============
   Ya existía computeFunnel() (vistas → carrito → compra a nivel de TODA la tienda). Esto es lo
   mismo pero desglosado producto por producto, cruzando los eventos de analítica que ya se
   registran (product_view, add_to_cart, ambos con productId) con lo realmente comprado según
   las líneas de cada pedido — para ver en qué producto en particular se pierden más ventas y en
   qué paso (¿no le da clic para verlo?, ¿lo ve pero no lo agrega?, ¿lo agrega pero no compra?). */
function computeProductFunnel(days){
  days = days || 30;
  const since = Date.now() - days*86400000;
  const viewsById = {}, addsById = {}, purchasesById = {};
  (state.analyticsEvents||[]).forEach(e=>{
    if(!e.productId || !e.date) return;
    if(new Date(e.date).getTime() < since) return;
    if(e.type==='product_view') viewsById[e.productId] = (viewsById[e.productId]||0) + 1;
    if(e.type==='add_to_cart') addsById[e.productId] = (addsById[e.productId]||0) + 1;
  });
  state.orders.forEach(o=>{
    if(o.status==='Cancelado' || !o.date) return;
    if(new Date(o.date).getTime() < since) return;
    (o.items||[]).forEach(it=>{
      if(!it.id || it.id==='promo_buyxpayy') return;
      purchasesById[it.id] = (purchasesById[it.id]||0) + (it.qty||1);
    });
  });
  const ids = new Set([...Object.keys(viewsById), ...Object.keys(addsById), ...Object.keys(purchasesById)]);
  const pct = (a,b) => b>0 ? Math.round((a/b)*100) : 0;
  return Array.from(ids).map(id=>{
    const product = state.products.find(p=>p.id===id);
    const views = viewsById[id]||0, adds = addsById[id]||0, purchases = purchasesById[id]||0;
    return {
      id, name: product ? product.name : '(producto ya no existe)', views, adds, purchases,
      viewToCartPct: pct(adds, views), cartToPurchasePct: pct(purchases, adds), overallPct: pct(purchases, views),
    };
  }).filter(r=>r.views>0 || r.adds>0 || r.purchases>0).sort((a,b)=>b.views-a.views);
}
function renderStatsEmbudoProducto(){
  const days = state.funnelProductDays || 30;
  const rows = computeProductFunnel(days);
  return `
    <div class="panel-title" style="margin-bottom:4px;">Embudo de conversión por producto</div>
    <div class="panel-sub" style="margin-bottom:12px;">Cuántas personas vieron cada producto, cuántas lo agregaron al carrito y cuántas finalmente lo compraron — para saber en qué paso se pierden las ventas de un producto en particular (¿la foto o el precio no convencen? ¿se agrega pero no se completa la compra?).</div>

/* ============== MEJOR HORA PARA PUBLICAR EN REDES ==============
   Reutiliza el mismo tipo de cruce día-de-semana × hora que ya usa el mapa de calor de ventas,
   pero sobre las VISITAS a la tienda (state.visits) en vez de las ventas — para saber cuándo
   entra más gente a mirar el catálogo y, con eso, sugerir la mejor ventana para publicar en
   redes (una publicación llega más fresca a la gente si coincide con cuándo de por sí ya suele
   entrar a la tienda). No mide nada de Instagram/Facebook directamente — es una aproximación a
   partir del tráfico que si se puede medir. */
function computeVisitHeatmap(days){
  days = days || 90;
  const since = Date.now() - days*86400000;
  const grid = Array.from({length:7}, ()=>Array(24).fill(0));
  (state.visits||[]).forEach(v=>{
    if(!v.date) return;
    const d = new Date(v.date);
    if(isNaN(d.getTime()) || d.getTime() < since) return;
    const day = (d.getDay()+6)%7, hour = d.getHours();
    grid[day][hour] += 1;
  });
  let max = 0, total = 0; const cells = [];
  for(let di=0; di<7; di++) for(let h=0; h<24; h++){
    const v = grid[di][h];
    if(v>max) max = v;
    total += v;
    if(v>0) cells.push({day:di, hour:h, value:v});
  }
  cells.sort((a,b)=>b.value-a.value);
  return {grid, max, total, cells, top: cells.slice(0,3)};
}

/* ================================================================
   CAMBIO MASIVO DE PRECIOS (con vista previa y deshacer)
   ================================================================ */
function getFilteredProducts(){
  const q = (state.productSearch||'').trim().toLowerCase();
  const catFilter = state.productCatFilter || 'Todas';
  const needFilter = state.productNeedFilter || 'Todas';
  let f = state.products;
  if(q) f = searchProducts(q, f);
  if(catFilter!=='Todas') f = f.filter(p => (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).includes(catFilter));
  if(needFilter!=='Todas') f = f.filter(p => (p.needs||[]).includes(needFilter));
  return f;
}
function selectAllFilteredProducts(){ state.selectedProducts = getFilteredProducts().map(p=>p.id); render(); }
function roundPriceTo(v, mode){
  if(mode==='0') return Math.round(v*100)/100;
  const step = Number(mode);
  return Math.max(step, Math.round(v/step)*step);
}
// Igual que el filtro de precio de la tienda: este campo necesita re-renderizar en cada tecla
// para actualizar la vista previa (precio promedio, lista de antes/después), y ese render()
// reconstruye el input desde cero. Al ser type="number", la restauración genérica de foco
// (captureFocusState/restoreFocusState) no alcanza a restaurar la posición del cursor — por
// eso se usa type="text" aquí y se repone el cursor a mano después de renderizar.
function setMassPricePercent(val){
  state.massPricePercent = val; render();
  const i = document.getElementById('mp-percent');
  if(i){ i.focus(); const pos = String(val).length; i.setSelectionRange(pos,pos); }
}
function massPriceValid(){
  const pct = Number(state.massPricePercent);
  return state.massPricePercent!=='' && isFinite(pct) && pct!==0 && pct>=-90 && pct<=300;
}
function computeMassPricePreview(){
  if(!massPriceValid()) return [];
  const pct = Number(state.massPricePercent);
  const factor = 1 + pct/100;
  const mode = state.massPriceRounding;
  const step = mode==='0' ? 1 : Number(mode);
  return (state.selectedProducts||[]).map(id=>state.products.find(p=>p.id===id)).filter(p=>p && p.price>0).map(p=>{
    const newPrice = roundPriceTo(p.price*factor, mode);
    let newPromo = p.promoPrice||0;
    if(state.massPriceIncludePromo && p.promoPrice>0){
      newPromo = roundPriceTo(p.promoPrice*factor, mode);
      if(newPromo >= newPrice) newPromo = Math.max(0, newPrice - step);
    }
    return {id:p.id, name:p.name, oldPrice:p.price, newPrice, oldPromo:p.promoPrice||0, newPromo};
  });
}
function openMassPriceModal(){
  state.massPriceModalOpen = true; state.massPricePercent = ''; state.massPriceRounding = '0'; state.massPriceIncludePromo = true;
  render();
}
function closeMassPriceModal(){ state.massPriceModalOpen = false; render(); }
async function applyMassPriceChange(){
  const preview = computeMassPricePreview();
  if(!preview.length){ showToast('Escribe un porcentaje válido (entre -90 y 300, distinto de 0)'); return; }
  const pct = Number(state.massPricePercent);
  if(!confirm(`¿Cambiar el precio de ${preview.length} producto(s) en ${pct>0?'+':''}${pct}%? Podrás deshacerlo después.`)) return;
  try{
    for(let i=0;i<preview.length;i+=200){
      const chunk = preview.slice(i,i+200);
      const batch = db.batch();
      chunk.forEach(it=>{
        batch.update(db.collection('products').doc(it.id), {price:it.newPrice, promoPrice:it.newPromo});
        batch.set(db.collection('adminAuditLog').doc(), {
          action:'cambio_precio', targetType:'producto', targetName:it.name, targetId:it.id,
          details:`Precio: ${money(it.oldPrice)} → ${money(it.newPrice)} (cambio masivo ${pct>0?'+':''}${pct}%)`,
          userEmail: state.user ? state.user.email : '', date: new Date().toISOString(),
        });
      });
      await batch.commit();
      chunk.forEach(it=>{ const p = state.products.find(x=>x.id===it.id); if(p){ p.price = it.newPrice; p.promoPrice = it.newPromo; } });
    }
    const rec = {date:new Date().toISOString(), percent:pct, rounding:state.massPriceRounding, includePromo:state.massPriceIncludePromo, undone:false, user: state.user ? state.user.email : '', items: preview};
    const ref = await db.collection('priceChangeBatches').add(rec);
    state.priceChangeBatches.unshift({id:ref.id, ...rec});
    logAdminAction('cambio_precio_masivo', 'productos', `${preview.length} producto(s)`, `${pct>0?'+':''}${pct}%`);
    state.selectedProducts = []; state.massPriceModalOpen = false;
    showToast(`Precios actualizados en ${preview.length} producto(s)`);
    render();
  }catch(e){ console.error('No se pudo aplicar el cambio de precios', e); showToast('No se pudo completar el cambio; revisa y vuelve a intentar'); }
}
// Solo revierte los productos cuyo precio sigue siendo el que dejó el cambio masivo — si alguien
// ya lo volvió a editar a mano, se respeta ese precio y solo se avisa cuántos se omitieron.
async function undoLastMassPriceChange(){
  const b = state.priceChangeBatches.find(x=>!x.undone);
  if(!b){ showToast('No hay un cambio masivo que deshacer'); return; }
  if(!confirm(`¿Deshacer el último cambio masivo (${b.percent>0?'+':''}${b.percent}%, ${b.items.length} producto(s))?`)) return;
  let reverted = 0, skipped = 0;
  try{
    const todo = [];
    b.items.forEach(it=>{ const p = state.products.find(x=>x.id===it.id); if(p && p.price===it.newPrice) todo.push({it,p}); else skipped++; });
    for(let i=0;i<todo.length;i+=200){
      const chunk = todo.slice(i,i+200);
      const batch = db.batch();
      chunk.forEach(({it})=>{
        batch.update(db.collection('products').doc(it.id), {price:it.oldPrice, promoPrice:it.oldPromo||0});
        batch.set(db.collection('adminAuditLog').doc(), {

/* ================================================================
   CALENDARIO DE TEMPORADAS
   ================================================================ */
const BUILTIN_SEASONS = [
  {key:'sanvalentin', name:'San Valentín', rule:{type:'fixed', month:2, day:14}, prepDays:35},
  {key:'madres', name:'Día de las Madres', rule:{type:'fixed', month:5, day:10}, prepDays:30},
  {key:'padres', name:'Día del Padre', rule:{type:'nth', month:6, weekday:0, nth:3}, prepDays:30},
  {key:'halloween', name:'Halloween', rule:{type:'fixed', month:10, day:31}, prepDays:30},
  {key:'buenfin', name:'El Buen Fin (fecha aproximada)', rule:{type:'nth', month:11, weekday:1, nth:3}, prepDays:35},
  {key:'navidad', name:'Navidad', rule:{type:'fixed', month:12, day:24}, prepDays:40},
];
function nthWeekdayOfMonth(year, month, weekday, nth){
  const first = new Date(year, month-1, 1);
  const offset = (weekday - first.getDay() + 7) % 7;
  return new Date(year, month-1, 1 + offset + (nth-1)*7);
}
function seasonDateForYear(ev, year){
  return ev.rule.type==='fixed' ? new Date(year, ev.rule.month-1, ev.rule.day) : nthWeekdayOfMonth(year, ev.rule.month, ev.rule.weekday, ev.rule.nth);
}
function customSeasonToEvent(c){ return {key:'c_'+c.id, id:c.id, name:c.name, rule:{type:'fixed', month:c.month, day:c.day}, prepDays:30, custom:true}; }
function allSeasonEvents(includeHidden){
  const hidden = state.settings.seasonHidden || [];
  const builtin = BUILTIN_SEASONS.filter(e=>includeHidden || !hidden.includes(e.key));
  return [...builtin, ...(state.settings.seasonCustomEvents||[]).map(customSeasonToEvent)];
}
function nextSeasonOccurrence(ev, from){
  from = from || new Date();
  const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  let d = seasonDateForYear(ev, today.getFullYear());
  if(d < today) d = seasonDateForYear(ev, today.getFullYear()+1);
  return d;
}
// Lo vendido "por estas fechas" el año pasado: del día 7 antes al día siguiente de la fecha.
function seasonLastYearStats(ev, occurrence){
  const ly = seasonDateForYear(ev, occurrence.getFullYear()-1);
  const start = new Date(ly.getFullYear(), ly.getMonth(), ly.getDate()-7);
  const end = new Date(ly.getFullYear(), ly.getMonth(), ly.getDate()+2);
  let revenue = 0, count = 0; const units = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const d = new Date(o.date);
    if(isNaN(d.getTime()) || d<start || d>=end) return;
    revenue += (o.total||0); count++;
    (o.items||[]).forEach(it=>{ if(!it.name) return; const n = it.name.replace(/\s*\(.*\)$/,''); units[n] = (units[n]||0)+(it.qty||0); });
  });
  const top = Object.entries(units).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([name,qty])=>({name,qty}));
  return {revenue, count, top, hasData: count>0};
}
/* ---- Reabasto anticipado para una temporada ----
   Mira lo que se vendió de cada producto en las 2 semanas previas a la misma fecha del año
   pasado (por id; si el historial importado no trae id, por nombre sin variante), lo ajusta por
   cuánto ha crecido o bajado la venta de los últimos 90 días contra el mismo periodo del año
   pasado (entre 0.7x y 1.5x) y sugiere cuánto reponer para llegar con inventario. */
function seasonNormName(n){ return String(n||'').replace(/\s*\(.*\)$/,'').trim().toLowerCase(); }
function seasonGrowthFactor(){
  const now = new Date();
  const a0 = new Date(now); a0.setDate(a0.getDate()-90);
  const b1 = new Date(now); b1.setFullYear(b1.getFullYear()-1);
  const b0 = new Date(a0); b0.setFullYear(b0.getFullYear()-1);
  let cur=0, prev=0, prevN=0;
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const d = new Date(o.date); if(isNaN(d.getTime())) return;
    if(d>=a0 && d<=now) cur += (o.total||0);
    else if(d>=b0 && d<=b1){ prev += (o.total||0); prevN++; }
  });
  if(prevN<10 || prev<=0) return {factor:1, known:false};
  return {factor: Math.max(0.7, Math.min(1.5, cur/prev)), known:true};
}
function computeSeasonRestock(ev, occurrence){
  const ly = seasonDateForYear(ev, occurrence.getFullYear()-1);
  const start = new Date(ly.getFullYear(), ly.getMonth(), ly.getDate()-14);
  const end = new Date(ly.getFullYear(), ly.getMonth(), ly.getDate()+2);
  const byId = {}, byName = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const d = new Date(o.date); if(isNaN(d.getTime()) || d<start || d>=end) return;
    (o.items||[]).forEach(it=>{
      if(it.id==='promo_buyxpayy' || !(it.price>0)) return;
      if(it.id) byId[it.id] = (byId[it.id]||0) + (it.qty||0);
      else if(it.name){ const k = seasonNormName(it.name); byName[k] = (byName[k]||0) + (it.qty||0); }
    });
  });
  const g = seasonGrowthFactor();
  const nameToProduct = {};
  state.products.forEach(p=>{ const k = seasonNormName(p.name); if(k && !nameToProduct[k]) nameToProduct[k] = p; });
  const units = {};
  Object.keys(byId).forEach(id=>{ units[id] = (units[id]||0) + byId[id]; });
  Object.keys(byName).forEach(k=>{ const p = nameToProduct[k]; if(p) units[p.id] = (units[p.id]||0) + byName[k]; });
  const rows = [];
  state.products.forEach(p=>{
    const u = units[p.id]; if(!u || p.isKit) return;
    const need = Math.ceil(u*g.factor);
    const stock = totalStock(p);
    const suggested = need - stock;
    if(suggested>0) rows.push({id:p.id, name:p.name, lastYear:u, need, stock, suggested, inList: !!state.restockItems.find(r=>r.productId===p.id)});
  });
  rows.sort((a,b)=>b.suggested-a.suggested);
  return {rows, growth:g};
}
// La temporada más cercana que ya está en etapa de preparación (o a menos de 60 días) y tiene qué reponer.
function nextSeasonRestockPlan(){
  const cand = computeUpcomingSeasons(6).filter(x=>x.daysLeft<=Math.max(x.ev.prepDays,60));
  for(const x of cand){
    const r = computeSeasonRestock(x.ev, x.date);
    if(r.rows.length) return {season:x, ...r};
  }
  return null;
}

    ${rows.map(r=>`<div class="season-restock-row">

function computeUpcomingSeasons(limit, includeHidden){
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return allSeasonEvents(includeHidden).map(ev=>{
    const date = nextSeasonOccurrence(ev, today);
    const daysLeft = Math.round((date - start)/86400000);
    return {ev, date, daysLeft, inPrep: daysLeft<=ev.prepDays, last: seasonLastYearStats(ev, date)};
  }).sort((a,b)=>a.daysLeft-b.daysLeft).slice(0, limit||99);
}

function defaultPostText(p){
  const promo = p.promoPrice>0 && p.promoPrice<p.price;
  const priceLine = promo ? `~${money(p.price)}~ *${money(p.promoPrice)}*` : `*${money(p.price)}*`;
  return `✨ ${p.name}\n${priceLine}\n\nEnvío discreto y pago contra entrega 💕\n👉 ${productShareLink(p.id)}`;
}
function openPostModal(id){

const postImgCache = {};
function loadPostImage(src){
  return new Promise(resolve=>{
    if(!src) return resolve(null);
    if(postImgCache[src]) return resolve(postImgCache[src]);
    const im = new Image();
    im.onload = ()=>{ postImgCache[src] = im; resolve(im); };
    im.onerror = ()=>resolve(null);
    im.src = src;
  });
}
function postRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
}
function postWrapText(ctx, text, maxW, maxLines){
  const words = String(text).split(/\s+/); const lines = []; let line = '';
  words.forEach(w=>{ const test = line ? line+' '+w : w; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line = w; } else line = test; });
  if(line) lines.push(line);
  if(lines.length>maxLines){ const cut = lines.slice(0,maxLines); cut[maxLines-1] = cut[maxLines-1].replace(/\s*\S*$/,'')+'…'; return cut; }
  return lines;
}
// Dibuja la tarjeta vertical (1080×1920, el formato de los estados) en el <canvas>. Como cada
// render() reconstruye el DOM, esta función se vuelve a llamar después de cada render.
async function drawPostCanvas(){
  const canvas = document.getElementById('post-canvas'); if(!canvas) return;
  const p = state.products.find(x=>x.id===state.postModalProductId); if(!p) return;
  const W = 1080, H = 1920;
  canvas.width = W; canvas.height = H;
  let ctx = null; try{ ctx = canvas.getContext('2d'); }catch(e){ ctx = null; }
  if(!ctx) return;
  const [img, logo] = await Promise.all([loadPostImage((p.images||[])[state.postImageIdx||0]), loadPostImage(state.settings.logoUrl)]);
  if(document.getElementById('post-canvas') !== canvas) return; // la pantalla se reconstruyó mientras cargaba la foto: la nueva versión se dibuja sola
  const FONT = 'Poppins, Inter, Arial, sans-serif';
  const g = ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#4A1642'); g.addColorStop(1,'#993477');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 0.08; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(W-80,220,300,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60,H-320,260,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  let hx = 90;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  if(logo){ ctx.save(); ctx.beginPath(); ctx.arc(hx+55,150,55,0,Math.PI*2); ctx.clip(); ctx.drawImage(logo,hx,95,110,110); ctx.restore(); hx += 135; }
  ctx.fillStyle = '#fff'; ctx.font = `700 48px ${FONT}`;
  ctx.fillText(state.settings.storeName || '', hx, 150);
  const ix = 90, iy = 290, is = 900;
  postRoundRect(ctx, ix-12, iy-12, is+24, is+24, 60); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.save(); postRoundRect(ctx, ix, iy, is, is, 48); ctx.clip();
  if(img){ const s = Math.min(img.width, img.height); ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,ix,iy,is,is); }
  else { ctx.fillStyle = '#F6E9E6'; ctx.fillRect(ix,iy,is,is); ctx.fillStyle = '#993477'; ctx.font = `700 360px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText((p.name||'?').charAt(0).toUpperCase(), ix+is/2, iy+is/2); ctx.textAlign = 'left'; }
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = `700 70px ${FONT}`; ctx.textBaseline = 'alphabetic';
  const lines = postWrapText(ctx, p.name||'', 900, 3);
  let y = 1310; lines.forEach(l=>{ ctx.fillText(l, 90, y); y += 84; });
  const promo = p.promoPrice>0 && p.promoPrice<p.price;
  const priceText = money(promo ? p.promoPrice : p.price);
  ctx.font = `800 92px ${FONT}`;
  const pw = Math.max(320, ctx.measureText(priceText).width + 90);
  y += 10;
  postRoundRect(ctx, 90, y, pw, 130, 65); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#993477'; ctx.textBaseline = 'middle'; ctx.fillText(priceText, 135, y+68);
  if(promo){
    ctx.font = `600 50px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const old = money(p.price), ox = 90+pw+30;
    ctx.fillText(old, ox, y+68);
    const w = ctx.measureText(old).width;
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(ox,y+68); ctx.lineTo(ox+w,y+68); ctx.stroke();
  }
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = `500 40px ${FONT}`;
  ctx.fillText('Envío discreto · Pago contra entrega', W/2, H-150);
  ctx.textAlign = 'left';
}

async function deleteCustomerProfile(id){
  const prof = state.customers.find(c=>c.id===id);
  try{
    const backup = prof ? (()=>{ const c={...prof}; delete c.id; return c; })() : null;
    await db.collection('customers').doc(id).delete();
    state.customers = state.customers.filter(c=>c.id!==id);
    render();
    if(backup) showUndo('Perfil de cliente eliminado (su historial de compras no se borra)', async()=>{
      await db.collection('customers').doc(id).set(backup);
      state.customers = [{id, ...backup}, ...state.customers];
      showToast('Perfil recuperado'); render();
    });
    else showToast('Perfil eliminado');
  }catch(e){ console.error(e); showToast('No se pudo eliminar'); }
}
function exportCustomersCSV(){
  const list = filteredCustomers();
  const rows = [['nombre','telefono','email','direccion','ciudad','estado','pais','ultima_compra','total_consumido','numero_de_compras','notas']];
  list.forEach(c=>rows.push([c.name, c.phone, c.email, c.address||'', c.city, c.state, c.country, c.lastDate?new Date(c.lastDate).toLocaleDateString('es-MX'):'', c.totalSpent, c.purchaseCount, c.notes||'']));
  const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='clientes.csv'; a.click();
  URL.revokeObjectURL(url);
  logAdminAction('exportacion', 'clientes', `${list.length} cliente(s)`);
}
function parseCustomerCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const header = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/"/g,''));
  const idx = (name)=>header.findIndex(h=>h.includes(name));
  const iName=idx('nombre'), iPhone=idx('telefono'), iEmail=idx('email')>=0?idx('email'):idx('correo'), iAddress=idx('direcc'), iCity=idx('ciudad'), iState=idx('estado'), iCountry=idx('pais'), iNotes=idx('notas');
  return lines.slice(1).map(line=>{
    const cols = line.match(/(".*?"|[^,]+)(?=,|$)/g)||[];
    const clean = i => i>=0 && cols[i] ? cols[i].replace(/^"|"$/g,'').replace(/""/g,'"').trim() : '';
    return { name:clean(iName), phone:clean(iPhone), email:clean(iEmail), address:clean(iAddress), city:clean(iCity), state:clean(iState), country:clean(iCountry), notes:clean(iNotes) };
  }).filter(r=>r.name);
}

async function commitCustomerImport(){
  if(state.customerImportPreview.length===0){ showToast('No hay clientes para importar'); return; }
  try{
    const batch = db.batch();
    state.customerImportPreview.forEach(row=>{
      const existing = row.phone ? state.customers.find(c=>normalizePhone(c.phone)===normalizePhone(row.phone)) : null;
      const payload = {name:row.name, phone:row.phone||'', email:row.email||'', address:row.address||'', city:row.city||'', state:row.state||'', country:row.country||'', notes:row.notes||'', createdAt: existing?existing.createdAt:new Date().toISOString()};
      const ref = existing ? db.collection('customers').doc(existing.id) : db.collection('customers').doc();
      batch.set(ref, payload);
      if(existing) Object.assign(existing, payload); else state.customers.push({id:ref.id, ...payload});
    });
    await batch.commit();
    state.customerImportOpen=false; state.customerImportPreview=[]; state.customerImportText='';
    showToast('Clientes importados'); render();
  }catch(e){ console.error(e); showToast('Ocurrió un error al importar'); }
}

function genWholesaleCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
function openWholesaleModal(id){
  const t = id ? {...state.settings.wholesaleTiers.find(x=>x.id===id)} : {
    id: uid('wt_'), name:'', discountPercent:10, scope:'all', categories:[], productIds:[],
    minType:'amount', minValue:0, code: genWholesaleCode(), active:true,
  };
  state.wholesaleModal = t; state.wholesaleProductSearch=''; render();
}
function closeWholesaleModal(){ state.wholesaleModal=null; render(); }
function toggleWholesaleCategory(cat, checked){
  const t = state.wholesaleModal;
  if(checked){ if(!t.categories.includes(cat)) t.categories.push(cat); }
  else{ t.categories = t.categories.filter(c=>c!==cat); }
}
function toggleWholesaleProduct(pid, checked){
  const t = state.wholesaleModal;
  if(checked){ if(!t.productIds.includes(pid)) t.productIds.push(pid); }
  else{ t.productIds = t.productIds.filter(id=>id!==pid); }
}
async function saveWholesaleTier(){
  const t = state.wholesaleModal;
  const name = document.getElementById('wt-name').value.trim();
  const discountPercent = Number(document.getElementById('wt-discount').value)||0;
  const scope = document.getElementById('wt-scope').value;
  const minType = document.getElementById('wt-mintype').value;
  const minValue = Number(document.getElementById('wt-minvalue').value)||0;
  const code = document.getElementById('wt-code').value.trim().toUpperCase();
  if(!name){ showToast('Ponle un nombre a la tabla de precios'); return; }
  if(!code){ showToast('Necesita un código de acceso'); return; }
  const others = state.settings.wholesaleTiers.filter(x=>x.id!==t.id);
  if(others.some(x=>x.code===code)){ showToast('Ese código ya lo usa otra tabla, elige otro'); return; }
  const updated = {...t, name, discountPercent, scope, minType, minValue, code};
  const idx = state.settings.wholesaleTiers.findIndex(x=>x.id===t.id);
  if(idx>=0) state.settings.wholesaleTiers[idx] = updated;
  else state.settings.wholesaleTiers.push(updated);
  await saveSettings();
  state.wholesaleModal=null; showToast('Tabla de precios guardada'); render();
}
async function deleteWholesaleTier(id){
  if(!confirm('¿Eliminar esta tabla de precios de mayoreo?')) return;
  const backup = state.settings.wholesaleTiers;
  const updated = backup.filter(x=>x.id!==id);
  try{
    await db.collection('settings').doc('store').update({wholesaleTiers: updated});
    state.settings.wholesaleTiers = updated;
    showToast('Eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }
}
async function toggleWholesaleActive(id){
  const t = state.settings.wholesaleTiers.find(x=>x.id===id); if(!t) return;

}

// Clona un cupón existente como punto de partida para uno parecido — le cambia el código para
// que no choque con el original, y lo abre para editar antes de guardarlo de verdad.
function duplicateCoupon(id){
  const original = state.settings.coupons.find(x=>x.id===id);
  if(!original) return;
  let newCode = original.code + '-COPIA';
  let n = 2;
  while(state.settings.coupons.some(c=>c.code===newCode)){ newCode = `${original.code}-COPIA${n}`; n++; }
  state.couponModal = {...original, id: uid('cp_'), code: newCode};
  state.couponProductSearch = '';
  render();
}
function toggleCouponCategory(cat, checked){
  const c = state.couponModal;
  if(checked){ if(!c.categories.includes(cat)) c.categories.push(cat); }
  else{ c.categories = c.categories.filter(x=>x!==cat); }
}
function toggleCouponProduct(pid, checked){

  else{ c.productIds = c.productIds.filter(id=>id!==pid); }

async function saveCoupon(){
  const c = state.couponModal;

  const discountPercent = Number(document.getElementById('cp-discount').value)||0;
  const scope = document.getElementById('cp-scope').value;
  const startDate = document.getElementById('cp-start').value;
  const endDate = document.getElementById('cp-end').value;
  const maxUses = Number(document.getElementById('cp-maxuses').value)||0;
  const singleUsePerCustomer = document.getElementById('cp-single-use').checked;
  if(!code){ showToast('Ponle un código al cupón'); return; }
  const others = state.settings.coupons.filter(x=>x.id!==c.id);
  if(others.some(x=>x.code===code)){ showToast('Ese código ya existe, elige otro'); return; }
  const updated = {...c, code, discountPercent, scope, startDate, endDate, maxUses, singleUsePerCustomer};
  const idx = state.settings.coupons.findIndex(x=>x.id===c.id);
  if(idx>=0) state.settings.coupons[idx] = updated;
  else state.settings.coupons.push(updated);
  await saveSettings();

async function deleteCoupon(id){

  const gone = before.find(x=>x.id===id);
  const updated = before.filter(x=>x.id!==id);
  try{
    await db.collection('settings').doc('store').update({coupons: updated});
    state.settings.coupons = updated;
    render();
    showUndo(`Cupón ${gone?gone.code:''} eliminado`.replace('  ',' '), async()=>{
      await db.collection('settings').doc('store').update({coupons: before});
      state.settings.coupons = before;
      showToast('Cupón recuperado'); render();

  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }

  if(c.maxUses>0 && couponUsedCount(c.code)>=c.maxUses) return {text:'Agotado', color:'#8a6b78'};

}

/* ============== PROMOCIONES ============== */
const PROMO_TYPES = {
  buyxpayy: 'Lleva X y paga Y (2x1, 3x2, etc.)',
  progressive: 'Descuento progresivo por cantidad',
  cart_discount: 'Descuento automático en el carrito',
  gift: 'Regalo automático en el carrito',
  cross_sell: 'Cross selling (descuento al comprar dos productos juntos)',
};
function openPromoModal(id){
  const p = id ? JSON.parse(JSON.stringify(state.settings.promotions.find(x=>x.id===id))) : {
    id: uid('pr_'), name:'', type:'buyxpayy', scope:'all', categories:[], productIds:[],
    startDate:'', endDate:'', active:true,
    buyQty:3, payQty:2,
    tiers:[{minQty:3, discountPercent:10},{minQty:5, discountPercent:15}],
    discountPercent:10, minAmount:0,
    giftProductId:'',
    triggerProductId:'', discountProductId:'',
  };
  state.promoModal = p; state.promoProductSearch=''; state.promoProductSearch2=''; render();
}
function closePromoModal(){ state.promoModal=null; render(); }
function duplicatePromotion(id){
  const original = state.settings.promotions.find(x=>x.id===id);
  if(!original) return;
  state.promoModal = {...JSON.parse(JSON.stringify(original)), id: uid('pr_'), name: original.name + ' (copia)', active:false};
  state.promoProductSearch=''; state.promoProductSearch2='';
  render();
}
function togglePromoCategory(cat, checked){
  const p = state.promoModal;
  if(checked){ if(!p.categories.includes(cat)) p.categories.push(cat); }
  else{ p.categories = p.categories.filter(c=>c!==cat); }
}
function togglePromoProduct(pid, checked){
  const p = state.promoModal;
  if(checked){ if(!p.productIds.includes(pid)) p.productIds.push(pid); }
  else{ p.productIds = p.productIds.filter(id=>id!==pid); }
}
function addPromoTier(){ state.promoModal.tiers.push({minQty:0, discountPercent:0}); render(); }
function removePromoTier(idx){ state.promoModal.tiers.splice(idx,1); render(); }
function setPromoTier(idx, field, value){ state.promoModal.tiers[idx][field] = Number(value)||0; }
async function savePromotion(){
  const p = state.promoModal;
  const name = document.getElementById('pr-name').value.trim();
  const type = document.getElementById('pr-type').value;
  const startDate = document.getElementById('pr-start').value;
  const endDate = document.getElementById('pr-end').value;
  if(!name){ showToast('Ponle un nombre a la promoción'); return; }
  let updated = {...p, name, type, startDate, endDate};
  if(type==='all_scope_needed_placeholder'){} // no-op, kept for clarity
  if(['buyxpayy','progressive','cart_discount'].includes(type)){
    updated.scope = document.getElementById('pr-scope').value;
  }
  if(type==='buyxpayy'){
    updated.buyQty = Number(document.getElementById('pr-buyqty').value)||1;
    updated.payQty = Number(document.getElementById('pr-payqty').value)||1;
    if(updated.payQty >= updated.buyQty){ showToast('"Pagas" debe ser menor que "Llevas"'); return; }
  }
  if(type==='cart_discount'){
    updated.discountPercent = Number(document.getElementById('pr-discount').value)||0;
    updated.minAmount = Number(document.getElementById('pr-minamount').value)||0;
  }
  if(type==='gift'){
    updated.minAmount = Number(document.getElementById('pr-gift-minamount').value)||0;
    if(!updated.giftProductId){ showToast('Elige el producto de regalo'); return; }
  }
  if(type==='cross_sell'){
    updated.discountPercent = Number(document.getElementById('pr-cross-discount').value)||0;
    if(!updated.triggerProductId || !updated.discountProductId){ showToast('Elige los dos productos'); return; }
  }
  const idx = state.settings.promotions.findIndex(x=>x.id===p.id);
  if(idx>=0) state.settings.promotions[idx] = updated;
  else state.settings.promotions.push(updated);
  await saveSettings();
  state.promoModal=null; showToast('Promoción guardada'); render();
}
async function deletePromotion(id){
  if(!confirm('¿Eliminar esta promoción?')) return;
  const updated = state.settings.promotions.filter(x=>x.id!==id);
  try{
    await db.collection('settings').doc('store').update({promotions: updated});
    state.settings.promotions = updated;
    showToast('Eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }
}
async function togglePromoActive(id){
  const p = state.settings.promotions.find(x=>x.id===id); if(!p) return;
  p.active = !p.active; await saveSettings(); render();
}
function promoSummary(p){
  if(p.type==='buyxpayy') return `Lleva ${p.buyQty} y paga ${p.payQty}`;
  if(p.type==='progressive') return (p.tiers||[]).map(t=>`${t.minQty}+: ${t.discountPercent}%`).join(' · ');
  if(p.type==='cart_discount') return `${p.discountPercent}% de descuento${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`;
  if(p.type==='gift'){ const g = state.products.find(x=>x.id===p.giftProductId); return `Regalo: ${g?g.name:'—'}${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`; }
  if(p.type==='cross_sell'){ const a=state.products.find(x=>x.id===p.triggerProductId), b=state.products.find(x=>x.id===p.discountProductId); return `${a?a.name:'—'} + ${b?b.name:'—'}: ${p.discountPercent}% en el segundo`; }
  return '';
}
// Avisa en el panel cuando el producto clave de una promoción de regalo/cruce ya no tiene
// existencias — la tienda (index.html) ya la oculta sola en ese caso (ver activeGift y
// crossSellSuggestions), pero Ale también debe verlo aquí para reponer o desactivarla.
function promoOutOfStockWarning(p){
  if(p.type==='gift'){
    const g = state.products.find(x=>x.id===p.giftProductId);
    if(g && g.stock<=0) return `El producto de regalo ("${g.name}") está agotado`;
  }
  if(p.type==='cross_sell'){
    const b = state.products.find(x=>x.id===p.discountProductId);
    if(b && b.stock<=0) return `El producto con descuento ("${b.name}") está agotado`;
  }
  return '';
}

/* ============== CAJA (aperturas/cierres del Punto de Venta) ============== */
function renderCaja(){
  const regs = state.cashRegisters;
  const centerNames = ['Todos', ...state.centers.map(c=>c.name)];
  let filtered = regs;
  if(state.cajaFilter==='abiertas') filtered = filtered.filter(r=>r.status==='abierta');
  else if(state.cajaFilter==='cerradas') filtered = filtered.filter(r=>r.status==='cerrada');
  if(state.cajaCenterFilter!=='Todos') filtered = filtered.filter(r=>r.centerName===state.cajaCenterFilter);
  const abiertas = regs.filter(r=>r.status==='abierta').length;
  const cerradas = regs.filter(r=>r.status==='cerrada');
  const conDiferencia = cerradas.filter(r=>Math.abs(r.difference||0)>0).length;
  // Una sesión cuenta como "activa ahorita" solo si su último latido llegó hace 5 minutos o
  // menos — si alguien cerró el navegador sin salir del POS como se debe, deja de contar sola.
  const liveSessions = state.activePosSessions.filter(s=>s.lastActive && (Date.now()-new Date(s.lastActive).getTime())<5*60000);
  return `
  ${liveSessions.length>0 ? `
  <div class="panel">
    <div class="panel-title">Quién está en el Punto de Venta ahora</div>
    ${liveSessions.map(s=>`
      <div class="list-row">
        <div class="row-main"><div class="row-title">${s.cashierName}</div><div class="row-sub">${s.centerName} · desde las ${new Date(s.startedAt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div></div>
        <span class="status-badge status-ok">${icon('check',11)} Activo</span>
      </div>
    `).join('')}
  </div>` : ''}
  <div class="panel">
    <div class="panel-title">Cortes de caja</div>
    <div class="panel-sub">Aperturas y cierres del Punto de Venta, por cajero y centro de distribución.</div>
    <div class="stat-grid" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Cajas abiertas ahora</div><div class="stat-value">${abiertas}</div></div>
      <div class="stat-card"><div class="stat-label">Cortes registrados</div><div class="stat-value">${regs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Cortes con diferencia</div><div class="stat-value">${conDiferencia}</div></div>
    </div>
    <div class="toolbar" style="align-items:center;">

async function adminForceCloseCash(id){
  const r = state.cashRegisters.find(x=>x.id===id); if(!r) return;
  if(!confirm(`¿Cerrar manualmente la caja de ${r.cashierName} en ${r.centerName}?\n\nÚsalo solo si el cajero no pudo cerrarla desde el Punto de Venta (por ejemplo, olvidó hacerlo o el dispositivo se perdió).`)) return;
  try{
    const snap = await db.collection('sales').where('cashRegisterId','==', id).get();
    const sales = snap.docs.map(d=>d.data());
    const byPayment = {};
    sales.forEach(s=>{
      salePayments(s).forEach(pm=>{
        const m = pm.method||'Efectivo';
        byPayment[m]=(byPayment[m]||0)+(pm.amount||0);
      });
    });
    const total = sales.reduce((s,x)=>s+(x.total||0),0);
    const movs = r.movements||[];
    const ingresos = movs.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.amount,0);
    const retiros = movs.filter(m=>m.type==='retiro').reduce((s,m)=>s+m.amount,0);
    const expectedCash = (r.openingAmount||0) + (byPayment['Efectivo']||0) + ingresos - retiros;
    const countedInput = prompt(`Efectivo esperado: ${money(expectedCash)}\n\nEscribe el efectivo contado físicamente (o deja este mismo número si no se pudo contar):`, String(Math.round(expectedCash)));
    if(countedInput===null) return;
    const counted = Number(countedInput);
    if(isNaN(counted) || counted<0){ showToast('Monto inválido, no se cerró la caja'); return; }
    const payload = {
      status:'cerrada', closedAt: new Date().toISOString(),
      salesCount: sales.length, totalSales: total, salesByPayment: byPayment,
      cashIngresos: ingresos, cashRetiros: retiros,
      expectedCash, countedCash: counted, difference: counted-expectedCash,
      closingNotes: 'Cerrada manualmente desde el panel de administración.',
    };
    await db.collection('cashRegisters').doc(id).update(payload);
    Object.assign(r, payload);
    showToast('Caja cerrada'); render();
  }catch(e){ console.error(e); showToast('No se pudo cerrar la caja'); }
}

/* ============== RENDIMIENTO POR CENTRO DE DISTRIBUCIÓN ==============
   Junta lo que ya vive disperso en Ventas (POS), Transferencias y Mermas, agrupado por centro,
   para comparar de un vistazo cuál centro vende más, cuál mueve más inventario y cuál tiene más
   merma — sin tener que ir pestaña por pestaña sumando a mano. Las ventas de la tienda en línea
   no traen centro (no son físicas), así que solo se cuentan las ventas del Punto de Venta. */
function computeCenterPerformance(){
  const posSales = state.orders.filter(o=>o.source==='pos' && o.status!=='Cancelado' && o.centerId);
  return state.centers.map(c=>{
    const sales = posSales.filter(o=>o.centerId===c.id);
    const salesRevenue = sales.reduce((s,o)=>s+(o.total||0),0);
    const transfersOut = state.transfers.filter(t=>t.fromCenterId===c.id).length;
    const transfersIn = state.transfers.filter(t=>t.toCenterId===c.id).length;
    const shrinkageForCenter = state.shrinkage.filter(s=>s.centerId===c.id);
    const shrinkageValue = shrinkageForCenter.reduce((s,x)=>s+(x.totalCost||0),0);
    const inventoryValue = state.products.reduce((s,p)=>s+(p.price||0)*((p.stockByCenter&&p.stockByCenter[c.id])||0),0);
    return { id:c.id, name:c.name, salesCount:sales.length, salesRevenue, transfersOut, transfersIn, shrinkageCount:shrinkageForCenter.length, shrinkageValue, inventoryValue };
  }).sort((a,b)=>b.salesRevenue-a.salesRevenue);
}
function renderCenterPerformance(){
  const rows = computeCenterPerformance();
  const maxRevenue = Math.max(1, ...rows.map(r=>r.salesRevenue));
  return `
  <div class="panel">
    <div class="panel-title">Rendimiento por centro</div>
    <div class="panel-sub">Ventas del Punto de Venta, movimientos de inventario y mermas por centro, para saber dónde reforzar. Las ventas de la tienda en línea no se cuentan aquí porque no salen de un centro físico.</div>
    ${rows.length===0 ? `<div class="empty-state">Aún no tienes centros de distribución configurados.</div>` :
      rows.map(r=>`

          <div class="hbar-row" style="margin:4px 0;"><div class="hbar-track"><div class="hbar-fill" style="width:${(r.salesRevenue/maxRevenue*100)}%;background:var(--primary)"></div></div></div>
          <div class="row-sub">${r.salesCount} venta(s) · ${r.transfersIn} transferencia(s) recibidas · ${r.transfersOut} enviada(s) · ${r.shrinkageCount} merma(s) por ${money(r.shrinkageValue)} · ${money(r.inventoryValue)} en inventario</div>
        </div>
      `).join('')}
  </div>`;
}

   aparecer una vez en la lista (el ID del documento es el ID del producto) — agregarlo de
   nuevo solo actualiza el renglón que ya tenía, no lo duplica.
*/

// Cuánto vendiste de este producto en los últimos "days" días (tienda + POS juntos, sin contar
// lo cancelado) — la base real para sugerir cuánto pedir. Como se calcula sobre state.orders
// (siempre la venta más reciente que ya está cargada), la sugerencia se recalcula sola cada
// vez que se usa: no es una foto fija de un solo momento.
function salesVelocity(productId, days){
  const cutoff = Date.now() - days*24*60*60*1000;
  let qty = 0;
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime() < cutoff) return;
    (o.items||[]).forEach(it=>{ if(it.id===productId) qty += Number(it.qty)||0; });
  });
  return qty;
}
// Sugerencia de cuánto pedir: mira las ventas reales de los últimos 60 días, calcula el
// promedio diario, y sugiere lo necesario para cubrir 30 días de venta a ese ritmo, restando lo
// que ya tienes en stock. Si el producto casi no se ha vendido (o es nuevo, sin historial), no
// hay con qué calcular un ritmo real — se sugiere un mínimo conservador de 3 en vez de un
// número inventado, para no sobrepedir algo que no sabes si se va a mover.
const RESTOCK_LOOKBACK_DAYS = 60, RESTOCK_TARGET_DAYS = 30, RESTOCK_MIN_SALES_TO_TRUST = 2;
function suggestRestockQty(p){
  const sold = salesVelocity(p.id, RESTOCK_LOOKBACK_DAYS);
  if(sold < RESTOCK_MIN_SALES_TO_TRUST) return 3;
  const dailyRate = sold / RESTOCK_LOOKBACK_DAYS;
  const target = Math.ceil(dailyRate * RESTOCK_TARGET_DAYS);
  return Math.max(1, target - (p.stock||0));
}
async function addProductToRestock(productId, qty, variantId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const rv0 = variantId ? (p.variants||[]).find(v=>v.id===variantId) : null;
  const docId = variantId ? productId+'__'+variantId : productId;
  // Si el producto ya está por caducar (o ya caducó), avisa antes de agregarlo a la lista —
  // pedir más de algo que se va a vencer pronto probablemente no es lo que quieres.
  if(p.expirationDate){
    const days = Math.ceil((new Date(p.expirationDate+'T00:00:00') - new Date())/86400000);
    if(days<=60){
      const msg = days<0 ? `"${p.name}" ya caducó. ¿Aun así quieres agregarlo a reabasto?` : `"${p.name}" caduca en ${days} día(s). ¿Aun así quieres agregarlo a reabasto?`;
      if(!confirm(msg)) return;
    }
  }
  const existing = state.restockItems.find(r=>r.id===docId);
  const payload = { productId, variantId: variantId||null, productName:p.name + (rv0 ? ` — ${varLabelOf(rv0)}` : ''), productCat:p.cat||'', qty: existing ? existing.qty : (qty||suggestRestockQty(p)), supplierId: existing ? existing.supplierId : '', addedAt: existing ? existing.addedAt : new Date().toISOString() };
  try{
    await db.collection('restockItems').doc(docId).set(payload);
    if(existing) Object.assign(existing, payload);
    else state.restockItems.push({id: docId, ...payload});
    showToast('Agregado a la lista de reabasto');
    render();
  }catch(e){ console.error(e); showToast('No se pudo agregar'); }
}

// "Recibir mercancía": antes, marcar un pedido de proveedor como hecho solo vaciaba la lista —
// había que ir a mano a sumar cada producto al inventario cuando de verdad llegaba. Ahora se abre
// un modal para confirmar cuánto llegó de cada uno (a veces no llega exactamente lo pedido) y esa
// cantidad se suma sola al inventario, con su movimiento registrado en el historial del producto.
function openReceiveGoodsModal(supplierId){
  const items = state.restockItems.filter(r=>(r.supplierId||'')===(supplierId||''));
  if(!items.length) return;
  state.receiveGoodsModalOpen = true;
  state.receiveGoodsSupplierId = supplierId;
  state.receiveGoodsQuantities = {};
  state.receiveGoodsVariants = {};
  state.receiveGoodsCosts = {};
  items.forEach(it=>{
    state.receiveGoodsQuantities[it.id] = it.qty;
    if(it.variantId) state.receiveGoodsVariants[it.id] = it.variantId;
    const p = state.products.find(x=>x.id===it.productId);
    state.receiveGoodsCosts[it.id] = p && p.cost ? p.cost : '';
  });
  render();
}
function closeReceiveGoodsModal(){ state.receiveGoodsModalOpen = false; state.receiveGoodsSupplierId = null; state.receiveGoodsQuantities = {}; render(); }
async function confirmReceiveGoods(){
  const supplierId = state.receiveGoodsSupplierId;
  const items = state.restockItems.filter(r=>(r.supplierId||'')===(supplierId||''));
  const supplier = state.suppliers.find(s=>s.id===supplierId);
  const centerId = (state.centers.find(c=>c.isDefault)||state.centers[0]||{}).id;
  try{
    for(const item of items){
      const received = Number(state.receiveGoodsQuantities[item.id])||0;
      if(received>0 && centerId){
        const p = state.products.find(x=>x.id===item.productId);
        if(p){
          const rv = (p.variants && p.variants.length) ? p.variants.find(v=>v.id===((state.receiveGoodsVariants||{})[item.id] || item.variantId)) : null;
          if(p.variants && p.variants.length && !rv){ showToast(`Elige la variante de "${item.productName}" antes de recibir`); return; }
          if(rv){ vSetCenterStock(rv, centerId, vCenterStock(rv, centerId) + received); vProductSync(p); }
          else{
          if(!p.stockByCenter) p.stockByCenter = {};
          p.stockByCenter[centerId] = (p.stockByCenter[centerId]||0) + received;
          p.stock = totalStock(p);
          }
          // Cada recepción queda en el historial de costos del producto (costo por pieza, fecha,
          // proveedor y cuántas llegaron); si el costo cambió, pasa a ser el costo actual.
          const unitCost = Number((state.receiveGoodsCosts||{})[item.id])||0;
          const upd = {stockByCenter:p.stockByCenter, stock:p.stock}; if(rv) upd.variants = p.variants;
          if(unitCost>0){
            const entry = {cost:unitCost, date:new Date().toISOString(), supplierId:supplierId||'', supplierName:supplier?supplier.name:'', qty:received, source:'recepcion', by: state.user?state.user.email:''};
            const base = [...(p.costHistory||[])]; seedPreviousCost(base, p, unitCost);
            upd.costHistory = [...base, entry];
            if(Number(p.cost)!==unitCost){
              logAdminAction('cambio_costo', 'producto', p.name, `Costo: ${money(p.cost||0)} → ${money(unitCost)} (recepción de ${supplier?supplier.name:'proveedor'})`, p.id);
              upd.cost = unitCost;
            }
          }
          await db.collection('products').doc(p.id).update(upd);
          Object.assign(p, upd);
          logStockMovement(p.id, 'recepcion_mercancia', received, `Recibido de ${supplier?supplier.name:'proveedor'}${rv?' · '+Object.values(rv.combo||{}).join(' / '):''}`, centerId);
        }
      }
      await db.collection('restockItems').doc(item.id).delete();
    }
    const ids = new Set(items.map(i=>i.id));
    state.restockItems = state.restockItems.filter(r=>!ids.has(r.id));
    showToast('Mercancía recibida y sumada al inventario');
    closeReceiveGoodsModal();
  }catch(e){ console.error('No se pudo recibir la mercancía', e); showToast('No se pudo completar'); }
}
function renderReceiveGoodsModal(){

async function markSupplierOrderDone(supplierId){
  const items = state.restockItems.filter(r=>(r.supplierId||'')===(supplierId||''));
  if(!items.length) return;
  if(!confirm(`¿Ya hiciste este pedido? Se va a vaciar esta lista (${items.length} producto${items.length===1?'':'s'}).`)) return;
  try{
    for(const item of items){ await db.collection('restockItems').doc(item.id).delete(); }
    const ids = new Set(items.map(i=>i.id));
    state.restockItems = state.restockItems.filter(r=>!ids.has(r.id));
    showToast('Lista marcada como pedida');
    render();
  }catch(e){ console.error(e); showToast('No se pudo actualizar'); }
}
