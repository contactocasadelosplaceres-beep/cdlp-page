/* ============== AUDITORÍAS DE INVENTARIO ==============
   Conteo que NO se pierde al recargar (borrador en este navegador hasta que se finaliza), captura escribiendo
   o escaneando (pistola o cámara), conteo ciego opcional, ajuste por diferencia (no pisa ventas hechas durante
   el conteo), seguimiento de diferencias con motivo y recuento, y calendario de conteo cíclico (A/B/C). */
const AUDIT_DRAFT_KEY = 'cdlp_audit_draft_v1';
const AUDIT_REASONS = [['investigar','Por investigar'],['error_conteo','Error de conteo'],['venta_sin_registrar','Venta sin registrar'],['merma','Merma o dañado'],['extravio','Extravío o robo'],['devolucion','Devolución sin registrar'],['proveedor','Error al recibir del proveedor'],['otro','Otro']];
const AUDIT_INTERVAL_DAYS = {A:30, B:60, C:90};
function auditReasonLabel(k){ const r = AUDIT_REASONS.find(x=>x[0]===k); return r ? r[1] : 'Por investigar'; }
function auditRecountUnits(){ const n = Number(state.settings.auditRecountUnits); return n>0 ? n : 2; }
function auditRecountMoney(){ const n = Number(state.settings.auditRecountMoney); return n>0 ? n : 300; }
function auditDailyBatch(){ const n = Math.floor(Number(state.settings.auditDailyBatch)); return n>0 ? n : 25; }
function auditProdCost(p, v){ const vc = v ? Number(v.cost) : 0; return vc>0 ? vc : (Number(p && p.cost) || 0); }
/* Productos con variantes: se cuenta cada variante (clave "idProducto::idVariante"); el resto, por producto. */
function auditHasVars(p){ return !!(p && p.variants && p.variants.length); }
function auditKey(p, v){ return v ? p.id+'::'+v.id : p.id; }
function auditEntry(key){
  const parts = String(key).split('::'); const p = state.products.find(x=>x.id===parts[0]); if(!p) return null;
  if(!parts[1]) return {p, v:null};
  const v = (p.variants||[]).find(x=>x.id===parts[1]); return v ? {p, v} : null;
}
function auditVarLabel(v){ return Object.values((v&&v.combo)||{}).join(' / ') || 'Variante'; }
function auditSysQty(p, v, cid){ return v ? vCenterStock(v, cid) : centerStock(p, cid); }
function auditProdStock(p, cid){ return auditHasVars(p) ? p.variants.reduce((s,v)=>s+vCenterStock(v,cid),0) : centerStock(p, cid); }
function auditCountedProduct(p){ return !!p && (auditHasVars(p) ? p.variants.some(v=>state.auditCounts[auditKey(p,v)]!==undefined) : state.auditCounts[p.id]!==undefined); }

/* ---- Borrador (se guarda en este navegador; se borra al finalizar o descartar) ---- */
function auditSaveDraft(){
  try{
    const n = Object.keys(state.auditCounts||{}).length;
    if(!state.auditCenter || (!n && !state.auditPlan)){ localStorage.removeItem(AUDIT_DRAFT_KEY); return; }
    localStorage.setItem(AUDIT_DRAFT_KEY, JSON.stringify({v:1, center:state.auditCenter, counts:state.auditCounts, snap:state.auditSnap, blind:state.auditBlind, review:state.auditReview, notes:state.auditNotes, startedAt:state.auditStartedAt, category:state.auditCategory, plan:state.auditPlan, planOnly:state.auditPlanOnly, reasons:state.auditReasons, recounts:state.auditRecounts}));
  }catch(e){}
}
function auditClearDraft(){ try{ localStorage.removeItem(AUDIT_DRAFT_KEY); }catch(e){} }
let _auditDraftRestored = false;
function auditRestoreDraft(){
  if(_auditDraftRestored) return; _auditDraftRestored = true;
  try{
    const raw = localStorage.getItem(AUDIT_DRAFT_KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.center || !state.centers.some(c=>c.id===d.center)) return;
    state.auditCenter = d.center; state.auditCounts = d.counts||{}; state.auditSnap = d.snap||{};
    state.auditBlind = d.blind!==false; state.auditReview = !!d.review; state.auditNotes = d.notes||'';
    state.auditStartedAt = d.startedAt||null; state.auditCategory = d.category||'Todas';
    state.auditPlan = d.plan||null; state.auditPlanOnly = !!d.planOnly; state.auditReasons = d.reasons||{}; state.auditRecounts = d.recounts||{};
    state.auditResumed = Object.keys(state.auditCounts).length>0 || !!state.auditPlan;
  }catch(e){ console.error('No se pudo recuperar el conteo en curso', e); }
}
function auditHasDraft(){ return !!state.auditCenter && (Object.keys(state.auditCounts||{}).length>0 || !!state.auditPlan); }
function auditResetState(){
  state.auditCounts = {}; state.auditSnap = {}; state.auditNotes = ''; state.auditSearch = ''; state.auditReview = false; state.auditStartedAt = null;
  state.auditPlan = null; state.auditPlanOnly = false; state.auditReasons = {}; state.auditRecounts = {}; state.auditLast = null; state.auditResumed = false;
}
function discardAuditDraft(){
  if(!confirm('¿Descartar el conteo en curso? Se borrarán las cantidades que llevas contadas.')) return;
  auditResetState(); auditClearDraft(); showToast('Conteo descartado'); render();
}
function auditChooseCenter(id){
  if(auditHasDraft() && id!==state.auditCenter && !confirm('Si cambias de centro se descarta el conteo en curso. ¿Continuar?')){ render(); return; }
  if(id!==state.auditCenter) auditResetState();

/* ---- Diferencias y cierre ---- */
function auditCountedFinal(pid){
  const rc = state.auditRecounts[pid];
  return (rc!==undefined && rc!=='' && !isNaN(Number(rc))) ? Math.max(0, Math.floor(Number(rc))) : state.auditCounts[pid];
}
function auditDiffRows(){
  if(!state.auditCenter) return [];
  return Object.keys(state.auditCounts).map(pid=>{
    const e = auditEntry(pid); if(!e) return null;
    const p = e.p, v = e.v;
    const system = state.auditSnap[pid]!==undefined ? state.auditSnap[pid] : auditSysQty(p, v, state.auditCenter);
    const first = state.auditCounts[pid], counted = auditCountedFinal(pid);
    const cost = auditProdCost(p, v), diff = counted - system;
    const big = Math.abs(first - system) >= auditRecountUnits() || Math.abs((first - system)*cost) >= auditRecountMoney();
    return {pid, v, name:p.name+(v?' — '+auditVarLabel(v):''), sku:(v&&v.sku)||p.sku||'', system, first, counted, diff, cost, value: Math.round(diff*cost*100)/100, big, recounted: counted!==first, p};
  }).filter(Boolean);
}
async function commitAudit(applyAdjustment){
  if(!state.auditCenter){ showToast('Elige el centro que estás auditando'); return; }
  const rows = auditDiffRows();
  if(rows.length===0){ showToast('Cuenta al menos un producto antes de guardar'); return; }
  const pendingRecount = rows.filter(r=>r.big && r.diff!==0 && !r.recounted).length;
  if(pendingRecount && !confirm(`${pendingRecount} diferencia${pendingRecount===1?'':'s'} grande${pendingRecount===1?'':'s'} no se ${pendingRecount===1?'ha':'han'} vuelto a contar. ¿Guardar así de todos modos?`)) return;
  const center = state.centers.find(c=>c.id===state.auditCenter);
  const items = rows.map(r=>{
    const it = {productId:r.p.id, name:r.name, systemQty:r.system, countedQty:r.counted, diff:r.diff, unitCost:r.cost, valueDiff:r.value};
    if(r.v){ it.variantId = r.v.id; it.variantLabel = auditVarLabel(r.v); }
    if(r.recounted) it.firstCount = r.first;
    if(r.diff!==0){ it.reason = state.auditReasons[r.pid] || 'investigar'; it.status = 'abierta'; } else { it.status = 'ok'; }
    return it;
  });
  const auditDoc = {
    date: new Date().toISOString(), startedAt: state.auditStartedAt||null, centerId: state.auditCenter, centerName: center?center.name:'',
    items, notes: (state.auditNotes||'').trim(), applied: !!applyAdjustment, blind: !!state.auditBlind, method:'v2',
  };
  try{
    const ref = db.collection('audits').doc();
    const touched = [], moves = [];
    if(applyAdjustment){
      const batch = db.batch();
      const varProds = {};
      rows.forEach(r=>{
        const p = r.p; if(!p) return;
        if(r.v){
          const current = vCenterStock(r.v, state.auditCenter), next = Math.max(0, r.counted + (current - r.system));
          vSetCenterStock(r.v, state.auditCenter, next); varProds[p.id] = p;
          if(next!==current) moves.push([p.id, next-current, ' · '+auditVarLabel(r.v)]);
          touched.push(p.id);
          return;
        }
        if(!p.stockByCenter) p.stockByCenter = {};
        const current = p.stockByCenter[state.auditCenter]||0;
        // Se conserva lo vendido/recibido mientras se contaba: nuevo = contado + (existencia actual - existencia al empezar a contar)
        const next = Math.max(0, r.counted + (current - r.system));
        p.stockByCenter[state.auditCenter] = next; p.stock = totalStock(p);
        if(next!==current) moves.push([p.id, next-current, '']);
        touched.push(p.id);
        batch.update(db.collection('products').doc(p.id), {stockByCenter:p.stockByCenter, stock:p.stock});
      });
      Object.values(varProds).forEach(p=>{
        vProductSync(p);
        batch.update(db.collection('products').doc(p.id), {variants:p.variants, stock:p.stock, stockByCenter:p.stockByCenter});
      });
      batch.set(ref, auditDoc);
      await batch.commit();
      moves.forEach(([pid,d,sfx])=>logStockMovement(pid,'auditoria',d,`Auditoría en ${auditDoc.centerName}${sfx||''}`,state.auditCenter));
      if(touched.length) recomputeKitStocksFor(touched);
    }else{
      await ref.set(auditDoc);
    }
    state.audits.unshift({id:ref.id, ...auditDoc});
    auditResetState(); auditClearDraft();
    showToast(applyAdjustment ? 'Auditoría guardada y inventario ajustado' : 'Auditoría guardada'); render();
  }catch(e){ console.error(e); showToast('No se pudo guardar la auditoría'); }
}

function auditTrackedItems(){

function computeAuditStats(){
  const monthKey = new Date().toISOString().slice(0,7), since90 = Date.now()-90*86400000;
  let falt=0, sobr=0, items90=0, ok90=0, open=0, openVal=0;
  (state.audits||[]).forEach(a=>{
    const t = new Date(a.date).getTime();
    (a.items||[]).forEach(it=>{
      if(t>=since90){ items90++; if(!it.diff) ok90++; }
      if(String(a.date).slice(0,7)===monthKey && it.diff){ const v=(it.valueDiff!=null?it.valueDiff:0); if(v<0) falt+=-v; else sobr+=v; }
      if(it.diff && it.status==='abierta'){ open++; openVal += Math.abs(it.valueDiff||0); }
    });
  });
  return {falt, sobr, exact: items90 ? Math.round(ok90*100/items90) : null, open, openVal, items90};
}

/* ---- Calendario de conteo cíclico (A cada 30 días, B 60, C 90) ---- */
function computeCountPlan(centerId){
  const since = Date.now()-90*86400000, sales = {};
  (state.orders||[]).forEach(o=>{
    if(o.status==='Cancelado' || new Date(o.date).getTime()<since) return;
    (o.items||[]).forEach(it=>{ if(it.id && it.price>0) sales[it.id] = (sales[it.id]||0) + it.price*(it.qty||1); });
  });
  const last = {}, diffRecent = {};
  (state.audits||[]).filter(a=>a.centerId===centerId).sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(a=>{
    (a.items||[]).forEach(it=>{ last[it.productId] = new Date(a.date).getTime(); if(it.diff) diffRecent[it.productId] = new Date(a.date).getTime(); });
  });
  const elig = state.products.filter(p=>!p.isKit && (auditProdStock(p,centerId)>0 || sales[p.id]>0 || last[p.id]));
  elig.sort((a,b)=>(sales[b.id]||0)-(sales[a.id]||0));
  const totalSales = elig.reduce((s,p)=>s+(sales[p.id]||0),0);
  let cum = 0; const now = Date.now(), rows = [];
  elig.forEach(p=>{
    const v = sales[p.id]||0; const before = totalSales ? cum/totalSales : 1; cum += v;
    const cls = !totalSales ? 'C' : (before<0.8 ? 'A' : before<0.95 ? 'B' : 'C');
    let interval = AUDIT_INTERVAL_DAYS[cls];
    const hadDiff = diffRecent[p.id] && (now-diffRecent[p.id]) < 120*86400000;
    if(hadDiff) interval = Math.min(interval, 30);
    const lastT = last[p.id]; const days = lastT ? Math.floor((now-lastT)/86400000) : null;
    const due = lastT==null || days>=interval;
    rows.push({p, cls, interval, days, due, hadDiff:!!hadDiff, value:v, overdue: lastT==null ? 9999 : days-interval});
  });
  const clsRank = {A:0,B:1,C:2};
  const dueRows = rows.filter(r=>r.due).sort((a,b)=> (clsRank[a.cls]-clsRank[b.cls]) || (b.hadDiff-a.hadDiff) || (b.overdue-a.overdue) || (b.value-a.value));
  const startToday = new Date(); startToday.setHours(0,0,0,0);
  const countedToday = new Set(); (state.audits||[]).filter(a=>a.centerId===centerId && new Date(a.date)>=startToday).forEach(a=>(a.items||[]).forEach(it=>countedToday.add(it.productId)));
  const batch = auditDailyBatch();
  const todayLeft = Math.max(0, batch - countedToday.size);
  const lastAudit = (state.audits||[]).filter(a=>a.centerId===centerId).map(a=>a.date).sort().pop() || null;
  return {rows, dueRows, dueCount:dueRows.length, never:rows.filter(r=>r.days==null).length, eligible:rows.length, batch, todayLeft, countedToday:countedToday.size,
    todayList: dueRows.slice(0, todayLeft), upcoming:(()=>{ const out=[]; let i=todayLeft; for(let d=1; d<=6 && i<dueRows.length; d++){ out.push({d, list:dueRows.slice(i,i+batch)}); i+=batch; } return out; })(),
    aCount: rows.filter(r=>r.cls==='A').length, overdueA: dueRows.filter(r=>r.cls==='A').length, lastAudit};
}
function auditStartPlan(){
  const cid = state.auditCenter || (typeof defaultCenterId==='function' ? defaultCenterId() : '');
  if(!cid){ showToast('Elige un centro'); return; }
  if(auditHasDraft() && !confirm('Ya tienes un conteo en curso. Si empiezas la tanda de hoy se descarta. ¿Continuar?')) return;

function renderAuditReview(rows, draftBanner){
  const diffs = rows.filter(r=>r.diff!==0).sort((a,b)=>Math.abs(b.value)-Math.abs(a.value) || Math.abs(b.diff)-Math.abs(a.diff));
  const zero = rows.length - diffs.length;
  const tFalt = diffs.filter(r=>r.value<0).reduce((s,r)=>s-r.value,0), tSobr = diffs.filter(r=>r.value>0).reduce((s,r)=>s+r.value,0);
  const bigPending = diffs.filter(r=>r.big && !r.recounted).length;
  return `
    <div class="panel">
      <div class="panel-title">Revisar diferencias</div>
      ${draftBanner}
      <div class="stat-grid" style="margin-bottom:10px;">
        <div class="stat-card"><div class="stat-label">Contados</div><div class="stat-value">${rows.length}</div><div class="stat-delta">${zero} sin diferencia</div></div>
        <div class="stat-card"><div class="stat-label">Faltante</div><div class="stat-value">${money(tFalt)}</div></div>
        <div class="stat-card"><div class="stat-label">Sobrante</div><div class="stat-value">${money(tSobr)}</div></div>
      </div>
      <div class="note-box">Las diferencias de <strong>${auditRecountUnits()} piezas o más</strong>, o de <strong>${money(auditRecountMoney())} o más</strong>, piden un <strong>recuento</strong> antes de ajustar. <span class="row-sub">Cambiar límites:</span>
        <input type="number" min="1" style="width:56px;padding:4px;border:1px solid var(--border);border-radius:6px;" value="${auditRecountUnits()}" onchange="saveAuditSetting('auditRecountUnits',this.value,1,999)"> piezas ·
        $<input type="number" min="1" style="width:70px;padding:4px;border:1px solid var(--border);border-radius:6px;" value="${auditRecountMoney()}" onchange="saveAuditSetting('auditRecountMoney',this.value,1,99999)"></div>
      ${diffs.length===0 ? `<div class="empty-state">Todo cuadra con el sistema. 🎉</div>` : diffs.map(r=>`
        <div class="list-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
            <div class="row-main"><div class="row-title">${escapeHtmlAudit(r.name)}</div><div class="row-sub">Sistema ${r.system} · Contado ${r.first}${r.recounted?` · Recuento ${r.counted}`:''}${r.cost?` · ${money(Math.abs(r.value))} a costo`:''}</div></div>
            <span class="status-badge" style="background:${r.diff<0?'var(--rose)':'var(--amber)'};">${r.diff>0?'+':''}${r.diff}</span>
          </div>
          <div class="two-col" style="align-items:end;">
            <div class="form-field" style="margin:0;"><label>Motivo probable</label>
              <select onchange="state.auditReasons['${r.pid}']=this.value;auditSaveDraft()">
                ${AUDIT_REASONS.map(([k,l])=>`<option value="${k}" ${(state.auditReasons[r.pid]||'investigar')===k?'selected':''}>${l}</option>`).join('')}
              </select></div>
            ${r.big ? `<div class="form-field" style="margin:0;"><label>${r.recounted?'Recuento ✓':'Recuento (diferencia grande)'}</label>
              <input type="number" min="0" inputmode="numeric" placeholder="Vuelve a contar" value="${state.auditRecounts[r.pid]??''}" onchange="state.auditRecounts['${r.pid}']=this.value;auditSaveDraft();render()"></div>` : '<div></div>'}
          </div>
        </div>`).join('')}
      <div class="form-field" style="margin-top:12px;"><label>Notas (opcional)</label><input value="${escapeHtmlAudit(state.auditNotes)}" oninput="state.auditNotes=this.value;auditSaveDraft()" placeholder="Turno, responsable, motivo de la auditoría..."></div>
      ${bigPending?`<div class="note-box" style="background:#FFF6E0;color:#8a6300;">${bigPending} diferencia${bigPending===1?'':'s'} grande${bigPending===1?'':'s'} sin recuento.</div>`:''}
      <div class="modal-actions" style="margin-top:6px;flex-wrap:wrap;">
        <button class="btn-cancel" onclick="state.auditReview=false;auditSaveDraft();render()">Volver a contar</button>
        <button class="btn-cancel" onclick="commitAudit(false)">Guardar solo como registro</button>

    </div>`;
}

// Cruza el historial de auditorías para detectar productos que salen con diferencia
// (faltante o sobrante) en más de una auditoría — una sola vez puede ser un error de conteo,
// pero repetido puede ser un patrón real (robo hormiga, mal registrado en el sistema, etc.).
function computeRecurringAuditDiffs(){
  const byProduct = {};
  state.audits.forEach(a=>{
    (a.items||[]).forEach(it=>{
      if(!it.diff) return;
      if(!byProduct[it.productId]) byProduct[it.productId] = {name: it.name, occurrences: []};
      byProduct[it.productId].occurrences.push({date:a.date, centerName:a.centerName, diff:it.diff});
    });
  });
  return Object.entries(byProduct)
    .filter(([id,d])=>d.occurrences.length>=2)
    .map(([id,d])=>({productId:id, name:d.name, occurrences: d.occurrences.sort((a,b)=>new Date(b.date)-new Date(a.date))}))
    .sort((a,b)=>b.occurrences.length-a.occurrences.length);
}

function renderDiseno(){
  if(state.designSubpanel) return renderDesignSubpanel(state.designSubpanel);
  return `
    <div class="note-box" style="margin-bottom:16px;">Desde aquí controlas toda la apariencia de tu tienda: marca, colores, tipografía, textos, categorías, banners, destacados, testimonios y pie de página. Los cambios se reflejan de inmediato.</div>

function renderSectionRow(s, idx){
  const total = state.settings.sections.length;
  return `
    <div class="section-row" draggable="true"
      ondragstart="sectionDragStart(event, ${idx})"
      ondragover="event.preventDefault()"
      ondrop="sectionDrop(event, ${idx})">
      <span class="drag-handle">⠿</span>
      <span class="section-name ${s.visible?'':'hidden-section'}">${s.label}</span>
      <div class="section-arrows">
        <button class="arrow-btn" ${idx===0?'disabled style="opacity:.35"':''} onclick="moveSection(${idx},-1)">▲</button>
        <button class="arrow-btn" ${idx===total-1?'disabled style="opacity:.35"':''} onclick="moveSection(${idx},1)">▼</button>
      </div>
      <button class="visibility-toggle ${s.visible?'on':'off'}" onclick="toggleSectionVisible(${idx})">${s.visible?'Visible':'Oculta'}</button>
    </div>`;
}
function toggleSectionVisible(idx){
  state.settings.sections[idx].visible = !state.settings.sections[idx].visible;
  saveSettings(); render();
}
function moveSection(idx, dir){
  const arr = state.settings.sections; const j = idx+dir;
  if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  saveSettings(); render();
}
function sectionDragStart(e, idx){ sectionDragIdx = idx; }
function sectionDrop(e, idx){
  e.preventDefault();
  if(sectionDragIdx===null || sectionDragIdx===idx) return;
  const arr = state.settings.sections;
  const [moved] = arr.splice(sectionDragIdx,1);
  arr.splice(idx,0,moved);
  sectionDragIdx = null;
  saveSettings(); render();
}

/* ============== RECORDATORIO AUTOMÁTICO DE RECOMPRA ==============
   Ale marca qué productos se terminan/usan con regularidad (lubricante, preservativos...). Si
   un cliente que ya compró uno de esos productos no lo ha vuelto a comprar en los días que se
   definan, aparece en la lista de "para contactar" con un botón directo a WhatsApp. Una vez
   contactado, no se le vuelve a mostrar por el mismo periodo (se guarda en
   settings.repurchaseNotified), para no insistirle todos los días. */
function toggleRepurchaseProduct(id, checked){
  let ids = state.settings.repurchaseProductIds || [];
  ids = checked ? [...new Set([...ids, id])] : ids.filter(x=>x!==id);
  state.settings.repurchaseProductIds = ids;
  saveSettings(); render();
}
function computeRepurchaseCandidates(){
  const days = state.settings.repurchaseDays || 45;
  const ids = state.settings.repurchaseProductIds || [];
  if(!ids.length) return [];
  const cutoff = Date.now() - days*86400000;
  const lastByPhoneProduct = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const phone = (orderContactPhone(o)||'').replace(/\D/g,''); if(!phone) return;
    const name = o.customer || o.customerName || '';
    const d = new Date(o.date).getTime();
    if(isNaN(d)) return;
    (o.items||[]).forEach(it=>{
      if(!it.id || !ids.includes(it.id)) return;
      const key = phone+'|'+it.id;
      if(!lastByPhoneProduct[key] || d > lastByPhoneProduct[key].date){
        lastByPhoneProduct[key] = {date:d, phone, name, productId: it.id};
      }
    });
  });
  const notified = state.settings.repurchaseNotified || {};
  return Object.values(lastByPhoneProduct)
    .filter(x=>x.date <= cutoff)
    .filter(x=>{
      const notifiedAt = notified[x.phone+'|'+x.productId];
      if(!notifiedAt) return true;
      return (Date.now() - new Date(notifiedAt).getTime()) >= days*86400000;
    })
    .map(x=>({...x, product: state.products.find(p=>p.id===x.productId), daysSince: Math.floor((Date.now()-x.date)/86400000)}))
    .filter(x=>x.product)
    .sort((a,b)=>b.daysSince-a.daysSince);
}
function buildRepurchaseMessage(cand){
  return `Hola ${cand.name||''}! Notamos que hace ${cand.daysSince} días compraste ${cand.product.name} en ${state.settings.storeName||'nuestra tienda'} — pensamos que ya te podría estar por terminar. ¿Te gustaría volver a pedirlo? 💕`;
}
async function sendRepurchaseReminder(phone, productId){
  const cand = computeRepurchaseCandidates().find(c=>c.phone===phone && c.productId===productId);
  if(!cand) return;
  const msg = buildRepurchaseMessage(cand);
  window.open(waLink(phone, msg), '_blank');
  logCustomerMessage(phone, cand.name, msg, 'recompra');
  state.settings.repurchaseNotified = {...(state.settings.repurchaseNotified||{}), [phone+'|'+productId]: new Date().toISOString()};
  await saveSettings(); render();
}

  const ids = state.settings.repurchaseProductIds || [];
  const q = (state.repurchaseProductSearch||'').trim().toLowerCase();

  const results = q ? searchProducts(q, state.products).slice(0,30) : chosen;

  return `

    </div>

/* ============== CLIENTES EN RIESGO DE FUGA ==============
   A diferencia del recordatorio de recompra (que es por un producto puntual que se termina),
   esto detecta clientes RECURRENTES — que ya compraron varias veces, sin importar qué — y que
   llevan más tiempo del normal sin volver. Junta pedidos de la tienda y ventas del POS (ambos
   ya viven en state.orders) por teléfono, y si alguien con historial de compras repetidas no
   ha vuelto en los días configurados, aparece en la lista con un mensaje de reactivación listo
   para mandar por WhatsApp. Igual que recompra, una vez contactado no se le vuelve a mostrar
   por el mismo periodo (settings.churnRiskNotified) — y si de hecho regresa a comprar, su
   última fecha de compra se actualiza sola y deja de cumplir el filtro de "días sin volver",
   así que no hace falta limpiar el aviso a mano. */
function computeChurnRiskCandidates(){
  const days = state.settings.churnRiskDays || 60;
  const minPurchases = state.settings.churnRiskMinPurchases || 2;
  const cutoff = Date.now() - days*86400000;
  const byPhone = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const phone = (orderContactPhone(o)||'').replace(/\D/g,''); if(!phone) return;
    const name = (o.source==='pos' ? o.customerName : o.customer) || '';
    const d = new Date(o.date).getTime();
    if(isNaN(d)) return;
    if(!byPhone[phone]) byPhone[phone] = {phone, name, count:0, lastDate:0, totalSpent:0};
    byPhone[phone].count += 1;
    byPhone[phone].totalSpent += Number(o.total)||0;
    if(d > byPhone[phone].lastDate){ byPhone[phone].lastDate = d; byPhone[phone].name = name || byPhone[phone].name; }
  });
  const notified = state.settings.churnRiskNotified || {};
  return Object.values(byPhone)
    .filter(x=>x.count >= minPurchases && x.lastDate <= cutoff)
    .filter(x=>{
      const notifiedAt = notified[x.phone];
      if(!notifiedAt) return true;
      return (Date.now() - new Date(notifiedAt).getTime()) >= days*86400000;
    })
    .map(x=>({...x, daysSince: Math.floor((Date.now()-x.lastDate)/86400000)}))
    .sort((a,b)=>b.daysSince-a.daysSince);
}
function buildChurnRiskMessage(cand){
  return `Hola ${cand.name||''}! Te extrañamos por ${state.settings.storeName||'nuestra tienda'} 💕 Ya tiene ${cand.daysSince} días que no nos visitas — si buscas algo en especial o quieres ver las novedades, con gusto te ayudamos por aquí mismo.`;
}
async function sendChurnRiskReminder(phone){
  const cand = computeChurnRiskCandidates().find(c=>c.phone===phone);
  if(!cand) return;
  const msg = buildChurnRiskMessage(cand);
  window.open(waLink(phone, msg), '_blank');
  logCustomerMessage(phone, cand.name, msg, 'reactivacion');
  state.settings.churnRiskNotified = {...(state.settings.churnRiskNotified||{}), [phone]: new Date().toISOString()};
  await saveSettings(); render();
}
function renderChurnRiskSubpanel(){
  const candidates = computeChurnRiskCandidates();
  return `
  <div class="panel">
    <div class="panel-title">Clientes en riesgo de fuga</div>
    <div class="panel-sub">Clientes que ya te compraron varias veces (tienda o mostrador) y llevan más de lo normal sin volver. A diferencia del recordatorio de recompra, aquí no importa qué compraron — es una señal de que se están enfriando.</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 16px;">

function downloadCSV(filename, rows){
  const csvContent = rows.map(row => row.map(cell => {
    const s = (cell===null||cell===undefined) ? '' : String(cell);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }).join(',')).join('\r\n');
  // El BOM (\ufeff) al inicio es para que Excel reconozca acentos y "ñ" correctamente al abrirlo.
  const blob = new Blob(['\ufeff' + csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const rows = [['Nombre','SKU','Categoría','Ubicación','Precio','Precio promocional','Costo','Stock total','Caducidad','Oculto']];

// Catálogo en PDF: mismo mecanismo que la hoja de preparación y el recibo de venta — una
// ventana con "Imprimir" que ofrece "Guardar como PDF" en el diálogo del navegador, sin
// depender de ninguna librería extra. Solo incluye productos visibles en la tienda (no los
// ocultos), con foto, nombre y el precio al que de verdad se venden hoy (el promocional si
// está activo).
function printCatalogPDF(category){
  const list = state.products.filter(p=>!p.hidden && (category==='Todas' || p.cat===category)).sort((a,b)=>a.name.localeCompare(b.name));
  if(list.length===0){ showToast('No hay productos visibles en esa categoría'); return; }
  const cardsHtml = list.map(p=>{
    const img = (p.images&&p.images[0]) ? p.images[0] : '';
    const price = productSellPrice(p);
    const hasPromo = p.promoPrice>0 && p.promoPrice<p.price;
    return `
      <div style="break-inside:avoid;border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center;">
        ${img ? `<img src="${img}" style="width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:6px;">` : `<div style="width:100%;height:110px;background:#f2f2f2;border-radius:6px;margin-bottom:6px;"></div>`}
        <div style="font-size:11.5px;font-weight:700;line-height:1.25;margin-bottom:3px;">${p.name}</div>
        <div style="font-size:12.5px;font-weight:800;color:#5C1F49;">${hasPromo?`<s style="color:#999;font-weight:600;font-size:10.5px;">${money(p.price)}</s> `:''}${money(price)}</div>
      </div>`;
  }).join('');
  const win = window.open('', '_blank');
  if(!win){ showToast('Habilita las ventanas emergentes para generar el PDF'); return; }
  win.document.write(`
    <html><head><title>Catálogo ${category!=='Todas'?'— '+category:''}</title>
    <meta charset="utf-8">
    <style>
      body{font-family:Arial,sans-serif;padding:20px;color:#222;}
      h1{font-size:20px;margin:0 0 2px;}
      .sub{color:#666;font-size:12.5px;margin-bottom:16px;}
      .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
      @media print{ .no-print{display:none;} .grid{grid-template-columns:repeat(3,1fr);} }
    </style></head><body>
      <h1>${state.settings.storeName||'La Casa de los Placeres'}</h1>
      <div class="sub">Catálogo${category!=='Todas'?' — '+category:''} · ${list.length} producto(s) · ${new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}</div>
      <button class="no-print" onclick="window.print()" style="margin-bottom:14px;padding:10px 16px;font-size:14px;font-weight:700;">Imprimir / Guardar como PDF</button>
      <div class="grid">${cardsHtml}</div>
    </body></html>
  `);
  win.document.close();
  win.focus();
  logAdminAction('impresion', 'catálogo en PDF', `${list.length} producto(s)${category!=='Todas'?' · '+category:''}`);
}

/* ============== REGISTRO DE ERRORES DEL SISTEMA (panel) ==============
   Ver la lógica de captura y guardado en index.html/admin.html/pos.html — aquí solo se muestra
   lo que ya quedó guardado en la colección "systemErrors". Se carga solo al abrir este panel,
   no en cada carga del panel, porque es información técnica que casi nunca hace falta ver. */
function loadSystemErrors(){
  state.systemErrorsLoading = true; render();
  db.collection('systemErrors').get().then(snap=>{
    const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    items.sort((a,b)=> new Date(b.date) - new Date(a.date));
    state.systemErrors = items.slice(0,200);
    state.systemErrorsLoading = false; render();
  }).catch(e=>{ console.error('No se pudo cargar el registro de errores', e); state.systemErrors=[]; state.systemErrorsLoading=false; render(); });
}
async function clearSystemErrors(){
  if(!confirm('¿Borrar todos los errores guardados? No se puede deshacer.')) return;
  try{
    const batch = db.batch();
    (state.systemErrors||[]).forEach(e=>batch.delete(db.collection('systemErrors').doc(e.id)));
    await batch.commit();
    state.systemErrors = [];
    showToast('Registro de errores borrado');
    render();
  }catch(e){ console.error(e); showToast('No se pudo borrar el registro'); }
}
async function deleteSystemError(id){
  try{
    await db.collection('systemErrors').doc(id).delete();
    state.systemErrors = (state.systemErrors||[]).filter(e=>e.id!==id);
    render();
  }catch(e){ console.error(e); showToast('No se pudo borrar ese registro'); }
}

function addSynonymExamples(){
  const ta = document.getElementById('syn-text'); if(!ta) return;
  const have = ta.value.split('\n').map(x=>x.trim().toLowerCase());
  const add = SYNONYM_EXAMPLES.filter(x=>!have.includes(x));
  if(!add.length){ showToast('Los ejemplos ya están'); return; }
  ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/,'') + '\n' : '') + add.join('\n');
  ta.focus();
}
function addSynonymSeed(term){
  const ta = document.getElementById('syn-text'); if(!ta) return;
  ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/,'') + '\n' : '') + term + ', ';
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function saveSynonyms(){

}

  return `

        ${r.unmatchedLines>0 ? `${r.unmatchedLines} línea(s) de producto no encontraron equivalente en tu catálogo actual (se guardan igual, con el nombre original, pero no se les asocia un producto específico para el detalle por producto).` : ''}
      </div>
      <button class="btn-primary" ${state.histImportBusy?'disabled':''} onclick="confirmHistImport()">${state.histImportBusy?'Importando…':'Importar a Firestore'}</button>
    `) : ''}
    ${state.histImportResult ? `<div class="note-box" style="color:var(--green);">${escDescHtml(state.histImportResult)}</div>` : ''}
  `;

function handleHistImportFile(input){
  const file = input.files[0]; if(!file) return;
  state.histImportFileName = file.name;
  state.histImportResult = null;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('el archivo debe ser una lista de pedidos');
      const existingIds = new Set(state.orders.map(o=>o.id));
      let totalRevenue=0, unmatchedLines=0, alreadyImported=0, dateMin=null, dateMax=null;
      data.forEach(o=>{
        totalRevenue += o.total||0;
        (o.items||[]).forEach(it=>{ if(!it.id) unmatchedLines++; });
        if(existingIds.has(o.firestoreId)) alreadyImported++;
        if(o.date){ if(!dateMin||o.date<dateMin) dateMin=o.date; if(!dateMax||o.date>dateMax) dateMax=o.date; }
      });
      state.histImportData = data;
      state.histImportPreview = {
        count: data.length, totalRevenue, unmatchedLines, alreadyImported,
        dateMin: dateMin ? new Date(dateMin).toLocaleDateString('es-MX') : '—',
        dateMax: dateMax ? new Date(dateMax).toLocaleDateString('es-MX') : '—',
      };
    }catch(err){
      state.histImportData = null;
      state.histImportPreview = {error: 'No se pudo leer el archivo: '+(err.message||'formato inválido')};
    }
    render();
  };
  reader.readAsText(file);
}
async function confirmHistImport(){
  const data = state.histImportData;
  if(!data || !data.length) return;
  if(!confirm(`Vas a importar ${data.length} pedidos históricos de Tiendanube a Firestore. Es seguro repetirlo (no duplica), pero sí escribe datos reales en tu base de datos. ¿Continuar?`)) return;
  state.histImportBusy = true; render();
  try{
    for(let i=0;i<data.length;i+=400){
      const chunk = data.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(o=>{
        const {firestoreId, ...payload} = o;
        batch.set(db.collection('sales').doc(firestoreId), payload);
      });
      await batch.commit();
    }
    state.histImportResult = `Listo: se importaron ${data.length} pedidos.`;
    state.histImportData = null; state.histImportPreview = null; state.histImportFileName = '';
    render();
    await loadData();
    showToast('Historial de ventas importado');
  }catch(e){
    console.error(e);
    showToast('Ocurrió un error al importar: '+(e.message||'error desconocido'));
  }
  state.histImportBusy = false; render();
}

async function removeCategory(cat){
  const affected = state.products.filter(p=>(p.categories&&p.categories.includes(cat)) || p.cat===cat);
  if(affected.length>0 && !confirm(`${affected.length} producto(s) tienen esta categoría asignada. Si continúas, se les asignará otra categoría automáticamente. ¿Continuar?`)) return;
  try{
    if(affected.length>0){
      const fallback = state.settings.categories.find(c=>c!==cat) || 'Otros';
      for(let i=0;i<affected.length;i+=400){
        const chunk = affected.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(p=>{
          let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).filter(c=>c!==cat);
          if(categories.length===0) categories = [fallback];
          p.categories = categories;
          if(p.cat===cat) p.cat = categories[0];
          batch.update(db.collection('products').doc(p.id), {categories:p.categories, cat:p.cat});
        });
        await batch.commit();
      }
    }
    state.settings.categories = state.settings.categories.filter(c=>c!==cat);
    if(state.productCatFilter===cat) state.productCatFilter='Todas';
    await saveSettings(); showToast('Categoría eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar la categoría'); }
}
async function moveCategory(idx,dir){
  const arr = state.settings.categories;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  await saveSettings(); render();
}
async function renameCategory(oldName, newLabel){
  const val = (newLabel||'').trim();
  if(!val || val===oldName){ render(); return; }
  if(state.settings.categories.includes(val)){ showToast('Ya existe una categoría con ese nombre'); render(); return; }
  const idx = state.settings.categories.indexOf(oldName);
  if(idx<0) return;
  try{
    state.settings.categories[idx] = val;
    const affected = state.products.filter(p=>(p.categories&&p.categories.includes(oldName)) || p.cat===oldName);
    for(let i=0;i<affected.length;i+=400){
      const chunk = affected.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(p=>{
        let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).map(c=>c===oldName?val:c);
        p.categories = categories;
        if(p.cat===oldName) p.cat = val;
        batch.update(db.collection('products').doc(p.id), {categories:p.categories, cat:p.cat});
      });
      await batch.commit();
    }
    if(state.productCatFilter===oldName) state.productCatFilter = val;
    await saveSettings(); showToast('Categoría renombrada'); render();
  }catch(e){ console.error(e); showToast('No se pudo renombrar la categoría'); }
}

// Sugerencia automática de "¿Para quién es?" a partir del nombre y la categoría —

function has_(name, ...words){ return words.some(w=>name.includes(w)); }
function suggestNeedsForProduct(p){
  const name = normName(p.name||'');
  const cat = normName((p.categories&&p.categories[0]) || p.cat || '');
  let tags = new Set();

  if(cat==='ropa femenina') tags = new Set(['para-mi','para-ella','para-pareja']);
  else if(cat==='ropa masculina') tags = new Set(['para-mi','para-el','para-pareja']);
  else if(cat==='tarjetas de regalo') tags = new Set();
  else if(cat==='juegos'){
    if(has_(name,'despedida de soltera')) tags = new Set();
    else{ tags.add('compartir-pareja'); if(has_(name,'jenga','dado','dados','cartas','naipes','boletos')) tags.add('empezando'); }
  } else if(cat==='satisfyer'){
    if(has_(name,'parejas')) tags = new Set(['compartir-pareja','para-mi']);
    else if(has_(name,' man ') || name.startsWith('man ') || has_(name,'man heat','para el pene')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'clitoris','panty','cutie')) tags = new Set(['para-ella','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='comestibles'){
    if(has_(name,'pareja')) tags = new Set(['compartir-pareja','para-pareja']);
    else if(has_(name,'hombre','masculin')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'mujer','femenin')) tags = new Set(['para-ella','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='complementos'){
    if(has_(name,'hombre','masculin')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'mujer','femenin')) tags = new Set(['para-ella','para-mi']);
    else if(has_(name,'latigo','esposas','pinzas para pezon','mascara','antifaz','cadena','vela','petalos','almohada','splash','spray')) tags = new Set(['compartir-pareja','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='sadomasoquismo') tags = new Set(['compartir-pareja','para-mi']);
  else if(cat==='plugs'){
    tags.add('para-mi');
    if(has_(name,'gema','cola de zorro','cola de conejo','corazon')) tags.add('empezando');
  } else if(cat==='dildos'){
    tags = new Set(['para-mi','para-ella']);
    if(/\b([789])(\.\d+)?\s*cm/.test(name) || has_(name,'mini')) tags.add('empezando');
  } else if(cat==='lubricantes'){
    tags.add('para-mi');
    if(has_(name,'femenin','vaginal','estrechador','clitoris')) tags.add('para-ella');
    if(has_(name,'ereccion','erecto','engrosador','garganta profunda','para hombre')) tags.add('para-el');
    if(has_(name,'unisex','pareja','duo','multiorgasmico','condon')) tags.add('compartir-pareja');
  } else if(cat==='ocultos'){
    tags = new Set(['para-mi','compartir-pareja']);
    if(has_(name,'para ella')) tags.add('para-ella');
  } else if(cat==='juguetes'){
    const esMasturbadorMasculino = has_(name,'masturbador','mastubador','funda para pene','funda de pene','funda realista','penis pump','bomba de succion','entrenador para pene','jaula de castidad') ||
      (has_(name,'vagina','boca','garganta','ano') && !has_(name,'succionador','clitoris'));
    if(esMasturbadorMasculino) tags = new Set(['para-el','para-mi','para-pareja']);
    else if(has_(name,'anillo')) tags = new Set(['para-el','compartir-pareja','para-mi']);
    else if(has_(name,'succionador','clitoris','punto g','kegel','pezon','pezonera')) tags = new Set(['para-ella','para-mi']);
    else if(has_(name,'dildo','vibrador','consolador','bala','miembro')) tags = new Set(['para-mi','para-ella']);
    else if(has_(name,'plug','prostat') || (has_(name,'anal') && !has_(name,'masturbador'))) tags.add('para-mi');
    else if(has_(name,'esposas','arnes','arnés','correa','columpio','collar con pinzas','mordaza')) tags = new Set(['compartir-pareja','para-mi']);
    else tags.add('para-mi');
    if(has_(name,'doble cabeza','doble penetracion','para parejas','control remoto','control por app','butterfly','mariposa')) tags.add('compartir-pareja');
    if(has_(name,'pezon','pezonera')) tags.add('para-ella');
    if(has_(name,'mini','pequen','chico','bolsillo')) tags.add('empezando');
  } else {
    tags.add('para-mi');
  }
  return Array.from(tags).filter(k=>(state.settings.needs||DEFAULT_NEEDS).some(n=>n.key===k));

function applySuggestedNeeds(){
  const p = state.productModal;
  const suggested = suggestNeedsForProduct(p);
  if(!suggested.length){ showToast('No se encontró una sugerencia clara para este producto'); return; }
  p.needs = suggested;
  showToast('Sugerencia aplicada — revísala antes de guardar');
  render();
}
function toggleProductNeed(key, checked){
  if(!state.productModal.needs) state.productModal.needs = [];
  if(checked){ if(!state.productModal.needs.includes(key)) state.productModal.needs.push(key); }
  else{ state.productModal.needs = state.productModal.needs.filter(k=>k!==key); }
}
function toggleProductCategory(cat, checked){
  const p = state.productModal;
  if(!p.categories) p.categories = p.cat ? [p.cat] : [];
  if(checked){ if(!p.categories.includes(cat)) p.categories.push(cat); }
  else{ p.categories = p.categories.filter(c=>c!==cat); }
}
function setProductCenterStock(centerId, value){
  if(!state.productModal.stockByCenter) state.productModal.stockByCenter = {};
  state.productModal.stockByCenter[centerId] = Math.max(0, Number(value)||0);
  const totalEl = document.getElementById('pf-stock-total');
  if(totalEl) totalEl.textContent = Object.values(state.productModal.stockByCenter).reduce((s,n)=>s+(n||0),0);

function updatePriceCalc(){
  const price = Number(document.getElementById('pf-price').value)||0;
  const promo = Number(document.getElementById('pf-promo').value)||0;
  const cost = Number(document.getElementById('pf-cost').value)||0;
  const effective = promo>0 ? promo : price;
  const margin = effective>0 ? Math.round(((effective-cost)/effective)*1000)/10 : 0;
  const profit = Math.round((effective-cost)*100)/100;
  const marginEl = document.getElementById('pf-margin'); if(marginEl) marginEl.textContent = margin+'%';
  const profitEl = document.getElementById('pf-profit'); if(profitEl) profitEl.textContent = money(profit);
}
function generateSKU(product){
  const catPart = ((product.categories&&product.categories[0])||product.cat||'GEN').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3) || 'GEN';
  const namePart = (product.name||'PROD').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4) || 'PROD';
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${catPart}-${namePart}-${rand}`;
}
function regenerateSKU(){
  const name = document.getElementById('pf-name').value.trim();
  const sku = generateSKU({name, categories: state.productModal.categories, cat: state.productModal.cat});
  state.productModal.sku = sku;
  render();
}

/* ---- Variantes ----
   Flujo: 1) elegir la PROPIEDAD que cambia (Color, Talla, Tamaño… o una propia), 2) agregar sus VALORES
   (Azul, Blanco…), 3) las variantes se generan solas y cada una lleva su precio, precio promocional,
   foto, costo, SKU y existencias por centro. Se guarda como variantGroups [{name, values}] + variants
   [{id, combo:{Propiedad:valor}, sku, stock, stockByCenter, priceOverride, promoPriceOverride, cost, imageIdx}]. */
const VAR_PROP_SUGGESTIONS = ['Color','Talla','Tamaño','Sabor','Material','Presentación','Modelo','Aroma','Potencia','Largo'];
const VAR_VALUE_SUGGESTIONS = {
  color:['Blanco','Negro','Rojo','Rosa','Azul','Verde','Morado','Café','Nude','Dorado','Plateado','Transparente'],
  talla:['Unitalla','CH','M','G','XG','XXG','28','30','32','34','36'],
  tamano:['Mini','Chico','Mediano','Grande','Extra grande'],
  sabor:['Fresa','Chocolate','Menta','Vainilla','Sandía','Cereza','Coco','Natural'],
  material:['Silicón','Látex','Vidrio','Metal','Cuero','Encaje'],
  presentacion:['30 ml','60 ml','120 ml','250 ml','500 ml'],
  aroma:['Rosas','Vainilla','Lavanda','Coco','Sin aroma'],
  potencia:['Suave','Media','Fuerte'],
  largo:['15 cm','18 cm','20 cm','25 cm'],
  modelo:[],
};
function varKey(s){ return searchClean(s).replace(/\s+/g,''); }
function varLabelOf(v){ return Object.values((v&&v.combo)||{}).join(' / ') || (v && v.name) || 'Variante'; }
// Productos viejos (importados o creados con el editor anterior): si hay variantes pero no propiedades, se reconstruyen.
function varEnsureGroups(p){
  if(!(p.variants && p.variants.length)) return;
  if((p.variantGroups||[]).some(g=>g.name && (g.values||[]).length)) return;
  const groups = {};
  p.variants.forEach(v=>{
    if(!v.combo || !Object.keys(v.combo).length) v.combo = {'Opción': v.name || 'Variante'};
    Object.entries(v.combo).forEach(([k,val])=>{ (groups[k] = groups[k] || []); if(!groups[k].includes(val)) groups[k].push(val); });
  });
  p.variantGroups = Object.entries(groups).map(([name,values])=>({name, values}));
}

          <div class="vgroup-h"><div><span class="vgroup-k">Propiedad</span><strong>${escDescHtml(g.name)}</strong></div><button type="button" class="btn-danger-text" onclick="removeVariantProp(${idx})">Quitar propiedad</button></div>

          ${sugg.length ? `<div class="vchips" style="margin-top:8px;"><span class="var-lbl" style="margin:0 4px 0 0;align-self:center;">Sugeridos:</span>${sugg.map(x=>`<button type="button" class="vchip" onclick="addVariantValues(${idx},decodeURIComponent('${attrEnc(x)}'))">+ ${escDescHtml(x)}</button>`).join('')}</div>` : ''}

          ${variants.map(v=>{
            const base = Number(v.priceOverride)>0 ? Number(v.priceOverride) : pprice;
            const badPromo = Number(v.promoPriceOverride)>0 && base>0 && Number(v.promoPriceOverride)>=base;

              ${(p.images||[]).length ? `<div class="var-pick-t">Foto de esta variante:</div><div class="var-pick-row">
                ${(p.images||[]).map((src,i)=>`<button type="button" class="var-pick-img ${v.imageIdx===i?'on':''}" onclick="setVariantImage('${v.id}',${i})"><img src="${src}" alt=""></button>`).join('')}
                <button type="button" class="btn-tertiary" onclick="setVariantImage('${v.id}',null)">Sin foto propia</button></div>` : `<div class="var-pick-t">Primero sube fotos del producto (sección Foto) y aquí eliges cuál es de esta variante.</div>`}
            </div>` : ''}
            <div class="var-stockcell"><span class="var-lbl">Stock${centersAct.length>1?' por centro':''}</span>
              ${centersAct.map(c=>`<label class="var-cs">${centersAct.length>1?`<span title="${escDescHtml(c.name)}">${escDescHtml(c.name.replace(/\s*\(.*\)/,''))}</span>`:''}<input class="var-in" type="number" min="0" inputmode="numeric" value="${vCenterStock(v,c.id)}" onchange="setVariantCenterStock('${v.id}','${c.id}',this.value)"></label>`).join('')}

            <div><span class="var-lbl">Precio</span><input class="var-in" type="number" min="0" step="0.01" inputmode="decimal" placeholder="${pprice>0?pprice:'Igual'}" value="${v.priceOverride||''}" onchange="setVariantField('${v.id}','priceOverride',this.value);render()"></div>
            <div><span class="var-lbl">Precio promocional</span><input class="var-in ${badPromo?'var-bad':''}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Sin promo" value="${v.promoPriceOverride||''}" onchange="setVariantField('${v.id}','promoPriceOverride',this.value);render()">${badPromo?`<div class="var-warn">Debe ser menor que ${money(base)}</div>`:''}</div>

          </div>`; }).join('')}
          <div class="var-row var-total"><div class="var-name">Stock total (todos los centros)</div><div><strong id="var-stock-total">${variants.reduce((s,v)=>s+(v.stock||0),0)}</strong> pzas</div></div>

function _varGroups(){ const p = state.productModal; if(!p.variantGroups) p.variantGroups = []; return p.variantGroups; }
function addVariantProp(name){
  name = String(name||'').trim().replace(/\s+/g,' ').slice(0,30);
  if(!name){ showToast('Escribe el nombre de la propiedad'); return; }
  const groups = _varGroups();
  if(groups.some(g=>varKey(g.name)===varKey(name))){ showToast(`Ya agregaste "${name}"`); return; }
  if(groups.length>=3){ showToast('Máximo 3 propiedades por producto'); return; }
  groups.push({name, values:[]});
  state.varAddingProp = false;
  render();
  requestAnimationFrame(()=>{ const i = document.getElementById('var-val-'+(groups.length-1)); if(i) i.focus(); });
}
function _varWouldLoseStock(mutator){
  const p = state.productModal; const before = JSON.stringify(p.variantGroups);
  const snapshot = JSON.parse(before); mutator(snapshot);
  const test = {variants: p.variants||[], variantGroups: snapshot};
  const next = varBuildCombos(snapshot, p.variants||[]);
  const keep = new Set(next.map(v=>v.id));
  return (p.variants||[]).filter(v=>!keep.has(v.id) && (v.stock||0)>0);
}
function removeVariantProp(idx){
  const g = _varGroups()[idx]; if(!g) return;
  const lost = _varWouldLoseStock(gs=>gs.splice(idx,1));
  if(lost.length && !confirm(`Al quitar "${g.name}" se juntan las variantes y se pierde el stock de ${lost.length} de ellas. ¿Continuar?`)) return;
  _varGroups().splice(idx,1); varRegenerate(); render();
}
function addVariantValues(idx, text){
  const g = _varGroups()[idx]; if(!g) return;
  const parts = String(text||'').split(',').map(x=>x.trim().replace(/\s+/g,' ').slice(0,40)).filter(Boolean);
  if(!parts.length){ showToast('Escribe una opción'); return; }
  g.values = g.values || [];
  let added = 0;
  parts.forEach(v=>{ if(!g.values.some(x=>varKey(x)===varKey(v))){ g.values.push(v); added++; } });
  if(!added){ showToast('Esa opción ya está'); return; }
  varRegenerate(); render();
  requestAnimationFrame(()=>{ const i = document.getElementById('var-val-'+idx); if(i) i.focus(); });
}
function removeVariantValue(idx, val){
  const g = _varGroups()[idx]; if(!g) return;
  const lost = _varWouldLoseStock(gs=>{ gs[idx].values = gs[idx].values.filter(x=>x!==val); });
  if(lost.length && !confirm(`Quitar "${val}" elimina ${lost.length} variante(s) que tienen stock. ¿Continuar?`)) return;
  g.values = (g.values||[]).filter(x=>x!==val); varRegenerate(); render();
}
// Combinaciones de todas las propiedades con valores. Las variantes que ya existían conservan su stock, fotos y precios:
// si cambia la estructura (se agregó o quitó una propiedad) se reutiliza la variante cuya combinación coincide o es parte de la nueva.
function varBuildCombos(groups, existing){
  const gs = (groups||[]).filter(g=>g.name && g.values && g.values.length);
  if(!gs.length) return [];
  let combos = [{}];
  gs.forEach(g=>{ const next = []; combos.forEach(c=>g.values.forEach(v=>next.push({...c,[g.name]:v}))); combos = next; });
  const used = new Set();
  const keyOf = combo=>JSON.stringify(Object.entries(combo).sort());
  const byKey = {}; (existing||[]).forEach(v=>{ byKey[keyOf(v.combo||{})] = v; });
  const subset = (a,b)=>Object.entries(a).every(([k,v])=>b[k]===v);
  return combos.map(combo=>{
    const exact = byKey[keyOf(combo)];
    if(exact && !used.has(exact.id)){ used.add(exact.id); return exact; }
    const part = (existing||[]).find(v=>!used.has(v.id) && v.combo && Object.keys(v.combo).length && (subset(v.combo, combo) || subset(combo, v.combo)));
    if(part){ used.add(part.id); return {...part, combo}; }
    return {id: uid('var_'), combo, sku:'', stock:0};
  });
}
function varRegenerate(){
  const p = state.productModal;
  p.variants = varBuildCombos(p.variantGroups, p.variants);
  p.variants.forEach(vNormalize);
  const tmp = {variants:p.variants, stockByCenter:p.stockByCenter||{}};
  if(p.variants.length){ vProductSync(tmp); p.stockByCenter = tmp.stockByCenter; p.stock = tmp.stock; }
}
function generateVariantCombos(){ varRegenerate(); render(); }
function applyVariantBulk(){
  const field = (document.getElementById('var-bulk-field')||{}).value || 'cost';
  const val = Math.max(0, Number((document.getElementById('var-bulk-val')||{}).value)||0);
  if(!(val>0)){ showToast('Escribe el valor que quieres aplicar'); return; }
  const vs = state.productModal.variants||[];
  if(field==='promoPriceOverride'){
    const bad = vs.filter(v=>val >= (Number(v.priceOverride)>0 ? Number(v.priceOverride) : Number(state.productModal.price)||Infinity));
    if(bad.length && Number(state.productModal.price)>0){ showToast(`La promoción debe ser menor al precio (${money(Number(state.productModal.price))})`); return; }
  }
  vs.forEach(v=>{ v[field] = val; });
  if(field==='cost') document.querySelectorAll('[data-var-cost]').forEach(i=>{ i.value = val; });
  if(field==='cost' && !(Number(state.productModal.cost)>0)){ state.productModal.cost = val; const pc = document.getElementById('pf-cost'); if(pc) pc.value = val; if(typeof updatePriceCalc==='function') updatePriceCalc(); }
  showToast(field==='cost'?'Costo aplicado a todas las variantes':field==='priceOverride'?'Precio aplicado a todas las variantes':'Precio promocional aplicado a todas las variantes');
  render();
}
function applyVariantCostAll(){ const f = document.getElementById('var-bulk-field'); if(f) f.value='cost'; applyVariantBulk(); }
function setVariantField(variantId, field, value){
  const v = (state.productModal.variants||[]).find(x=>x.id===variantId);
  if(!v) return;
  v[field] = (field==='priceOverride'||field==='cost'||field==='promoPriceOverride') ? Math.max(0, Number(value)||0) : value;
}
function setVariantCenterStock(variantId, cid, value){
  const v = (state.productModal.variants||[]).find(x=>x.id===variantId); if(!v) return;
  vSetCenterStock(v, cid, value);
  const sum = document.getElementById('var-sum-'+variantId); if(sum) sum.textContent = v.stock;
  const el = document.getElementById('var-stock-total'); if(el) el.textContent = (state.productModal.variants||[]).reduce((s,x)=>s+(x.stock||0),0);
}
function toggleVarPhotoPick(id){ state.varPhotoPick = state.varPhotoPick===id ? null : id; render(); }
function setVariantImage(id, idx){
  const v = (state.productModal.variants||[]).find(x=>x.id===id); if(!v) return;
  if(idx==null) delete v.imageIdx; else v.imageIdx = idx;
  state.varPhotoPick = null; render();
}
function handleSaveProduct(existingId){
  // Evita el doble-guardado: un doble click o un dedo lento en pantallas táctiles podía disparar
  // esta función dos veces antes de que la primera terminara, creando el producto duplicado (o
  // registrando el cambio dos veces en la bitácora) cuando se trata de uno nuevo.
  if(state.savingProduct) return;
  state.savingProduct = true; render();
  const name = document.getElementById('pf-name').value.trim();
  const sku = document.getElementById('pf-sku').value.trim();
  const location = document.getElementById('pf-location').value.trim();
  const supplierId = document.getElementById('pf-supplier').value || '';
  const batches = ((state.productModal.batches)||[]).filter(b=>(Number(b.qty)||0)>0).map(b=>({id:b.id, qty:Math.floor(Number(b.qty)||0), expirationDate:b.expirationDate||'', note:(b.note||'').trim()}));
  const expirationDate = batches.length ? earliestExpiry(batches) : (document.getElementById('pf-expiration').value || '');
  const lowStockThreshold = Number(document.getElementById('pf-low-stock-threshold').value) || 0;
  const price = Number(document.getElementById('pf-price').value)||0;
  const promoPrice = Number(document.getElementById('pf-promo').value)||0;
  const cost = Number(document.getElementById('pf-cost').value)||0;
  const desc = document.getElementById('pf-desc').value.trim();
  const hidden = document.getElementById('pf-hidden').checked;
  if(!name){ state.savingProduct = false; showToast('Ponle un nombre al producto'); render(); return; }
  const categories = (state.productModal.categories && state.productModal.categories.length) ? state.productModal.categories : [state.settings.categories[0]];
  const cat = categories[0];
  let stockByCenter = state.productModal.stockByCenter || {};
  let stock = Object.values(stockByCenter).reduce((s,n)=>s+(n||0),0);
  if((state.productModal.variants||[]).length){
    state.productModal.variants.forEach(vNormalize);
    const tmp = {variants: state.productModal.variants, stockByCenter}; vProductSync(tmp);
    stockByCenter = tmp.stockByCenter; stock = tmp.stock;
  }
  saveProduct({
    id: existingId||null, name, sku, location, supplierId, expirationDate, batches, lowStockThreshold, cat, categories, price, promoPrice, cost, stock, stockByCenter, desc,
    hidden, images: state.productModal.images||[], needs: state.productModal.needs||[],
    variantGroups: state.productModal.variantGroups||[], variants: state.productModal.variants||[],
    costHistory: state.productModal.costHistory||[],
  });
}

/* ============== PRESERVAR EL CAMPO QUE SE ESTÁ EDITANDO AL VOLVER A DIBUJAR LA PANTALLA ==============
   render() reconstruye TODO el HTML desde cero cada vez (por ejemplo, cuando llega un pedido
   nuevo en segundo plano mientras editas algo). Desde que cada campo de texto importante está
   "atado" al estado (ver los oninput= en los formularios de arriba), ese HTML nuevo ya trae el
   valor correcto — pero igual te saca el foco del campo, como si hubieras hecho click en otro
   lado a media palabra. Esto captura, justo antes de reconstruir la pantalla, en qué campo
   estabas escribiendo y en qué posición iba el cursor, y lo restaura después. De paso, por si
   algún campo quedara sin atar al estado (ahora o en el futuro), respeta el valor que tenías en
   pantalla en ese instante por encima de lo que traiga el estado — así nunca se pierde una letra
   de lo que estabas escribiendo, pase lo que pase en segundo plano. */
function captureFocusState(root){
  const el = document.activeElement;
  if(!el || !root || !root.contains(el) || !el.id) return null;
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return null;
  const info = { id: el.id, value: el.value, scrollTop: root.scrollTop };
  if(typeof el.selectionStart === 'number'){ info.selStart = el.selectionStart; info.selEnd = el.selectionEnd; }
  return info;
}
function restoreFocusState(root, info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  if('value' in el && el.value !== info.value) el.value = info.value;
  el.focus();
  if(info.selStart!=null && el.setSelectionRange){
    try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
  }
  root.scrollTop = info.scrollTop;
}
// Además del campo enfocado, muchas listas (buscar y agregar un producto, elegir alcance de una
// promoción, auditoría, etc.) tienen su propio scroll interno. Sin esto, marcar una casilla o
// agregar un producto de esa lista la reconstruye desde cero y el navegador la regresa hasta
// arriba, aunque el campo enfocado no cambie. En vez de etiquetar cada una a mano (son muchas y
// crecen con el tiempo), se recuerda el scroll de CADA contenedor con scroll propio, en el orden
// en que aparecen en pantalla, y se restaura en ese mismo orden tras el redibujado — funciona
// porque typear o marcar algo cambia el CONTENIDO de esas listas, no cuántas hay ni en qué orden.
const SCROLLABLE_SELECTOR = '[style*="overflow-y:auto"],[style*="overflow-y: auto"],[style*="overflow:auto"],[style*="overflow: auto"]';
function captureScrollPositions(root){
  return Array.from(root.querySelectorAll(SCROLLABLE_SELECTOR)).map(el=>el.scrollTop);
}
function restoreScrollPositions(root, positions){
  if(!positions || !positions.length) return;
  const els = root.querySelectorAll(SCROLLABLE_SELECTOR);
  els.forEach((el,i)=>{ if(positions[i]) el.scrollTop = positions[i]; });
}
/* Menús desplegables siempre dentro de la pantalla: se abren alineados a la derecha de su botón,
   pero en celular el botón puede quedar del lado izquierdo (ej. "Herramientas" en Productos) y el
   menú se salía cortado por la izquierda. Después de cada render se mide cada menú abierto y, si
   se sale por cualquier lado, se recorre lo necesario para que quepa completo. */
function fitFloatingMenus(){
  const vw = document.documentElement.clientWidth, pad = 8;
  document.querySelectorAll('.row-more-menu,.order-actions-menu,.top-more-menu').forEach(el=>{
    el.style.transform = ''; el.style.maxWidth = `calc(100vw - ${pad*2}px)`;
    const r = el.getBoundingClientRect();
    let dx = 0;
    if(r.left < pad) dx = pad - r.left;
    else if(r.right > vw - pad) dx = (vw - pad) - r.right;
    if(dx) el.style.transform = `translateX(${Math.round(dx)}px)`;
  });
}
function render(){
  const root = document.getElementById('root');
  const focusInfo = captureFocusState(root);
  const scrollPositions = captureScrollPositions(root);
  if(!state.authChecked){ root.innerHTML = `<div class="loading-screen">Verificando sesión…</div>`; restoreFocusState(root, focusInfo); return; }
  if(!state.user){ root.innerHTML = renderLogin(); restoreFocusState(root, focusInfo); return; }
  if(state.totpRequired && !state.totpVerified){ root.innerHTML = renderTotpChallenge(); restoreFocusState(root, focusInfo); return; }
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando panel…</div>`; restoreFocusState(root, focusInfo); return; }
  if(state.loadFailed){ root.innerHTML = renderLoadFailedScreen(); restoreFocusState(root, focusInfo); return; }
  root.innerHTML = renderAdmin();
  if(state.productModal && document.getElementById('pf-barcode-svg')){ drawProductBarcode(); }
  if(state.postModalProductId && document.getElementById('post-canvas')){ drawPostCanvas(); }
  toastStack();
  const pinField = document.getElementById('pin-field'); if(pinField && !focusInfo) pinField.focus();
  const searchField = document.getElementById('global-search-input'); if(searchField && document.activeElement!==searchField && !focusInfo){ searchField.focus(); const v=searchField.value; searchField.setSelectionRange(v.length,v.length); }
  restoreFocusState(root, focusInfo);
  restoreScrollPositions(root, scrollPositions);
  try{ fitFloatingMenus(); }catch(e){}
}
render();


/* ============== BOTÓN "ATRÁS" ==============
   El botón atrás del teléfono/navegador sacaba de la aplicación porque todo ocurre en una sola
   página. Aquí cada "pantalla" abierta (cajón, ventana, sub-panel…) cuenta como un paso del
   historial: al abrirla se agrega una entrada y al presionar atrás se cierra la de encima, en vez
   de salir. navLayers() lista (de arriba hacia abajo) lo que está abierto y cómo cerrarlo; no toca
   ninguna lógica de la página, solo lee su estado y reutiliza las mismas funciones de cierre. */
const NAV = {depth:0, ignore:0, busy:false};
try{ if(history.state && history.state.cdlpNav) history.replaceState(null,''); }catch(e){}
function navSync(){
  if(NAV.busy || NAV.ignore>0) return;
  let n = 0; try{ n = navLayers().length; }catch(e){}
  if(n > NAV.depth){
    while(NAV.depth < n){ NAV.depth++; try{ history.pushState({cdlpNav:NAV.depth}, ''); }catch(e){} }
  } else if(n < NAV.depth){
    const d = NAV.depth - n; NAV.depth = n; NAV.ignore++;
    setTimeout(()=>{ if(NAV.ignore>0){ NAV.ignore=0; navSync(); } }, 900);
    try{ history.go(-d); }catch(e){ NAV.ignore=0; }
  }
}
window.addEventListener('popstate', (e)=>{
  if(NAV.ignore>0){ NAV.ignore--; if(NAV.ignore===0) navSync(); return; }
  const target = (e.state && e.state.cdlpNav) || 0;
  let n = 0; try{ n = navLayers().length; }catch(_){}
  NAV.busy = true;
  try{
    for(let i = n - target; i > 0; i--){
      const cur = navLayers(); if(!cur.length) break;
      try{ cur[0](); }catch(_){}
    }
  } finally { NAV.busy = false; }
  NAV.depth = target;
  navSync();
});

const NAV_ADMIN_MODALS = [
  ['returnModal', ()=>closeReturnModal()],
  ['postModalProductId', ()=>closePostModal()], ['notifyModalProductId', null], ['massPriceModalOpen', ()=>closeMassPriceModal()],
  ['receiveGoodsModalOpen', ()=>closeReceiveGoodsModal()], ['priceHistoryOpen', ()=>closeProductPriceHistory()],
  ['assignCommissionOrderId', null], ['commissionAgentModal', null], ['auditLogOpen', ()=>closeAuditLog()],
  ['productHistoryOpen', ()=>closeProductHistory()], ['needsManageOpen', false], ['catManageOpen', false],
  ['bulkTagModal', null], ['auditScannerOpen', ()=>closeAuditScanner()], ['trashOpen', false], ['promoListOpen', false], ['promoPickOpen', false], ['duplicatesOpen', false],
  ['recompressOpen', ()=>closeRecompressTool()], ['orderDetailModal', ()=>closeOrderDetailModal()], ['cropOpen', false],
  ['cashierModal', null], ['globalSearchOpen', ()=>closeGlobalSearch()], ['abandonedCartsOpen', false], ['failModal', null], ['productModal', null],
  ['customerModal', ()=>closeCustomerModal()], ['wholesaleModal', ()=>closeWholesaleModal()], ['flashModal', ()=>closeFlashModal()], ['couponModal', ()=>closeCouponModal()],
  ['promoModal', ()=>closePromoModal()], ['centerModal', null], ['cajaDetail', null], ['importOpen', false], ['customerImportOpen', false],
  ['catImportOpen', false], ['catAssignOpen', false], ['needAssignOpen', false], ['catalogMaintOpen', false], ['bgFixOpen', false],
  ['adminNavOpen', false],
];
function navLayers(){
  const s = state, L = [];
  if(!s.loaded || !s.user || s.loadFailed || (s.totpRequired && !s.totpVerified)) return L;
  NAV_ADMIN_MODALS.forEach(([k, fn])=>{
    const v = s[k];
    if(v!==null && v!==undefined && v!==false && v!=='') L.push(()=>{
      if(typeof fn==='function') fn(); else { s[k] = (fn===false ? false : null); render(); }
    });
  });
  if(s.designSubpanel) L.push(()=>{ s.designSubpanel=null; render(); });
  if(s.marketingSubpanel) L.push(()=>{ s.marketingSubpanel=null; render(); });
  if(s.configSubpanel) L.push(()=>{ s.configSubpanel=null; render(); });
  const home = canAccessTab('resumen') ? 'resumen' : (firstAccessibleTab() || 'resumen');
  if(s.adminTab && s.adminTab!==home) L.push(()=>{ s.adminTab=home; render(); });
  return L;
}
