<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de venta — La Casa de los Placeres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#FBF5F2; --surface:#FFFFFF; --surface-soft:#F6E9E6; --ink:#2B1620; --ink-soft:#6E5560;
    --primary:#993477; --primary-deep:#5C1F49; --rose:#BC355C; --coral:#ED7578; --amber:#F6A030;
    --green:#7AB71A; --teal:#20B7CA; --navy:#0A4A5B; --border:#EBD9D3;
    --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-pill:999px;
    --shadow-sm:0 2px 8px -4px rgba(43,22,32,0.16);
    --shadow-md:0 12px 28px -12px rgba(43,22,32,0.22);
    --shadow-lg:0 24px 48px -20px rgba(43,22,32,0.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;} input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1100px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  .top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px -10px rgba(0,0,0,0.5);position:relative;z-index:5;}
  .top .brand{font-size:15.5px;font-weight:700;font-family:'League Spartan',sans-serif;letter-spacing:0.01em;}
  .top .sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .pill-btn{font-size:12px;background:rgba(255,255,255,0.14);padding:8px 13px;border-radius:var(--radius-pill);color:#fff;font-weight:600;transition:background .15s ease;}
  .pill-btn:hover{background:rgba(255,255,255,0.22);}
  .login-screen,.select-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
    background:radial-gradient(1200px 600px at 15% -10%, rgba(237,117,120,0.35), transparent 60%),
               radial-gradient(900px 500px at 110% 110%, rgba(32,183,202,0.22), transparent 55%),
               linear-gradient(160deg,var(--primary-deep),#3a1332 72%);}
  .card{position:relative;background:#fff;border-radius:var(--radius-lg);padding:32px 26px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
  .card h2{color:var(--primary-deep);font-size:20px;margin-bottom:6px;font-weight:700;}
  .card p{color:var(--ink-soft);font-size:12.5px;margin-bottom:16px;line-height:1.5;}
  .card input{width:100%;font-size:16px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:10px;transition:border-color .15s ease;background:var(--bg);}
  .card input:focus{border-color:var(--primary);outline:none;}
  .card input.pin{text-align:center;letter-spacing:8px;font-size:22px;font-weight:700;}
  .err{color:var(--rose);font-size:12px;margin-bottom:8px;min-height:14px;font-weight:600;}
  .btn-primary{width:100%;background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:13px;border-radius:var(--radius-md);font-size:14.5px;font-weight:700;box-shadow:0 10px 20px -10px rgba(188,53,92,0.55);transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;}
  .btn-primary:active{transform:scale(0.98);box-shadow:0 4px 10px -6px rgba(188,53,92,0.5);}
  .btn-primary:disabled{opacity:.45;box-shadow:none;}
  .btn-secondary{width:100%;background:var(--surface-soft);color:var(--ink-soft);padding:12px;border-radius:var(--radius-md);font-size:13.5px;font-weight:700;margin-top:8px;transition:background .15s ease;}
  .btn-secondary:hover{background:#efd9d3;}
  .modal-overlay{position:fixed;inset:0;background:rgba(43,22,32,0.55);backdrop-filter:blur(1px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.modal-overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:22px 20px;box-shadow:0 -20px 50px -20px rgba(43,22,32,0.35);}
  @media(min-width:600px){.modal{border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);}}
  .modal h3{font-size:17.5px;color:var(--primary-deep);margin-bottom:6px;font-weight:700;font-family:'League Spartan',sans-serif;}
  .order-detail{background:var(--bg);border-radius:var(--radius-sm);padding:12px;font-size:12.5px;border:1px solid var(--border);}
  .order-detail div{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
  .field-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:10px;font-size:16px;transition:border-color .15s ease;}
  .field-input:focus{border-color:var(--primary);outline:none;}
  .cashier-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .cashier-item{background:var(--surface-soft);color:var(--primary-deep);padding:14px;border-radius:var(--radius-md);font-size:14.5px;font-weight:700;transition:background .15s ease,transform .1s ease;}
  .cashier-item:active{transform:scale(0.98);}

  .pos-body{flex:1;min-height:0;display:flex;flex-direction:column;}
  .toolbar{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;}
  .search-row input{width:100%;padding:11px 14px;border-radius:var(--radius-md);border:1.5px solid var(--border);font-size:16px;background:#fff;transition:border-color .15s ease;}
  .search-row input:focus{border-color:var(--primary);outline:none;}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;padding:9px 15px;min-height:38px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);background:#fff;border:1.5px solid var(--border);color:var(--ink-soft);font-size:13px;font-weight:600;white-space:nowrap;transition:all .15s ease;}
  .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 14px -8px rgba(153,52,119,0.55);}
  .layout{display:flex;flex:1;min-height:0;}
  .prod-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 100px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;}
  @media(min-width:600px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.prod-grid{grid-template-columns:repeat(4,1fr);}}
  .prod-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .12s ease;}
  .prod-card:active{transform:scale(0.97);box-shadow:none;}
  .prod-swatch{width:100%;height:44px;border-radius:8px;}
  .prod-name{font-size:12.5px;font-weight:600;line-height:1.25;}
  .prod-price{font-size:13px;font-weight:800;color:var(--primary-deep);}
  .prod-stock{font-size:10.5px;color:var(--ink-soft);}

  .sale-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-height:60vh;display:flex;flex-direction:column;box-shadow:0 -16px 40px -18px rgba(43,22,32,0.28);}
  .sale-panel::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:3px;background:var(--border);}
  .sale-head{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:relative;}
  .sale-items{overflow-y:auto;padding:8px 16px;flex:1;}
  .sale-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .sale-item .name{flex:1;}
  .qty-btn{width:26px;height:26px;border-radius:8px;background:var(--surface-soft);color:var(--primary-deep);font-size:14px;font-weight:700;transition:background .12s ease;}
  .qty-btn:hover{background:#efd9d3;}
  .sale-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
  .total-row{display:flex;justify-content:space-between;font-weight:800;color:var(--primary-deep);font-size:16.5px;margin-bottom:12px;}
  .pay-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .pay-btn{flex:1;min-width:70px;padding:10px 6px;border-radius:var(--radius-sm);background:var(--surface-soft);color:var(--ink-soft);font-size:12.5px;font-weight:700;transition:all .15s ease;}
  .pay-btn.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(153,52,119,0.5);}
  .empty-cart{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-family:'League Spartan',sans-serif;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-deep);color:#fff;padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;box-shadow:var(--shadow-md);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .receipt-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1000px 560px at 50% -10%, rgba(122,183,26,0.12), transparent 60%),var(--bg);}
  .receipt-card{background:#fff;border-radius:var(--radius-lg);padding:32px 26px;max-width:340px;text-align:center;box-shadow:var(--shadow-lg);}
  .receipt-card .mark{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;box-shadow:0 10px 22px -10px rgba(122,183,26,0.55);}
</style>
</head>
<body>
<div id="root"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhPrEfQSfWOjP2X7GtcXKp86RMWHZa-NQ",
  authDomain: "casa-de-los-placeres.firebaseapp.com",
  projectId: "casa-de-los-placeres",
  storageBucket: "casa-de-los-placeres.firebasestorage.app",
  messagingSenderId: "689677749733",
  appId: "1:689677749733:web:3cc2900d04a78b652cf30c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Mismo contador compartido con index.html: folio consecutivo único para
// pedidos de la tienda y ventas del Punto de Venta.
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}
function formatFolio(n){ return n ? '#' + String(n).padStart(4,'0') : ''; }
const auth = firebase.auth();

const PALETTE = ["#BC355C","#6E2159","#1AA0B2","#0A4A5B","#ED7578","#4A1642","#F6A030","#6E9E1A","#8a6b78","#993477","#20B7CA","#7AB71A"];
function catColor(cat){ const i = state.categories.indexOf(cat); return PALETTE[(i<0?0:i) % PALETTE.length]; }
const PAY_METHODS = ["Efectivo","Tarjeta","Transferencia"];
// Devuelve el desglose de pago de una venta ya guardada: usa "payments" (ventas divididas
// o registradas después de este cambio) y cae de vuelta a "paymentMethod" para ventas viejas.
function salePayments(s){
  if(s.payments && s.payments.length) return s.payments;
  return [{method: s.paymentMethod || 'Efectivo', amount: s.total||0}];
}
function splitRemaining(){
  const assigned = PAY_METHODS.reduce((s,m)=>s+(Number(state.splitAmounts[m])||0), 0);
  return Math.round(saleTotal() - assigned);
}

let state = {
  authChecked:false, user:null, loginEmail:"", loginPassword:"", loginError:"",
  loaded:false, products:[], categories:[], coupons:[], cashiers:[], centers:[], activeCenter:null,
  activeCashier:null, pinConfirmed:false, pinInput:"", pinError:"",
  activeCat:"Todos", search:"", cart:{}, payMethod:"Efectivo", splitAmounts:{},
  saleDone:false, lastSaleTotal:0, lastOrderNumber:null, lastPayments:[], sending:false, variantPickerProduct:null,
  // Apertura/cierre de caja: la caja pertenece a la combinación cajero + centro.
  activeCashRegister:null, cashRegisterChecked:false, cashRegisterLoading:false,
  openingAmountInput:"", openingError:"", openingSubmitting:false,
  cashPanelOpen:false, movementModalOpen:false, movementType:"retiro", movementAmount:"", movementNote:"", movementError:"",
  closingOpen:false, closingLoading:false, closingSummary:null, closingCountedCash:"", closingNotes:"", closingError:"",
  // Cliente, ajuste por envío y notas de la venta actual.
  customers:[], activeCustomer:null, customerPickerOpen:false, customerSearchPOS:"",
  newCustomerMode:false, newCustomerName:"", newCustomerPhone:"", newCustomerAddress:"",
  manualDiscount:null, discountModalOpen:false, discountType:"fixed", discountValueInput:"", discountCouponInput:"", discountReasonInput:"", discountError:"",
  saleNotes:"", notesModalOpen:false, notesDraft:"",
};
function centerStock(p, centerId){ return (p.stockByCenter && p.stockByCenter[centerId]) || 0; }

async function loadData(){
  try{
    const [prodSnap, setSnap, cashiersSnap, centersSnap, customersSnap] = await Promise.all([
      db.collection('products').get(),
      db.collection('settings').doc('store').get(),
      db.collection('cashiers').get(),
      db.collection('distributionCenters').get(),
      db.collection('customers').get(),
    ]);
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.categories = setSnap.exists ? (setSnap.data().categories||[]) : [];
    state.coupons = setSnap.exists ? (setSnap.data().coupons||[]) : [];
    state.cashiers = cashiersSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(c=>c.active);
    state.centers = centersSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(c=>c.active);
    state.customers = customersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.centers.length===0){
      const ref = await db.collection('distributionCenters').add({name:'Principal', isDefault:true, active:true, createdAt:new Date().toISOString()});
      state.centers = [{id:ref.id, name:'Principal', isDefault:true, active:true}];
    }
    // Si este dispositivo ya tenía un centro elegido y sigue activo, se retoma solo.
    const savedCenterId = localStorage.getItem('cdlp_pos_center');
    if(savedCenterId){
      const match = state.centers.find(c=>c.id===savedCenterId);
      if(match) state.activeCenter = match;
    }
  }catch(e){ console.error(e); showToast('No se pudo cargar la información'); }
  state.loaded = true; render();
}
function money(n){ return '$' + Number(Math.round(n)).toLocaleString('es-MX') + ' MXN'; }
function icon(name, size){
  size = size || 15;
  const P = {
    x:'<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    'map-pin':'<path d="M12 21s7-6.8 7-12a7 7 0 1 0-14 0c0 5.2 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/>',
    wallet:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.2"/><path d="M6 10v4M18 10v4"/>',
    layers:'<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 12l10 5 10-5"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
    percent:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.2"/><circle cx="17.5" cy="17.5" r="2.2"/>',
    'file-text':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/>',
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;display:inline-block" aria-hidden="true">${P[name]||''}</svg>`;
}

function onPosSearchInput(v){
  state.search = v;
  render();
  const i = document.getElementById('pos-search-input');
  if(i){ i.focus(); i.setSelectionRange(v.length, v.length); }
}
function showToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

auth.onAuthStateChanged(user=>{
  state.user = user; state.authChecked = true;
  if(user && !state.loaded){ loadData(); } else { render(); }
});
async function handleLogin(){
  state.loginError='';
  try{ await auth.signInWithEmailAndPassword(state.loginEmail.trim(), state.loginPassword); }
  catch(e){ state.loginError='Correo o contraseña incorrectos'; render(); }
}
function handleLogout(){
  auth.signOut(); state.loaded=false; state.activeCashier=null; state.pinConfirmed=false;
  state.activeCashRegister=null; state.cashRegisterChecked=false;
}

function selectCashier(c){ state.activeCashier = c; state.pinInput=''; state.pinError=''; state.pinConfirmed=false; render(); }
function confirmCashierPin(){
  if(state.pinInput === state.activeCashier.pin){ state.pinConfirmed=true; state.pinInput=''; state.pinError=''; render(); }
  else{ state.pinError='PIN incorrecto'; state.pinInput=''; render(); }
}
function changeCashier(){
  state.activeCashier=null; state.pinConfirmed=false; state.cart={};
  state.activeCashRegister=null; state.cashRegisterChecked=false;
  render();
}
function selectCenter(id){
  const c = state.centers.find(x=>x.id===id); if(!c) return;
  state.activeCenter = c; state.cart={};
  state.activeCashRegister=null; state.cashRegisterChecked=false;
  try{ localStorage.setItem('cdlp_pos_center', c.id); }catch(e){}
  render();
}
function changeCenter(){
  state.activeCenter=null; state.cart={};
  state.activeCashRegister=null; state.cashRegisterChecked=false;
  render();
}

/* ============== APERTURA / CIERRE DE CAJA ==============
   La caja pertenece a la combinación cajero + centro: si el mismo cajero vuelve
   a entrar al mismo centro más tarde (incluso desde otro dispositivo), retoma la
   caja que dejó abierta, junto con sus movimientos. */
async function loadCashRegister(){
  state.cashRegisterLoading = true;
  try{
    const snap = await db.collection('cashRegisters')
      .where('cashierId','==', state.activeCashier.id)
      .where('centerId','==', state.activeCenter.id)
      .where('status','==','abierta')
      .limit(1).get();
    state.activeCashRegister = snap.empty ? null : {id:snap.docs[0].id, ...snap.docs[0].data()};
  }catch(e){ console.error(e); showToast('No se pudo verificar la caja'); state.activeCashRegister=null; }
  state.cashRegisterChecked = true; state.cashRegisterLoading = false; render();
}
async function openCashRegister(){
  if(state.openingSubmitting) return;
  const amount = Number(state.openingAmountInput);
  if(state.openingAmountInput.trim()==='' || isNaN(amount) || amount<0){ state.openingError='Ingresa un monto válido'; render(); return; }
  state.openingSubmitting = true; state.openingError=''; render();
  const payload = {
    cashierId: state.activeCashier.id, cashierName: state.activeCashier.name,
    centerId: state.activeCenter.id, centerName: state.activeCenter.name,
    openedAt: new Date().toISOString(), openingAmount: amount,
    status: 'abierta', movements: [],
  };
  try{
    const ref = await db.collection('cashRegisters').add(payload);
    state.activeCashRegister = {id:ref.id, ...payload};
    state.openingAmountInput='';
    showToast('Caja abierta');
  }catch(e){ console.error(e); showToast('No se pudo abrir la caja'); }
  state.openingSubmitting = false; render();
}
function renderCashOpenScreen(){
  return `<div class="select-screen"><div class="card">
    <h2>Abrir caja</h2>
    <p>${state.activeCashier.name} · ${state.activeCenter.name}<br>Registra el fondo inicial en efectivo con el que empiezas el turno.</p>
    <input class="field-input" type="number" inputmode="decimal" placeholder="Fondo inicial (efectivo)" value="${state.openingAmountInput}" oninput="state.openingAmountInput=this.value" onkeydown="if(event.key==='Enter')openCashRegister()">
    <div class="err">${state.openingError||''}</div>
    <button class="btn-primary" ${state.openingSubmitting?'disabled style="opacity:.5"':''} onclick="openCashRegister()">${state.openingSubmitting?'Abriendo…':'Abrir caja'}</button>
    <button class="btn-secondary" onclick="changeCashier()">Cambiar cajero</button>
  </div></div>`;
}

async function saveCashMovement(){
  const amount = Number(state.movementAmount);
  if(state.movementAmount.trim()==='' || isNaN(amount) || amount<=0){ state.movementError='Ingresa un monto válido'; render(); return; }
  const mov = {type: state.movementType, amount, note: state.movementNote.trim(), date: new Date().toISOString()};
  try{
    await db.collection('cashRegisters').doc(state.activeCashRegister.id).update({
      movements: firebase.firestore.FieldValue.arrayUnion(mov)
    });
    if(!state.activeCashRegister.movements) state.activeCashRegister.movements=[];

async function openCashClose(){
  state.closingLoading = true; render();
  try{
    const snap = await db.collection('sales').where('cashRegisterId','==', state.activeCashRegister.id).get();
    const sales = snap.docs.map(d=>d.data());
    const byPayment = {};
    PAY_METHODS.forEach(m=>byPayment[m]=0);
    let total=0;
    sales.forEach(s=>{
      salePayments(s).forEach(pm=>{
        const m = byPayment.hasOwnProperty(pm.method) ? pm.method : 'Efectivo';
        byPayment[m]=(byPayment[m]||0)+(pm.amount||0);
      });
      total+=s.total||0;
    });
    const movs = state.activeCashRegister.movements||[];
    const ingresos = movs.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.amount,0);
    const retiros = movs.filter(m=>m.type==='retiro').reduce((s,m)=>s+m.amount,0);
    const expectedCash = (state.activeCashRegister.openingAmount||0) + (byPayment['Efectivo']||0) + ingresos - retiros;
    state.closingSummary = { salesCount: sales.length, total, byPayment, ingresos, retiros, expectedCash };
    state.closingCountedCash=''; state.closingNotes=''; state.closingError='';
    state.closingOpen = true;
  }catch(e){ console.error(e); showToast('No se pudo preparar el cierre de caja'); }
  state.closingLoading=false; render();
}
function renderCashCloseScreen(){
  const s = state.closingSummary, cr = state.activeCashRegister;
  if(!s) return `<div class="loading-screen">Preparando cierre…</div>`;
  const hasCounted = state.closingCountedCash.trim()!=='';
  const counted = Number(state.closingCountedCash)||0;
  const diff = hasCounted ? (counted - s.expectedCash) : null;
  return `<div class="receipt-screen"><div class="receipt-card" style="max-width:400px;text-align:left;">
    <h2 style="text-align:center;margin-bottom:14px;">Cerrar caja</h2>
    <div class="order-detail" style="margin-bottom:12px;">
      <div><span>Cajero</span><span>${cr.cashierName}</span></div>
      <div><span>Centro</span><span>${cr.centerName}</span></div>
      <div><span>Fondo inicial</span><span>${money(cr.openingAmount)}</span></div>
      ${PAY_METHODS.map(m=>`<div><span>Ventas en ${m}</span><span>${money(s.byPayment[m]||0)}</span></div>`).join('')}
      <div><span>Ingresos de caja</span><span>${money(s.ingresos)}</span></div>
      <div><span>Retiros de caja</span><span>-${money(s.retiros)}</span></div>
      <div style="font-weight:800;border-top:1px dashed var(--border);margin-top:6px;padding-top:6px;"><span>Efectivo esperado</span><span>${money(s.expectedCash)}</span></div>
    </div>
    <input class="field-input" type="number" inputmode="decimal" placeholder="Efectivo contado" value="${state.closingCountedCash}" oninput="state.closingCountedCash=this.value">
    ${diff!==null ? `<div style="text-align:center;font-weight:700;margin:-4px 0 10px;color:${diff===0?'var(--green)':(diff>0?'var(--amber)':'var(--rose)')};">${diff===0?'Cuadra exacto':(diff>0?`Sobrante de ${money(diff)}`:`Faltante de ${money(Math.abs(diff))}`)}</div>` : ''}
    <input class="field-input" type="text" placeholder="Notas (opcional)" value="${state.closingNotes}" oninput="state.closingNotes=this.value">
    <div class="err">${state.closingError||''}</div>

async function confirmCashClose(){
  if(state.closingCountedCash.trim()===''){ state.closingError='Ingresa el efectivo contado'; render(); return; }
  const counted = Number(state.closingCountedCash);
  if(isNaN(counted) || counted<0){ state.closingError='Monto inválido'; render(); return; }
  const s = state.closingSummary;
  const diff = counted - s.expectedCash;
  const payload = {
    status:'cerrada', closedAt: new Date().toISOString(),
    salesCount: s.salesCount, totalSales: s.total, salesByPayment: s.byPayment,
    cashIngresos: s.ingresos, cashRetiros: s.retiros,
    expectedCash: s.expectedCash, countedCash: counted, difference: diff,
    closingNotes: state.closingNotes.trim(),
  };
  try{
    await db.collection('cashRegisters').doc(state.activeCashRegister.id).update(payload);
  }catch(e){ console.error(e); showToast('No se pudo cerrar la caja'); return; }
  showToast('Caja cerrada');
  state.activeCashRegister=null; state.cashRegisterChecked=false; state.closingOpen=false; state.closingSummary=null;
  state.activeCashier=null; state.pinConfirmed=false; state.cart={};
  render();
}

function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function effectivePrice(p){ return (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : p.price; }
function cartKey(productId, variantId){ return variantId ? `${productId}::${variantId}` : productId; }
function parseCartKey(key){
  const parts = key.split('::');
  const p = state.products.find(x=>x.id===parts[0]);
  const v = (parts[1] && p) ? (p.variants||[]).find(x=>x.id===parts[1]) : null;
  return {p, v};
}
function itemPrice(p, v){ return v && v.priceOverride>0 ? v.priceOverride : effectivePrice(p); }
function itemStockPOS(p, v){ return v ? (v.stock||0) : centerStock(p, state.activeCenter.id); }
function variantLabel(v){ return v ? Object.values(v.combo||{}).join(' / ') : ''; }
function cartTotal(){ return Object.entries(state.cart).reduce((s,[key,qty])=>{const {p,v}=parseCartKey(key); return s+(p?itemPrice(p,v)*qty:0);},0); }
function addToCart(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  if(p.variantGroups && p.variantGroups.length){ state.variantPickerProduct = id; render(); return; }
  const available = centerStock(p, state.activeCenter.id);
  if(available<=(state.cart[id]||0)){ showToast(`Sin existencias suficientes en ${state.activeCenter.name}`); return; }
  state.cart[id]=(state.cart[id]||0)+1; render();
}
function pickVariant(variantId){
  const p = state.products.find(x=>x.id===state.variantPickerProduct);
  const v = (p.variants||[]).find(x=>x.id===variantId);
  const key = cartKey(p.id, variantId);
  if(itemStockPOS(p,v)<=(state.cart[key]||0)){ showToast('Sin existencias suficientes de esta variante'); return; }
  state.cart[key] = (state.cart[key]||0)+1;
  state.variantPickerProduct = null;
  render();
}
function changeQty(id,delta){ const cur=state.cart[id]||0; const next=cur+delta; if(next<=0) delete state.cart[id]; else state.cart[id]=next; render(); }

/* ============== AJUSTE POR ENVÍO (descuento manual) ==============
   Adicional a los descuentos y promociones ya aplicados en el precio de cada
   producto; requiere siempre un motivo de justificación. */
function prodCats(p){ return (p.categories && p.categories.length) ? p.categories : (p.cat ? [p.cat] : []); }
function isCouponEligibleItem(prodCategories, prodId, coupon){
  if(coupon.scope==='all') return true;
  if(coupon.scope==='categories') return (prodCategories||[]).some(c=>(coupon.categories||[]).includes(c));
  if(coupon.scope==='products') return (coupon.productIds||[]).includes(prodId);
  return false;
}
function couponEligibleCartEntries(coupon){
  return Object.entries(state.cart).map(([key,qty])=>{ const {p,v}=parseCartKey(key); return {key,qty,p,v}; })
    .filter(({p})=>p && isCouponEligibleItem(prodCats(p), p.id, coupon));
}
function couponDiscountAmount(coupon){
  return couponEligibleCartEntries(coupon).reduce((s,{p,v,qty})=>s + Math.round(itemPrice(p,v)*qty*(coupon.discountPercent/100)), 0);
}
function currentDiscountAmount(){
  if(!state.manualDiscount) return 0;
  const subtotal = cartTotal();
  if(state.manualDiscount.type==='percent') return Math.round(subtotal * (state.manualDiscount.value/100));
  if(state.manualDiscount.type==='coupon') return couponDiscountAmount(state.manualDiscount.coupon);
  return Math.min(state.manualDiscount.value, subtotal);
}
function saleTotal(){ return Math.max(0, cartTotal() - currentDiscountAmount()); }
function openDiscountModal(){
  state.discountType = state.manualDiscount ? state.manualDiscount.type : 'fixed';
  state.discountValueInput = state.manualDiscount && state.manualDiscount.type!=='coupon' ? String(state.manualDiscount.value) : '';
  state.discountCouponInput = state.manualDiscount && state.manualDiscount.type==='coupon' ? state.manualDiscount.coupon.code : '';
  state.discountReasonInput = state.manualDiscount ? (state.manualDiscount.reason||'') : '';
  state.discountError = ''; state.discountModalOpen = true; render();
}
function saveManualDiscount(){
  const value = Number(state.discountValueInput);
  const reason = state.discountReasonInput.trim();
  if(state.discountValueInput.trim()==='' || isNaN(value) || value<=0){ state.discountError='Ingresa un monto válido'; render(); return; }
  if(state.discountType==='percent' && value>100){ state.discountError='El porcentaje no puede ser mayor a 100'; render(); return; }
  if(!reason){ state.discountError='Escribe un motivo para el ajuste'; render(); return; }
  state.manualDiscount = {type: state.discountType, value, reason};
  state.discountModalOpen = false; render();
}
async function applyCouponDiscount(){
  const code = state.discountCouponInput.trim().toUpperCase();
  if(!code){ state.discountError='Ingresa un código de cupón'; render(); return; }
  const coupon = (state.coupons||[]).find(c=>c.code===code);
  if(!coupon || !coupon.active){ state.discountError='Código no válido'; render(); return; }
  const now = new Date();
  if(coupon.startDate && now < new Date(coupon.startDate)){ state.discountError='Este cupón todavía no está vigente'; render(); return; }
  if(coupon.endDate && now > new Date(coupon.endDate+'T23:59:59')){ state.discountError='Este cupón ya venció'; render(); return; }
  if(couponEligibleCartEntries(coupon).length===0){ state.discountError='Este cupón no aplica a los productos de la venta actual'; render(); return; }
  if(coupon.maxUses>0){
    try{
      const used = await db.collection('couponUsage').where('code','==',code).get();
      if(used.size >= coupon.maxUses){ state.discountError='Este cupón ya alcanzó su límite de usos'; render(); return; }
    }catch(e){ console.error(e); }
  }
  const reason = state.discountReasonInput.trim();
  state.manualDiscount = {type:'coupon', coupon, reason: reason || `Cupón ${code}`};
  state.discountModalOpen = false; state.discountError=''; render();
}
function removeManualDiscount(){ state.manualDiscount=null; state.discountModalOpen=false; render(); }

      <div class="pay-row" style="margin:0 0 10px;">
        <button class="pay-btn ${state.discountType==='fixed'?'active':''}" onclick="state.discountType='fixed';render()">Monto fijo</button>

        <div class="err">${state.discountError||''}</div>
        <button class="btn-primary" onclick="applyCouponDiscount()">Aplicar cupón</button>
        ${state.manualDiscount && state.manualDiscount.type==='coupon' ? `<button class="btn-secondary" onclick="removeManualDiscount()">Quitar cupón</button>` : ''}
        <button class="btn-secondary" onclick="state.discountModalOpen=false;render()">Cancelar</button>
      ` : `
        ${state.discountType==='percent' ? `
          <div style="display:flex;gap:6px;margin-bottom:10px;">
            ${[5,10,15,20].map(p=>`<button class="cat-chip ${Number(state.discountValueInput)===p?'active':''}" style="flex:1;text-align:center;" onclick="state.discountValueInput='${p}';render()">${p}%</button>`).join('')}
          </div>
        ` : ''}
        <input class="field-input" type="number" inputmode="decimal" placeholder="${state.discountType==='percent'?'Porcentaje (%)':'Monto del ajuste ($)'}" value="${state.discountValueInput}" oninput="state.discountValueInput=this.value">
        ${state.discountValueInput ? `<div style="font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;">Descuento sobre esta venta: ${money(preview)}</div>` : ''}
        <input class="field-input" type="text" placeholder="Motivo (obligatorio)" value="${state.discountReasonInput}" oninput="state.discountReasonInput=this.value">
        <div class="err">${state.discountError||''}</div>
        <button class="btn-primary" onclick="saveManualDiscount()">Aplicar ajuste</button>
        ${state.manualDiscount && state.manualDiscount.type!=='coupon' ? `<button class="btn-secondary" onclick="removeManualDiscount()">Quitar ajuste</button>` : ''}

async function chargeSale(){
  if(cartCount()===0 || state.sending) return;
  if(!state.activeCashRegister){ showToast('Abre la caja antes de vender'); return; }
  let payments;
  if(state.payMethod === 'Dividido'){
    payments = PAY_METHODS.map(m=>({method:m, amount: Math.round(Number(state.splitAmounts[m])||0)})).filter(p=>p.amount>0);
    if(payments.length < 2){ showToast('Ingresa al menos dos métodos de pago para dividir la venta'); return; }
    if(splitRemaining() !== 0){ showToast('La suma de los pagos divididos debe ser igual al total'); return; }
  }
  state.sending = true; render();
  const centerId = state.activeCenter.id;
  const items = Object.entries(state.cart).map(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    return {id:p.id, variantId: v?v.id:null, name: p.name+(v?` (${variantLabel(v)})`:''), price:itemPrice(p,v), qty};
  });
  const subtotal = items.reduce((s,it)=>s+it.price*it.qty,0);
  const discountAmount = currentDiscountAmount();
  const total = subtotal - discountAmount;
  if(!payments) payments = [{method: state.payMethod, amount: total}];
  let manualDiscountPayload = null;
  if(state.manualDiscount){
    manualDiscountPayload = { type: state.manualDiscount.type, amount: discountAmount, reason: state.manualDiscount.reason };
    if(state.manualDiscount.type==='coupon') manualDiscountPayload.code = state.manualDiscount.coupon.code;
    else manualDiscountPayload.value = state.manualDiscount.value;
  }
  try{
    const orderNumber = await getNextOrderNumber();
    await Promise.all(items.map(it=>{
      const p = state.products.find(x=>x.id===it.id);
      if(it.variantId){
        const v = (p.variants||[]).find(x=>x.id===it.variantId);
        v.stock = Math.max(0, (v.stock||0) - it.qty);
        p.stock = Math.max(0, (p.stock||0) - it.qty);
        return db.collection('products').doc(it.id).update({variants: p.variants, stock: p.stock});
      }
      if(!p.stockByCenter) p.stockByCenter = {};
      p.stockByCenter[centerId] = Math.max(0, (p.stockByCenter[centerId]||0) - it.qty);
      p.stock = Math.max(0, (p.stock||0) - it.qty);
      return db.collection('products').doc(it.id).update({stockByCenter: p.stockByCenter, stock: p.stock});
    }));
    await db.collection('sales').add({
      date: new Date().toISOString(), orderNumber, source:"pos",
      cashierId: state.activeCashier.id, cashierName: state.activeCashier.name,
      centerId, centerName: state.activeCenter.name,
      cashRegisterId: state.activeCashRegister.id,
      items, subtotal, total, paymentMethod: state.payMethod, payments,
      manualDiscount: manualDiscountPayload,
      couponCode: state.manualDiscount && state.manualDiscount.type==='coupon' ? state.manualDiscount.coupon.code : null,
      customerId: state.activeCustomer ? state.activeCustomer.id : null,
      customerName: state.activeCustomer ? state.activeCustomer.name : null,
      customerPhone: state.activeCustomer ? (state.activeCustomer.phone||'') : null,
      notes: state.saleNotes || '',
    });
    if(state.manualDiscount && state.manualDiscount.type==='coupon'){
      try{ await db.collection('couponUsage').add({code: state.manualDiscount.coupon.code, date:new Date().toISOString()}); }
      catch(e){ console.error('No se pudo registrar el uso del cupón', e); }
    }
    state.lastSaleTotal = total; state.lastOrderNumber = orderNumber; state.lastPayments = payments; state.cart = {}; state.saleDone = true;
    state.manualDiscount = null; state.activeCustomer = null; state.saleNotes = ''; state.splitAmounts = {}; state.payMethod = 'Efectivo';
  }catch(e){
    console.error(e); showToast('No se pudo registrar la venta');
  }
  state.sending = false; render();
}
function newSale(){ state.saleDone=false; render(); }
function renderVariantPickerModal(){
  const p = state.products.find(x=>x.id===state.variantPickerProduct);
  if(!p) return '';
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.variantPickerProduct=null;render();}">
    <div class="modal" style="max-width:380px;">
      <h3>${p.name}</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:12px;">Elige la variante</p>
      ${(p.variants||[]).map(v=>`
        <button class="cashier-item" style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;" ${v.stock<=0?'disabled style="opacity:.4"':''} onclick="pickVariant('${v.id}')">
          <span>${variantLabel(v)}</span>
          <span style="font-size:12px;color:var(--ink-soft);">${v.stock<=0?'Agotado':`Stock: ${v.stock}`}</span>
        </button>
      `).join('')}
      <button class="pill-btn" style="width:100%;background:var(--surface-soft);color:var(--ink-soft);margin-top:4px;" onclick="state.variantPickerProduct=null;render()">Cancelar</button>
    </div>
  </div>`;
}

function renderLogin(){
  return `
  <div class="login-screen"><div class="card">
    <h2>Punto de venta</h2>
    <p>Inicia sesión con tu cuenta de administrador</p>
    <input type="email" placeholder="Correo" value="${state.loginEmail}" oninput="state.loginEmail=this.value">
    <input type="password" placeholder="Contraseña" value="${state.loginPassword}" oninput="state.loginPassword=this.value" onkeydown="if(event.key==='Enter')handleLogin()">
    <div class="err">${state.loginError}</div>
    <button class="btn-primary" onclick="handleLogin()">Entrar</button>
  </div></div>`;
}

function renderCashierSelect(){
  if(state.cashiers.length===0){
    return `<div class="select-screen"><div class="card">
      <h2>Sin cajeros configurados</h2>
      <p>Ve al panel de administración → pestaña Cajeros, y crea al menos uno para poder usar el punto de venta.</p>
      <button class="btn-primary" onclick="handleLogout()">Cerrar sesión</button>
    </div></div>`;
  }
  return `<div class="select-screen"><div class="card">
    <h2>¿Quién está atendiendo?</h2>
    <p>Selecciona tu nombre para comenzar</p>
    <div class="cashier-list">
      ${state.cashiers.map(c=>`<button class="cashier-item" onclick='selectCashier(${JSON.stringify(c).replace(/'/g,"&apos;")})'>${c.name}</button>`).join('')}
    </div>
  </div></div>`;
}

function renderPinScreen(){
  return `<div class="select-screen"><div class="card">
    <h2>Hola, ${state.activeCashier.name}</h2>
    <p>Ingresa tu PIN</p>
    <input class="pin" type="password" inputmode="numeric" maxlength="6" value="${state.pinInput}" oninput="state.pinInput=this.value" onkeydown="if(event.key==='Enter')confirmCashierPin()">
    <div class="err">${state.pinError}</div>
    <button class="btn-primary" onclick="confirmCashierPin()">Entrar</button>
  </div></div>`;
}

function renderCenterSelect(){
  if(state.centers.length===0){
    return `<div class="select-screen"><div class="card">
      <h2>Sin centros configurados</h2>
      <p>Ve al panel de administración → pestaña Centros, y crea al menos uno.</p>
      <button class="btn-primary" onclick="handleLogout()">Cerrar sesión</button>
    </div></div>`;
  }
  return `<div class="select-screen"><div class="card">
    <h2>¿Desde qué centro vas a trabajar?</h2>
    <p>El inventario y las ventas se descuentan de este centro. Este celular/terminal recordará tu elección.</p>
    <div class="cashier-list">
      ${state.centers.map(c=>`<button class="cashier-item" onclick="selectCenter('${c.id}')">${c.name}${c.isDefault?' (Principal)':''}</button>`).join('')}
    </div>
  </div></div>`;
}

function renderPOS(){
  const cats = ["Todos", ...state.categories];
  let filtered = state.activeCat==="Todos" ? state.products : state.products.filter(p=>(p.categories||[p.cat]).includes(state.activeCat));
  if(state.search.trim()) filtered = filtered.filter(p=>p.name.toLowerCase().includes(state.search.trim().toLowerCase()));
  const entries = Object.entries(state.cart);
  return `
  <div class="app">
    <div class="top">
      <div><div class="brand">${state.activeCashier.name}</div><div class="sub">Punto de venta · ${icon('map-pin')} ${state.activeCenter.name}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="pill-btn" onclick="state.cashPanelOpen=true;render()">${icon('wallet')} Caja</button>
        <button class="pill-btn" onclick="changeCenter()">Cambiar centro</button>
        <button class="pill-btn" onclick="changeCashier()">Cambiar cajero</button>
        <button class="pill-btn" onclick="handleLogout()">Salir</button>
      </div>
    </div>
    <div class="pos-body">
      <div class="toolbar">
        <div class="search-row"><input id="pos-search-input" placeholder="Buscar producto..." value="${state.search}" oninput="onPosSearchInput(this.value)"></div>
        <div class="cats">${cats.map(c=>`<button class="cat-chip ${state.activeCat===c?'active':''}" onclick="state.activeCat='${c.replace(/'/g,"\\'")}';render()">${c}</button>`).join('')}</div>
      </div>
      <div class="prod-grid">
        ${filtered.map(p=>{
          const hasVariants = p.variantGroups && p.variantGroups.length>0;
          const hasPromo = p.promoPrice>0 && p.promoPrice<p.price;
          return `
          <div class="prod-card" onclick="addToCart('${p.id}')">
            ${p.images&&p.images.length ? `<img class="prod-swatch" src="${p.images[0]}" style="object-fit:cover;">` : `<div class="prod-swatch" style="background:${catColor(p.cat)}"></div>`}
            <div class="prod-name">${p.name}${hasVariants?' '+icon('layers',13):''}</div>
            <div class="prod-price">${hasPromo?`<s style="opacity:.6;font-size:11px;">${money(p.price)}</s> ${money(p.promoPrice)}`:money(p.price)}</div>
            <div class="prod-stock">${hasVariants?'Elegir variante':`Stock en ${state.activeCenter.name}: ${centerStock(p, state.activeCenter.id)}`}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="sale-panel">
      <div class="sale-head"><h3>Venta actual (${cartCount()})</h3></div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;">
        <button class="cat-chip ${state.activeCustomer?'active':''}" onclick="openCustomerPicker()">${icon('user')} ${state.activeCustomer?state.activeCustomer.name:'Cliente'}</button>
        <button class="cat-chip ${state.manualDiscount?'active':''}" onclick="openDiscountModal()">${icon('percent')} ${state.manualDiscount?(state.manualDiscount.type==='coupon'?('Cupón '+state.manualDiscount.coupon.code):('-'+money(currentDiscountAmount()))):'Descuento'}</button>
        <button class="cat-chip ${state.saleNotes?'active':''}" onclick="openNotesModal()">${icon('file-text')} ${state.saleNotes?'Notas '+icon('check',12):'Notas'}</button>
      </div>
      <div class="sale-items">
        ${entries.length===0 ? `<div class="empty-cart">Toca un producto para agregarlo a la venta.</div>` :
          entries.map(([key,qty])=>{const {p,v}=parseCartKey(key); if(!p) return ''; const price=itemPrice(p,v); return `
            <div class="sale-item">
              <div class="name">${p.name}${v?` <span style="color:var(--ink-soft);">(${variantLabel(v)})</span>`:''}</div>
              <button class="qty-btn" onclick="changeQty('${key}',-1)">−</button>
              <div>${qty}</div>
              <button class="qty-btn" onclick="changeQty('${key}',1)">+</button>
              <div style="width:70px;text-align:right;font-weight:600;">${money(price*qty)}</div>
            </div>`;}).join('')}
      </div>
      <div class="sale-foot">
        ${state.manualDiscount ? `
          <div class="total-row" style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;"><span>Subtotal</span><span>${money(cartTotal())}</span></div>
          <div class="total-row" style="font-size:12.5px;font-weight:600;color:var(--rose);margin-bottom:6px;"><span>${state.manualDiscount.type==='coupon'?`Cupón ${state.manualDiscount.coupon.code}`:`Descuento${state.manualDiscount.type==='percent'?` (${state.manualDiscount.value}%)`:''}`}</span><span>-${money(currentDiscountAmount())}</span></div>
        ` : ''}
        <div class="total-row"><span>Total</span><span>${money(saleTotal())}</span></div>
        <div class="pay-row">${PAY_METHODS.concat(['Dividido']).map(m=>`<button class="pay-btn ${state.payMethod===m?'active':''}" onclick="state.payMethod='${m}';render()">${m}</button>`).join('')}</div>
        ${state.payMethod==='Dividido' ? renderSplitPaymentInputs() : ''}
        <button class="btn-primary" ${entries.length===0||state.sending||(state.payMethod==='Dividido'&&splitRemaining()!==0)?'disabled style="opacity:.5"':''} onclick="chargeSale()">${state.sending?'Procesando…':'Cobrar '+money(saleTotal())}</button>
      </div>
    </div>
  </div>
  ${state.variantPickerProduct ? renderVariantPickerModal() : ''}`;
}

function renderSplitPaymentInputs(){
  const remaining = splitRemaining();
  return `
  <div style="background:var(--surface-soft);border-radius:12px;padding:10px 12px;margin:-2px 0 10px;">
    ${PAY_METHODS.map(m=>`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="flex:1;font-size:13px;color:var(--ink-soft);">${m}</span>
        <input class="field-input" style="margin:0;width:110px;text-align:right;" type="number" inputmode="decimal" min="0" placeholder="0" value="${state.splitAmounts[m]||''}" onchange="state.splitAmounts['${m}']=this.value;render()">
      </div>
    `).join('')}
    <div style="text-align:center;font-size:12.5px;font-weight:700;margin:2px 0 0;color:${remaining===0?'var(--green)':'var(--rose)'};">
      ${remaining===0 ? 'Los montos cuadran con el total' : (remaining>0 ? `Faltan ${money(remaining)} por asignar` : `Te pasaste por ${money(Math.abs(remaining))}`)}
    </div>
  </div>`;
}
function renderReceipt(){
  return `<div class="receipt-screen"><div class="receipt-card">
    <div class="mark">${icon('check',26)}</div>
    <h2>Venta registrada</h2>
    ${state.lastOrderNumber ? `<div style="font-weight:800;color:var(--primary-deep);font-size:15px;margin:6px 0 -6px;">Venta ${formatFolio(state.lastOrderNumber)}</div>` : ''}
    <p style="color:var(--ink-soft);font-size:13.5px;margin:10px 0 18px;">Total cobrado: <strong>${money(state.lastSaleTotal)}</strong><br>${(state.lastPayments&&state.lastPayments.length>1) ? `Pago dividido: ${state.lastPayments.map(p=>`${p.method} ${money(p.amount)}`).join(' · ')}` : `Método: ${(state.lastPayments&&state.lastPayments[0]&&state.lastPayments[0].method)||state.payMethod}`}<br>Atendió: ${state.activeCashier.name}</p>
    <button class="btn-primary" onclick="newSale()">Nueva venta</button>
  </div></div>`;
}

function render(){
  const root = document.getElementById('root');
  if(!state.authChecked){ root.innerHTML = `<div class="loading-screen">Verificando sesión…</div>`; return; }
  if(!state.user){ root.innerHTML = renderLogin(); return; }
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando…</div>`; return; }
  if(!state.activeCashier){ root.innerHTML = renderCashierSelect(); }
  else if(!state.pinConfirmed){ root.innerHTML = renderPinScreen(); }
  else if(!state.activeCenter){ root.innerHTML = renderCenterSelect(); }
  else if(!state.cashRegisterChecked){
    if(!state.cashRegisterLoading) loadCashRegister();
    root.innerHTML = `<div class="loading-screen">Verificando caja…</div>`;
  }
  else if(!state.activeCashRegister){ root.innerHTML = renderCashOpenScreen(); }
  else{
    let html = state.saleDone ? renderReceipt() : (state.closingLoading ? `<div class="loading-screen">Preparando cierre…</div>` : (state.closingOpen ? renderCashCloseScreen() : renderPOS()));
    if(state.cashPanelOpen) html += renderCashPanelModal();
    if(state.movementModalOpen) html += renderMovementModal();
    if(state.customerPickerOpen) html += renderCustomerPickerModal();
    if(state.discountModalOpen) html += renderDiscountModal();
    if(state.notesModalOpen) html += renderNotesModal();
    root.innerHTML = html;
  }
  if(!document.getElementById('toast')){ const t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
}
render();
</script>
</body>
</html>
