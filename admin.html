<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración — La Casa de los Placeres</title>
<script>
  // Se aplica antes de pintar nada, para que no haya un parpadeo de claro→oscuro al cargar.
  try{ if(localStorage.getItem('adminTheme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#FBF5F2; --surface:#FFFFFF; --surface-soft:#F6E9E6; --ink:#2B1620; --ink-soft:#6E5560;
    --primary:#993477; --primary-deep:#5C1F49; --rose:#BC355C; --coral:#ED7578; --amber:#F6A030;
    --green:#7AB71A; --teal:#20B7CA; --navy:#0A4A5B; --border:#EBD9D3;
    --danger-bg:#FBE2E6; --danger-ink:#A02040;
    --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-pill:999px;
    --shadow-sm:0 2px 8px -4px rgba(43,22,32,0.14);
    --shadow-md:0 12px 28px -12px rgba(43,22,32,0.20);
    --shadow-lg:0 24px 48px -20px rgba(43,22,32,0.28);
  }
  /* Tema oscuro: mismas variables, otros valores — todo lo demás en el CSS ya las usa con
     var(--xxx), así que no hace falta tocar ninguna otra regla para que el oscuro se aplique
     en todos lados. Independiente de "Diseño → Colores y tipografía" (eso solo afecta el
     aspecto de la tienda pública en index.html, nunca este panel). */
  :root[data-theme="dark"]{
    --bg:#17111A; --surface:#221A26; --surface-soft:#2C2230; --ink:#F2E8F0; --ink-soft:#B7A2B4;
    --primary:#B8478E; --primary-deep:#F3B4DE; --rose:#E36E8E; --coral:#F0968F; --amber:#F6B85B;
    --green:#93CC49; --teal:#4FD2E2; --navy:#0D2E38; --border:#3B2E3A;
    --danger-bg:#3D2229; --danger-ink:#F3A0B4;
    --shadow-sm:0 2px 8px -4px rgba(0,0,0,0.45);
    --shadow-md:0 12px 28px -12px rgba(0,0,0,0.55);
    --shadow-lg:0 24px 48px -20px rgba(0,0,0,0.65);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;} select,input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1100px;margin:0 auto;min-height:100vh;background:var(--surface);}
  .admin-top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 4px 16px -10px rgba(0,0,0,0.45);position:relative;z-index:25;}
  .admin-top .brand-name{font-size:16px;font-weight:700;font-family:'League Spartan',sans-serif;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;}
  .admin-top .brand-sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .admin-top-actions{display:flex;gap:8px;flex-shrink:0;}
  .logout-link{font-size:12px;background:rgba(255,255,255,0.14);padding:8px 13px;border-radius:var(--radius-pill);color:#fff;font-weight:600;white-space:nowrap;transition:background .15s ease;}
  .logout-link:hover{background:rgba(255,255,255,0.22);}
  @media(max-width:400px){
    .admin-top{padding:12px 16px;}
    .admin-top .brand-name{font-size:14.5px;max-width:50vw;}
    .admin-top .brand-sub{display:none;}
    .logout-link{font-size:11px;padding:7px 11px;}
  }
  .admin-tabs{display:flex;gap:4px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:20;}
  .admin-tabs::-webkit-scrollbar{display:none;}
  .admin-tab{padding:9px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap;transition:all .15s ease;}
  .admin-tab.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(153,52,119,0.5);}
  .tab-badge{display:inline-block;background:#BC355C;color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;margin-left:5px;vertical-align:2px;}
  .admin-tabs-sep{width:1px;flex-shrink:0;background:var(--border);margin:6px 4px;}

  /* Navegación agrupada del admin en celular: reemplaza la franja de 15 pestañas por un
     selector compacto con el nombre de la sección actual, que despliega las pestañas
     agrupadas por tema (Ventas, Catálogo, Personas, Analítica, Sistema). Mismas pestañas,
     mismas funciones — solo cambia la forma de llegar a ellas. */
  .admin-nav-mobile{display:none;}
  @media(max-width:760px){
    .admin-tabs-main{display:none;}
    .admin-nav-mobile{display:block;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);}
    .admin-nav-mobile-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:14.5px;font-weight:800;color:var(--primary-deep);background:var(--surface);font-family:'League Spartan',sans-serif;}
    .admin-nav-mobile-sheet{max-height:65vh;overflow-y:auto;padding:4px 14px 16px;border-top:1px solid var(--border);background:var(--bg);}
    .admin-nav-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 2px 7px;}
    .admin-nav-group-row{display:flex;flex-wrap:wrap;gap:7px;}
    .admin-nav-mobile .admin-tab{background:var(--surface);border:1.5px solid var(--border);min-height:38px;}
    .admin-nav-mobile .admin-tab.active{border-color:var(--primary);background:var(--surface);color:var(--primary-deep);}
  }
  .admin-body{padding:20px 20px 60px;}

  /* ===== BARRA LATERAL EN ESCRITORIO =====
     Mismo menú, mismas funciones (goTab, handleLogout, toggleTheme, openGlobalSearch) que la
     barra superior + el menú compacto de celular — solo cambia cómo se llega a ellas en
     pantallas grandes. Por debajo de 761px se sigue usando exactamente el menú compacto de
     siempre (.admin-nav-mobile), sin tocarlo. */
  .app-shell{display:block;}
  .admin-sidebar{display:none;}
  .admin-main{min-width:0;}
  @media(min-width:761px){
    .app-shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto;}
    .admin-sidebar{display:flex;flex-direction:column;width:240px;flex-shrink:0;background:var(--navy);min-height:100vh;position:sticky;top:0;padding:20px 12px;}
    .admin-main{flex:1;min-width:0;}
    .app{max-width:none;}
    .admin-top{display:none;}
    .admin-tabs-main{display:none;}
  }
  .sidebar-brand{padding:8px 10px 18px;border-bottom:1px solid rgba(255,255,255,0.14);margin-bottom:14px;}
  .sidebar-brand .brand-name{font-size:16px;font-weight:700;font-family:'League Spartan',sans-serif;color:#fff;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-brand .brand-sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .sidebar-nav{flex:1;overflow-y:auto;}
  .sidebar-group-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,0.4);margin:16px 10px 6px;}
  .sidebar-group-label:first-child{margin-top:0;}
  .sidebar-link{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.82);text-align:left;background:transparent;transition:background .15s ease,color .15s ease;margin-bottom:2px;}
  .sidebar-link svg{flex-shrink:0;opacity:0.85;}
  .sidebar-link:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .sidebar-link.active{background:var(--primary);color:#fff;font-weight:700;}
  .sidebar-link.active svg{opacity:1;}
  .sidebar-link .tab-badge{margin-left:auto;}
  .sidebar-footer{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.14);display:flex;flex-direction:column;gap:2px;}
  .sidebar-footer button,.sidebar-footer a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.7);text-align:left;background:none;transition:background .15s ease,color .15s ease;}
  .sidebar-footer button:hover,.sidebar-footer a:hover{background:rgba(255,255,255,0.08);color:#fff;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
  @media(min-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:960px){.stat-grid{grid-template-columns:repeat(6,1fr);}}
  .stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;transition:box-shadow .15s ease,transform .15s ease;}
  .stat-card.primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep));border-color:transparent;}
  .stat-card.primary .stat-label{color:rgba(255,255,255,0.78);}
  .stat-card.primary .stat-value{color:#fff;font-size:26px;}
  @media(max-width:699px){.stat-card.primary{grid-column:span 2;}}
  .stat-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;line-height:1.3;font-weight:600;}
  .stat-value{font-size:22px;font-weight:800;font-family:'League Spartan',sans-serif;color:var(--primary-deep);}
  .stat-delta{font-size:11px;margin-top:4px;font-weight:700;}
  .stat-delta.up{color:var(--green);}
  .stat-delta.down{color:var(--rose);}

  .panel{border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-bottom:20px;background:var(--surface);box-shadow:var(--shadow-sm);}
  .panel-title{font-size:14.5px;font-weight:700;color:var(--primary-deep);margin-bottom:14px;font-family:'League Spartan',sans-serif;}
  .panel-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:14px;}

  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;overflow-x:auto;}
  .bar-col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-val{font-size:10px;color:var(--ink-soft);margin-bottom:4px;font-weight:700;white-space:nowrap;}
  .bar-fill{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--primary);min-height:3px;transition:height .3s ease;}
  .bar-label{font-size:9.5px;color:var(--ink-soft);margin-top:6px;text-align:center;line-height:1.2;}

  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .hbar-label{width:110px;flex-shrink:0;font-size:12px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{flex:1;height:16px;background:var(--surface-soft);border-radius:8px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:8px;}
  .hbar-val{width:60px;text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:700;flex-shrink:0;}

  .list-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;background:var(--surface);transition:box-shadow .15s ease;}
  .list-row:hover{box-shadow:var(--shadow-sm);}
  .row-swatch{width:44px;height:44px;border-radius:9px;flex-shrink:0;object-fit:cover;}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:13.5px;font-weight:700;}
  .row-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:38px;height:38px;border-radius:9px;background:var(--surface-soft);color:var(--primary-deep);font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;}
  .icon-btn:hover{background:#efd9d3;}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn.danger{background:var(--danger-bg);color:var(--danger-ink);}
  .icon-btn.danger:hover{filter:brightness(0.94);}
  .status-badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);color:#fff;flex-shrink:0;display:inline-flex;align-items:center;gap:4px;}
  .status-badge svg{flex-shrink:0;}
  .status-badge.status-out{background:#6b5a63;}
  .status-badge.status-critical{background:#BC355C;color:#fff;}
  .status-badge.status-low{background:var(--amber);color:#2B1620;}
  .status-badge.status-ok{background:var(--green);color:#2B1620;}
  .rank-num{width:22px;height:22px;border-radius:50%;background:var(--surface-soft);color:var(--primary-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .btn-add-new{background:var(--primary);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(153,52,119,0.55);transition:transform .12s ease,opacity .12s ease;}
  .btn-add-new:active{transform:scale(0.97);}
  .btn-add-new:disabled{opacity:.45;box-shadow:none;}
  .btn-outline{background:var(--surface);border:1.5px solid var(--primary);color:var(--primary);padding:10px 17px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;transition:background .15s ease,opacity .15s ease;}
  .btn-outline:hover{background:var(--surface-soft);}
  .btn-outline:disabled{opacity:.45;}
  .btn-success{background:var(--green);color:#2B1620;padding:12px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(122,183,26,0.45);transition:transform .12s ease,opacity .12s ease;}
  .btn-success:active{transform:scale(0.98);}
  .btn-success:disabled{opacity:.45;box-shadow:none;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input,.form-field textarea,.form-field select{width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--ink);transition:border-color .15s ease;}
  .form-field input[type="color"]{width:100%;height:44px;padding:4px;cursor:pointer;}
  .form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--primary);outline:none;}
  .form-field textarea{resize:vertical;min-height:60px;}
  .field-input{width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--ink);margin-bottom:8px;transition:border-color .15s ease;}
  .field-input:focus{border-color:var(--primary);outline:none;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .note-box{background:var(--surface-soft);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#5C1F49);color:#fff;padding:12px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(153,52,119,0.5);transition:transform .12s ease,opacity .12s ease;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:.45;box-shadow:none;}

  /* Sistema de botones por nivel: primario (arriba), secundario, terciario, destructivo */
  .btn-tertiary{background:transparent;color:var(--ink-soft);padding:9px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;border:1.5px dashed var(--border);display:inline-flex;align-items:center;gap:6px;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .btn-tertiary:disabled{opacity:.45;}
  .btn-ver-mas{display:block;width:100%;text-align:center;background:var(--surface-soft);color:var(--primary);padding:11px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;margin-top:8px;border:1.5px solid var(--border);}
  .btn-ver-mas:hover{background:var(--surface);border-color:var(--primary);}
  .btn-tertiary:hover{background:var(--surface-soft);border-color:var(--primary);color:var(--primary-deep);}
  .btn-tertiary svg{flex-shrink:0;}
  .btn-danger{background:var(--danger-bg);color:var(--danger-ink);padding:11px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;transition:filter .15s ease;}
  .btn-danger:hover{filter:brightness(0.94);}
  .btn-danger:disabled{opacity:.45;}
  .btn-danger-text{background:transparent;color:var(--danger-ink)!important;font-weight:700!important;padding:8px 6px;transition:opacity .15s ease;}
  .btn-danger-text:hover{opacity:.75;}
  .toolbar-tools-panel{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface-soft);border-radius:var(--radius-md);padding:12px;margin:-4px 0 12px;}
  .toolbar-tools-panel .btn-outline{background:var(--surface);}
  /* Encabezado de sección dentro de formularios largos (ej. modal de producto), para que se
     lean como bloques con propósito (Información principal / Precios / Inventario / etc.)
     en vez de una sola lista continua de campos. */
  .form-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--primary);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
  .form-section-label:first-of-type{margin-top:4px;padding-top:0;border-top:none;}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,22,32,0.55);backdrop-filter:blur(1px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.modal-overlay{align-items:center;}}
  .modal{background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:22px 20px;box-shadow:0 -20px 50px -20px rgba(43,22,32,0.35);}
  @media(min-width:600px){.modal{border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);}}
  .modal h3{font-size:17.5px;color:var(--primary-deep);margin-bottom:14px;font-weight:700;font-family:'League Spartan',sans-serif;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;}
  .btn-cancel{background:var(--surface-soft);color:var(--ink-soft);transition:background .15s ease;}
  .btn-cancel:hover{background:#efd9d3;}
  .btn-cancel:disabled{opacity:.45;}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
    background:radial-gradient(1200px 600px at 15% -10%, rgba(237,117,120,0.35), transparent 60%),
               radial-gradient(900px 500px at 110% 110%, rgba(32,183,202,0.22), transparent 55%),
               linear-gradient(160deg,#5C1F49,#3a1332 72%);}
  .login-card{background:var(--surface);border-radius:var(--radius-lg);padding:32px 26px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
  .login-card h2{color:var(--primary-deep);font-size:20px;margin-bottom:6px;font-weight:700;}
  .login-card p{color:var(--ink-soft);font-size:12.5px;margin-bottom:18px;line-height:1.5;}
  .login-card input{width:100%;font-size:16px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:10px;transition:border-color .15s ease;background:var(--bg);}
  .login-card input:focus{border-color:var(--primary);outline:none;}
  .login-error{color:var(--rose);font-size:12px;margin-bottom:8px;min-height:14px;font-weight:600;}
  .order-detail{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-top:8px;font-size:12.5px;border:1px solid var(--border);}
  .order-detail div{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
  .status-filter{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;}
  .status-filter::-webkit-scrollbar{display:none;}

  /* ===== TABLA DE PEDIDOS ===== */
  .orders-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
  .orders-table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px;}
  .orders-table th{text-align:left;padding:12px 14px;background:var(--bg);color:var(--ink-soft);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;border-bottom:1px solid var(--border);}

/* ============== LOAD + MIGRATION ============== */
async function loadData(){
  try{
    let prodSnap = await db.collection('products').get();
    if(prodSnap.empty){
      const oldDoc = await db.collection('catalog').doc('products').get();
      const batch = db.batch();
      const seed = (oldDoc.exists && (oldDoc.data().items||[]).length) ? oldDoc.data().items : DEFAULT_PRODUCTS;
      seed.forEach(it=>{
        const ref = db.collection('products').doc();
        batch.set(ref, {name:it.name, cat:it.cat, price:it.price, stock:it.stock, desc:it.desc||'', images: it.images||[]});
      });
      await batch.commit();
      prodSnap = await db.collection('products').get();
    }
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()}));

    const [setSnap, ordersSnap, salesSnap, visitsSnap, cashiersSnap, aiSnap, centersSnap, transfersSnap, auditsSnap, customersSnap, couponUsageSnap, cashRegistersSnap, analyticsEventsSnap, abandonedCartsSnap, storeMessagesSnap] = await Promise.all([
      db.collection('settings').doc('store').get(),
      db.collection('orders').orderBy('date','desc').get(),
      db.collection('sales').orderBy('date','desc').get(),
      db.collection('visits').orderBy('date','desc').limit(3000).get(),
      db.collection('cashiers').get(),
      db.collection('settings').doc('ai').get(),
      db.collection('distributionCenters').get(),
      db.collection('transfers').orderBy('date','desc').limit(200).get(),
      db.collection('audits').orderBy('date','desc').limit(100).get(),
      db.collection('customers').get(),
      db.collection('couponUsage').get(),
      db.collection('cashRegisters').orderBy('openedAt','desc').limit(300).get(),
      // Eventos de embudo (vistas de producto, agregar al carrito, inicio de checkout, compra) de la
      // tienda pública. Colección aparte de "visits" para no reducir la ventana que cubre su límite de 3000.
      db.collection('analyticsEvents').orderBy('date','desc').limit(5000).get(),
      // Carritos que un cliente empezó a llenar en el checkout de la tienda (nombre + teléfono
      // capturados) pero no completó. La tienda (index.html) guarda/borra su propio borrador;
      // aquí solo se leen para el botón "Carritos abandonados" de Pedidos.
      db.collection('abandonedCarts').orderBy('updatedAt','desc').limit(300).get(),
      // Buzón de mensajes: quejas, sugerencias y preguntas que un cliente deja desde la tienda
      // (index.html) sin necesidad de escribir por WhatsApp. Se leen aquí para la pestaña "Mensajes".
      db.collection('storeMessages').orderBy('date','desc').limit(500).get(),
    ]);
    let needsSeedSettings = !setSnap.exists;
    state.settings = needsSeedSettings ? {...DEFAULT_SETTINGS} : {...DEFAULT_SETTINGS, ...setSnap.data()};
    if(!state.settings.categories || !state.settings.categories.length) state.settings.categories = [...DEFAULT_CATEGORIES];
    if(!state.settings.hiddenCategories) state.settings.hiddenCategories = [];
    if(!state.settings.needs || !state.settings.needs.length) state.settings.needs = JSON.parse(JSON.stringify(DEFAULT_NEEDS));
    if(!state.settings.sections || !state.settings.sections.length) state.settings.sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
    if(!state.settings.promoBanner) state.settings.promoBanner = {title:"",text:"",image:"",buttonText:"",buttonLink:""};
    if(!state.settings.featuredProductIds) state.settings.featuredProductIds = [];
    if(!state.settings.testimonials) state.settings.testimonials = [];
    if(!state.settings.wholesaleTiers) state.settings.wholesaleTiers = [];
    if(!state.settings.coupons) state.settings.coupons = [];
    if(!state.settings.promotions) state.settings.promotions = [];
    // unen en una sola lista, ordenada por fecha, para verlos juntos en "Pedidos".
    const tiendaOrders = ordersSnap.docs.map(d=>({id:d.id, source:'tienda', archived:false, ...d.data()}));
    const posOrders = salesSnap.docs.map(d=>{
      const data = d.data();
      return { id:d.id, source:'pos', archived:false, status:'Entregado', customer: data.customerName || 'Venta en tienda física', ...data };
    });
    state.orders = [...tiendaOrders, ...posOrders].sort((a,b)=> new Date(b.date) - new Date(a.date));
    state.visits = visitsSnap.docs.map(d=>d.data());
    state.analyticsEvents = analyticsEventsSnap.docs.map(d=>d.data());
    state.abandonedCarts = abandonedCartsSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.storeMessages = storeMessagesSnap.docs.map(d=>({id:d.id, status:'nuevo', ...d.data()}));
    state.cashiers = cashiersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.aiSettings = aiSnap.exists ? {...DEFAULT_AI_SETTINGS, ...aiSnap.data()} : {...DEFAULT_AI_SETTINGS};
    if(needsSeedSettings) await saveSettings();

    // Centros de distribución: si no existe ninguno, se crea "Principal" automáticamente.
    state.centers = centersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.centers.length===0){
      const ref = await db.collection('distributionCenters').add({name:'Principal', isDefault:true, active:true, createdAt:new Date().toISOString()});
      state.centers = [{id:ref.id, name:'Principal', isDefault:true, active:true}];
    }
    state.transfers = transfersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.audits = auditsSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.customers = customersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.couponUsage = couponUsageSnap.docs.map(d=>d.data());
    state.cashRegisters = cashRegistersSnap.docs.map(d=>({id:d.id, ...d.data()}));

    // Migración automática: cualquier producto que todavía no tenga inventario
    // repartido por centro, se le asigna TODO su stock actual al centro Principal.
    const principal = state.centers.find(c=>c.isDefault) || state.centers[0];
    const migrationBatch = db.batch();
    let needsMigration = false;
    state.products.forEach(p=>{
      if(!p.stockByCenter){
        p.stockByCenter = { [principal.id]: p.stock||0 };
        migrationBatch.update(db.collection('products').doc(p.id), {stockByCenter: p.stockByCenter});
        needsMigration = true;
      }
    });
    if(needsMigration){ try{ await migrationBatch.commit(); }catch(e){ console.error('No se pudo migrar el inventario a centros', e); } }
  }catch(e){
    console.error(e);
    state.products = []; state.orders = []; state.visits = []; state.analyticsEvents = []; state.cashiers = []; state.abandonedCarts = []; state.storeMessages = []; state.settings = {...DEFAULT_SETTINGS};
    state.centers = []; state.transfers = []; state.audits = []; state.customers = []; state.couponUsage = [];
    state.cashRegisters = [];
    showToast('No se pudo cargar todo desde el servidor');
  }
  computeMyPermissions();
  if(state.myPermissions && !canAccessTab(state.adminTab)) state.adminTab = firstAccessibleTab() || state.adminTab;
  if(!state.lastOrderCheck) state.lastOrderCheck = new Date().toISOString();
  if(!state.lastMessageCheck) state.lastMessageCheck = new Date().toISOString();
  state.loaded = true; render();
}
// Aviso de pedido/mensaje nuevo mientras el admin está abierto: revisa cada 45s si llegó algo
// nuevo a "orders", "sales" o "storeMessages" desde la última revisión, sin que Ale tenga que
// estar entrando a Pedidos o Mensajes a cada rato para enterarse. Se detiene si la pestaña no
// está visible (minimizada/en segundo plano) para no gastar lecturas de más.
let newOrderWatcherTimer = null;
function ensureNewOrderWatcher(active){
  if(active && !newOrderWatcherTimer){
    newOrderWatcherTimer = setInterval(checkForNewOrders, 45000);
  } else if(!active && newOrderWatcherTimer){
    clearInterval(newOrderWatcherTimer); newOrderWatcherTimer = null;
  }
}
async function checkForNewOrders(){
  if(document.hidden || !state.user || !state.loaded) return;
  const sinceOrders = state.lastOrderCheck || new Date().toISOString();
  const sinceMessages = state.lastMessageCheck || new Date().toISOString();
  try{
    const [ordersSnap, salesSnap, messagesSnap] = await Promise.all([
      db.collection('orders').where('date','>',sinceOrders).get(),
      db.collection('sales').where('date','>',sinceOrders).get(),
      db.collection('storeMessages').where('date','>',sinceMessages).get(),
    ]);
    const newCount = ordersSnap.size + salesSnap.size;
    const newMsgCount = messagesSnap.size;
    state.lastOrderCheck = new Date().toISOString();
    state.lastMessageCheck = new Date().toISOString();
    if(newCount>0 || newMsgCount>0){
      if(newCount>0) state.newOrderCount = (state.newOrderCount||0) + newCount;
      if(newMsgCount>0) state.newMessageCount = (state.newMessageCount||0) + newMsgCount;
      playNewOrderChime();
      const parts = [];
      if(newCount>0) parts.push(`${newCount} pedido${newCount>1?'s':''} nuevo${newCount>1?'s':''}`);
      if(newMsgCount>0) parts.push(`${newMsgCount} mensaje${newMsgCount>1?'s':''} nuevo${newMsgCount>1?'s':''}`);
      showToast(parts.join(' · '));
      await loadData();
    }
  }catch(e){ console.error('No se pudo revisar pedidos/mensajes nuevos', e); }
}
// Aviso sonoro corto, generado sin archivo de audio (Web Audio API) — dos tonos breves.
function playNewOrderChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [880,1160].forEach((freq,i)=>{
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      osc.connect(gain); gain.connect(ctx.destination);
      const start = ctx.currentTime + i*0.14;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.22);
      osc.start(start); osc.stop(start+0.24);
    });
  }catch(e){}
}

/* ============== PERMISOS DE COLABORADOR ==============
   El rol "colaborador" da acceso a admin.html con su propia cuenta de Firebase (creada
   aparte, en la consola de Firebase — ver nota en el modal), pero solo a las secciones
   que aquí se le marquen. La lista de abajo controla tanto lo que VE en el panel (aquí)
   como lo que puede REALMENTE leer/escribir en Firestore: cada vez que se guarda un
   colaborador se refleja en la colección "staffPermissions", indexada por su correo en
   minúsculas, que es la que consultan las reglas de seguridad (firestore.rules). Nunca se
   borra ese documento al desactivar o quitarle acceso a alguien — se deja con todos los
   permisos en falso, para que la restricción siga aplicando aunque la cuenta de Firebase
   de esa persona siga existiendo.
   "Usuarios" (este mismo panel) nunca aparece en la lista: si un colaborador pudiera
   editar permisos, podría dárselos a sí mismo. Administrar usuarios queda reservado a
   cuentas sin restricciones (las que no tienen un documento de colaborador con ese correo). */
const PERMISSION_DEFS = [
  {key:'resumen', label:'Resumen (ventas totales, ingresos)'},
  {key:'pedidos', label:'Pedidos (ver y gestionar pedidos y ventas)'},
  {key:'productos', label:'Productos (editar catálogo e inventario)'},
  {key:'clientes', label:'Clientes'},
  {key:'caja', label:'Caja (apertura/cierre del Punto de Venta)'},

const TAB_PERMISSION = {
  resumen:'resumen', pedidos:'pedidos', caja:'caja', productos:'productos', centros:'centros',
  marketing:'config', diseño:'config',

// Sincroniza (o revoca) el espejo en "staffPermissions" que usan las reglas de seguridad.
// email/oldEmail siempre en minúsculas; revoke=true escribe todos los permisos en falso
// en vez de borrar el documento (ver nota arriba de por qué no se borra).
async function syncStaffPermissions(email, permissions, oldEmail){
  const clean = (email||'').trim().toLowerCase();
  const oldClean = (oldEmail||'').trim().toLowerCase();
  try{
    if(oldClean && oldClean!==clean){
      await db.collection('staffPermissions').doc(oldClean).set({permissions:{}});
    }
    if(clean){
      await db.collection('staffPermissions').doc(clean).set({permissions: permissions||{}});
    }
  }catch(e){ console.error('No se pudo sincronizar los permisos', e); }
}
function computeMyPermissions(){
  const myEmail = (state.user && state.user.email || '').trim().toLowerCase();
  const mine = state.cashiers.find(c=>c.role==='colaborador' && (c.email||'').trim().toLowerCase()===myEmail && myEmail);
  state.myPermissions = (mine && mine.active) ? (mine.permissions||{}) : null;
}
function canAccessTab(t){
  if(!state.myPermissions) return true;
  const perm = TAB_PERMISSION[t];
  if(!perm) return false;
  return !!state.myPermissions[perm];
}
function firstAccessibleTab(){
  for(const g of ADMIN_NAV_GROUPS){ for(const t of g.tabs){ if(canAccessTab(t)) return t; } }
  return null;
}

const PAY_METHODS = ["Efectivo","Tarjeta","Transferencia"];
// Desglose de pago de una venta: usa "payments" (ventas divididas, o registradas después de
// este cambio) y cae de vuelta a "paymentMethod" para ventas guardadas antes de este cambio.
function salePayments(s){
  if(s.payments && s.payments.length) return s.payments;
  return [{method: s.paymentMethod || 'Efectivo', amount: s.total||0}];
}
function paymentMethodLabel(o){
  const pays = salePayments(o);
  if(pays.length>1) return 'Dividido: ' + pays.map(p=>`${p.method} ${money(p.amount)}`).join(' · ');
  return pays[0].method;
}
// Versión corta para espacios angostos (la pastilla de la tabla de pedidos): solo dice
// "Dividido" en vez del desglose completo, que se sigue mostrando en el detalle del pedido.
function paymentMethodShortLabel(o){
  const pays = salePayments(o);
  return pays.length>1 ? 'Dividido' : pays[0].method;
}
function formatFolio(n){ return n ? '#' + String(n).padStart(4,'0') : 'Sin folio'; }
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}
async function assignFolioToOrder(id, source){
  const orderNumber = await getNextOrderNumber();
  if(!orderNumber){ showToast('No se pudo generar el folio, intenta de nuevo'); return; }
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update({orderNumber});
    const o = state.orders.find(x=>x.id===id); if(o) o.orderNumber = orderNumber;
    showToast(`Folio ${formatFolio(orderNumber)} asignado`); render();
  }catch(e){ console.error(e); showToast('No se pudo asignar el folio'); }
}
async function deleteOrder(id, source){
  const o = state.orders.find(x=>x.id===id);
  const label = o ? `${formatFolio(o.orderNumber)} — ${o.customer||'este pedido'}` : 'este pedido';

/* ============== FICHA COMPLETA DEL PEDIDO + ENVÍO AL REPARTIDOR ============== */
function openOrderDetailModal(id){
  state.orderDetailModal = id; state.orderDiscountEditing=false;
  // Al abrir un pedido nuevo de la tienda para prepararlo, se avanza solo a "Preparando"
  // — ahorra el paso extra de acordarse de cambiarle el estado a mano. Las ventas de
  // Punto de Venta ya nacen "Entregado" y no pasan por aquí.
  const o = state.orders.find(x=>x.id===id);
  if(o && o.source!=='pos' && o.status==='Nuevo') updateOrderStatus(id,'Preparando');
  render();
}
function closeOrderDetailModal(){ state.orderDetailModal = null; state.orderDiscountEditing=false; render(); }
function prodCats(p){ return (p.categories && p.categories.length) ? p.categories : (p.cat ? [p.cat] : []); }
function isCouponEligibleItem(prodCategories, prodId, coupon){
  if(coupon.scope==='all') return true;
  if(coupon.scope==='categories') return (prodCategories||[]).some(c=>(coupon.categories||[]).includes(c));
  if(coupon.scope==='products') return (coupon.productIds||[]).includes(prodId);
  return false;
}
function orderCouponEligibleItems(o, coupon){
  return (o.items||[]).map(it=>({it, p: state.products.find(x=>x.id===it.id)})).filter(({p})=>p && isCouponEligibleItem(prodCats(p), p.id, coupon));
}
function orderCouponDiscountAmount(o, coupon){
  return orderCouponEligibleItems(o, coupon).reduce((s,{it})=>s + Math.round(it.price*it.qty*(coupon.discountPercent/100)), 0);
}
function startEditOrderDiscount(id){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  state.orderDiscountEditing = true;
  state.orderDiscountType = o.manualDiscount ? (o.manualDiscount.type||'fixed') : 'fixed';
  state.orderDiscountValueInput = o.manualDiscount && o.manualDiscount.type!=='coupon' ? String(o.manualDiscount.value!=null?o.manualDiscount.value:o.manualDiscount.amount) : '';
  state.orderDiscountCouponInput = o.manualDiscount && o.manualDiscount.type==='coupon' ? (o.manualDiscount.code||'') : '';
  state.orderDiscountReasonInput = o.manualDiscount ? (o.manualDiscount.reason||'') : '';
  render();
}
async function saveOrderDiscount(id, source){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const value = Number(state.orderDiscountValueInput);
  const reason = state.orderDiscountReasonInput.trim();
  if(!state.orderDiscountValueInput.trim() || isNaN(value) || value<=0){ showToast('Ingresa un monto válido'); return; }
  if(state.orderDiscountType==='percent' && value>100){ showToast('El porcentaje no puede ser mayor a 100'); return; }
  if(!reason){ showToast('Escribe un motivo para el ajuste'); return; }
  const subtotal = (o.subtotal!=null) ? o.subtotal : o.total;
  const amount = state.orderDiscountType==='percent' ? Math.round(subtotal*(value/100)) : Math.min(value, subtotal);
  const newTotal = Math.max(0, subtotal - amount);
  const payload = { subtotal, manualDiscount:{type: state.orderDiscountType, value, amount, reason}, total:newTotal };
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update(payload);
    Object.assign(o, payload);
    state.orderDiscountEditing = false;
    showToast('Ajuste guardado'); render();
  }catch(e){ console.error(e); showToast('No se pudo guardar el ajuste'); }
}
async function applyOrderCoupon(id, source){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const code = state.orderDiscountCouponInput.trim().toUpperCase();
  if(!code){ showToast('Ingresa un código de cupón'); return; }
  const coupon = (state.settings.coupons||[]).find(c=>c.code===code);
  if(!coupon || !coupon.active){ showToast('Código no válido'); return; }
  const now = new Date();
  if(coupon.startDate && now < new Date(coupon.startDate)){ showToast('Este cupón todavía no está vigente'); return; }
  if(coupon.endDate && now > new Date(coupon.endDate+'T23:59:59')){ showToast('Este cupón ya venció'); return; }
  const eligible = orderCouponEligibleItems(o, coupon);
  if(eligible.length===0){ showToast('Este cupón no aplica a los productos de este pedido'); return; }
  if(coupon.maxUses>0){
    try{
      const used = await db.collection('couponUsage').where('code','==',code).get();
      if(used.size >= coupon.maxUses){ showToast('Este cupón ya alcanzó su límite de usos'); return; }
    }catch(e){ console.error(e); }
  }
  const subtotal = (o.subtotal!=null) ? o.subtotal : o.total;
  const amount = orderCouponDiscountAmount(o, coupon);
  const newTotal = Math.max(0, subtotal - amount);
  const reason = state.orderDiscountReasonInput.trim() || `Cupón ${code}`;
  const payload = { subtotal, manualDiscount:{type:'coupon', code, amount, reason}, total:newTotal, couponCode: code };
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update(payload);
    Object.assign(o, payload);
    try{
      await db.collection('couponUsage').add({code, date:new Date().toISOString()});
      state.couponUsage.push({code, date:new Date().toISOString()});
    }catch(e){ console.error('No se pudo registrar el uso del cupón', e); }
    state.orderDiscountEditing = false;
    showToast('Cupón aplicado'); render();
  }catch(e){ console.error(e); showToast('No se pudo aplicar el cupón'); }
}
async function removeOrderDiscount(id, source){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const restoredTotal = o.subtotal!=null ? o.subtotal : o.total;
  const payload = { manualDiscount: firebase.firestore.FieldValue.delete(), total: restoredTotal };
  if(o.couponCode) payload.couponCode = firebase.firestore.FieldValue.delete();
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update(payload);
    delete o.manualDiscount; o.total = restoredTotal; delete o.couponCode;
    showToast('Ajuste eliminado'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar el ajuste'); }
}
function waLink(phone, text){
  const num = (phone||'').replace(/\D/g,'');
  return `https://wa.me/${num}?text=${encodeURIComponent(text)}`;
}
// Teléfono de contacto del pedido sin importar si viene de la tienda online (o.phone) o de
// una venta de Punto de Venta (o.customerPhone) — para que "Escribir al cliente" y "Enviar al
// repartidor" funcionen igual sin importar dónde se hizo la venta.
function orderContactPhone(o){ return o.phone || o.customerPhone || ''; }
// Dirección de contacto del pedido: la de la tienda online (o.address) o, si la venta se hizo
// en el Punto de Venta con un cliente asignado, la que tiene guardada ese cliente (o.customerAddress).
function orderContactAddress(o){ return o.address || o.customerAddress || ''; }
function buildDeliveryMessage(o){
  const origen = state.settings.storeAddress || '(configura tu dirección de origen en Configuración)';
  const direccion = orderContactAddress(o) || (o.source==='pos' ? 'Retirado en Punto de Venta' : '(sin dirección)');
  const destino = [direccion, o.notes].filter(Boolean).join(' — ');
  const telefono = orderContactPhone(o);
  return `*PEDIDO ${o.orderNumber || ''}*\n\n` +
         `*De* ${origen}\n\n` +
         `*A* ${destino}\n${telefono}\n\n` +
         `*Producto* $${Math.round(o.total||0)}\n\n` +
         `*Cobrar al cliente* $`;
}
function buildCustomerMessage(o){
  const folio = formatFolio(o.orderNumber);
  const nombre = o.customer || o.customerName || '';
  return `Hola ${nombre}, te escribimos de ${state.settings.storeName||'la tienda'} sobre tu pedido ${folio}. `;
}
function sendToDelivery(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  if(!state.settings.deliveryWhatsapp){ showToast('Configura el WhatsApp del repartidor en la pestaña Configuración'); return; }
  window.open(waLink(state.settings.deliveryWhatsapp, buildDeliveryMessage(o)), '_blank');
}

/* ============== CARRITOS ABANDONADOS ==============
   La tienda (index.html) guarda un borrador en "abandonedCarts" (un documento por teléfono)
   cuando el cliente ya escribió su nombre y teléfono en el checkout y tiene productos en el
   carrito, y lo borra en cuanto el pedido se completa. Aquí solo se listan los que quedaron sin
   completar, para poder escribirles por WhatsApp con un clic. Se ocultan los de menos de 15
   minutos de antigüedad para no molestar a alguien que sigue comprando en ese momento. */
const ABANDONED_CART_MIN_AGE_MS = 15*60*1000;
function pendingAbandonedCarts(){
  const cutoff = Date.now() - ABANDONED_CART_MIN_AGE_MS;
  return (state.abandonedCarts||[])
    .filter(c=>!c.completed && new Date(c.updatedAt).getTime() <= cutoff)
    .sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt));
}
// Carritos que sí se guardaron pero que el panel todavía no muestra por ser demasiado recientes
// (ver nota arriba) — sirve para avisar que "no hay nada que mostrar TODAVÍA" es distinto de
// "no se guardó nada", que es la confusión más común al probar esta función.
function recentHiddenAbandonedCarts(){
  const cutoff = Date.now() - ABANDONED_CART_MIN_AGE_MS;
  return (state.abandonedCarts||[]).filter(c=>!c.completed && new Date(c.updatedAt).getTime() > cutoff);
}
function timeAgo(iso){
  const ms = Date.now() - new Date(iso).getTime();
  const min = Math.floor(ms/60000);
  if(min<60) return `hace ${min} min`;
  const hr = Math.floor(min/60);
  if(hr<24) return `hace ${hr} h`;
  const d = Math.floor(hr/24);
  return `hace ${d} día${d===1?'':'s'}`;
}
function buildAbandonedCartMessage(c){
  const lines = (c.items||[]).map(it=>`• ${it.qty}x ${it.name}`).join('\n');
  // Urgencia suave: menciona que el stock es limitado (cierto en general, sin inventar una
  // cifra o fecha límite falsa) en vez de presionar con un conteo regresivo ficticio.
  return `Hola ${c.name}! 👋 Notamos que dejaste estos productos en tu carrito en ${state.settings.storeName||'nuestra tienda'}:\n${lines}\n\nTotal: ${money(c.total||0)}\n\n¿Seguimos con tu pedido? Como manejamos inventario limitado, con gusto te apartamos lo que llevabas antes de que se agote. Recuerda que es pago contra entrega y llega en empaque discreto, sin ningún logo visible 💕`;
}
function recoverAbandonedCart(id){
  const c = (state.abandonedCarts||[]).find(x=>x.id===id);
  if(!c) return;
  window.open(waLink(c.phone, buildAbandonedCartMessage(c)), '_blank');
}
async function dismissAbandonedCart(id){
  try{ await db.collection('abandonedCarts').doc(id).delete(); }catch(e){ console.error(e); }
  state.abandonedCarts = (state.abandonedCarts||[]).filter(x=>x.id!==id);
  render();
}
function renderAbandonedCartsModal(){
  const list = pendingAbandonedCarts();
  const recentHidden = recentHiddenAbandonedCarts();
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:640px;">
      <h3>Carritos abandonados</h3>
      <div class="note-box">Clientes que empezaron su pedido en la tienda (ya escribieron nombre y teléfono) pero no lo completaron. "Recuperar por WhatsApp" abre un mensaje ya redactado para invitarlos a terminar su compra. Por diseño, uno recién dejado tarda hasta 15 minutos en aparecer aquí — para no interrumpir a alguien que sigue comprando en ese momento.</div>
      ${recentHidden.length>0 ? `<div class="note-box" style="background:#FFF6E0;color:#8a6300;">${recentHidden.length===1?'Hay 1 carrito muy reciente':`Hay ${recentHidden.length} carritos muy recientes`} (de los últimos 15 minutos) que todavía no se muestra${recentHidden.length===1?'':'n'} abajo por eso mismo — no es que no se haya guardado, solo está esperando su turno.</div>` : ''}
      ${list.length===0 ? `<div class="empty-state">No hay carritos abandonados pendientes por ahora.</div>` : `
      <div style="max-height:420px;overflow-y:auto;">
        ${list.map(c=>`
          <div style="padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;gap:8px;">
              <div style="font-weight:700;">${c.name||'(sin nombre)'}</div>
              <div class="row-sub">${timeAgo(c.updatedAt)}</div>
            </div>
            <div class="row-sub" style="margin:2px 0 6px;">${c.phone||''} · ${money(c.total||0)}</div>
            <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;">${(c.items||[]).map(it=>`${it.qty}x ${it.name}`).join(', ')}</div>
            <div style="display:flex;gap:8px;">

      </div>`}
      <div class="modal-actions">
        <button class="btn-cancel" style="flex:1;" onclick="state.abandonedCartsOpen=false;render()">Cerrar</button>

/* ============== BÚSQUEDA GLOBAL ==============
   Un solo buscador (botón "Buscar" en la barra superior) que busca a la vez en productos,
   pedidos/ventas y clientes, y al hacer clic en un resultado te lleva directo a la pestaña
   y abre el detalle correspondiente. Cada grupo de resultados solo se muestra si la cuenta
   tiene permiso para esa sección (igual criterio que canAccessTab/TAB_PERMISSION). */
function openGlobalSearch(){ state.globalSearchOpen=true; render(); }
function closeGlobalSearch(){ state.globalSearchOpen=false; state.globalSearchQuery=""; render(); }
function computeGlobalSearchResults(){
  const q = (state.globalSearchQuery||'').trim().toLowerCase();
  const empty = {products:[], orders:[], customers:[], q};
  if(!q) return empty;
  const LIMIT = 8;
  const result = {q, products:[], orders:[], customers:[]};
  if(canAccessTab('productos')){
    result.products = state.products
      .filter(p=>(p.name||'').toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.cat||'').toLowerCase().includes(q))
      .slice(0, LIMIT);
  }
  if(canAccessTab('pedidos')){
    result.orders = state.orders
      .filter(o=> formatFolio(o.orderNumber).toLowerCase().includes(q) || (o.customer||'').toLowerCase().includes(q) || (o.customerName||'').toLowerCase().includes(q) || (o.phone||'').includes(q) || (o.customerPhone||'').includes(q))
      .sort((a,b)=> new Date(b.date) - new Date(a.date))
      .slice(0, LIMIT);
  }
  if(canAccessTab('clientes')){
    result.customers = computeCustomersList()
      .filter(c=>(c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.email||'').toLowerCase().includes(q))
      .slice(0, LIMIT);
  }
  return result;
}
function goToGlobalSearchProduct(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  closeGlobalSearch();
  state.adminTab='productos'; state.productModal=JSON.parse(JSON.stringify(p));
  render();
}
function goToGlobalSearchOrder(id){
  closeGlobalSearch();
  state.adminTab='pedidos';
  openOrderDetailModal(id);
}
function goToGlobalSearchCustomer(phoneOrName){
  closeGlobalSearch();
  state.adminTab='clientes'; state.customerSearch=phoneOrName||'';

}

/* ============== AUTH ============== */
/* ---- Verificación en dos pasos (TOTP tipo Google Authenticator), implementación propia ----
   No requiere subir de nivel el proyecto de Firebase ni cambiar el SDK. Cada persona con acceso
   al panel activa esto para SU PROPIA cuenta (Configuración → Verificación en dos pasos); el
   secreto se guarda en la colección "security_totp", con el correo en minúsculas como ID.
   IMPORTANTE — límite real de esta implementación: como esta tienda no tiene servidor propio,
   Firebase ya deja completamente autenticada a la cuenta en cuanto la contraseña es correcta.
   Esta pantalla de código es una barrera adicional en el navegador, no algo que Firebase mismo
   exija — alguien con la contraseña Y conocimientos técnicos (herramientas de desarrollador)
   podría saltársela. Sí sirve para frenar a alguien que solo consiguió la contraseña sin más. */
const TOTP_DIGITS = 6, TOTP_STEP_SECONDS = 30;
function base32Encode(bytes){
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits = '', output = '';
  for(const b of bytes) bits += b.toString(2).padStart(8,'0');
  for(let i=0;i+5<=bits.length;i+=5) output += alphabet[parseInt(bits.substr(i,5),2)];
  const rem = bits.length % 5;
  if(rem) output += alphabet[parseInt(bits.substr(bits.length-rem).padEnd(5,'0'),2)];
  return output;
}
function base32Decode(str){
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  str = (str||'').toUpperCase().replace(/[^A-Z2-7]/g,'');
  let bits = '';
  for(const ch of str){ const idx = alphabet.indexOf(ch); if(idx>=0) bits += idx.toString(2).padStart(5,'0'); }
  const bytes = [];
  for(let i=0;i+8<=bits.length;i+=8) bytes.push(parseInt(bits.substr(i,8),2));
  return new Uint8Array(bytes);
}
function generateTotpSecret(){
  const bytes = new Uint8Array(20);
  crypto.getRandomValues(bytes);
  return base32Encode(bytes);
}
async function hotp(secretBytes, counter){
  const counterBytes = new ArrayBuffer(8);
  const view = new DataView(counterBytes);
  view.setUint32(4, counter, false); // el contador cabe en 32 bits por muchísimos años (30s de paso)
  const key = await crypto.subtle.importKey('raw', secretBytes, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, counterBytes));
  const offset = sig[sig.length-1] & 0xf;
  const binCode = ((sig[offset]&0x7f)<<24) | ((sig[offset+1]&0xff)<<16) | ((sig[offset+2]&0xff)<<8) | (sig[offset+3]&0xff);
  return (binCode % (10**TOTP_DIGITS)).toString().padStart(TOTP_DIGITS,'0');
}
async function totpCodeAt(secretBase32, stepOffset){
  const counter = Math.floor(Date.now()/1000/TOTP_STEP_SECONDS) + (stepOffset||0);
  return hotp(base32Decode(secretBase32), counter);
}
// Tolera hasta 1 paso (30s) de diferencia de reloj entre el celular y la computadora.
async function verifyTotpCode(secretBase32, userCode){
  const clean = (userCode||'').replace(/\D/g,'');
  if(clean.length!==TOTP_DIGITS) return false;
  for(const offset of [0,-1,1]){ if((await totpCodeAt(secretBase32, offset))===clean) return true; }
  return false;
}
function totpDocId(email){ return (email||'').trim().toLowerCase(); }
/* ============== VISIBILIDAD DE SESIONES ABIERTAS ==============
   Registra, para la cuenta que inició sesión, en qué navegadores/dispositivos se ha usado el
   panel (ej. "Safari en iPhone"), para que puedas notar algo raro. LÍMITE REAL: esto es solo
   VISIBILIDAD, no control remoto — como esta tienda no tiene servidor propio, no existe forma
   de "cerrar sesión a la fuerza" en otro dispositivo desde aquí; solo se puede quitar el
   registro de la lista (deja de aparecer, pero si esa sesión sigue con la contraseña guardada
   ahí, seguiría funcionando hasta que alguien cierre sesión manualmente en ese dispositivo).
*/
function getDeviceId(){
  try{
    let id = localStorage.getItem('admin_device_id');
    if(!id){ id = 'dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10); localStorage.setItem('admin_device_id', id); }
    return id;
  }catch(e){ return 'dev_unknown'; }
}
function describeDevice(ua){
  ua = ua||'';
  let os = 'Dispositivo desconocido';
  if(/iPhone/.test(ua)) os = 'iPhone';
  else if(/iPad/.test(ua)) os = 'iPad';
  else if(/Android/.test(ua)) os = /Mobile/.test(ua) ? 'Celular Android' : 'Tablet Android';
  else if(/Macintosh|Mac OS X/.test(ua)) os = 'Mac';
  else if(/Windows/.test(ua)) os = 'Windows';
  else if(/Linux/.test(ua)) os = 'Linux';
  let browser = 'Navegador desconocido';
  if(/Edg\//.test(ua)) browser = 'Edge';
  else if(/OPR\//.test(ua)) browser = 'Opera';
  else if(/Chrome\//.test(ua) && !/Chromium/.test(ua)) browser = 'Chrome';
  else if(/CriOS/.test(ua)) browser = 'Chrome';
  else if(/FxiOS/.test(ua)) browser = 'Firefox';
  else if(/Firefox\//.test(ua)) browser = 'Firefox';
  else if(/Safari\//.test(ua) && !/Chrome\//.test(ua)) browser = 'Safari';
  return `${browser} en ${os}`;
}
async function recordAdminSession(email){
  try{
    const deviceId = getDeviceId();
    const docId = totpDocId(email)+'__'+deviceId;
    const existing = await db.collection('admin_sessions').doc(docId).get();
    await db.collection('admin_sessions').doc(docId).set({
      email: totpDocId(email), deviceId, userAgent: navigator.userAgent, label: describeDevice(navigator.userAgent),
      firstSeen: existing.exists ? existing.data().firstSeen : new Date().toISOString(),
      lastActive: new Date().toISOString(),
    });
  }catch(e){ console.error('No se pudo registrar la sesión', e); }
}
function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins<1) return 'justo ahora';
  if(mins<60) return `hace ${mins} min`;
  const hrs = Math.floor(mins/60);
  if(hrs<24) return `hace ${hrs} h`;
  const days = Math.floor(hrs/24);
  if(days<30) return `hace ${days} día${days===1?'':'s'}`;
  return new Date(iso).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
}
async function loadAdminSessions(){
  try{
    const snap = await db.collection('admin_sessions').where('email','==',totpDocId(state.user.email)).get();
    state.adminSessions = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> new Date(b.lastActive)-new Date(a.lastActive));
  }catch(e){ console.error('No se pudieron cargar las sesiones', e); state.adminSessions = null; }
  render();
}
async function forgetAdminSession(docId){
  try{

// "Recordar este dispositivo 30 días": guardado solo en este navegador (localStorage), no en
// Firestore — cada dispositivo/navegador donde se inicia sesión pide el código de nuevo la
// primera vez, y luego no lo vuelve a pedir hasta que pasen 30 días desde esa vez.
const TOTP_TRUST_DAYS = 30;
function totpTrustKey(email){ return 'totp_trust_'+totpDocId(email); }
function isTotpTrusted(email){
  try{
    const until = Number(localStorage.getItem(totpTrustKey(email)));
    return !!until && Date.now() < until;
  }catch(e){ return false; }
}
function setTotpTrusted(email){
  try{ localStorage.setItem(totpTrustKey(email), String(Date.now() + TOTP_TRUST_DAYS*24*60*60*1000)); }catch(e){}
}
function openTotpSetup(){
  const secret = generateTotpSecret();
  state.totpSetup = { secret, confirmCode:'', error:'' };
  render();
}
function cancelTotpSetup(){ state.totpSetup = null; render(); }
async function confirmTotpSetup(){
  const s = state.totpSetup; if(!s) return;
  if(!(await verifyTotpCode(s.secret, s.confirmCode))){
    state.totpSetup.error = 'El código no es correcto o ya expiró — prueba con el que te muestre la app en este momento.';
    render(); return;
  }
  try{
    await db.collection('security_totp').doc(totpDocId(state.user.email)).set({ secret:s.secret, enabled:true, updatedAt:new Date().toISOString() });
    state.totpRequired = true; state.totpSetup = null;
    setTotpTrusted(state.user.email); // ya probaste tener la app en este momento: este navegador queda confiado 30 días
    showToast('Verificación en dos pasos activada'); render();
  }catch(e){ console.error(e); state.totpSetup.error = 'No se pudo guardar, intenta de nuevo.'; render(); }
}
async function disableTotpSetup(code){
  try{
    const email = totpDocId(state.user.email);
    const doc = await db.collection('security_totp').doc(email).get();
    if(!doc.exists || !doc.data().enabled){ state.totpRequired=false; render(); return; }
    if(!(await verifyTotpCode(doc.data().secret, code))){ showToast('Código incorrecto, no se desactivó'); return; }
    await db.collection('security_totp').doc(email).update({enabled:false});
    state.totpRequired = false; state.totpDisableCode='';
    showToast('Verificación en dos pasos desactivada'); render();
  }catch(e){ console.error(e); showToast('No se pudo desactivar, intenta de nuevo'); }
}

async function saveProduct(p){
  const newCats = (p.categories||[p.cat]).filter(c=>c && !state.settings.categories.includes(c));
  if(newCats.length){ state.settings.categories.push(...newCats); await saveSettings(); }
  const payload = {
    name:p.name, sku:p.sku||'', cat:p.cat, categories:p.categories||[p.cat],
    price:p.price, promoPrice:p.promoPrice||0, cost:p.cost||0,
    stock:p.stock, desc:p.desc, images:p.images||[], needs:p.needs||[],
    stockByCenter:p.stockByCenter||{}, hidden: !!p.hidden,
    variantGroups: p.variantGroups||[], variants: p.variants||[],
  };
  try{
    if(p.id){
      await db.collection('products').doc(p.id).set(payload);
      const idx = state.products.findIndex(x=>x.id===p.id); state.products[idx] = {id:p.id, ...payload};
    }else{
      const ref = await db.collection('products').add(payload);
      state.products.push({id:ref.id, ...payload});
    }
  }catch(e){ console.error(e); showToast('No se pudo guardar (revisa el tamaño de las imágenes)'); return; }
  state.productModal=null; showToast('Producto guardado'); render();
}
async function generateMissingSKUs(){
  const missing = state.products.filter(p=>!p.sku);
  if(missing.length===0){ showToast('Todos tus productos ya tienen SKU'); return; }
  showToast(`Generando SKU para ${missing.length} producto(s)...`);
  const usedSkus = new Set(state.products.filter(p=>p.sku).map(p=>p.sku));
  const batch = db.batch();
  missing.forEach(p=>{
    let sku;
    do{ sku = generateSKU(p); }while(usedSkus.has(sku));
    usedSkus.add(sku);
    p.sku = sku;
    batch.update(db.collection('products').doc(p.id), {sku});
  });
  try{
    await batch.commit();
    showToast(`${missing.length} SKU generados`); render();
  }catch(e){ console.error(e); showToast('No se pudo completar, intenta de nuevo'); }
}
function looksTruncatedDesc(desc){
  const d = (desc||'').trim();
  if(!d) return false;
  return /\.\.\.$/.test(d) || /…$/.test(d);
}
// Exporta TODOS los datos estructurados de cada producto (no las imágenes — son demasiado

  });

async function updateOrderStatus(id,status){
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const prevStatus = o.status;
  o.status=status;
  await saveOrdersStatus(id,status,o.source);
  // Cancelar una venta de Punto de Venta debe devolver al inventario lo que esa venta había
  // descontado al momento de cobrarse — si no, ese stock se pierde para siempre. Los pedidos
  // de la tienda en línea NUNCA descuentan stock al crearse (Ale lo ajusta a mano al
  // prepararlos), así que ahí cancelar no tiene nada que restaurar.
  if(o.source==='pos' && prevStatus!==status){
    if(status==='Cancelado' && prevStatus!=='Cancelado') await adjustStockForSale(o, 1);
    else if(prevStatus==='Cancelado' && status!=='Cancelado') await adjustStockForSale(o, -1);
  }
  render();
}
// sign=1 restaura stock (venta cancelada); sign=-1 lo vuelve a descontar (venta reactivada
// desde "Cancelado" a cualquier otro estado). Refleja exactamente el descuento que hace
// chargeSale() en pos.html: por variante (v.stock + p.stock) o por centro (stockByCenter + p.stock).
async function adjustStockForSale(sale, sign){
  const centerId = sale.centerId;
  const updates = [];
  (sale.items||[]).forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    const p = state.products.find(x=>x.id===it.id);
    if(!p) return;
    if(it.variantId){
      const v = (p.variants||[]).find(x=>x.id===it.variantId);
      if(v) v.stock = Math.max(0, (v.stock||0) + sign*it.qty);
      p.stock = Math.max(0, (p.stock||0) + sign*it.qty);
      updates.push(db.collection('products').doc(p.id).update({variants: p.variants, stock: p.stock}));
    } else {
      if(!p.stockByCenter) p.stockByCenter = {};
      if(centerId) p.stockByCenter[centerId] = Math.max(0, (p.stockByCenter[centerId]||0) + sign*it.qty);
      p.stock = Math.max(0, (p.stock||0) + sign*it.qty);
      updates.push(db.collection('products').doc(p.id).update({stockByCenter: p.stockByCenter, stock: p.stock}));
    }
  });
  if(!updates.length) return;
  try{ await Promise.all(updates); showToast(sign>0 ? 'Inventario restaurado' : 'Inventario descontado de nuevo'); }
  catch(e){ console.error('No se pudo ajustar el inventario de esta venta', e); showToast('No se pudo ajustar el inventario de esta venta'); }
}

/* ============== IMÁGENES + RECORTE ============== */
const CROP_SIZE = 280, CROP_OUT = 700;
let cropCtx = null;
function clampCropOffsets(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const dw = cropCtx.natW*scale, dh = cropCtx.natH*scale;
  cropCtx.offX = Math.min(0, Math.max(CROP_SIZE-dw, cropCtx.offX));
  cropCtx.offY = Math.min(0, Math.max(CROP_SIZE-dh, cropCtx.offY));
}
function updateCropImgTransform(){
  const el = document.getElementById('crop-img'); if(!el || !cropCtx) return;
  const scale = cropCtx.baseScale*cropCtx.zoom;
  el.style.width = (cropCtx.natW*scale)+'px';
  el.style.height = (cropCtx.natH*scale)+'px';
  el.style.transform = `translate(${cropCtx.offX}px, ${cropCtx.offY}px)`;
}
function handleImageFileSelected(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const baseScale = CROP_SIZE/Math.min(img.naturalWidth, img.naturalHeight);
      cropCtx = { img, natW:img.naturalWidth, natH:img.naturalHeight, zoom:1, baseScale, offX:0, offY:0 };
      cropCtx.offX = (CROP_SIZE - cropCtx.natW*baseScale)/2;
      cropCtx.offY = (CROP_SIZE - cropCtx.natH*baseScale)/2;
      clampCropOffsets();
      state.cropOpen = true; render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function cropPointerDown(e){
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.dragging = true; cropCtx.startX = pt.clientX; cropCtx.startY = pt.clientY;
  cropCtx.startOffX = cropCtx.offX; cropCtx.startOffY = cropCtx.offY;
}
function cropPointerMove(e){
  if(!cropCtx || !cropCtx.dragging) return;
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.offX = cropCtx.startOffX + (pt.clientX - cropCtx.startX);
  cropCtx.offY = cropCtx.startOffY + (pt.clientY - cropCtx.startY);
  clampCropOffsets();
  updateCropImgTransform();
}
function cropPointerUp(){ if(cropCtx) cropCtx.dragging = false; }
document.addEventListener('mousemove', cropPointerMove);
document.addEventListener('mouseup', cropPointerUp);
document.addEventListener('touchmove', cropPointerMove, {passive:false});
document.addEventListener('touchend', cropPointerUp);
function cropSetZoom(val){
  if(!cropCtx) return;
  cropCtx.zoom = parseFloat(val);
  clampCropOffsets(); updateCropImgTransform();
}
const MAX_IMG_BYTES = 250*1024; // límite de peso por imagen (plan Blaze: cada byte guardado en Firestore se paga)
function dataUrlBytes(dataUrl){
  const b64 = dataUrl.slice(dataUrl.indexOf(',')+1);
  const len = b64.length;
  const padding = b64.endsWith('==') ? 2 : (b64.endsWith('=') ? 1 : 0);
  return Math.floor(len*3/4) - padding;
}
// Prueba calidades de mayor a menor hasta que el JPEG resultante quepa en maxBytes.
// Devuelve null si ni la calidad más baja alcanza (entonces hay que reducir resolución).
function canvasToLimitedJpeg(canvas, maxBytes){
  const qualities = [0.85,0.8,0.75,0.7,0.65,0.6,0.55,0.5,0.45,0.4,0.35,0.3,0.25,0.2];
  for(const q of qualities){
    const url = canvas.toDataURL('image/jpeg', q);
    if(dataUrlBytes(url) <= maxBytes) return url;
  }
  return null;
}
function applyCrop(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const sx = -cropCtx.offX/scale, sy = -cropCtx.offY/scale, ssize = CROP_SIZE/scale;
  // Primero se intenta con la resolución normal (700x700) bajando la calidad; solo si una imagen
  // muy detallada no cabe ni en la calidad más baja, se reduce el tamaño y se repite.
  // Se rellena el canvas de blanco antes de dibujar: el formato de salida es JPEG (sin canal
  // alfa), así que si la foto original tiene fondo transparente (PNG), sin este relleno esas
  // zonas se verían negras en vez de blancas al exportar.
  let outSize = CROP_OUT, dataUrl = null;
  while(outSize >= 300 && !dataUrl){
    const canvas = document.createElement('canvas'); canvas.width=outSize; canvas.height=outSize;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,outSize,outSize);
    ctx.drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, outSize, outSize);
    dataUrl = canvasToLimitedJpeg(canvas, MAX_IMG_BYTES);
    if(!dataUrl) outSize = Math.round(outSize*0.85);
  }
  if(!dataUrl){
    // último recurso (imagen extremadamente compleja): tamaño mínimo, calidad mínima, se acepta lo que salga
    const canvas = document.createElement('canvas'); canvas.width=300; canvas.height=300;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,300,300);
    ctx.drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, 300, 300);
    dataUrl = canvas.toDataURL('image/jpeg', 0.2);
  }
  if(!state.productModal.images) state.productModal.images = [];
  if(state.productModal.images.length>=10){ showToast('Máximo 10 imágenes por producto'); }
  else state.productModal.images.push(dataUrl);
  state.cropOpen = false; cropCtx = null; render();
}
function removeImage(idx){ state.productModal.images.splice(idx,1); render(); }
function moveImage(idx,dir){
  const arr = state.productModal.images;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]]; render();
}

/* ============== CORRECCIÓN DE FOTOS CON FONDO NEGRO ==============
   Bug histórico: el recorte de imágenes (applyCrop, arriba) exportaba a JPEG sin rellenar
   fondo blanco antes — cualquier foto con transparencia (PNG) quedaba con esas zonas en negro,
   porque JPEG no tiene canal alfa y el navegador las pinta de negro por defecto al convertir.
   Ya se corrigió para las fotos nuevas (applyCrop ahora rellena de blanco antes de dibujar).
   Esta herramienta es para arreglar las fotos que ya quedaron guardadas así: revisa cada foto
   de cada producto, detecta las que tienen negro puro pegado a los 4 bordes (la firma de este
   bug en particular) y, para las que se confirmen, rellena esas zonas de blanco con un flood
   fill desde el borde — mismo tamaño y mismo límite de peso de siempre, no se toca nada más
   del producto. */
const BGFIX_SAMPLE_SIZE = 60; // miniatura usada solo para decidir qué fotos son candidatas (rápido)
const BGFIX_BLACK_THRESHOLD = 14; // 0-255: qué tan oscuro debe ser un pixel para contar como "negro puro"

function bgFixSampleIsBlackBorder(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const pts = [
    [1,1],[w-2,1],[1,h-2],[w-2,h-2],
    [Math.floor(w/2),1],[Math.floor(w/2),h-2],[1,Math.floor(h/2)],[w-2,Math.floor(h/2)],
  ];
  let darkCount = 0;
  pts.forEach(([x,y])=>{
    const d = ctx.getImageData(x,y,1,1).data;
    if((d[0]+d[1]+d[2])/3 <= BGFIX_BLACK_THRESHOLD) darkCount++;
  });
  return darkCount >= 6;
}
function loadImageAsync(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function openBgFixTool(){
  state.bgFixOpen = true; state.bgFixScanning = true; state.bgFixCandidates = []; state.bgFixResult = null;
  state.bgFixScanProgress = 0;
  render();
  const jobs = [];
  state.products.forEach(p=>{ (p.images||[]).forEach((src,idx)=>{ jobs.push({productId:p.id, productName:p.name, imageIndex:idx, src}); }); });
  state.bgFixScanTotal = jobs.length;
  const candidates = [];
  for(const job of jobs){
    try{
      const img = await loadImageAsync(job.src);
      const c = document.createElement('canvas'); c.width=BGFIX_SAMPLE_SIZE; c.height=BGFIX_SAMPLE_SIZE;
      c.getContext('2d').drawImage(img, 0, 0, BGFIX_SAMPLE_SIZE, BGFIX_SAMPLE_SIZE);
      if(bgFixSampleIsBlackBorder(c)) candidates.push({...job, checked:true});
    }catch(e){ /* imagen ilegible, se ignora */ }
    state.bgFixScanProgress++;
    if(state.bgFixScanProgress % 15 === 0) render();
  }
  state.bgFixCandidates = candidates;
  state.bgFixScanning = false;
  render();
}
function closeBgFixTool(){
  if(state.bgFixProcessing) return;
  state.bgFixOpen=false; state.bgFixCandidates=[]; state.bgFixResult=null; render();
}
function toggleBgFixCandidate(i){ const c = state.bgFixCandidates[i]; if(!c) return; c.checked = !c.checked; render(); }
function toggleBgFixAll(checked){ state.bgFixCandidates.forEach(c=>c.checked=checked); render(); }
// Rellena de blanco, con flood fill desde los bordes, cualquier zona conectada de negro puro —
// así solo se corrige el fondo (que siempre toca los 4 bordes en un recorte cuadrado), sin
// tocar el producto en sí aunque tenga partes negras, mientras no estén pegadas al borde.
function floodFillBlackBorderToWhite(canvas, threshold){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const visited = new Uint8Array(w*h);
  const stack = [];
  function isBlack(i){ const p=i*4; return (data[p]+data[p+1]+data[p+2])/3 <= threshold; }
  function seed(x,y){
    if(x<0||y<0||x>=w||y>=h) return;
    const i = y*w+x;
    if(visited[i]) return;
    if(isBlack(i)){ visited[i]=1; stack.push(i); }
  }
  for(let x=0;x<w;x++){ seed(x,0); seed(x,h-1); }
  for(let y=0;y<h;y++){ seed(0,y); seed(w-1,y); }
  while(stack.length){
    const i = stack.pop();
    const x = i % w, y = (i - x) / w;
    const p = i*4;
    data[p]=255; data[p+1]=255; data[p+2]=255;
    seed(x+1,y); seed(x-1,y); seed(x,y+1); seed(x,y-1);
  }
  ctx.putImageData(imgData,0,0);
}
async function applyBgFix(){
  const selected = state.bgFixCandidates.filter(c=>c.checked);
  if(selected.length===0){ showToast('No hay ninguna foto seleccionada'); return; }
  state.bgFixProcessing = true; state.bgFixProgress = 0; render();
  const byProduct = {};
  for(const c of selected){
    try{
      const img = await loadImageAsync(c.src);
      const size = Math.max(img.naturalWidth, img.naturalHeight, 300);
      const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, 0, 0);
      // Umbral más permisivo que la detección, para limpiar también el halo gris oscuro que
      // suele quedar en el borde entre el producto y el fondo negro original.
      floodFillBlackBorderToWhite(canvas, 60);
      const newUrl = canvasToLimitedJpeg(canvas, MAX_IMG_BYTES) || canvas.toDataURL('image/jpeg', 0.6);
      const p = state.products.find(x=>x.id===c.productId);
      if(p && p.images && p.images[c.imageIndex]!==undefined){
        p.images[c.imageIndex] = newUrl;
        (byProduct[c.productId] = byProduct[c.productId] || []).push(c.imageIndex);
      }
    }catch(e){ console.error('No se pudo corregir una imagen', e); }
    state.bgFixProgress++;
    if(state.bgFixProgress % 5 === 0) render();
  }
  const productIds = Object.keys(byProduct);
  let saved = 0, failed = 0;
  for(const id of productIds){
    const p = state.products.find(x=>x.id===id);
    if(!p) continue;
    try{ await db.collection('products').doc(id).update({images: p.images}); saved++; }
    catch(e){ console.error(e); failed++; }
  }
  state.bgFixProcessing = false;
  state.bgFixResult = { photos: selected.length, products: productIds.length, failed };
  state.bgFixCandidates = state.bgFixCandidates.filter(c=>!c.checked);
  render();
  showToast(`Se corrigieron ${selected.length} foto(s) en ${saved} producto(s)`);
}
