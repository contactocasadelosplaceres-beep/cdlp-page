name: Avisos a Slack (pedidos y ventas)
# Revisa cada minuto, de 8:00 a 21:00 (hora de Ciudad Guzmán), si hubo pedidos de la tienda o ventas del POS
# nuevas y las manda a Slack. Lo que llegue de noche se avisa junto a las 8:00. Cambiar el horario: HORA_INICIO / HORA_FIN.
# Cada corrida se queda ~5.6 h revisando y al final se vuelve a lanzar sola; el horario de abajo
# solo es respaldo por si la cadena se corta (GitHub corre los horarios con horas de retraso).
# También vigila el catálogo: si el panel pidió publicar, lanza "Catálogo estático" en ≤5 min (≤30 de noche).
# Secreto recomendado: SLACK_WEBHOOK_URL (Settings → Secrets and variables → Actions). Mientras no exista,
# usa el webhook que ya estaba en settings/store para no interrumpir los avisos.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: slack
  cancel-in-progress: false
jobs:
  slack:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, sparse-checkout: tools/slack }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/slack/package-lock.json
      - run: npm ci --prefix tools/slack --no-audit --no-fund
      - name: Avisar
        run: node tools/slack/notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOP_MINUTES: '335'
          INTERVAL_SEC: '60'
          HORA_INICIO: '8'
          HORA_FIN: '21'
          UTC_OFFSET_HORAS: '-6'
          CATALOGO_CADA_MIN: '5'
          CATALOGO_NOCHE_MIN: '30'
