/* ============== CSV IMPORT ============== */
function parseCSV(text){
  const rows = []; let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQuotes=false;i++;continue; }
      field+=c; i++; continue;
    }else{
      if(c === '"'){ inQuotes=true; i++; continue; }
      if(c === ','){ row.push(field); field=''; i++; continue; }
      if(c === '\n' || c === '\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function rowsToProducts(rows){
  if(!rows.length) return [];
  let start = 0;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const hasHeader = header.some(h=>h.includes('nombre')) || header.some(h=>h.includes('precio'));
  let colMap = {name:0,cat:1,price:2,stock:3,desc:4};
  if(hasHeader){
    start = 1;
    header.forEach((h,idx)=>{
      if(h.includes('nombre')) colMap.name=idx;
      else if(h.includes('categor')) colMap.cat=idx;
      else if(h.includes('precio')) colMap.price=idx;
      else if(h.includes('stock')||h.includes('existenc')) colMap.stock=idx;
      else if(h.includes('desc')) colMap.desc=idx;
    });
  }
  const out = [];
  for(let r=start;r<rows.length;r++){
    const row = rows[r];
    const name = (row[colMap.name]||'').trim();
    if(!name) continue;
    const cat = (row[colMap.cat]||'Otros').trim() || 'Otros';
    const price = Number((row[colMap.price]||'0').replace(/[^0-9.]/g,'')) || 0;
    const stock = Number((row[colMap.stock]||'0').replace(/[^0-9]/g,'')) || 0;
    const desc = (row[colMap.desc]||'').trim();
    out.push({name,cat,price,stock,desc});
  }
  return out;
}
/* ============== IMPORTAR ARCHIVO (unificado) ==============
   Antes había tres botones: "Importar archivo" (CSV de 5 columnas), "Importar descripciones
   (Tiendanube)" e "Importar variantes (Tiendanube)". Ahora uno solo detecta qué le subiste:
   - JSON (el mismo formato que genera "Exportar productos"): trae todos los campos de cada
     producto — nombre, categorías, precio, costo, stock, descripción, etiquetas, variantes.
     Empareja por "id" si lo trae, si no por nombre; si no encuentra el producto, lo crea.
   - CSV de Tiendanube (tiene la columna "Identificador de URL"): de ahí se sacan a la vez
     descripción y variantes (lo que antes hacían los dos importadores de Tiendanube por
     separado), reusando exactamente el mismo análisis de columnas ya probado. Solo actualiza
     productos que ya existen en tu catálogo (emparejados por nombre) — no crea nuevos.
   - CSV simple de 5 columnas (nombre, categoría, precio, stock, descripción), igual que antes.
   En los tres casos se arma una vista previa con una fila por producto y una casilla para
   elegir qué aplicar — nada se guarda sin que la revises primero. */
function detectImportFormat(rawText){
  const trimmed = (rawText||'').trim();
  if(!trimmed) return {type:'empty'};
  if(trimmed[0]==='[' || trimmed[0]==='{'){
    try{ const json = JSON.parse(trimmed); return {type:'json', data: Array.isArray(json)?json:[json]}; }
    catch(e){ /* no era JSON válido — sigue intentando como CSV */ }
  }
  const rows = parseCSV(trimmed);
  if(!rows.length) return {type:'empty'};
  const header = rows[0].map(h=>h.trim().toLowerCase());
  if(header.indexOf('identificador de url')>=0) return {type:'tiendanube', rawText:trimmed};
  return {type:'simple', rows};
}
function buildSimpleImportRows(rows){
  const products = rowsToProducts(rows);
  const byNorm = {};
  state.products.forEach(p=>{ const k=normName(p.name); (byNorm[k]=byNorm[k]||[]).push(p); });
  return products.map((p,idx)=>{
    const candidates = byNorm[normName(p.name)];
    const existing = candidates && candidates.length===1 ? candidates[0] : null;
    const ambiguous = !!(candidates && candidates.length>1);
    const patch = {name:p.name, cat:p.cat, price:p.price, stock:p.stock, desc:p.desc};
    const summary = [`Precio ${money(p.price)}`, `Stock ${p.stock}`, p.desc?'Descripción':''].filter(Boolean).join(' · ');
    return {key:'s'+idx, productId: (existing&&!ambiguous)?existing.id:null, name:p.name, isNew:!existing, ambiguous, summary, patch, checked:true};
  });
}
function buildTiendanubeImportRows(rawText){
  const descRows = parseTiendanubeDescCSV(rawText) || [];
  const variantGroups = parseTiendanubeVariantGroups(rawText) || [];
  const byNorm = {};
  state.products.forEach(p=>{ const k=normName(p.name); (byNorm[k]=byNorm[k]||[]).push(p); });
  const combined = {};
  descRows.forEach(r=>{ if(!r.descHtml) return; const k=normName(r.name); combined[k]=combined[k]||{name:r.name}; combined[k].descHtml=r.descHtml; });
  variantGroups.forEach(g=>{ if(!g.variants||!g.variants.length) return; const k=normName(g.name); combined[k]=combined[k]||{name:g.name}; combined[k].variantGroup=g; });
  const out = []; let unmatched = 0, ambiguousCount = 0;
  Object.values(combined).forEach((g,idx)=>{
    const candidates = byNorm[normName(g.name)];
    const ambiguous = !!(candidates && candidates.length>1);
    const existing = candidates && candidates.length===1 ? candidates[0] : null;
    if(!existing){ ambiguous ? ambiguousCount++ : unmatched++; return; } // el import de Tiendanube solo actualiza productos que ya existen
    const patch = {}; const summaryParts = [];
    if(g.descHtml){
      const newDesc = htmlDescToPlainText(g.descHtml);
      const oldDesc = (existing.desc||'').trim();
      if(newDesc && newDesc!==oldDesc){ patch.desc = newDesc; summaryParts.push(!oldDesc?'Descripción nueva':'Descripción actualizada'); }
    }
    if(g.variantGroup){
      const variants = g.variantGroup.variants.map(v=>({id:uid('var_'), combo:v.combo, sku:'', priceOverride:v.price, stock:v.stock}));
      patch.variantGroups = g.variantGroup.groups; patch.variants = variants;
      patch.stock = variants.reduce((s,v)=>s+(v.stock||0),0);
      summaryParts.push(`${variants.length} variante(s)`);
    }
    if(!Object.keys(patch).length) return;
    out.push({
      key:'t'+idx, productId: existing.id, name: g.name, isNew:false, ambiguous:false,
      summary: summaryParts.join(' · '), patch,
      checked: (!!patch.desc && (!existing.desc || looksTruncatedDesc(existing.desc))) || (!!patch.variantGroups && !(existing.variants&&existing.variants.length)),
    });
  });
  return {rows: out, unmatched, ambiguous: ambiguousCount};
}
function buildJsonImportRows(data){
  const byNorm = {};
  state.products.forEach(p=>{ const k=normName(p.name); (byNorm[k]=byNorm[k]||[]).push(p); });
  const FIELDS = ['name','cat','categories','price','promoPrice','cost','stock','desc','needs','sku','variantGroups','variants','stockByCenter'];
  return data.map((item,idx)=>{
    const existing = item.id ? state.products.find(p=>p.id===item.id) : null;
    const byName = !existing && item.name ? byNorm[normName(item.name)] : null;
    const ambiguous = !!(byName && byName.length>1);
    const matched = existing || (byName && byName.length===1 ? byName[0] : null);
    const patch = {};
    FIELDS.forEach(f=>{ if(item[f]!==undefined) patch[f]=item[f]; });
    const summaryParts = [];
    if(patch.price!==undefined) summaryParts.push('Precio '+money(patch.price));
    if(patch.stock!==undefined) summaryParts.push('Stock '+patch.stock);
    if(patch.desc!==undefined) summaryParts.push('Descripción');
    if(patch.variants!==undefined) summaryParts.push(`${(patch.variants||[]).length} variante(s)`);
    return {
      key:'j'+idx, productId: (matched&&!ambiguous)?matched.id:null, name: item.name||(matched?matched.name:'(sin nombre)'),
      isNew: !matched, ambiguous, summary: summaryParts.join(' · ') || 'Todos los campos', patch, checked:true,
    };
  });
}
function buildImportPreview(rawText){
  const detected = detectImportFormat(rawText);
  if(detected.type==='empty') return {kind:'empty', rows:[], unmatched:0, ambiguous:0};
  if(detected.type==='json') return {kind:'json', rows: buildJsonImportRows(detected.data), unmatched:0, ambiguous: buildJsonImportRows(detected.data).filter(r=>r.ambiguous).length};
  if(detected.type==='tiendanube'){ const r = buildTiendanubeImportRows(detected.rawText); return {kind:'tiendanube', rows:r.rows, unmatched:r.unmatched, ambiguous:r.ambiguous}; }
  const rows = buildSimpleImportRows(detected.rows);
  return {kind:'simple', rows, unmatched:0, ambiguous: rows.filter(r=>r.ambiguous).length};
}
function handleImportFile(input){
  const file = input.files[0]; if(!file) return;
  state.importFileName = file.name;
  const reader = new FileReader();
  reader.onload = e=>{ state.importText = e.target.result; Object.assign(state, {importResult: buildImportPreview(state.importText)}); render(); };
  reader.readAsText(file);
}
function handleImportTextChange(val){
  state.importText = val; state.importFileName='';
  state.importResult = buildImportPreview(val);
  render();
}
function toggleImportRow(key, checked){
  const r = (state.importResult&&state.importResult.rows||[]).find(x=>x.key===key);
  if(r) r.checked = checked;
}
function toggleImportAll(checked){
  (state.importResult&&state.importResult.rows||[]).forEach(r=>{ if(!r.ambiguous) r.checked=checked; });
  render();
}
async function commitImport(mode){
  const rows = (state.importResult&&state.importResult.rows||[]).filter(r=>r.checked && !r.ambiguous);
  if(rows.length===0){ showToast('No hay productos seleccionados para importar'); return; }
  const newCats = new Set(mode==='replace' ? [] : state.settings.categories);
  const addCatsFrom = (obj)=>{ if(obj.cat) newCats.add(obj.cat); (obj.categories||[]).forEach(c=>newCats.add(c)); };
  try{
    if(mode==='replace'){
      const batchDel = db.batch();
      state.products.forEach(p=>batchDel.delete(db.collection('products').doc(p.id)));
      await batchDel.commit();
      const newProducts = [];
      for(let i=0;i<rows.length;i+=400){
        const chunk = rows.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(r=>{
          const ref = db.collection('products').doc();
          const fresh = {name:r.name, cat:'Otros', price:0, stock:0, desc:'', images:[], needs:[], ...r.patch};
          addCatsFrom(fresh);
          batch.set(ref, fresh);
          newProducts.push({id:ref.id, ...fresh});
        });
        await batch.commit();
      }
      state.products = newProducts;
    }else{
      for(let i=0;i<rows.length;i+=400){
        const chunk = rows.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(r=>{
          if(r.productId){
            const existing = state.products.find(p=>p.id===r.productId);
            if(existing){ Object.assign(existing, r.patch); addCatsFrom(existing); }
            batch.update(db.collection('products').doc(r.productId), r.patch);
          }else{
            const ref = db.collection('products').doc();
            const fresh = {name:r.name, cat:'Otros', price:0, stock:0, desc:'', images:[], needs:[], ...r.patch};
            addCatsFrom(fresh);
            batch.set(ref, fresh);
            state.products.push({id:ref.id, ...fresh});
          }
        });
        await batch.commit();
      }
    }
    state.settings.categories = Array.from(newCats);
    await saveSettings();
    state.importOpen=false; state.importPreview=[]; state.importText=''; state.importFileName=''; state.importResult=null;
    showToast(`${rows.length} producto(s) importado(s)/actualizado(s)`);
    render();
  }catch(e){ console.error(e); showToast('Ocurrió un error al importar: '+(e.message||'error desconocido')); }
}

/* ============== LISTAS LARGAS: "ver más" ============== */
// Helper genérico para no renderizar de golpe listas que pueden tener cientos de
// filas (bajo stock, catálogo completo, pedidos, clientes...). Cada lista tiene su
// propia llave en `state` que recuerda cuántos elementos se han revelado; se resetea
// llamando resetShowMore(key) cuando cambia el filtro/búsqueda que la alimenta.
const SHOW_MORE_PAGE_SIZE = 20;
function showMoreSlice(key, items, pageSize){
  pageSize = pageSize || SHOW_MORE_PAGE_SIZE;
  if(state[key]==null) state[key] = pageSize;
  return { shown: items.slice(0, state[key]), remaining: Math.max(0, items.length - state[key]) };
}
function renderShowMoreButton(key, remaining, pageSize){
  pageSize = pageSize || SHOW_MORE_PAGE_SIZE;
  if(remaining<=0) return '';
  return `<button class="btn-ver-mas" onclick="state.${key}=(state.${key}||${pageSize})+${pageSize};render()">Ver más (${remaining} más)</button>`;
}
function resetShowMore(key){ state[key] = SHOW_MORE_PAGE_SIZE; }

/* ============== MÉTRICAS ============== */
function computeMetrics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const cancelled = state.orders.filter(o=>o.status==='Cancelado');
  const totalRevenue = valid.reduce((s,o)=>s+o.total,0);
  const avgOrder = valid.length ? totalRevenue/valid.length : 0;
  const avgItems = valid.length ? valid.reduce((s,o)=>s+o.items.reduce((a,it)=>a+it.qty,0),0)/valid.length : 0;
  const pending = state.orders.filter(o=>['Nuevo','Preparando','En camino'].includes(o.status)).length;
  const lowStock = state.products.filter(p=>p.stock<=3);
  const cancelRate = state.orders.length ? Math.round((cancelled.length/state.orders.length)*100) : 0;

  const byPhone = {};
  state.orders.forEach(o=>{ if(!o.phone) return; (byPhone[o.phone] = byPhone[o.phone]||[]).push(o); });
  const uniqueCustomers = Object.keys(byPhone).length;
  const repeatCustomers = Object.values(byPhone).filter(list=>list.length>1).length;
  const repeatRate = uniqueCustomers ? Math.round((repeatCustomers/uniqueCustomers)*100) : 0;
  const topCustomers = Object.entries(byPhone).map(([phone,list])=>({
    phone, name:list[0].customer, spend: list.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0), count:list.length
  })).sort((a,b)=>b.spend-a.spend).slice(0,5);

  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const dayRevenue = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=d && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: rev}; });

  const months = []; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-i); months.push(d); }
  const monthRevenue = months.map((m,idx)=>{
    const next = idx<months.length-1 ? months[idx+1] : new Date(m.getFullYear(), m.getMonth()+1, 1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=m && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: m.toLocaleDateString('es-MX',{month:'short'}), value: rev};
  });

  const now = new Date();
  const startThis = new Date(now); startThis.setDate(now.getDate()-6); startThis.setHours(0,0,0,0);
  const startLast = new Date(startThis); startLast.setDate(startThis.getDate()-7);
  const revThis = valid.filter(o=>new Date(o.date)>=startThis).reduce((s,o)=>s+o.total,0);
  const revLast = valid.filter(o=>{const d=new Date(o.date); return d>=startLast && d<startThis;}).reduce((s,o)=>s+o.total,0);
  const revDelta = revLast>0 ? Math.round(((revThis-revLast)/revLast)*100) : (revThis>0?100:0);

  const catUnits = {}, catRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.id);
    const cat = prod ? prod.cat : 'Otros';
    catUnits[cat] = (catUnits[cat]||0)+it.qty;
    catRevenue[cat] = (catRevenue[cat]||0)+it.price*it.qty;
  }));
  const catUnitRows = Object.entries(catUnits).sort((a,b)=>b[1]-a[1]);
  const catRevRows = Object.entries(catRevenue).sort((a,b)=>b[1]-a[1]);
  const maxCatUnit = catUnitRows.length ? catUnitRows[0][1] : 1;
  const maxCatRev = catRevRows.length ? catRevRows[0][1] : 1;

  const prodUnits = {}, prodRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{ prodUnits[it.name]=(prodUnits[it.name]||0)+it.qty; prodRevenue[it.name]=(prodRevenue[it.name]||0)+it.price*it.qty; }));
  const topByUnits = Object.entries(prodUnits).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topByRevenue = Object.entries(prodRevenue).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const soldNames = new Set(Object.keys(prodUnits));
  const noSales = state.products.filter(p=>!soldNames.has(p.name));

  const weekdayTotals = [0,0,0,0,0,0,0]; const weekdayCounts=[0,0,0,0,0,0,0];
  valid.forEach(o=>{ const d=new Date(o.date).getDay(); weekdayTotals[d]+=o.total; weekdayCounts[d]+=1; });
  const weekdayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const weekdayAvg = weekdayTotals.map((t,i)=> weekdayCounts[i] ? t/weekdayCounts[i] : 0);
  const bestDayIdx = weekdayAvg.indexOf(Math.max(...weekdayAvg));

  const inventoryValue = state.products.reduce((s,p)=>s+p.price*p.stock,0);
  const invByCat = {};
  state.products.forEach(p=>{ invByCat[p.cat]=(invByCat[p.cat]||0)+p.price*p.stock; });
  const invRows = Object.entries(invByCat).sort((a,b)=>b[1]-a[1]);
  const maxInv = invRows.length ? invRows[0][1] : 1;

  const statusCounts = {}; STATUS_FLOW.forEach(s=>statusCounts[s]=0);
  state.orders.forEach(o=>statusCounts[o.status]=(statusCounts[o.status]||0)+1);

  return {totalRevenue,avgOrder,avgItems,pending,lowStock,cancelRate,uniqueCustomers,repeatCustomers,repeatRate,topCustomers,
    dayRevenue,monthRevenue,revDelta,catUnitRows,catRevRows,maxCatUnit,maxCatRev,topByUnits,topByRevenue,noSales,
    weekdayNames,weekdayAvg,bestDayIdx,inventoryValue,invRows,maxInv,statusCounts,totalOrders:state.orders.length};
}
const VISIT_PERIODS = [
  {key:'hoy', label:'Hoy'},
  {key:'semana', label:'Esta semana'},
  {key:'mes', label:'Este mes'},
  {key:'semana_pasada', label:'Semana pasada'},
];
function getVisitsPeriodRange(period){
  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  if(period==='semana'){
    const dow = (now.getDay()+6)%7; // lunes=0
    const start = new Date(startOfToday); start.setDate(start.getDate()-dow);
    return {start, end: now};
  }
  if(period==='mes'){
    return {start: new Date(now.getFullYear(), now.getMonth(), 1), end: now};
  }
  if(period==='semana_pasada'){
    const dow = (now.getDay()+6)%7;
    const startThisWeek = new Date(startOfToday); startThisWeek.setDate(startThisWeek.getDate()-dow);
    const start = new Date(startThisWeek); start.setDate(start.getDate()-7);
    return {start, end: startThisWeek};
  }
  return {start: startOfToday, end: now}; // 'hoy' por default
}
function computeVisitMetrics(){
  const period = state.visitsPeriod || 'hoy';
  const {start, end} = getVisitsPeriodRange(period);
  const periodVisits = state.visits.filter(v=>{ const d=new Date(v.date); return d>=start && d<=end; });
  const totalVisits = periodVisits.length;
  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const visitsByDay = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const count = state.visits.filter(v=>{const vd=new Date(v.date); return vd>=d && vd<next;}).length;
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: count}; });
  const hourCounts = new Array(24).fill(0);
  periodVisits.forEach(v=>{ const h = new Date(v.date).getHours(); hourCounts[h]++; });
  const visitsByHour = hourCounts.map((c,h)=>({label: h+'h', value:c}));
  const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
  const last24h = state.visits.filter(v=>(Date.now()-new Date(v.date).getTime())<86400000).length;
  return {totalVisits, visitsByDay, visitsByHour, peakHour, last24h, period};
}

/* ============== ESTADÍSTICAS: cálculos nuevos ==============
   Se apoyan en computeMetrics()/computeVisitMetrics() (ya existentes) más los eventos
   de embudo (state.analyticsEvents) y el campo "source" de las visitas, ambos agregados
   junto con esta función. Todo lo que dependa de esos dos campos empieza a llenarse a
   partir de esta actualización — antes no existían, así que no hay datos históricos. */
function computeFunnel(){
  const events = state.analyticsEvents || [];
  const views = events.filter(e=>e.type==='product_view').length;
  const addToCart = events.filter(e=>e.type==='add_to_cart').length;
  const checkoutStarts = events.filter(e=>e.type==='checkout_start').length;
  const purchases = state.orders.filter(o=>o.source==='tienda' && o.status!=='Cancelado').length;
  const pct = (a,b)=> b>0 ? Math.round((a/b)*100) : 0;
  return {
    views, addToCart, checkoutStarts, purchases,
    cartConversion: pct(addToCart, views),
    salesConversion: pct(purchases, views),
    hasData: events.length>0,
  };
}
function computePaymentStats(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const totals = {};
  valid.forEach(o=>{
    if(o.source==='pos'){
      salePayments(o).forEach(p=>{
        const key = p.method || 'Efectivo';
        totals[key] = totals[key] || {amount:0,count:0};
        totals[key].amount += p.amount||0; totals[key].count += 1;
      });
    } else {
      totals['Contra entrega'] = totals['Contra entrega'] || {amount:0,count:0};
      totals['Contra entrega'].amount += o.total||0; totals['Contra entrega'].count += 1;
    }
  });
  const rows = Object.entries(totals).map(([method,v])=>({method, amount:v.amount, count:v.count})).sort((a,b)=>b.amount-a.amount);
  const totalAmount = rows.reduce((s,r)=>s+r.amount,0);
  const colors = {Efectivo:'var(--green)', Tarjeta:'var(--teal)', Transferencia:'var(--amber)', 'Contra entrega':'var(--primary)'};
  const segments = rows.map(r=>({label:r.method, value:r.amount, pct: totalAmount? (r.amount/totalAmount*100):0, color: colors[r.method] || 'var(--rose)'}));
  return {rows, totalAmount, segments};
}
function computeProductAnalytics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const unitsById = {}, revenueById = {};
  valid.forEach(o=>o.items.forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    unitsById[it.id] = (unitsById[it.id]||0) + it.qty;
    revenueById[it.id] = (revenueById[it.id]||0) + it.price*it.qty;
  }));
  const viewsById = {};
  (state.analyticsEvents||[]).forEach(e=>{ if(e.type==='product_view' && e.productId) viewsById[e.productId]=(viewsById[e.productId]||0)+1; });
  const withName = (id)=>{ const p = state.products.find(x=>x.id===id); return p ? p.name : '(producto eliminado)'; };
  const soldIds = Object.keys(unitsById);
  const byUnits = soldIds.map(id=>({id,name:withName(id),value:unitsById[id]}));
  const byRevenue = soldIds.map(id=>({id,name:withName(id),value:revenueById[id]}));
  const mostViewed = Object.entries(viewsById).map(([id,v])=>({id,name:withName(id),value:v})).sort((a,b)=>b.value-a.value).slice(0,6);
  const withMargin = state.products.filter(p=>p.cost>0 && p.price>0).map(p=>({
    id:p.id, name:p.name, marginPct: Math.round(((p.price-p.cost)/p.price)*100), profitPerUnit: p.price-p.cost
  }));
  const soldIdSet = new Set(soldIds);
  return {
    topByUnits: [...byUnits].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByUnits: [...byUnits].sort((a,b)=>a.value-b.value).slice(0,6),
    topByRevenue: [...byRevenue].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByRevenue: [...byRevenue].sort((a,b)=>a.value-b.value).slice(0,6),
    mostViewed,
    topMargin: [...withMargin].sort((a,b)=>b.marginPct-a.marginPct).slice(0,6),
    lowMargin: [...withMargin].sort((a,b)=>a.marginPct-b.marginPct).slice(0,6),
    noSales: state.products.filter(p=>!soldIdSet.has(p.id)),
    hasMarginData: withMargin.length>0,
    hasViewData: Object.keys(viewsById).length>0,
  };
}
// Reabasto sugerido: cruza ventas de los últimos 30 días (velocidad de venta) con el
// stock actual, para avisar qué se va a agotar pronto y cuánto conviene pedir — sin
// tener que ir a Estadísticas a hacer la cuenta a mano cada vez.
function computeRestockSuggestions(){
  const since = new Date(); since.setDate(since.getDate()-30);
  const valid = state.orders.filter(o=>o.status!=='Cancelado' && new Date(o.date)>=since);
  const unitsById = {};
  valid.forEach(o=>(o.items||[]).forEach(it=>{ if(!it.id || it.id==='promo_buyxpayy') return; unitsById[it.id]=(unitsById[it.id]||0)+it.qty; }));
  const rows = [];
  state.products.forEach(p=>{
    const units30 = unitsById[p.id]||0;
    if(units30<=0) return;
    const velocity = units30/30;
    const daysLeft = p.stock>0 ? p.stock/velocity : 0;
    if(daysLeft < 15){
      rows.push({ id:p.id, name:p.name, cat:p.cat, stock:p.stock, units30, daysLeft, suggested: Math.max(1, Math.ceil(velocity*30) - p.stock) });
    }
  });
  rows.sort((a,b)=>a.daysLeft-b.daysLeft);
  return rows;
}
// Salud del catálogo: junta en un solo lugar lo que hoy vive disperso (fotos, descripción,

function computeTrafficSources(){
  const labels = {directo:'Directo', google:'Google', meta:'Meta (FB/IG)', whatsapp:'WhatsApp', tiktok:'TikTok', otro:'Otro'};
  const counts = {};
  (state.visits||[]).forEach(v=>{ const key = v.source || 'sin-dato'; counts[key] = (counts[key]||0)+1; });
  const sinDato = counts['sin-dato']||0; delete counts['sin-dato'];
  const rows = Object.entries(counts).map(([k,v])=>({label: labels[k]||k, value:v})).sort((a,b)=>b.value-a.value);
  return {rows, sinDato, total: state.visits.length};
}
function computeRealtime(){
  const visits = state.recentVisitsLive || state.visits || [];
  const events = state.recentEventsLive || state.analyticsEvents || [];
  const now = Date.now(); const windowMs = 5*60*1000;
  const recentVisits = visits.filter(v=>now-new Date(v.date).getTime()<windowMs);
  const recentEvents = events.filter(e=>now-new Date(e.date).getTime()<windowMs);
  const activityLabel = {product_view:'Vio un producto', add_to_cart:'Agregó al carrito', checkout_start:'Inició su compra', purchase:'Completó una compra'};
  const feed = [...recentEvents].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15).map(e=>{
    const p = e.productId ? state.products.find(x=>x.id===e.productId) : null;
    return { label: activityLabel[e.type]||e.type, detail: p ? p.name : (e.orderTotal?money(e.orderTotal):''), date: e.date };
  });
  return { recentVisitsCount: recentVisits.length, feed };
}
// Refresco automático de "Tiempo real": trae solo lo reciente cada 20s mientras esa
// sub-pestaña esté abierta, y se detiene al salir para no dejar temporizadores vivos.
let realtimeTimer = null;
function ensureRealtimeTimer(active){
  if(active && !realtimeTimer){
    realtimeTimer = setInterval(async ()=>{
      try{
        const [visitsSnap, eventsSnap] = await Promise.all([
          db.collection('visits').orderBy('date','desc').limit(200).get(),
          db.collection('analyticsEvents').orderBy('date','desc').limit(200).get(),
        ]);
        state.recentVisitsLive = visitsSnap.docs.map(d=>d.data());
        state.recentEventsLive = eventsSnap.docs.map(d=>d.data());
        if(state.adminTab==='estadísticas' && state.statsSubview==='tiemporeal') render();
      }catch(e){ /* silencioso */ }
    }, 20000);
  } else if(!active && realtimeTimer){
    clearInterval(realtimeTimer); realtimeTimer = null;
  }
}

function renderDonutChart(segments){
  const withValue = segments.filter(s=>s.value>0);
  if(!withValue.length) return `<div class="empty-state">Aún no hay datos suficientes.</div>`;
  let acc = 0;
  const stops = withValue.map(s=>{ const start=acc; acc+=s.pct; return `${s.color} ${start}% ${acc}%`; }).join(', ');
  return `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;"></div>
      <div style="flex:1;min-width:160px;">
        ${withValue.map(s=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;">
            <span style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0;"></span>
            <span style="flex:1;">${s.label}</span>
            <strong>${Math.round(s.pct)}%</strong>
          </div>`).join('')}
      </div>
    </div>`;
}

function productHasTag(p, kind, value){
  if(kind==='cat') return (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).includes(value);
  return (p.needs||[]).includes(value);
}
async function addProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      const categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[]));
      if(categories.includes(value)){ showToast('Ya estaba en esa categoría'); return; }
      categories.push(value);
      p.categories = categories;
      await db.collection('products').doc(productId).update({categories});
    }else{
      const needs = p.needs||[];
      if(needs.includes(value)){ showToast('Ya tenía esa etiqueta'); return; }
      needs.push(value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto agregado'); render();
  }catch(e){ console.error(e); showToast('No se pudo agregar'); }
}
async function removeProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).filter(c=>c!==value);
      if(categories.length===0){
        const fallback = state.settings.categories.find(c=>c!==value) || value;
        categories = [fallback];
      }
      p.categories = categories;
      if(p.cat===value) p.cat = categories[0];
      await db.collection('products').doc(productId).update({categories, cat:p.cat});
    }else{
      const needs = (p.needs||[]).filter(n=>n!==value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto quitado de este filtro'); render();
  }catch(e){ console.error(e); showToast('No se pudo quitar'); }
}

  // Antes esta búsqueda solo mostraba productos que TODAVÍA no tenían la etiqueta (para

function slugifyNeedKey(label){
  const base = (label||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return base || uid('need-');
}
async function addNeed(){
  const label = (state.newNeedInput||'').trim();
  if(!label){ showToast('Ponle un nombre a la etiqueta'); return; }
  if(!state.settings.needs) state.settings.needs = [];
  let key = slugifyNeedKey(label);
  const existingKeys = new Set(state.settings.needs.map(n=>n.key));
  if(existingKeys.has(key)) key = key + '-' + uid('').slice(-4);
  state.settings.needs.push({key, label});
  state.newNeedInput = '';
  await saveSettings(); showToast('Etiqueta agregada'); render();
}
async function moveNeed(idx,dir){
  const arr = state.settings.needs;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  await saveSettings(); render();
}
async function renameNeed(key, newLabel){
  const n = (state.settings.needs||[]).find(x=>x.key===key); if(!n) return;
  const val = newLabel.trim();
  if(!val){ render(); return; }
  n.label = val;
  await saveSettings(); showToast('Etiqueta actualizada'); render();
}
async function removeNeed(key){
  const count = state.products.filter(p=>(p.needs||[]).includes(key)).length;
  if(count>0 && !confirm(`${count} producto(s) tienen esta etiqueta asignada. Si continúas, se la vamos a quitar de esos productos. ¿Continuar?`)) return;
  try{
    if(count>0){
      const affected = state.products.filter(p=>(p.needs||[]).includes(key));
      for(let i=0;i<affected.length;i+=400){
        const chunk = affected.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(p=>{
          p.needs = (p.needs||[]).filter(k=>k!==key);
          batch.update(db.collection('products').doc(p.id), {needs:p.needs});
        });
        await batch.commit();
      }
    }
    state.settings.needs = (state.settings.needs||[]).filter(n=>n.key!==key);
    if(state.productNeedFilter===key) state.productNeedFilter='Todas';
    await saveSettings(); showToast('Etiqueta eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar la etiqueta'); }
}

/* ============== IMPORTAR DESCRIPCIONES DESDE TIENDANUBE ============== */
function escDescHtml(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normName(s){
  return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function htmlDescToPlainText(html){
  if(!html) return '';
  const container = document.createElement('div');
  container.innerHTML = html;
  container.querySelectorAll('li').forEach(li=>{
    li.insertBefore(document.createTextNode('• '), li.firstChild);
    li.appendChild(document.createTextNode('\n'));
  });
  container.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  container.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,ul,ol,tr').forEach(el=>{
    el.appendChild(document.createTextNode('\n'));
  });
  let text = container.textContent || '';
  text = text.replace(/ /g,' ');
  text = text.replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n');
  text = text.replace(/\n{3,}/g,'\n\n').trim();
  return text;
}
function parseTiendanubeDescCSV(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idxName = header.indexOf('nombre');
  const idxDesc = header.findIndex(h=>h.includes('descripc'));
  if(idxName<0 || idxDesc<0) return null;
  const out = [];
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    const name = (row[idxName]||'').trim();
    if(!name) continue; // fila de variante (Tiendanube repite fila por cada variante, solo la primera trae nombre/descripción)
    out.push({name, descHtml:(row[idxDesc]||'').trim()});
  }
  return out;
}
/* ============== IMPORTAR VARIANTES DESDE TIENDANUBE ============== */
// El CSV de Tiendanube trae una fila por variante (mismo "Identificador de URL" repetido);
// solo la primera fila de cada producto trae "Nombre". Las columnas de propiedad (Talla, Color, etc.)
// y las de stock por ubicación ("Stock (...)") varían de nombre, así que se detectan por encabezado.
function parseTiendanubeVariantGroups(text){
  const rows = parseCSV(text);
  if(!rows.length) return null;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idxSlug = header.indexOf('identificador de url');
  const idxName = header.indexOf('nombre');
  const idxPrecio = header.indexOf('precio');
  const idxPromo = header.findIndex(h=>h.includes('precio promocional'));
  const propPairs = [1,2,3].map(n=>({
    nameIdx: header.indexOf(`nombre de propiedad ${n}`),
    valueIdx: header.indexOf(`valor de propiedad ${n}`)
  })).filter(p=>p.nameIdx>=0 && p.valueIdx>=0);
  const stockIdxs = header.map((h,i)=>h.startsWith('stock (')?i:-1).filter(i=>i>=0);
  if(idxSlug<0 || idxName<0 || !propPairs.length) return null;
  const bySlug = {};
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    const slug = (row[idxSlug]||'').trim();
    if(!slug) continue;
    if(!bySlug[slug]) bySlug[slug] = {name:'', rows:[]};
    const name = (row[idxName]||'').trim();
    if(name) bySlug[slug].name = name;
    bySlug[slug].rows.push(row);
  }
  const out = [];
  Object.values(bySlug).forEach(g=>{
    if(!g.name) return;
    const rowCombos = g.rows.map(row=>{
      const combo = {};
      propPairs.forEach(p=>{
        const pname = (row[p.nameIdx]||'').trim();
        const pval = (row[p.valueIdx]||'').trim();
        if(pname && pval) combo[pname] = pval;
      });
      const precio = Number((row[idxPrecio]||'').replace(/[^0-9.]/g,''))||0;
      const promo = idxPromo>=0 ? (Number((row[idxPromo]||'').replace(/[^0-9.]/g,''))||0) : 0;
      const stock = stockIdxs.reduce((s,idx)=>{ const raw=(row[idx]||'').trim(); const n=Number(raw); return s + (raw && !isNaN(n) ? n : 0); }, 0);
      return { combo, price: promo>0?promo:precio, stock };
    }).filter(v=>Object.keys(v.combo).length>0);
    if(!rowCombos.length) return;
    const groupNames = Array.from(new Set(rowCombos.flatMap(v=>Object.keys(v.combo))));
    const groups = groupNames.map(gn=>{
      const values = [];
      rowCombos.forEach(v=>{ if(v.combo[gn] && !values.includes(v.combo[gn])) values.push(v.combo[gn]); });
      return {name:gn, values};
    });
    out.push({name:g.name, groups, variants:rowCombos});
  });
  return out;
}
/* ============== IMPORTAR CATEGORÍAS DESDE TIENDANUBE ============== */
// El CSV de Tiendanube trae la columna "Categorías" (varias separadas por coma) repetida en
// todas las filas de un mismo producto (identificado por "Identificador de URL"); solo hace
// falta leerla de cualquiera de esas filas.
function parseTiendanubeCategorias(text){
  const rows = parseCSV(text);
  if(!rows.length) return null;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idxSlug = header.indexOf('identificador de url');
  const idxName = header.indexOf('nombre');
  const idxCat = header.findIndex(h=>h.includes('categor'));
  if(idxName<0 || idxCat<0) return null;
  const bySlug = {};
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    const slug = idxSlug>=0 ? (row[idxSlug]||'').trim() : String(i);
    if(!bySlug[slug]) bySlug[slug] = {name:'', cats:''};
    const name = (row[idxName]||'').trim();
    if(name) bySlug[slug].name = name;
    const catVal = (row[idxCat]||'').trim();
    if(catVal) bySlug[slug].cats = catVal;
  }
  const out = [];
  Object.values(bySlug).forEach(g=>{
    if(!g.name || !g.cats) return;
    const categories = g.cats.split(',').map(c=>c.trim()).filter(Boolean);
    if(categories.length) out.push({name:g.name, categories});
  });
  return out;
}
function buildCategoryImportPreview(csvRows){
  const byNorm = {};
  state.products.forEach(p=>{ const key = normName(p.name); (byNorm[key]=byNorm[key]||[]).push(p); });
  const matched = [], unmatched = [], ambiguous = [];
  const newCategoryNames = new Set();
  csvRows.forEach(row=>{
    const key = normName(row.name);
    const candidates = byNorm[key];
    if(!candidates || candidates.length===0){ unmatched.push(row.name); return; }
    if(candidates.length>1){ ambiguous.push(row.name); return; }
    const p = candidates[0];
    const current = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[]));
    const same = current.length===row.categories.length && current.every(c=>row.categories.includes(c));
    if(same) return;
    row.categories.forEach(c=>{ if(!state.settings.categories.includes(c)) newCategoryNames.add(c); });
    matched.push({ productId:p.id, productName:p.name, currentCategories:current, newCategories:row.categories, checked:true });
  });
  return {matched, unmatched, ambiguous, newCategoryNames:Array.from(newCategoryNames)};
}
function handleCategoryImportFile(input){
  const file = input.files[0]; if(!file) return;
  const fileName = file.name;
  const reader = new FileReader();
  reader.onload = e=>{
    const csvRows = parseTiendanubeCategorias(e.target.result);
    if(csvRows===null){ showToast('No se encontraron las columnas "Nombre" y "Categorías" en ese archivo'); return; }
    state.catImport = {fileName, ...buildCategoryImportPreview(csvRows)};
    render();
  };
  reader.readAsText(file);
}
function toggleCategoryImportRow(idx){
  if(!state.catImport || !state.catImport.matched[idx]) return;
  state.catImport.matched[idx].checked = !state.catImport.matched[idx].checked;
  render();

function toggleCategoryImportAll(checked){
  if(!state.catImport) return;
  state.catImport.matched.forEach(r=>r.checked=checked);

async function commitCategoryImport(){
  const ci = state.catImport;
  if(!ci || !ci.matched) return;
  const toApply = ci.matched.filter(r=>r.checked);
  if(toApply.length===0){ showToast('No hay categorías seleccionadas'); return; }
  try{
    if(ci.newCategoryNames && ci.newCategoryNames.length){
      const usedNames = new Set(toApply.flatMap(r=>r.newCategories));
      ci.newCategoryNames.forEach(c=>{ if(usedNames.has(c) && !state.settings.categories.includes(c)) state.settings.categories.push(c); });
      await saveSettings();
    }
    for(let i=0;i<toApply.length;i+=400){
      const chunk = toApply.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(r=>batch.update(db.collection('products').doc(r.productId), {
        categories: r.newCategories, cat: r.newCategories[0]
      }));
      await batch.commit();
    }
    toApply.forEach(r=>{
      const p = state.products.find(x=>x.id===r.productId);
      if(p){ p.categories = r.newCategories; p.cat = r.newCategories[0]; }
    });
    showToast(`${toApply.length} producto(s) actualizado(s) con su categoría`);
    state.catImportOpen=false; state.catImport=null;
    render();
  }catch(e){ console.error(e); showToast('Ocurrió un error al actualizar: '+(e.message||'error desconocido')); }
}

   Los clientes dejan un mensaje desde la tienda (index.html), sin necesidad de escribir por

   firestore.rules). Cada mensaje trae nombre, teléfono, un tipo (pregunta/sugerencia/queja/otro)

function messageWhatsappLink(m){

  if(!num) return null;
  const msg = `Hola ${m.name||''}, soy de ${state.settings.storeName}. Vi tu mensaje: "${(m.message||'').slice(0,180)}" — `;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;

  try{ await db.collection('storeMessages').doc(id).update({status}); }
  catch(e){ console.error(e); showToast('No se pudo actualizar el mensaje'); return; }
  const m = state.storeMessages.find(x=>x.id===id);
  if(m) m.status = status;
  render();

  if(!confirm('¿Eliminar este mensaje? Esta acción no se puede deshacer.')) return;

function centerStock(p, centerId){ return (p.stockByCenter && p.stockByCenter[centerId]) || 0; }
function totalStock(p){ return p.stockByCenter ? Object.values(p.stockByCenter).reduce((s,n)=>s+(n||0),0) : (p.stock||0); }

async function saveCenterDoc(c){

}

async function commitTransfer(){
  const items = Object.entries(state.transferCart).filter(([id,qty])=>qty>0);
  if(!state.transferFrom || !state.transferTo){ showToast('Elige centro de origen y destino'); return; }
  if(state.transferFrom === state.transferTo){ showToast('El origen y destino deben ser distintos'); return; }
  if(items.length===0){ showToast('Agrega al menos un producto a transferir'); return; }

  const fromCenter = state.centers.find(c=>c.id===state.transferFrom);
  const toCenter = state.centers.find(c=>c.id===state.transferTo);
  const batch = db.batch();
  const transferItems = [];
  for(const [pid, qty] of items){
    const p = state.products.find(x=>x.id===pid);
    if(!p) continue;
    const available = centerStock(p, state.transferFrom);
    if(qty > available){ showToast(`No hay suficiente stock de "${p.name}" en ${fromCenter.name} (disponible: ${available})`); return; }
  }
  items.forEach(([pid, qty])=>{
    const p = state.products.find(x=>x.id===pid);
    if(!p) return;
    if(!p.stockByCenter) p.stockByCenter = {};
    p.stockByCenter[state.transferFrom] = (p.stockByCenter[state.transferFrom]||0) - qty;
    p.stockByCenter[state.transferTo] = (p.stockByCenter[state.transferTo]||0) + qty;
    batch.update(db.collection('products').doc(pid), {stockByCenter: p.stockByCenter});
    transferItems.push({productId:pid, name:p.name, qty});
  });
  const transferDoc = {
    date: new Date().toISOString(), fromCenterId: state.transferFrom, fromCenterName: fromCenter.name,
    toCenterId: state.transferTo, toCenterName: toCenter.name, items: transferItems, notes: state.transferNotes.trim(),
  };
  try{
    const ref = db.collection('transfers').doc();
    batch.set(ref, transferDoc);
    await batch.commit();
    state.transfers.unshift({id:ref.id, ...transferDoc});
    state.transferCart = {}; state.transferNotes=''; state.transferProductSearch='';
    showToast('Transferencia realizada'); render();
  }catch(e){ console.error(e); showToast('No se pudo completar la transferencia'); }
}

  state.transferProductSearch = v;
  render();
  const i = document.getElementById('transfer-search-input');
  if(i){ i.focus(); i.setSelectionRange(v.length, v.length); }
}
function setTransferQty(pid, qty){
  qty = Math.max(0, Number(qty)||0);
  if(qty===0) delete state.transferCart[pid]; else state.transferCart[pid] = qty;
  render();
}

function normalizePhone(phone){ return (phone||'').replace(/\D/g,''); }
function computeCustomersList(){
  const byPhone = {};
  // 1) Se arman automáticamente a partir de los pedidos de la tienda (index.html).
  state.orders.filter(o=>o.source!=='pos' && o.phone).forEach(o=>{
    const key = normalizePhone(o.phone);
    if(!key) return;
    if(!byPhone[key]){
      byPhone[key] = { id:key, name:o.customer||'Sin nombre', phone:o.phone, email:'', address:'', city:'', state:'', country:'', notes:'',
        createdAt:null, purchases:[], totalSpent:0, isManual:false, manualId:null };
    }
    const c = byPhone[key];
    // La dirección y el nombre se toman del pedido más reciente (es lo que el
    // cliente escribió al pagar, así que es lo más actualizado que tenemos de él).
    if(new Date(o.date) > new Date(c.lastDate||0)){ c.name = o.customer||c.name; c.address = o.address||c.address; c.lastDate = o.date; c.lastFolio = o.orderNumber; }
    if(o.status!=='Cancelado'){ c.totalSpent += (o.total||0); c.purchases.push(o); }
  });
  // 2) Se combinan con los perfiles que tú creas/editas a mano (colección "customers").
  //    Si ya tienen dirección capturada a mano, esa manda sobre la del pedido.
  state.customers.forEach(m=>{
    const key = m.phone ? normalizePhone(m.phone) : `manual_${m.id}`;
    if(byPhone[key]){
      Object.assign(byPhone[key], { name:m.name||byPhone[key].name, email:m.email||'', address:m.address||byPhone[key].address||'', city:m.city||'', state:m.state||'', country:m.country||'', notes:m.notes||'', createdAt:m.createdAt||null, isManual:true, manualId:m.id });
    }else{
      byPhone[key] = { id:key, name:m.name||'Sin nombre', phone:m.phone||'', email:m.email||'', address:m.address||'', city:m.city||'', state:m.state||'', country:m.country||'', notes:m.notes||'',
        createdAt:m.createdAt||null, purchases:[], totalSpent:0, isManual:true, manualId:m.id };
    }
  });
  // 3) Se suman también las ventas del Punto de Venta que quedaron asociadas a un
  // cliente de la lista (seleccionado desde pos.html), buscando su perfil por el
  // mismo id de "customers" con el que ya se armó el punto 2.
  const byManualId = {};
  Object.entries(byPhone).forEach(([key,c])=>{ if(c.manualId) byManualId[c.manualId] = key; });
  state.orders.filter(o=>o.source==='pos' && o.customerId).forEach(o=>{
    let key = byManualId[o.customerId];
    if(!key){
      // El perfil pudo haberse borrado después de la venta; se conserva su historial igual.
      key = `manual_${o.customerId}`;
      if(!byPhone[key]){
        byPhone[key] = { id:key, name:o.customerName||'Sin nombre', phone:o.customerPhone||'', email:'', address:'', city:'', state:'', country:'', notes:'',
          createdAt:null, purchases:[], totalSpent:0, isManual:false, manualId:o.customerId };
      }
    }
    const c = byPhone[key];
    if(new Date(o.date) > new Date(c.lastDate||0)){ c.lastDate = o.date; c.lastFolio = o.orderNumber; }
    c.totalSpent += (o.total||0); c.purchases.push(o);
  });
  return Object.values(byPhone).map(c=>({
    ...c,
    purchaseCount: c.purchases.length,
    registeredAt: c.createdAt || c.lastDate || null,
  })).sort((a,b)=>b.totalSpent-a.totalSpent);
}
function filteredCustomers(){
  let list = computeCustomersList();
  const q = (state.customerSearch||'').trim().toLowerCase();
  if(q) list = list.filter(c=>(c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.email||'').toLowerCase().includes(q));
  const f = state.customerFilters;
  if(f.country!=='Todos') list = list.filter(c=>(c.country||'—')===f.country);
  if(f.state!=='Todos') list = list.filter(c=>(c.state||'—')===f.state);
  if(f.city!=='Todos') list = list.filter(c=>(c.city||'—')===f.city);
  if(f.regDate!=='Todas'){
    const days = {'Último día':1,'Últimos 7 días':7,'Últimos 30 días':30}[f.regDate];
    if(days){ const cutoff = Date.now()-days*86400000; list = list.filter(c=>c.registeredAt && new Date(c.registeredAt).getTime()>=cutoff); }
  }
  return list;
}
function distinctCustomerValues(field){
  const vals = new Set(computeCustomersList().map(c=>c[field]||'—'));
  return Array.from(vals).sort();
}

function exportCustomersCSV(){
  const list = filteredCustomers();
  const rows = [['nombre','telefono','email','direccion','ciudad','estado','pais','ultima_compra','total_consumido','numero_de_compras','notas']];
  list.forEach(c=>rows.push([c.name, c.phone, c.email, c.address||'', c.city, c.state, c.country, c.lastDate?new Date(c.lastDate).toLocaleDateString('es-MX'):'', c.totalSpent, c.purchaseCount, c.notes||'']));
  const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='clientes.csv'; a.click();
  URL.revokeObjectURL(url);
}
function parseCustomerCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const header = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/"/g,''));
  const idx = (name)=>header.findIndex(h=>h.includes(name));
  const iName=idx('nombre'), iPhone=idx('telefono'), iEmail=idx('email')>=0?idx('email'):idx('correo'), iAddress=idx('direcc'), iCity=idx('ciudad'), iState=idx('estado'), iCountry=idx('pais'), iNotes=idx('notas');
  return lines.slice(1).map(line=>{
    const cols = line.match(/(".*?"|[^,]+)(?=,|$)/g)||[];
    const clean = i => i>=0 && cols[i] ? cols[i].replace(/^"|"$/g,'').replace(/""/g,'"').trim() : '';
    return { name:clean(iName), phone:clean(iPhone), email:clean(iEmail), address:clean(iAddress), city:clean(iCity), state:clean(iState), country:clean(iCountry), notes:clean(iNotes) };
  }).filter(r=>r.name);
}

      const ref = existing ? db.collection('customers').doc(existing.id) : db.collection('customers').doc();
      batch.set(ref, payload);

/* ============== MAYOREO (tablas de precios por volumen) ============== */
function genWholesaleCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
function openWholesaleModal(id){
  const t = id ? {...state.settings.wholesaleTiers.find(x=>x.id===id)} : {
    id: uid('wt_'), name:'', discountPercent:10, scope:'all', categories:[], productIds:[],
    minType:'amount', minValue:0, code: genWholesaleCode(), active:true,
  };
  state.wholesaleModal = t; state.wholesaleProductSearch=''; render();
}
function closeWholesaleModal(){ state.wholesaleModal=null; render(); }
function toggleWholesaleCategory(cat, checked){
  const t = state.wholesaleModal;
  if(checked){ if(!t.categories.includes(cat)) t.categories.push(cat); }
  else{ t.categories = t.categories.filter(c=>c!==cat); }
}
function toggleWholesaleProduct(pid, checked){
  const t = state.wholesaleModal;
  if(checked){ if(!t.productIds.includes(pid)) t.productIds.push(pid); }
  else{ t.productIds = t.productIds.filter(id=>id!==pid); }
}
async function saveWholesaleTier(){
  const t = state.wholesaleModal;
  const name = document.getElementById('wt-name').value.trim();
  const discountPercent = Number(document.getElementById('wt-discount').value)||0;
  const scope = document.getElementById('wt-scope').value;
  const minType = document.getElementById('wt-mintype').value;
  const minValue = Number(document.getElementById('wt-minvalue').value)||0;
  const code = document.getElementById('wt-code').value.trim().toUpperCase();
  if(!name){ showToast('Ponle un nombre a la tabla de precios'); return; }
  if(!code){ showToast('Necesita un código de acceso'); return; }
  const others = state.settings.wholesaleTiers.filter(x=>x.id!==t.id);
  if(others.some(x=>x.code===code)){ showToast('Ese código ya lo usa otra tabla, elige otro'); return; }
  const updated = {...t, name, discountPercent, scope, minType, minValue, code};
  const idx = state.settings.wholesaleTiers.findIndex(x=>x.id===t.id);
  if(idx>=0) state.settings.wholesaleTiers[idx] = updated;
  else state.settings.wholesaleTiers.push(updated);
  await saveSettings();
  state.wholesaleModal=null; showToast('Tabla de precios guardada'); render();
}
async function deleteWholesaleTier(id){
  if(!confirm('¿Eliminar esta tabla de precios de mayoreo?')) return;
  const backup = state.settings.wholesaleTiers;
  const updated = backup.filter(x=>x.id!==id);
  try{
    await db.collection('settings').doc('store').update({wholesaleTiers: updated});
    state.settings.wholesaleTiers = updated;
    showToast('Eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }
}
async function toggleWholesaleActive(id){
  const t = state.settings.wholesaleTiers.find(x=>x.id===id); if(!t) return;
  t.active = !t.active; await saveSettings(); render();
}
function wholesaleLink(code){
  return `${location.origin}${location.pathname.replace(/admin\.html$/,'')}index.html?mayoreo=${code}`;
}
function copyWholesaleLink(code){
  navigator.clipboard.writeText(wholesaleLink(code)).then(()=>showToast('Enlace copiado')).catch(()=>showToast('No se pudo copiar, cópialo manualmente'));
}

function couponUsedCount(code){ return state.couponUsage.filter(u=>u.code===code).length; }
function couponStatusLabel(c){
  if(!c.active) return {text:'Desactivado', color:'#8a6b78'};
  const now = new Date();
  if(c.startDate && now < new Date(c.startDate)) return {text:'Programado', color:'var(--amber)'};
  if(c.endDate && now > new Date(c.endDate+'T23:59:59')) return {text:'Vencido', color:'#8a6b78'};
  if(c.maxUses>0 && couponUsedCount(c.code)>=c.maxUses) return {text:'Agotado', color:'#8a6b78'};
  return {text:'Activado', color:'var(--green)'};
}

/* ============== PROMOCIONES ============== */
const PROMO_TYPES = {
  buyxpayy: 'Lleva X y paga Y (2x1, 3x2, etc.)',
  progressive: 'Descuento progresivo por cantidad',
  cart_discount: 'Descuento automático en el carrito',
  gift: 'Regalo automático en el carrito',
  cross_sell: 'Cross selling (descuento al comprar dos productos juntos)',
};
function openPromoModal(id){
  const p = id ? JSON.parse(JSON.stringify(state.settings.promotions.find(x=>x.id===id))) : {
    id: uid('pr_'), name:'', type:'buyxpayy', scope:'all', categories:[], productIds:[],
    startDate:'', endDate:'', active:true,
    buyQty:3, payQty:2,
    tiers:[{minQty:3, discountPercent:10},{minQty:5, discountPercent:15}],
    discountPercent:10, minAmount:0,
    giftProductId:'',
    triggerProductId:'', discountProductId:'',
  };
  state.promoModal = p; state.promoProductSearch=''; state.promoProductSearch2=''; render();
}
function closePromoModal(){ state.promoModal=null; render(); }
function togglePromoCategory(cat, checked){
  const p = state.promoModal;
  if(checked){ if(!p.categories.includes(cat)) p.categories.push(cat); }
  else{ p.categories = p.categories.filter(c=>c!==cat); }
}
function togglePromoProduct(pid, checked){
  const p = state.promoModal;
  if(checked){ if(!p.productIds.includes(pid)) p.productIds.push(pid); }
  else{ p.productIds = p.productIds.filter(id=>id!==pid); }
}
function addPromoTier(){ state.promoModal.tiers.push({minQty:0, discountPercent:0}); render(); }
function removePromoTier(idx){ state.promoModal.tiers.splice(idx,1); render(); }
function setPromoTier(idx, field, value){ state.promoModal.tiers[idx][field] = Number(value)||0; }
async function savePromotion(){
  const p = state.promoModal;
  const name = document.getElementById('pr-name').value.trim();
  const type = document.getElementById('pr-type').value;
  const startDate = document.getElementById('pr-start').value;
  const endDate = document.getElementById('pr-end').value;
  if(!name){ showToast('Ponle un nombre a la promoción'); return; }
  let updated = {...p, name, type, startDate, endDate};
  if(type==='all_scope_needed_placeholder'){} // no-op, kept for clarity
  if(['buyxpayy','progressive','cart_discount'].includes(type)){
    updated.scope = document.getElementById('pr-scope').value;
  }
  if(type==='buyxpayy'){
    updated.buyQty = Number(document.getElementById('pr-buyqty').value)||1;
    updated.payQty = Number(document.getElementById('pr-payqty').value)||1;
    if(updated.payQty >= updated.buyQty){ showToast('"Pagas" debe ser menor que "Llevas"'); return; }
  }
  if(type==='cart_discount'){
    updated.discountPercent = Number(document.getElementById('pr-discount').value)||0;
    updated.minAmount = Number(document.getElementById('pr-minamount').value)||0;
  }
  if(type==='gift'){
    updated.minAmount = Number(document.getElementById('pr-gift-minamount').value)||0;
    if(!updated.giftProductId){ showToast('Elige el producto de regalo'); return; }
  }
  if(type==='cross_sell'){
    updated.discountPercent = Number(document.getElementById('pr-cross-discount').value)||0;
    if(!updated.triggerProductId || !updated.discountProductId){ showToast('Elige los dos productos'); return; }
  }
  const idx = state.settings.promotions.findIndex(x=>x.id===p.id);
  if(idx>=0) state.settings.promotions[idx] = updated;
  else state.settings.promotions.push(updated);
  await saveSettings();
  state.promoModal=null; showToast('Promoción guardada'); render();
}
async function deletePromotion(id){
  if(!confirm('¿Eliminar esta promoción?')) return;
  const updated = state.settings.promotions.filter(x=>x.id!==id);
  try{
    await db.collection('settings').doc('store').update({promotions: updated});
    state.settings.promotions = updated;
    showToast('Eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }
}
async function togglePromoActive(id){
  const p = state.settings.promotions.find(x=>x.id===id); if(!p) return;
  p.active = !p.active; await saveSettings(); render();
}
function promoSummary(p){
  if(p.type==='buyxpayy') return `Lleva ${p.buyQty} y paga ${p.payQty}`;
  if(p.type==='progressive') return (p.tiers||[]).map(t=>`${t.minQty}+: ${t.discountPercent}%`).join(' · ');
  if(p.type==='cart_discount') return `${p.discountPercent}% de descuento${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`;
  if(p.type==='gift'){ const g = state.products.find(x=>x.id===p.giftProductId); return `Regalo: ${g?g.name:'—'}${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`; }
  if(p.type==='cross_sell'){ const a=state.products.find(x=>x.id===p.triggerProductId), b=state.products.find(x=>x.id===p.discountProductId); return `${a?a.name:'—'} + ${b?b.name:'—'}: ${p.discountPercent}% en el segundo`; }
  return '';
}
function renderPromociones(){
  const promos = state.settings.promotions||[];
  return `
    <div class="note-box">Crea promociones automáticas — se aplican solas cuando el cliente cumple la condición, sin necesidad de código. (Para descuentos que necesitan un código, ve a la pestaña Cupones. Para el precio tachado de un producto individual, edítalo directo en Productos.)</div>
    <button class="btn-add-new" style="margin-bottom:14px;" onclick="openPromoModal(null)">+ Nueva promoción</button>
    ${promos.length===0 ? `<div class="empty-state">Aún no has creado ninguna promoción.</div>` :
      promos.map(p=>`
        <div class="list-row" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="row-title">${p.name} <span class="status-badge" style="background:${p.active?'var(--green)':'#8a6b78'};">${p.active?'Activa':'Inactiva'}</span></div>
            <div class="row-actions">
              <button class="icon-btn" onclick="togglePromoActive('${p.id}')">${p.active?'⏸':'▶'}</button>
              <button class="icon-btn" onclick="openPromoModal('${p.id}')">${icon('edit')}</button>
              <button class="icon-btn danger" onclick="deletePromotion('${p.id}')">${icon('trash')}</button>
            </div>
          </div>
          <div class="row-sub">${PROMO_TYPES[p.type]}</div>
          <div class="row-sub">${promoSummary(p)}</div>
        </div>
      `).join('')}
    ${state.promoModal ? renderPromoModal() : ''}
  `;
}
function renderPromoScopePicker(p){
  const q = (state.promoProductSearch||'').trim().toLowerCase();
  const candidates = q ? state.products.filter(x=>(x.name||'').toLowerCase().includes(q)).slice(0,15) : [];
  return `
    <div class="form-field"><label>¿A qué productos aplica?</label>
      <select id="pr-scope" onchange="state.promoModal.scope=this.value;render()">
        <option value="all" ${p.scope==='all'?'selected':''}>Toda la tienda</option>
        <option value="categories" ${p.scope==='categories'?'selected':''}>Categorías específicas</option>
        <option value="products" ${p.scope==='products'?'selected':''}>Productos específicos</option>
      </select>
    </div>
    ${p.scope==='categories' ? `
      <div class="form-field"><label>Categorías incluidas</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px;">
          ${state.settings.categories.map(c=>`
            <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--surface-soft);padding:6px 9px;border-radius:7px;cursor:pointer;">
              <input type="checkbox" value="${c}" ${(p.categories||[]).includes(c)?'checked':''} onchange="togglePromoCategory('${c.replace(/'/g,"\\'")}',this.checked)">
              ${c}
            </label>`).join('')}
        </div>
      </div>
    ` : ''}
    ${p.scope==='products' ? `
      <div class="form-field"><label>Buscar productos</label>
        <input id="promo-product-search-input" placeholder="Nombre del producto..." value="${state.promoProductSearch}" oninput="state.promoProductSearch=this.value;render()">
      </div>
      ${candidates.length>0 ? `
        <div style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;">
          ${candidates.map(pr=>`
            <label class="list-row" style="margin:0;border-radius:0;border-left:none;border-right:none;border-top:none;cursor:pointer;">
              <input type="checkbox" ${(p.productIds||[]).includes(pr.id)?'checked':''} onchange="togglePromoProduct('${pr.id}',this.checked)">
              <div class="row-main"><div class="row-title" style="font-size:13px;">${pr.name}</div></div>
            </label>`).join('')}
        </div>
      ` : ''}
      <div class="panel-sub">${(p.productIds||[]).length} producto(s) seleccionado(s).</div>
    ` : ''}
  `;
}

      <div class="form-field"><label>Tipo de descuento</label>
        <select id="pr-type" onchange="state.promoModal.type=this.value;render()">

        ${(state.promoProductSearch||'').trim() ? `
          <div style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;">
            ${state.products.filter(x=>(x.name||'').toLowerCase().includes(state.promoProductSearch.trim().toLowerCase())).slice(0,15).map(pr=>`
              <label class="list-row" style="margin:0;border-radius:0;border-left:none;border-right:none;border-top:none;cursor:pointer;">

        <div class="form-field"><label>Descuento (%) sobre el segundo producto</label><input id="pr-cross-discount" type="number" value="${p.discountPercent}" oninput="state.promoModal.discountPercent=this.value"></div>

      </div>
    </div>
  </div>`;
}

/* ============== CAJA (aperturas/cierres del Punto de Venta) ============== */
function renderCaja(){
  const regs = state.cashRegisters;
  const centerNames = ['Todos', ...state.centers.map(c=>c.name)];
  let filtered = regs;
  if(state.cajaFilter==='abiertas') filtered = filtered.filter(r=>r.status==='abierta');
  else if(state.cajaFilter==='cerradas') filtered = filtered.filter(r=>r.status==='cerrada');
  if(state.cajaCenterFilter!=='Todos') filtered = filtered.filter(r=>r.centerName===state.cajaCenterFilter);
  const abiertas = regs.filter(r=>r.status==='abierta').length;
  const cerradas = regs.filter(r=>r.status==='cerrada');
  const conDiferencia = cerradas.filter(r=>Math.abs(r.difference||0)>0).length;
  return `
  <div class="panel">
    <div class="panel-title">Cortes de caja</div>
    <div class="panel-sub">Aperturas y cierres del Punto de Venta, por cajero y centro de distribución.</div>
    <div class="stat-grid" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Cajas abiertas ahora</div><div class="stat-value">${abiertas}</div></div>
      <div class="stat-card"><div class="stat-label">Cortes registrados</div><div class="stat-value">${regs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Cortes con diferencia</div><div class="stat-value">${conDiferencia}</div></div>
    </div>
    <div class="toolbar" style="align-items:center;">
      <div class="status-filter" style="margin-bottom:0;">
        ${[['todas','Todas'],['abiertas','Abiertas'],['cerradas','Cerradas']].map(([k,label])=>`<button class="${state.cajaFilter===k?'active':''}" onclick="state.cajaFilter='${k}';render()">${label}</button>`).join('')}
      </div>
      <select onchange="state.cajaCenterFilter=this.value;render()" style="padding:9px 12px;border-radius:10px;border:1px solid var(--border);font-size:12.5px;background:var(--bg);">
        ${centerNames.map(c=>`<option value="${c}" ${state.cajaCenterFilter===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    ${filtered.length===0 ? `<div class="empty-state">No hay cortes de caja con ese filtro.</div>` : filtered.map(r=>`
      <div class="list-row" style="cursor:pointer;" onclick="state.cajaDetail='${r.id}';render()">
        <div class="row-main">
          <div class="row-title">${r.cashierName} · ${r.centerName}</div>
          <div class="row-sub">Apertura: ${new Date(r.openedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${r.closedAt?` · Cierre: ${new Date(r.closedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`:''}</div>
          ${r.status==='cerrada' ? `<div class="row-sub">Ventas: ${money(r.totalSales||0)} · <strong style="color:${(r.difference||0)===0?'var(--green)':((r.difference||0)>0?'var(--amber)':'var(--rose)')}">${cashDiffLabel(r.difference)}</strong></div>` : `<div class="row-sub">Fondo inicial: ${money(r.openingAmount||0)}</div>`}
        </div>
        <span class="status-badge" style="background:${r.status==='abierta'?'var(--teal)':'var(--green)'}">${r.status==='abierta'?'Abierta':'Cerrada'}</span>
      </div>
    `).join('')}
  </div>
  ${state.cajaDetail ? renderCajaDetailModal() : ''}
  `;
}

  if(!r) return '';
  const movs = r.movements||[];
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:480px;">
      <h3>${r.cashierName} · ${r.centerName}</h3>
      <div class="panel-sub" style="margin:-8px 0 14px;">Apertura: ${new Date(r.openedAt).toLocaleString('es-MX',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div class="order-detail" style="margin-bottom:14px;">
        <div><span>Fondo inicial</span><span>${money(r.openingAmount||0)}</span></div>
        ${r.status==='cerrada' ? `
          ${Object.keys(r.salesByPayment||{}).map(m=>`<div><span>Ventas en ${m}</span><span>${money(r.salesByPayment[m])}</span></div>`).join('')}
          <div><span>Total de ventas</span><span>${money(r.totalSales||0)}</span></div>
          <div><span>Ingresos de caja</span><span>${money(r.cashIngresos||0)}</span></div>
          <div><span>Retiros de caja</span><span>-${money(r.cashRetiros||0)}</span></div>
          <div><span>Efectivo esperado</span><span>${money(r.expectedCash||0)}</span></div>
          <div><span>Efectivo contado</span><span>${money(r.countedCash||0)}</span></div>
          <div style="font-weight:800;"><span>Diferencia</span><span style="color:${(r.difference||0)===0?'var(--green)':((r.difference||0)>0?'var(--amber)':'var(--rose)')}">${cashDiffLabel(r.difference)}</span></div>
          ${r.closingNotes?`<div><span>Notas</span><span style="text-align:right;">${r.closingNotes}</span></div>`:''}
        ` : `<div style="color:var(--ink-soft);padding-top:4px;">Esta caja sigue abierta.</div>`}
      </div>
      ${movs.length ? `
        <div class="row-title" style="margin-bottom:8px;">Movimientos (${movs.length})</div>
        <div style="max-height:150px;overflow-y:auto;margin-bottom:14px;">
          ${movs.map(m=>`<div class="order-detail" style="margin-bottom:6px;"><div><span>${m.type==='retiro'?icon('arrow-down')+' Retiro':icon('arrow-up')+' Ingreso'}${m.note?` — ${m.note}`:''}</span><span>${m.type==='retiro'?'-':''}${money(m.amount)}</span></div></div>`).join('')}
        </div>` : ''}
      ${r.status==='abierta' ? `<button class="btn-primary" style="background:#BC355C;margin-bottom:14px;" onclick="adminForceCloseCash('${r.id}')">Cerrar caja manualmente</button>` : ''}
      <div class="modal-actions"><button class="btn-cancel" onclick="state.cajaDetail=null;render()">Cerrar</button></div>
    </div>
  </div>`;
}
async function adminForceCloseCash(id){
  const r = state.cashRegisters.find(x=>x.id===id); if(!r) return;
  if(!confirm(`¿Cerrar manualmente la caja de ${r.cashierName} en ${r.centerName}?\n\nÚsalo solo si el cajero no pudo cerrarla desde el Punto de Venta (por ejemplo, olvidó hacerlo o el dispositivo se perdió).`)) return;
  try{
    const snap = await db.collection('sales').where('cashRegisterId','==', id).get();
    const sales = snap.docs.map(d=>d.data());
    const byPayment = {};
    sales.forEach(s=>{
      salePayments(s).forEach(pm=>{
        const m = pm.method||'Efectivo';
        byPayment[m]=(byPayment[m]||0)+(pm.amount||0);
      });
    });
    const total = sales.reduce((s,x)=>s+(x.total||0),0);
    const movs = r.movements||[];
    const ingresos = movs.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.amount,0);
    const retiros = movs.filter(m=>m.type==='retiro').reduce((s,m)=>s+m.amount,0);
    const expectedCash = (r.openingAmount||0) + (byPayment['Efectivo']||0) + ingresos - retiros;
    const countedInput = prompt(`Efectivo esperado: ${money(expectedCash)}\n\nEscribe el efectivo contado físicamente (o deja este mismo número si no se pudo contar):`, String(Math.round(expectedCash)));
    if(countedInput===null) return;
    const counted = Number(countedInput);
    if(isNaN(counted) || counted<0){ showToast('Monto inválido, no se cerró la caja'); return; }
    const payload = {
      status:'cerrada', closedAt: new Date().toISOString(),
      salesCount: sales.length, totalSales: total, salesByPayment: byPayment,
      cashIngresos: ingresos, cashRetiros: retiros,
      expectedCash, countedCash: counted, difference: counted-expectedCash,
      closingNotes: 'Cerrada manualmente desde el panel de administración.',
    };
    await db.collection('cashRegisters').doc(id).update(payload);
    Object.assign(r, payload);
    showToast('Caja cerrada'); render();
  }catch(e){ console.error(e); showToast('No se pudo cerrar la caja'); }
}

function setAuditCount(pid, value){
  const v = value.trim();
  if(v===''){ delete state.auditCounts[pid]; }
  else{ state.auditCounts[pid] = Math.max(0, Number(v)||0); }
}
function auditDiffRows(){
  if(!state.auditCenter) return [];
  return Object.entries(state.auditCounts).map(([pid,counted])=>{
    const p = state.products.find(x=>x.id===pid);
    if(!p) return null;
    const system = centerStock(p, state.auditCenter);
    return {pid, name:p.name, system, counted, diff: counted - system};
  }).filter(Boolean);
}
async function commitAudit(applyAdjustment){
  if(!state.auditCenter){ showToast('Elige el centro que estás auditando'); return; }
  const rows = auditDiffRows();
  if(rows.length===0){ showToast('Cuenta al menos un producto antes de guardar'); return; }
  const center = state.centers.find(c=>c.id===state.auditCenter);
  const auditDoc = {
    date: new Date().toISOString(), centerId: state.auditCenter, centerName: center.name,
    items: rows.map(r=>({productId:r.pid, name:r.name, systemQty:r.system, countedQty:r.counted, diff:r.diff})),
    notes: state.auditNotes.trim(), applied: applyAdjustment,
  };
  try{
    const ref = db.collection('audits').doc();
    if(applyAdjustment){
      const batch = db.batch();
      rows.forEach(r=>{
        const p = state.products.find(x=>x.id===r.pid);
        if(!p) return;
        if(!p.stockByCenter) p.stockByCenter = {};
        p.stockByCenter[state.auditCenter] = r.counted;
        p.stock = totalStock(p);
        batch.update(db.collection('products').doc(r.pid), {stockByCenter:p.stockByCenter, stock:p.stock});
      });
      batch.set(ref, auditDoc);
      await batch.commit();
    }else{
      await ref.set(auditDoc);
    }
    state.audits.unshift({id:ref.id, ...auditDoc});
    state.auditCounts = {}; state.auditNotes=''; state.auditSearch='';
    showToast(applyAdjustment ? 'Auditoría guardada y inventario ajustado' : 'Auditoría guardada'); render();
  }catch(e){ console.error(e); showToast('No se pudo guardar la auditoría'); }
}

      <button class="visibility-toggle ${s.visible?'on':'off'}" onclick="toggleSectionVisible(${idx})">${s.visible?'Visible':'Oculta'}</button>
    </div>`;
}
function toggleSectionVisible(idx){
  state.settings.sections[idx].visible = !state.settings.sections[idx].visible;
  saveSettings(); render();
}
function moveSection(idx, dir){
  const arr = state.settings.sections; const j = idx+dir;
  if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  saveSettings(); render();
}
function sectionDragStart(e, idx){ sectionDragIdx = idx; }
function sectionDrop(e, idx){
  e.preventDefault();
  if(sectionDragIdx===null || sectionDragIdx===idx) return;
  const arr = state.settings.sections;
  const [moved] = arr.splice(sectionDragIdx,1);
  arr.splice(idx,0,moved);
  sectionDragIdx = null;
  saveSettings(); render();
}

/* ============== APARIENCIA (colores, tipografía, estilo) ==============
   Esto es lo que hace que "Diseño" tenga efecto real en la tienda: guarda valores concretos

   de inmediato sobre las variables CSS de la tienda (ver applyThemeVars() ahí). No se necesita
   saber CSS — se elige una paleta/tipografía lista, o se personalizan los colores con un
   selector de color normal. */
function renderAppearanceSubpanel(){
  const t = state.settings.theme || {};
  const activePalette = THEME_PALETTES.find(p=> p.primary===t.primary && p.primaryDeep===t.primaryDeep && p.rose===t.rose && p.amber===t.amber);
  const activeFont = THEME_FONTS.find(f=> f.heading===t.fontHeading && f.body===t.fontBody) || THEME_FONTS[0];
  const radius = t.radius || 'redondeado';
  return `
  <div class="panel">
    <div class="panel-title">Paleta de colores</div>
    <div class="panel-sub">Elige una combinación lista para usar. Se aplica de inmediato en tu tienda, sin necesidad de nada más.</div>
    <div class="theme-palette-grid">
      ${THEME_PALETTES.map(p=>`
        <button class="theme-palette-swatch ${activePalette && activePalette.key===p.key ? 'active':''}" onclick="applyThemePalette('${p.key}')" title="${p.label}">
          <span class="swatch-dots"><span style="background:${p.primaryDeep}"></span><span style="background:${p.primary}"></span><span style="background:${p.rose}"></span><span style="background:${p.amber}"></span></span>
          <span class="swatch-label">${p.label}</span>
        </button>
      `).join('')}
    </div>
    <div class="panel-title" style="margin-top:22px;">Colores personalizados</div>
    <div class="panel-sub">Si ninguna paleta es exactamente lo que buscas, define tus propios colores de marca.</div>
    <div class="two-col">
      <div class="form-field"><label>Color principal (botones, precios)</label><input type="color" id="theme-primary" value="${t.primary||'#993477'}"></div>
      <div class="form-field"><label>Color oscuro (fondo del encabezado)</label><input type="color" id="theme-primary-deep" value="${t.primaryDeep||'#5C1F49'}"></div>
    </div>
    <div class="two-col">
      <div class="form-field"><label>Color de acento (promociones)</label><input type="color" id="theme-rose" value="${t.rose||'#BC355C'}"></div>
      <div class="form-field"><label>Color secundario (detalles)</label><input type="color" id="theme-amber" value="${t.amber||'#F6A030'}"></div>
    </div>
    <button class="btn-outline" onclick="saveCustomThemeColors()">Aplicar colores personalizados</button>

    <div class="panel-title" style="margin-top:26px;">Tipografía</div>
    <div class="panel-sub">La combinación de letra para títulos y para el texto de tu tienda.</div>
    ${THEME_FONTS.map(f=>`
      <div class="font-option-row ${activeFont.key===f.key?'active':''}" onclick="applyThemeFont('${f.key}')">
        <div>
          <div style="font-family:${f.heading};font-size:17px;font-weight:700;">${f.label}</div>
          <div style="font-family:${f.body};font-size:12px;color:var(--ink-soft);margin-top:2px;">Así se ve el texto normal de tu tienda.</div>
        </div>
        ${activeFont.key===f.key?icon('check'):''}
      </div>
    `).join('')}

    <div class="panel-title" style="margin-top:26px;">Estilo de bordes</div>
    <div class="panel-sub">Redondeado se ve más suave/amigable; cuadrado se ve más serio/minimalista.</div>
    <div class="status-filter">
      <button class="${radius==='redondeado'?'active':''}" onclick="applyThemeRadius('redondeado')">Redondeado</button>
      <button class="${radius==='cuadrado'?'active':''}" onclick="applyThemeRadius('cuadrado')">Cuadrado</button>
    </div>

    <button class="btn-tertiary" style="margin-top:24px;" onclick="resetTheme()">Restablecer apariencia original</button>
  </div>`;
}
function saveTheme(patch){
  state.settings.theme = {...(state.settings.theme||{}), ...patch};
  saveSettings(); showToast('Apariencia actualizada'); render();
}
function applyThemePalette(key){
  const p = THEME_PALETTES.find(x=>x.key===key); if(!p) return;
  saveTheme({primary:p.primary, primaryDeep:p.primaryDeep, rose:p.rose, amber:p.amber});
}
function saveCustomThemeColors(){
  saveTheme({
    primary: document.getElementById('theme-primary').value,
    primaryDeep: document.getElementById('theme-primary-deep').value,
    rose: document.getElementById('theme-rose').value,
    amber: document.getElementById('theme-amber').value,
  });
}
function applyThemeFont(key){
  const f = THEME_FONTS.find(x=>x.key===key); if(!f) return;
  saveTheme({fontHeading:f.heading, fontBody:f.body});
}
function applyThemeRadius(style){ saveTheme({radius:style}); }
function resetTheme(){
  if(!confirm('¿Restablecer colores, tipografía y estilo a los originales de la tienda?')) return;
  state.settings.theme = {};
  saveSettings(); showToast('Apariencia restablecida'); render();
}
