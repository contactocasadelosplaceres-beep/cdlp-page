  }
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;border:none;} select,input,textarea{font-family:inherit;}
  .app{max-width:1100px;margin:0 auto;min-height:100vh;}
  .admin-top{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .admin-top .brand-name{font-size:16px;font-weight:700;font-family:'League Spartan',sans-serif;}
  .admin-top .brand-sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .logout-link{font-size:12px;background:rgba(255,255,255,0.14);padding:8px 13px;border-radius:var(--radius-pill);color:#fff;font-weight:600;}
  .admin-tabs{display:flex;gap:4px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;}
  .admin-tab{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .admin-tab.active{background:var(--surface-soft);color:var(--primary-deep);}
  .admin-body{padding:20px 20px 60px;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
  @media(min-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:960px){.stat-grid{grid-template-columns:repeat(6,1fr);}}
  .stat-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;line-height:1.3;font-weight:600;}
  .stat-value{font-size:21px;font-weight:800;font-family:'League Spartan',sans-serif;color:var(--primary-deep);}
  .stat-delta{font-size:11px;margin-top:4px;font-weight:700;}
  .stat-delta.up{color:var(--green);}
  .stat-delta.down{color:var(--rose);}

  .panel{border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:20px;background:#fff;}
  .panel-title{font-size:14.5px;font-weight:700;color:var(--primary-deep);margin-bottom:14px;font-family:'League Spartan',sans-serif;}
  .panel-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:14px;}

  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;overflow-x:auto;}
  .bar-col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-val{font-size:10px;color:var(--ink-soft);margin-bottom:4px;font-weight:700;white-space:nowrap;}
  .bar-fill{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--primary);min-height:3px;transition:height .3s ease;}
  .bar-label{font-size:9.5px;color:var(--ink-soft);margin-top:6px;text-align:center;line-height:1.2;}

  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .hbar-label{width:110px;flex-shrink:0;font-size:12px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{flex:1;height:16px;background:var(--surface-soft);border-radius:8px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:8px;}
  .hbar-val{width:60px;text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:700;flex-shrink:0;}

  .list-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff;}
  .row-swatch{width:44px;height:44px;border-radius:9px;flex-shrink:0;object-fit:cover;}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:13.5px;font-weight:700;}
  .row-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:30px;height:30px;border-radius:8px;background:var(--surface-soft);color:var(--primary-deep);font-size:13px;display:flex;align-items:center;justify-content:center;}
  .icon-btn.danger{background:#FBE2E6;color:var(--rose);}
  .status-badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);color:#fff;flex-shrink:0;}
  .rank-num{width:22px;height:22px;border-radius:50%;background:var(--surface-soft);color:var(--primary-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .btn-add-new{background:var(--primary);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:700;}
  .btn-outline{background:#fff;border:1px solid var(--primary);color:var(--primary);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:700;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input,.form-field textarea,.form-field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;background:var(--bg);color:var(--ink);}
  .form-field textarea{resize:vertical;min-height:60px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .note-box{background:var(--surface-soft);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .btn-primary{background:var(--rose);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:700;}

  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px;border-radius:10px;font-size:13.5px;font-weight:700;}
  .btn-cancel{background:var(--surface-soft);color:var(--ink-soft);}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--primary-deep);padding:20px;}
  .login-card{background:#fff;border-radius:18px;padding:30px 26px;max-width:340px;width:100%;text-align:center;}
  .login-card h2{color:var(--primary-deep);font-size:19px;margin-bottom:6px;font-weight:700;}
  .login-card p{color:var(--ink-soft);font-size:12.5px;margin-bottom:18px;}
  .login-card input{width:100%;font-size:14px;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px;}

  .order-date-main{font-weight:600;}
  .order-date-sub{font-size:11px;color:var(--ink-soft);}
  .order-source-tag{font-size:11px;color:var(--ink-soft);white-space:nowrap;}

  .order-actions-menu button:hover{background:var(--surface-soft);}
  .order-actions-menu button.active-status{color:var(--primary-deep);font-weight:800;}
  .order-actions-menu hr{border:none;border-top:1px solid var(--border);margin:5px 0;}
  .order-actions-overlay{position:fixed;inset:0;z-index:19;}
  .products-detail-row td{background:var(--bg);padding:10px 14px;white-space:normal;}
  .products-detail-row .pd-line{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .products-detail-row .pd-extra{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:3px 0;border-top:1px dashed var(--border);margin-top:4px;}

  .status-filter button.active{background:var(--primary);color:#fff;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-deep);color:#fff;padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-family:'League Spartan',sans-serif;}
  .cat-manage-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-soft);color:var(--primary-deep);padding:6px 8px 6px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;margin:0 6px 8px 0;}
  .cat-manage-chip button{background:none;color:var(--rose);font-size:14px;line-height:1;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}

  .preview-count{font-size:12.5px;color:var(--primary-deep);font-weight:700;margin-bottom:10px;}

  .img-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .img-thumb{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .img-thumb img{width:100%;height:100%;object-fit:cover;}
  .img-thumb-actions{position:absolute;inset:0;background:rgba(43,22,32,0.55);opacity:0;display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .15s ease;}
  .img-thumb:active .img-thumb-actions, .img-thumb:hover .img-thumb-actions{opacity:1;}
  .img-thumb-actions button{width:20px;height:20px;border-radius:5px;background:#fff;color:var(--primary-deep);font-size:11px;display:flex;align-items:center;justify-content:center;}
  .add-thumb{display:flex;align-items:center;justify-content:center;background:var(--surface-soft);color:var(--primary-deep);font-size:22px;cursor:pointer;}
  .crop-box{width:280px;height:280px;max-width:100%;margin:0 auto;overflow:hidden;position:relative;border-radius:12px;background:#000;touch-action:none;cursor:grab;}
  #crop-img{position:absolute;top:0;left:0;user-select:none;pointer-events:none;}

  .section-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff;}
  .section-row.dragging{opacity:0.4;}
  .drag-handle{color:var(--ink-soft);font-size:15px;letter-spacing:-2px;cursor:grab;flex-shrink:0;user-select:none;padding:4px;}
  .section-name{flex:1;font-size:13.5px;font-weight:600;color:var(--ink);}
  .section-name.hidden-section{color:var(--ink-soft);}
  .section-arrows{display:flex;gap:3px;flex-shrink:0;}
  .arrow-btn{width:24px;height:24px;border-radius:6px;background:var(--surface-soft);color:var(--primary-deep);font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .visibility-toggle{flex-shrink:0;padding:6px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;white-space:nowrap;}
  .visibility-toggle.on{background:var(--surface-soft);color:var(--primary-deep);}
  .visibility-toggle.off{background:#f1f1f1;color:#9a9a9a;}
  .subpanel-item{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;}
  .subpanel-item:last-child{border-bottom:none;}
  .subpanel-item .chev{color:var(--ink-soft);font-size:15px;}
  .subpanel-back{display:inline-flex;align-items:center;gap:4px;background:none;color:var(--primary-deep);font-weight:700;font-size:13.5px;margin-bottom:14px;padding:4px 0;}
  .checkbox-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .checkbox-row input{width:16px;height:16px;flex-shrink:0;}
</style>

      const oldDoc = await db.collection('catalog').doc('products').get();
      const batch = db.batch();
      const seed = (oldDoc.exists && (oldDoc.data().items||[]).length) ? oldDoc.data().items : DEFAULT_PRODUCTS;
      seed.forEach(it=>{
        const ref = db.collection('products').doc();
        batch.set(ref, {name:it.name, cat:it.cat, price:it.price, stock:it.stock, desc:it.desc||'', images: it.images||[]});
      });
      await batch.commit();
      prodSnap = await db.collection('products').get();
    }
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()}));

    const [setSnap, ordersSnap, salesSnap, visitsSnap, cashiersSnap, aiSnap, centersSnap, transfersSnap, auditsSnap, customersSnap, couponUsageSnap] = await Promise.all([
      db.collection('settings').doc('store').get(),
      db.collection('orders').orderBy('date','desc').get(),
      db.collection('sales').orderBy('date','desc').get(),
      db.collection('visits').orderBy('date','desc').limit(3000).get(),
      db.collection('cashiers').get(),
      db.collection('settings').doc('ai').get(),
      db.collection('distributionCenters').get(),
      db.collection('transfers').orderBy('date','desc').limit(200).get(),
      db.collection('audits').orderBy('date','desc').limit(100).get(),
      db.collection('customers').get(),
      db.collection('couponUsage').get(),
    ]);
    let needsSeedSettings = !setSnap.exists;
    state.settings = needsSeedSettings ? {...DEFAULT_SETTINGS} : {...DEFAULT_SETTINGS, ...setSnap.data()};
    if(!state.settings.categories || !state.settings.categories.length) state.settings.categories = [...DEFAULT_CATEGORIES];
    if(!state.settings.sections || !state.settings.sections.length) state.settings.sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
    if(!state.settings.promoBanner) state.settings.promoBanner = {title:"",text:"",image:"",buttonText:"",buttonLink:""};
    if(!state.settings.featuredProductIds) state.settings.featuredProductIds = [];
    if(!state.settings.testimonials) state.settings.testimonials = [];
    if(!state.settings.wholesaleTiers) state.settings.wholesaleTiers = [];
    if(!state.settings.coupons) state.settings.coupons = [];
    if(!state.settings.promotions) state.settings.promotions = [];
    // unen en una sola lista, ordenada por fecha, para verlos juntos en "Pedidos".
    const tiendaOrders = ordersSnap.docs.map(d=>({id:d.id, source:'tienda', archived:false, ...d.data()}));
    const posOrders = salesSnap.docs.map(d=>({
      id:d.id, source:'pos', archived:false, status:'Entregado',
      customer:'Venta en tienda física', ...d.data(),
    }));
    state.orders = [...tiendaOrders, ...posOrders].sort((a,b)=> new Date(b.date) - new Date(a.date));
    state.visits = visitsSnap.docs.map(d=>d.data());
    state.cashiers = cashiersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.aiSettings = aiSnap.exists ? {...DEFAULT_AI_SETTINGS, ...aiSnap.data()} : {...DEFAULT_AI_SETTINGS};
    if(needsSeedSettings) await saveSettings();

    // Centros de distribución: si no existe ninguno, se crea "Principal" automáticamente.
    state.centers = centersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.centers.length===0){
      const ref = await db.collection('distributionCenters').add({name:'Principal', isDefault:true, active:true, createdAt:new Date().toISOString()});
      state.centers = [{id:ref.id, name:'Principal', isDefault:true, active:true}];
    }
    state.transfers = transfersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.audits = auditsSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.customers = customersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.couponUsage = couponUsageSnap.docs.map(d=>d.data());

    // Migración automática: cualquier producto que todavía no tenga inventario
    // repartido por centro, se le asigna TODO su stock actual al centro Principal.
    const principal = state.centers.find(c=>c.isDefault) || state.centers[0];
    const migrationBatch = db.batch();
    let needsMigration = false;
    state.products.forEach(p=>{
      if(!p.stockByCenter){
        p.stockByCenter = { [principal.id]: p.stock||0 };
        migrationBatch.update(db.collection('products').doc(p.id), {stockByCenter: p.stockByCenter});
        needsMigration = true;
      }
    });
    if(needsMigration){ try{ await migrationBatch.commit(); }catch(e){ console.error('No se pudo migrar el inventario a centros', e); } }
  }catch(e){
    console.error(e);
    state.products = []; state.orders = []; state.visits = []; state.cashiers = []; state.settings = {...DEFAULT_SETTINGS};
    state.centers = []; state.transfers = []; state.audits = []; state.customers = []; state.couponUsage = [];
    showToast('No se pudo cargar todo desde el servidor');
  }
  state.loaded = true; render();
}

async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}

  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update({orderNumber});
    const o = state.orders.find(x=>x.id===id); if(o) o.orderNumber = orderNumber;
    showToast(`Folio ${formatFolio(orderNumber)} asignado`); render();
  }catch(e){ console.error(e); showToast('No se pudo asignar el folio'); }
}

async function saveProduct(p){
  const newCats = (p.categories||[p.cat]).filter(c=>c && !state.settings.categories.includes(c));
  if(newCats.length){ state.settings.categories.push(...newCats); await saveSettings(); }
  const payload = {
    name:p.name, sku:p.sku||'', cat:p.cat, categories:p.categories||[p.cat],
    price:p.price, promoPrice:p.promoPrice||0, cost:p.cost||0,
    stock:p.stock, desc:p.desc, images:p.images||[], needs:p.needs||[],
    stockByCenter:p.stockByCenter||{}, hidden: !!p.hidden,
    variantGroups: p.variantGroups||[], variants: p.variants||[],
  };
  try{
    if(p.id){
      await db.collection('products').doc(p.id).set(payload);
      const idx = state.products.findIndex(x=>x.id===p.id); state.products[idx] = {id:p.id, ...payload};
    }else{
      const ref = await db.collection('products').add(payload);
      state.products.push({id:ref.id, ...payload});
    }
  }catch(e){ console.error(e); showToast('No se pudo guardar (revisa el tamaño de las imágenes)'); return; }
  state.productModal=null; showToast('Producto guardado'); render();
}
async function regenerateAllSKUs(){
  showToast('Generando SKU nuevos para todos, un momento...');
  const usedSkus = new Set();
  const batch = db.batch();
  state.products.forEach(p=>{
    let sku;
    do{ sku = generateSKU(p); }while(usedSkus.has(sku));
    usedSkus.add(sku);
    p.sku = sku;
    batch.update(db.collection('products').doc(p.id), {sku});
  });
  try{
    await batch.commit();
    showToast(`${state.products.length} SKU regenerados`); render();
  }catch(e){ console.error(e); showToast('No se pudo completar, intenta de nuevo'); }
}
async function generateMissingSKUs(){
  const missing = state.products.filter(p=>!p.sku);
  if(missing.length===0){ showToast('Todos tus productos ya tienen SKU'); return; }
  showToast(`Generando SKU para ${missing.length} producto(s)...`);
  const usedSkus = new Set(state.products.filter(p=>p.sku).map(p=>p.sku));
  const batch = db.batch();
  missing.forEach(p=>{
    let sku;
    do{ sku = generateSKU(p); }while(usedSkus.has(sku));
    usedSkus.add(sku);
    p.sku = sku;
    batch.update(db.collection('products').doc(p.id), {sku});
  });
  try{
    await batch.commit();
    showToast(`${missing.length} SKU generados`); render();
  }catch(e){ console.error(e); showToast('No se pudo completar, intenta de nuevo'); }
}

  state.products = state.products.filter(x=>x.id!==id);

      replyText = (data.content||[]).map(b=>b.text||'').join('\n');

      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      replyText = data.choices[0].message.content;

  }
  state.aiSending=false; render();

/* ============== IMÁGENES + RECORTE ============== */
const CROP_SIZE = 280, CROP_OUT = 700;
let cropCtx = null;
function clampCropOffsets(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const dw = cropCtx.natW*scale, dh = cropCtx.natH*scale;
  cropCtx.offX = Math.min(0, Math.max(CROP_SIZE-dw, cropCtx.offX));
  cropCtx.offY = Math.min(0, Math.max(CROP_SIZE-dh, cropCtx.offY));
}
function updateCropImgTransform(){
  const el = document.getElementById('crop-img'); if(!el || !cropCtx) return;
  const scale = cropCtx.baseScale*cropCtx.zoom;
  el.style.width = (cropCtx.natW*scale)+'px';
  el.style.height = (cropCtx.natH*scale)+'px';
  el.style.transform = `translate(${cropCtx.offX}px, ${cropCtx.offY}px)`;
}
function handleImageFileSelected(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const baseScale = CROP_SIZE/Math.min(img.naturalWidth, img.naturalHeight);
      cropCtx = { img, natW:img.naturalWidth, natH:img.naturalHeight, zoom:1, baseScale, offX:0, offY:0 };
      cropCtx.offX = (CROP_SIZE - cropCtx.natW*baseScale)/2;
      cropCtx.offY = (CROP_SIZE - cropCtx.natH*baseScale)/2;
      clampCropOffsets();
      state.cropOpen = true; render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function cropPointerDown(e){
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.dragging = true; cropCtx.startX = pt.clientX; cropCtx.startY = pt.clientY;
  cropCtx.startOffX = cropCtx.offX; cropCtx.startOffY = cropCtx.offY;
}
function cropPointerMove(e){
  if(!cropCtx || !cropCtx.dragging) return;
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.offX = cropCtx.startOffX + (pt.clientX - cropCtx.startX);
  cropCtx.offY = cropCtx.startOffY + (pt.clientY - cropCtx.startY);
  clampCropOffsets();
  updateCropImgTransform();
}
function cropPointerUp(){ if(cropCtx) cropCtx.dragging = false; }
document.addEventListener('mousemove', cropPointerMove);
document.addEventListener('mouseup', cropPointerUp);
document.addEventListener('touchmove', cropPointerMove, {passive:false});
document.addEventListener('touchend', cropPointerUp);
function cropSetZoom(val){
  if(!cropCtx) return;
  cropCtx.zoom = parseFloat(val);
  clampCropOffsets(); updateCropImgTransform();
}
function applyCrop(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const sx = -cropCtx.offX/scale, sy = -cropCtx.offY/scale, ssize = CROP_SIZE/scale;
  const canvas = document.createElement('canvas'); canvas.width=CROP_OUT; canvas.height=CROP_OUT;
  canvas.getContext('2d').drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, CROP_OUT, CROP_OUT);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
  if(!state.productModal.images) state.productModal.images = [];
  if(state.productModal.images.length>=5){ showToast('Máximo 5 imágenes por producto'); }
  else state.productModal.images.push(dataUrl);
  state.cropOpen = false; cropCtx = null; render();
}
function removeImage(idx){ state.productModal.images.splice(idx,1); render(); }
function moveImage(idx,dir){
  const arr = state.productModal.images;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]]; render();
}

/* ============== CSV IMPORT ============== */
function parseCSV(text){
  const rows = []; let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQuotes=false;i++;continue; }
      field+=c; i++; continue;
    }else{
      if(c === '"'){ inQuotes=true; i++; continue; }
      if(c === ','){ row.push(field); field=''; i++; continue; }
      if(c === '\n' || c === '\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function rowsToProducts(rows){
  if(!rows.length) return [];
  let start = 0;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const hasHeader = header.some(h=>h.includes('nombre')) || header.some(h=>h.includes('precio'));
  let colMap = {name:0,cat:1,price:2,stock:3,desc:4};
  if(hasHeader){
    start = 1;
    header.forEach((h,idx)=>{
      if(h.includes('nombre')) colMap.name=idx;
      else if(h.includes('categor')) colMap.cat=idx;
      else if(h.includes('precio')) colMap.price=idx;
      else if(h.includes('stock')||h.includes('existenc')) colMap.stock=idx;
      else if(h.includes('desc')) colMap.desc=idx;
    });
  }
  const out = [];
  for(let r=start;r<rows.length;r++){
    const row = rows[r];
    const name = (row[colMap.name]||'').trim();
    if(!name) continue;
    const cat = (row[colMap.cat]||'Otros').trim() || 'Otros';
    const price = Number((row[colMap.price]||'0').replace(/[^0-9.]/g,'')) || 0;
    const stock = Number((row[colMap.stock]||'0').replace(/[^0-9]/g,'')) || 0;
    const desc = (row[colMap.desc]||'').trim();
    out.push({name,cat,price,stock,desc});
  }
  return out;
}
function handleImportFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{ state.importText = e.target.result; state.importPreview = rowsToProducts(parseCSV(state.importText)); render(); };
  reader.readAsText(file);
}
function handleImportTextChange(val){
  state.importText = val;
  state.importPreview = rowsToProducts(parseCSV(val));
  render();
}
async function commitImport(mode){
  if(state.importPreview.length===0){ showToast('No hay productos para importar'); return; }
  const newCats = new Set(state.settings.categories);
  state.importPreview.forEach(p=>newCats.add(p.cat));
  try{
    if(mode==='replace'){
      const batchDel = db.batch();
      state.products.forEach(p=>batchDel.delete(db.collection('products').doc(p.id)));
      await batchDel.commit();
      const batchAdd = db.batch();
      const newProducts = [];
      state.importPreview.forEach(p=>{
        const ref = db.collection('products').doc();
        const payload = {name:p.name, cat:p.cat, price:p.price, stock:p.stock, desc:p.desc, images:[]};
        batchAdd.set(ref, payload);
        newProducts.push({id:ref.id, ...payload});
      });
      await batchAdd.commit();
      state.products = newProducts;
    }else{
      const batch = db.batch();
      state.importPreview.forEach(p=>{
        const existing = state.products.find(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
        if(existing){
          existing.cat=p.cat; existing.price=p.price; existing.stock=p.stock; existing.desc=p.desc||existing.desc;
          batch.set(db.collection('products').doc(existing.id), {name:existing.name,cat:existing.cat,price:existing.price,stock:existing.stock,desc:existing.desc,images:existing.images||[]});
        }else{
          const ref = db.collection('products').doc();
          const payload = {name:p.name, cat:p.cat, price:p.price, stock:p.stock, desc:p.desc, images:[]};
          batch.set(ref, payload);
          state.products.push({id:ref.id, ...payload});
        }
      });
      await batch.commit();
    }
    state.settings.categories = Array.from(newCats);
    await saveSettings();
    state.importOpen=false; state.importPreview=[]; state.importText='';
    showToast('Catálogo importado');
    render();
  }catch(e){ console.error(e); showToast('Ocurrió un error al importar'); }
}

/* ============== MÉTRICAS ============== */
function computeMetrics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const cancelled = state.orders.filter(o=>o.status==='Cancelado');
  const totalRevenue = valid.reduce((s,o)=>s+o.total,0);
  const avgOrder = valid.length ? totalRevenue/valid.length : 0;
  const avgItems = valid.length ? valid.reduce((s,o)=>s+o.items.reduce((a,it)=>a+it.qty,0),0)/valid.length : 0;
  const pending = state.orders.filter(o=>['Nuevo','Preparando','En camino'].includes(o.status)).length;
  const lowStock = state.products.filter(p=>p.stock<=3);
  const cancelRate = state.orders.length ? Math.round((cancelled.length/state.orders.length)*100) : 0;

  const byPhone = {};
  state.orders.forEach(o=>{ if(!o.phone) return; (byPhone[o.phone] = byPhone[o.phone]||[]).push(o); });
  const uniqueCustomers = Object.keys(byPhone).length;
  const repeatCustomers = Object.values(byPhone).filter(list=>list.length>1).length;
  const repeatRate = uniqueCustomers ? Math.round((repeatCustomers/uniqueCustomers)*100) : 0;
  const topCustomers = Object.entries(byPhone).map(([phone,list])=>({
    phone, name:list[0].customer, spend: list.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0), count:list.length
  })).sort((a,b)=>b.spend-a.spend).slice(0,5);

  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const dayRevenue = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=d && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: rev}; });

  const months = []; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-i); months.push(d); }
  const monthRevenue = months.map((m,idx)=>{
    const next = idx<months.length-1 ? months[idx+1] : new Date(m.getFullYear(), m.getMonth()+1, 1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=m && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: m.toLocaleDateString('es-MX',{month:'short'}), value: rev};
  });

  const now = new Date();
  const startThis = new Date(now); startThis.setDate(now.getDate()-6); startThis.setHours(0,0,0,0);
  const startLast = new Date(startThis); startLast.setDate(startThis.getDate()-7);
  const revThis = valid.filter(o=>new Date(o.date)>=startThis).reduce((s,o)=>s+o.total,0);
  const revLast = valid.filter(o=>{const d=new Date(o.date); return d>=startLast && d<startThis;}).reduce((s,o)=>s+o.total,0);
  const revDelta = revLast>0 ? Math.round(((revThis-revLast)/revLast)*100) : (revThis>0?100:0);

  const catUnits = {}, catRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.id);
    const cat = prod ? prod.cat : 'Otros';
    catUnits[cat] = (catUnits[cat]||0)+it.qty;
    catRevenue[cat] = (catRevenue[cat]||0)+it.price*it.qty;
  }));
  const catUnitRows = Object.entries(catUnits).sort((a,b)=>b[1]-a[1]);
  const catRevRows = Object.entries(catRevenue).sort((a,b)=>b[1]-a[1]);
  const maxCatUnit = catUnitRows.length ? catUnitRows[0][1] : 1;
  const maxCatRev = catRevRows.length ? catRevRows[0][1] : 1;

  const prodUnits = {}, prodRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{ prodUnits[it.name]=(prodUnits[it.name]||0)+it.qty; prodRevenue[it.name]=(prodRevenue[it.name]||0)+it.price*it.qty; }));
  const topByUnits = Object.entries(prodUnits).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topByRevenue = Object.entries(prodRevenue).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const soldNames = new Set(Object.keys(prodUnits));
  const noSales = state.products.filter(p=>!soldNames.has(p.name));

  const weekdayTotals = [0,0,0,0,0,0,0]; const weekdayCounts=[0,0,0,0,0,0,0];
  valid.forEach(o=>{ const d=new Date(o.date).getDay(); weekdayTotals[d]+=o.total; weekdayCounts[d]+=1; });
  const weekdayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const weekdayAvg = weekdayTotals.map((t,i)=> weekdayCounts[i] ? t/weekdayCounts[i] : 0);
  const bestDayIdx = weekdayAvg.indexOf(Math.max(...weekdayAvg));

  const inventoryValue = state.products.reduce((s,p)=>s+p.price*p.stock,0);
  const invByCat = {};
  state.products.forEach(p=>{ invByCat[p.cat]=(invByCat[p.cat]||0)+p.price*p.stock; });
  const invRows = Object.entries(invByCat).sort((a,b)=>b[1]-a[1]);
  const maxInv = invRows.length ? invRows[0][1] : 1;

  const statusCounts = {}; STATUS_FLOW.forEach(s=>statusCounts[s]=0);
  state.orders.forEach(o=>statusCounts[o.status]=(statusCounts[o.status]||0)+1);

  return {totalRevenue,avgOrder,avgItems,pending,lowStock,cancelRate,uniqueCustomers,repeatCustomers,repeatRate,topCustomers,
    dayRevenue,monthRevenue,revDelta,catUnitRows,catRevRows,maxCatUnit,maxCatRev,topByUnits,topByRevenue,noSales,
    weekdayNames,weekdayAvg,bestDayIdx,inventoryValue,invRows,maxInv,statusCounts,totalOrders:state.orders.length};
}
function computeVisitMetrics(){
  const totalVisits = state.visits.length;
  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const visitsByDay = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const count = state.visits.filter(v=>{const vd=new Date(v.date); return vd>=d && vd<next;}).length;
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: count}; });
  const hourCounts = new Array(24).fill(0);
  state.visits.forEach(v=>{ const h = new Date(v.date).getHours(); hourCounts[h]++; });
  const visitsByHour = hourCounts.map((c,h)=>({label: h+'h', value:c}));
  const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
  const last24h = state.visits.filter(v=>(Date.now()-new Date(v.date).getTime())<86400000).length;
  return {totalVisits, visitsByDay, visitsByHour, peakHour, last24h};
}

/* ============== CENTROS DE DISTRIBUCIÓN ============== */
function centerStock(p, centerId){ return (p.stockByCenter && p.stockByCenter[centerId]) || 0; }
function totalStock(p){ return p.stockByCenter ? Object.values(p.stockByCenter).reduce((s,n)=>s+(n||0),0) : (p.stock||0); }

async function saveCenterDoc(c){
  if(c.id){ await db.collection('distributionCenters').doc(c.id).set({name:c.name, isDefault:!!c.isDefault, active:c.active}); }
  else{ const ref = await db.collection('distributionCenters').add({name:c.name, isDefault:false, active:true, createdAt:new Date().toISOString()}); c.id = ref.id; }
}
async function addCenter(){
  const name = state.newCenterInput.trim();
  if(!name){ showToast('Ponle un nombre al centro'); return; }
  const c = {name, isDefault:false, active:true};
  await saveCenterDoc(c);
  state.centers.push(c);
  state.newCenterInput='';
  showToast('Centro agregado'); render();
}
async function toggleCenterActive(id){
  const c = state.centers.find(x=>x.id===id); if(!c) return;
  c.active = !c.active; await saveCenterDoc(c); render();
}
function openCenterModal(id){ const c = state.centers.find(x=>x.id===id); state.centerModal = {...c}; render(); }
async function saveCenterModal(){
  const name = document.getElementById('center-name-input').value.trim();
  if(!name){ showToast('Ponle un nombre al centro'); return; }
  const c = state.centers.find(x=>x.id===state.centerModal.id);
  c.name = name;
  await saveCenterDoc(c);
  state.centerModal = null; showToast('Centro actualizado'); render();
}

async function commitTransfer(){
  const items = Object.entries(state.transferCart).filter(([id,qty])=>qty>0);
  if(!state.transferFrom || !state.transferTo){ showToast('Elige centro de origen y destino'); return; }
  if(state.transferFrom === state.transferTo){ showToast('El origen y destino deben ser distintos'); return; }
  if(items.length===0){ showToast('Agrega al menos un producto a transferir'); return; }

  const fromCenter = state.centers.find(c=>c.id===state.transferFrom);
  const toCenter = state.centers.find(c=>c.id===state.transferTo);
  const batch = db.batch();
  const transferItems = [];
  for(const [pid, qty] of items){
    const p = state.products.find(x=>x.id===pid);
    if(!p) continue;
    const available = centerStock(p, state.transferFrom);
    if(qty > available){ showToast(`No hay suficiente stock de "${p.name}" en ${fromCenter.name} (disponible: ${available})`); return; }
  }
  items.forEach(([pid, qty])=>{
    const p = state.products.find(x=>x.id===pid);
    if(!p) return;
    if(!p.stockByCenter) p.stockByCenter = {};
    p.stockByCenter[state.transferFrom] = (p.stockByCenter[state.transferFrom]||0) - qty;
    p.stockByCenter[state.transferTo] = (p.stockByCenter[state.transferTo]||0) + qty;
    batch.update(db.collection('products').doc(pid), {stockByCenter: p.stockByCenter});
    transferItems.push({productId:pid, name:p.name, qty});
  });
  const transferDoc = {
    date: new Date().toISOString(), fromCenterId: state.transferFrom, fromCenterName: fromCenter.name,
    toCenterId: state.transferTo, toCenterName: toCenter.name, items: transferItems, notes: state.transferNotes.trim(),
  };
  try{
    const ref = db.collection('transfers').doc();
    batch.set(ref, transferDoc);
    await batch.commit();
    state.transfers.unshift({id:ref.id, ...transferDoc});
    state.transferCart = {}; state.transferNotes=''; state.transferProductSearch='';
    showToast('Transferencia realizada'); render();
  }catch(e){ console.error(e); showToast('No se pudo completar la transferencia'); }
}
function onTransferSearchInput(v){
  state.transferProductSearch = v;
  render();
  const i = document.getElementById('transfer-search-input');
  if(i){ i.focus(); i.setSelectionRange(v.length, v.length); }
}
function setTransferQty(pid, qty){
  qty = Math.max(0, Number(qty)||0);
  if(qty===0) delete state.transferCart[pid]; else state.transferCart[pid] = qty;
  render();
}

/* ============== CLIENTES ============== */
function normalizePhone(phone){ return (phone||'').replace(/\D/g,''); }
function computeCustomersList(){
  const byPhone = {};
  // 1) Se arman automáticamente a partir de los pedidos de la tienda (index.html).
  state.orders.filter(o=>o.source!=='pos' && o.phone).forEach(o=>{
    const key = normalizePhone(o.phone);
    if(!key) return;
    if(!byPhone[key]){
      byPhone[key] = { id:key, name:o.customer||'Sin nombre', phone:o.phone, email:'', city:'', state:'', country:'', notes:'',
        createdAt:null, purchases:[], totalSpent:0, isManual:false, manualId:null };
    }
    const c = byPhone[key];
    if(new Date(o.date) > new Date(c.lastDate||0)){ c.name = o.customer||c.name; c.lastDate = o.date; c.lastFolio = o.orderNumber; }
    if(o.status!=='Cancelado'){ c.totalSpent += (o.total||0); c.purchases.push(o); }
  });
  // 2) Se combinan con los perfiles que tú creas/editas a mano (colección "customers").
  state.customers.forEach(m=>{
    const key = m.phone ? normalizePhone(m.phone) : `manual_${m.id}`;
    if(byPhone[key]){
      Object.assign(byPhone[key], { name:m.name||byPhone[key].name, email:m.email||'', city:m.city||'', state:m.state||'', country:m.country||'', notes:m.notes||'', createdAt:m.createdAt||null, isManual:true, manualId:m.id });
    }else{
      byPhone[key] = { id:key, name:m.name||'Sin nombre', phone:m.phone||'', email:m.email||'', city:m.city||'', state:m.state||'', country:m.country||'', notes:m.notes||'',
        createdAt:m.createdAt||null, purchases:[], totalSpent:0, isManual:true, manualId:m.id };
    }
  });
  return Object.values(byPhone).map(c=>({
    ...c,
    purchaseCount: c.purchases.length,
    registeredAt: c.createdAt || c.lastDate || null,
  })).sort((a,b)=>b.totalSpent-a.totalSpent);
}
function filteredCustomers(){
  let list = computeCustomersList();
  const q = (state.customerSearch||'').trim().toLowerCase();
  if(q) list = list.filter(c=>(c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.email||'').toLowerCase().includes(q));
  const f = state.customerFilters;
  if(f.country!=='Todos') list = list.filter(c=>(c.country||'—')===f.country);
  if(f.state!=='Todos') list = list.filter(c=>(c.state||'—')===f.state);
  if(f.city!=='Todos') list = list.filter(c=>(c.city||'—')===f.city);
  if(f.regDate!=='Todas'){
    const days = {'Último día':1,'Últimos 7 días':7,'Últimos 30 días':30}[f.regDate];
    if(days){ const cutoff = Date.now()-days*86400000; list = list.filter(c=>c.registeredAt && new Date(c.registeredAt).getTime()>=cutoff); }
  }
  return list;
}
function distinctCustomerValues(field){
  const vals = new Set(computeCustomersList().map(c=>c[field]||'—'));
  return Array.from(vals).sort();
}

function exportCustomersCSV(){
  const list = filteredCustomers();
  const rows = [['nombre','telefono','email','ciudad','estado','pais','ultima_compra','total_consumido','numero_de_compras','notas']];
  list.forEach(c=>rows.push([c.name, c.phone, c.email, c.city, c.state, c.country, c.lastDate?new Date(c.lastDate).toLocaleDateString('es-MX'):'', c.totalSpent, c.purchaseCount, c.notes||'']));
  const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='clientes.csv'; a.click();
  URL.revokeObjectURL(url);
}
function parseCustomerCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const header = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/"/g,''));
  const idx = (name)=>header.findIndex(h=>h.includes(name));
  const iName=idx('nombre'), iPhone=idx('telefono'), iEmail=idx('email')>=0?idx('email'):idx('correo'), iCity=idx('ciudad'), iState=idx('estado'), iCountry=idx('pais'), iNotes=idx('notas');
  return lines.slice(1).map(line=>{
    const cols = line.match(/(".*?"|[^,]+)(?=,|$)/g)||[];
    const clean = i => i>=0 && cols[i] ? cols[i].replace(/^"|"$/g,'').replace(/""/g,'"').trim() : '';
    return { name:clean(iName), phone:clean(iPhone), email:clean(iEmail), city:clean(iCity), state:clean(iState), country:clean(iCountry), notes:clean(iNotes) };
  }).filter(r=>r.name);
}
function handleCustomerImportFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{ state.customerImportText = e.target.result; state.customerImportPreview = parseCustomerCSV(state.customerImportText); render(); };
  reader.readAsText(file);
}
function handleCustomerImportTextChange(val){

async function commitCustomerImport(){
  if(state.customerImportPreview.length===0){ showToast('No hay clientes para importar'); return; }
  try{
    const batch = db.batch();
    state.customerImportPreview.forEach(row=>{
      const existing = row.phone ? state.customers.find(c=>normalizePhone(c.phone)===normalizePhone(row.phone)) : null;
      const payload = {name:row.name, phone:row.phone||'', email:row.email||'', city:row.city||'', state:row.state||'', country:row.country||'', notes:row.notes||'', createdAt: existing?existing.createdAt:new Date().toISOString()};
      const ref = existing ? db.collection('customers').doc(existing.id) : db.collection('customers').doc();
      batch.set(ref, payload);
      if(existing) Object.assign(existing, payload); else state.customers.push({id:ref.id, ...payload});
    });
    await batch.commit();
    state.customerImportOpen=false; state.customerImportPreview=[]; state.customerImportText='';
    showToast('Clientes importados'); render();
  }catch(e){ console.error(e); showToast('Ocurrió un error al importar'); }
}

async function saveWholesaleTier(){
  const t = state.wholesaleModal;

  const discountPercent = Number(document.getElementById('wt-discount').value)||0;
  const scope = document.getElementById('wt-scope').value;
  const minType = document.getElementById('wt-mintype').value;
  const minValue = Number(document.getElementById('wt-minvalue').value)||0;
  const code = document.getElementById('wt-code').value.trim().toUpperCase();
  if(!name){ showToast('Ponle un nombre a la tabla de precios'); return; }
  if(!code){ showToast('Necesita un código de acceso'); return; }
  const others = state.settings.wholesaleTiers.filter(x=>x.id!==t.id);
  if(others.some(x=>x.code===code)){ showToast('Ese código ya lo usa otra tabla, elige otro'); return; }
  const updated = {...t, name, discountPercent, scope, minType, minValue, code};
  const idx = state.settings.wholesaleTiers.findIndex(x=>x.id===t.id);
  if(idx>=0) state.settings.wholesaleTiers[idx] = updated;

async function saveCoupon(){
  const c = state.couponModal;
  const code = document.getElementById('cp-code').value.trim().toUpperCase();
  const discountPercent = Number(document.getElementById('cp-discount').value)||0;
  const scope = document.getElementById('cp-scope').value;
  const startDate = document.getElementById('cp-start').value;
  const endDate = document.getElementById('cp-end').value;
  const maxUses = Number(document.getElementById('cp-maxuses').value)||0;
  if(!code){ showToast('Ponle un código al cupón'); return; }
  const others = state.settings.coupons.filter(x=>x.id!==c.id);
  if(others.some(x=>x.code===code)){ showToast('Ese código ya existe, elige otro'); return; }
  const updated = {...c, code, discountPercent, scope, startDate, endDate, maxUses};
  const idx = state.settings.coupons.findIndex(x=>x.id===c.id);
  if(idx>=0) state.settings.coupons[idx] = updated;

function couponUsedCount(code){ return state.couponUsage.filter(u=>u.code===code).length; }
function couponStatusLabel(c){
  if(!c.active) return {text:'Desactivado', color:'#8a6b78'};
  const now = new Date();
  if(c.startDate && now < new Date(c.startDate)) return {text:'Programado', color:'var(--amber)'};
  if(c.endDate && now > new Date(c.endDate+'T23:59:59')) return {text:'Vencido', color:'#8a6b78'};
  if(c.maxUses>0 && couponUsedCount(c.code)>=c.maxUses) return {text:'Agotado', color:'#8a6b78'};
  return {text:'Activado', color:'var(--green)'};
}

  cart_discount: 'Descuento automático en el carrito',

  cross_sell: 'Cross selling (descuento al comprar dos productos juntos)',
};
function openPromoModal(id){
  const p = id ? JSON.parse(JSON.stringify(state.settings.promotions.find(x=>x.id===id))) : {

    discountPercent:10, minAmount:0,
    giftProductId:'',
    triggerProductId:'', discountProductId:'',
  };
  state.promoModal = p; state.promoProductSearch=''; state.promoProductSearch2=''; render();
}
function closePromoModal(){ state.promoModal=null; render(); }
function togglePromoCategory(cat, checked){
  const p = state.promoModal;
  if(checked){ if(!p.categories.includes(cat)) p.categories.push(cat); }
  else{ p.categories = p.categories.filter(c=>c!==cat); }
}
function togglePromoProduct(pid, checked){
  const p = state.promoModal;
  if(checked){ if(!p.productIds.includes(pid)) p.productIds.push(pid); }
  else{ p.productIds = p.productIds.filter(id=>id!==pid); }
}
function addPromoTier(){ state.promoModal.tiers.push({minQty:0, discountPercent:0}); render(); }
function removePromoTier(idx){ state.promoModal.tiers.splice(idx,1); render(); }
function setPromoTier(idx, field, value){ state.promoModal.tiers[idx][field] = Number(value)||0; }
async function savePromotion(){
  const p = state.promoModal;
  const name = document.getElementById('pr-name').value.trim();
  const type = document.getElementById('pr-type').value;
  const startDate = document.getElementById('pr-start').value;
  const endDate = document.getElementById('pr-end').value;
  if(!name){ showToast('Ponle un nombre a la promoción'); return; }
  let updated = {...p, name, type, startDate, endDate};
  if(type==='all_scope_needed_placeholder'){} // no-op, kept for clarity
  if(['buyxpayy','progressive','cart_discount'].includes(type)){
    updated.scope = document.getElementById('pr-scope').value;
  }
  if(type==='buyxpayy'){
    updated.buyQty = Number(document.getElementById('pr-buyqty').value)||1;
    updated.payQty = Number(document.getElementById('pr-payqty').value)||1;
    if(updated.payQty >= updated.buyQty){ showToast('"Pagas" debe ser menor que "Llevas"'); return; }
  }
  if(type==='cart_discount'){
    updated.discountPercent = Number(document.getElementById('pr-discount').value)||0;
    updated.minAmount = Number(document.getElementById('pr-minamount').value)||0;
  }
  if(type==='gift'){
    updated.minAmount = Number(document.getElementById('pr-gift-minamount').value)||0;
    if(!updated.giftProductId){ showToast('Elige el producto de regalo'); return; }
  }
  if(type==='cross_sell'){
    updated.discountPercent = Number(document.getElementById('pr-cross-discount').value)||0;
    if(!updated.triggerProductId || !updated.discountProductId){ showToast('Elige los dos productos'); return; }
  }
  const idx = state.settings.promotions.findIndex(x=>x.id===p.id);
  if(idx>=0) state.settings.promotions[idx] = updated;
  else state.settings.promotions.push(updated);
  await saveSettings();
  state.promoModal=null; showToast('Promoción guardada'); render();
}
async function deletePromotion(id){
  if(!confirm('¿Eliminar esta promoción?')) return;
  state.settings.promotions = state.settings.promotions.filter(x=>x.id!==id);
  await saveSettings(); showToast('Eliminada'); render();
}

  const p = state.settings.promotions.find(x=>x.id===id); if(!p) return;

function promoSummary(p){
  if(p.type==='buyxpayy') return `Lleva ${p.buyQty} y paga ${p.payQty}`;
  if(p.type==='progressive') return (p.tiers||[]).map(t=>`${t.minQty}+: ${t.discountPercent}%`).join(' · ');
  if(p.type==='cart_discount') return `${p.discountPercent}% de descuento${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`;
  if(p.type==='gift'){ const g = state.products.find(x=>x.id===p.giftProductId); return `Regalo: ${g?g.name:'—'}${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`; }
  if(p.type==='cross_sell'){ const a=state.products.find(x=>x.id===p.triggerProductId), b=state.products.find(x=>x.id===p.discountProductId); return `${a?a.name:'—'} + ${b?b.name:'—'}: ${p.discountPercent}% en el segundo`; }
  return '';
}

/* ============== AUDITORÍAS DE INVENTARIO ============== */
function setAuditCount(pid, value){
  const v = value.trim();
  if(v===''){ delete state.auditCounts[pid]; }
  else{ state.auditCounts[pid] = Math.max(0, Number(v)||0); }
}
function auditDiffRows(){
  if(!state.auditCenter) return [];
  return Object.entries(state.auditCounts).map(([pid,counted])=>{
    const p = state.products.find(x=>x.id===pid);
    if(!p) return null;
    const system = centerStock(p, state.auditCenter);
    return {pid, name:p.name, system, counted, diff: counted - system};
  }).filter(Boolean);
}
async function commitAudit(applyAdjustment){
  if(!state.auditCenter){ showToast('Elige el centro que estás auditando'); return; }
  const rows = auditDiffRows();
  if(rows.length===0){ showToast('Cuenta al menos un producto antes de guardar'); return; }
  const center = state.centers.find(c=>c.id===state.auditCenter);
  const auditDoc = {
    date: new Date().toISOString(), centerId: state.auditCenter, centerName: center.name,
    items: rows.map(r=>({productId:r.pid, name:r.name, systemQty:r.system, countedQty:r.counted, diff:r.diff})),
    notes: state.auditNotes.trim(), applied: applyAdjustment,
  };
  try{
    const ref = db.collection('audits').doc();
    if(applyAdjustment){
      const batch = db.batch();
      rows.forEach(r=>{
        const p = state.products.find(x=>x.id===r.pid);
        if(!p) return;
        if(!p.stockByCenter) p.stockByCenter = {};
        p.stockByCenter[state.auditCenter] = r.counted;
        p.stock = totalStock(p);
        batch.update(db.collection('products').doc(r.pid), {stockByCenter:p.stockByCenter, stock:p.stock});
      });
      batch.set(ref, auditDoc);
      await batch.commit();
    }else{
      await ref.set(auditDoc);
    }
    state.audits.unshift({id:ref.id, ...auditDoc});
    state.auditCounts = {}; state.auditNotes=''; state.auditSearch='';
    showToast(applyAdjustment ? 'Auditoría guardada y inventario ajustado' : 'Auditoría guardada'); render();
  }catch(e){ console.error(e); showToast('No se pudo guardar la auditoría'); }
}

        ${candidates.length>0 ? `

            ${candidates.map(p=>`

                ${p.images&&p.images.length?`<img class="row-swatch" src="${p.images[0]}">`:`<div class="row-swatch" style="background:${catColor(p.cat)}"></div>`}
                <div class="row-main"><div class="row-title">${p.name}</div><div class="row-sub">${p.cat} · Sistema dice: ${centerStock(p,state.auditCenter)}</div></div>
                <input type="number" min="0" placeholder="Conteo" style="width:80px;padding:8px;border-radius:8px;border:1px solid var(--border);text-align:center;" value="${state.auditCounts[p.id]??''}" onchange="setAuditCount('${p.id}', this.value);render()">

        ` : `<div class="empty-state" style="margin-bottom:14px;">No hay productos que coincidan con este filtro.</div>`}
        ${rows.length>0 ? `
          <div class="panel-title" style="margin-bottom:10px;">Productos contados (${rows.length}) ${totalDiffs>0?`· <span style="color:var(--rose);">${totalDiffs} con diferencia</span>`:'· sin diferencias'}</div>
          ${rows.map(r=>`
            <div class="hbar-row" style="align-items:center;">

          </div>
        ` : `<div class="empty-state">Busca productos arriba y anota su conteo físico.</div>`}
      ` : ''}
    </div>
    <div class="panel">
      <div class="panel-title">Historial de auditorías</div>
      ${state.audits.length===0 ? `<div class="empty-state">Aún no se ha hecho ninguna auditoría.</div>` :

let sectionDragIdx = null;

function renderDiseno(){

  return `

        <div class="subpanel-item" onclick="state.designSubpanel='${sp.key}';render()">

          <span class="chev">›</span>
        </div>
      `).join('')}

function renderSectionRow(s, idx){
  const total = state.settings.sections.length;
  return `
    <div class="section-row" draggable="true"
      ondragstart="sectionDragStart(event, ${idx})"
      ondragover="event.preventDefault()"
      ondrop="sectionDrop(event, ${idx})">
      <span class="drag-handle">⠿</span>
      <span class="section-name ${s.visible?'':'hidden-section'}">${s.label}</span>
      <div class="section-arrows">
        <button class="arrow-btn" ${idx===0?'disabled style="opacity:.35"':''} onclick="moveSection(${idx},-1)">▲</button>
        <button class="arrow-btn" ${idx===total-1?'disabled style="opacity:.35"':''} onclick="moveSection(${idx},1)">▼</button>
      </div>
      <button class="visibility-toggle ${s.visible?'on':'off'}" onclick="toggleSectionVisible(${idx})">${s.visible?'Visible':'Oculta'}</button>
    </div>`;
}
function toggleSectionVisible(idx){
  state.settings.sections[idx].visible = !state.settings.sections[idx].visible;
  saveSettings(); render();
}
function moveSection(idx, dir){
  const arr = state.settings.sections; const j = idx+dir;
  if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  saveSettings(); render();
}
function sectionDragStart(e, idx){ sectionDragIdx = idx; }
function sectionDrop(e, idx){
  e.preventDefault();
  if(sectionDragIdx===null || sectionDragIdx===idx) return;
  const arr = state.settings.sections;
  const [moved] = arr.splice(sectionDragIdx,1);
  arr.splice(idx,0,moved);
  sectionDragIdx = null;
  saveSettings(); render();
}

function renderProductModal(){
  const p = state.productModal; const isNew = !p.id;
  const price = Number(p.price)||0;
  const promo = Number(p.promoPrice)||0;
  const cost = Number(p.cost)||0;
  const effective = promo>0 ? promo : price;
  const margin = effective>0 ? Math.round(((effective-cost)/effective)*1000)/10 : 0;
  const profit = Math.round((effective-cost)*100)/100;
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.productModal=null;render();}">
    <div class="modal">
      <h3>${isNew?'Nuevo producto':'Editar producto'}</h3>

      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--surface-soft);padding:10px 12px;border-radius:9px;margin-bottom:14px;cursor:pointer;">
        <input type="checkbox" id="pf-hidden" ${p.hidden?'checked':''}>
        Ocultar este producto del catálogo público (sigue existiendo, solo no se muestra en la tienda)
      </label>

      <div class="form-field"><label>Imágenes (máx. 5) — la primera es la portada</label>
        <div class="img-thumbs">
          ${(p.images||[]).map((src,idx)=>`
            <div class="img-thumb">
              <img src="${src}">
              <div class="img-thumb-actions">
                ${idx>0?`<button onclick="moveImage(${idx},-1)">◀</button>`:''}
                ${idx<((p.images||[]).length-1)?`<button onclick="moveImage(${idx},1)">▶</button>`:''}
                <button onclick="removeImage(${idx})">✕</button>
              </div>
            </div>`).join('')}
          ${(p.images||[]).length<5 ? `<div class="img-thumb add-thumb" onclick="document.getElementById('img-file-input').click()">+</div>` : ''}
        </div>
        <input type="file" id="img-file-input" accept="image/*" style="display:none;" onchange="handleImageFileSelected(this)">
      </div>

      <div class="form-field"><label>Nombre</label><input id="pf-name" value="${p.name||''}"></div>

      <div class="two-col">
        <div class="form-field"><label>SKU</label>
          <div style="display:flex;gap:6px;">
            <input id="pf-sku" value="${p.sku||''}" style="flex:1;">
            <button class="btn-outline" style="padding:0 12px;white-space:nowrap;" onclick="regenerateSKU()">Generar</button>
          </div>
        </div>
        <div class="form-field"><label>Categorías</label>
          <div style="max-height:110px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;">
            ${state.settings.categories.map(c=>`
              <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--surface-soft);padding:6px 9px;border-radius:7px;cursor:pointer;">
                <input type="checkbox" value="${c}" ${(p.categories||[p.cat]).includes(c)?'checked':''} onchange="toggleProductCategory('${c.replace(/'/g,"\\'")}',this.checked)">
                ${c}
              </label>`).join('')}
          </div>
        </div>
      </div>

      <div class="panel" style="margin:4px 0 16px;background:var(--bg);">
        <div class="panel-title" style="margin-bottom:12px;">Precios</div>
        <div class="two-col">
          <div class="form-field"><label>Precio de venta</label><input id="pf-price" type="number" value="${p.price||''}" oninput="updatePriceCalc()"></div>
          <div class="form-field"><label>Precio promocional</label><input id="pf-promo" type="number" value="${p.promoPrice||''}" placeholder="0.00" oninput="updatePriceCalc()"></div>
        </div>
        <div class="form-field"><label>Costo</label><input id="pf-cost" type="number" value="${p.cost||''}" oninput="updatePriceCalc()"></div>
        <div class="panel-sub" style="margin-bottom:0;">Es de uso interno, tus clientes no lo verán en la tienda.</div>
        <div class="two-col" style="margin-top:10px;">
          <div><div class="row-sub">Margen de ganancia</div><strong id="pf-margin" style="font-size:16px;color:var(--primary-deep);">${margin}%</strong></div>
          <div><div class="row-sub">Ganancia por unidad</div><strong id="pf-profit" style="font-size:16px;color:var(--green);">${money(profit)}</strong></div>
        </div>
      </div>

      <div class="form-field"><label>Existencias por centro de distribución</label>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${state.centers.filter(c=>c.active).map(c=>`
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="flex:1;font-size:13px;font-weight:600;">${c.name}${c.isDefault?' <span style="color:var(--ink-soft);font-weight:400;">(Principal)</span>':''}</div>
              <input type="number" min="0" style="width:90px;padding:9px;border-radius:8px;border:1px solid var(--border);text-align:center;" value="${(p.stockByCenter&&p.stockByCenter[c.id])||0}" onchange="setProductCenterStock('${c.id}', this.value)">
            </div>
          `).join('')}
        </div>
        <div class="panel-sub" style="margin-top:8px;margin-bottom:0;">Total: <strong id="pf-stock-total">${Object.values(p.stockByCenter||{}).reduce((s,n)=>s+(n||0),0)}</strong> unidades (se suma automáticamente)</div>
      </div>

      <div class="form-field"><label>Descripción breve</label><textarea id="pf-desc">${p.desc||''}</textarea></div>

      <div class="form-field"><label>¿Para quién es? (aparece en la sección "¿Qué estás buscando?" de la tienda)</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${NEEDS.map(n=>`
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface-soft);padding:8px 11px;border-radius:9px;cursor:pointer;">
              <input type="checkbox" value="${n.key}" ${(p.needs||[]).includes(n.key)?'checked':''} onchange="toggleProductNeed('${n.key}',this.checked)">
              ${n.label}
            </label>`).join('')}
        </div>
      </div>

      ${renderVariantsEditor(p)}

      <div class="modal-actions">
        <button class="btn-cancel" onclick="state.productModal=null;render()">Cancelar</button>
        <button class="btn-primary" onclick="handleSaveProduct('${p.id||''}')">Guardar</button>
      </div>
    </div>
  </div>`;
}
function toggleProductNeed(key, checked){
  if(!state.productModal.needs) state.productModal.needs = [];
  if(checked){ if(!state.productModal.needs.includes(key)) state.productModal.needs.push(key); }
  else{ state.productModal.needs = state.productModal.needs.filter(k=>k!==key); }
}
function toggleProductCategory(cat, checked){
  const p = state.productModal;
  if(!p.categories) p.categories = p.cat ? [p.cat] : [];
  if(checked){ if(!p.categories.includes(cat)) p.categories.push(cat); }
  else{ p.categories = p.categories.filter(c=>c!==cat); }
}
function setProductCenterStock(centerId, value){
  if(!state.productModal.stockByCenter) state.productModal.stockByCenter = {};
  state.productModal.stockByCenter[centerId] = Math.max(0, Number(value)||0);
  const totalEl = document.getElementById('pf-stock-total');
  if(totalEl) totalEl.textContent = Object.values(state.productModal.stockByCenter).reduce((s,n)=>s+(n||0),0);
}
function updatePriceCalc(){
  const price = Number(document.getElementById('pf-price').value)||0;
  const promo = Number(document.getElementById('pf-promo').value)||0;
  const cost = Number(document.getElementById('pf-cost').value)||0;
  const effective = promo>0 ? promo : price;
  const margin = effective>0 ? Math.round(((effective-cost)/effective)*1000)/10 : 0;
  const profit = Math.round((effective-cost)*100)/100;
  const marginEl = document.getElementById('pf-margin'); if(marginEl) marginEl.textContent = margin+'%';
  const profitEl = document.getElementById('pf-profit'); if(profitEl) profitEl.textContent = money(profit);
}
function generateSKU(product){
  const catPart = ((product.categories&&product.categories[0])||product.cat||'GEN').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3) || 'GEN';
  const namePart = (product.name||'PROD').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4) || 'PROD';
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${catPart}-${namePart}-${rand}`;
}
function regenerateSKU(){
  const name = document.getElementById('pf-name').value.trim();
  document.getElementById('pf-sku').value = generateSKU({name, categories: state.productModal.categories, cat: state.productModal.cat});
}

/* ---- Variantes ---- */
function renderVariantsEditor(p){
  const groups = p.variantGroups || [];
  const variants = p.variants || [];
  return `
    <div class="panel" style="background:var(--bg);">
      <div class="panel-title" style="margin-bottom:4px;">Variantes</div>
      <div class="panel-sub">Combina diferentes propiedades de tu producto. Ejemplo: color + talla.</div>
      ${groups.map((g,idx)=>`
        <div class="two-col" style="margin-bottom:8px;">
          <input placeholder="Nombre (ej. Color)" value="${g.name||''}" onchange="setVariantGroupName(${idx}, this.value)">
          <input placeholder="Valores separados por coma (ej. Rojo, Azul)" value="${(g.values||[]).join(', ')}" onchange="setVariantGroupValues(${idx}, this.value)">
        </div>
        <div style="text-align:right;margin-top:-4px;margin-bottom:10px;"><button class="icon-btn danger" style="width:auto;padding:4px 10px;font-size:11px;" onclick="removeVariantGroup(${idx})">Quitar grupo</button></div>
      `).join('')}
      <div class="two-col" style="margin-bottom:10px;">
        <button class="btn-outline" onclick="addVariantGroup()">+ Agregar grupo de variante</button>
        <button class="btn-primary" onclick="generateVariantCombos()">Generar variantes</button>
      </div>
      ${variants.length>0 ? `
        <div class="panel-title" style="font-size:12.5px;margin:12px 0 8px;">Combinaciones (${variants.length})</div>
        ${variants.map(v=>`
          <div class="list-row" style="align-items:center;">
            <div class="row-main"><div class="row-title">${Object.entries(v.combo||{}).map(([k,val])=>`${k}: ${val}`).join(' · ')}</div></div>
            <input placeholder="SKU" value="${v.sku||''}" style="width:130px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:12px;" onchange="setVariantField('${v.id}','sku',this.value)">
            <input type="number" min="0" placeholder="Stock" value="${v.stock||0}" style="width:75px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:12px;text-align:center;" onchange="setVariantField('${v.id}','stock',this.value)">
          </div>
        `).join('')}
      ` : ''}
    </div>`;
}
function addVariantGroup(){
  if(!state.productModal.variantGroups) state.productModal.variantGroups = [];
  state.productModal.variantGroups.push({name:'', values:[]});
  render();
}
function setVariantGroupName(idx, value){ state.productModal.variantGroups[idx].name = value.trim(); }
function setVariantGroupValues(idx, value){
  state.productModal.variantGroups[idx].values = value.split(',').map(v=>v.trim()).filter(Boolean);
}
function removeVariantGroup(idx){
  state.productModal.variantGroups.splice(idx,1);
  render();
}
function generateVariantCombos(){
  const groups = (state.productModal.variantGroups||[]).filter(g=>g.name && g.values && g.values.length);
  if(groups.length===0){ showToast('Agrega al menos un grupo con nombre y valores'); return; }
  let combos = [{}];
  groups.forEach(g=>{
    const next = [];
    combos.forEach(c=>{ g.values.forEach(v=>{ next.push({...c, [g.name]: v}); }); });
    combos = next;
  });
  const existing = state.productModal.variants || [];
  const keyOf = combo => JSON.stringify(Object.entries(combo).sort());
  const existingByKey = {}; existing.forEach(v=>{ existingByKey[keyOf(v.combo)] = v; });
  state.productModal.variants = combos.map(combo=>{
    const key = keyOf(combo);
    if(existingByKey[key]) return existingByKey[key];
    return { id: uid('var_'), combo, sku:'', stock:0 };
  });
  showToast(`${combos.length} variante(s) generada(s)`);
  render();
}
function setVariantField(variantId, field, value){
  const v = (state.productModal.variants||[]).find(x=>x.id===variantId);
  if(!v) return;
  v[field] = field==='stock' ? Math.max(0, Number(value)||0) : value;
}
function handleSaveProduct(existingId){
  const name = document.getElementById('pf-name').value.trim();
  const sku = document.getElementById('pf-sku').value.trim();
  const price = Number(document.getElementById('pf-price').value)||0;
  const promoPrice = Number(document.getElementById('pf-promo').value)||0;
  const cost = Number(document.getElementById('pf-cost').value)||0;
  const desc = document.getElementById('pf-desc').value.trim();
  const hidden = document.getElementById('pf-hidden').checked;
  if(!name){ showToast('Ponle un nombre al producto'); return; }
  const categories = (state.productModal.categories && state.productModal.categories.length) ? state.productModal.categories : [state.settings.categories[0]];
  const cat = categories[0];
  const stockByCenter = state.productModal.stockByCenter || {};
  const stock = Object.values(stockByCenter).reduce((s,n)=>s+(n||0),0);
  saveProduct({
    id: existingId||null, name, sku, cat, categories, price, promoPrice, cost, stock, stockByCenter, desc,
    hidden, images: state.productModal.images||[], needs: state.productModal.needs||[],
    variantGroups: state.productModal.variantGroups||[], variants: state.productModal.variants||[],
  });
}

function renderCropModal(){
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:340px;text-align:center;">
      <h3>Ajusta el encuadre</h3>
      <div class="panel-sub" style="margin-bottom:12px;">Arrastra para mover, usa la barra para acercar. Así puedes dejar fuera lo que no quieras mostrar.</div>
      <div class="crop-box" onmousedown="cropPointerDown(event)" ontouchstart="cropPointerDown(event)">
        <img id="crop-img" src="${cropCtx.img.src}" style="width:${cropCtx.natW*cropCtx.baseScale*cropCtx.zoom}px;height:${cropCtx.natH*cropCtx.baseScale*cropCtx.zoom}px;transform:translate(${cropCtx.offX}px, ${cropCtx.offY}px);">
      </div>
      <input type="range" min="1" max="3" step="0.01" value="${cropCtx.zoom}" oninput="cropSetZoom(this.value)" style="width:100%;margin-top:14px;">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="state.cropOpen=false;cropCtx=null;render()">Cancelar</button>
        <button class="btn-primary" onclick="applyCrop()">Usar esta imagen</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const root = document.getElementById('root');
  if(!state.authChecked){ root.innerHTML = `<div class="loading-screen">Verificando sesión…</div>`; return; }
  if(!state.user){ root.innerHTML = renderLogin(); return; }
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando panel…</div>`; return; }
  root.innerHTML = renderAdmin();
  if(!document.getElementById('toast')){ const t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  const pinField = document.getElementById('pin-field'); if(pinField) pinField.focus();
}
render();
</script>
