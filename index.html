/* ============== OFERTAS RELÁMPAGO ==============
   settings.flashSales [{id,name,percent,start,end,productIds,categories,active}], fechas locales
   "YYYY-MM-DDTHH:MM". Mientras una esté en curso rebaja el precio de sus productos; al terminar, el
   precio normal vuelve solo (no se modifica ningún producto). */
function flashLive(){ return (state.settings.flashSales||[]).filter(f=>f.active!==false && f.start && f.end && new Date(f.end).getTime()>Date.now()); }
function flashSalesActive(){ const now=Date.now(); return flashLive().filter(f=>f.percent>0 && new Date(f.start).getTime()<=now); }
function flashCovers(f,p){ const cats=(p.categories&&p.categories.length)?p.categories:[p.cat]; return (f.productIds||[]).includes(p.id) || (f.categories||[]).some(c=>cats.includes(c)); }
function flashFor(p){
  if(!p || p.isKit) return null;
  const f = flashSalesActive().find(x=>flashCovers(x,p)); if(!f) return null;
  const price = Math.round(p.price*(1-f.percent/100)*100)/100;
  return price<p.price ? {sale:f, price} : null;
}
function effectivePrice(p){
  const base = (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : p.price;
  const fl = flashFor(p);
  return fl && fl.price<base ? fl.price : base;
}

/* ============== MAYOREO ============== */
const WHOLESALE_KEY = 'cdlp_wholesale_code';
function captureWholesaleCodeFromURL(){
  const params = new URLSearchParams(location.search);
  const code = params.get('mayoreo');
  if(code){
    const tier = (state.settings.wholesaleTiers||[]).find(t=>t.active && t.code===code.toUpperCase());
    if(tier){
      try{ localStorage.setItem(WHOLESALE_KEY, tier.code); }catch(e){}
      showToast(`Modo mayoreo activado: ${tier.name}`);
    }
    const url = new URL(location.href); url.searchParams.delete('mayoreo');
    history.replaceState(history.state, '', url.toString());
  }
}
function activeWholesaleTier(){
  let code = null;
  try{ code = localStorage.getItem(WHOLESALE_KEY); }catch(e){}
  if(!code) return null;
  return (state.settings.wholesaleTiers||[]).find(t=>t.active && t.code===code) || null;
}

/* ============== MODO KIOSKO / VITRINA ==============
   Pensado para una tablet en el mostrador de la tienda física: muestra el catálogo para que la
   clienta lo hojee, pero sin botones de comprar ni carrito — solo puede ver productos y precios;
   cualquier compra la hace el personal desde el Punto de Venta. Se activa con ?vitrina=1 en la
   URL (queda guardado en ese dispositivo, no hace falta repetirlo cada vez que se prende la
   tablet) y se apaga con ?vitrina=0. */
const KIOSK_KEY = 'cdlp_kiosk_mode';
function captureKioskModeFromURL(){
  const params = new URLSearchParams(location.search);
  const val = params.get('vitrina');
  if(val==null) return;
  try{
    if(val==='0') localStorage.removeItem(KIOSK_KEY);
    else localStorage.setItem(KIOSK_KEY,'1');
  }catch(e){}
  const url = new URL(location.href); url.searchParams.delete('vitrina');
  history.replaceState(history.state, '', url.toString());
}
function isKioskMode(){
  try{ return localStorage.getItem(KIOSK_KEY)==='1'; }catch(e){ return false; }
}
function isEligibleForTier(p, tier){
  if(!tier) return false;
  if(tier.scope==='all') return true;
  if(tier.scope==='categories') return productCats(p).some(c=>(tier.categories||[]).includes(c));
  if(tier.scope==='products') return (tier.productIds||[]).includes(p.id);
  return false;
}
function wholesaleCartProgress(tier){
  let amount = 0, qty = 0;
  Object.entries(state.cart).forEach(([key,q])=>{
    const {p} = parseCartKey(key);
    if(p && isEligibleForTier(p, tier)){ amount += effectivePrice(p)*q; qty += q; }
  });
  const current = tier.minType==='amount' ? amount : qty;
  return { current, needed: tier.minValue, unlocked: current >= tier.minValue };
}
function finalPrice(p){
  const tier = activeWholesaleTier();
  const base = effectivePrice(p);
  if(tier && isEligibleForTier(p, tier)){
    const progress = wholesaleCartProgress(tier);
    if(progress.unlocked) return Math.round(p.price*(1-tier.discountPercent/100)*100)/100;
  }
  return base;
}
function clearWholesaleCode(){
  try{ localStorage.removeItem(WHOLESALE_KEY); }catch(e){}
  showToast('Modo mayoreo desactivado'); render();
}
function applyWholesaleCodeManually(){
  const input = document.getElementById('wholesale-code-input');
  const code = (input.value||'').trim().toUpperCase();
  if(!code) return;
  const tier = (state.settings.wholesaleTiers||[]).find(t=>t.active && t.code===code);
  if(!tier){ showToast('Código no válido'); return; }
  try{ localStorage.setItem(WHOLESALE_KEY, tier.code); }catch(e){}
  showToast(`Modo mayoreo activado: ${tier.name}`); render();
}

/* ============== CUPONES DE DESCUENTO ============== */
function isCouponEligible(p, coupon){
  if(coupon.scope==='all') return true;
  if(coupon.scope==='categories') return productCats(p).some(c=>(coupon.categories||[]).includes(c));
  if(coupon.scope==='products') return (coupon.productIds||[]).includes(p.id);
  return false;
}
function cartHasCouponEligibleItem(coupon){
  return Object.keys(state.cart).some(key=>{ const {p}=parseCartKey(key); return p && isCouponEligible(p, coupon); });
}
async function applyCouponCode(){
  const code = (state.couponInput||'').trim().toUpperCase();
  state.couponError = '';
  if(!code){ return; }
  const coupon = (state.settings.coupons||[]).find(c=>c.code===code);
  if(!coupon || !coupon.active){ state.couponError = 'Código no válido'; render(); return; }
  const now = new Date();
  if(coupon.startDate && now < new Date(coupon.startDate)){ state.couponError = 'Este cupón todavía no está vigente'; render(); return; }
  if(coupon.endDate && now > new Date(coupon.endDate+'T23:59:59')){ state.couponError = 'Este cupón ya venció'; render(); return; }
  if(!cartHasCouponEligibleItem(coupon)){ state.couponError = 'Este cupón no aplica a los productos de tu carrito'; render(); return; }
  if(coupon.maxUses>0){
    try{
      const used = await db.collection('couponUsage').where('code','==',code).get();
      if(used.size >= coupon.maxUses){ state.couponError = 'Este cupón ya alcanzó su límite de usos'; render(); return; }
    }catch(e){ console.error(e); }
  }
  // Aviso temprano para cupones de un solo uso por cliente: si ya tenemos su teléfono guardado
  // en este celular (compró antes y guardó sus datos), se revisa de una vez. Si no lo tenemos
  // todavía (primera visita, aún no llega al checkout), la revisión definitiva ocurre de todos
  // modos al confirmar el pedido, en submitOrder — esto es solo para no hacerle perder el tiempo.
  if(coupon.singleUsePerCustomer){
    const savedProfile = loadCustomerProfile();
    if(savedProfile && savedProfile.phone){
      const usedByThisPhone = await couponUsedByPhone(code, savedProfile.phone);
      if(usedByThisPhone){ state.couponError = 'Ya usaste este cupón antes'; render(); return; }
    }
  }
  state.appliedCoupon = coupon; state.couponInput = ''; showToast(`Cupón ${code} aplicado`); render();
}
async function couponUsedByPhone(code, phone){
  const digits = (phone||'').replace(/\D/g,'');
  if(!digits) return false;
  try{
    const snap = await db.collection('couponUsage').where('code','==',code).where('phone','==',digits).get();
    return !snap.empty;
  }catch(e){ console.error(e); return false; }
}
function removeCoupon(){ state.appliedCoupon=null; state.couponError=''; render(); }
function couponDiscountedPrice(p, price){
  if(!state.appliedCoupon || !isCouponEligible(p, state.appliedCoupon)) return price;
  return Math.round(price*(1-state.appliedCoupon.discountPercent/100)*100)/100;
}

/* ============== PROMOCIONES AUTOMÁTICAS ============== */
function activePromotions(){
  const now = new Date();
  return (state.settings.promotions||[]).filter(promo=>{
    if(!promo.active) return false;
    if(promo.startDate && now < new Date(promo.startDate)) return false;
    if(promo.endDate && now > new Date(promo.endDate+'T23:59:59')) return false;
    return true;
  });
}
function isPromoScopeEligible(p, promo){
  if(promo.scope==='all') return true;
  if(promo.scope==='categories') return productCats(p).some(c=>(promo.categories||[]).includes(c));
  if(promo.scope==='products') return (promo.productIds||[]).includes(p.id);
  return false;
}
function cartEligibleQtyAndAmount(promo){
  let qty=0, amount=0;
  Object.entries(state.cart).forEach(([key,q])=>{
    const {p} = parseCartKey(key);
    if(p && isPromoScopeEligible(p, promo)){ qty+=q; amount += finalPrice(p)*q; }
  });
  return {qty, amount};
}
// Precio por unidad después de aplicar la MEJOR promoción automática disponible
// (nunca se combinan varias entre sí: siempre se usa la que más le convenga al cliente).
function automaticDiscountedPrice(p){
  let best = finalPrice(p); // ya incluye precio promocional del producto y mayoreo (si está desbloqueado)
  activePromotions().forEach(promo=>{
    if(promo.type==='cart_discount' && isPromoScopeEligible(p, promo)){
      const {amount} = cartEligibleQtyAndAmount(promo);
      if(amount >= (promo.minAmount||0)){
        const candidate = Math.round(p.price*(1-promo.discountPercent/100)*100)/100;
        if(candidate < best) best = candidate;
      }
    }
    if(promo.type==='progressive' && isPromoScopeEligible(p, promo)){
      const {qty} = cartEligibleQtyAndAmount(promo);
      const applicable = (promo.tiers||[]).filter(t=>qty>=t.minQty).sort((a,b)=>b.discountPercent-a.discountPercent);
      if(applicable.length){
        const candidate = Math.round(p.price*(1-applicable[0].discountPercent/100)*100)/100;
        if(candidate < best) best = candidate;
      }
    }
    if(promo.type==='cross_sell' && promo.discountProductId===p.id){
      const hasTrigger = Object.keys(state.cart).some(key=>{ const {p:pp}=parseCartKey(key); return pp && pp.id===promo.triggerProductId; });
      if(hasTrigger){
        const candidate = Math.round(p.price*(1-promo.discountPercent/100)*100)/100;
        if(candidate < best) best = candidate;
      }
    }
  });
  return best;
}
// "Lleva X y paga Y": junta las unidades elegibles de todo el carrito, y hace gratis
// las más baratas de cada grupo completo de X unidades.
function buyXPayYAdjustment(){
  let discount = 0;
  activePromotions().filter(promo=>promo.type==='buyxpayy').forEach(promo=>{
    const units = [];
    Object.entries(state.cart).forEach(([key,q])=>{
      const {p} = parseCartKey(key);
      if(p && isPromoScopeEligible(p, promo)){
        const unitPrice = automaticDiscountedPrice(p);
        for(let i=0;i<q;i++) units.push(unitPrice);
      }
    });
    if(units.length < promo.buyQty) return;
    units.sort((a,b)=>a-b);
    const freeCount = Math.floor(units.length/promo.buyQty) * (promo.buyQty-promo.payQty);
    for(let i=0;i<freeCount;i++) discount += units[i];
  });
  return discount;
}
function cartSubtotalBeforeGift(){
  let s = 0;
  Object.entries(state.cart).forEach(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    if(!p) return;
    let price = v ? (v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p)) : automaticDiscountedPrice(p);
    price = couponDiscountedPrice(p, price);
    s += price*qty;
  });
  return Math.max(0, s - buyXPayYAdjustment());
}
function activeGift(){
  const subtotal = cartSubtotalBeforeGift();
  // Si el producto de regalo ya se agotó, la promoción se "apaga" sola en la tienda en vez de
  // seguir ofreciendo un regalo que no se puede entregar — Ale no tiene que acordarse de
  // desactivarla a mano cada vez que se acaba ese producto.
  const gift = activePromotions().find(promo=>{
    if(promo.type!=='gift' || subtotal < (promo.minAmount||0)) return false;
    const product = state.products.find(p=>p.id===promo.giftProductId);
    return product && product.stock>0;
  });
  if(!gift) return null;
  const product = state.products.find(p=>p.id===gift.giftProductId);
  return product ? {promo:gift, product} : null;
}
// Sugerencia de producto complementario: reusa las promociones "cross_sell" que ya existen
// (Producto A + Producto B, con % de descuento en B) — en cuanto A está en el carrito, se
// muestra B como sugerencia con su descuento ya listo, sin ser un pop-up que interrumpa.
// Si B ya está en el carrito, deja de sugerirse (ya no hace falta insistir).
function crossSellSuggestions(){
  const inCartIds = new Set(Object.keys(state.cart).map(key=>{ const {p}=parseCartKey(key); return p?p.id:null; }).filter(Boolean));
  return activePromotions()
    .filter(promo=>promo.type==='cross_sell' && inCartIds.has(promo.triggerProductId) && !inCartIds.has(promo.discountProductId))
    .map(promo=>({promo, product: state.products.find(p=>p.id===promo.discountProductId)}))
    // Si el producto con descuento ya se agotó, no tiene caso sugerirlo (no se podría agregar).
    .filter(x=>x.product && x.product.stock>0);
}
// Sugerencias genéricas del carrito ("también te puede interesar"): a diferencia de
// crossSellSuggestions (arriba), estas NO dependen de que Ale haya armado una promoción de
// cruce — solo buscan productos que aún no estén en el carrito, primero de las mismas
// categorías que ya llevas, luego de los destacados, y si falta completar, cualquier otro con
// existencias. Se excluyen los que ya aparecen como sugerencia de una promoción, para no
// repetir el mismo producto dos veces en la misma pantalla.
function genericCartSuggestions(){
  const inCartIds = new Set(Object.keys(state.cart).map(key=>{ const {p}=parseCartKey(key); return p?p.id:null; }).filter(Boolean));
  const promoSuggestedIds = new Set(crossSellSuggestions().map(x=>x.product.id));
  const cartCats = new Set();
  Object.keys(state.cart).forEach(key=>{ const {p}=parseCartKey(key); if(p) productCats(p).forEach(c=>cartCats.add(c)); });
  const pool = dailyShuffledProducts().filter(p=>!inCartIds.has(p.id) && !promoSuggestedIds.has(p.id) && p.stock>0);
  const featuredIds = state.settings.featuredProductIds||[];
  const sameCat = pool.filter(p=>productCats(p).some(c=>cartCats.has(c)));
  const featured = pool.filter(p=>featuredIds.includes(p.id) && !sameCat.includes(p));
  const rest = pool.filter(p=>!sameCat.includes(p) && !featured.includes(p));
  return [...sameCat, ...featured, ...rest].slice(0,4);
}
function productCats(p){ return (p.categories && p.categories.length) ? p.categories : (p.cat ? [p.cat] : []); }
function cartKey(productId, variantId){ return variantId ? `${productId}::${variantId}` : productId; }
function parseCartKey(key){
  const parts = key.split('::');
  const p = state.products.find(x=>x.id===parts[0]);
  const v = (parts[1] && p) ? (p.variants||[]).find(x=>x.id===parts[1]) : null;
  return {p, v};
}
function itemStock(p, v){ return v ? (v.stock||0) : (p ? p.stock : 0); }
// Aviso antes de pasar al checkout: de la lista de productos que Ale marcó como "para recordar
// ofrecer" (lubricante, condones, etc.) en el panel, se sugiere lo que todavía NO lleva en el
// carrito — igual que en el Punto de Venta, pero aquí lo ve la clienta directamente, así que el
// tono es una sugerencia amable, no una instrucción a un cajero.
// Antes, si el carrito ya traía UNO solo de esos productos, se cancelaba el aviso por completo
// y se perdía la oportunidad de sugerir los demás (por ejemplo: ya lleva condones, pero nunca se
// le ofrece el lubricante porque "ya llevaba algo de la lista"). Ahora se detecta, producto por
// producto, cuál ya lleva y cuál no, y solo se le sugiere algo DIFERENTE a lo que ya tiene.
function reminderProductsNotInCart(){
  const reminderIds = state.settings.checkoutReminderProducts || [];
  const inCartIds = new Set(Object.keys(state.cart).map(key=>parseCartKey(key).p).filter(Boolean).map(p=>p.id));
  return reminderIds.filter(id=>!inCartIds.has(id)).map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
}
function proceedToCheckout(){
  if(state.settings.storePaused){ showToast(state.settings.storePausedMessage || 'La tienda está en pausa temporalmente.'); return; }
  if(!state.checkoutReminderShown && reminderProductsNotInCart().length){
    state.checkoutReminderOpen = true;
    render();
    return;
  }
  state.cartOpen=false; state.checkoutOpen=true; state.checkoutOpenedAt=Date.now(); trackEvent('checkout_start',{cartTotal: cartTotal()}); render();
}
function addReminderProductToCart(id){
  addToCart(id);
  state.checkoutReminderShown = true;
  state.checkoutReminderOpen = false;
  render();
}
function continueCheckoutWithoutReminder(){
  state.checkoutReminderShown = true;
  state.checkoutReminderOpen = false;
  state.cartOpen=false; state.checkoutOpen=true; state.checkoutOpenedAt=Date.now(); trackEvent('checkout_start',{cartTotal: cartTotal()}); render();
}
function renderCheckoutReminderDrawer(){
  // Solo se sugiere lo que todavía no lleva en el carrito (ver reminderProductsNotInCart), y
  // ahora cada sugerencia se ve con su imagen para que sea más atractiva y fácil de reconocer,
  // igual que en el resto de la tienda.
  const items = reminderProductsNotInCart();
  return `
    <div class="drawer-head"><h2>¿Se te olvidó algo?</h2><button class="close-x" onclick="continueCheckoutWithoutReminder()">${icon('x')}</button></div>
    <div class="drawer-body">
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;">Muchas veces un lubricante hace toda la diferencia — aquí tienes algunas opciones, por si quieres agregar una:</p>
      ${items.map(p=>`
        <div class="reminder-row">
          ${p.images&&p.images.length ? `<img class="cart-item-swatch" src="${p.images[0]}" alt="${p.name}" loading="lazy">` : `<div class="cart-item-swatch" style="background:${catColor(p.cat)};display:flex;align-items:center;justify-content:center;">${catIcon(p.cat)}</div>`}
          <div class="r-name">${p.name}<div class="r-price">${money(effectivePrice(p))}</div></div>
          <button class="reminder-add" onclick="addReminderProductToCart('${p.id}')">+ Agregar</button>
        </div>`).join('')}
    </div>
    <div class="drawer-foot"><button class="btn-neutral" style="margin-top:0;" onclick="continueCheckoutWithoutReminder()">Continuar sin agregar</button></div>
  `;
}
function variantLabel(v){ return v ? Object.values(v.combo||{}).join(' / ') : ''; }
// Aplica los colores/tipografía/estilo elegidos en Diseño → Apariencia (admin.html). Se
// escriben como propiedades inline en <html>, que siempre le ganan a cualquier valor de
// :root del CSS sin importar el orden en que aparezcan — así no hace falta reordenar hojas
// de estilo ni usar !important. Si un campo no está definido (tienda que nunca lo configuró),
// se deja el valor de :root tal cual (los colores/tipografía originales).
function applyThemeVars(){
  const t = state.settings.theme || {};
  const root = document.documentElement.style;
  ['primary','primaryDeep','rose','amber'].forEach(k=>{
    const cssVar = '--' + k.replace(/([A-Z])/g,'-$1').toLowerCase();
    if(t[k]) root.setProperty(cssVar, t[k]);
  });
  if(t.fontHeading) root.setProperty('--font-heading', t.fontHeading);
  if(t.fontBody) root.setProperty('--font-body', t.fontBody);
  if(t.radius==='cuadrado'){
    root.setProperty('--radius-card','8px'); root.setProperty('--radius-sm','6px');
    root.setProperty('--radius-md','8px'); root.setProperty('--radius-lg','10px'); root.setProperty('--radius-pill','8px');
  }
}
function toastStack(){
  let s=document.getElementById('toast-stack');
  if(!s){ s=document.createElement('div'); s.id='toast-stack'; s.className='toast-stack'; s.setAttribute('role','status'); s.setAttribute('aria-live','polite'); document.body.appendChild(s); }
  return s;
}
function showToast(msg){
  const s=toastStack(); msg=String(msg==null?'':msg);
  // el mismo aviso repetido no se duplica: solo reinicia su tiempo
  let t=[...s.querySelectorAll('.toast')].find(x=>x.textContent===msg && !x.classList.contains('out'));
  if(!t){
    t=document.createElement('div'); t.className='toast show'; t.textContent=msg;
    s.insertBefore(t, s.querySelector('.undo-bar')||null);   // el aviso "Deshacer" queda siempre al final (abajo)
    const all=[...s.querySelectorAll('.toast')]; if(all.length>5) all[0].remove();
  }
  clearTimeout(t._t); t._t=setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),230); }, 2600);
}
function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  let total = 0;
  Object.entries(state.cart).forEach(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    if(!p) return;
    let price = v ? (v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p)) : automaticDiscountedPrice(p);
    price = couponDiscountedPrice(p, price);
    total += price*qty;
  });
  total -= buyXPayYAdjustment();
  return Math.max(0, total);
}
function waLink(msg){ const num=(state.settings.whatsapp||'').replace(/\D/g,''); return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`; }
// Aviso interno a Slack (opcional, ver Configuración → Datos operativos). Se manda en paralelo
// al mensaje de WhatsApp del cliente, nunca en su lugar, y nunca debe interrumpir el flujo de
// compra si falla o si Ale no configuró ningún webhook. Por una restricción de los navegadores
// (CORS), un webhook de Slack no se puede llamar de la forma normal desde el navegador sin
// servidor propio: se manda con mode "no-cors" y Content-Type "text/plain" (aunque el cuerpo
// sea JSON) para evitar que el navegador la bloquee — a cambio, nunca se sabe si en verdad llegó
// bien, así que esto es "mejor esfuerzo", no garantizado.
function sendSlackNotification(text){
  const url = state.settings.slackWebhookUrl;
  if(!url) return;
  try{
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({text}) }).catch(()=>{});
  }catch(e){ /* silencioso a propósito: Slack es un aviso extra, no debe tronar la compra */ }
}

function addToCart(id, variantId){
  if(isKioskMode()){ return; } // en modo vitrina no se puede agregar al carrito, solo hojear el catálogo
  if(state.settings.storePaused){ showToast(state.settings.storePausedMessage || 'La tienda está en pausa temporalmente.'); return; }
  const p = state.products.find(x=>x.id===id);
  if(!p){ return; }
  if(p.variantGroups && p.variantGroups.length && !variantId){
    openProductDetail(id); return; // necesita elegir variante primero
  }
  const v = variantId ? (p.variants||[]).find(x=>x.id===variantId) : null;
  const key = cartKey(id, variantId);
  const available = itemStock(p, v);
  if(available<=0 || available<=(state.cart[key]||0)){ showToast('Sin existencias'); return; }
  state.cart[key]=(state.cart[key]||0)+1; saveCart(); showToast('Agregado al carrito'); trackEvent('add_to_cart', {productId:id}); render();
}
function changeQty(key,delta){ const cur=state.cart[key]||0; const next=cur+delta; if(next<=0) delete state.cart[key]; else state.cart[key]=next; saveCart(); render(); }
function removeFromCart(key){ delete state.cart[key]; saveCart(); render(); }

function scrollToId(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
function goHome(){ state.searchQuery=''; state.activeCat='Todos'; state.activeNeed=null; state.activeBestSellers=false; render(); window.scrollTo({top:0, behavior:'smooth'}); }

// mostrar solo esos productos, igual que al elegir una categoría, con un botón claro para
// quitar el filtro y ver todo de nuevo (ver renderGridSection).
function goToFeatured(){

  render();
  requestAnimationFrame(()=>scrollToId('catalogo'));
}
function openProductDetail(id){ state.detailProductId=id; state.detailImageIndex=0; state.detailSelectedVariant={}; trackEvent('product_view', {productId:id}); render(); }
function closeProductDetail(){ state.detailProductId=null; render(); }
function selectVariantOption(groupName, value){
  state.detailSelectedVariant[groupName] = value;
  render();
}
function findMatchingVariant(p){
  if(!p.variantGroups || !p.variantGroups.length) return null;
  const sel = state.detailSelectedVariant;
  const complete = p.variantGroups.every(g=>sel[g.name]);
  if(!complete) return null;
  return (p.variants||[]).find(v=>p.variantGroups.every(g=>v.combo[g.name]===sel[g.name])) || null;
}
function setDetailImage(idx){ state.detailImageIndex=idx; render(); }
function detailPrevImage(){
  const p = state.products.find(x=>x.id===state.detailProductId); if(!p) return;
  const n = (p.images&&p.images.length) || 1;
  state.detailImageIndex = (state.detailImageIndex - 1 + n) % n; render();
}
function detailNextImage(){
  const p = state.products.find(x=>x.id===state.detailProductId); if(!p) return;
  const n = (p.images&&p.images.length) || 1;
  state.detailImageIndex = (state.detailImageIndex + 1) % n; render();
}
let detailTouchStartX = null;
function detailTouchStart(e){ detailTouchStartX = (e.touches?e.touches[0]:e).clientX; }
function detailTouchEnd(e){
  if(detailTouchStartX===null) return;
  const endX = (e.changedTouches?e.changedTouches[0]:e).clientX;
  const delta = endX - detailTouchStartX;
  detailTouchStartX = null;
  if(Math.abs(delta) < 40) return;
  if(delta < 0) detailNextImage(); else detailPrevImage();
}

// tienes. Una vez por término por visita, y nunca mientras el catálogo sigue cargando (para no
// registrar como "sin resultado" algo que sí existe pero todavía no ha llegado).
let searchMissTimer = null;
const searchMissLogged = {};
function normalizeSearchTerm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function scheduleSearchMissCheck(v){
  clearTimeout(searchMissTimer);
  const norm = normalizeSearchTerm(v);
  if(norm.length < 3) return;
  searchMissTimer = setTimeout(()=>{
    if(!state.fullCatalogLoaded || searchMissLogged[norm]) return;

    try{ db.collection('searchMisses').add({query:(v||'').trim().slice(0,80), normalized:norm.slice(0,80), date:new Date().toISOString()}).catch(()=>{}); }catch(e){}
  }, 1600);
}

/* ============== CAJA SORPRESA / COMBO ALEATORIO ==============
   Al confirmar el pedido (no antes, para que sea una sorpresa real hasta ese momento) se sortean
   productos reales con existencia para completar cada caja — de la categoría que el producto
   "caja sorpresa" tenga configurada (o de cualquier categoría, si se dejó en "Cualquiera"). La
   clienta solo ve el nombre y precio de la caja en su carrito; el detalle de qué le tocó queda
   guardado en el pedido para que el personal sepa exactamente qué empacar. */
function pickMysteryBoxItems(box, qty){
  const wantCategory = box.mysteryCategory && box.mysteryCategory!=='Cualquiera' ? box.mysteryCategory : null;
  const pool = state.products.filter(p=>
    p.id!==box.id && !p.isKit && !p.isMysteryBox && (p.stock==null || p.stock>0) &&
    (!wantCategory || productCats(p).includes(wantCategory))
  );
  const count = Math.max(1, Number(box.mysteryItemCount)||3) * Math.max(1, qty||1);
  if(!pool.length) return [];
  const picks = {};
  for(let i=0;i<count;i++){
    const choice = pool[Math.floor(Math.random()*pool.length)];
    picks[choice.id] = picks[choice.id] || {id:choice.id, name:choice.name, qty:0};
    picks[choice.id].qty += 1;
  }
  return Object.values(picks);
}
/* ---- Protección simple contra pedidos falsos o repetidos ----
   Sin servidor propio no se puede garantizar nada al 100%, así que son tres frenos baratos:
   1) un límite de pedidos por dispositivo en 24 h (configurable; 0 = sin límite),
   2) un campo trampa invisible que solo llenan los bots, y
   3) una señal "rápido" si el formulario se envió en menos de 4 segundos (no bloquea: solo se
      anota en el pedido para que el panel lo marque como "Revisar").
   El resto de las señales (teléfono dudoso, varios pedidos del mismo teléfono, etc.) las calcula
   el panel de administración con los pedidos ya guardados. */
const ORDER_LOG_KEY = 'cdlp_order_log';
function fraudGuardOn(){ return state.settings.fraudGuardEnabled!==false; }
function fraudMaxPerDay(){ const n = state.settings.fraudMaxOrdersPerDay; return (n===undefined||n===null||n==='') ? 3 : Math.max(0, Number(n)||0); }
function recentOrderLog(){
  try{ const arr = JSON.parse(localStorage.getItem(ORDER_LOG_KEY)||'[]'); const cut = Date.now()-24*3600*1000; return arr.filter(t=>typeof t==='number' && t>cut); }
  catch(e){ return []; }
}
function recordOrderInLog(){
  try{ const arr = recentOrderLog(); arr.push(Date.now()); localStorage.setItem(ORDER_LOG_KEY, JSON.stringify(arr)); }catch(e){}
}
async function submitOrder(formData){
  if(state.settings.storePaused){ showToast(state.settings.storePausedMessage || 'La tienda está en pausa temporalmente.'); state.submittingOrder=false; render(); return; }
  if(fraudGuardOn()){
    const max = fraudMaxPerDay();
    if(max>0 && recentOrderLog().length >= max){
      showToast('Ya enviaste varios pedidos hoy. Escríbenos por WhatsApp y te ayudamos.');
      state.submittingOrder=false; render(); return;
    }
  }
  if(state.appliedCoupon && state.appliedCoupon.singleUsePerCustomer){
    const alreadyUsed = await couponUsedByPhone(state.appliedCoupon.code, formData.phone);
    if(alreadyUsed){
      showToast('Ese cupón ya lo usaste antes con este teléfono — se quitó de tu pedido');
      state.appliedCoupon = null; state.submittingOrder=false; render(); return;
    }
  }
  // Existencias frescas: si otra clienta (o el POS) se llevó piezas mientras esta clienta tenía el
  // carrito abierto, se ajusta el carrito y se avisa ANTES de enviar el pedido.
  try{
    const fresh = {}; 
    await Promise.all([...new Set(Object.keys(state.cart).map(k=>parseCartKey(k).p&&parseCartKey(k).p.id).filter(Boolean))].map(async id=>{
      const d = await db.collection('products').doc(id).get(); if(d.exists) fresh[id] = d.data();
    }));
    const adjusted = [];
    Object.entries(state.cart).forEach(([key,qty])=>{
      const {p,v} = parseCartKey(key); if(!p || !fresh[p.id]) return;
      const fp = fresh[p.id];
      const avail = v ? ((fp.variants||[]).find(x=>x.id===v.id)||{stock:0}).stock||0 : (fp.stock||0);
      if(avail < qty){ adjusted.push(p.name); if(avail<=0) delete state.cart[key]; else state.cart[key]=avail; }
      const live = state.products.find(x=>x.id===p.id); if(live){ live.stock = fp.stock||0; if(v){ const lv=(live.variants||[]).find(x=>x.id===v.id); if(lv) lv.stock = ((fp.variants||[]).find(x=>x.id===v.id)||{}).stock||0; } }
    });
    if(adjusted.length){
      saveCart(); state.submittingOrder=false; state.checkoutOpen=!!Object.keys(state.cart).length; state.cartOpen=!state.checkoutOpen&&!!Object.keys(state.cart).length;
      showToast(`Se agotaron piezas de: ${adjusted.slice(0,2).join(', ')}${adjusted.length>2?'…':''}. Revisamos tu carrito, confirma de nuevo.`); render(); return;
    }
  }catch(e){ console.error('No se pudo verificar existencias', e); }
  const items = Object.entries(state.cart).map(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    let price = v && v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p);
    price = couponDiscountedPrice(p, price);
    const line = {id:p.id, variantId: v?v.id:null, name: p.name + (v?` (${variantLabel(v)})`:''), price, qty};
    if(p.isMysteryBox){
      const picks = pickMysteryBoxItems(p, qty);
      if(picks.length) line.mysteryPicks = picks;
    }
    return line;
  });
  const buyXPayYSavings = buyXPayYAdjustment();
  if(buyXPayYSavings>0){
    items.push({id:'promo_buyxpayy', name:'Promoción (lleva X y paga Y)', price:-buyXPayYSavings, qty:1});
  }
  const gift = activeGift();
  if(gift){
    items.push({id:gift.product.id, name:`${gift.product.name} (regalo)`, price:0, qty:1});
  }
  const orderNumber = await getNextOrderNumber();
  const couponCode = state.appliedCoupon ? state.appliedCoupon.code : null;
  const order = { date:new Date().toISOString(), orderNumber, source:"tienda", customer:formData.name, phone:formData.phone, address:formData.address, notes:formData.notes, items, total: items.reduce((s,it)=>s+it.price*it.qty,0), status:"Nuevo", couponCode };
  const orderCampaign = activeCampaign(); if(orderCampaign) order.campaign = orderCampaign;
  if(fraudGuardOn() && state.checkoutOpenedAt && (Date.now()-state.checkoutOpenedAt) < 4000) order.fraudSignals = ['rapido'];
  try{ await db.collection('orders').add(order); }
  catch(e){ console.error(e); showToast('No se pudo enviar el pedido, intenta de nuevo'); state.submittingOrder=false; render(); return; }
  recordOrderInLog();
  trackEvent('purchase', {orderTotal: order.total});
  clearTimeout(abandonedCartTimer);
  clearAbandonedCartDraft(formData.phone);
  if(couponCode){
    try{ await db.collection('couponUsage').add({code:couponCode, date:new Date().toISOString(), phone: (formData.phone||'').replace(/\D/g,'')}); }catch(e){ console.error('No se pudo registrar el uso del cupón', e); }
  }
  state.cart = {}; saveCart(); state.checkoutOpen=false; state.cartOpen=false; state.orderPlaced=true; state.lastOrderNumber=orderNumber; state.submittingOrder=false; state.appliedCoupon=null; render();

  // Mensaje de confirmación de compra: se abre solo, listo para que el cliente lo mande por
  // WhatsApp al número de la tienda (state.settings.whatsapp, configurable en Configuración).
  const productLines = items.map(it=>`• ${it.qty}x ${it.name}`).join('\n');
  const msg = `Hola, me gustaria confirmar mi compra:\nProducto: \n${productLines}\nDirección: ${formData.address}\nTotal: ${money(order.total)} (el total no incluye el costo del envío)\n\n¡Gracias!`;
  if(state.settings.whatsapp){
    window.open(waLink(msg), '_blank');
  }
  // Aviso interno a Slack (en paralelo, no en lugar del de WhatsApp) — ver Configuración → Datos operativos.
  sendSlackNotification(`🛒 *Nuevo pedido* ${orderNumber?`#${orderNumber}`:''}\nCliente: ${formData.name} (${formData.phone})\nProducto:\n${productLines}\nDirección: ${formData.address}\nTotal: ${money(order.total)} (no incluye envío)`);
}
function handleCheckoutSubmit(){
  if(state.submittingOrder) return; // evita doble envío si tocan el botón varias veces
  const trap = document.getElementById('ck-company-site');
  if(trap && trap.value.trim()){
    // Campo trampa lleno = bot. Se simula éxito para no darle pistas, pero no se guarda nada.
    state.cart = {}; saveCart(); state.checkoutOpen=false; state.cartOpen=false; state.orderPlaced=true; state.lastOrderNumber=null; render(); return;
  }
  const name = document.getElementById('ck-name').value.trim();
  const phone = document.getElementById('ck-phone').value.trim();
  const address = document.getElementById('ck-address').value.trim();
  const notes = document.getElementById('ck-notes').value.trim();
  const remember = document.getElementById('ck-remember').checked;
  if(!name || !phone || !address){ showToast('Completa nombre, teléfono y dirección'); return; }
  if(phone.replace(/\D/g,'').length < 10){ showToast('Escribe tu WhatsApp con 10 dígitos para poder contactarte'); return; }
  if(needsTermsAcceptance()){
    const termsEl = document.getElementById('ck-terms');
    if(!termsEl || !termsEl.checked){ showToast('Debes aceptar el aviso de privacidad para continuar'); return; }
  }
  if(needsTermsAcceptance()) markTermsAccepted();
  if(remember){ saveCustomerProfile({name,phone,address,notes,remember:true}); }
  else{ clearCustomerProfile(); }
  state.submittingOrder = true; render();
  submitOrder({name,phone,address,notes});
}

  const type = state.messageDraft.type||'pregunta';
  const message = (state.messageDraft.text||'').trim();
  if(!name || !phone || !message){ showToast('Ponle tu nombre, teléfono y el mensaje'); return; }
  let lastSent = 0;
  try{ lastSent = Number(localStorage.getItem('cdlp_msg_last_sent')||0); }catch(e){}
  if(Date.now() - lastSent < MESSAGE_MIN_INTERVAL_MS){ showToast('Ya enviaste un mensaje hace un momento, espera un poco antes de enviar otro.'); return; }
  state.sendingMessage = true; render();
  try{
    await db.collection('storeMessages').add({ date:new Date().toISOString(), name, phone, type, message, status:'nuevo' });
    try{ localStorage.setItem('cdlp_msg_last_sent', String(Date.now())); }catch(e){}
    state.messageDraft = {name:'',phone:'',type:'pregunta',text:''};
    state.sendingMessage = false; state.messageSent = true; render();
  }catch(e){
    console.error(e); state.sendingMessage = false; render();
    showToast('No se pudo enviar tu mensaje, intenta de nuevo');
  }
}

async function submitNotifyMe(productId, variantId){
  const name = ((document.getElementById('notify-name')||{}).value||'').trim();
  const digits = ((document.getElementById('notify-phone')||{}).value||'').replace(/\D/g,'');
  if(digits.length < 10){ showToast('Escribe tu WhatsApp con 10 dígitos'); return; }
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  const v = variantId ? (p.variants||[]).find(x=>x.id===variantId) : null;
  const sentKey = productId + (variantId ? '::'+variantId : '');
  const docId = productId + (variantId ? '_'+variantId : '') + '_' + digits.slice(-10);
  try{
    await db.collection('restockRequests').doc(docId).set({
      productId, productName: p.name + (v ? ` (${variantLabel(v)})` : ''), name: name.slice(0,80), phone: digits.slice(0,15),
      date: new Date().toISOString(), notified: false,
    });
    state.notifySent[sentKey] = true;
    showToast('¡Listo! Te avisamos en cuanto llegue');
  }catch(e){
    if(e && e.code==='permission-denied'){ state.notifySent[sentKey] = true; showToast('Ya estabas en la lista de espera 💕'); }
    else{ console.error('No se pudo guardar el aviso', e); showToast('No se pudo guardar, intenta de nuevo'); }
  }
  render();
}

const ANNOUNCE_CLOSED_KEY = 'cdlp_announce_closed';
function announceText(){

}
function dismissAnnounceBar(){

function renderAnnounceBar(){

  const color = ['rose','soft'].includes(s.announceColor) ? s.announceColor : '';
  const safe = txt.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const link = String(s.announceLink||'').trim();
  const inner = `${icon('clock',14)}<span>${safe}</span>`;

}
/* ============== BÚSQUEDA TOLERANTE ==============
   Antes la búsqueda solo comparaba el texto tal cual (minúsculas): "lubricánte" no encontraba
   "lubricante", y "gel lubricante" fallaba si el nombre decía "lubricante en gel". Ahora ignora
   acentos y mayúsculas, acepta las palabras en cualquier orden, entiende plurales ("dildos") y
   perdona una letra mal escrita en palabras largas ("lubrikante"). Las mejores coincidencias
   (nombre > categoría > descripción) salen primero. */
const _searchIdx = new Map();
function searchClean(s){ return normalizeSearchTerm(s).replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function searchStem(t){
  if(t.length>4 && t.endsWith('es')) return t.slice(0,-2);
  if(t.length>3 && t.endsWith('s')) return t.slice(0,-1);
  return t;
}
function withinOneEdit(a,b){
  if(a===b) return true;
  const la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  let i=0, j=0, edits=0;
  while(i<la && j<lb){
    if(a[i]===b[j]){ i++; j++; continue; }
    if(++edits>1) return false;
    if(la>lb) i++; else if(lb>la) j++; else { i++; j++; }
  }
  return edits + (la-i) + (lb-j) <= 1;
}
function productSearchEntry(p){
  const cats = productCats(p).join(' ');
  const sig = (p.name||'')+'|'+(p.desc||'').length+'|'+cats+'|'+(p.sku||'')+'|'+(p.barcode||'');
  let e = _searchIdx.get(p.id);
  if(e && e.sig===sig) return e;
  const name = searchClean(p.name), catsN = searchClean(cats), desc = searchClean(p.desc), code = searchClean((p.sku||'')+' '+(p.barcode||''));
  e = {sig, name, cats:catsN, desc, code, words:new Set((name+' '+catsN).split(' ').filter(w=>w.length>=3))};
  _searchIdx.set(p.id, e);
  return e;
}
function productSearchScore(p, tokens, full){
  const e = productSearchEntry(p);
  let score = 0;
  if(e.name.includes(full)) score += 10;
  if(e.name.startsWith(full)) score += 5;
  for(const t of tokens){
    const s = searchStem(t);
    if(e.name.includes(s)) score += 4;
    else if(e.cats.includes(s)) score += 3;
    else if(e.code && e.code.includes(t)) score += 3;
    else if(e.desc.includes(s)) score += 1;
    else if(s.length>=5){
      let hit = false;
      for(const w of e.words){ if(withinOneEdit(searchStem(w), s) || withinOneEdit(w, t) || withinOneEdit(w.slice(0,s.length), s) || withinOneEdit(w.slice(0,s.length+1), s)){ hit = true; break; } }
      if(hit) score += 1.5; else return -1;
    } else return -1;
  }
  return score;
}
// Sinónimos configurables (Admin → Configuración → Sinónimos del buscador): cada línea es un grupo
// de palabras que significan lo mismo ("consolador, dildo"). Buscar una equivale a buscar todas;
// los resultados por sinónimo salen justo después de los que coinciden con lo escrito tal cual.
let _synSig = '', _synGroups = [];
function synonymGroups(){
  const raw = state.settings.searchSynonyms;
  const sig = JSON.stringify(raw||[]);
  if(sig!==_synSig){
    _synSig = sig;
    _synGroups = (Array.isArray(raw)?raw:[]).map(line=>String(line).split(',').map(x=>searchClean(x)).filter(Boolean)).filter(g=>g.length>=2);
  }
  return _synGroups;
}
function queryVariants(full){
  const out = [full], groups = synonymGroups();
  if(!groups.length) return out;
  const tokens = full.split(' ');
  groups.forEach(g=>{
    g.forEach((phrase,pi)=>{
      let build = null;
      if((' '+full+' ').includes(' '+phrase+' ')) build = (other)=>(' '+full+' ').replace(' '+phrase+' ', ' '+other+' ').trim();
      else if(!phrase.includes(' ')){
        const t = tokens.find(x=>x.length>=4 && phrase.startsWith(x)); // a medio escribir ("consol…")
        if(t) build = (other)=>tokens.map(x=>x===t?other:x).join(' ');
      }
      if(!build) return;
      g.forEach((other,oi)=>{ if(oi!==pi){ const v = build(other); if(v && !out.includes(v)) out.push(v); } });
    });
  });
  return out.slice(0, 8);
}
function searchProducts(q, pool){
  const full = searchClean(q);
  const tokens = full.split(' ').filter(Boolean);
  const list = pool || state.products;
  if(!tokens.length) return list;
  const variants = queryVariants(full).map(v=>({v, toks:v.split(' ').filter(Boolean)}));
  const out = [];
  list.forEach((p,i)=>{
    let best = -1;
    variants.forEach((x,vi)=>{
      const sc = productSearchScore(p, x.toks, x.v);
      if(sc>=0){ const adj = vi===0 ? sc : sc-0.5; if(adj>best) best = adj; }
    });
    if(best>=0) out.push({p, sc:best, i});
  });
  out.sort((a,b)=> b.sc-a.sc || a.i-b.i);
  return out.map(x=>x.p);
}

/* ============== "AHORRAS $X" ==============
   Diferencia entre el precio de lista y lo que de verdad se paga (promoción del producto,
   promociones automáticas, mayoreo y cupón). Solo es un aviso: no cambia ningún precio. */
function moneyShort(n){ return '$' + Number(Math.round(n)).toLocaleString('es-MX'); }
function listPriceOf(p, v){ return v && v.priceOverride>0 ? v.priceOverride : p.price; }
function unitSavings(p){ const s = p.price - automaticDiscountedPrice(p); return s>=1 ? s : 0; }
function cartSavings(){
  let total = 0;
  Object.entries(state.cart).forEach(([key,qty])=>{
    const {p,v} = parseCartKey(key); if(!p) return;
    let price = v ? (v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p)) : automaticDiscountedPrice(p);
    price = couponDiscountedPrice(p, price);
    const diff = listPriceOf(p,v) - price;
    if(diff>0) total += diff*qty;
  });
  total += buyXPayYAdjustment();
  return Math.round(total);
}
function savingsLabel(p){
  const sv = unitSavings(p);
  if(!sv) return '';
  return `Ahorras ${moneyShort(sv)} (−${Math.round(sv/p.price*100)}%)`;
}

/* ============== CANTIDAD − / + EN LA TARJETA ==============
   Después de agregar un producto (sin variantes), el botón "Agregar" se convierte en un
   selector de cantidad, para sumar o quitar piezas sin abrir el carrito. */
function cardAction(p, kind){
  const base = kind==='mini' ? 'rel-add' : 'card-add';
  const hasVariants = p.variantGroups && p.variantGroups.length>0;
  if(p.stock<=0) return `<button class="${base}" disabled>Agotado</button>`;
  if(hasVariants) return `<button class="${base} alt" onclick="event.stopPropagation();openProductDetail('${p.id}')">Elegir opciones</button>`;
  const key = cartKey(p.id, null), qty = state.cart[key] || 0;
  if(qty>0) return `<div class="qty-step ${kind==='mini'?'mini':''}" onclick="event.stopPropagation()">
    <button aria-label="Quitar una pieza" onclick="event.stopPropagation();changeQty('${key}',-1)">−</button>
    <span aria-live="polite">${qty} <small>en tu carrito</small></span>
    <button aria-label="Agregar una pieza más" onclick="event.stopPropagation();addToCart('${p.id}')">+</button></div>`;
  return `<button class="${base}" onclick="event.stopPropagation();addToCart('${p.id}')">Agregar</button>`;
}

/* ============== POPULARES Y TARJETAS CHICAS ============== */
function popularProducts(n){
  const manual = (state.settings.featuredProductIds||[]).filter(id=>state.products.some(p=>p.id===id));
  const ids = manual.length ? manual : (state.settings.bestSellerProductIds||[]);
  const out = ids.map(id=>state.products.find(p=>p.id===id)).filter(p=>p && p.stock>0);
  if(out.length < n){
    const have = new Set(out.map(p=>p.id));
    dailyShuffledProducts().forEach(p=>{ if(out.length<n && !have.has(p.id) && p.stock>0 && !p.isMysteryBox){ out.push(p); have.add(p.id); } });
  }
  return out.slice(0, n);
}
// opts.close: bandera del estado a cerrar antes de abrir la ficha (cartOpen, quizOpen);
// opts.fromDetail: ya estamos en una ficha y se cambia a otra.
function renderMiniCard(p, opts){

    : `<div class="rel-fallback" style="background:${catColor(p.cat)}">${catIcon(p.cat)}</div>`;
  const pre = opts.close ? `state.${opts.close}=false;` : '';
  const open = opts.fromDetail ? `openRelated('${p.id}')` : `openProductDetail('${p.id}')`;
  return `<div class="rel-card" onclick="${pre}${open}">
    <div class="rel-img">${img}</div>
    <div class="rel-name">${p.name}</div>
    <div class="rel-price">${automaticDiscountedPrice(p)<p.price ? `<s style="color:var(--ink-soft);font-weight:500;font-size:11px;margin-right:4px;">${money(p.price)}</s>` : ''}${money(automaticDiscountedPrice(p))}</div>
    ${isKioskMode() ? '' : cardAction(p,'mini')}
  </div>`;
}

/* ============== AUTOCOMPLETADO DEL BUSCADOR ==============
   Se muestra solo mientras el campo tiene el cursor (CSS :focus-within), así no hace falta
   guardar nada en el estado. Sin texto: productos populares y categorías. Con texto: las mejores
   coincidencias con foto. */
function blurSearch(){ const a = document.activeElement; if(a && a.blur) a.blur(); }
function pickSuggestion(id){ blurSearch(); openProductDetail(id); }
function pickSuggestCat(c){ blurSearch(); goToCatalog(c); }
function closeSuggest(){ blurSearch(); requestAnimationFrame(()=>scrollToId('catalogo')); }
function suggestRow(p){

    ? `<img src="${p.images[0]}" alt="" loading="lazy">`

}
function renderSearchSuggest(){
  if(!state.products.length) return '';
  const q = state.searchQuery.trim();
  let inner = '';
  if(!q){
    const pop = popularProducts(4), cats = visibleCategories().slice(0,6);
    if(!pop.length && !cats.length) return '';
    inner = (pop.length ? `<div class="sg-title">Populares ahora</div>${pop.map(suggestRow).join('')}` : '')
      + (cats.length ? `<div class="sg-title">Categorías</div><div class="sg-chips">${cats.map(c=>`<button class="cat-chip" onclick="pickSuggestCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>` : '');
  } else {
    const res = searchProducts(q);
    if(!res.length) return '';
    inner = res.slice(0,6).map(suggestRow).join('')
      + `<button class="sg-all" onclick="closeSuggest()">Ver ${res.length===1?'el resultado':`los ${res.length} resultados`}</button>`;
  }
  return `<div class="suggest" onmousedown="event.preventDefault()">${inner}</div>`;
}

/* ============== PRODUCTOS RELACIONADOS ("Va muy bien con…") ============== */
function relatedProducts(p, n){
  const myNeeds = new Set(p.needs||[]), myCats = new Set(productCats(p));
  const partners = [];
  activePromotions().forEach(promo=>{
    if(promo.type==='cross_sell' && promo.triggerProductId===p.id){
      const q = state.products.find(x=>x.id===promo.discountProductId);
      if(q && q.stock>0) partners.push(q);
    }
  });
  const pop = new Set(popularProducts(12).map(x=>x.id));
  const scored = dailyShuffledProducts()
    .filter(x=>x.id!==p.id && x.stock>0 && !x.isMysteryBox)
    .map((x,i)=>{
      const shared = (x.needs||[]).filter(k=>myNeeds.has(k)).length;
      const sameCat = productCats(x).some(c=>myCats.has(c));
      let sc = shared*3 + (sameCat ? 1 : 2) + (shared>0 && !sameCat ? 3 : 0) + (pop.has(x.id) ? 2 : 0);
      return {x, sc, i};
    })
    .sort((a,b)=> b.sc-a.sc || a.i-b.i);
  const out = [...partners];
  for(const s of scored){ if(out.length>=n) break; if(!out.some(o=>o.id===s.x.id)) out.push(s.x); }
  return out.slice(0, n);
}
function renderRelatedBlock(p){
  const rel = relatedProducts(p, 4);
  if(!rel.length) return '';
  return `<div class="rel-block"><h3 class="rel-title">Va muy bien con…</h3><div class="rel-row">${rel.map(x=>renderMiniCard(x,{fromDetail:true})).join('')}</div></div>`;
}

}

/* ============== ZOOM DE FOTOS ==============
   Toca la foto principal para verla a pantalla completa: un toque acerca/aleja, pellizca para
   ampliar, arrastra para moverte y desliza (sin zoom) para cambiar de foto. El zoom se maneja
   directo en el DOM — no vuelve a dibujar la tienda — para que sea fluido. */
function openZoom(){ state.zoomPct = 100; state.zoomOpen = true; render(); }
function closeZoom(){ state.zoomOpen = false; render(); }
function zoomEls(){ return { sc: document.getElementById('zoom-scroll'), im: document.getElementById('zoom-img') }; }
function setZoomWidth(pct, cx, cy){
  const {sc, im} = zoomEls(); if(!sc || !im) return;
  pct = Math.max(100, Math.min(400, pct));
  const r0 = im.getBoundingClientRect();
  const fx = r0.width ? (cx - r0.left)/r0.width : .5, fy = r0.height ? (cy - r0.top)/r0.height : .5;
  im.style.width = pct + '%'; im.style.maxHeight = pct>100 ? 'none' : '';
  im.dataset.z = pct; state.zoomPct = pct;
  im.classList.toggle('zoomed', pct>100);
  const r1 = im.getBoundingClientRect();
  sc.scrollLeft += (r1.left + fx*r1.width) - cx;
  sc.scrollTop += (r1.top + fy*r1.height) - cy;
}
function zoomTap(e){
  const z = +e.currentTarget.dataset.z || 100;
  setZoomWidth(z>100 ? 100 : 250, e.clientX, e.clientY);
}
function zoomNav(d){
  const p = state.products.find(x=>x.id===state.detailProductId);
  const imgs = p && p.images && p.images.length ? p.images : null;
  if(!imgs || imgs.length<2) return;
  state.detailImageIndex = (state.detailImageIndex + d + imgs.length) % imgs.length;
  const {im} = zoomEls(); if(!im) return;
  im.src = imgs[state.detailImageIndex];
  im.style.width = ''; im.style.maxHeight = ''; im.dataset.z = 100; state.zoomPct = 100; im.classList.remove('zoomed');
  const c = document.getElementById('zoom-count'); if(c) c.textContent = `${state.detailImageIndex+1} / ${imgs.length}`;
}
function renderZoomLightbox(){
  const p = state.products.find(x=>x.id===state.detailProductId);
  const imgs = p && p.images && p.images.length ? p.images : null;
  if(!imgs) return '';
  const idx = Math.min(state.detailImageIndex, imgs.length-1);
  const z = state.zoomPct>100 ? state.zoomPct : 100;
  return `<div class="zoom-lb" role="dialog" aria-label="Foto ampliada">
    <div class="zoom-top"><span id="zoom-count">${imgs.length>1 ? `${idx+1} / ${imgs.length}` : ''}</span><button class="zoom-close" onclick="closeZoom()" aria-label="Cerrar">${icon('x',22)}</button></div>
    <div class="zoom-scroll" id="zoom-scroll"><img id="zoom-img" class="${z>100?'zoomed':''}" src="${imgs[idx]}" alt="${(p.name||'').replace(/"/g,'&quot;')}" data-z="${z}" style="${z>100?`width:${z}%;max-height:none;`:''}" draggable="false" onclick="zoomTap(event)"></div>
    ${imgs.length>1 ? `<button class="zoom-nav prev" onclick="zoomNav(-1)" aria-label="Foto anterior">‹</button><button class="zoom-nav next" onclick="zoomNav(1)" aria-label="Foto siguiente">›</button>` : ''}
    <div class="zoom-hint">Toca para acercar · pellizca para ampliar</div>
  </div>`;
}
let _zoomPinch = null, _zoomSwipe = null;
function _touchDist(e){ const a=e.touches[0], b=e.touches[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
document.addEventListener('touchstart', (e)=>{
  if(!(e.target.closest && e.target.closest('#zoom-scroll'))) return;
  const im = document.getElementById('zoom-img');
  if(e.touches.length===2){ _zoomPinch = {d:_touchDist(e), z:+(im&&im.dataset.z)||100}; _zoomSwipe = null; }
  else if(e.touches.length===1){ _zoomSwipe = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }
}, {passive:true});
document.addEventListener('touchmove', (e)=>{
  if(!_zoomPinch || e.touches.length!==2) return;
  e.preventDefault();
  const a=e.touches[0], b=e.touches[1];
  setZoomWidth(_zoomPinch.z * _touchDist(e)/_zoomPinch.d, (a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2);
}, {passive:false});
document.addEventListener('touchend', (e)=>{
  if(e.touches.length<2) _zoomPinch = null;
  if(_zoomSwipe && e.touches.length===0 && e.changedTouches.length===1){
    const im = document.getElementById('zoom-img');
    const z = +(im && im.dataset.z) || 100;
    const dx = e.changedTouches[0].clientX - _zoomSwipe.x, dy = e.changedTouches[0].clientY - _zoomSwipe.y;
    if(im && z<=100 && Math.abs(dx)>60 && Math.abs(dy)<50) zoomNav(dx<0 ? 1 : -1);
  }
  if(e.touches.length===0) _zoomSwipe = null;
}, {passive:true});
document.addEventListener('keydown', (e)=>{
  if(!state.zoomOpen) return;
  if(e.key==='Escape') closeZoom();
  else if(e.key==='ArrowRight') zoomNav(1);
  else if(e.key==='ArrowLeft') zoomNav(-1);
});

/* ============== QUIZ "ENCUENTRA TU PRODUCTO IDEAL" ==============
   Tres preguntas (para quién/ocasión, tipo de producto, presupuesto) y una recomendación con
   productos reales con existencia. Si hay pocos que cumplan todo, se amplía poco a poco la
   búsqueda (primero sin el presupuesto exacto, luego sin el tipo…) para nunca dejar la pantalla
   vacía, y se avisa. Todo sale de las necesidades, categorías y precios que ya hay en la tienda. */
const QUIZ_BUDGETS = [
  {k:'a', label:'Hasta $150', min:0, max:150},
  {k:'b', label:'$150 – $300', min:150, max:300},
  {k:'c', label:'$300 – $600', min:300, max:600},
  {k:'d', label:'Más de $600', min:600, max:null},
];
function openQuiz(){ state.quizAnswers = {need:null, cat:null, budget:null}; state.quizStep = 0; state.quizOpen = true; render(); }
function closeQuiz(){ state.quizOpen = false; render(); }
function quizAnswer(field, val){
  state.quizAnswers[field] = val; state.quizStep++;
  render();
  requestAnimationFrame(()=>{ const b = document.querySelector('.drawer.open .drawer-body'); if(b) b.scrollTop = 0; });
}
function quizBack(){ if(state.quizStep>0){ state.quizStep--; render(); } }
function quizResults(){
  const a = state.quizAnswers, b = QUIZ_BUDGETS.find(x=>x.k===a.budget);
  const pool = dailyShuffledProducts().filter(p=>p.stock>0 && !p.isMysteryBox);
  const price = p=>automaticDiscountedPrice(p);
  const okNeed = p=>!a.need || (p.needs||[]).includes(a.need);
  const okCat = p=>!a.cat || productCats(p).includes(a.cat);
  const okBud = p=>!b || ((b.min==null || price(p)>=b.min) && (b.max==null || price(p)<=b.max));
  const pop = new Set(popularProducts(30).map(p=>p.id));
  const levels = [[okNeed,okCat,okBud],[okNeed,okCat],[okNeed,okBud],[okNeed],[okCat,okBud],[okCat],[okBud],[]];
  const items = []; let exact = 0;
  levels.forEach((fs,li)=>{
    if(items.length>=6) return;
    const r = pool.filter(p=>fs.every(f=>f(p)) && !items.some(i=>i.id===p.id));
    r.sort((x,y)=>(pop.has(y.id)?1:0)-(pop.has(x.id)?1:0));
    if(li===0) exact = r.length;
    r.forEach(p=>{ if(items.length<6) items.push(p); });
  });
  return {items, exact};
}
function quizSummaryText(){
  const a = state.quizAnswers;
  const need = a.need ? ((state.settings.needs||DEFAULT_NEEDS).find(n=>n.key===a.need)||{}).label : null;
  const b = QUIZ_BUDGETS.find(x=>x.k===a.budget);
  return [need, a.cat, b ? b.label : null].filter(Boolean).join(' · ');
}
function applyQuizToCatalog(){
  const a = state.quizAnswers, b = QUIZ_BUDGETS.find(x=>x.k===a.budget);
  state.quizOpen = false;
  state.priceMin = b && b.min ? String(b.min) : '';
  state.priceMax = b && b.max ? String(b.max) : '';
  if(a.need) filterByNeed(a.need);
  else goToCatalog(a.cat || 'Todos');
}
function renderQuizDrawer(){
  const step = state.quizStep, a = state.quizAnswers;
  const head = `<div class="drawer-head"><h2>Encuentra tu producto ideal</h2><button class="close-x" onclick="closeQuiz()">${icon('x')}</button></div>`;
  if(step<3){
    const needs = state.settings.needs || DEFAULT_NEEDS;
    const cats = visibleCategories().slice(0,10);
    const Q = [
      {title:'¿Para quién o para qué ocasión es?', field:'need', opts:needs.map(n=>[n.key,n.label]), skip:'Estoy explorando'},
      {title:'¿Qué tipo de producto te llama más la atención?', field:'cat', opts:cats.map(c=>[c,c]), skip:'Sorpréndeme'},
      {title:'¿Cuánto quieres invertir?', field:'budget', opts:QUIZ_BUDGETS.map(x=>[x.k,x.label]), skip:'Sin presupuesto definido'},
    ][step];
    const sel = (v)=>String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `${head}
    <div class="drawer-body">
      <div class="quiz-progress"><span>Pregunta ${step+1} de 3</span><div class="quiz-dots">${[0,1,2].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div></div>
      <h3 class="quiz-q">${Q.title}</h3>
      <div class="quiz-opts">
        ${Q.opts.map(o=>`<button class="quiz-opt ${a[Q.field]===o[0]?'active':''}" onclick="quizAnswer('${Q.field}','${sel(o[0])}')">${o[1]}</button>`).join('')}
        <button class="quiz-opt quiz-skip" onclick="quizAnswer('${Q.field}',null)">${Q.skip}</button>
      </div>
      ${step>0 ? `<button class="btn-tertiary" style="margin-top:14px;" onclick="quizBack()">‹ Pregunta anterior</button>` : ''}
    </div>`;
  }
  const {items, exact} = quizResults();
  const summary = quizSummaryText();
  const wa = `Hola, hice el quiz de la tienda${summary?` (${summary})`:''} y me gustaría que me ayuden a elegir.`;
  return `${head}
    <div class="drawer-body">
      <h3 class="quiz-q" style="margin-bottom:4px;">Te recomendamos</h3>
      ${summary ? `<div class="quiz-sum">${summary}</div>` : ''}

      ${items.length ? `<div class="rel-grid">${items.map(p=>renderMiniCard(p,{close:'quizOpen'})).join('')}</div>` : `<div class="empty-state">Por ahora no encontramos productos con existencia. Escríbenos y te ayudamos.</div>`}
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px;">
        <button class="btn-primary" onclick="applyQuizToCatalog()">Ver todos en el catálogo</button>
        ${state.settings.whatsapp ? `<a class="hero-btn-outline" style="width:100%;text-decoration:none;gap:8px;" href="${waLink(wa)}" target="_blank" rel="noopener">${icon('whatsapp',17)} Pedir asesoría por WhatsApp</a>` : ''}
        <button class="btn-tertiary" onclick="openQuiz()">Hacer el quiz de nuevo</button>
      </div>
    </div>`;
}

/* ============== ORDEN DIARIO DEL CATÁLOGO ==============
   Para que el catálogo no se vea idéntico visita tras visita (antes siempre salía en el mismo
   orden alfabético), el orden base de los productos cambia una vez al día, solo, sin que Ale
   tenga que hacer nada: se calcula un valor "aleatorio" estable por producto a partir de su id
   + el número de día del año (misma fórmula para todos los visitantes ese día, así que no salta
   de un renglón a otro dentro del mismo día ni al usar "cargar más"). Al día siguiente cambia el
   día y con él el orden — no se inventa ni se altera ningún dato del producto, solo el orden en
   que se muestran productos reales que sí existen y sí están en tu catálogo. */
function dailySeed(){ return Math.floor(Date.now()/86400000); }
function seededRank(id, seed){
  let h = seed>>>0;
  const s = String(id||'');
  for(let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 2654435761); h = h>>>0; }
  h = Math.imul(h ^ (h>>>15), 2246822507); h = h>>>0;
  return h;
}
function dailyShuffledProducts(){
  const seed = dailySeed();
  return [...state.products].map(p=>({p, r: seededRank(p.id, seed)})).sort((a,b)=>a.r-b.r).map(x=>x.p);
}

/* ============== FILTRO DE RANGO DE PRECIO ==============
   Se combina con cualquier otro filtro activo (categoría, "para quién" o búsqueda) — nunca lo
   sustituye — comparando contra el precio que el cliente de verdad pagaría (ya con promociones
   y mayoreo aplicados), no el de lista. */
function priceFilterActive(){ return (state.priceMin!=='' && state.priceMin!=null) || (state.priceMax!=='' && state.priceMax!=null); }
function applyPriceFilter(products){
  if(!priceFilterActive()) return products;
  const min = (state.priceMin!=='' && state.priceMin!=null) ? Number(state.priceMin) : -Infinity;
  const max = (state.priceMax!=='' && state.priceMax!=null) ? Number(state.priceMax) : Infinity;
  return products.filter(p=>{ const price = automaticDiscountedPrice(p); return price>=min && price<=max; });
}
// setPriceFilter fuerza un render() completo del catálogo en cada tecla (para reflejar el
// filtro al instante), y ese render() reconstruye el input desde cero — eso le hacía perder el
// foco y el cursor, así que al seguir escribiendo el dígito nuevo no caía donde ibas escribiendo
// sino al final, dando la sensación de que el número "se reordenaba" solo. Se corrige igual que
// ya se hace en el buscador (onSearchInput): después de renderizar, se vuelve a enfocar el mismo
// input y se restaura la posición del cursor donde el usuario iba escribiendo.
function setPriceFilter(which, val){
  state[which] = val; state.gridRenderLimit = 20; render();
  const id = which==='priceMin' ? 'price-min-input' : 'price-max-input';
  const i = document.getElementById(id);
  if(i){ i.focus(); const pos = String(val).length; i.setSelectionRange(pos,pos); }
}
function clearPriceFilter(){ state.priceMin=''; state.priceMax=''; state.gridRenderLimit=20; render(); }
function applyPriceFilterFromPanel(){
  const mn = (document.getElementById('price-min-input')||{}).value||'';
  const mx = (document.getElementById('price-max-input')||{}).value||'';
  state.priceMin = mn.replace(/[^0-9]/g,''); state.priceMax = mx.replace(/[^0-9]/g,'');
  state.priceFilterOpen = false; state.gridRenderLimit = 20; render();
}
function setPricePreset(mn, mx){
  const a=document.getElementById('price-min-input'), b=document.getElementById('price-max-input');
  if(a) a.value = mn; if(b) b.value = mx;
}

function renderGridSection(){
  let filtered = dailyShuffledProducts();
  let heading = 'Catálogo completo';

  let emptyMsg = `No encontramos productos que coincidan. Prueba con otra búsqueda o <a style="color:var(--primary);font-weight:700;" href="${waLink('Hola, no encontré lo que buscaba en el catálogo, ¿me ayudan?')}" target="_blank">escríbenos por WhatsApp</a>.`;
  if(state.activeBestSellers){
    const manualIds = (state.settings.featuredProductIds||[]).filter(id=>state.products.some(p=>p.id===id));
    const idsList = manualIds.length ? manualIds : (state.settings.bestSellerProductIds||[]);
    filtered = idsList.map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
    heading = 'Más vendidos';
    showClearBtn = true;
    emptyMsg = `Todavía no tenemos suficientes ventas para armar esta lista. Mientras tanto, <a style="color:var(--primary);font-weight:700;" onclick="goToCatalog('Todos')">conoce el catálogo completo</a>.`;
  } else if(state.searchQuery.trim()){
    filtered = searchProducts(state.searchQuery, filtered);
    heading = `Resultados para "${state.searchQuery.trim()}"`;
  } else if(state.activeNeed){
    const need = (state.settings.needs||DEFAULT_NEEDS).find(n=>n.key===state.activeNeed);
    filtered = filtered.filter(p=>(p.needs||[]).includes(state.activeNeed));
    heading = need ? need.label : 'Catálogo completo';
    emptyMsg = `Aún no hemos elegido productos para esta opción. Prueba otra categoría o <a style="color:var(--primary);font-weight:700;" href="${waLink('Hola, no encontré lo que buscaba en el catálogo, ¿me ayudan?')}" target="_blank">escríbenos por WhatsApp</a>.`;
  } else if(state.activeCat!=="Todos"){
    filtered = filtered.filter(p=>productCats(p).includes(state.activeCat));
    heading = state.activeCat;
    emptyMsg = `Todavía no tenemos productos en esta categoría. Prueba otra categoría o <a style="color:var(--primary);font-weight:700;" href="${waLink('Hola, no encontré lo que buscaba en el catálogo, ¿me ayudan?')}" target="_blank">escríbenos por WhatsApp</a>.`;
    // Si Ale fijó un orden a mano para esta categoría (Productos → filtrar por categoría →
    // flechas), esos productos van primero en ese orden; el resto sigue mezclándose entre sí
    // como siempre (sort estable: los sin orden mantienen su posición relativa del shuffle).
    const cat = state.activeCat;
    filtered = filtered.slice().sort((a,b)=>{
      const ao = (a.categorySortOrder||{})[cat]; const bo = (b.categorySortOrder||{})[cat];
      const av = ao!=null ? ao : Infinity, bv = bo!=null ? bo : Infinity;
      return av - bv;
    });
  }
  // Los productos agotados se muestran hasta el final, sin alterar el orden entre sí.
  filtered = applyPriceFilter(filtered);
  filtered = filtered
    .map((p,i)=>({p,i}))
    .sort((a,b)=> (a.p.stock<=0)-(b.p.stock<=0) || a.i-b.i)
    .map(x=>x.p);
  const shown = filtered.slice(0, state.gridRenderLimit);
  const hasMore = filtered.length > shown.length;
  return `
  <div id="catalogo" class="section-block" style="padding-top:10px;">
    <div class="section-head-row" style="margin-bottom:14px;align-items:center;">
      <h2 class="section-heading" style="margin-bottom:0;">${heading}${filtered.length ? ` <span style="color:var(--ink-soft);font-weight:600;font-size:13px;">(${filtered.length})</span>` : ''}</h2>
      ${showClearBtn ? `<button class="btn-tertiary" onclick="goToCatalog('Todos')">${icon('grid',14)} Ver catálogo completo</button>` : ''}
    </div>
    ${renderPriceFilterRow()}
    ${filtered.length
      ? `<div class="grid">${shown.map(p=>renderProductCard(p, state.activeBestSellers)).join('')}</div>
         ${hasMore ? `
           <div class="load-more-wrap">
             <button class="load-more-btn" onclick="loadMoreProducts()">Ver más productos <span class="lm-chev">${icon('chevron-down',16)}</span></button>
             <span class="load-more-count">${filtered.length - shown.length} producto${filtered.length-shown.length===1?'':'s'} más te esperan</span>
           </div>
         ` : ''}`
      : (state.searchQuery.trim() && !state.activeBestSellers ? renderNoResults(state.searchQuery.trim()) : `<div class="empty-state">${emptyMsg}</div>`)}
  </div>`;
}

// Un producto se considera "Nuevo" durante sus primeros NEW_BADGE_DAYS días de vida, contados
// desde createdAt (solo lo tienen los productos creados desde esta actualización en adelante —
// no se les inventa una fecha a los que ya existían).
const NEW_BADGE_DAYS = 14;
function isNewProduct(p){
  if(!p.createdAt) return false;
  const days = (Date.now() - new Date(p.createdAt).getTime()) / 86400000;
  return days>=0 && days<=NEW_BADGE_DAYS;
}
/* ============== CUENTA REGRESIVA EN PROMOCIONES ==============
   Las promociones automáticas (state.settings.promotions) ya tenían fecha de fin opcional, pero
   nunca se comunicaba al cliente cuánto faltaba para que se acabara — solo dejaba de aplicarse
   en silencio. Ahora, si un producto entra en el alcance de una promo con fecha de fin, se
   muestra una cuenta regresiva junto al precio, usando la fecha más próxima entre las promos
   que le aplican. Un temporizador ligero refresca la pantalla mientras haya alguna cuenta
   regresiva visible, para que no se quede pegada en un número viejo. */
function soonestPromoEndDate(p){
  let soonest = null;
  activePromotions().forEach(promo=>{
    if(!promo.endDate) return;
    let applies = false;
    if(promo.type==='cross_sell') applies = promo.discountProductId===p.id || promo.triggerProductId===p.id;
    else applies = isPromoScopeEligible(p, promo);
    if(!applies) return;
    const end = new Date(promo.endDate+'T23:59:59');
    if(!soonest || end < soonest) soonest = end;
  });
  return soonest;
}
function formatPromoCountdown(endDate){
  const diffMs = endDate.getTime() - Date.now();
  if(diffMs <= 0) return null;
  const totalMinutes = Math.floor(diffMs/60000);
  const days = Math.floor(totalMinutes/1440);
  const hours = Math.floor((totalMinutes%1440)/60);
  const minutes = totalMinutes%60;
  if(days>=1) return `Termina en ${days} día${days===1?'':'s'}`;
  if(hours>=1) return `Termina en ${hours}h ${minutes}min`;
  return `Termina en ${minutes} min`;
}
function renderPromoCountdownBadge(p){
  const fl = flashFor(p);
  if(fl){ const lab = formatPromoCountdown(new Date(fl.sale.end)); return `<span class="badge badge-best promo-countdown" style="background:var(--rose);">⚡ ${lab||'Relámpago'}</span>`; }
  const end = soonestPromoEndDate(p);
  if(!end) return '';
  const label = formatPromoCountdown(end);
  if(!label) return '';
  return `<span class="badge badge-best promo-countdown" style="background:var(--rose);">⏳ ${label}</span>`;
}
let promoCountdownTimer = null;
function ensurePromoCountdownTimer(){
  const hasCountdown = flashLive().length>0 || state.products.some(p=>soonestPromoEndDate(p));
  if(hasCountdown && !promoCountdownTimer){
    promoCountdownTimer = setInterval(()=>{
      if(flashLive().length>0 || state.products.some(p=>soonestPromoEndDate(p))) render(); else { clearInterval(promoCountdownTimer); promoCountdownTimer = null; }
    }, 60000);
  } else if(!hasCountdown && promoCountdownTimer){
    clearInterval(promoCountdownTimer); promoCountdownTimer = null;
  }
}
// Antes se podían juntar hasta 7 insignias sobre la misma tarjeta (Nuevo, Más vendido, Combo,
// Caja sorpresa, Oferta, cuenta regresiva, Mayoreo, Agotado/Últimas piezas) — ilegible y le resta
// peso a la que de verdad importa. Aquí se arma la lista completa con una prioridad (lo que más
// ayuda a decidir una compra primero: disponibilidad y urgencia de precio) y se muestran máximo 2.
function renderProductBadges(p, ctx){
  const candidates = [];
  if(p.stock<=3) candidates.push({priority:1, html:`<span class="badge badge-stock">${p.stock===0?'Agotado':'Últimas piezas'}</span>`});
  const countdown = renderPromoCountdownBadge(p);
  if(countdown) candidates.push({priority:2, html:countdown});
  else if(ctx.hasPromo) candidates.push({priority:2, html:`<span class="badge badge-best" style="background:var(--rose);">Oferta</span>`});
  if(ctx.wholesaleEligible) candidates.push({priority:3, html:`<span class="badge badge-best" style="background:var(--navy);">${ctx.wholesaleUnlocked?'Mayoreo activo':'Mayoreo disponible'}</span>`});
  if(p.isKit) candidates.push({priority:4, html:`<span class="badge badge-best" style="background:var(--navy);">Combo</span>`});
  if(p.isMysteryBox) candidates.push({priority:4, html:`<span class="badge badge-best" style="background:var(--navy);">Caja sorpresa</span>`});
  if(ctx.isBest) candidates.push({priority:5, html:`<span class="badge badge-best">Más vendido</span>`});
  if(isNewProduct(p)) candidates.push({priority:6, html:`<span class="badge badge-best" style="background:var(--teal);">Nuevo</span>`});
  return candidates.sort((a,b)=>a.priority-b.priority).slice(0,2).map(c=>c.html).join('');
}
function renderProductCard(p, forceBest){
  const isBest = forceBest || (state.settings.featuredProductIds||[]).includes(p.id);
  const isGenericDesc = p.desc && /^Compra en línea .+ por \$[\d.,]+\.? Haz tu pedido y paga en línea\.?$/i.test(p.desc.trim());
  const hasVariants = p.variantGroups && p.variantGroups.length>0;
  const hasPromo = effectivePrice(p)<p.price;
  const tier = activeWholesaleTier();
  const wholesaleEligible = tier && isEligibleForTier(p, tier);
  const wholesaleUnlocked = wholesaleEligible && wholesaleCartProgress(tier).unlocked;
  return `
      <div class="card" onclick="openProductDetail('${p.id}')">
        <div class="card-media">
          <div class="card-image-wrap">
            ${productImageHtml(p)}
            <div class="badge-row">${renderProductBadges(p, {isBest, hasPromo, wholesaleEligible, wholesaleUnlocked})}</div>
          </div>
          ${isKioskMode() ? '' : `
          <button class="wishlist-fab" aria-label="Agregar a favoritos" onclick="event.stopPropagation();toggleWishlist('${p.id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="${isWishlisted(p.id)?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          </button>`}
        </div>
        <div class="card-body">
          <div class="card-cat">${productCats(p).join(', ')}</div>
          <h3 class="card-name">${p.name}</h3>
          ${p.desc && !isGenericDesc ? `<div class="card-desc">${p.desc}</div>` : ''}
          <div class="card-price">${automaticDiscountedPrice(p)<p.price ? `<s style="color:var(--ink-soft);font-weight:500;font-size:12px;margin-right:5px;">${money(p.price)}</s>${money(automaticDiscountedPrice(p))}` : money(p.price)}</div>
          ${savingsLabel(p) ? `<div class="card-save">${savingsLabel(p)}</div>` : ''}
          ${isKioskMode() ? '' : cardAction(p,'card')}
        </div>
      </div>`;
}

/* ============== COMPARAR PRODUCTOS LADO A LADO ==============
   Hasta 3 productos a la vez, elegidos desde su ficha de detalle (el botón de comparar, junto
   al de favoritos). En cuanto hay 2 o más, aparece una barra fija para abrir la comparación —
   igual que la barra del carrito — con precio, categoría, disponibilidad y descripción una al
   lado de la otra, para decidir entre opciones parecidas sin ir y venir entre fichas. */
const COMPARE_MAX = 3;
function isComparing(id){ return state.compareIds.includes(id); }
function toggleCompare(id){
  // El icono de "comparar" (las dos barras junto al corazón de favoritos) no tenía ninguna
  // confirmación visible al darle clic con un solo producto seleccionado — el único cambio era
  // el color del icono, muy fácil de pasar por alto — por eso parecía que "no hacía nada". Ahora
  // avisamos con un toast en cada clic para que quede claro qué pasó, y solo al llegar a 2
  // productos aparece además la barra "Ver comparación" para abrir el comparativo.
  if(isComparing(id)){
    state.compareIds = state.compareIds.filter(x=>x!==id);
    showToast('Quitado de comparar');
    render(); return;
  }
  if(state.compareIds.length >= COMPARE_MAX){ showToast(`Solo puedes comparar hasta ${COMPARE_MAX} productos a la vez`); return; }
  state.compareIds = [...state.compareIds, id];
  showToast(state.compareIds.length===1 ? 'Agregado a comparar. Elige otro producto para verlos lado a lado.' : `Agregado a comparar (${state.compareIds.length}/${COMPARE_MAX})`);
  render();
}
function clearCompare(){ state.compareIds = []; state.compareOpen = false; render(); }
function compareProducts(){ return state.compareIds.map(id=>state.products.find(p=>p.id===id)).filter(Boolean); }
function renderCompareBar(){
  if(state.compareIds.length < 2 || state.compareOpen) return '';
  return `

      <span class="mobile-cart-bar-count">Comparando ${state.compareIds.length} producto${state.compareIds.length===1?'':'s'}</span>
    </div>

}
