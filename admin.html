async function updateOrderStatus(id,status){
  const o=state.orders.find(x=>x.id===id); if(!o) return;
  const prevStatus = o.status;
  o.status=status;
  await saveOrdersStatus(id,status,o.source);
  if(status==='Cancelado' && prevStatus!=='Cancelado'){
    logAdminAction('cancelacion', o.source==='pos'?'venta':'pedido', formatFolio(o.orderNumber), `Total: ${money(o.total)}`);
  }
  // Cancelar una venta de Punto de Venta debe devolver al inventario lo que esa venta había
  // descontado al momento de cobrarse — si no, ese stock se pierde para siempre. Los pedidos
  // de la tienda en línea NUNCA descuentan stock al crearse (Ale lo ajusta a mano al
  // prepararlos), así que ahí cancelar no tiene nada que restaurar.
  if(o.source==='pos' && prevStatus!==status){
    if(status==='Cancelado' && prevStatus!=='Cancelado') await adjustStockForSale(o, 1);
    else if(prevStatus==='Cancelado' && status!=='Cancelado') await adjustStockForSale(o, -1);
  }
  render();
}
// sign=1 restaura stock (venta cancelada); sign=-1 lo vuelve a descontar (venta reactivada
// desde "Cancelado" a cualquier otro estado). Refleja exactamente el descuento que hace
// chargeSale() en pos.html: por variante (v.stock + p.stock) o por centro (stockByCenter + p.stock).
async function adjustStockForSale(sale, sign){
  const centerId = sale.centerId;
  const updates = [];
  const touchedComponentIds = [];
  (sale.items||[]).forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    const p = state.products.find(x=>x.id===it.id);
    if(!p) return;
    logStockMovement(p.id, sign>0?'cancelacion_pos':'reactivacion_pos', sign*it.qty, `Venta ${formatFolio(sale.orderNumber)}`);
    if(p.isKit){
      // Un kit no tiene stock propio por centro: cancelar/reactivar su venta ajusta a cada uno
      // de sus productos componentes, igual que se descontaron al venderse (ver chargeSale).
      (p.kitItems||[]).forEach(ki=>{
        const comp = state.products.find(x=>x.id===ki.productId);
        if(!comp) return;
        if(!comp.stockByCenter) comp.stockByCenter = {};
        if(centerId) comp.stockByCenter[centerId] = Math.max(0, (comp.stockByCenter[centerId]||0) + sign*(ki.qty||1)*it.qty);
        comp.stock = totalStock(comp);
        touchedComponentIds.push(comp.id);
        updates.push(db.collection('products').doc(comp.id).update({stockByCenter: comp.stockByCenter, stock: comp.stock}));
      });
    } else if(it.variantId){
      const v = (p.variants||[]).find(x=>x.id===it.variantId);
      if(v) v.stock = Math.max(0, (v.stock||0) + sign*it.qty);
      p.stock = Math.max(0, (p.stock||0) + sign*it.qty);
      updates.push(db.collection('products').doc(p.id).update({variants: p.variants, stock: p.stock}));
    } else {
      if(!p.stockByCenter) p.stockByCenter = {};
      if(centerId) p.stockByCenter[centerId] = Math.max(0, (p.stockByCenter[centerId]||0) + sign*it.qty);
      p.stock = Math.max(0, (p.stock||0) + sign*it.qty);
      updates.push(db.collection('products').doc(p.id).update({stockByCenter: p.stockByCenter, stock: p.stock}));
      touchedComponentIds.push(p.id);
    }
  });
  if(!updates.length) return;
  try{
    await Promise.all(updates);
    if(touchedComponentIds.length) await recomputeKitStocksFor(touchedComponentIds);
    showToast(sign>0 ? 'Inventario restaurado' : 'Inventario descontado de nuevo');
  }
  catch(e){ console.error('No se pudo ajustar el inventario de esta venta', e); showToast('No se pudo ajustar el inventario de esta venta'); }
}

async function saveCashierForm(){
  const name = document.getElementById('cash-name').value.trim();
  const email = document.getElementById('cash-email').value.trim();
  const role = document.getElementById('cash-role').value;
  const pin = document.getElementById('cash-pin').value.trim();
  if(!name){ showToast('Ponle un nombre'); return; }
  if(role==='cajero' && !pin){ showToast('Los cajeros necesitan un PIN para el Punto de Venta'); return; }
  if(role==='colaborador' && !email){ showToast('Los colaboradores necesitan el correo con el que van a iniciar sesión'); return; }
  if(role==='colaborador' && (state.user.email||'').trim().toLowerCase()===email.trim().toLowerCase()){ showToast('No puedes usar tu propio correo — te quedarías sin acceso completo'); return; }
  const notify = state.cashierModal.notify || {};
  const permissions = role==='colaborador' ? (state.cashierModal.permissions||{}) : {};
  const existing = state.cashierModal.id ? state.cashiers.find(c=>c.id===state.cashierModal.id) : null;
  const oldEmail = existing ? existing.email : null;
  const c = existing ? {...existing, name, email, role, pin, notify, permissions} : {name, email, role, pin, notify, permissions, active:true};
  await saveCashierDoc(c);
  // El acceso real siempre lo decide "staffPermissions", no la lista de cajeros: si el
  // rol dejó de ser "colaborador" o se cambió el correo, hay que revocar el correo anterior.
  await syncStaffPermissions(role==='colaborador' ? email : '', role==='colaborador' ? permissions : {}, oldEmail);
  if(!existing){
    logAdminAction('alta_personal', 'persona', name, role==='colaborador' ? `Colaborador · ${email}` : 'Cajero');
  }else if(role==='colaborador'){
    const changed = permissionsDiffSummary(existing.permissions||{}, permissions);
    if(changed) logAdminAction('cambio_permisos', 'persona', name, changed);
  }
  if(!existing) state.cashiers.push(c);
  else Object.assign(existing, {name, email, role, pin, notify, permissions});
  if(state.user && (state.user.email||'').trim().toLowerCase()===(email||'').trim().toLowerCase()) computeMyPermissions();
  state.cashierModal=null; showToast('Guardado'); render();
}
function permissionsDiffSummary(oldPerms, newPerms){
  const changes = [];
  PERMISSION_DEFS.forEach(def=>{
    const before = !!oldPerms[def.key], after = !!newPerms[def.key];
    if(before !== after) changes.push(`${def.label.split(' (')[0]}: ${before?'sí':'no'}→${after?'sí':'no'}`);
  });
  return changes.join(', ');
}
async function toggleCashierActive(id){
  const c = state.cashiers.find(x=>x.id===id); if(!c) return;
  c.active = !c.active; await saveCashierDoc(c);
  // Desactivar a un colaborador debe revocar su acceso real de inmediato, no solo la
  // etiqueta visual — si no, su cuenta de Firebase seguiría entrando con sus permisos viejos.
  if(c.role==='colaborador') await syncStaffPermissions(c.active ? c.email : '', c.active ? (c.permissions||{}) : {}, c.active ? null : c.email);
  logAdminAction(c.active?'activacion_personal':'desactivacion_personal', 'persona', c.name);
  computeMyPermissions(); render();
}
async function deleteCashier(id){
  const c = state.cashiers.find(x=>x.id===id);
  try{
    await deleteCashierDoc(id);
    // Igual que al desactivar: si era colaborador, hay que revocarle el acceso real,
    // no solo quitarlo de esta lista.
    if(c && c.role==='colaborador' && c.email) await syncStaffPermissions('', {}, c.email);
    if(c) logAdminAction('eliminacion_personal', 'persona', c.name);
    state.cashiers = state.cashiers.filter(c=>c.id!==id);
    showToast('Eliminado'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }
}

const CROP_SIZE = 280, CROP_OUT = 700;
let cropCtx = null;
function clampCropOffsets(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const dw = cropCtx.natW*scale, dh = cropCtx.natH*scale;
  cropCtx.offX = Math.min(0, Math.max(CROP_SIZE-dw, cropCtx.offX));
  cropCtx.offY = Math.min(0, Math.max(CROP_SIZE-dh, cropCtx.offY));
}
function updateCropImgTransform(){
  const el = document.getElementById('crop-img'); if(!el || !cropCtx) return;
  const scale = cropCtx.baseScale*cropCtx.zoom;
  el.style.width = (cropCtx.natW*scale)+'px';
  el.style.height = (cropCtx.natH*scale)+'px';
  el.style.transform = `translate(${cropCtx.offX}px, ${cropCtx.offY}px)`;
}
function handleImageFileSelected(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const baseScale = CROP_SIZE/Math.min(img.naturalWidth, img.naturalHeight);
      cropCtx = { img, natW:img.naturalWidth, natH:img.naturalHeight, zoom:1, baseScale, offX:0, offY:0 };
      cropCtx.offX = (CROP_SIZE - cropCtx.natW*baseScale)/2;
      cropCtx.offY = (CROP_SIZE - cropCtx.natH*baseScale)/2;
      clampCropOffsets();
      state.cropOpen = true; render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function cropPointerDown(e){
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.dragging = true; cropCtx.startX = pt.clientX; cropCtx.startY = pt.clientY;
  cropCtx.startOffX = cropCtx.offX; cropCtx.startOffY = cropCtx.offY;
}
function cropPointerMove(e){
  if(!cropCtx || !cropCtx.dragging) return;
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.offX = cropCtx.startOffX + (pt.clientX - cropCtx.startX);
  cropCtx.offY = cropCtx.startOffY + (pt.clientY - cropCtx.startY);
  clampCropOffsets();
  updateCropImgTransform();
}
function cropPointerUp(){ if(cropCtx) cropCtx.dragging = false; }
document.addEventListener('mousemove', cropPointerMove);
document.addEventListener('mouseup', cropPointerUp);
document.addEventListener('touchmove', cropPointerMove, {passive:false});
document.addEventListener('touchend', cropPointerUp);
function cropSetZoom(val){
  if(!cropCtx) return;
  cropCtx.zoom = parseFloat(val);
  clampCropOffsets(); updateCropImgTransform();
}
const MAX_IMG_BYTES = 90*1024; // peso máximo por imagen — más ajustado que antes para que el catálogo pese bastante menos en total, sin recurrir a un servicio de imágenes aparte
function dataUrlBytes(dataUrl){
  const b64 = dataUrl.slice(dataUrl.indexOf(',')+1);
  const len = b64.length;
  const padding = b64.endsWith('==') ? 2 : (b64.endsWith('=') ? 1 : 0);
  return Math.floor(len*3/4) - padding;
}
// Prueba calidades de mayor a menor hasta que el JPEG resultante quepa en maxBytes.
// Devuelve null si ni la calidad más baja alcanza (entonces hay que reducir resolución).
function canvasToLimitedJpeg(canvas, maxBytes){
  const qualities = [0.85,0.8,0.75,0.7,0.65,0.6,0.55,0.5,0.45,0.4,0.35,0.3,0.25,0.2];
  for(const q of qualities){
    const url = canvas.toDataURL('image/jpeg', q);
    if(dataUrlBytes(url) <= maxBytes) return url;
  }
  return null;
}
// "Aligerar fotos ya guardadas": recorre las fotos que ya están en tus productos y, a las que
// pesan más de lo necesario (por ejemplo, subidas antes de este ajuste), las vuelve a comprimir
// con el mismo tope nuevo — sin volver a pedirte que las recortes, solo achicando el archivo.
function scanForRecompress(){
  const candidates = [];
  state.products.forEach(p=>{
    (p.images||[]).forEach((img,idx)=>{
      if(typeof img==='string' && img.startsWith('data:image')){
        const bytes = dataUrlBytes(img);
        if(bytes > MAX_IMG_BYTES) candidates.push({productId:p.id, productName:p.name, imageIndex:idx, originalBytes:bytes});
      }
    });
  });
  state.recompressCandidates = candidates;
  state.recompressScanning = false;
  render();
}

function recompressOneImage(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const size = Math.min(img.width, img.height, CROP_OUT); // nunca agranda, solo achica o deja igual
      const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, size, size);
      let out = canvasToLimitedJpeg(canvas, MAX_IMG_BYTES);
      if(!out){
        const canvas2 = document.createElement('canvas'); canvas2.width=300; canvas2.height=300;
        const ctx2 = canvas2.getContext('2d');
        ctx2.fillStyle='#ffffff'; ctx2.fillRect(0,0,300,300);
        ctx2.drawImage(img,0,0,img.width,img.height,0,0,300,300);
        out = canvas2.toDataURL('image/jpeg', 0.3);
      }
      resolve(out);
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}
async function applyRecompress(){
  state.recompressProcessing = true; state.recompressProgress = 0; render();
  let savedBytes = 0, fixedCount = 0;
  const byProduct = {};
  state.recompressCandidates.forEach(c=>{ (byProduct[c.productId]=byProduct[c.productId]||[]).push(c); });
  const productIds = Object.keys(byProduct);
  for(let i=0;i<productIds.length;i++){
    const pid = productIds[i];
    const p = state.products.find(x=>x.id===pid);
    if(p){
      for(const c of byProduct[pid]){
        const original = p.images[c.imageIndex];
        if(!original) continue;
        const newUrl = await recompressOneImage(original);
        if(newUrl){
          const newBytes = dataUrlBytes(newUrl);
          if(newBytes < c.originalBytes){
            savedBytes += (c.originalBytes - newBytes);
            p.images[c.imageIndex] = newUrl;
            fixedCount++;
          }
        }
      }
      try{ await db.collection('products').doc(pid).update({images: p.images}); }
      catch(e){ console.error('No se pudo guardar', pid, e); }
    }
    state.recompressProgress = i+1; render();
  }
  state.recompressProcessing = false;
  state.recompressResult = { count: fixedCount, savedMB: (savedBytes/1024/1024).toFixed(1), products: productIds.length };
  render();
}
function renderRecompressModal(){
  const cands = state.recompressCandidates||[];
  const byProduct = {}; cands.forEach(c=>{ (byProduct[c.productId]=byProduct[c.productId]||[]).push(c); });
  const productCount = Object.keys(byProduct).length;
  const totalOriginalMB = (cands.reduce((s,c)=>s+c.originalBytes,0)/1024/1024).toFixed(1);
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:480px;">
      <h3>Aligerar fotos ya guardadas</h3>

        state.recompressResult ? `

        ` : cands.length===0 ? `
          <div class="empty-state">Todas tus fotos ya están dentro del peso ideal — no hay nada que aligerar.</div>
        ` : `
          <div class="note-box">Se encontraron ${cands.length} foto(s) en ${productCount} producto(s) más pesadas de lo necesario (suman ~${totalOriginalMB} MB). Se van a achicar un poco en tamaño y calidad — se siguen viendo bien, solo pesan menos. Puede tardar varios minutos según cuántas sean; no cierres esta ventana mientras corre.</div>
        `}
      <div class="modal-actions">
        <button class="btn-cancel" ${state.recompressProcessing?'disabled':''} onclick="closeRecompressTool()">Cerrar</button>
        ${!state.recompressScanning && !state.recompressResult && cands.length>0 ? `<button class="btn-primary" style="flex:1;" ${state.recompressProcessing?'disabled':''} onclick="applyRecompress()">${state.recompressProcessing?`Aligerando… ${state.recompressProgress}/${productCount}`:'Aligerar ahora'}</button>` : ''}
      </div>
    </div>
  </div>`;
}
function applyCrop(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const sx = -cropCtx.offX/scale, sy = -cropCtx.offY/scale, ssize = CROP_SIZE/scale;
  // Primero se intenta con la resolución normal (700x700) bajando la calidad; solo si una imagen
  // muy detallada no cabe ni en la calidad más baja, se reduce el tamaño y se repite.
  // Se rellena el canvas de blanco antes de dibujar: el formato de salida es JPEG (sin canal
  // alfa), así que si la foto original tiene fondo transparente (PNG), sin este relleno esas
  // zonas se verían negras en vez de blancas al exportar.
  let outSize = CROP_OUT, dataUrl = null;
  while(outSize >= 300 && !dataUrl){
    const canvas = document.createElement('canvas'); canvas.width=outSize; canvas.height=outSize;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,outSize,outSize);
    ctx.drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, outSize, outSize);
    dataUrl = canvasToLimitedJpeg(canvas, MAX_IMG_BYTES);
    if(!dataUrl) outSize = Math.round(outSize*0.85);
  }
  if(!dataUrl){
    // último recurso (imagen extremadamente compleja): tamaño mínimo, calidad mínima, se acepta lo que salga
    const canvas = document.createElement('canvas'); canvas.width=300; canvas.height=300;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,300,300);
    ctx.drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, 300, 300);
    dataUrl = canvas.toDataURL('image/jpeg', 0.2);
  }
  if(!state.productModal.images) state.productModal.images = [];
  if(state.productModal.images.length>=10){ showToast('Máximo 10 imágenes por producto'); }
  else state.productModal.images.push(dataUrl);
  state.cropOpen = false; cropCtx = null; render();
}
function removeImage(idx){ state.productModal.images.splice(idx,1); render(); }
function moveImage(idx,dir){
  const arr = state.productModal.images;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]]; render();
}

/* ============== CORRECCIÓN DE FOTOS CON FONDO NEGRO ==============
   Bug histórico: el recorte de imágenes (applyCrop, arriba) exportaba a JPEG sin rellenar
   fondo blanco antes — cualquier foto con transparencia (PNG) quedaba con esas zonas en negro,
   porque JPEG no tiene canal alfa y el navegador las pinta de negro por defecto al convertir.
   Ya se corrigió para las fotos nuevas (applyCrop ahora rellena de blanco antes de dibujar).
   Esta herramienta es para arreglar las fotos que ya quedaron guardadas así: revisa cada foto
   de cada producto, detecta las que tienen negro puro pegado a los 4 bordes (la firma de este
   bug en particular) y, para las que se confirmen, rellena esas zonas de blanco con un flood
   fill desde el borde — mismo tamaño y mismo límite de peso de siempre, no se toca nada más
   del producto. */
const BGFIX_SAMPLE_SIZE = 60; // miniatura usada solo para decidir qué fotos son candidatas (rápido)
const BGFIX_BLACK_THRESHOLD = 14; // 0-255: qué tan oscuro debe ser un pixel para contar como "negro puro"

function bgFixSampleIsBlackBorder(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const pts = [
    [1,1],[w-2,1],[1,h-2],[w-2,h-2],
    [Math.floor(w/2),1],[Math.floor(w/2),h-2],[1,Math.floor(h/2)],[w-2,Math.floor(h/2)],
  ];
  let darkCount = 0;
  pts.forEach(([x,y])=>{
    const d = ctx.getImageData(x,y,1,1).data;
    if((d[0]+d[1]+d[2])/3 <= BGFIX_BLACK_THRESHOLD) darkCount++;
  });
  return darkCount >= 6;
}
function loadImageAsync(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function openBgFixTool(){
  state.bgFixOpen = true; state.bgFixScanning = true; state.bgFixCandidates = []; state.bgFixResult = null;
  state.bgFixScanProgress = 0;
  render();
  const jobs = [];
  state.products.forEach(p=>{ (p.images||[]).forEach((src,idx)=>{ jobs.push({productId:p.id, productName:p.name, imageIndex:idx, src}); }); });
  state.bgFixScanTotal = jobs.length;
  const candidates = [];
  for(const job of jobs){
    try{
      const img = await loadImageAsync(job.src);
      const c = document.createElement('canvas'); c.width=BGFIX_SAMPLE_SIZE; c.height=BGFIX_SAMPLE_SIZE;
      c.getContext('2d').drawImage(img, 0, 0, BGFIX_SAMPLE_SIZE, BGFIX_SAMPLE_SIZE);
      if(bgFixSampleIsBlackBorder(c)) candidates.push({...job, checked:true});
    }catch(e){ /* imagen ilegible, se ignora */ }
    state.bgFixScanProgress++;
    if(state.bgFixScanProgress % 15 === 0) render();
  }
  state.bgFixCandidates = candidates;
  state.bgFixScanning = false;
  render();
}

function toggleBgFixAll(checked){ state.bgFixCandidates.forEach(c=>c.checked=checked); render(); }
// Rellena de blanco, con flood fill desde los bordes, cualquier zona conectada de negro puro —
// así solo se corrige el fondo (que siempre toca los 4 bordes en un recorte cuadrado), sin
// tocar el producto en sí aunque tenga partes negras, mientras no estén pegadas al borde.
function floodFillBlackBorderToWhite(canvas, threshold){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const visited = new Uint8Array(w*h);
  const stack = [];
  function isBlack(i){ const p=i*4; return (data[p]+data[p+1]+data[p+2])/3 <= threshold; }
  function seed(x,y){
    if(x<0||y<0||x>=w||y>=h) return;
    const i = y*w+x;
    if(visited[i]) return;
    if(isBlack(i)){ visited[i]=1; stack.push(i); }
  }
  for(let x=0;x<w;x++){ seed(x,0); seed(x,h-1); }
  for(let y=0;y<h;y++){ seed(0,y); seed(w-1,y); }
  while(stack.length){
    const i = stack.pop();
    const x = i % w, y = (i - x) / w;
    const p = i*4;
    data[p]=255; data[p+1]=255; data[p+2]=255;
    seed(x+1,y); seed(x-1,y); seed(x,y+1); seed(x,y-1);
  }
  ctx.putImageData(imgData,0,0);
}
async function applyBgFix(){
  const selected = state.bgFixCandidates.filter(c=>c.checked);
  if(selected.length===0){ showToast('No hay ninguna foto seleccionada'); return; }
  state.bgFixProcessing = true; state.bgFixProgress = 0; render();
  const byProduct = {};
  for(const c of selected){
    try{
      const img = await loadImageAsync(c.src);
      const size = Math.max(img.naturalWidth, img.naturalHeight, 300);
      const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, 0, 0);
      // Umbral más permisivo que la detección, para limpiar también el halo gris oscuro que
      // suele quedar en el borde entre el producto y el fondo negro original.
      floodFillBlackBorderToWhite(canvas, 60);
      const newUrl = canvasToLimitedJpeg(canvas, MAX_IMG_BYTES) || canvas.toDataURL('image/jpeg', 0.6);
      const p = state.products.find(x=>x.id===c.productId);
      if(p && p.images && p.images[c.imageIndex]!==undefined){
        p.images[c.imageIndex] = newUrl;
        (byProduct[c.productId] = byProduct[c.productId] || []).push(c.imageIndex);
      }
    }catch(e){ console.error('No se pudo corregir una imagen', e); }
    state.bgFixProgress++;
    if(state.bgFixProgress % 5 === 0) render();
  }
  const productIds = Object.keys(byProduct);
  let saved = 0, failed = 0;
  for(const id of productIds){
    const p = state.products.find(x=>x.id===id);
    if(!p) continue;
    try{ await db.collection('products').doc(id).update({images: p.images}); saved++; }
    catch(e){ console.error(e); failed++; }
  }
  state.bgFixProcessing = false;
  state.bgFixResult = { photos: selected.length, products: productIds.length, failed };
  state.bgFixCandidates = state.bgFixCandidates.filter(c=>!c.checked);
  render();
  showToast(`Se corrigieron ${selected.length} foto(s) en ${saved} producto(s)`);
}

/* ============== CSV IMPORT ============== */
function parseCSV(text){
  const rows = []; let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQuotes=false;i++;continue; }
      field+=c; i++; continue;
    }else{
      if(c === '"'){ inQuotes=true; i++; continue; }
      if(c === ','){ row.push(field); field=''; i++; continue; }
      if(c === '\n' || c === '\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function rowsToProducts(rows){
  if(!rows.length) return [];
  let start = 0;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const hasHeader = header.some(h=>h.includes('nombre')) || header.some(h=>h.includes('precio'));
  let colMap = {name:0,cat:1,price:2,stock:3,desc:4};
  if(hasHeader){
    start = 1;
    header.forEach((h,idx)=>{
      if(h.includes('nombre')) colMap.name=idx;
      else if(h.includes('categor')) colMap.cat=idx;
      else if(h.includes('precio')) colMap.price=idx;
      else if(h.includes('stock')||h.includes('existenc')) colMap.stock=idx;
      else if(h.includes('desc')) colMap.desc=idx;
    });
  }
  const out = [];
  for(let r=start;r<rows.length;r++){
    const row = rows[r];
    const name = (row[colMap.name]||'').trim();
    if(!name) continue;
    const cat = (row[colMap.cat]||'Otros').trim() || 'Otros';
    const price = Number((row[colMap.price]||'0').replace(/[^0-9.]/g,'')) || 0;
    const stock = Number((row[colMap.stock]||'0').replace(/[^0-9]/g,'')) || 0;
    const desc = (row[colMap.desc]||'').trim();
    out.push({name,cat,price,stock,desc});
  }
  return out;
}
/* ============== IMPORTAR ARCHIVO (unificado) ==============
   Antes había tres botones: "Importar archivo" (CSV de 5 columnas), "Importar descripciones
   (Tiendanube)" e "Importar variantes (Tiendanube)". Ahora uno solo detecta qué le subiste:
   - JSON (el mismo formato que genera "Exportar productos"): trae todos los campos de cada
     producto — nombre, categorías, precio, costo, stock, descripción, etiquetas, variantes.
     Empareja por "id" si lo trae, si no por nombre; si no encuentra el producto, lo crea.
   - CSV de Tiendanube (tiene la columna "Identificador de URL"): de ahí se sacan a la vez
     descripción y variantes (lo que antes hacían los dos importadores de Tiendanube por
     separado), reusando exactamente el mismo análisis de columnas ya probado. Solo actualiza
     productos que ya existen en tu catálogo (emparejados por nombre) — no crea nuevos.
   - CSV simple de 5 columnas (nombre, categoría, precio, stock, descripción), igual que antes.
   En los tres casos se arma una vista previa con una fila por producto y una casilla para
   elegir qué aplicar — nada se guarda sin que la revises primero. */
function detectImportFormat(rawText){
  const trimmed = (rawText||'').trim();
  if(!trimmed) return {type:'empty'};
  if(trimmed[0]==='[' || trimmed[0]==='{'){
    try{ const json = JSON.parse(trimmed); return {type:'json', data: Array.isArray(json)?json:[json]}; }
    catch(e){ /* no era JSON válido — sigue intentando como CSV */ }
  }
  const rows = parseCSV(trimmed);
  if(!rows.length) return {type:'empty'};
  const header = rows[0].map(h=>h.trim().toLowerCase());
  if(header.indexOf('identificador de url')>=0) return {type:'tiendanube', rawText:trimmed};
  return {type:'simple', rows};
}
function buildSimpleImportRows(rows){
  const products = rowsToProducts(rows);
  const byNorm = {};
  state.products.forEach(p=>{ const k=normName(p.name); (byNorm[k]=byNorm[k]||[]).push(p); });
  return products.map((p,idx)=>{
    const candidates = byNorm[normName(p.name)];
    const existing = candidates && candidates.length===1 ? candidates[0] : null;
    const ambiguous = !!(candidates && candidates.length>1);
    const patch = {name:p.name, cat:p.cat, price:p.price, stock:p.stock, desc:p.desc};
    const summary = [`Precio ${money(p.price)}`, `Stock ${p.stock}`, p.desc?'Descripción':''].filter(Boolean).join(' · ');
    return {key:'s'+idx, productId: (existing&&!ambiguous)?existing.id:null, name:p.name, isNew:!existing, ambiguous, summary, patch, checked:true};
  });
}
function buildTiendanubeImportRows(rawText){
  const descRows = parseTiendanubeDescCSV(rawText) || [];
  const variantGroups = parseTiendanubeVariantGroups(rawText) || [];
  const byNorm = {};
  state.products.forEach(p=>{ const k=normName(p.name); (byNorm[k]=byNorm[k]||[]).push(p); });
  const combined = {};
  descRows.forEach(r=>{ if(!r.descHtml) return; const k=normName(r.name); combined[k]=combined[k]||{name:r.name}; combined[k].descHtml=r.descHtml; });
  variantGroups.forEach(g=>{ if(!g.variants||!g.variants.length) return; const k=normName(g.name); combined[k]=combined[k]||{name:g.name}; combined[k].variantGroup=g; });
  const out = []; let unmatched = 0, ambiguousCount = 0;
  Object.values(combined).forEach((g,idx)=>{
    const candidates = byNorm[normName(g.name)];
    const ambiguous = !!(candidates && candidates.length>1);
    const existing = candidates && candidates.length===1 ? candidates[0] : null;
    if(!existing){ ambiguous ? ambiguousCount++ : unmatched++; return; } // el import de Tiendanube solo actualiza productos que ya existen
    const patch = {}; const summaryParts = [];
    if(g.descHtml){
      const newDesc = htmlDescToPlainText(g.descHtml);
      const oldDesc = (existing.desc||'').trim();
      if(newDesc && newDesc!==oldDesc){ patch.desc = newDesc; summaryParts.push(!oldDesc?'Descripción nueva':'Descripción actualizada'); }
    }
    if(g.variantGroup){
      const variants = g.variantGroup.variants.map(v=>({id:uid('var_'), combo:v.combo, sku:'', priceOverride:v.price, stock:v.stock}));
      patch.variantGroups = g.variantGroup.groups; patch.variants = variants;
      patch.stock = variants.reduce((s,v)=>s+(v.stock||0),0);
      summaryParts.push(`${variants.length} variante(s)`);
    }
    if(!Object.keys(patch).length) return;
    out.push({
      key:'t'+idx, productId: existing.id, name: g.name, isNew:false, ambiguous:false,
      summary: summaryParts.join(' · '), patch,
      checked: (!!patch.desc && (!existing.desc || looksTruncatedDesc(existing.desc))) || (!!patch.variantGroups && !(existing.variants&&existing.variants.length)),
    });
  });
  return {rows: out, unmatched, ambiguous: ambiguousCount};
}
function buildJsonImportRows(data){
  const byNorm = {};
  state.products.forEach(p=>{ const k=normName(p.name); (byNorm[k]=byNorm[k]||[]).push(p); });
  const FIELDS = ['name','cat','categories','price','promoPrice','cost','stock','desc','needs','sku','variantGroups','variants','stockByCenter'];
  return data.map((item,idx)=>{
    const existing = item.id ? state.products.find(p=>p.id===item.id) : null;
    const byName = !existing && item.name ? byNorm[normName(item.name)] : null;
    const ambiguous = !!(byName && byName.length>1);
    const matched = existing || (byName && byName.length===1 ? byName[0] : null);
    const patch = {};
    FIELDS.forEach(f=>{ if(item[f]!==undefined) patch[f]=item[f]; });
    const summaryParts = [];
    if(patch.price!==undefined) summaryParts.push('Precio '+money(patch.price));
    if(patch.stock!==undefined) summaryParts.push('Stock '+patch.stock);
    if(patch.desc!==undefined) summaryParts.push('Descripción');
    if(patch.variants!==undefined) summaryParts.push(`${(patch.variants||[]).length} variante(s)`);
    return {
      key:'j'+idx, productId: (matched&&!ambiguous)?matched.id:null, name: item.name||(matched?matched.name:'(sin nombre)'),
      isNew: !matched, ambiguous, summary: summaryParts.join(' · ') || 'Todos los campos', patch, checked:true,
    };
  });
}
function buildImportPreview(rawText){
  const detected = detectImportFormat(rawText);
  if(detected.type==='empty') return {kind:'empty', rows:[], unmatched:0, ambiguous:0};
  if(detected.type==='json') return {kind:'json', rows: buildJsonImportRows(detected.data), unmatched:0, ambiguous: buildJsonImportRows(detected.data).filter(r=>r.ambiguous).length};
  if(detected.type==='tiendanube'){ const r = buildTiendanubeImportRows(detected.rawText); return {kind:'tiendanube', rows:r.rows, unmatched:r.unmatched, ambiguous:r.ambiguous}; }
  const rows = buildSimpleImportRows(detected.rows);
  return {kind:'simple', rows, unmatched:0, ambiguous: rows.filter(r=>r.ambiguous).length};
}
function handleImportFile(input){
  const file = input.files[0]; if(!file) return;
  state.importFileName = file.name;
  const reader = new FileReader();
  reader.onload = e=>{ state.importText = e.target.result; Object.assign(state, {importResult: buildImportPreview(state.importText)}); render(); };
  reader.readAsText(file);
}
function handleImportTextChange(val){
  state.importText = val; state.importFileName='';
  state.importResult = buildImportPreview(val);

}
function toggleImportRow(key, checked){
  const r = (state.importResult&&state.importResult.rows||[]).find(x=>x.key===key);
  if(r) r.checked = checked;
}
function toggleImportAll(checked){
  (state.importResult&&state.importResult.rows||[]).forEach(r=>{ if(!r.ambiguous) r.checked=checked; });
  render();
}
async function commitImport(mode){
  const rows = (state.importResult&&state.importResult.rows||[]).filter(r=>r.checked && !r.ambiguous);
  if(rows.length===0){ showToast('No hay productos seleccionados para importar'); return; }
  const newCats = new Set(mode==='replace' ? [] : state.settings.categories);
  const addCatsFrom = (obj)=>{ if(obj.cat) newCats.add(obj.cat); (obj.categories||[]).forEach(c=>newCats.add(c)); };
  try{
    if(mode==='replace'){
      const batchDel = db.batch();
      state.products.forEach(p=>batchDel.delete(db.collection('products').doc(p.id)));
      await batchDel.commit();
      const newProducts = [];
      for(let i=0;i<rows.length;i+=400){
        const chunk = rows.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(r=>{
          const ref = db.collection('products').doc();
          const fresh = {name:r.name, cat:'Otros', price:0, stock:0, desc:'', images:[], needs:[], ...r.patch};
          addCatsFrom(fresh);
          batch.set(ref, fresh);
          newProducts.push({id:ref.id, ...fresh});
        });
        await batch.commit();
      }
      state.products = newProducts;
    }else{
      for(let i=0;i<rows.length;i+=400){
        const chunk = rows.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(r=>{
          if(r.productId){
            const existing = state.products.find(p=>p.id===r.productId);
            if(existing){ Object.assign(existing, r.patch); addCatsFrom(existing); }
            batch.update(db.collection('products').doc(r.productId), r.patch);
          }else{
            const ref = db.collection('products').doc();
            const fresh = {name:r.name, cat:'Otros', price:0, stock:0, desc:'', images:[], needs:[], ...r.patch};
            addCatsFrom(fresh);
            batch.set(ref, fresh);
            state.products.push({id:ref.id, ...fresh});
          }
        });
        await batch.commit();
      }
    }
    state.settings.categories = Array.from(newCats);
    await saveSettings();
    state.importOpen=false; state.importPreview=[]; state.importText=''; state.importFileName=''; state.importResult=null;
    showToast(`${rows.length} producto(s) importado(s)/actualizado(s)`);
    render();
  }catch(e){ console.error(e); showToast('Ocurrió un error al importar: '+(e.message||'error desconocido')); }
}

/* ============== LISTAS LARGAS: "ver más" ============== */
// Helper genérico para no renderizar de golpe listas que pueden tener cientos de
// filas (bajo stock, catálogo completo, pedidos, clientes...). Cada lista tiene su
// propia llave en `state` que recuerda cuántos elementos se han revelado; se resetea
// llamando resetShowMore(key) cuando cambia el filtro/búsqueda que la alimenta.
const SHOW_MORE_PAGE_SIZE = 20;
function showMoreSlice(key, items, pageSize){
  pageSize = pageSize || SHOW_MORE_PAGE_SIZE;
  if(state[key]==null) state[key] = pageSize;
  return { shown: items.slice(0, state[key]), remaining: Math.max(0, items.length - state[key]) };
}
function renderShowMoreButton(key, remaining, pageSize){
  pageSize = pageSize || SHOW_MORE_PAGE_SIZE;
  if(remaining<=0) return '';
  return `<button class="btn-ver-mas" onclick="state.${key}=(state.${key}||${pageSize})+${pageSize};render()">Ver más (${remaining} más)</button>`;
}
function resetShowMore(key){ state[key] = SHOW_MORE_PAGE_SIZE; }

/* ============== MÉTRICAS ============== */
function computeMetrics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const cancelled = state.orders.filter(o=>o.status==='Cancelado');
  const totalRevenue = valid.reduce((s,o)=>s+o.total,0);
  const avgOrder = valid.length ? totalRevenue/valid.length : 0;
  const avgItems = valid.length ? valid.reduce((s,o)=>s+o.items.reduce((a,it)=>a+it.qty,0),0)/valid.length : 0;
  const pending = state.orders.filter(o=>['Nuevo','Preparando','En camino'].includes(o.status)).length;
  const lowStock = state.products.filter(p=>p.stock<=(p.lowStockThreshold>0?p.lowStockThreshold:3));
  const cancelRate = state.orders.length ? Math.round((cancelled.length/state.orders.length)*100) : 0;

  const byPhone = {};
  state.orders.forEach(o=>{ if(!o.phone) return; (byPhone[o.phone] = byPhone[o.phone]||[]).push(o); });
  const uniqueCustomers = Object.keys(byPhone).length;
  const repeatCustomers = Object.values(byPhone).filter(list=>list.length>1).length;
  const repeatRate = uniqueCustomers ? Math.round((repeatCustomers/uniqueCustomers)*100) : 0;
  const topCustomers = Object.entries(byPhone).map(([phone,list])=>({
    phone, name:list[0].customer, spend: list.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0), count:list.length
  })).sort((a,b)=>b.spend-a.spend).slice(0,5);

  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const dayRevenue = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=d && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: rev}; });

  const months = []; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-i); months.push(d); }
  const monthRevenue = months.map((m,idx)=>{
    const next = idx<months.length-1 ? months[idx+1] : new Date(m.getFullYear(), m.getMonth()+1, 1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=m && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: m.toLocaleDateString('es-MX',{month:'short'}), value: rev};
  });

  const now = new Date();
  const startThis = new Date(now); startThis.setDate(now.getDate()-6); startThis.setHours(0,0,0,0);
  const startLast = new Date(startThis); startLast.setDate(startThis.getDate()-7);
  const revThis = valid.filter(o=>new Date(o.date)>=startThis).reduce((s,o)=>s+o.total,0);
  const revLast = valid.filter(o=>{const d=new Date(o.date); return d>=startLast && d<startThis;}).reduce((s,o)=>s+o.total,0);
  const revDelta = revLast>0 ? Math.round(((revThis-revLast)/revLast)*100) : (revThis>0?100:0);

  const catUnits = {}, catRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.id);
    const cat = prod ? prod.cat : 'Otros';
    catUnits[cat] = (catUnits[cat]||0)+it.qty;
    catRevenue[cat] = (catRevenue[cat]||0)+it.price*it.qty;
  }));
  const catUnitRows = Object.entries(catUnits).sort((a,b)=>b[1]-a[1]);
  const catRevRows = Object.entries(catRevenue).sort((a,b)=>b[1]-a[1]);
  const maxCatUnit = catUnitRows.length ? catUnitRows[0][1] : 1;
  const maxCatRev = catRevRows.length ? catRevRows[0][1] : 1;

  const prodUnits = {}, prodRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{ prodUnits[it.name]=(prodUnits[it.name]||0)+it.qty; prodRevenue[it.name]=(prodRevenue[it.name]||0)+it.price*it.qty; }));
  const topByUnits = Object.entries(prodUnits).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topByRevenue = Object.entries(prodRevenue).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const soldNames = new Set(Object.keys(prodUnits));
  const noSales = state.products.filter(p=>!soldNames.has(p.name));

  const weekdayTotals = [0,0,0,0,0,0,0]; const weekdayCounts=[0,0,0,0,0,0,0];
  valid.forEach(o=>{ const d=new Date(o.date).getDay(); weekdayTotals[d]+=o.total; weekdayCounts[d]+=1; });
  const weekdayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const weekdayAvg = weekdayTotals.map((t,i)=> weekdayCounts[i] ? t/weekdayCounts[i] : 0);
  const bestDayIdx = weekdayAvg.indexOf(Math.max(...weekdayAvg));

  const inventoryValue = state.products.reduce((s,p)=>s+p.price*p.stock,0);
  const invByCat = {};
  state.products.forEach(p=>{ invByCat[p.cat]=(invByCat[p.cat]||0)+p.price*p.stock; });
  const invRows = Object.entries(invByCat).sort((a,b)=>b[1]-a[1]);
  const maxInv = invRows.length ? invRows[0][1] : 1;

  const statusCounts = {}; STATUS_FLOW.forEach(s=>statusCounts[s]=0);
  state.orders.forEach(o=>statusCounts[o.status]=(statusCounts[o.status]||0)+1);

  const expiringOrExpired = state.products.filter(p=>{
    if(!p.expirationDate) return false;
    const days = Math.ceil((new Date(p.expirationDate+'T00:00:00') - new Date())/86400000);
    return days<=30;
  }).length;

  // Comparación mes contra mes (calendario, no "últimos 30 días"): este mes de corrido vs. el
  // mismo tramo de días del mes pasado, para que la comparación sea justa aunque el mes actual
  // todavía no termine (ej. comparar los primeros 12 días de este mes contra los primeros 12
  // días del mes pasado, no el mes pasado completo).
  const startOfThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfLastMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const sameDayLastMonth = new Date(now.getFullYear(), now.getMonth()-1, now.getDate(), 23,59,59,999);
  const ordersThisMonth = valid.filter(o=>new Date(o.date)>=startOfThisMonth);
  const ordersLastMonthSameSpan = valid.filter(o=>{ const d=new Date(o.date); return d>=startOfLastMonth && d<=sameDayLastMonth; });
  const pct = (curr, prev) => prev>0 ? Math.round(((curr-prev)/prev)*100) : (curr>0?100:0);
  const sumTotal = (list)=>list.reduce((s,o)=>s+o.total,0);
  const avgTicket = (list)=>list.length? sumTotal(list)/list.length : 0;
  const monthComparison = {
    thisMonth: {revenue: sumTotal(ordersThisMonth), orders: ordersThisMonth.length, avgTicket: avgTicket(ordersThisMonth)},
    lastMonth: {revenue: sumTotal(ordersLastMonthSameSpan), orders: ordersLastMonthSameSpan.length, avgTicket: avgTicket(ordersLastMonthSameSpan)},
    revenueDeltaPct: pct(sumTotal(ordersThisMonth), sumTotal(ordersLastMonthSameSpan)),
    ordersDeltaPct: pct(ordersThisMonth.length, ordersLastMonthSameSpan.length),
    avgTicketDeltaPct: pct(avgTicket(ordersThisMonth), avgTicket(ordersLastMonthSameSpan)),
    dayOfMonth: now.getDate(),
  };

  return {totalRevenue,avgOrder,avgItems,pending,lowStock,cancelRate,uniqueCustomers,repeatCustomers,repeatRate,topCustomers,
    dayRevenue,monthRevenue,revDelta,catUnitRows,catRevRows,maxCatUnit,maxCatRev,topByUnits,topByRevenue,noSales,
    weekdayNames,weekdayAvg,bestDayIdx,inventoryValue,invRows,maxInv,statusCounts,totalOrders:state.orders.length,expiringOrExpired,
    monthComparison};
}
const VISIT_PERIODS = [
  {key:'hoy', label:'Hoy'},
  {key:'semana', label:'Esta semana'},
  {key:'mes', label:'Este mes'},
  {key:'semana_pasada', label:'Semana pasada'},
];
function getVisitsPeriodRange(period){
  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  if(period==='semana'){
    const dow = (now.getDay()+6)%7; // lunes=0
    const start = new Date(startOfToday); start.setDate(start.getDate()-dow);
    return {start, end: now};
  }
  if(period==='mes'){
    return {start: new Date(now.getFullYear(), now.getMonth(), 1), end: now};
  }
  if(period==='semana_pasada'){
    const dow = (now.getDay()+6)%7;
    const startThisWeek = new Date(startOfToday); startThisWeek.setDate(startThisWeek.getDate()-dow);
    const start = new Date(startThisWeek); start.setDate(start.getDate()-7);
    return {start, end: startThisWeek};
  }
  return {start: startOfToday, end: now}; // 'hoy' por default
}
function computeVisitMetrics(){
  const period = state.visitsPeriod || 'hoy';
  const {start, end} = getVisitsPeriodRange(period);
  const periodVisits = state.visits.filter(v=>{ const d=new Date(v.date); return d>=start && d<=end; });
  const totalVisits = periodVisits.length;
  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const visitsByDay = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const count = state.visits.filter(v=>{const vd=new Date(v.date); return vd>=d && vd<next;}).length;
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: count}; });
  const hourCounts = new Array(24).fill(0);
  periodVisits.forEach(v=>{ const h = new Date(v.date).getHours(); hourCounts[h]++; });
  const visitsByHour = hourCounts.map((c,h)=>({label: h+'h', value:c}));
  const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
  const last24h = state.visits.filter(v=>(Date.now()-new Date(v.date).getTime())<86400000).length;
  return {totalVisits, visitsByDay, visitsByHour, peakHour, last24h, period};
}

function computeMonthProgress(){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const revenue = state.orders
    .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= monthStart)
    .reduce((s,o)=>s+(o.total||0), 0);
  const goal = state.settings.salesGoalMonthly||0;
  const pct = goal>0 ? Math.min(100, (revenue/goal*100)) : 0;
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const dayOfMonth = now.getDate();
  const expectedPct = (dayOfMonth/daysInMonth)*100;
  // Desglose semanal: cuánto llevas vendido ESTA semana (lunes a hoy) contra cuánto necesitarías
  // vender por semana, en promedio, en lo que queda del mes para sí llegar a la meta.
  const daysSinceMonday = (now.getDay()+6)%7; // lunes=0 ... domingo=6
  const weekStart = new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate()-daysSinceMonday);
  const weekRevenue = state.orders
    .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= weekStart)
    .reduce((s,o)=>s+(o.total||0), 0);
  const daysLeftInMonth = daysInMonth - dayOfMonth + 1; // incluye hoy
  const weeksLeft = Math.max(daysLeftInMonth/7, 1/7);
  const remainingGoal = Math.max(0, goal-revenue);
  const neededPerWeek = goal>0 ? remainingGoal/weeksLeft : 0;
  const weekPct = neededPerWeek>0 ? Math.min(100,(weekRevenue/neededPerWeek)*100) : (goal>0?100:0);
  return { revenue, goal, pct, onTrack: goal===0 || pct>=expectedPct-5, monthName: now.toLocaleDateString('es-MX',{month:'long'}),
    weekRevenue, neededPerWeek, weekPct };
}

/* ============== ALERTA DE VENTA ATÍPICA DEL DÍA ==============
   Compara lo que se lleva vendido HOY (a esta hora) contra el promedio de lo que se llevaba
   vendido a esta misma hora en los mismos días de la semana (mismo día, ej. todos los martes)
   de las últimas ~8 semanas. Solo se evalúa después de mediodía para no disparar falsas alarmas
   con apenas un par de horas de datos, y solo si hay al menos 3 días de referencia para comparar
   (si la tienda es nueva o casi no hay historial, mejor no decir nada a que diga algo engañoso). */
function computeSalesAnomaly(){
  const now = new Date();
  if(now.getHours() < 12) return null; // muy temprano para comparar con algo
  const validOrders = state.orders.filter(o=>o.date);
  if(validOrders.length===0) return null;
  const earliestOrderDate = new Date(Math.min(...validOrders.map(o=>new Date(o.date).getTime())));
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const minutesSoFar = now.getHours()*60 + now.getMinutes();
  const todayRevenue = state.orders
    .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= todayStart)
    .reduce((s,o)=>s+(o.total||0), 0);
  const weekday = now.getDay();
  const refDays = []; // ingresos de días anteriores, mismo día de la semana, hasta la misma hora
  for(let w=1; w<=8; w++){
    const dayStart = new Date(todayStart); dayStart.setDate(dayStart.getDate() - 7*w);
    if(dayStart < earliestOrderDate) continue; // la tienda ni siquiera tenía pedidos en esa fecha, no sirve de referencia
    const dayCutoff = new Date(dayStart.getTime() + minutesSoFar*60000);
    const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
    if(dayEnd > now) continue; // ese día todavía no ha pasado por completo, no sirve de referencia
    const rev = state.orders
      .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= dayStart && new Date(o.date) < dayCutoff)
      .reduce((s,o)=>s+(o.total||0), 0);
    refDays.push(rev);
  }
  if(refDays.length < 3) return null; // muy poco historial para comparar con confianza
  const avg = refDays.reduce((s,v)=>s+v,0) / refDays.length;
  if(avg <= 0) return null;
  const ratio = todayRevenue / avg;
  const dayName = now.toLocaleDateString('es-MX',{weekday:'long'});
  if(ratio <= 0.4) return { kind:'baja', ratio, todayRevenue, avg, dayName };
  if(ratio >= 2.5) return { kind:'alta', ratio, todayRevenue, avg, dayName };
  return null;
}
// Junta varias señales que ya calculamos por separado en un solo semáforo, para que de un
// vistazo en Resumen sepas si hay algo que merece tu atención hoy — sin tener que entrar a
// cada pestaña a revisar una por una.
function computeBusinessHealth(){
  const issues = [];
  const openRegs = state.cashRegisters.filter(r=>r.status==='abierta');
  const oldestOpenDays = openRegs.length ? Math.max(...openRegs.map(r=>(Date.now()-new Date(r.openedAt).getTime())/86400000)) : 0;
  if(oldestOpenDays>=1) issues.push({level:'rojo', text:`Hay una caja abierta desde hace ${Math.floor(oldestOpenDays)} día(s) — revísala en Caja.`});
  const m = computeMetrics();
  if(m.lowStock.length>0) issues.push({level:'ambar', text:`${m.lowStock.length} producto(s) con poco stock.`});
  const unansweredOld = state.storeMessages.filter(msg=>(msg.status||'nuevo')!=='respondido' && msg.date && (Date.now()-new Date(msg.date).getTime())>24*60*60000);
  if(unansweredOld.length>0) issues.push({level:'ambar', text:`${unansweredOld.length} mensaje(s) sin responder hace más de 24 horas.`});
  const g = computeMonthProgress();
  if(g.goal>0 && !g.onTrack) issues.push({level:'ambar', text:'Vas un poco atrás de tu meta de venta de este mes.'});
  const waitingReady = computeRestockDemand().filter(g=>g.stock>0).reduce((s,g)=>s+g.people.length,0);
  if(waitingReady>0) issues.push({level:'ambar', text:`${waitingReady} persona(s) esperan productos que ya repusiste — avísales desde Centros → Reabasto.`});
  const anomaly = computeSalesAnomaly();
  if(anomaly && anomaly.kind==='baja') issues.push({level:'ambar', text:`Venta de hoy más baja de lo normal: ${money(anomaly.todayRevenue)} contra un promedio de ${money(anomaly.avg)} para un ${anomaly.dayName} a esta hora.`});
  if(anomaly && anomaly.kind==='alta') issues.push({level:'ambar', text:`¡Venta de hoy muy por arriba de lo normal! ${money(anomaly.todayRevenue)} contra un promedio de ${money(anomaly.avg)} para un ${anomaly.dayName} a esta hora.`});
  const level = issues.some(i=>i.level==='rojo') ? 'rojo' : issues.length>0 ? 'ambar' : 'verde';
  return { level, issues };
}

/* ============== ESTADÍSTICAS: cálculos nuevos ==============
   Se apoyan en computeMetrics()/computeVisitMetrics() (ya existentes) más los eventos
   de embudo (state.analyticsEvents) y el campo "source" de las visitas, ambos agregados
   junto con esta función. Todo lo que dependa de esos dos campos empieza a llenarse a
   partir de esta actualización — antes no existían, así que no hay datos históricos. */
function computeFunnel(){
  const events = state.analyticsEvents || [];
  const views = events.filter(e=>e.type==='product_view').length;
  const addToCart = events.filter(e=>e.type==='add_to_cart').length;
  const checkoutStarts = events.filter(e=>e.type==='checkout_start').length;
  const purchases = state.orders.filter(o=>o.source==='tienda' && o.status!=='Cancelado').length;
  const pct = (a,b)=> b>0 ? Math.round((a/b)*100) : 0;
  return {
    views, addToCart, checkoutStarts, purchases,
    cartConversion: pct(addToCart, views),
    salesConversion: pct(purchases, views),
    hasData: events.length>0,
  };
}
function computePaymentStats(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const totals = {};
  valid.forEach(o=>{
    if(o.source==='pos'){
      salePayments(o).forEach(p=>{
        const key = p.method || 'Efectivo';
        totals[key] = totals[key] || {amount:0,count:0};
        totals[key].amount += p.amount||0; totals[key].count += 1;
      });
    } else {
      totals['Contra entrega'] = totals['Contra entrega'] || {amount:0,count:0};
      totals['Contra entrega'].amount += o.total||0; totals['Contra entrega'].count += 1;
    }
  });
  const rows = Object.entries(totals).map(([method,v])=>({method, amount:v.amount, count:v.count})).sort((a,b)=>b.amount-a.amount);
  const totalAmount = rows.reduce((s,r)=>s+r.amount,0);
  const colors = {Efectivo:'var(--green)', Tarjeta:'var(--teal)', Transferencia:'var(--amber)', 'Contra entrega':'var(--primary)'};
  const segments = rows.map(r=>({label:r.method, value:r.amount, pct: totalAmount? (r.amount/totalAmount*100):0, color: colors[r.method] || 'var(--rose)'}));
  return {rows, totalAmount, segments};
}
function computeProductAnalytics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const unitsById = {}, revenueById = {};
  valid.forEach(o=>o.items.forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    unitsById[it.id] = (unitsById[it.id]||0) + it.qty;
    revenueById[it.id] = (revenueById[it.id]||0) + it.price*it.qty;
  }));
  const viewsById = {};
  (state.analyticsEvents||[]).forEach(e=>{ if(e.type==='product_view' && e.productId) viewsById[e.productId]=(viewsById[e.productId]||0)+1; });
  const wishlistById = {};
  (state.analyticsEvents||[]).forEach(e=>{ if(e.type==='wishlist_add' && e.productId) wishlistById[e.productId]=(wishlistById[e.productId]||0)+1; });
  const withName = (id)=>{ const p = state.products.find(x=>x.id===id); return p ? p.name : '(producto eliminado)'; };
  const soldIds = Object.keys(unitsById);
  const byUnits = soldIds.map(id=>({id,name:withName(id),value:unitsById[id]}));
  const byRevenue = soldIds.map(id=>({id,name:withName(id),value:revenueById[id]}));
  const mostViewed = Object.entries(viewsById).map(([id,v])=>({id,name:withName(id),value:v})).sort((a,b)=>b.value-a.value).slice(0,6);
  const mostWishlisted = Object.entries(wishlistById).map(([id,v])=>({id,name:withName(id),value:v})).sort((a,b)=>b.value-a.value).slice(0,6);
  const withMargin = state.products.filter(p=>p.cost>0 && p.price>0).map(p=>({
    id:p.id, name:p.name, marginPct: Math.round(((p.price-p.cost)/p.price)*100), profitPerUnit: p.price-p.cost
  }));
  const soldIdSet = new Set(soldIds);
  return {
    topByUnits: [...byUnits].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByUnits: [...byUnits].sort((a,b)=>a.value-b.value).slice(0,6),
    topByRevenue: [...byRevenue].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByRevenue: [...byRevenue].sort((a,b)=>a.value-b.value).slice(0,6),
    mostViewed,
    mostWishlisted,
    topMargin: [...withMargin].sort((a,b)=>b.marginPct-a.marginPct).slice(0,6),
    lowMargin: [...withMargin].sort((a,b)=>a.marginPct-b.marginPct).slice(0,6),
    noSales: state.products.filter(p=>!soldIdSet.has(p.id)),
    hasMarginData: withMargin.length>0,
    hasViewData: Object.keys(viewsById).length>0,
    hasWishlistData: Object.keys(wishlistById).length>0,
  };
}
// Reabasto sugerido: cruza ventas de los últimos 30 días (velocidad de venta) con el
// stock actual, para avisar qué se va a agotar pronto y cuánto conviene pedir — sin
// tener que ir a Estadísticas a hacer la cuenta a mano cada vez.
function computeRestockSuggestions(){
  const since = new Date(); since.setDate(since.getDate()-30);
  const valid = state.orders.filter(o=>o.status!=='Cancelado' && new Date(o.date)>=since);
  const unitsById = {};
  valid.forEach(o=>(o.items||[]).forEach(it=>{ if(!it.id || it.id==='promo_buyxpayy') return; unitsById[it.id]=(unitsById[it.id]||0)+it.qty; }));
  const rows = [];
  state.products.forEach(p=>{
    const units30 = unitsById[p.id]||0;
    if(units30<=0) return;
    const velocity = units30/30;
    const daysLeft = p.stock>0 ? p.stock/velocity : 0;
    if(daysLeft < 15){
      rows.push({ id:p.id, name:p.name, cat:p.cat, stock:p.stock, units30, daysLeft, suggested: Math.max(1, Math.ceil(velocity*30) - p.stock) });
    }
  });
  rows.sort((a,b)=>a.daysLeft-b.daysLeft);
  return rows;
}
// Salud del catálogo: junta en un solo lugar lo que hoy vive disperso (fotos, descripción,
// SKU, categoría, precio, SKU repetido, agotados que se siguen mostrando) para no tener que ir
// producto por producto a notarlo. "Marcar como leído" es POR PRODUCTO, no por categoría
// completa: si ya revisaste que a un lubricante en particular no le hace falta foto, ese deja de
// avisarte — pero si mañana hay otro producto nuevo (o uno que aún no habías visto) con esa
// misma falta, sí te avisa de ese, porque nunca lo marcaste como revisado.
const HEALTH_CHECKS_DEF = [
  {key:'noPhoto', label:'Sin foto'},
  {key:'noDesc', label:'Sin descripción'},
  {key:'noSku', label:'Sin SKU'},
  {key:'noCategory', label:'Sin categoría'},
  {key:'noPrice', label:'Sin precio'},
  {key:'duplicateSku', label:'SKU repetido en más de un producto'},
  {key:'outOfStockVisible', label:'Agotado y aún visible en la tienda'},
  {key:'expiringSoon', label:'Caduca en los próximos 30 días'},
  {key:'expired', label:'Ya caducado'},
  {key:'negativeMargin', label:'Costo igual o mayor al precio de venta'},
  {key:'lowMargin', label:'Margen menor al 20%'},
  {key:'priceMismatch', label:'Precio muy distinto a un producto similar'},
];
// Alerta de precios inconsistentes: dos productos de la MISMA categoría cuyo nombre comparte al
// menos 2 palabras significativas (se ignoran palabras de 3 letras o menos, como "de"/"con") pero
// cuyo precio difiere 80% o más entre sí — suele ser un error de captura (un cero de más o de
// menos) más que una diferencia real de producto. No detecta nada entre categorías distintas.
function normalizeNameTokens(name){
  return (name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>=4);
}
function computePriceMismatches(){
  const byCat = {};
  state.products.forEach(p=>{ if(!(p.price>0)) return; const cat = p.cat||'Otros'; (byCat[cat]=byCat[cat]||[]).push(p); });
  const flagged = new Map();
  Object.values(byCat).forEach(list=>{
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i], b=list[j];
        const tokensA = normalizeNameTokens(a.name), tokensB = normalizeNameTokens(b.name);
        if(!tokensA.length || !tokensB.length) continue;
        const shared = tokensA.filter(t=>tokensB.includes(t));
        if(shared.length < Math.min(2, tokensA.length, tokensB.length)) continue;
        const ratio = Math.max(a.price,b.price)/Math.min(a.price,b.price);
        if(ratio>=1.8){
          if(!flagged.has(a.id)) flagged.set(a.id, {product:a, other:b, ratio});
          if(!flagged.has(b.id)) flagged.set(b.id, {product:b, other:a, ratio});
        }
      }
    }
  });
  return Array.from(flagged.values());
}
// Precio al que de verdad se vende hoy (el promocional si está activo) y margen sobre ese precio.
// Sin costo capturado no se puede calcular, así que esos productos no se marcan aquí.
function productSellPrice(p){ return (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : (p.price||0); }
function productMarginPct(p){
  const price = productSellPrice(p);
  if(!(price>0) || !(p.cost>0)) return null;
  return (price-p.cost)/price*100;
}
function healthDismissKey(productId, checkKey){ return productId+'::'+checkKey; }
function computeCatalogHealth(){
  const skuCounts = {};
  state.products.forEach(p=>{ if(p.sku && p.sku.trim()) skuCounts[p.sku.trim()] = (skuCounts[p.sku.trim()]||0)+1; });
  const listByKey = {
    noPhoto: state.products.filter(p=>!(p.images&&p.images.length)),
    noDesc: state.products.filter(p=>!(p.desc&&p.desc.trim())),
    noSku: state.products.filter(p=>!(p.sku&&p.sku.trim())),
    noCategory: state.products.filter(p=>!((p.categories&&p.categories.length)||p.cat)),
    noPrice: state.products.filter(p=>!(p.price>0)),
    duplicateSku: state.products.filter(p=>p.sku&&p.sku.trim()&&skuCounts[p.sku.trim()]>1),
    outOfStockVisible: state.products.filter(p=>!p.hidden && (p.stock||0)<=0),
    expiringSoon: state.products.filter(p=>{
      if(!p.expirationDate) return false;
      const days = Math.ceil((new Date(p.expirationDate+'T00:00:00') - new Date())/86400000);
      return days>=0 && days<=30;
    }),
    expired: state.products.filter(p=>p.expirationDate && new Date(p.expirationDate+'T00:00:00') < new Date()),
    negativeMargin: state.products.filter(p=>{ const m = productMarginPct(p); return m!==null && m<=0; }),
    lowMargin: state.products.filter(p=>{ const m = productMarginPct(p); return m!==null && m>0 && m<20; }),
    priceMismatch: computePriceMismatches().map(x=>x.product),
  };
  const priceMismatchByProductId = {};
  computePriceMismatches().forEach(x=>{ priceMismatchByProductId[x.product.id] = x; });
  const dismissedSet = new Set(state.settings.dismissedHealthItems||[]);
  return HEALTH_CHECKS_DEF.map(c=>{
    const fullList = listByKey[c.key]||[];
    const pending = fullList.filter(p=>!dismissedSet.has(healthDismissKey(p.id, c.key)));
    return {...c, list: pending, dismissedCount: fullList.length - pending.length, priceMismatchByProductId};
  });
}

function computeRealtime(){
  const visits = state.recentVisitsLive || state.visits || [];

  const recentVisits = visits.filter(v=>now-new Date(v.date).getTime()<windowMs);

function ensureRealtimeTimer(active){

      try{

          db.collection('visits').orderBy('date','desc').limit(200).get(),
          db.collection('analyticsEvents').orderBy('date','desc').limit(200).get(),

const HEAT_DAY_LABELS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
// Cuenta ventas (o ingresos) por día de la semana y hora del día — hora local del navegador,
// que es la de tu negocio. Lo cancelado no cuenta.
function computeSalesHeatmap(days, metric){
  const since = Date.now() - days*86400000;
  const grid = Array.from({length:7}, ()=>Array(24).fill(0));
  const counts = Array.from({length:7}, ()=>Array(24).fill(0));
  state.orders.forEach(o=>{
    if(o.status==='Cancelado' || !o.date) return;
    const d = new Date(o.date);
    if(isNaN(d.getTime()) || d.getTime() < since) return;
    const day = (d.getDay()+6)%7, hour = d.getHours();
    counts[day][hour] += 1;
    grid[day][hour] += metric==='revenue' ? (o.total||0) : 1;
  });
  let max = 0, total = 0; const cells = [];
  for(let di=0; di<7; di++) for(let h=0; h<24; h++){
    const v = grid[di][h];
    if(v>max) max = v;
    total += v;
    if(v>0) cells.push({day:di, hour:h, value:v, count:counts[di][h]});
  }
  cells.sort((a,b)=>b.value-a.value);
  return {grid, counts, max, total, cells, top: cells.slice(0,3)};
}
function shortHeatNum(v){ return v>=1000 ? (Math.round(v/100)/10)+'k' : String(Math.round(v)); }

            }).join('')}</tr>`).join('')}

// Cruza lo vendido en los últimos "days" con el costo guardado de cada producto, agrupado por
// categoría — para saber qué categoría deja más ganancia real, no solo más ventas. Se excluye
// lo cancelado. Un producto puede tener varias categorías: para no contar la misma venta dos
// veces, cada línea vendida se atribuye solo a la PRIMERA categoría del producto.
function computeSupplierMargins(days){
  days = days || 30;
  const since = Date.now() - days*86400000;
  const bySupplier = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime() < since) return;
    (o.items||[]).forEach(it=>{
      if(!it.id || it.id==='promo_buyxpayy') return;
      const p = state.products.find(x=>x.id===it.id);
      const supplier = p && p.supplierId ? state.suppliers.find(s=>s.id===p.supplierId) : null;
      const key = supplier ? supplier.id : '__sin_proveedor';
      const label = supplier ? supplier.name : 'Sin proveedor asignado';
      const cost = p ? (p.cost||0) : 0;
      if(!bySupplier[key]) bySupplier[key] = {label, revenue:0, cost:0, units:0};
      bySupplier[key].revenue += (it.price||0)*it.qty;
      bySupplier[key].cost += cost*it.qty;
      bySupplier[key].units += it.qty;
    });
  });
  return Object.values(bySupplier).map(d=>({
    ...d, margin: d.revenue-d.cost, marginPct: d.revenue>0 ? ((d.revenue-d.cost)/d.revenue*100) : 0,
  })).sort((a,b)=>b.margin-a.margin);
}
function computeCategoryMargins(days){
  days = days || 30;
  const since = Date.now() - days*86400000;
  const byCat = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime() < since) return;
    (o.items||[]).forEach(it=>{
      if(!it.id || it.id==='promo_buyxpayy') return;
      const p = state.products.find(x=>x.id===it.id);
      const cat = p ? ((p.categories&&p.categories[0]) || p.cat || 'Sin categoría') : 'Producto eliminado';
      const cost = p ? (p.cost||0) : 0;
      if(!byCat[cat]) byCat[cat] = {revenue:0, cost:0, units:0};
      byCat[cat].revenue += (it.price||0)*it.qty;
      byCat[cat].cost += cost*it.qty;
      byCat[cat].units += it.qty;
    });
  });
  return Object.entries(byCat).map(([cat,d])=>({
    cat, revenue:d.revenue, cost:d.cost, units:d.units,
    margin: d.revenue-d.cost,
    marginPct: d.revenue>0 ? ((d.revenue-d.cost)/d.revenue*100) : 0,
  })).sort((a,b)=>b.margin-a.margin);
}

function renderDonutChart(segments){
  const withValue = segments.filter(s=>s.value>0);
  if(!withValue.length) return `<div class="empty-state">Aún no hay datos suficientes.</div>`;
  let acc = 0;
  const stops = withValue.map(s=>{ const start=acc; acc+=s.pct; return `${s.color} ${start}% ${acc}%`; }).join(', ');
  return `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;"></div>
      <div style="flex:1;min-width:160px;">
        ${withValue.map(s=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;">
            <span style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0;"></span>
            <span style="flex:1;">${s.label}</span>
            <strong>${Math.round(s.pct)}%</strong>
          </div>`).join('')}
      </div>
    </div>`;
}

function productHasTag(p, kind, value){
  if(kind==='cat') return (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).includes(value);
  return (p.needs||[]).includes(value);
}
async function addProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      const categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[]));
      if(categories.includes(value)){ showToast('Ya estaba en esa categoría'); return; }
      categories.push(value);
      p.categories = categories;
      await db.collection('products').doc(productId).update({categories});
    }else{
      const needs = p.needs||[];
      if(needs.includes(value)){ showToast('Ya tenía esa etiqueta'); return; }
      needs.push(value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto agregado'); render();
  }catch(e){ console.error(e); showToast('No se pudo agregar'); }
}
async function removeProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).filter(c=>c!==value);
      if(categories.length===0){
        const fallback = state.settings.categories.find(c=>c!==value) || value;
        categories = [fallback];
      }
      p.categories = categories;
      if(p.cat===value) p.cat = categories[0];
      await db.collection('products').doc(productId).update({categories, cat:p.cat});
    }else{
      const needs = (p.needs||[]).filter(n=>n!==value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto quitado de este filtro'); render();
  }catch(e){ console.error(e); showToast('No se pudo quitar'); }
}

function slugifyNeedKey(label){
  const base = (label||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return base || uid('need-');
}
async function addNeed(){
  const label = (state.newNeedInput||'').trim();
  if(!label){ showToast('Ponle un nombre a la etiqueta'); return; }
  if(!state.settings.needs) state.settings.needs = [];
  let key = slugifyNeedKey(label);
  const existingKeys = new Set(state.settings.needs.map(n=>n.key));
  if(existingKeys.has(key)) key = key + '-' + uid('').slice(-4);
  state.settings.needs.push({key, label});
  state.newNeedInput = '';
  await saveSettings(); showToast('Etiqueta agregada'); render();
}
async function moveNeed(idx,dir){
  const arr = state.settings.needs;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  await saveSettings(); render();
}
async function renameNeed(key, newLabel){
  const n = (state.settings.needs||[]).find(x=>x.key===key); if(!n) return;
  const val = newLabel.trim();
  if(!val){ render(); return; }
  n.label = val;
  await saveSettings(); showToast('Etiqueta actualizada'); render();
}
async function removeNeed(key){
  const count = state.products.filter(p=>(p.needs||[]).includes(key)).length;
  if(count>0 && !confirm(`${count} producto(s) tienen esta etiqueta asignada. Si continúas, se la vamos a quitar de esos productos. ¿Continuar?`)) return;
  try{
    if(count>0){
      const affected = state.products.filter(p=>(p.needs||[]).includes(key));
      for(let i=0;i<affected.length;i+=400){
        const chunk = affected.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(p=>{
          p.needs = (p.needs||[]).filter(k=>k!==key);
          batch.update(db.collection('products').doc(p.id), {needs:p.needs});
        });
        await batch.commit();
      }
    }
    state.settings.needs = (state.settings.needs||[]).filter(n=>n.key!==key);
    if(state.productNeedFilter===key) state.productNeedFilter='Todas';
    await saveSettings(); showToast('Etiqueta eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar la etiqueta'); }
}

// Arma el enlace directo a un producto (para compartir por WhatsApp, redes, donde sea) y lo
// copia — la clienta que lo abra cae directo en ese producto, no en la página principal.
// Clona un producto existente (precio, imágenes, variantes, categorías...) y abre la ficha del
// clon para solo ajustar nombre/detalles antes de guardar — no crea nada en Firestore hasta que
// se le dé "Guardar", igual que "+ Nuevo producto".
function duplicateProduct(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  const clone = JSON.parse(JSON.stringify(p));
  delete clone.id;
  clone.name = (p.name||'') + ' (copia)';
  clone.sku = ''; // el SKU debe ser único por producto; se genera uno nuevo al guardar
  clone.categorySortOrder = {}; // el orden manual no se hereda, para no pelear posición con el original
  clone.createdAt = new Date().toISOString();
  clone.hidden = true; // se crea oculta por default, para revisarla antes de publicarla
  state.productModal = clone;
  showToast('Producto duplicado — revisa y guarda para crearlo');
  render();
}
function copyProductLink(id){
  const url = location.href.replace(/admin\.html.*$/, 'index.html') + '?producto=' + encodeURIComponent(id);
  try{
    navigator.clipboard.writeText(url);
    showToast('Enlace copiado — pégalo donde quieras compartirlo');
  }catch(e){ showToast('No se pudo copiar el enlace'); }
}
function copyCategoryLink(cat){
  const url = location.href.replace(/admin\.html.*$/, 'index.html') + '?categoria=' + encodeURIComponent(cat);

async function quickHideProduct(id){

  if(!p) return;

  try{
    await db.collection('products').doc(id).update({hidden:true});

async function bulkSetProductsHidden(hidden){
  const ids = [...(state.selectedProducts||[])];
  try{
    for(let i=0;i<ids.length;i+=400){
      const chunk = ids.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(id=>{
        const p = state.products.find(x=>x.id===id);
        if(p){ p.hidden = hidden; batch.update(db.collection('products').doc(id), {hidden}); }
      });
      await batch.commit();
    }
    state.selectedProducts = [];
    showToast(`${ids.length} producto(s) ${hidden?'ocultado(s)':'mostrado(s)'}`);
    render();
  }catch(e){ console.error(e); showToast('No se pudo actualizar'); }
}
async function bulkDeleteProducts(){
  const ids = [...(state.selectedProducts||[])];
  if(!confirm(`¿Eliminar ${ids.length} producto(s)? No se puede deshacer.`)) return;
  try{
    for(let i=0;i<ids.length;i+=400){
      const chunk = ids.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(id=>batch.delete(db.collection('products').doc(id)));
