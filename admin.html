/* ============== PROMOCIONES ============== */
const PROMO_TYPES = {
  buyxpayy: 'Lleva X y paga Y (2x1, 3x2, etc.)',
  progressive: 'Descuento progresivo por cantidad',
  cart_discount: 'Descuento automático en el carrito',
  gift: 'Regalo automático en el carrito',
  cross_sell: 'Cross selling (descuento al comprar dos productos juntos)',
};
function openPromoModal(id){
  const p = id ? JSON.parse(JSON.stringify(state.settings.promotions.find(x=>x.id===id))) : {
    id: uid('pr_'), name:'', type:'buyxpayy', scope:'all', categories:[], productIds:[],
    startDate:'', endDate:'', active:true,
    buyQty:3, payQty:2,
    tiers:[{minQty:3, discountPercent:10},{minQty:5, discountPercent:15}],
    discountPercent:10, minAmount:0,
    giftProductId:'',
    triggerProductId:'', discountProductId:'',
  };
  state.promoModal = p; state.promoProductSearch=''; state.promoProductSearch2=''; render();
}
function closePromoModal(){ state.promoModal=null; render(); }
function duplicatePromotion(id){
  const original = state.settings.promotions.find(x=>x.id===id);
  if(!original) return;
  state.promoModal = {...JSON.parse(JSON.stringify(original)), id: uid('pr_'), name: original.name + ' (copia)', active:false};
  state.promoProductSearch=''; state.promoProductSearch2='';
  render();
}
function togglePromoCategory(cat, checked){
  const p = state.promoModal;
  if(checked){ if(!p.categories.includes(cat)) p.categories.push(cat); }
  else{ p.categories = p.categories.filter(c=>c!==cat); }
}
function togglePromoProduct(pid, checked){
  const p = state.promoModal;
  if(checked){ if(!p.productIds.includes(pid)) p.productIds.push(pid); }
  else{ p.productIds = p.productIds.filter(id=>id!==pid); }
}
function addPromoTier(){ state.promoModal.tiers.push({minQty:0, discountPercent:0}); render(); }
function removePromoTier(idx){ state.promoModal.tiers.splice(idx,1); render(); }
function setPromoTier(idx, field, value){ state.promoModal.tiers[idx][field] = Number(value)||0; }
async function savePromotion(){
  const p = state.promoModal;
  const name = document.getElementById('pr-name').value.trim();
  const type = document.getElementById('pr-type').value;
  const startDate = document.getElementById('pr-start').value;
  const endDate = document.getElementById('pr-end').value;
  if(!name){ showToast('Ponle un nombre a la promoción'); return; }
  let updated = {...p, name, type, startDate, endDate};
  if(type==='all_scope_needed_placeholder'){} // no-op, kept for clarity
  if(['buyxpayy','progressive','cart_discount'].includes(type)){
    updated.scope = document.getElementById('pr-scope').value;
  }
  if(type==='buyxpayy'){
    updated.buyQty = Number(document.getElementById('pr-buyqty').value)||1;
    updated.payQty = Number(document.getElementById('pr-payqty').value)||1;
    if(updated.payQty >= updated.buyQty){ showToast('"Pagas" debe ser menor que "Llevas"'); return; }
  }
  if(type==='cart_discount'){
    updated.discountPercent = Number(document.getElementById('pr-discount').value)||0;
    updated.minAmount = Number(document.getElementById('pr-minamount').value)||0;
  }
  if(type==='gift'){
    updated.minAmount = Number(document.getElementById('pr-gift-minamount').value)||0;
    if(!updated.giftProductId){ showToast('Elige el producto de regalo'); return; }
  }
  if(type==='cross_sell'){
    updated.discountPercent = Number(document.getElementById('pr-cross-discount').value)||0;
    if(!updated.triggerProductId || !updated.discountProductId){ showToast('Elige los dos productos'); return; }
  }
  const idx = state.settings.promotions.findIndex(x=>x.id===p.id);
  if(idx>=0) state.settings.promotions[idx] = updated;
  else state.settings.promotions.push(updated);
  await saveSettings();
  state.promoModal=null; showToast('Promoción guardada'); render();
}
async function deletePromotion(id){
  if(!confirm('¿Eliminar esta promoción?')) return;
  const updated = state.settings.promotions.filter(x=>x.id!==id);
  try{
    await db.collection('settings').doc('store').update({promotions: updated});
    state.settings.promotions = updated;
    showToast('Eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar: ' + (e.message||'error desconocido')); }
}
async function togglePromoActive(id){
  const p = state.settings.promotions.find(x=>x.id===id); if(!p) return;
  p.active = !p.active; await saveSettings(); render();
}
function promoSummary(p){
  if(p.type==='buyxpayy') return `Lleva ${p.buyQty} y paga ${p.payQty}`;
  if(p.type==='progressive') return (p.tiers||[]).map(t=>`${t.minQty}+: ${t.discountPercent}%`).join(' · ');
  if(p.type==='cart_discount') return `${p.discountPercent}% de descuento${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`;
  if(p.type==='gift'){ const g = state.products.find(x=>x.id===p.giftProductId); return `Regalo: ${g?g.name:'—'}${p.minAmount>0?` desde ${money(p.minAmount)}`:''}`; }
  if(p.type==='cross_sell'){ const a=state.products.find(x=>x.id===p.triggerProductId), b=state.products.find(x=>x.id===p.discountProductId); return `${a?a.name:'—'} + ${b?b.name:'—'}: ${p.discountPercent}% en el segundo`; }
  return '';
}
// Avisa en el panel cuando el producto clave de una promoción de regalo/cruce ya no tiene
// existencias — la tienda (index.html) ya la oculta sola en ese caso (ver activeGift y
// crossSellSuggestions), pero Ale también debe verlo aquí para reponer o desactivarla.
function promoOutOfStockWarning(p){
  if(p.type==='gift'){
    const g = state.products.find(x=>x.id===p.giftProductId);
    if(g && g.stock<=0) return `El producto de regalo ("${g.name}") está agotado`;
  }
  if(p.type==='cross_sell'){
    const b = state.products.find(x=>x.id===p.discountProductId);
    if(b && b.stock<=0) return `El producto con descuento ("${b.name}") está agotado`;
  }
  return '';
}

  const promos = state.settings.promotions||[];
  return `
    <div class="note-box">Crea promociones automáticas — se aplican solas cuando el cliente cumple la condición, sin necesidad de código. (Para descuentos que necesitan un código, ve a la pestaña Cupones. Para el precio tachado de un producto individual, edítalo directo en Productos.)</div>
    <button class="btn-add-new" style="margin-bottom:14px;" onclick="openPromoModal(null)">+ Nueva promoción</button>
    ${promos.length===0 ? `<div class="empty-state">Aún no has creado ninguna promoción.</div>` :
      promos.map(p=>`

          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="row-title">${p.name} <span class="status-badge" style="background:${p.active?'var(--green)':'#8a6b78'};">${p.active?'Activa':'Inactiva'}</span></div>
            <div class="row-actions">
              <button class="icon-btn" onclick="togglePromoActive('${p.id}')">${p.active?'⏸':'▶'}</button>

              <button class="icon-btn" onclick="openPromoModal('${p.id}')">${icon('edit')}</button>
              <button class="icon-btn danger" onclick="deletePromotion('${p.id}')">${icon('trash')}</button>
            </div>
          </div>
          <div class="row-sub">${PROMO_TYPES[p.type]}</div>
          <div class="row-sub">${promoSummary(p)}</div>

function renderCaja(){

  let filtered = regs;
  if(state.cajaFilter==='abiertas') filtered = filtered.filter(r=>r.status==='abierta');
  else if(state.cajaFilter==='cerradas') filtered = filtered.filter(r=>r.status==='cerrada');
  if(state.cajaCenterFilter!=='Todos') filtered = filtered.filter(r=>r.centerName===state.cajaCenterFilter);
  const abiertas = regs.filter(r=>r.status==='abierta').length;
  const cerradas = regs.filter(r=>r.status==='cerrada');
  const conDiferencia = cerradas.filter(r=>Math.abs(r.difference||0)>0).length;
  // Una sesión cuenta como "activa ahorita" solo si su último latido llegó hace 5 minutos o
  // menos — si alguien cerró el navegador sin salir del POS como se debe, deja de contar sola.
  const liveSessions = state.activePosSessions.filter(s=>s.lastActive && (Date.now()-new Date(s.lastActive).getTime())<5*60000);

async function adminForceCloseCash(id){
  const r = state.cashRegisters.find(x=>x.id===id); if(!r) return;
  if(!confirm(`¿Cerrar manualmente la caja de ${r.cashierName} en ${r.centerName}?\n\nÚsalo solo si el cajero no pudo cerrarla desde el Punto de Venta (por ejemplo, olvidó hacerlo o el dispositivo se perdió).`)) return;
  try{
    const snap = await db.collection('sales').where('cashRegisterId','==', id).get();
    const sales = snap.docs.map(d=>d.data());
    const byPayment = {};
    sales.forEach(s=>{
      salePayments(s).forEach(pm=>{
        const m = pm.method||'Efectivo';
        byPayment[m]=(byPayment[m]||0)+(pm.amount||0);
      });
    });
    const total = sales.reduce((s,x)=>s+(x.total||0),0);
    const movs = r.movements||[];
    const ingresos = movs.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.amount,0);
    const retiros = movs.filter(m=>m.type==='retiro').reduce((s,m)=>s+m.amount,0);
    const expectedCash = (r.openingAmount||0) + (byPayment['Efectivo']||0) + ingresos - retiros;
    const countedInput = prompt(`Efectivo esperado: ${money(expectedCash)}\n\nEscribe el efectivo contado físicamente (o deja este mismo número si no se pudo contar):`, String(Math.round(expectedCash)));
    if(countedInput===null) return;
    const counted = Number(countedInput);
    if(isNaN(counted) || counted<0){ showToast('Monto inválido, no se cerró la caja'); return; }
    const payload = {
      status:'cerrada', closedAt: new Date().toISOString(),
      salesCount: sales.length, totalSales: total, salesByPayment: byPayment,
      cashIngresos: ingresos, cashRetiros: retiros,
      expectedCash, countedCash: counted, difference: counted-expectedCash,
      closingNotes: 'Cerrada manualmente desde el panel de administración.',
    };
    await db.collection('cashRegisters').doc(id).update(payload);
    Object.assign(r, payload);
    showToast('Caja cerrada'); render();
  }catch(e){ console.error(e); showToast('No se pudo cerrar la caja'); }
}

/* ============== RENDIMIENTO POR CENTRO DE DISTRIBUCIÓN ==============
   Junta lo que ya vive disperso en Ventas (POS), Transferencias y Mermas, agrupado por centro,
   para comparar de un vistazo cuál centro vende más, cuál mueve más inventario y cuál tiene más
   merma — sin tener que ir pestaña por pestaña sumando a mano. Las ventas de la tienda en línea
   no traen centro (no son físicas), así que solo se cuentan las ventas del Punto de Venta. */
function computeCenterPerformance(){
  const posSales = state.orders.filter(o=>o.source==='pos' && o.status!=='Cancelado' && o.centerId);
  return state.centers.map(c=>{
    const sales = posSales.filter(o=>o.centerId===c.id);
    const salesRevenue = sales.reduce((s,o)=>s+(o.total||0),0);
    const transfersOut = state.transfers.filter(t=>t.fromCenterId===c.id).length;
    const transfersIn = state.transfers.filter(t=>t.toCenterId===c.id).length;
    const shrinkageForCenter = state.shrinkage.filter(s=>s.centerId===c.id);
    const shrinkageValue = shrinkageForCenter.reduce((s,x)=>s+(x.totalCost||0),0);
    const inventoryValue = state.products.reduce((s,p)=>s+(p.price||0)*((p.stockByCenter&&p.stockByCenter[c.id])||0),0);
    return { id:c.id, name:c.name, salesCount:sales.length, salesRevenue, transfersOut, transfersIn, shrinkageCount:shrinkageForCenter.length, shrinkageValue, inventoryValue };
  }).sort((a,b)=>b.salesRevenue-a.salesRevenue);
}
function renderCenterPerformance(){
  const rows = computeCenterPerformance();
  const maxRevenue = Math.max(1, ...rows.map(r=>r.salesRevenue));
  return `
  <div class="panel">
    <div class="panel-title">Rendimiento por centro</div>
    <div class="panel-sub">Ventas del Punto de Venta, movimientos de inventario y mermas por centro, para saber dónde reforzar. Las ventas de la tienda en línea no se cuentan aquí porque no salen de un centro físico.</div>
    ${rows.length===0 ? `<div class="empty-state">Aún no tienes centros de distribución configurados.</div>` :
      rows.map(r=>`
        <div class="list-row" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="row-title">${r.name}</div>
            <div style="font-weight:800;">${money(r.salesRevenue)}</div>
          </div>
          <div class="hbar-row" style="margin:4px 0;"><div class="hbar-track"><div class="hbar-fill" style="width:${(r.salesRevenue/maxRevenue*100)}%;background:var(--primary)"></div></div></div>
          <div class="row-sub">${r.salesCount} venta(s) · ${r.transfersIn} transferencia(s) recibidas · ${r.transfersOut} enviada(s) · ${r.shrinkageCount} merma(s) por ${money(r.shrinkageValue)} · ${money(r.inventoryValue)} en inventario</div>
        </div>
      `).join('')}
  </div>`;
}

/* ============== REABASTO (proveedores + lista de compra) ==============
   Una lista de compra sencilla: qué pedir, cuánto y a quién. No toca el inventario ni lo
   modifica — es solo para organizar el pedido; cuando llegue la mercancía, el stock se sigue
   ajustando donde siempre (editar producto o una transferencia). Un producto solo puede
   aparecer una vez en la lista (el ID del documento es el ID del producto) — agregarlo de
   nuevo solo actualiza el renglón que ya tenía, no lo duplica.
*/
async function saveSupplierDoc(name){
  const clean = (name||'').trim();
  if(!clean) return;
  try{
    const ref = await db.collection('suppliers').add({name: clean});
    state.suppliers.push({id: ref.id, name: clean});
    state.newSupplierInput = '';
    render();
  }catch(e){ console.error(e); showToast('No se pudo agregar el proveedor'); }
}
async function deleteSupplierDoc(id){
  try{
    await db.collection('suppliers').doc(id).delete();
    state.suppliers = state.suppliers.filter(s=>s.id!==id);
    // Los productos que tenía asignados no se pierden de la lista — solo quedan sin proveedor,
    // para que los reasignes en vez de que desaparezcan solos.
    const toUnassign = state.restockItems.filter(r=>r.supplierId===id);
    for(const r of toUnassign){ r.supplierId=''; await db.collection('restockItems').doc(r.id).update({supplierId:''}); }
    showToast('Proveedor eliminado');
    render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar'); }
}
// Cuánto vendiste de este producto en los últimos "days" días (tienda + POS juntos, sin contar
// lo cancelado) — la base real para sugerir cuánto pedir. Como se calcula sobre state.orders
// (siempre la venta más reciente que ya está cargada), la sugerencia se recalcula sola cada
// vez que se usa: no es una foto fija de un solo momento.
function salesVelocity(productId, days){
  const cutoff = Date.now() - days*24*60*60*1000;
  let qty = 0;
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime() < cutoff) return;
    (o.items||[]).forEach(it=>{ if(it.id===productId) qty += Number(it.qty)||0; });
  });
  return qty;
}
// Sugerencia de cuánto pedir: mira las ventas reales de los últimos 60 días, calcula el
// promedio diario, y sugiere lo necesario para cubrir 30 días de venta a ese ritmo, restando lo
// que ya tienes en stock. Si el producto casi no se ha vendido (o es nuevo, sin historial), no
// hay con qué calcular un ritmo real — se sugiere un mínimo conservador de 3 en vez de un
// número inventado, para no sobrepedir algo que no sabes si se va a mover.
const RESTOCK_LOOKBACK_DAYS = 60, RESTOCK_TARGET_DAYS = 30, RESTOCK_MIN_SALES_TO_TRUST = 2;
function suggestRestockQty(p){
  const sold = salesVelocity(p.id, RESTOCK_LOOKBACK_DAYS);
  if(sold < RESTOCK_MIN_SALES_TO_TRUST) return 3;
  const dailyRate = sold / RESTOCK_LOOKBACK_DAYS;
  const target = Math.ceil(dailyRate * RESTOCK_TARGET_DAYS);
  return Math.max(1, target - (p.stock||0));
}
async function addProductToRestock(productId, qty){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  // Si el producto ya está por caducar (o ya caducó), avisa antes de agregarlo a la lista —
  // pedir más de algo que se va a vencer pronto probablemente no es lo que quieres.
  if(p.expirationDate){
    const days = Math.ceil((new Date(p.expirationDate+'T00:00:00') - new Date())/86400000);
    if(days<=60){
      const msg = days<0 ? `"${p.name}" ya caducó. ¿Aun así quieres agregarlo a reabasto?` : `"${p.name}" caduca en ${days} día(s). ¿Aun así quieres agregarlo a reabasto?`;
      if(!confirm(msg)) return;
    }
  }
  const existing = state.restockItems.find(r=>r.productId===productId);
  const payload = { productId, productName:p.name, productCat:p.cat||'', qty: existing ? existing.qty : (qty||suggestRestockQty(p)), supplierId: existing ? existing.supplierId : '', addedAt: existing ? existing.addedAt : new Date().toISOString() };
  try{
    await db.collection('restockItems').doc(productId).set(payload);
    if(existing) Object.assign(existing, payload);
    else state.restockItems.push({id: productId, ...payload});
    showToast('Agregado a la lista de reabasto');
    render();
  }catch(e){ console.error(e); showToast('No se pudo agregar'); }
}
async function removeRestockItem(id){
  try{
    await db.collection('restockItems').doc(id).delete();
    state.restockItems = state.restockItems.filter(r=>r.id!==id);

}
async function updateRestockItemQty(id, qty){
  const item = state.restockItems.find(r=>r.id===id); if(!item) return;
  const n = Math.max(1, Number(qty)||1);
  item.qty = n;
  try{ await db.collection('restockItems').doc(id).update({qty:n}); }catch(e){ console.error(e); }
}

  const item = state.restockItems.find(r=>r.id===id); if(!item) return;

function copyRestockListForSupplier(supplierId, supplierName){
  const items = state.restockItems.filter(r=>(r.supplierId||'')===(supplierId||''));
  if(!items.length) return;

  const lines = items.map(r=>`${r.productName}: ${r.qty}`).join('\n');
  const text = `Pedido — ${supplierName}\n${fecha}\n\n${lines}\n\nTotal: ${items.length} producto${items.length===1?'':'s'}`;
  try{

}
// "Recibir mercancía": antes, marcar un pedido de proveedor como hecho solo vaciaba la lista —
// había que ir a mano a sumar cada producto al inventario cuando de verdad llegaba. Ahora se abre
// un modal para confirmar cuánto llegó de cada uno (a veces no llega exactamente lo pedido) y esa
// cantidad se suma sola al inventario, con su movimiento registrado en el historial del producto.
function openReceiveGoodsModal(supplierId){
  const items = state.restockItems.filter(r=>(r.supplierId||'')===(supplierId||''));
  if(!items.length) return;
  state.receiveGoodsModalOpen = true;
  state.receiveGoodsSupplierId = supplierId;
  state.receiveGoodsQuantities = {};
  items.forEach(it=>{ state.receiveGoodsQuantities[it.id] = it.qty; });
  render();
}
function closeReceiveGoodsModal(){ state.receiveGoodsModalOpen = false; state.receiveGoodsSupplierId = null; state.receiveGoodsQuantities = {}; render(); }
async function confirmReceiveGoods(){
  const supplierId = state.receiveGoodsSupplierId;
  const items = state.restockItems.filter(r=>(r.supplierId||'')===(supplierId||''));
  const supplier = state.suppliers.find(s=>s.id===supplierId);
  const centerId = (state.centers.find(c=>c.isDefault)||state.centers[0]||{}).id;
  try{
    for(const item of items){
      const received = Number(state.receiveGoodsQuantities[item.id])||0;
      if(received>0 && centerId){
        const p = state.products.find(x=>x.id===item.productId);
        if(p){
          if(!p.stockByCenter) p.stockByCenter = {};
          p.stockByCenter[centerId] = (p.stockByCenter[centerId]||0) + received;
          p.stock = totalStock(p);
          await db.collection('products').doc(p.id).update({stockByCenter:p.stockByCenter, stock:p.stock});
          logStockMovement(p.id, 'recepcion_mercancia', received, `Recibido de ${supplier?supplier.name:'proveedor'}`, centerId);
        }
      }
      await db.collection('restockItems').doc(item.id).delete();
    }
    const ids = new Set(items.map(i=>i.id));
    state.restockItems = state.restockItems.filter(r=>!ids.has(r.id));
    showToast('Mercancía recibida y sumada al inventario');
    closeReceiveGoodsModal();
  }catch(e){ console.error('No se pudo recibir la mercancía', e); showToast('No se pudo completar'); }
}

  const items = state.restockItems.filter(r=>(r.supplierId||'')===(state.receiveGoodsSupplierId||''));

  return `

async function markSupplierOrderDone(supplierId){

      <input id="restock-add-search" placeholder="Buscar producto por nombre..." value="${state.restockAddSearch}" oninput="state.restockAddSearch=this.value;render()">
      ${searchResults.length>0 ? `

/* ============== AUDITORÍAS DE INVENTARIO ============== */
function setAuditCount(pid, value){
  const v = value.trim();
  if(v===''){ delete state.auditCounts[pid]; }
  else{ state.auditCounts[pid] = Math.max(0, Number(v)||0); }
}
function auditDiffRows(){
  if(!state.auditCenter) return [];
  return Object.entries(state.auditCounts).map(([pid,counted])=>{
    const p = state.products.find(x=>x.id===pid);
    if(!p) return null;
    const system = centerStock(p, state.auditCenter);
    return {pid, name:p.name, system, counted, diff: counted - system};
  }).filter(Boolean);
}
async function commitAudit(applyAdjustment){
  if(!state.auditCenter){ showToast('Elige el centro que estás auditando'); return; }
  const rows = auditDiffRows();
  if(rows.length===0){ showToast('Cuenta al menos un producto antes de guardar'); return; }
  const center = state.centers.find(c=>c.id===state.auditCenter);
  const auditDoc = {
    date: new Date().toISOString(), centerId: state.auditCenter, centerName: center.name,
    items: rows.map(r=>({productId:r.pid, name:r.name, systemQty:r.system, countedQty:r.counted, diff:r.diff})),
    notes: state.auditNotes.trim(), applied: applyAdjustment,
  };
  try{
    const ref = db.collection('audits').doc();
    if(applyAdjustment){
      const batch = db.batch();
      rows.forEach(r=>{
        const p = state.products.find(x=>x.id===r.pid);
        if(!p) return;
        if(!p.stockByCenter) p.stockByCenter = {};
        const before = p.stockByCenter[state.auditCenter]||0;
        p.stockByCenter[state.auditCenter] = r.counted;
        p.stock = totalStock(p);
        if(r.counted !== before) logStockMovement(r.pid, 'auditoria', r.counted-before, `Auditoría en ${center.name}`, state.auditCenter);
        batch.update(db.collection('products').doc(r.pid), {stockByCenter:p.stockByCenter, stock:p.stock});
      });
      batch.set(ref, auditDoc);
      await batch.commit();
    }else{
      await ref.set(auditDoc);
    }
    state.audits.unshift({id:ref.id, ...auditDoc});
    state.auditCounts = {}; state.auditNotes=''; state.auditSearch='';
    showToast(applyAdjustment ? 'Auditoría guardada y inventario ajustado' : 'Auditoría guardada'); render();
  }catch(e){ console.error(e); showToast('No se pudo guardar la auditoría'); }
}
// Cruza el historial de auditorías para detectar productos que salen con diferencia
// (faltante o sobrante) en más de una auditoría — una sola vez puede ser un error de conteo,
// pero repetido puede ser un patrón real (robo hormiga, mal registrado en el sistema, etc.).
function computeRecurringAuditDiffs(){
  const byProduct = {};
  state.audits.forEach(a=>{
    (a.items||[]).forEach(it=>{
      if(!it.diff) return;
      if(!byProduct[it.productId]) byProduct[it.productId] = {name: it.name, occurrences: []};
      byProduct[it.productId].occurrences.push({date:a.date, centerName:a.centerName, diff:it.diff});
    });
  });
  return Object.entries(byProduct)
    .filter(([id,d])=>d.occurrences.length>=2)
    .map(([id,d])=>({productId:id, name:d.name, occurrences: d.occurrences.sort((a,b)=>new Date(b.date)-new Date(a.date))}))
    .sort((a,b)=>b.occurrences.length-a.occurrences.length);
}

                ${p.images&&p.images.length?`<img class="row-swatch" src="${p.images[0]}">`:`<div class="row-swatch" style="background:${catColor(p.cat)}"></div>`}

function moveSection(idx, dir){
  const arr = state.settings.sections; const j = idx+dir;
  if(j<0||j>=arr.length) return;

async function savePromoBannerPreset(){
  const name = document.getElementById('promo-name').value.trim();
  if(!name){ showToast('Ponle un nombre a la promoción para poder identificarla después'); return; }
  const draft = {
    ...state.promoBannerDraft,
    name,
    title: document.getElementById('promo-title').value.trim(),
    text: document.getElementById('promo-text').value.trim(),
    buttonText: document.getElementById('promo-btn-text').value.trim(),
    buttonLink: document.getElementById('promo-btn-link').value,
  };
  if(!state.settings.promoBannerPresets) state.settings.promoBannerPresets = [];
  const idx = state.settings.promoBannerPresets.findIndex(x=>x.id===draft.id);
  if(idx>=0) state.settings.promoBannerPresets[idx] = draft; else state.settings.promoBannerPresets.push(draft);
  await saveSettings();
  state.promoBannerEditId = null; state.promoBannerDraft = null;
  showToast('Promoción guardada');
  render();
}

  if(state.settings.activePromoBannerId===id) state.settings.activePromoBannerId = '';
  if(state.promoBannerEditId===id){ state.promoBannerEditId=null; state.promoBannerDraft=null; }

/* ============== RECORDATORIO AUTOMÁTICO DE RECOMPRA ==============
   Ale marca qué productos se terminan/usan con regularidad (lubricante, preservativos...). Si
   un cliente que ya compró uno de esos productos no lo ha vuelto a comprar en los días que se
   definan, aparece en la lista de "para contactar" con un botón directo a WhatsApp. Una vez
   contactado, no se le vuelve a mostrar por el mismo periodo (se guarda en
   settings.repurchaseNotified), para no insistirle todos los días. */
function toggleRepurchaseProduct(id, checked){
  let ids = state.settings.repurchaseProductIds || [];
  ids = checked ? [...new Set([...ids, id])] : ids.filter(x=>x!==id);
  state.settings.repurchaseProductIds = ids;
  saveSettings(); render();
}
function computeRepurchaseCandidates(){
  const days = state.settings.repurchaseDays || 45;
  const ids = state.settings.repurchaseProductIds || [];
  if(!ids.length) return [];
  const cutoff = Date.now() - days*86400000;
  const lastByPhoneProduct = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const phone = (orderContactPhone(o)||'').replace(/\D/g,''); if(!phone) return;
    const name = o.customer || o.customerName || '';
    const d = new Date(o.date).getTime();
    if(isNaN(d)) return;
    (o.items||[]).forEach(it=>{
      if(!it.id || !ids.includes(it.id)) return;
      const key = phone+'|'+it.id;
      if(!lastByPhoneProduct[key] || d > lastByPhoneProduct[key].date){
        lastByPhoneProduct[key] = {date:d, phone, name, productId: it.id};
      }
    });
  });
  const notified = state.settings.repurchaseNotified || {};
  return Object.values(lastByPhoneProduct)
    .filter(x=>x.date <= cutoff)
    .filter(x=>{
      const notifiedAt = notified[x.phone+'|'+x.productId];
      if(!notifiedAt) return true;
      return (Date.now() - new Date(notifiedAt).getTime()) >= days*86400000;
    })
    .map(x=>({...x, product: state.products.find(p=>p.id===x.productId), daysSince: Math.floor((Date.now()-x.date)/86400000)}))
    .filter(x=>x.product)
    .sort((a,b)=>b.daysSince-a.daysSince);
}
function buildRepurchaseMessage(cand){
  return `Hola ${cand.name||''}! Notamos que hace ${cand.daysSince} días compraste ${cand.product.name} en ${state.settings.storeName||'nuestra tienda'} — pensamos que ya te podría estar por terminar. ¿Te gustaría volver a pedirlo? 💕`;
}
async function sendRepurchaseReminder(phone, productId){
  const cand = computeRepurchaseCandidates().find(c=>c.phone===phone && c.productId===productId);
  if(!cand) return;
  const msg = buildRepurchaseMessage(cand);
  window.open(waLink(phone, msg), '_blank');
  logCustomerMessage(phone, cand.name, msg, 'recompra');
  state.settings.repurchaseNotified = {...(state.settings.repurchaseNotified||{}), [phone+'|'+productId]: new Date().toISOString()};
  await saveSettings(); render();
}
function renderRepurchaseSubpanel(){
  const ids = state.settings.repurchaseProductIds || [];
  const q = (state.repurchaseProductSearch||'').trim().toLowerCase();
  const chosen = ids.map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
  const results = q ? state.products.filter(p=>p.name.toLowerCase().includes(q)).slice(0,30) : chosen;
  const candidates = computeRepurchaseCandidates();
  return `
  <div class="panel">
    <div class="panel-title">Recordatorio de recompra</div>
    <div class="panel-sub">Marca los productos que se terminan o se usan con regularidad. Si un cliente que ya compró uno de estos no lo ha vuelto a comprar en los días que definas abajo, aparece en la lista para poder escribirle.</div>
    <div class="form-field" style="max-width:240px;"><label>Días sin recomprar para avisar</label>
      <input type="number" min="1" value="${state.settings.repurchaseDays||45}" onchange="state.settings.repurchaseDays=Number(this.value)||45;saveSettings();render()">
    </div>
    <input id="repurchase-search" placeholder="Buscar producto por nombre..." value="${state.repurchaseProductSearch||''}" oninput="state.repurchaseProductSearch=this.value;render()" style="margin:10px 0;">
    <div style="max-height:240px;overflow-y:auto;margin-bottom:16px;">
      ${results.length===0 ? `<div class="empty-state">${q?'Sin resultados.':'Aún no has marcado ninguno — busca arriba para empezar.'}</div>` :
        results.map(p=>`
          <label class="checkbox-row">
            <input type="checkbox" ${ids.includes(p.id)?'checked':''} onchange="toggleRepurchaseProduct('${p.id}', this.checked)">
            <span>${p.name}</span>
          </label>`).join('')}
    </div>
    <div class="panel-title">Clientes para contactar (${candidates.length})</div>
    ${candidates.length===0 ? `<div class="empty-state">Nadie está pendiente de recompra por ahora.</div>` :

/* ============== CLIENTES EN RIESGO DE FUGA ==============
   A diferencia del recordatorio de recompra (que es por un producto puntual que se termina),
   esto detecta clientes RECURRENTES — que ya compraron varias veces, sin importar qué — y que
   llevan más tiempo del normal sin volver. Junta pedidos de la tienda y ventas del POS (ambos
   ya viven en state.orders) por teléfono, y si alguien con historial de compras repetidas no
   ha vuelto en los días configurados, aparece en la lista con un mensaje de reactivación listo
   para mandar por WhatsApp. Igual que recompra, una vez contactado no se le vuelve a mostrar
   por el mismo periodo (settings.churnRiskNotified) — y si de hecho regresa a comprar, su
   última fecha de compra se actualiza sola y deja de cumplir el filtro de "días sin volver",
   así que no hace falta limpiar el aviso a mano. */
function computeChurnRiskCandidates(){
  const days = state.settings.churnRiskDays || 60;
  const minPurchases = state.settings.churnRiskMinPurchases || 2;
  const cutoff = Date.now() - days*86400000;
  const byPhone = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    const phone = (orderContactPhone(o)||'').replace(/\D/g,''); if(!phone) return;
    const name = (o.source==='pos' ? o.customerName : o.customer) || '';
    const d = new Date(o.date).getTime();
    if(isNaN(d)) return;
    if(!byPhone[phone]) byPhone[phone] = {phone, name, count:0, lastDate:0, totalSpent:0};
    byPhone[phone].count += 1;
    byPhone[phone].totalSpent += Number(o.total)||0;
    if(d > byPhone[phone].lastDate){ byPhone[phone].lastDate = d; byPhone[phone].name = name || byPhone[phone].name; }
  });
  const notified = state.settings.churnRiskNotified || {};
  return Object.values(byPhone)
    .filter(x=>x.count >= minPurchases && x.lastDate <= cutoff)
    .filter(x=>{
      const notifiedAt = notified[x.phone];
      if(!notifiedAt) return true;
      return (Date.now() - new Date(notifiedAt).getTime()) >= days*86400000;
    })
    .map(x=>({...x, daysSince: Math.floor((Date.now()-x.lastDate)/86400000)}))
    .sort((a,b)=>b.daysSince-a.daysSince);
}
function buildChurnRiskMessage(cand){
  return `Hola ${cand.name||''}! Te extrañamos por ${state.settings.storeName||'nuestra tienda'} 💕 Ya tiene ${cand.daysSince} días que no nos visitas — si buscas algo en especial o quieres ver las novedades, con gusto te ayudamos por aquí mismo.`;
}
async function sendChurnRiskReminder(phone){
  const cand = computeChurnRiskCandidates().find(c=>c.phone===phone);
  if(!cand) return;
  const msg = buildChurnRiskMessage(cand);
  window.open(waLink(phone, msg), '_blank');
  logCustomerMessage(phone, cand.name, msg, 'reactivacion');
  state.settings.churnRiskNotified = {...(state.settings.churnRiskNotified||{}), [phone]: new Date().toISOString()};
  await saveSettings(); render();
}

const CONFIG_SUBPANELS = [
  {key:'operativo', icon:icon('sliders'), label:'Datos operativos (WhatsApp, horario, envíos)'},
  {key:'encuesta', icon:icon('message-square'), label:'Encuesta post-entrega'},

function downloadCSV(filename, rows){
  const csvContent = rows.map(row => row.map(cell => {
    const s = (cell===null||cell===undefined) ? '' : String(cell);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }).join(',')).join('\r\n');
  // El BOM (\ufeff) al inicio es para que Excel reconozca acentos y "ñ" correctamente al abrirlo.
  const blob = new Blob(['\ufeff' + csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportProductsCSV(){
  const rows = [['Nombre','SKU','Categoría','Ubicación','Precio','Precio promocional','Costo','Stock total','Caducidad','Oculto']];

  logAdminAction('exportacion', 'productos', `${state.products.length} producto(s)`);

// ocultos), con foto, nombre y el precio al que de verdad se venden hoy (el promocional si
// está activo).
function printCatalogPDF(category){
  const list = state.products.filter(p=>!p.hidden && (category==='Todas' || p.cat===category)).sort((a,b)=>a.name.localeCompare(b.name));
  if(list.length===0){ showToast('No hay productos visibles en esa categoría'); return; }
  const cardsHtml = list.map(p=>{
    const img = (p.images&&p.images[0]) ? p.images[0] : '';
    const price = productSellPrice(p);
    const hasPromo = p.promoPrice>0 && p.promoPrice<p.price;
    return `
      <div style="break-inside:avoid;border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center;">
        ${img ? `<img src="${img}" style="width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:6px;">` : `<div style="width:100%;height:110px;background:#f2f2f2;border-radius:6px;margin-bottom:6px;"></div>`}
        <div style="font-size:11.5px;font-weight:700;line-height:1.25;margin-bottom:3px;">${p.name}</div>
        <div style="font-size:12.5px;font-weight:800;color:#5C1F49;">${hasPromo?`<s style="color:#999;font-weight:600;font-size:10.5px;">${money(p.price)}</s> `:''}${money(price)}</div>
      </div>`;
  }).join('');
  const win = window.open('', '_blank');
  if(!win){ showToast('Habilita las ventanas emergentes para generar el PDF'); return; }
  win.document.write(`
    <html><head><title>Catálogo ${category!=='Todas'?'— '+category:''}</title>
    <meta charset="utf-8">
    <style>
      body{font-family:Arial,sans-serif;padding:20px;color:#222;}

      .sub{color:#666;font-size:12.5px;margin-bottom:16px;}

      @media print{ .no-print{display:none;} .grid{grid-template-columns:repeat(3,1fr);} }
    </style></head><body>
      <h1>${state.settings.storeName||'La Casa de los Placeres'}</h1>
      <div class="sub">Catálogo${category!=='Todas'?' — '+category:''} · ${list.length} producto(s) · ${new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}</div>
      <button class="no-print" onclick="window.print()" style="margin-bottom:14px;padding:10px 16px;font-size:14px;font-weight:700;">Imprimir / Guardar como PDF</button>
      <div class="grid">${cardsHtml}</div>
    </body></html>
  `);
  win.document.close();
  win.focus();
  logAdminAction('impresion', 'catálogo en PDF', `${list.length} producto(s)${category!=='Todas'?' · '+category:''}`);

/* ============== REGISTRO DE ERRORES DEL SISTEMA (panel) ==============
   Ver la lógica de captura y guardado en index.html/admin.html/pos.html — aquí solo se muestra
   lo que ya quedó guardado en la colección "systemErrors". Se carga solo al abrir este panel,
   no en cada carga del panel, porque es información técnica que casi nunca hace falta ver. */
function loadSystemErrors(){
  state.systemErrorsLoading = true; render();
  db.collection('systemErrors').get().then(snap=>{
    const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    items.sort((a,b)=> new Date(b.date) - new Date(a.date));
    state.systemErrors = items.slice(0,200);
    state.systemErrorsLoading = false; render();
  }).catch(e=>{ console.error('No se pudo cargar el registro de errores', e); state.systemErrors=[]; state.systemErrorsLoading=false; render(); });
}
async function clearSystemErrors(){
  if(!confirm('¿Borrar todos los errores guardados? No se puede deshacer.')) return;
  try{
    const batch = db.batch();
    (state.systemErrors||[]).forEach(e=>batch.delete(db.collection('systemErrors').doc(e.id)));

function handleHistImportFile(input){
  const file = input.files[0]; if(!file) return;
  state.histImportFileName = file.name;
  state.histImportResult = null;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('el archivo debe ser una lista de pedidos');
      const existingIds = new Set(state.orders.map(o=>o.id));
      let totalRevenue=0, unmatchedLines=0, alreadyImported=0, dateMin=null, dateMax=null;
      data.forEach(o=>{
        totalRevenue += o.total||0;
        (o.items||[]).forEach(it=>{ if(!it.id) unmatchedLines++; });
        if(existingIds.has(o.firestoreId)) alreadyImported++;
        if(o.date){ if(!dateMin||o.date<dateMin) dateMin=o.date; if(!dateMax||o.date>dateMax) dateMax=o.date; }
      });
      state.histImportData = data;
      state.histImportPreview = {
        count: data.length, totalRevenue, unmatchedLines, alreadyImported,
        dateMin: dateMin ? new Date(dateMin).toLocaleDateString('es-MX') : '—',
        dateMax: dateMax ? new Date(dateMax).toLocaleDateString('es-MX') : '—',
      };
    }catch(err){
      state.histImportData = null;
      state.histImportPreview = {error: 'No se pudo leer el archivo: '+(err.message||'formato inválido')};
    }
    render();
  };
  reader.readAsText(file);
}
async function confirmHistImport(){
  const data = state.histImportData;
  if(!data || !data.length) return;
  if(!confirm(`Vas a importar ${data.length} pedidos históricos de Tiendanube a Firestore. Es seguro repetirlo (no duplica), pero sí escribe datos reales en tu base de datos. ¿Continuar?`)) return;
  state.histImportBusy = true; render();
  try{
    for(let i=0;i<data.length;i+=400){
      const chunk = data.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(o=>{
        const {firestoreId, ...payload} = o;
        batch.set(db.collection('sales').doc(firestoreId), payload);
      });
      await batch.commit();
    }
    state.histImportResult = `Listo: se importaron ${data.length} pedidos.`;
    state.histImportData = null; state.histImportPreview = null; state.histImportFileName = '';
    render();
    await loadData();
    showToast('Historial de ventas importado');
  }catch(e){
    console.error(e);
    showToast('Ocurrió un error al importar: '+(e.message||'error desconocido'));
  }
  state.histImportBusy = false; render();
}

async function removeCategory(cat){
  const affected = state.products.filter(p=>(p.categories&&p.categories.includes(cat)) || p.cat===cat);
  if(affected.length>0 && !confirm(`${affected.length} producto(s) tienen esta categoría asignada. Si continúas, se les asignará otra categoría automáticamente. ¿Continuar?`)) return;
  try{
    if(affected.length>0){
      const fallback = state.settings.categories.find(c=>c!==cat) || 'Otros';
      for(let i=0;i<affected.length;i+=400){
        const chunk = affected.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(p=>{
          let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).filter(c=>c!==cat);
          if(categories.length===0) categories = [fallback];
          p.categories = categories;
          if(p.cat===cat) p.cat = categories[0];
          batch.update(db.collection('products').doc(p.id), {categories:p.categories, cat:p.cat});
        });
        await batch.commit();
      }
    }
    state.settings.categories = state.settings.categories.filter(c=>c!==cat);
    if(state.productCatFilter===cat) state.productCatFilter='Todas';
    await saveSettings(); showToast('Categoría eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar la categoría'); }
}
async function moveCategory(idx,dir){
  const arr = state.settings.categories;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  await saveSettings(); render();

async function renameCategory(oldName, newLabel){
  const val = (newLabel||'').trim();
  if(!val || val===oldName){ render(); return; }
  if(state.settings.categories.includes(val)){ showToast('Ya existe una categoría con ese nombre'); render(); return; }
  const idx = state.settings.categories.indexOf(oldName);
  if(idx<0) return;
  try{
    state.settings.categories[idx] = val;
    const affected = state.products.filter(p=>(p.categories&&p.categories.includes(oldName)) || p.cat===oldName);
    for(let i=0;i<affected.length;i+=400){
      const chunk = affected.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(p=>{
        let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).map(c=>c===oldName?val:c);
        p.categories = categories;
        if(p.cat===oldName) p.cat = val;
        batch.update(db.collection('products').doc(p.id), {categories:p.categories, cat:p.cat});
      });
      await batch.commit();
    }
    if(state.productCatFilter===oldName) state.productCatFilter = val;
    await saveSettings(); showToast('Categoría renombrada'); render();
  }catch(e){ console.error(e); showToast('No se pudo renombrar la categoría'); }
}

// Sugerencia automática de "¿Para quién es?" a partir del nombre y la categoría —
// mismo criterio que se usó para etiquetar los 547 productos del catálogo original,
// adaptado como botón dentro de la ficha de cada producto nuevo. Es un punto de
// partida, no una asignación final: Ale revisa y ajusta antes de guardar.
function has_(name, ...words){ return words.some(w=>name.includes(w)); }
function suggestNeedsForProduct(p){
  const name = normName(p.name||'');
  const cat = normName((p.categories&&p.categories[0]) || p.cat || '');
  let tags = new Set();

  if(cat==='ropa femenina') tags = new Set(['para-mi','para-ella','para-pareja']);
  else if(cat==='ropa masculina') tags = new Set(['para-mi','para-el','para-pareja']);
  else if(cat==='tarjetas de regalo') tags = new Set();
  else if(cat==='juegos'){
    if(has_(name,'despedida de soltera')) tags = new Set();
    else{ tags.add('compartir-pareja'); if(has_(name,'jenga','dado','dados','cartas','naipes','boletos')) tags.add('empezando'); }
  } else if(cat==='satisfyer'){
    if(has_(name,'parejas')) tags = new Set(['compartir-pareja','para-mi']);
    else if(has_(name,' man ') || name.startsWith('man ') || has_(name,'man heat','para el pene')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'clitoris','panty','cutie')) tags = new Set(['para-ella','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='comestibles'){
    if(has_(name,'pareja')) tags = new Set(['compartir-pareja','para-pareja']);
    else if(has_(name,'hombre','masculin')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'mujer','femenin')) tags = new Set(['para-ella','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='complementos'){
    if(has_(name,'hombre','masculin')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'mujer','femenin')) tags = new Set(['para-ella','para-mi']);
    else if(has_(name,'latigo','esposas','pinzas para pezon','mascara','antifaz','cadena','vela','petalos','almohada','splash','spray')) tags = new Set(['compartir-pareja','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='sadomasoquismo') tags = new Set(['compartir-pareja','para-mi']);
  else if(cat==='plugs'){
    tags.add('para-mi');
    if(has_(name,'gema','cola de zorro','cola de conejo','corazon')) tags.add('empezando');
  } else if(cat==='dildos'){
    tags = new Set(['para-mi','para-ella']);
    if(/\b([789])(\.\d+)?\s*cm/.test(name) || has_(name,'mini')) tags.add('empezando');
  } else if(cat==='lubricantes'){
    tags.add('para-mi');
    if(has_(name,'femenin','vaginal','estrechador','clitoris')) tags.add('para-ella');
    if(has_(name,'ereccion','erecto','engrosador','garganta profunda','para hombre')) tags.add('para-el');
    if(has_(name,'unisex','pareja','duo','multiorgasmico','condon')) tags.add('compartir-pareja');
  } else if(cat==='ocultos'){
    tags = new Set(['para-mi','compartir-pareja']);
    if(has_(name,'para ella')) tags.add('para-ella');
  } else if(cat==='juguetes'){
    const esMasturbadorMasculino = has_(name,'masturbador','mastubador','funda para pene','funda de pene','funda realista','penis pump','bomba de succion','entrenador para pene','jaula de castidad') ||
      (has_(name,'vagina','boca','garganta','ano') && !has_(name,'succionador','clitoris'));
    if(esMasturbadorMasculino) tags = new Set(['para-el','para-mi','para-pareja']);
    else if(has_(name,'anillo')) tags = new Set(['para-el','compartir-pareja','para-mi']);
    else if(has_(name,'succionador','clitoris','punto g','kegel','pezon','pezonera')) tags = new Set(['para-ella','para-mi']);
    else if(has_(name,'dildo','vibrador','consolador','bala','miembro')) tags = new Set(['para-mi','para-ella']);
    else if(has_(name,'plug','prostat') || (has_(name,'anal') && !has_(name,'masturbador'))) tags.add('para-mi');
    else if(has_(name,'esposas','arnes','arnés','correa','columpio','collar con pinzas','mordaza')) tags = new Set(['compartir-pareja','para-mi']);
    else tags.add('para-mi');
    if(has_(name,'doble cabeza','doble penetracion','para parejas','control remoto','control por app','butterfly','mariposa')) tags.add('compartir-pareja');
    if(has_(name,'pezon','pezonera')) tags.add('para-ella');
    if(has_(name,'mini','pequen','chico','bolsillo')) tags.add('empezando');
  } else {
    tags.add('para-mi');
  }
  return Array.from(tags).filter(k=>(state.settings.needs||DEFAULT_NEEDS).some(n=>n.key===k));
}
function applySuggestedNeeds(){
  const p = state.productModal;
  const suggested = suggestNeedsForProduct(p);
  if(!suggested.length){ showToast('No se encontró una sugerencia clara para este producto'); return; }
  p.needs = suggested;
  showToast('Sugerencia aplicada — revísala antes de guardar');
  render();
}
function toggleProductNeed(key, checked){
  if(!state.productModal.needs) state.productModal.needs = [];
  if(checked){ if(!state.productModal.needs.includes(key)) state.productModal.needs.push(key); }
  else{ state.productModal.needs = state.productModal.needs.filter(k=>k!==key); }
}
function toggleProductCategory(cat, checked){
  const p = state.productModal;
  if(!p.categories) p.categories = p.cat ? [p.cat] : [];
  if(checked){ if(!p.categories.includes(cat)) p.categories.push(cat); }
  else{ p.categories = p.categories.filter(c=>c!==cat); }
}
function setProductCenterStock(centerId, value){
  if(!state.productModal.stockByCenter) state.productModal.stockByCenter = {};
  state.productModal.stockByCenter[centerId] = Math.max(0, Number(value)||0);
  const totalEl = document.getElementById('pf-stock-total');
  if(totalEl) totalEl.textContent = Object.values(state.productModal.stockByCenter).reduce((s,n)=>s+(n||0),0);
}
function updatePriceCalc(){
  const price = Number(document.getElementById('pf-price').value)||0;
  const promo = Number(document.getElementById('pf-promo').value)||0;
  const cost = Number(document.getElementById('pf-cost').value)||0;
  const effective = promo>0 ? promo : price;
  const margin = effective>0 ? Math.round(((effective-cost)/effective)*1000)/10 : 0;
  const profit = Math.round((effective-cost)*100)/100;
  const marginEl = document.getElementById('pf-margin'); if(marginEl) marginEl.textContent = margin+'%';
  const profitEl = document.getElementById('pf-profit'); if(profitEl) profitEl.textContent = money(profit);
}
function generateSKU(product){
  const catPart = ((product.categories&&product.categories[0])||product.cat||'GEN').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3) || 'GEN';
  const namePart = (product.name||'PROD').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4) || 'PROD';
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${catPart}-${namePart}-${rand}`;
}
function regenerateSKU(){
  const name = document.getElementById('pf-name').value.trim();
  const sku = generateSKU({name, categories: state.productModal.categories, cat: state.productModal.cat});
  state.productModal.sku = sku;
  render();
}
// Dibuja el código de barras (Code128, a partir del SKU) dentro del modal de edición de
// producto. Se llama de nuevo después de cada render mientras el modal esté abierto, porque
// render() reconstruye todo el HTML y el dibujo del código de barras no sobrevive a eso.
function drawProductBarcode(){
  try{ JsBarcode('#pf-barcode-svg', state.productModal.sku, {format:'CODE128', displayValue:true, fontSize:13, height:44, margin:4}); }
  catch(e){ console.error('No se pudo generar el código de barras', e); }
}
function printProductLabel(id){
  const p = state.products.find(x=>x.id===id) || state.productModal;
  if(!p || !p.sku){ showToast('Este producto no tiene SKU todavía'); return; }
  const w = window.open('', '_blank', 'width=420,height=320');
  if(!w){ showToast('Tu navegador bloqueó la ventana de impresión — permite ventanas emergentes para este sitio'); return; }
  w.document.write(`<html><head><title>Etiqueta — ${(p.name||'').replace(/</g,'&lt;')}</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"><\/script>
    <style>body{font-family:sans-serif;text-align:center;padding:16px;} .name{font-size:13px;font-weight:700;margin-bottom:4px;} .price{font-size:16px;font-weight:800;margin-top:6px;}</style>
    </head><body>
    <div class="name">${(p.name||'').replace(/</g,'&lt;')}</div>
    <svg id="lbl"></svg>
    <div class="price">${money(p.promoPrice>0?p.promoPrice:p.price)}</div>
    <script>
      JsBarcode("#lbl", ${JSON.stringify(p.sku)}, {format:"CODE128", displayValue:true, fontSize:12, height:42, margin:2});
      window.onload = function(){ setTimeout(function(){ window.print(); }, 200); };
    <\/script>
    </body></html>`);
  w.document.close();
}
function printProductLabelsBulk(ids){
  const products = ids.map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
  const withSku = products.filter(p=>p.sku);
  if(!withSku.length){ showToast('Ninguno de los seleccionados tiene SKU todavía — genera SKU primero'); return; }
  const w = window.open('', '_blank');
  if(!w){ showToast('Tu navegador bloqueó la ventana de impresión — permite ventanas emergentes para este sitio'); return; }
  w.document.write(`<html><head><title>Etiquetas (${withSku.length})</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"><\/script>
    <style>
      body{font-family:sans-serif;margin:10px;}
      .sheet{display:flex;flex-wrap:wrap;gap:10px;}
      .label{width:180px;border:1px dashed #999;text-align:center;padding:8px;page-break-inside:avoid;}
      .name{font-size:11px;font-weight:700;line-height:1.3;}
      .price{font-size:13px;font-weight:800;margin-top:2px;}
    </style></head><body>
    <div class="sheet">
      ${withSku.map((p,i)=>`<div class="label"><div class="name">${(p.name||'').replace(/</g,'&lt;')}</div><svg id="lbl${i}"></svg><div class="price">${money(p.promoPrice>0?p.promoPrice:p.price)}</div></div>`).join('')}
    </div>
    <script>
      ${withSku.map((p,i)=>`JsBarcode("#lbl${i}", ${JSON.stringify(p.sku)}, {format:"CODE128", displayValue:true, fontSize:10, height:32, margin:2, width:1.4});`).join('\n')}
      window.onload = function(){ setTimeout(function(){ window.print(); }, 300); };
    <\/script>
    </body></html>`);
  w.document.close();
  if(withSku.length < products.length) showToast(`Se imprimieron ${withSku.length} de ${products.length} — a los demás les falta SKU`);
}

/* ---- Variantes ---- */
function renderVariantsEditor(p){
  const groups = p.variantGroups || [];
  const variants = p.variants || [];
  return `
    <div class="panel" style="background:var(--bg);">
      <div class="panel-sub" style="margin-top:0;">Combina diferentes propiedades de tu producto. Ejemplo: color + talla.</div>
      ${groups.map((g,idx)=>`
        <div class="two-col" style="margin-bottom:8px;">
          <input placeholder="Nombre (ej. Color)" value="${g.name||''}" onchange="setVariantGroupName(${idx}, this.value)">
          <input placeholder="Valores separados por coma (ej. Rojo, Azul)" value="${(g.values||[]).join(', ')}" onchange="setVariantGroupValues(${idx}, this.value)">
        </div>
        <div style="text-align:right;margin-top:-4px;margin-bottom:10px;"><button class="icon-btn danger" style="width:auto;padding:4px 10px;font-size:11px;" onclick="removeVariantGroup(${idx})">Quitar grupo</button></div>
      `).join('')}
      <div class="two-col" style="margin-bottom:10px;">
        <button class="btn-outline" onclick="addVariantGroup()">+ Agregar grupo de variante</button>
        <button class="btn-primary" onclick="generateVariantCombos()">Generar variantes</button>
      </div>
      ${variants.length>0 ? `
        <div class="panel-title" style="font-size:12.5px;margin:12px 0 8px;">Combinaciones (${variants.length})</div>
        ${variants.map(v=>`
          <div class="list-row" style="align-items:center;">
            <div class="row-main"><div class="row-title">${Object.entries(v.combo||{}).map(([k,val])=>`${k}: ${val}`).join(' · ')}</div></div>
            <input placeholder="SKU" value="${v.sku||''}" style="width:110px;padding:9px 8px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;" onchange="setVariantField('${v.id}','sku',this.value)">
            <input type="number" min="0" placeholder="Precio (si es distinto)" value="${v.priceOverride||''}" style="width:110px;padding:9px 8px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;text-align:center;" onchange="setVariantField('${v.id}','priceOverride',this.value)">
            <input type="number" min="0" placeholder="Stock" value="${v.stock||0}" style="width:70px;padding:9px 8px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;text-align:center;" onchange="setVariantField('${v.id}','stock',this.value)">
          </div>
        `).join('')}
      ` : ''}
    </div>`;
}
function addVariantGroup(){
  if(!state.productModal.variantGroups) state.productModal.variantGroups = [];
  state.productModal.variantGroups.push({name:'', values:[]});
  render();
}
function setVariantGroupName(idx, value){ state.productModal.variantGroups[idx].name = value.trim(); }
function setVariantGroupValues(idx, value){
  state.productModal.variantGroups[idx].values = value.split(',').map(v=>v.trim()).filter(Boolean);
}
function removeVariantGroup(idx){
  state.productModal.variantGroups.splice(idx,1);
  render();
}
function generateVariantCombos(){
  const groups = (state.productModal.variantGroups||[]).filter(g=>g.name && g.values && g.values.length);
  if(groups.length===0){ showToast('Agrega al menos un grupo con nombre y valores'); return; }
  let combos = [{}];
  groups.forEach(g=>{
    const next = [];
    combos.forEach(c=>{ g.values.forEach(v=>{ next.push({...c, [g.name]: v}); }); });
    combos = next;
  });
  const existing = state.productModal.variants || [];
  const keyOf = combo => JSON.stringify(Object.entries(combo).sort());
  const existingByKey = {}; existing.forEach(v=>{ existingByKey[keyOf(v.combo)] = v; });
  state.productModal.variants = combos.map(combo=>{
    const key = keyOf(combo);
    if(existingByKey[key]) return existingByKey[key];
    return { id: uid('var_'), combo, sku:'', stock:0 };
  });
  showToast(`${combos.length} variante(s) generada(s)`);
  render();
}
function setVariantField(variantId, field, value){
  const v = (state.productModal.variants||[]).find(x=>x.id===variantId);
  if(!v) return;
  v[field] = (field==='stock'||field==='priceOverride') ? Math.max(0, Number(value)||0) : value;
}
function handleSaveProduct(existingId){
  const name = document.getElementById('pf-name').value.trim();
  const sku = document.getElementById('pf-sku').value.trim();
  const location = document.getElementById('pf-location').value.trim();
  const supplierId = document.getElementById('pf-supplier').value || '';
  const expirationDate = document.getElementById('pf-expiration').value || '';
  const lowStockThreshold = Number(document.getElementById('pf-low-stock-threshold').value) || 0;
  const price = Number(document.getElementById('pf-price').value)||0;
  const promoPrice = Number(document.getElementById('pf-promo').value)||0;
  const cost = Number(document.getElementById('pf-cost').value)||0;
  const desc = document.getElementById('pf-desc').value.trim();
  const hidden = document.getElementById('pf-hidden').checked;
  if(!name){ showToast('Ponle un nombre al producto'); return; }
  const categories = (state.productModal.categories && state.productModal.categories.length) ? state.productModal.categories : [state.settings.categories[0]];
  const cat = categories[0];
  const stockByCenter = state.productModal.stockByCenter || {};
  const stock = Object.values(stockByCenter).reduce((s,n)=>s+(n||0),0);
  saveProduct({
    id: existingId||null, name, sku, location, supplierId, expirationDate, lowStockThreshold, cat, categories, price, promoPrice, cost, stock, stockByCenter, desc,
    hidden, images: state.productModal.images||[], needs: state.productModal.needs||[],
    variantGroups: state.productModal.variantGroups||[], variants: state.productModal.variants||[],
  });
}

/* ============== PRESERVAR EL CAMPO QUE SE ESTÁ EDITANDO AL VOLVER A DIBUJAR LA PANTALLA ==============
   render() reconstruye TODO el HTML desde cero cada vez (por ejemplo, cuando llega un pedido
   nuevo en segundo plano mientras editas algo). Desde que cada campo de texto importante está
   "atado" al estado (ver los oninput= en los formularios de arriba), ese HTML nuevo ya trae el
   valor correcto — pero igual te saca el foco del campo, como si hubieras hecho click en otro
   lado a media palabra. Esto captura, justo antes de reconstruir la pantalla, en qué campo
   estabas escribiendo y en qué posición iba el cursor, y lo restaura después. De paso, por si
   algún campo quedara sin atar al estado (ahora o en el futuro), respeta el valor que tenías en
   pantalla en ese instante por encima de lo que traiga el estado — así nunca se pierde una letra
   de lo que estabas escribiendo, pase lo que pase en segundo plano. */
function captureFocusState(root){
  const el = document.activeElement;
  if(!el || !root || !root.contains(el) || !el.id) return null;
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return null;
  const info = { id: el.id, value: el.value, scrollTop: root.scrollTop };
  if(typeof el.selectionStart === 'number'){ info.selStart = el.selectionStart; info.selEnd = el.selectionEnd; }
  return info;
}
function restoreFocusState(root, info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  if('value' in el && el.value !== info.value) el.value = info.value;
  el.focus();
  if(info.selStart!=null && el.setSelectionRange){
    try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
  }
  root.scrollTop = info.scrollTop;
}
// Además del campo enfocado, muchas listas (buscar y agregar un producto, elegir alcance de una
// promoción, auditoría, etc.) tienen su propio scroll interno. Sin esto, marcar una casilla o
// agregar un producto de esa lista la reconstruye desde cero y el navegador la regresa hasta
// arriba, aunque el campo enfocado no cambie. En vez de etiquetar cada una a mano (son muchas y
// crecen con el tiempo), se recuerda el scroll de CADA contenedor con scroll propio, en el orden
// en que aparecen en pantalla, y se restaura en ese mismo orden tras el redibujado — funciona
// porque typear o marcar algo cambia el CONTENIDO de esas listas, no cuántas hay ni en qué orden.
const SCROLLABLE_SELECTOR = '[style*="overflow-y:auto"],[style*="overflow-y: auto"],[style*="overflow:auto"],[style*="overflow: auto"]';
function captureScrollPositions(root){
  return Array.from(root.querySelectorAll(SCROLLABLE_SELECTOR)).map(el=>el.scrollTop);
}
function restoreScrollPositions(root, positions){
  if(!positions || !positions.length) return;
  const els = root.querySelectorAll(SCROLLABLE_SELECTOR);
  els.forEach((el,i)=>{ if(positions[i]) el.scrollTop = positions[i]; });
}
function render(){
  const root = document.getElementById('root');
  const focusInfo = captureFocusState(root);
  const scrollPositions = captureScrollPositions(root);
  if(!state.authChecked){ root.innerHTML = `<div class="loading-screen">Verificando sesión…</div>`; restoreFocusState(root, focusInfo); return; }
  if(!state.user){ root.innerHTML = renderLogin(); restoreFocusState(root, focusInfo); return; }
  if(state.totpRequired && !state.totpVerified){ root.innerHTML = renderTotpChallenge(); restoreFocusState(root, focusInfo); return; }
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando panel…</div>`; restoreFocusState(root, focusInfo); return; }
  root.innerHTML = renderAdmin();
  if(state.productModal && document.getElementById('pf-barcode-svg')){ drawProductBarcode(); }
  if(state.postModalProductId && document.getElementById('post-canvas')){ drawPostCanvas(); }
  if(!document.getElementById('toast')){ const t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  const pinField = document.getElementById('pin-field'); if(pinField && !focusInfo) pinField.focus();
  const searchField = document.getElementById('global-search-input'); if(searchField && document.activeElement!==searchField && !focusInfo){ searchField.focus(); const v=searchField.value; searchField.setSelectionRange(v.length,v.length); }
  restoreFocusState(root, focusInfo);
  restoreScrollPositions(root, scrollPositions);
}
render();
</script>
