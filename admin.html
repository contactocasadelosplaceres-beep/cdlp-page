/* ============== ALERTA DE VENTA ATÍPICA DEL DÍA ==============
   Compara lo que se lleva vendido HOY (a esta hora) contra el promedio de lo que se llevaba
   vendido a esta misma hora en los mismos días de la semana (mismo día, ej. todos los martes)
   de las últimas ~8 semanas. Solo se evalúa después de mediodía para no disparar falsas alarmas
   con apenas un par de horas de datos, y solo si hay al menos 3 días de referencia para comparar
   (si la tienda es nueva o casi no hay historial, mejor no decir nada a que diga algo engañoso). */
function computeSalesAnomaly(){
  const now = new Date();
  if(now.getHours() < 12) return null; // muy temprano para comparar con algo
  const validOrders = state.orders.filter(o=>o.date);
  if(validOrders.length===0) return null;
  const earliestOrderDate = new Date(Math.min(...validOrders.map(o=>new Date(o.date).getTime())));
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const minutesSoFar = now.getHours()*60 + now.getMinutes();
  const todayRevenue = state.orders
    .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= todayStart)
    .reduce((s,o)=>s+(o.total||0), 0);
  const weekday = now.getDay();
  const refDays = []; // ingresos de días anteriores, mismo día de la semana, hasta la misma hora
  for(let w=1; w<=8; w++){
    const dayStart = new Date(todayStart); dayStart.setDate(dayStart.getDate() - 7*w);
    if(dayStart < earliestOrderDate) continue; // la tienda ni siquiera tenía pedidos en esa fecha, no sirve de referencia
    const dayCutoff = new Date(dayStart.getTime() + minutesSoFar*60000);
    const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
    if(dayEnd > now) continue; // ese día todavía no ha pasado por completo, no sirve de referencia
    const rev = state.orders
      .filter(o=>o.status!=='Cancelado' && new Date(o.date) >= dayStart && new Date(o.date) < dayCutoff)
      .reduce((s,o)=>s+(o.total||0), 0);
    refDays.push(rev);
  }
  if(refDays.length < 3) return null; // muy poco historial para comparar con confianza
  const avg = refDays.reduce((s,v)=>s+v,0) / refDays.length;
  if(avg <= 0) return null;
  const ratio = todayRevenue / avg;
  const dayName = now.toLocaleDateString('es-MX',{weekday:'long'});
  if(ratio <= 0.4) return { kind:'baja', ratio, todayRevenue, avg, dayName };
  if(ratio >= 2.5) return { kind:'alta', ratio, todayRevenue, avg, dayName };
  return null;
}

/* ============== SEÑALES DE RIESGO EN PEDIDOS (antifraude simple) ==============
   Son pistas, no veredictos: un pedido con señales se marca "Revisar" para que Ale lo confirme
   por WhatsApp antes de preparar el envío. "Es válido" quita la marca de ese pedido. */
function riskGuardOn(){ return state.settings.fraudGuardEnabled!==false; }
function riskPhoneKey(ph){ const d=String(ph||'').replace(/\D/g,''); return d.length>10 ? d.slice(-10) : d; }
let _riskIdxCache = null;
function riskIndex(){
  const key = state.orders.length+':'+state.orders.filter(o=>o.status==='Cancelado').length+':'+state.orders.filter(o=>o.deliveryFailure).length;
  if(_riskIdxCache && _riskIdxCache.key===key) return _riskIdxCache;
  const byPhone = {}, fails = {}; let sum=0, n=0;
  state.orders.forEach(o=>{
    if(o.source==='pos') return;
    const k = riskPhoneKey(o.phone); if(k) (byPhone[k] = byPhone[k]||[]).push(o);
    if(k && o.deliveryFailure) fails[k] = (fails[k]||0)+1;
    if(o.status!=='Cancelado'){ sum += o.total||0; n++; }
  });
  _riskIdxCache = {key, byPhone, fails, avg: n? sum/n : 0, n};
  return _riskIdxCache;
}
function orderRiskReasons(o){
  if(!riskGuardOn() || !o || o.source==='pos') return [];
  const r = [];
  const k = riskPhoneKey(o.phone);
  const distinct = new Set(k.split('')).size;
  if(k.length<10 || distinct<=3 || /^(0123456789|1234567890|9876543210)$/.test(k)) r.push('Teléfono dudoso');
  const idx = riskIndex();
  const same = (idx.byPhone[k]||[]);
  const t0 = new Date(o.date).getTime();
  const near = same.filter(x=>Math.abs(new Date(x.date).getTime()-t0) <= 24*3600*1000).length;
  if(k && near>=3) r.push(`${near} pedidos con este teléfono en 24 h`);
  const failedBefore = phoneFailureCount(o.phone, o.id);
  if(failedBefore>0) r.push(`No recibió ${failedBefore} pedido${failedBefore===1?'':'s'} anterior${failedBefore===1?'':'es'}`);
  const canceled = same.filter(x=>x.id!==o.id && x.status==='Cancelado' && !x.deliveryFailure).length;
  if(canceled>=2) r.push(`${canceled} pedidos anteriores cancelados con este teléfono`);
  const nm = String(o.customer||'').trim();
  const letters = (nm.match(/[a-záéíóúüñ]/gi)||[]).length;
  if(letters<3 || /(.)\1{3,}/i.test(nm) || /https?:|www\.|@/i.test(nm)) r.push('Nombre dudoso');
  const ad = String(o.address||'').trim();
  if(ad.length<10) r.push('Dirección muy corta');
  if(idx.n>=10 && (o.total||0) > Math.max(idx.avg*4, 2000)) r.push('Monto muy superior a tu pedido típico');
  if((o.fraudSignals||[]).includes('rapido')) r.push('Formulario enviado en menos de 4 segundos');
  return r;
}

  if(oldestOpenDays>=1) issues.push({level:'rojo', text:`Hay una caja abierta desde hace ${Math.floor(oldestOpenDays)} día(s) — revísala en Caja.`});
  const m = computeMetrics();
  if(m.lowStock.length>0) issues.push({level:'ambar', text:`${m.lowStock.length} producto(s) con poco stock.`});
  const unansweredOld = state.storeMessages.filter(msg=>!msg.archived && (msg.status||'nuevo')!=='respondido' && msg.date && (Date.now()-new Date(msg.date).getTime())>24*60*60000);
  if(unansweredOld.length>0) issues.push({level:'ambar', text:`${unansweredOld.length} mensaje(s) sin responder hace más de 24 horas.`});
  const g = computeMonthProgress();
  if(g.goal>0 && !g.onTrack) issues.push({level:'ambar', text:'Vas un poco atrás de tu meta de venta de este mes.'});
  const waitingReady = computeRestockDemand().filter(g=>g.stock>0).reduce((s,g)=>s+g.people.length,0);
  if(waitingReady>0) issues.push({level:'ambar', text:`${waitingReady} persona(s) esperan productos que ya repusiste — avísales desde Centros → Reabasto.`});
  const anomaly = computeSalesAnomaly();
  if(anomaly && anomaly.kind==='baja') issues.push({level:'ambar', text:`Venta de hoy más baja de lo normal: ${money(anomaly.todayRevenue)} contra un promedio de ${money(anomaly.avg)} para un ${anomaly.dayName} a esta hora.`});
  if(anomaly && anomaly.kind==='alta') issues.push({level:'ambar', text:`¡Venta de hoy muy por arriba de lo normal! ${money(anomaly.todayRevenue)} contra un promedio de ${money(anomaly.avg)} para un ${anomaly.dayName} a esta hora.`});
  const level = issues.some(i=>i.level==='rojo') ? 'rojo' : issues.length>0 ? 'ambar' : 'verde';
  return { level, issues };
}

/* ============== ESTADÍSTICAS: cálculos nuevos ==============
   Se apoyan en computeMetrics()/computeVisitMetrics() (ya existentes) más los eventos
   de embudo (state.analyticsEvents) y el campo "source" de las visitas, ambos agregados
   junto con esta función. Todo lo que dependa de esos dos campos empieza a llenarse a
   partir de esta actualización — antes no existían, así que no hay datos históricos. */
function computeFunnel(){
  const events = state.analyticsEvents || [];
  const views = events.filter(e=>e.type==='product_view').length;
  const addToCart = events.filter(e=>e.type==='add_to_cart').length;
  const checkoutStarts = events.filter(e=>e.type==='checkout_start').length;
  const purchases = state.orders.filter(o=>o.source==='tienda' && o.status!=='Cancelado').length;
  const pct = (a,b)=> b>0 ? Math.round((a/b)*100) : 0;
  return {
    views, addToCart, checkoutStarts, purchases,
    cartConversion: pct(addToCart, views),
    salesConversion: pct(purchases, views),
    hasData: events.length>0,
  };
}
function computePaymentStats(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const totals = {};
  valid.forEach(o=>{
    if(o.source==='pos'){
      salePayments(o).forEach(p=>{
        const key = p.method || 'Efectivo';
        totals[key] = totals[key] || {amount:0,count:0};
        totals[key].amount += p.amount||0; totals[key].count += 1;
      });
    } else {
      totals['Contra entrega'] = totals['Contra entrega'] || {amount:0,count:0};
      totals['Contra entrega'].amount += o.total||0; totals['Contra entrega'].count += 1;
    }
  });
  const rows = Object.entries(totals).map(([method,v])=>({method, amount:v.amount, count:v.count})).sort((a,b)=>b.amount-a.amount);
  const totalAmount = rows.reduce((s,r)=>s+r.amount,0);
  const colors = {Efectivo:'var(--green)', Tarjeta:'var(--teal)', Transferencia:'var(--amber)', 'Contra entrega':'var(--primary)'};
  const segments = rows.map(r=>({label:r.method, value:r.amount, pct: totalAmount? (r.amount/totalAmount*100):0, color: colors[r.method] || 'var(--rose)'}));
  return {rows, totalAmount, segments};
}
function computeProductAnalytics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const unitsById = {}, revenueById = {};
  valid.forEach(o=>o.items.forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    unitsById[it.id] = (unitsById[it.id]||0) + it.qty;
    revenueById[it.id] = (revenueById[it.id]||0) + it.price*it.qty;
  }));
  const viewsById = {};
  (state.analyticsEvents||[]).forEach(e=>{ if(e.type==='product_view' && e.productId) viewsById[e.productId]=(viewsById[e.productId]||0)+1; });
  const wishlistById = {};
  (state.analyticsEvents||[]).forEach(e=>{ if(e.type==='wishlist_add' && e.productId) wishlistById[e.productId]=(wishlistById[e.productId]||0)+1; });
  const withName = (id)=>{ const p = state.products.find(x=>x.id===id); return p ? p.name : '(producto eliminado)'; };
  const soldIds = Object.keys(unitsById);
  const byUnits = soldIds.map(id=>({id,name:withName(id),value:unitsById[id]}));
  const byRevenue = soldIds.map(id=>({id,name:withName(id),value:revenueById[id]}));
  const mostViewed = Object.entries(viewsById).map(([id,v])=>({id,name:withName(id),value:v})).sort((a,b)=>b.value-a.value).slice(0,6);
  const mostWishlisted = Object.entries(wishlistById).map(([id,v])=>({id,name:withName(id),value:v})).sort((a,b)=>b.value-a.value).slice(0,6);
  const withMargin = state.products.filter(p=>p.cost>0 && p.price>0).map(p=>({
    id:p.id, name:p.name, marginPct: Math.round(((p.price-p.cost)/p.price)*100), profitPerUnit: p.price-p.cost
  }));
  const soldIdSet = new Set(soldIds);
  return {
    topByUnits: [...byUnits].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByUnits: [...byUnits].sort((a,b)=>a.value-b.value).slice(0,6),
    topByRevenue: [...byRevenue].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByRevenue: [...byRevenue].sort((a,b)=>a.value-b.value).slice(0,6),
    mostViewed,
    mostWishlisted,
    topMargin: [...withMargin].sort((a,b)=>b.marginPct-a.marginPct).slice(0,6),
    lowMargin: [...withMargin].sort((a,b)=>a.marginPct-b.marginPct).slice(0,6),
    noSales: state.products.filter(p=>!soldIdSet.has(p.id)),
    hasMarginData: withMargin.length>0,
    hasViewData: Object.keys(viewsById).length>0,
    hasWishlistData: Object.keys(wishlistById).length>0,
  };
}
// Reabasto sugerido: cruza ventas de los últimos 30 días (velocidad de venta) con el
// stock actual, para avisar qué se va a agotar pronto y cuánto conviene pedir — sin
// tener que ir a Estadísticas a hacer la cuenta a mano cada vez.
function computeRestockSuggestions(){
  const since = new Date(); since.setDate(since.getDate()-30);
  const valid = state.orders.filter(o=>o.status!=='Cancelado' && new Date(o.date)>=since);
  const unitsById = {};
  valid.forEach(o=>(o.items||[]).forEach(it=>{ if(!it.id || it.id==='promo_buyxpayy') return; unitsById[it.id]=(unitsById[it.id]||0)+it.qty; }));
  const rows = [];
  state.products.forEach(p=>{
    const units30 = unitsById[p.id]||0;
    if(units30<=0) return;
    const velocity = units30/30;
    const daysLeft = p.stock>0 ? p.stock/velocity : 0;
    if(daysLeft < 15){
      rows.push({ id:p.id, name:p.name, cat:p.cat, stock:p.stock, units30, daysLeft, suggested: Math.max(1, Math.ceil(velocity*30) - p.stock) });
    }
  });
  rows.sort((a,b)=>a.daysLeft-b.daysLeft);
  return rows;
}
// Salud del catálogo: junta en un solo lugar lo que hoy vive disperso (fotos, descripción,
// SKU, categoría, precio, SKU repetido, agotados que se siguen mostrando) para no tener que ir
// producto por producto a notarlo. "Marcar como leído" es POR PRODUCTO, no por categoría
// completa: si ya revisaste que a un lubricante en particular no le hace falta foto, ese deja de
// avisarte — pero si mañana hay otro producto nuevo (o uno que aún no habías visto) con esa
// misma falta, sí te avisa de ese, porque nunca lo marcaste como revisado.
const HEALTH_CHECKS_DEF = [
  {key:'noPhoto', label:'Sin foto'},
  {key:'noDesc', label:'Sin descripción'},
  {key:'noSku', label:'Sin SKU'},
  {key:'noCategory', label:'Sin categoría'},
  {key:'noPrice', label:'Sin precio'},
  {key:'duplicateSku', label:'SKU repetido en más de un producto'},
  {key:'outOfStockVisible', label:'Agotado y aún visible en la tienda'},
  {key:'expiringSoon', label:'Caduca en los próximos 30 días'},
  {key:'expired', label:'Ya caducado'},
  {key:'negativeMargin', label:'Costo igual o mayor al precio de venta'},
  {key:'lowMargin', label:'Margen menor al 20%'},
  {key:'priceMismatch', label:'Precio muy distinto a un producto similar'},
];
// Alerta de precios inconsistentes: dos productos de la MISMA categoría cuyo nombre comparte al
// menos 2 palabras significativas (se ignoran palabras de 3 letras o menos, como "de"/"con") pero
// cuyo precio difiere 80% o más entre sí — suele ser un error de captura (un cero de más o de
// menos) más que una diferencia real de producto. No detecta nada entre categorías distintas.
function normalizeNameTokens(name){
  return (name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>=4);
}
function computePriceMismatches(){
  const byCat = {};
  state.products.forEach(p=>{ if(!(p.price>0)) return; const cat = p.cat||'Otros'; (byCat[cat]=byCat[cat]||[]).push(p); });
  const flagged = new Map();
  Object.values(byCat).forEach(list=>{
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i], b=list[j];
        const tokensA = normalizeNameTokens(a.name), tokensB = normalizeNameTokens(b.name);
        if(!tokensA.length || !tokensB.length) continue;
        const shared = tokensA.filter(t=>tokensB.includes(t));
        if(shared.length < Math.min(2, tokensA.length, tokensB.length)) continue;
        const ratio = Math.max(a.price,b.price)/Math.min(a.price,b.price);
        if(ratio>=1.8){
          if(!flagged.has(a.id)) flagged.set(a.id, {product:a, other:b, ratio});
          if(!flagged.has(b.id)) flagged.set(b.id, {product:b, other:a, ratio});
        }
      }
    }
  });
  return Array.from(flagged.values());
}
// Precio al que de verdad se vende hoy (el promocional si está activo) y margen sobre ese precio.
// Sin costo capturado no se puede calcular, así que esos productos no se marcan aquí.
function productSellPrice(p){ return (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : (p.price||0); }
function productMarginPct(p){
  const price = productSellPrice(p);
  if(!(price>0) || !(p.cost>0)) return null;
  return (price-p.cost)/price*100;
}
function healthDismissKey(productId, checkKey){ return productId+'::'+checkKey; }
function computeCatalogHealth(){
  const skuCounts = {};
  state.products.forEach(p=>{ if(p.sku && p.sku.trim()) skuCounts[p.sku.trim()] = (skuCounts[p.sku.trim()]||0)+1; });
  const listByKey = {
    noPhoto: state.products.filter(p=>!(p.images&&p.images.length)),
    noDesc: state.products.filter(p=>!(p.desc&&p.desc.trim())),
    noSku: state.products.filter(p=>!(p.sku&&p.sku.trim())),
    noCategory: state.products.filter(p=>!((p.categories&&p.categories.length)||p.cat)),
    noPrice: state.products.filter(p=>!(p.price>0)),
    duplicateSku: state.products.filter(p=>p.sku&&p.sku.trim()&&skuCounts[p.sku.trim()]>1),
    outOfStockVisible: state.products.filter(p=>!p.hidden && (p.stock||0)<=0),
    expiringSoon: state.products.filter(p=>{
      if(!p.expirationDate) return false;
      const days = Math.ceil((new Date(p.expirationDate+'T00:00:00') - new Date())/86400000);
      return days>=0 && days<=30;
    }),
    expired: state.products.filter(p=>p.expirationDate && new Date(p.expirationDate+'T00:00:00') < new Date()),
    negativeMargin: state.products.filter(p=>{ const m = productMarginPct(p); return m!==null && m<=0; }),
    lowMargin: state.products.filter(p=>{ const m = productMarginPct(p); return m!==null && m>0 && m<20; }),
    priceMismatch: computePriceMismatches().map(x=>x.product),
  };
  const priceMismatchByProductId = {};
  computePriceMismatches().forEach(x=>{ priceMismatchByProductId[x.product.id] = x; });
  const dismissedSet = new Set(state.settings.dismissedHealthItems||[]);
  return HEALTH_CHECKS_DEF.map(c=>{
    const fullList = listByKey[c.key]||[];
    const pending = fullList.filter(p=>!dismissedSet.has(healthDismissKey(p.id, c.key)));
    return {...c, list: pending, dismissedCount: fullList.length - pending.length, priceMismatchByProductId};
  });
}

function computeRealtime(){
  const visits = state.recentVisitsLive || state.visits || [];
  const events = state.recentEventsLive || state.analyticsEvents || [];
  const now = Date.now(); const windowMs = 5*60*1000;
  const recentVisits = visits.filter(v=>now-new Date(v.date).getTime()<windowMs);

let realtimeTimer = null;
function ensureRealtimeTimer(active){
  if(active && !realtimeTimer){
    realtimeTimer = setInterval(async ()=>{
      try{
        const [visitsSnap, eventsSnap] = await Promise.all([
          db.collection('visits').orderBy('date','desc').limit(200).get(),
          db.collection('analyticsEvents').orderBy('date','desc').limit(200).get(),

}

const HEAT_DAY_LABELS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
// Cuenta ventas (o ingresos) por día de la semana y hora del día — hora local del navegador,
// que es la de tu negocio. Lo cancelado no cuenta.
function computeSalesHeatmap(days, metric){
  const since = Date.now() - days*86400000;
  const grid = Array.from({length:7}, ()=>Array(24).fill(0));
  const counts = Array.from({length:7}, ()=>Array(24).fill(0));
  state.orders.forEach(o=>{
    if(o.status==='Cancelado' || !o.date) return;
    const d = new Date(o.date);
    if(isNaN(d.getTime()) || d.getTime() < since) return;
    const day = (d.getDay()+6)%7, hour = d.getHours();
    counts[day][hour] += 1;
    grid[day][hour] += metric==='revenue' ? (o.total||0) : 1;
  });
  let max = 0, total = 0; const cells = [];
  for(let di=0; di<7; di++) for(let h=0; h<24; h++){
    const v = grid[di][h];
    if(v>max) max = v;
    total += v;
    if(v>0) cells.push({day:di, hour:h, value:v, count:counts[di][h]});
  }
  cells.sort((a,b)=>b.value-a.value);
  return {grid, counts, max, total, cells, top: cells.slice(0,3)};
}
function shortHeatNum(v){ return v>=1000 ? (Math.round(v/100)/10)+'k' : String(Math.round(v)); }

// Cruza lo vendido en los últimos "days" con el costo guardado de cada producto, agrupado por
// categoría — para saber qué categoría deja más ganancia real, no solo más ventas. Se excluye
// lo cancelado. Un producto puede tener varias categorías: para no contar la misma venta dos
// veces, cada línea vendida se atribuye solo a la PRIMERA categoría del producto.
function computeSupplierMargins(days){
  days = days || 30;
  const since = Date.now() - days*86400000;
  const bySupplier = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime() < since) return;
    (o.items||[]).forEach(it=>{
      if(!it.id || it.id==='promo_buyxpayy') return;
      const p = state.products.find(x=>x.id===it.id);
      const supplier = p && p.supplierId ? state.suppliers.find(s=>s.id===p.supplierId) : null;
      const key = supplier ? supplier.id : '__sin_proveedor';
      const label = supplier ? supplier.name : 'Sin proveedor asignado';
      const cost = p ? (p.cost||0) : 0;
      if(!bySupplier[key]) bySupplier[key] = {label, revenue:0, cost:0, units:0};
      bySupplier[key].revenue += (it.price||0)*it.qty;
      bySupplier[key].cost += cost*it.qty;
      bySupplier[key].units += it.qty;
    });
  });
  return Object.values(bySupplier).map(d=>({
    ...d, margin: d.revenue-d.cost, marginPct: d.revenue>0 ? ((d.revenue-d.cost)/d.revenue*100) : 0,
  })).sort((a,b)=>b.margin-a.margin);
}
function computeCategoryMargins(days){
  days = days || 30;
  const since = Date.now() - days*86400000;
  const byCat = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime() < since) return;
    (o.items||[]).forEach(it=>{
      if(!it.id || it.id==='promo_buyxpayy') return;
      const p = state.products.find(x=>x.id===it.id);
      const cat = p ? ((p.categories&&p.categories[0]) || p.cat || 'Sin categoría') : 'Producto eliminado';
      const cost = p ? (p.cost||0) : 0;
      if(!byCat[cat]) byCat[cat] = {revenue:0, cost:0, units:0};
      byCat[cat].revenue += (it.price||0)*it.qty;
      byCat[cat].cost += cost*it.qty;
      byCat[cat].units += it.qty;
    });
  });
  return Object.entries(byCat).map(([cat,d])=>({
    cat, revenue:d.revenue, cost:d.cost, units:d.units,
    margin: d.revenue-d.cost,
    marginPct: d.revenue>0 ? ((d.revenue-d.cost)/d.revenue*100) : 0,
  })).sort((a,b)=>b.margin-a.margin);
}

function renderDonutChart(segments){
  const withValue = segments.filter(s=>s.value>0);
  if(!withValue.length) return `<div class="empty-state">Aún no hay datos suficientes.</div>`;
  let acc = 0;
  const stops = withValue.map(s=>{ const start=acc; acc+=s.pct; return `${s.color} ${start}% ${acc}%`; }).join(', ');
  return `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;"></div>
      <div style="flex:1;min-width:160px;">
        ${withValue.map(s=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;">
            <span style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0;"></span>
            <span style="flex:1;">${s.label}</span>
            <strong>${Math.round(s.pct)}%</strong>
          </div>`).join('')}
      </div>
    </div>`;
}

/* ============== ESTADÍSTICAS: CAMPAÑAS (?ref=) ==============
   Cada enlace con ?ref=nombre (ver index.html → captureCampaignFromURL) marca las visitas y los
   pedidos de la tienda en línea. Aquí se arman los enlaces y se comparan campañas. */
const CAMP_PERIODS = [{key:7,label:'7 días'},{key:30,label:'30 días'},{key:90,label:'90 días'},{key:0,label:'Todo'}];
const CAMP_PRESETS = ['instagram-bio','instagram-historias','facebook','tiktok','whatsapp-estados','volante','qr-mostrador','influencer'];
function campaignSlug(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}
function storeIndexUrl(){ return `${location.origin}${location.pathname.replace(/admin\.html$/,'')}index.html`; }
function buildCampaignLink(name, destCat, prodName){
  const slug = campaignSlug(name);
  if(!slug) return '';
  let q = 'ref=' + slug;
  const pn = (prodName||'').trim().toLowerCase();
  const prod = pn ? state.products.find(p=>(p.name||'').trim().toLowerCase()===pn) : null;
  if(prod) q += '&producto=' + encodeURIComponent(prod.id);
  else if(destCat) q += '&categoria=' + encodeURIComponent(destCat);
  return storeIndexUrl() + '?' + q;
}
function updateCampLink(){
  const g = id=>document.getElementById(id);
  const out = g('camp-link'); if(!out) return;
  const link = buildCampaignLink(g('camp-name').value, g('camp-cat').value, g('camp-prod').value);
  out.value = link;
  const note = g('camp-slug-note');
  if(note){
    const slug = campaignSlug(g('camp-name').value);
    note.textContent = slug ? `Se registrará como: ${slug}` : 'Escribe un nombre para generar el enlace.';
  }
}
function pickCampPreset(name){
  const el = document.getElementById('camp-name'); if(!el) return;
  el.value = name; updateCampLink();
}
function copyCampLink(){
  const out = document.getElementById('camp-link');
  if(!out || !out.value){ showToast('Escribe primero el nombre de la campaña'); return; }
  try{
    navigator.clipboard.writeText(out.value).then(()=>showToast('Enlace copiado — úsalo en esa campaña')).catch(()=>{ out.select(); showToast('Selecciona y copia el enlace'); });
  }catch(e){ out.select(); showToast('Selecciona y copia el enlace'); }
}
function computeCampaigns(){
  const days = state.campPeriod==null ? 30 : state.campPeriod;
  const since = days>0 ? Date.now()-days*86400000 : 0;
  const inRange = d=>{ const t=new Date(d).getTime(); return !isNaN(t) && t>=since; };
  const map = {};
  const row = k=> map[k] || (map[k]={name:k, visits:0, orders:0, revenue:0});
  (state.visits||[]).forEach(v=>{ if(v.campaign && inRange(v.date)) row(v.campaign).visits++; });
  let tiendaOrders = 0, tiendaRevenue = 0;
  state.orders.forEach(o=>{
    if(o.source!=='tienda' || o.status==='Cancelado' || !inRange(o.date)) return;
    tiendaOrders++; tiendaRevenue += o.total||0;
    if(o.campaign){ const r=row(o.campaign); r.orders++; r.revenue += o.total||0; }
  });
  const rows = Object.values(map).map(r=>({...r,
    conv: r.visits>0 ? Math.min(100, Math.round(r.orders/r.visits*1000)/10) : null,
    ticket: r.orders>0 ? r.revenue/r.orders : 0,
  })).sort((a,b)=> b.revenue-a.revenue || b.visits-a.visits);
  const campOrders = rows.reduce((s,r)=>s+r.orders,0), campRevenue = rows.reduce((s,r)=>s+r.revenue,0);
  const campVisits = rows.reduce((s,r)=>s+r.visits,0);
  return {rows, tiendaOrders, tiendaRevenue, campOrders, campRevenue, campVisits,
    sharePct: tiendaOrders>0 ? Math.round(campOrders/tiendaOrders*100) : 0};
}

function productHasTag(p, kind, value){
  if(kind==='cat') return (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).includes(value);
  return (p.needs||[]).includes(value);
}
async function addProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      const categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[]));
      if(categories.includes(value)){ showToast('Ya estaba en esa categoría'); return; }
      categories.push(value);
      p.categories = categories;
      await db.collection('products').doc(productId).update({categories});
    }else{
      const needs = p.needs||[];
      if(needs.includes(value)){ showToast('Ya tenía esa etiqueta'); return; }
      needs.push(value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto agregado'); render();
  }catch(e){ console.error(e); showToast('No se pudo agregar'); }
}
async function removeProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).filter(c=>c!==value);
      if(categories.length===0){
        const fallback = state.settings.categories.find(c=>c!==value) || value;
        categories = [fallback];
      }
      p.categories = categories;
      if(p.cat===value) p.cat = categories[0];
      await db.collection('products').doc(productId).update({categories, cat:p.cat});
    }else{
      const needs = (p.needs||[]).filter(n=>n!==value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto quitado de este filtro'); render();
  }catch(e){ console.error(e); showToast('No se pudo quitar'); }
}

function slugifyNeedKey(label){
  const base = (label||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return base || uid('need-');
}
async function addNeed(){
  const label = (state.newNeedInput||'').trim();
  if(!label){ showToast('Ponle un nombre a la etiqueta'); return; }
  if(!state.settings.needs) state.settings.needs = [];
  let key = slugifyNeedKey(label);
  const existingKeys = new Set(state.settings.needs.map(n=>n.key));
  if(existingKeys.has(key)) key = key + '-' + uid('').slice(-4);
  state.settings.needs.push({key, label});
  state.newNeedInput = '';
  await saveSettings(); showToast('Etiqueta agregada'); render();
}
async function moveNeed(idx,dir){
  const arr = state.settings.needs;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  await saveSettings(); render();
}
async function renameNeed(key, newLabel){
  const n = (state.settings.needs||[]).find(x=>x.key===key); if(!n) return;
  const val = newLabel.trim();
  if(!val){ render(); return; }
  n.label = val;
  await saveSettings(); showToast('Etiqueta actualizada'); render();
}
async function removeNeed(key){
  const count = state.products.filter(p=>(p.needs||[]).includes(key)).length;
  if(count>0 && !confirm(`${count} producto(s) tienen esta etiqueta asignada. Si continúas, se la vamos a quitar de esos productos. ¿Continuar?`)) return;
  try{
    if(count>0){
      const affected = state.products.filter(p=>(p.needs||[]).includes(key));
      for(let i=0;i<affected.length;i+=400){
        const chunk = affected.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(p=>{
          p.needs = (p.needs||[]).filter(k=>k!==key);
          batch.update(db.collection('products').doc(p.id), {needs:p.needs});
        });
        await batch.commit();
      }
    }
    state.settings.needs = (state.settings.needs||[]).filter(n=>n.key!==key);
    if(state.productNeedFilter===key) state.productNeedFilter='Todas';
    await saveSettings(); showToast('Etiqueta eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar la etiqueta'); }
}

  return kind==='cat'

// Calcula qué cambia en cada seleccionado sin guardar nada: así la ventana dice cuántos se
// van a modificar, cuántos ya estaban así y cuántos se saltan (quitar la única categoría de
// un producto lo dejaría sin categoría, y entonces no aparecería en ningún filtro).
function buildBulkTagPlan(){
  const m = state.bulkTagModal; const ids = state.selectedProducts||[];
  const plan = {updates:[], unchanged:0, skippedLastCat:0};
  ids.forEach(id=>{
    const p = state.products.find(x=>x.id===id); if(!p) return;
    if(m.kind==='cat'){
      const cur = prodCats(p);
      const has = cur.includes(m.value);
      if(m.action==='add'){ if(has){ plan.unchanged++; return; } plan.updates.push({id, data:{categories:[...cur, m.value], cat:cur[0]||m.value}}); }
      else{
        if(!has){ plan.unchanged++; return; }
        const next = cur.filter(c=>c!==m.value);
        if(!next.length){ plan.skippedLastCat++; return; }
        plan.updates.push({id, data:{categories:next, cat:next[0]}});
      }
    }else{
      const cur = p.needs||[]; const has = cur.includes(m.value);
      if(m.action==='add'){ if(has){ plan.unchanged++; return; } plan.updates.push({id, data:{needs:[...cur, m.value]}}); }
      else{ if(!has){ plan.unchanged++; return; } plan.updates.push({id, data:{needs:cur.filter(n=>n!==m.value)}}); }
    }
  });
  return plan;
}
async function applyBulkTag(){
  const m = state.bulkTagModal; if(!m || !m.value || m.saving) return;
  const plan = buildBulkTagPlan();
  if(!plan.updates.length){ showToast('No hay nada que cambiar con esta selección'); return; }
  m.saving = true; render();
  try{
    for(let i=0;i<plan.updates.length;i+=400){
      const batch = db.batch();
      plan.updates.slice(i,i+400).forEach(u=>batch.update(db.collection('products').doc(u.id), u.data));
      await batch.commit();
    }
    plan.updates.forEach(u=>{ const p=state.products.find(x=>x.id===u.id); if(p) Object.assign(p, u.data); });
    const label = (bulkTagOptions(m.kind).find(o=>o.value===m.value)||{}).label || m.value;
    logAdminAction('edicion_lote', 'producto', `${plan.updates.length} producto(s)`, `${m.action==='add'?'Se agregó':'Se quitó'} ${m.kind==='cat'?'la categoría':'la etiqueta'} "${label}"`);
    showToast(`${plan.updates.length} producto(s) actualizado(s)`);
    state.bulkTagModal = null; state.selectedProducts = [];
  }catch(e){ console.error(e); m.saving = false; showToast('No se pudo actualizar: '+(e.message||'error')); }
  render();
}

  {key:'promo', label:'En promoción'},
  {key:'apto', label:'En mi lista para promocionar'},
];
const PRODUCT_SORTS = [
  {key:'auto', label:'Orden: predeterminado'},
  {key:'recientes', label:'Más recientes'},
  {key:'nombre', label:'Nombre (A-Z)'},
  {key:'precio-asc', label:'Precio: menor a mayor'},
  {key:'precio-desc', label:'Precio: mayor a menor'},
  {key:'stock-asc', label:'Menos stock primero'},
  {key:'vendidos', label:'Más vendidos (90 días)'},
];
function lowStockLimit(p){ return p.lowStockThreshold>0 ? p.lowStockThreshold : 3; }
// Mismo criterio que la etiqueta de cada fila (stockStatusBadge): "bajo" no incluye agotados.
function productMatchesStatus(p, key){
  const stock = p.stock||0;
  if(key==='agotados') return stock<=0;
  if(key==='bajo') return stock>0 && stock<=lowStockLimit(p);
  if(key==='ocultos') return !!p.hidden;
  if(key==='sinfoto') return !(p.images && p.images.length);
  if(key==='promo') return p.promoPrice>0 && p.promoPrice<(p.price||0);
  if(key==='apto') return !!p.promoCandidate;
  return true;
}
// Unidades vendidas por producto en los últimos 90 días (pedidos y ventas no canceladas).
// Se calcula una vez por render de la lista, no por cada comparación del sort.
function unitsSoldByProduct(days){
  const since = Date.now() - days*86400000;
  const units = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado' || new Date(o.date).getTime()<since) return;
    (o.items||[]).forEach(it=>{ if(it.id) units[it.id]=(units[it.id]||0)+(Number(it.qty)||0); });
  });
  return units;
}
function sortProductsBy(list, key){
  const arr = [...list];
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'', 'es', {sensitivity:'base'});
  if(key==='nombre') return arr.sort(byName);
  if(key==='recientes') return arr.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'') || byName(a,b));
  const eff = p => (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : (p.price||0);
  if(key==='precio-asc') return arr.sort((a,b)=>eff(a)-eff(b) || byName(a,b));
  if(key==='precio-desc') return arr.sort((a,b)=>eff(b)-eff(a) || byName(a,b));
  if(key==='stock-asc') return arr.sort((a,b)=>(a.stock||0)-(b.stock||0) || byName(a,b));
  if(key==='vendidos'){ const u = unitsSoldByProduct(90); return arr.sort((a,b)=>(u[b.id]||0)-(u[a.id]||0) || byName(a,b)); }
  return arr;
}
// +/- de stock desde la fila. Solo para productos de stock simple: los que tienen variantes o
// son kit se siguen ajustando desde su ficha (el stock de un kit se calcula de sus piezas).
// Se mueve el centro donde ya vive el stock si es uno solo; si no, el centro principal.
function quickStockCenterId(p){
  const keys = Object.keys(p.stockByCenter||{});
  if(keys.length===1) return keys[0];
  return (state.centers.find(c=>c.isDefault)||state.centers[0]||{}).id || null;
}
function canQuickAdjustStock(p){ return !p.isKit && !(p.variants && p.variants.length) && !!quickStockCenterId(p); }
const quickStockBusy = {};
async function quickAdjustStock(id, delta){
  const p = state.products.find(x=>x.id===id); if(!p || quickStockBusy[id]) return;
  if(!canQuickAdjustStock(p)){ showToast('Este producto se ajusta desde su ficha'); return; }
  const cid = quickStockCenterId(p);
  const sbc = {...(p.stockByCenter||{})};
  const current = sbc[cid]||0;
  if(current+delta<0){ showToast('No hay piezas que restar en ese centro'); return; }
  sbc[cid] = current+delta;
  const prev = {stockByCenter:p.stockByCenter, stock:p.stock};
  const newStock = Object.values(sbc).reduce((s,n)=>s+(n||0),0);
  quickStockBusy[id] = true;
  try{
    await db.collection('products').doc(id).update({stockByCenter:sbc, stock:newStock});
    p.stockByCenter = sbc; p.stock = newStock;
    const center = state.centers.find(c=>c.id===cid);
    logStockMovement(id, 'ajuste_manual', delta, 'Ajuste rápido desde la lista de productos', cid);
    recomputeKitStocksFor([id]);
    showToast(`${p.name}: ${newStock} en stock${center && state.centers.length>1?` (${center.name})`:''}`);
  }catch(e){ console.error(e); Object.assign(p, prev); showToast('No se pudo ajustar el stock'); }
  finally{ delete quickStockBusy[id]; render(); }
}

// Precio mostrado en la lista de productos: si las variantes tienen precios propios se muestra "Desde $X".
function varUnitPrice(p, v){
  const prodPrice = (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : p.price;
  const list = Number(v.priceOverride)>0 ? Number(v.priceOverride) : p.price;
  if(Number(v.promoPriceOverride)>0 && Number(v.promoPriceOverride)<list) return Number(v.promoPriceOverride);
  if(Number(v.priceOverride)>0) return Number(v.priceOverride);
  return prodPrice;
}
function adminPriceHtml(p){
  const vs = p.variants||[];
  if(vs.some(v=>Number(v.priceOverride)>0 || Number(v.promoPriceOverride)>0)){
    const prices = vs.map(v=>varUnitPrice(p,v)), min = Math.min(...prices), max = Math.max(...prices);
    return min===max ? money(min) : `Desde ${money(min)} <span style="color:var(--ink-soft);">(hasta ${money(max)})</span>`;
  }
  return p.promoPrice>0 ? `<s>${money(p.price)}</s> ${money(p.promoPrice)}` : money(p.price);
}

// Arma el enlace directo a un producto (para compartir por WhatsApp, redes, donde sea) y lo
// copia — la clienta que lo abra cae directo en ese producto, no en la página principal.
// Clona un producto existente (precio, imágenes, variantes, categorías...) y abre la ficha del
// clon para solo ajustar nombre/detalles antes de guardar — no crea nada en Firestore hasta que
// se le dé "Guardar", igual que "+ Nuevo producto".
function duplicateProduct(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  const clone = JSON.parse(JSON.stringify(p));
  delete clone.id;
  clone.name = (p.name||'') + ' (copia)';
  clone.sku = ''; // el SKU debe ser único por producto; se genera uno nuevo al guardar
  clone.categorySortOrder = {}; // el orden manual no se hereda, para no pelear posición con el original
  clone.createdAt = new Date().toISOString();
  clone.hidden = true; // se crea oculta por default, para revisarla antes de publicarla
  clone.costHistory = []; clone.promoSince = null; // el historial es del producto original, no se hereda
  state.productModal = clone;
  showToast('Producto duplicado — revisa y guarda para crearlo');
  render();
}

/* ============== IMPORTAR DESCRIPCIONES DESDE TIENDANUBE ============== */
function escDescHtml(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normName(s){
  return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
/* ============== IMPORTAR VARIANTES DESDE TIENDANUBE ============== */
// El CSV de Tiendanube trae una fila por variante (mismo "Identificador de URL" repetido);
// solo la primera fila de cada producto trae "Nombre". Las columnas de propiedad (Talla, Color, etc.)
// y las de stock por ubicación ("Stock (...)") varían de nombre, así que se detectan por encabezado.
/* ============== IMPORTAR CATEGORÍAS DESDE TIENDANUBE ============== */
// El CSV de Tiendanube trae la columna "Categorías" (varias separadas por coma) repetida en
// todas las filas de un mismo producto (identificado por "Identificador de URL"); solo hace
// falta leerla de cualquiera de esas filas.

// Propuesta inicial de a dónde va cada categoría heredada de Tiendanube que no coincide con
// ninguno de los 9 botones de filtro actuales de la tienda. Se puede cambiar cada una desde la
// propia herramienta antes de aplicar -- esto es solo el punto de partida.
// Categorías que hoy traen los productos (vía el campo "categories" o, si no tienen, el campo
// viejo "cat") y que no están entre los 9 botones de filtro configurados -- estas son las que
// hacen falta reconciliar. Se recalcula cada vez que se abre/renderiza, así que una vez
// reconciliada una categoría (y agregada a los botones oficiales) deja de aparecer en la lista.
// Compara la categoría efectiva de cada producto (igual que la calcula la tienda, con el mismo
// respaldo a "cat" cuando no hay "categories") contra el mapeo elegido, y arma la lista de qué
// cambiaría -- reemplaza solo la(s) categoría(s) sin reconciliar dentro de la lista de cada
// producto, sin tocar las demás categorías que ya tuviera bien puestas.

function orderMatchesSearch(o, q){
  if(!q) return true;
  return tolMatch(q, formatFolio(o.orderNumber), String(o.orderNumber||''), o.customer, o.customerName, o.phone, o.customerPhone, o.cashierName, o.address, (o.items||[]).map(it=>it.name).join(' '));
}
function onOrderSearchInput(v){
  state.orderSearch = v;
  state.selectedOrders = [];
  resetShowMore('ordersShowMore');
  render();
  const i = document.getElementById('order-search-input');
  if(i){ i.focus(); i.setSelectionRange(v.length, v.length); }
}
function resetOrderFilters(){
  state.orderSearch=''; state.orderSourceFilter='Todos'; state.orderStatusFilter='Todos'; state.orderRiskOnly=false; state.orderUnpaidOnly=false;
  state.selectedOrders=[]; resetShowMore('ordersShowMore'); render();
}
function setOrderFilter(key, val){
  state[key]=val; state.selectedOrders=[]; resetShowMore('ordersShowMore'); render();
}
const ORDER_NEXT_STATUS = {"Nuevo":"Preparando","Preparando":"En camino","En camino":"Entregado"};
function renderPedidos(){
  const q = (state.orderSearch||'').trim().toLowerCase();
  const source = state.orderSourceFilter||'Todos';
  const statusF = state.orderStatusFilter||'Todos';
  const scope = state.orders.filter(o=> state.showArchived ? o.archived : !o.archived);
  const activeCount = state.orders.filter(o=>!o.archived).length;
  const archivedCount = state.orders.length - activeCount;
  const newCount = state.orders.filter(o=>!o.archived && o.status==='Nuevo').length;
  const base = scope.filter(o=> (source==='Todos'||o.source===source) && orderMatchesSearch(o,q));
  const riskOnly = !!state.orderRiskOnly;
  const unpaidOnly = !!state.orderUnpaidOnly;
  const riskIds = new Set(riskOrders().map(o=>o.id));
  const unpaidList = state.orders.filter(orderIsUnpaidDelivered);
  const unpaidSum = unpaidList.reduce((a,o)=>a+(o.total||0),0);
  const shown = base.filter(o=> (statusF==='Todos' || o.status===statusF) && (!riskOnly || riskIds.has(o.id)) && (!unpaidOnly || orderIsUnpaidDelivered(o)));
  const abandonedCount = pendingAbandonedCarts().length;
  const filterCount = (q?1:0) + (source!=='Todos'?1:0) + (statusF!=='Todos'?1:0) + (riskOnly?1:0) + (unpaidOnly?1:0);
  const chips = ["Todos", ...STATUS_FLOW].map(f=>{
    const n = f==='Todos' ? base.length : base.filter(o=>o.status===f).length;
    return `<button class="${statusF===f?'active':''}" onclick="setOrderFilter('orderStatusFilter','${f}')">${f} <span class="chip-n">${n}</span></button>`;
  }).join('') + (riskIds.size || riskOnly ? `<button class="${riskOnly?'active':''}" onclick="state.orderRiskOnly=!state.orderRiskOnly;state.selectedOrders=[];resetShowMore('ordersShowMore');render()">Revisar <span class="chip-n">${riskIds.size}</span></button>` : '') + (unpaidList.length || unpaidOnly ? `<button class="${unpaidOnly?'active':''}" onclick="state.orderUnpaidOnly=!state.orderUnpaidOnly;state.selectedOrders=[];resetShowMore('ordersShowMore');render()">Sin cobrar <span class="chip-n">${unpaidList.length}</span></button>` : '');
  return `
    <div class="prod-head">
      <div>
        <div class="prod-title">Pedidos</div>
        <div class="prod-sub">${activeCount} activo${activeCount===1?'':'s'}${newCount?` · <strong style="color:var(--primary);">${newCount} nuevo${newCount===1?'':'s'} por atender</strong>`:''}${archivedCount?` · ${archivedCount} archivado${archivedCount===1?'':'s'}`:''}${unpaidList.length?` · <strong style="color:#8a5a1a;">${money(unpaidSum)} por cobrar</strong>`:''}</div>
      </div>
      <div class="prod-head-actions">
        <button class="btn-tools" onclick="state.abandonedCartsOpen=true;render()">${icon('bag',15)} Carritos abandonados${abandonedCount?` (${abandonedCount})`:''}</button>
      </div>
    </div>
    <div class="status-filter ord-chips">${chips}</div>
    <div class="prod-filters">
      <input id="order-search-input" class="prod-search" type="search" placeholder="Buscar por folio, cliente, teléfono o producto..." value="${escDescHtml(state.orderSearch||'')}" oninput="onOrderSearchInput(this.value)">
      <select class="prod-select ${source!=='Todos'?'is-set':''}" onchange="setOrderFilter('orderSourceFilter',this.value)">
        <option value="Todos">Origen: todos</option>
        <option value="tienda" ${source==='tienda'?'selected':''}>Tienda en línea</option>
        <option value="pos" ${source==='pos'?'selected':''}>Punto de venta</option>
      </select>
      <select class="prod-select ${state.showArchived?'is-set':''}" onchange="state.showArchived=(this.value==='1');state.selectedOrders=[];resetShowMore('ordersShowMore');render()">
        <option value="0" ${!state.showArchived?'selected':''}>Activos (${activeCount})</option>
        <option value="1" ${state.showArchived?'selected':''}>Archivados (${archivedCount})</option>
      </select>
      ${filterCount ? `<button class="prod-clear" onclick="resetOrderFilters()">${icon('x',14)} Limpiar</button>` : ''}
    </div>
    <div class="prod-count">${filterCount ? `${shown.length} de ${scope.length} pedidos` : `${shown.length} pedido${shown.length===1?'':'s'}`}${state.showArchived?' archivados':''}</div>
    ${shown.length===0 ? `<div class="empty-state">No hay pedidos que coincidan con este filtro${q?` ("${escDescHtml(state.orderSearch)}")`:''}.</div>` : (()=>{
      const {shown:visible, remaining} = showMoreSlice('ordersShowMore', shown);
      const visibleIds = visible.map(o=>o.id);
      const selected = state.selectedOrders||[];
      const allVisibleSelected = visibleIds.length>0 && visibleIds.every(id=>selected.includes(id));
      return `
    ${selected.length>0 ? `
      <div class="bulk-actions-bar">
        <span>${selected.length} seleccionado${selected.length===1?'':'s'}</span>
        <select onchange="if(this.value){bulkSetOrdersStatus(this.value);this.value='';}">
          <option value="">Cambiar estado a...</option>
          ${STATUS_FLOW.map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
        <button class="btn-tertiary" onclick="bulkArchiveOrders(${!state.showArchived})">${state.showArchived?'Restaurar':'Archivar'}</button>
        ${state.commissionAgents.length>0 ? `
        <select onchange="if(this.value){const ag=state.commissionAgents.find(a=>a.id===this.value); bulkAssignCommission(this.value, ag.defaultPct);this.value='';}">
          <option value="">Asignar comisionista...</option>
          ${state.commissionAgents.map(a=>`<option value="${a.id}">${escDescHtml(a.name)} (${a.defaultPct}%)</option>`).join('')}
        </select>` : ''}
        <button class="btn-danger-text" onclick="bulkDeleteOrders()">${icon('trash',14)} Eliminar</button>
        <button class="btn-tertiary" onclick="state.selectedOrders=[];render()">Cancelar</button>
      </div>` : ''}
    <div class="orders-table-wrap ord-wrap">
      <table class="orders-table pedidos-table">
        <thead><tr>
          <th class="c-check"><input type="checkbox" title="Seleccionar visibles" ${allVisibleSelected?'checked':''} onchange='toggleSelectAllOrders(${JSON.stringify(visibleIds)}, this.checked)'></th>
          <th>Folio</th><th>Cliente</th><th>Total y pago</th><th>Productos</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody>
          ${visible.map(o=>renderOrderRow(o)).join('')}
        </tbody>
      </table>
    </div>
    ${renderShowMoreButton('ordersShowMore', remaining)}`;
    })()}
  `;
}
function toggleOrderSelection(id){
  const sel = state.selectedOrders||(state.selectedOrders=[]);
  const i = sel.indexOf(id);
  if(i>=0) sel.splice(i,1); else sel.push(id);
  render();
}
function toggleSelectAllOrders(visibleIds, checked){
  if(checked) state.selectedOrders = [...new Set([...(state.selectedOrders||[]), ...visibleIds])];
  else state.selectedOrders = (state.selectedOrders||[]).filter(id=>!visibleIds.includes(id));
  render();
}
async function bulkSetOrdersStatus(status){
  const ids = [...(state.selectedOrders||[])];
  for(const id of ids){ await updateOrderStatus(id, status, true); }
  state.selectedOrders = [];
  showToast(`${ids.length} pedido(s) cambiado(s) a "${status}"`);
  render();
}
async function bulkArchiveOrders(archived){
  const ids = [...(state.selectedOrders||[])];
  for(const id of ids){ await toggleArchiveOrder(id, archived, true); }
  state.selectedOrders = [];
  showToast(`${ids.length} pedido(s) ${archived?'archivado(s)':'restaurado(s)'}`);
  render();
}
async function bulkDeleteOrders(){
  const ids = [...(state.selectedOrders||[])];
  if(!confirm(`¿Eliminar ${ids.length} pedido(s)? No se puede deshacer.`)) return;
  for(const id of ids){
    const o = state.orders.find(x=>x.id===id);
    if(o) await deleteOrder(id, o.source, true);
  }
  state.selectedOrders = [];
  showToast(`${ids.length} pedido(s) eliminado(s)`);
  render();
}
function renderOrderRow(o){
  const isPos = o.source==='pos';
  const productsOpen = state.orderDetail===o.id;
  const menuOpen = state.orderActionsMenu===o.id;
  const isSelected = (state.selectedOrders||[]).includes(o.id);
  const itemCount = (o.items||[]).reduce((s,it)=>s+it.qty,0);
  const shipSub = isPos ? '' : (o.address || '');
  const isSplitPay = isPos && salePayments(o).length > 1;
  const _ps = orderPayState(o);
  const payLabel = isPos ? paymentMethodShortLabel(o) : (_ps==='pagado' ? `Pagado · ${o.paymentMethod||'Efectivo'}` : _ps==='por_conciliar' ? 'Por conciliar' : (o.status==='Entregado' ? 'Sin cobrar' : 'Contra entrega'));
  const payLabelFull = isPos ? paymentMethodLabel(o) : payLabel;
  const payCls = isPos ? '' : (_ps==='pagado' ? 'paid' : _ps==='por_conciliar' ? 'recon' : (o.status==='Entregado' ? 'pending-cash' : ''));
  const next = !o.archived ? ORDER_NEXT_STATUS[o.status] : null;
  let rows = `
    <tr class="${o.archived?'archived-row':''}${isSelected?' selected-row':''}">
      <td class="c-check"><input type="checkbox" ${isSelected?'checked':''} onclick="event.stopPropagation();toggleOrderSelection('${o.id}')"></td>
      <td class="c-folio"><button class="order-folio-btn" onclick="event.stopPropagation();openOrderDetailModal('${o.id}')">${formatFolio(o.orderNumber)}</button>
        <div class="order-date-sub">${new Date(o.date).toLocaleDateString('es-MX',{day:'numeric',month:'short'})} · ${new Date(o.date).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div>
      </td>
      <td class="c-cust">
        <div class="ord-cust-name">${escDescHtml(o.customer || (isPos?'Venta en tienda física':'Cliente'))} ${(()=>{
          const matched = orderContactPhone(o) ? findCustomerByPhone(orderContactPhone(o)) : null;
          const orderName = (isPos ? o.customerName : o.customer) || '';
          const mismatch = matched && orderName && matched.name.trim().toLowerCase() !== orderName.trim().toLowerCase();
          return mismatch ? `<span title="Ya tienes registrada a ${escDescHtml(matched.name)} con este teléfono">${icon('alert-triangle',13)}</span>` : '';
        })()}</div>
        <div class="order-source-tag">${isPos?`${icon('receipt')} Punto de venta · ${escDescHtml(o.cashierName||'')}`:icon('bag')+' Tienda en línea'}</div>
        ${(!isPos && o.campaign)?`<div class="order-camp-tag">Campaña: ${escDescHtml(o.campaign)}</div>`:''}
        ${!isPos ? riskTagHtml(o) : ''}
        ${!isPos ? failureTagHtml(o) : ''}
        ${shipSub ? `<div class="order-ship-sub" title="${escDescHtml(shipSub)}">${icon('map-pin',11)} ${escDescHtml(shipSub)}</div>` : ''}
      </td>
      <td class="c-total">
        <strong>${money(o.total)}</strong>
        <span class="order-pay-pill ${isSplitPay?'split':''} ${payCls}" ${isSplitPay?`title="${escDescHtml(payLabelFull)}"`:''}>${isSplitPay?icon('layers',12):'$'} ${escDescHtml(payLabel)}</span>
      </td>
      <td class="c-prod">
        <button class="order-products-toggle ${productsOpen?'open':''}" onclick="state.orderDetail=state.orderDetail==='${o.id}'?null:'${o.id}';render()">
          ${itemCount} unid. <span class="chev">▾</span>
        </button>
      </td>
      <td class="c-status">
        <span class="status-badge" style="background:${STATUS_COLOR[o.status]||'#8a6b78'};color:${STATUS_TEXT_COLOR[o.status]||'#fff'}">${o.status||'—'}</span>
      </td>
      <td class="order-actions-cell c-act">
        ${next ? `<button class="ord-next" title="Pasar a ${next}" onclick="event.stopPropagation();updateOrderStatus('${o.id}','${next}')">→ ${next}</button>` : ''}
        ${menuOpen ? `<div class="order-actions-overlay" onclick="state.orderActionsMenu=null;render()"></div>` : ''}
        <button class="order-actions-btn" aria-label="Más acciones" onclick="event.stopPropagation();state.orderActionsMenu=state.orderActionsMenu==='${o.id}'?null:'${o.id}';render()">⋮</button>
        ${menuOpen ? `
          <div class="order-actions-menu">
            <div class="tools-menu-label">Cambiar estado</div>
            ${STATUS_FLOW.map(s=>`<button class="${o.status===s?'active-status':''}" onclick="state.orderActionsMenu=null;updateOrderStatus('${o.id}','${s}')">${o.status===s?icon('check')+' ':''}${s}</button>`).join('')}
            <hr>
            <button onclick="state.orderActionsMenu=null;openOrderDetailModal('${o.id}')">${icon('receipt',14)} Ver detalle</button>
            ${!isPos ? `<button onclick="state.orderActionsMenu=null;sendToDelivery('${o.id}')">${icon('truck',14)} Enviar al repartidor</button>` : ''}
            ${!isPos && o.status!=='Cancelado' && o.status!=='Entregado' ? `<button onclick="openFailModal('${o.id}')">${icon('alert-triangle',14)} No se pudo entregar</button>` : ''}
            ${!isPos && orderPayState(o)!=='pagado' && o.status!=='Cancelado' ? `<button onclick="state.orderActionsMenu=null;setOrderPayment('${o.id}',{paymentStatus:'pagado'})">${icon('dollar-sign',14)} Marcar como pagado</button>` : ''}
            ${!o.orderNumber ? `<button onclick="state.orderActionsMenu=null;assignFolioToOrder('${o.id}','${o.source}')">Asignar folio</button>` : ''}
            <button onclick="state.orderActionsMenu=null;state.assignCommissionOrderId='${o.id}';render()">${icon('percent',14)} ${o.commissionAgentName?`Comisión: ${escDescHtml(o.commissionAgentName)}`:'Asignar comisionista'}</button>
            <button onclick="state.orderActionsMenu=null;toggleArchiveOrder('${o.id}',${!o.archived})">${o.archived?'Restaurar':'Archivar'}</button>
            <button class="btn-danger-text" onclick="state.orderActionsMenu=null;deleteOrder('${o.id}','${o.source}')">${icon('trash',14)} Eliminar</button>
          </div>
        ` : ''}
      </td>
    </tr>`;
  if(productsOpen){
    rows += `
    <tr class="products-detail-row"><td colspan="8">
      ${(o.items||[]).map(it=>`<div class="pd-line"><span>${it.qty}x ${escDescHtml(it.name)}</span><span>${money(it.price*it.qty)}</span></div>`).join('')}
      ${isPos
        ? `<div class="pd-extra"><span>Método de pago</span><span>${escDescHtml(paymentMethodLabel(o))}</span></div>`
        : `<div class="pd-extra"><span>Teléfono</span><span>${escDescHtml(o.phone||'—')}</span></div>
           <div class="pd-extra"><span>Dirección</span><span>${escDescHtml(o.address||'—')}</span></div>
           ${o.notes?`<div class="pd-extra"><span>Notas</span><span>${escDescHtml(o.notes)}</span></div>`:''}`
      }
    </td></tr>`;
  }
  return rows;
}

/* ============== MENSAJES (buzón de quejas y sugerencias) ==============
   Los clientes dejan un mensaje desde la tienda (index.html), sin necesidad de escribir por
   WhatsApp — igual que el buzón de mensajes que tenía Tiendanube. Se guardan en la colección
   "storeMessages" (solo creación pública, lectura/edición con el permiso "mensajes", ver
   firestore.rules). Cada mensaje trae nombre, teléfono, un tipo (pregunta/sugerencia/queja/otro)
   y el texto; aquí se pueden marcar como leídos/respondidos y responder por WhatsApp en un clic. */
// Colores de marca aprobados — antes "leído" y "respondido" usaban tonos fuera de la paleta de 7.
const MESSAGE_STATUS_COLOR = {nuevo:'#bc355c', leido:'#F6A030', respondido:'#7AB71A'};
const MESSAGE_STATUS_TEXT_COLOR = {nuevo:'#fff', leido:'#2B1620', respondido:'#2B1620'};
const MESSAGE_STATUS_LABEL = {nuevo:'Nuevo', leido:'Leído', respondido:'Respondido'};
const MESSAGE_TYPE_LABEL = {pregunta:'Pregunta', sugerencia:'Sugerencia', queja:'Queja', otro:'Otro', almacen:'Nota de almacén'};
function logStoreMessageReply(id){
  const m = state.storeMessages.find(x=>x.id===id); if(!m) return;
  const msg = `Hola ${m.name||''}, soy de ${state.settings.storeName}. Vi tu mensaje: "${(m.message||'').slice(0,180)}" — `;
  logCustomerMessage(m.phone, m.name, msg, 'mensaje');
}
function messageWhatsappLink(m){
  const num = normalizePhone(m.phone);
  if(!num) return null;
  const msg = `Hola ${m.name||''}, soy de ${state.settings.storeName}. Vi tu mensaje: "${(m.message||'').slice(0,180)}" — `;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
async function updateMessageStatus(id, status){
  try{ await db.collection('storeMessages').doc(id).update({status}); }
  catch(e){ console.error(e); showToast('No se pudo actualizar el mensaje'); return; }
  const m = state.storeMessages.find(x=>x.id===id);
  if(m) m.status = status;
  render();
}
async function deleteStoreMessage(id){
  if(!confirm('¿Eliminar este mensaje? Esta acción no se puede deshacer.')) return;
  try{
    await db.collection('storeMessages').doc(id).delete();
    state.storeMessages = state.storeMessages.filter(x=>x.id!==id);
    showToast('Mensaje eliminado'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar el mensaje'); }
}
function toggleMessageSelected(id){
  const i = state.selectedMessages.indexOf(id);
  if(i>=0) state.selectedMessages.splice(i,1); else state.selectedMessages.push(id);
  render();
}
// Archivar es reversible (a diferencia de eliminar): el mensaje simplemente deja de aparecer en
// la bandeja principal, pero se puede traer de vuelta con "Ver archivados" en cualquier momento.
async function archiveMessages(ids, archived, fromUndo){
  if(!ids.length) return;
  try{
    await Promise.all(ids.map(id=>db.collection('storeMessages').doc(id).update({archived})));
    ids.forEach(id=>{ const m = state.storeMessages.find(x=>x.id===id); if(m) m.archived = archived; });
    state.selectedMessages = [];
    render();
    const nMsg = `${ids.length} mensaje${ids.length===1?'':'s'}`;
    if(archived && !fromUndo) showUndo(`${nMsg} archivado${ids.length===1?'':'s'}`, ()=>archiveMessages(ids, false, true));
    else showToast(archived ? `${nMsg} archivado${ids.length===1?'':'s'}` : `${nMsg} restaurado${ids.length===1?'':'s'}`);
  }catch(e){ console.error(e); showToast('No se pudo actualizar los mensajes'); }
}
function filteredStoreMessages(){
  let list = [...(state.storeMessages||[])].sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
  list = list.filter(m=> state.showArchivedMessages ? !!m.archived : !m.archived);
  if(state.messageStatusFilter && state.messageStatusFilter!=='Todos'){
    list = list.filter(m=>(m.status||'nuevo')===state.messageStatusFilter);
  }
  const q = (state.messageSearch||'').trim().toLowerCase();
  if(q) list = list.filter(m=> tolMatch(q, m.name, m.message, m.phone));
  return list;
}
function onMessageSearchInput(v){
  state.messageSearch=v; resetShowMore('messagesShowMore'); render();
  const i=document.getElementById('message-search-input');
  if(i){ i.focus(); i.setSelectionRange(v.length, v.length); }
}
function renderMensajes(){
  const list = filteredStoreMessages();
  const live = state.storeMessages.filter(m=>!m.archived);
  const unansweredOld = live.filter(m=>(m.status||'nuevo')!=='respondido' && m.date && (Date.now()-new Date(m.date).getTime())>24*60*60000);
  const archivedCount = state.storeMessages.length - live.length;
  const newCount = live.filter(m=>(m.status||'nuevo')==='nuevo').length;
  const selectedOnScreen = state.selectedMessages.filter(id=>list.some(m=>m.id===id));
  const scope = state.storeMessages.filter(m=> state.showArchivedMessages ? m.archived : !m.archived);
  const filters = [
    {key:'Todos', label:'Todos', n:scope.length},
    {key:'nuevo', label:'Nuevos', n:scope.filter(m=>(m.status||'nuevo')==='nuevo').length},
    {key:'leido', label:'Leídos', n:scope.filter(m=>m.status==='leido').length},
    {key:'respondido', label:'Respondidos', n:scope.filter(m=>m.status==='respondido').length},
  ];
  const q = (state.messageSearch||'').trim();
  const filterCount = (q?1:0) + (state.messageStatusFilter!=='Todos'?1:0);
  return `
    <div class="prod-head">
      <div>
        <div class="prod-title">Mensajes</div>
        <div class="prod-sub">${live.length} en el buzón${newCount?` · <strong style="color:var(--primary);">${newCount} nuevo${newCount===1?'':'s'}</strong>`:''}${archivedCount?` · ${archivedCount} archivado${archivedCount===1?'':'s'}`:''}</div>

/* ============== CENTROS DE DISTRIBUCIÓN ============== */
function centerStock(p, centerId){ return (p.stockByCenter && p.stockByCenter[centerId]) || 0; }
/* ---- Variantes con existencias POR CENTRO ----
   v.stockByCenter = {idCentro: piezas}; v.stock siempre es la suma (la tienda en línea lee ese total).
   Una variante antigua (sin stockByCenter) se considera guardada toda en el centro principal. */
function vCenterStock(v, cid){
  if(!v) return 0;
  if(v.stockByCenter) return v.stockByCenter[cid]||0;
  return cid===defaultCenterId() ? (v.stock||0) : 0;
}
function vSetCenterStock(v, cid, n){
  if(!v.stockByCenter){ v.stockByCenter = {}; const d = defaultCenterId(); if(d) v.stockByCenter[d] = v.stock||0; }
  v.stockByCenter[cid] = Math.max(0, Math.floor(Number(n)||0));
  v.stock = Object.values(v.stockByCenter).reduce((s,x)=>s+(x||0),0);
}
function vImage(p, v){ return (v && typeof v.imageIdx==='number' && p && p.images && p.images[v.imageIdx]) || null; }
function vNormalize(v){ if(!v.stockByCenter){ vSetCenterStock(v, defaultCenterId(), v.stock||0); } return v; }
// El producto con variantes guarda también su total por centro (suma de sus variantes), para que listas y reportes cuadren.
function vProductSync(p){
  if(!(p.variants && p.variants.length)) return;
  const ids = new Set(state.centers.map(c=>c.id)); p.variants.forEach(v=>Object.keys(v.stockByCenter||{}).forEach(k=>ids.add(k)));
  const sbc = {}; ids.forEach(id=>{ if(!id) return; const n = p.variants.reduce((s,v)=>s+vCenterStock(v,id),0); if(n>0 || (p.stockByCenter && p.stockByCenter[id]!==undefined)) sbc[id]=n; });
  p.stockByCenter = sbc; p.stock = p.variants.reduce((s,v)=>s+(v.stock||0),0);
}
/* "Unidades de stock": un producto sin variantes es una; con variantes, una por variante. Clave "idProducto" o "idProducto::idVariante". */
function stockUnits(p){
  if(p.variants && p.variants.length) return p.variants.map(v=>({key:p.id+'::'+v.id, p, v, label:p.name+' — '+(Object.values(v.combo||{}).join(' / ')||'Variante')}));
  return [{key:p.id, p, v:null, label:p.name}];
}
function stockUnitByKey(key){ const parts=String(key).split('::'); const p=state.products.find(x=>x.id===parts[0]); if(!p) return null; if(!parts[1]) return {key, p, v:null, label:p.name}; return stockUnits(p).find(u=>u.key===key)||null; }
function stockUnitAvail(u, cid){ return u.v ? vCenterStock(u.v, cid) : centerStock(u.p, cid); }
function totalStock(p){ return p.stockByCenter ? Object.values(p.stockByCenter).reduce((s,n)=>s+(n||0),0) : (p.stock||0); }

/* ============== KITS / COMBOS ==============
   Un kit es un producto normal (mismo id, precio, imágenes, categorías) pero marcado con
   isKit:true y una lista kitItems:[{productId,qty}] de los productos que lo componen. No tiene
   existencias propias por centro: su "stock" se calcula solo, como el mínimo de lo que
   alcanza para armar más kits con lo que hay de cada componente — y se recalcula cada vez que
   se guarda el kit, cada vez que se vende uno en el Punto de Venta (que descuenta de los
   productos reales, no del kit) y como red de seguridad al cargar el panel. Así, un kit se
   muestra "Agotado" solo con la lógica que ya existe para cualquier producto (p.stock<=0), sin
   tocar nada más de la tienda ni del POS.
   */
// Cuántas veces se ha visto un producto en la tienda en los últimos N días — reutiliza los
// mismos eventos "product_view" que ya alimentan Estadísticas, solo que aquí filtrados a uno
// solo y a una ventana de tiempo, para mostrarlo en la propia ficha del producto.
function productViewsInLastDays(productId, days){
  const cutoff = Date.now() - (days||30)*86400000;
  return (state.analyticsEvents||[]).filter(e=>e.type==='product_view' && e.productId===productId && new Date(e.date).getTime()>=cutoff).length;
}
function computeKitStock(p){
  const items = p.kitItems||[];
  if(!items.length) return 0;
  let min = Infinity;
  items.forEach(ki=>{
    const comp = state.products.find(x=>x.id===ki.productId);
    const need = ki.qty||1;
    const avail = comp ? Math.floor(totalStock(comp)/need) : 0;
    if(avail < min) min = avail;
  });
  return min===Infinity ? 0 : Math.max(0, min);
}
// Después de una venta (o de cancelarla/reactivarla) que movió el stock de estos productos,
// refresca el stock cacheado de cualquier kit que los use como componente.
async function refreshAllKitStocks(){
  const kits = state.products.filter(p=>p.isKit);
  if(!kits.length) return;
  const batch = db.batch();
  let changed = 0;
  kits.forEach(k=>{
    const newStock = computeKitStock(k);
    if(newStock !== (k.stock||0)){ k.stock = newStock; batch.update(db.collection('products').doc(k.id), {stock:newStock}); changed++; }
  });
  if(changed) try{ await batch.commit(); }catch(e){ console.error('No se pudo refrescar el stock de kits al cargar', e); }
}
async function recomputeKitStocksFor(componentIds){
  const ids = new Set(componentIds||[]);
  const kits = state.products.filter(p=>p.isKit && (p.kitItems||[]).some(ki=>ids.has(ki.productId)));
  if(!kits.length) return;
  const batch = db.batch();
  kits.forEach(k=>{ k.stock = computeKitStock(k); batch.update(db.collection('products').doc(k.id), {stock:k.stock}); });
  try{ await batch.commit(); }catch(e){ console.error('No se pudo actualizar el stock de los kits/combos', e); }
}
/* ============== ORDEN MANUAL DE PRODUCTOS DENTRO DE UNA CATEGORÍA ==============
   Por default el catálogo público se mezcla solo cada día (dailyShuffledProducts en index.html)
   para que no se vea siempre igual. Aquí se permite fijar un orden a mano DENTRO de una
   categoría (p.categorySortOrder[cat] = posición); los productos sin orden fijado siguen
   mezclándose entre ellos como hasta ahora, pero los que sí tienen posición van primero, en el
   orden elegido. */
function productsInCategory(cat){
  return state.products.filter(p=>(p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).includes(cat));
}
function sortByCategoryOrder(list, cat){
  return [...list].sort((a,b)=>{
    const ao = (a.categorySortOrder||{})[cat]; const bo = (b.categorySortOrder||{})[cat];
    if(ao!=null && bo!=null) return ao-bo;
    if(ao!=null) return -1;
    if(bo!=null) return 1;
    return 0;
  });
}
async function moveProductInCategory(id, cat, dir){
  const ordered = sortByCategoryOrder(productsInCategory(cat), cat);
  const idx = ordered.findIndex(p=>p.id===id);
  const target = idx+dir;
  if(idx<0 || target<0 || target>=ordered.length) return;
  [ordered[idx], ordered[target]] = [ordered[target], ordered[idx]];
  const batch = db.batch();
  ordered.forEach((p,i)=>{
    p.categorySortOrder = {...(p.categorySortOrder||{}), [cat]: i};
    batch.update(db.collection('products').doc(p.id), {categorySortOrder: p.categorySortOrder});
  });
  try{ await batch.commit(); render(); }
  catch(e){ console.error('No se pudo guardar el nuevo orden', e); showToast('No se pudo guardar el nuevo orden'); }
}

function addKitComponent(id){

async function commitTransfer(){
  const items = Object.entries(state.transferCart).filter(([id,qty])=>qty>0);
  if(!state.transferFrom || !state.transferTo){ showToast('Elige centro de origen y destino'); return; }
  if(state.transferFrom === state.transferTo){ showToast('El origen y destino deben ser distintos'); return; }
  if(items.length===0){ showToast('Agrega al menos un producto a transferir'); return; }

  const fromCenter = state.centers.find(c=>c.id===state.transferFrom);
  const toCenter = state.centers.find(c=>c.id===state.transferTo);
  const batch = db.batch();
  const transferItems = [];
  for(const [key, qty] of items){
    const u = stockUnitByKey(key); if(!u) continue;
    const available = stockUnitAvail(u, state.transferFrom);
    if(qty > available){ showToast(`No hay suficiente stock de "${u.label}" en ${fromCenter.name} (disponible: ${available})`); return; }
  }
  const touchedProds = new Set();
  items.forEach(([key, qty])=>{
    const u = stockUnitByKey(key); if(!u) return;
    const p = u.p, pid = p.id;
    if(u.v){
      vSetCenterStock(u.v, state.transferFrom, vCenterStock(u.v,state.transferFrom) - qty);
      vSetCenterStock(u.v, state.transferTo, vCenterStock(u.v,state.transferTo) + qty);
      touchedProds.add(pid);
    }else{
      if(!p.stockByCenter) p.stockByCenter = {};
      p.stockByCenter[state.transferFrom] = (p.stockByCenter[state.transferFrom]||0) - qty;
      p.stockByCenter[state.transferTo] = (p.stockByCenter[state.transferTo]||0) + qty;
      batch.update(db.collection('products').doc(pid), {stockByCenter: p.stockByCenter});
    }
    logStockMovement(pid, 'transferencia_salida', -qty, `Transferencia a ${toCenter.name}${u.v?' · '+u.label:''}`, state.transferFrom);
    logStockMovement(pid, 'transferencia_entrada', qty, `Transferencia desde ${fromCenter.name}${u.v?' · '+u.label:''}`, state.transferTo);
    transferItems.push(Object.assign({productId:pid, name:u.label, qty}, u.v?{variantId:u.v.id}:{}));
  });
  touchedProds.forEach(pid=>{ const p = state.products.find(x=>x.id===pid); vProductSync(p); batch.update(db.collection('products').doc(pid), {variants:p.variants, stockByCenter:p.stockByCenter, stock:p.stock}); });
  const transferDoc = {
    date: new Date().toISOString(), fromCenterId: state.transferFrom, fromCenterName: fromCenter.name,
    toCenterId: state.transferTo, toCenterName: toCenter.name, items: transferItems, notes: state.transferNotes.trim(),
  };
  try{
    const ref = db.collection('transfers').doc();
    batch.set(ref, transferDoc);
    await batch.commit();
    state.transfers.unshift({id:ref.id, ...transferDoc});
    state.transferCart = {}; state.transferNotes=''; state.transferProductSearch='';
    showToast('Transferencia realizada'); render();
  }catch(e){ console.error(e); showToast('No se pudo completar la transferencia'); }
}
async function revertTransfer(id){
  const t = state.transfers.find(x=>x.id===id); if(!t) return;
  if(t.reverted){ showToast('Esa transferencia ya se revirtió'); return; }
  const problems=[];
  (t.items||[]).forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    if(!p){ problems.push(`${it.name}: el producto ya no existe`); return; }
    const sv = it.variantId ? (p.variants||[]).find(v=>v.id===it.variantId) : null;
    if(it.variantId && !sv){ problems.push(`${it.name}: la variante ya no existe`); return; }
    const have = sv ? vCenterStock(sv,t.toCenterId) : centerStock(p,t.toCenterId);
    if(have<it.qty) problems.push(`${it.name}: en ${t.toCenterName} quedan ${have} de ${it.qty}`);
  });
  if(problems.length){ alert('No se puede revertir porque ya no están todas las piezas en el destino:\n\n'+problems.join('\n')); return; }
  if(!confirm(`¿Revertir la transferencia ${t.fromCenterName} → ${t.toCenterName}? Las piezas regresan a ${t.fromCenterName}.`)) return;
  try{
    const batch = db.batch(); const touched=new Set();
    (t.items||[]).forEach(it=>{
      const p = state.products.find(x=>x.id===it.productId);
      const sv = it.variantId ? p.variants.find(v=>v.id===it.variantId) : null;
      if(sv){ vSetCenterStock(sv,t.toCenterId,vCenterStock(sv,t.toCenterId)-it.qty); vSetCenterStock(sv,t.fromCenterId,vCenterStock(sv,t.fromCenterId)+it.qty); touched.add(p.id); }
      else{ if(!p.stockByCenter) p.stockByCenter={}; p.stockByCenter[t.toCenterId]=(p.stockByCenter[t.toCenterId]||0)-it.qty; p.stockByCenter[t.fromCenterId]=(p.stockByCenter[t.fromCenterId]||0)+it.qty; batch.update(db.collection('products').doc(p.id),{stockByCenter:p.stockByCenter}); }
      logStockMovement(p.id,'transferencia_revertida',0,`Se revirtió la transferencia ${t.fromCenterName} → ${t.toCenterName}`,t.fromCenterId);
    });
    touched.forEach(pid=>{ const p=state.products.find(x=>x.id===pid); vProductSync(p); batch.update(db.collection('products').doc(pid),{variants:p.variants, stockByCenter:p.stockByCenter, stock:p.stock}); });
    batch.update(db.collection('transfers').doc(id),{reverted:true, revertedAt:new Date().toISOString()});
    await batch.commit();
    t.reverted=true; t.revertedAt=new Date().toISOString();
    logAdminAction('transferencia_revertida','transferencia',`${t.fromCenterName} → ${t.toCenterName}`);
    showToast('Transferencia revertida'); render();
  }catch(e){ console.error(e); showToast('No se pudo revertir'); }
}

function normalizePhone(phone){ return (phone||'').replace(/\D/g,''); }
function computeCustomersList(){
  const byPhone = {};
  // 1) Se arman automáticamente a partir de los pedidos de la tienda (index.html).
  state.orders.filter(o=>o.source!=='pos' && o.phone).forEach(o=>{
    const key = normalizePhone(o.phone);
    if(!key) return;
    if(!byPhone[key]){
      byPhone[key] = { id:key, name:o.customer||'Sin nombre', phone:o.phone, email:'', address:'', city:'', state:'', country:'', notes:'', tags:[],
        createdAt:null, purchases:[], totalSpent:0, isManual:false, manualId:null };
    }
    const c = byPhone[key];
    // La dirección y el nombre se toman del pedido más reciente (es lo que el
    // cliente escribió al pagar, así que es lo más actualizado que tenemos de él).
    if(new Date(o.date) > new Date(c.lastDate||0)){ c.name = o.customer||c.name; c.address = o.address||c.address; c.lastDate = o.date; c.lastFolio = o.orderNumber; }
    if(o.status!=='Cancelado'){ c.totalSpent += (o.total||0); c.purchases.push(o); }
  });
  // 2) Se combinan con los perfiles que tú creas/editas a mano (colección "customers").
  //    Si ya tienen dirección capturada a mano, esa manda sobre la del pedido.
  state.customers.forEach(m=>{
    const key = m.phone ? normalizePhone(m.phone) : `manual_${m.id}`;
    if(byPhone[key]){
      Object.assign(byPhone[key], { name:m.name||byPhone[key].name, email:m.email||'', address:m.address||byPhone[key].address||'', city:m.city||'', state:m.state||'', country:m.country||'', notes:m.notes||'', tags:m.tags||[], createdAt:m.createdAt||null, isManual:true, manualId:m.id });
    }else{
      byPhone[key] = { id:key, name:m.name||'Sin nombre', phone:m.phone||'', email:m.email||'', address:m.address||'', city:m.city||'', state:m.state||'', country:m.country||'', notes:m.notes||'', tags:m.tags||[],
        createdAt:m.createdAt||null, purchases:[], totalSpent:0, isManual:true, manualId:m.id };
    }
  });
  // 3) Se suman también las ventas del Punto de Venta que quedaron asociadas a un
  // cliente de la lista (seleccionado desde pos.html), buscando su perfil por el
  // mismo id de "customers" con el que ya se armó el punto 2.
  const byManualId = {};
  Object.entries(byPhone).forEach(([key,c])=>{ if(c.manualId) byManualId[c.manualId] = key; });
  state.orders.filter(o=>o.source==='pos' && o.customerId).forEach(o=>{
    let key = byManualId[o.customerId];
    if(!key){
      // El perfil pudo haberse borrado después de la venta; se conserva su historial igual.
      key = `manual_${o.customerId}`;
      if(!byPhone[key]){
        byPhone[key] = { id:key, name:o.customerName||'Sin nombre', phone:o.customerPhone||'', email:'', address:'', city:'', state:'', country:'', notes:'', tags:[],
          createdAt:null, purchases:[], totalSpent:0, isManual:false, manualId:o.customerId };
      }
    }
    const c = byPhone[key];
    if(new Date(o.date) > new Date(c.lastDate||0)){ c.lastDate = o.date; c.lastFolio = o.orderNumber; }
    c.totalSpent += (o.total||0); c.purchases.push(o);
  });
  return Object.values(byPhone).map(c=>({
    ...c,
    purchaseCount: c.purchases.length,
    registeredAt: c.createdAt || c.lastDate || null,
  })).sort((a,b)=>b.totalSpent-a.totalSpent);
}
function filteredCustomers(){
  let list = computeCustomersList();
  const q = (state.customerSearch||'').trim().toLowerCase();
  if(q) list = list.filter(c=>tolMatch(q, c.name, c.phone, c.email));
  const f = state.customerFilters;
  if(f.country!=='Todos') list = list.filter(c=>(c.country||'—')===f.country);
  if(f.state!=='Todos') list = list.filter(c=>(c.state||'—')===f.state);
  if(f.city!=='Todos') list = list.filter(c=>(c.city||'—')===f.city);
  if(f.regDate!=='Todas'){
    const days = {'Último día':1,'Últimos 7 días':7,'Últimos 30 días':30}[f.regDate];
    if(days){ const cutoff = Date.now()-days*86400000; list = list.filter(c=>c.registeredAt && new Date(c.registeredAt).getTime()>=cutoff); }
  }
  // "Clientes que dejaron de comprar": alguien que compraba seguido (2+ veces) y ya no ha
  // vuelto en 60+ días — vale más la pena recuperarlo que a alguien que solo compró una vez.
  if(f.inactive){
    const cutoff = Date.now()-60*86400000;
    list = list.filter(c=>c.purchaseCount>=2 && c.lastDate && new Date(c.lastDate).getTime()<cutoff);
  }
  if(f.tag && f.tag!=='Todas') list = list.filter(c=>(c.tags||[]).includes(f.tag));
  return list;
}
function distinctCustomerValues(field){
  const vals = new Set(computeCustomersList().map(c=>c[field]||'—'));
  return Array.from(vals).sort();
}
function distinctCustomerTags(){
  const tags = new Set();
  computeCustomersList().forEach(c=>(c.tags||[]).forEach(t=>tags.add(t)));
  return Array.from(tags).sort();
}
