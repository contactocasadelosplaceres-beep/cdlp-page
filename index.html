<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Casa de los Placeres — Catálogo</title>
<link rel="icon" type="image/png" href="favicon.png">
<!-- Vista previa al compartir el enlace (WhatsApp, redes, etc.) — antes no existía ninguna,
     así que un enlace compartido se veía como un cuadro gris sin nombre ni descripción. -->
<meta property="og:title" content="La Casa de los Placeres">
<meta property="og:description" content="Tu catálogo con total discreción. Explora, arma tu pedido y recíbelo en la puerta de tu casa.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://contactocasadelosplaceres-beep.github.io/cdlp-page/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="La Casa de los Placeres">
<meta name="twitter:description" content="Tu catálogo con total discreción. Explora, arma tu pedido y recíbelo en la puerta de tu casa.">
<meta name="twitter:image" content="https://contactocasadelosplaceres-beep.github.io/cdlp-page/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700;800&family=Lora:wght@400;500;600&family=Poppins:wght@500;600;700;800&family=Fraunces:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style id="custom-css-injected"></style>
<style>
  :root{
    --bg: #FBF5F2; --surface: #FFFFFF; --surface-soft: #F6E9E6;
    --ink: #2B1620; --ink-soft: #6E5560;
    --primary: #993477; --primary-deep: #5C1F49; --rose: #BC355C;
    --coral: #ED7578; --amber: #F6A030; --green: #7AB71A; --teal: #20B7CA; --navy: #0A4A5B;
    --border: #EBD9D3; --radius-card: 16px; --radius-sm:10px; --radius-md:14px; --radius-lg:20px; --radius-pill: 999px;
    --shadow-sm:0 2px 10px -6px rgba(43,22,32,0.18);
    --shadow-md:0 16px 32px -16px rgba(74,22,66,0.28);
    --shadow-lg:0 28px 56px -24px rgba(74,22,66,0.38);
    --font-heading:'League Spartan',sans-serif; --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;position:relative;}
  h1,h2,h3,.display{font-family:var(--font-heading);letter-spacing:0.01em;margin:0;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit;touch-action:manipulation;}
  a{touch-action:manipulation;}
  img{max-width:100%;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1160px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ===== HEADER ===== */
  .topbar{position:fixed;top:0;left:0;right:0;width:100%;z-index:30;background:var(--primary-deep);color:#fff;box-shadow:0 6px 20px -12px rgba(0,0,0,0.4);padding-top:env(safe-area-inset-top, 0px);}
  .topbar-spacer{width:100%;}
  .topbar-main{padding:12px 16px;display:flex;align-items:center;gap:12px;}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex-shrink:1;padding:0;margin:0;}
  .brand-mark-img{width:32px;height:32px;border-radius:9px;object-fit:cover;flex-shrink:0;display:block;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--rose),var(--amber));flex-shrink:0;display:none;}
  .brand-text{line-height:1.15;min-width:0;overflow:hidden;}
  .brand-name{font-family:var(--font-heading);font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-sub{font-size:10.5px;color:#e9c9dc;letter-spacing:0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-nav{display:none;flex:1;justify-content:center;gap:22px;font-size:13.5px;font-weight:600;}
  .header-nav a{opacity:.88;white-space:nowrap;}
  .header-nav a:hover{opacity:1;}
  @media(min-width:860px){.header-nav{display:flex;}}
  .header-actions{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0;}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,0.12);}
  .cart-btn{position:relative;background:rgba(255,255,255,0.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cart-count{position:absolute;top:2px;right:2px;background:var(--amber);color:#3a2200;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--primary-deep);}
  .search-bar{overflow:hidden;max-height:0;transition:max-height .2s ease;}
  .search-bar.open{max-height:60px;}
  .search-bar-inner{padding:0 16px 12px;}
  .search-input{width:100%;padding:12px 14px;border-radius:var(--radius-pill);border:none;font-size:16px;font-family:inherit;background:rgba(255,255,255,0.14);color:#fff;}
  .search-input::placeholder{color:#e9c9dc;}
  @media(max-width:480px){
    /* Antes "Discreto · Confidencial..." se veía a medias ("Discreto · Confid…") en casi
       cualquier celular porque el header no tenía espacio para el logo + nombre + 4 botones +
       ese subtítulo completo. Es el mensaje de discreción más importante del sitio, así que en
       vez de mostrarlo cortado se oculta aquí (ya se repite completo más abajo, en la franja de
       confianza "Compra segura · Empaque discreto..."). */
    .brand-sub{display:none;}
    .brand-name{font-size:14.5px;}
  }
  @media(max-width:359px){
    .topbar-main{padding:10px 12px;gap:8px;}
    .brand-name{font-size:14px;}
    .cart-btn{width:40px;height:40px;}
    .icon-btn{width:40px;height:40px;}
  }


  /* ===== HERO ===== */
  .hero{position:relative;padding:34px 20px 24px;background:linear-gradient(180deg,var(--primary-deep) 0%,var(--primary-deep) 58%,var(--bg) 58%);}
  .hero-inner{background:var(--surface);border-radius:20px;padding:28px 24px;box-shadow:0 20px 40px -24px rgba(74,22,66,0.5);}
  .hero h1{font-size:27px;font-weight:800;color:var(--primary-deep);max-width:480px;line-height:1.14;}
  .hero p{margin-top:10px;color:var(--ink-soft);max-width:460px;font-size:14.5px;line-height:1.55;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .hero-btn-primary{background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;box-shadow:0 10px 22px -10px rgba(188,53,92,0.5);transition:transform .12s ease;}
  .hero-btn-primary:active{transform:scale(0.97);}
  .hero-btn-ghost{background:var(--surface-soft);color:var(--primary-deep);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;}
  .hero-btn-wa{color:var(--green);padding:12px 6px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .load-more-btn{background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:15px 30px;border-radius:999px;font-size:15px;font-weight:800;box-shadow:0 14px 28px -12px rgba(188,53,92,0.55);display:inline-flex;align-items:center;gap:9px;transition:transform .12s ease, box-shadow .12s ease;animation:loadMorePulse 2.6s ease-in-out infinite;}
  .load-more-btn:active{transform:scale(0.96);}
  .load-more-btn .lm-chev{display:inline-flex;animation:loadMoreChev 1.4s ease-in-out infinite;}
  .load-more-wrap{text-align:center;padding:26px 0 8px;}
  .load-more-count{display:block;margin-top:9px;color:var(--ink-soft);font-size:12.5px;font-weight:600;}
  @keyframes loadMorePulse{0%,100%{box-shadow:0 14px 28px -12px rgba(188,53,92,0.55);}50%{box-shadow:0 16px 32px -10px rgba(188,53,92,0.8);}}
  @keyframes loadMoreChev{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
  @media(max-width:359px){
    .hero{padding:24px 14px 20px;}
    .hero-inner{padding:20px 16px;border-radius:16px;}
    .hero h1{font-size:22px;}
    .hero p{font-size:13.5px;}
    .hero-btn-primary,.hero-btn-ghost{padding:11px 16px;font-size:13px;}
  }

  /* ===== TRUST BAR ===== */
  .trust-bar{display:flex;overflow-x:auto;gap:0;padding:18px 20px;scrollbar-width:none;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;}
  .trust-bar::-webkit-scrollbar{display:none;}
  .trust-item{flex-shrink:0;display:flex;align-items:center;gap:8px;padding-right:26px;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .trust-item .ic{font-size:16px;}
  @media(min-width:860px){.trust-bar{justify-content:space-between;}.trust-item{padding-right:0;}}

  /* ===== QUÉ BUSCAS ===== */
  .needs-block{padding:30px 20px 6px;}
  .needs-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .needs-row::-webkit-scrollbar{display:none;}
  .need-pill{flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--primary-deep);padding:12px 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;text-decoration:none;}
  .need-pill:hover{border-color:var(--primary);}
  .need-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ===== GENERIC SECTION ===== */
  .section-block{padding:32px 20px 6px;}
  .section-heading{font-family:var(--font-heading);font-size:20px;font-weight:800;color:var(--primary-deep);margin:0;}
  .section-sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .section-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;}

  /* ===== CATEGORY CHIPS ===== */
  .cats{display:flex;gap:8px;overflow-x:auto;padding:26px 20px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;padding:10px 16px;min-height:40px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);font-size:13.5px;font-weight:600;white-space:nowrap;}
  .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ===== PRODUCT GRID / CARD ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 16px 8px;}
  @media(min-width:400px){.grid{gap:16px;padding:16px 20px 8px;}}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:visible;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease;cursor:pointer;}
  .card:hover{box-shadow:var(--shadow-sm);}
  .card:active{transform:scale(0.98);}
  .card-media{position:relative;}
  .card-image-wrap{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius-card) var(--radius-card) 0 0;background:linear-gradient(135deg,var(--surface-soft),var(--border));}
  .card-image-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-image-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;}
  .badge-row{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:9.5px;font-weight:700;padding:5px 9px;border-radius:7px;letter-spacing:0.02em;color:#fff;}
  .badge-stock{background:rgba(43,22,32,0.78);}
  .badge-best{background:var(--amber);color:#3a2200;}
  .fab-add{position:absolute;bottom:-18px;right:10px;width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -6px rgba(110,33,89,0.55);}
  .fab-add:disabled{opacity:.4;}
  .wishlist-fab{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.9);color:var(--rose);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.18);}
  .card-body{padding:24px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card-cat{min-width:0;font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
  .card-name{min-width:0;overflow-wrap:anywhere;word-break:break-word;font-size:14px;font-weight:700;line-height:1.25;font-family:var(--font-heading);margin:0;}
  .card-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-price{font-weight:800;color:var(--primary-deep);font-size:15px;margin-top:2px;}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}

  /* ===== FIRST-TIME BAND ===== */
  .first-band{margin:34px 20px 6px;border-radius:20px;background:linear-gradient(135deg,var(--amber),#f7b658);padding:28px 24px;color:#3a2200;}
  .first-band h3{font-size:19px;font-weight:800;max-width:340px;}
  .first-band p{margin-top:8px;font-size:13.5px;line-height:1.5;max-width:380px;opacity:.92;}
  .first-band .hero-btn-ghost{background:rgba(255,255,255,0.55);color:#3a2200;margin-top:14px;display:inline-block;}

  /* ===== CROSS-SELL SUGGESTION (carrito) ===== */
  .cross-sell-card{display:flex;align-items:center;gap:10px;background:var(--surface-soft);border:1px solid var(--border);border-radius:14px;padding:10px;margin-top:14px;}
  .cross-sell-swatch{width:48px;height:48px;border-radius:10px;flex-shrink:0;object-fit:cover;background:linear-gradient(135deg,var(--surface-soft),var(--border));}
  .cross-sell-info{flex:1;min-width:0;font-size:12.5px;line-height:1.4;}
  .cross-sell-info b{color:var(--primary-deep);}
  .cross-sell-add{flex-shrink:0;background:var(--primary);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;}

  /* ===== SUGERENCIAS GENÉRICAS DEL CARRITO ("también te puede interesar") ===== */
  .cart-suggestions{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .cart-suggestions-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em;}
  .cart-suggestions-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .cart-suggestions-row::-webkit-scrollbar{display:none;}
  .suggestion-card{flex-shrink:0;width:118px;cursor:pointer;display:flex;flex-direction:column;gap:4px;}
  .suggestion-swatch{width:118px;height:118px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--surface-soft),var(--border));}
  .suggestion-name{font-size:11.5px;font-weight:600;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .suggestion-price{font-size:12.5px;font-weight:800;color:var(--primary-deep);}
  .suggestion-add{width:100%;background:var(--surface-soft);border:1px solid var(--border);color:var(--primary-deep);padding:7px;border-radius:var(--radius-sm);font-size:11px;font-weight:700;margin-top:2px;}

  /* ===== PROMO BANNER ===== */
  .promo-banner{margin:0 20px 6px;border-radius:20px;overflow:hidden;background:var(--surface-soft);border:1px solid var(--border);display:flex;flex-direction:column;}
  @media(min-width:640px){.promo-banner{flex-direction:row;align-items:stretch;}}
  .promo-banner-img{width:100%;max-height:220px;object-fit:cover;display:block;}
  @media(min-width:640px){.promo-banner-img{width:38%;max-height:none;}}
  .promo-banner-body{padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .promo-banner-title{font-family:var(--font-heading);font-size:20px;font-weight:800;color:var(--rose);}
  .promo-banner-text{color:var(--ink-soft);font-size:13.5px;line-height:1.5;}
  .btn-promo{align-self:flex-start;margin-top:6px;background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;box-shadow:0 8px 18px -10px rgba(188,53,92,0.5);}

  /* ===== KITS ===== */
  .kits-row{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 20px 8px;}
  @media(min-width:640px){.kits-row{grid-template-columns:repeat(2,1fr);}}
  .kit-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;}
  .kit-thumb{width:64px;height:64px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--surface-soft),var(--border));display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px;color:#fff;}
  .kit-thumb img{width:100%;height:100%;object-fit:cover;}
  .kit-info{flex:1;min-width:0;}
  .kit-name{font-weight:700;font-size:14px;font-family:var(--font-heading);}
  .kit-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .kit-price{font-weight:800;color:var(--primary-deep);font-size:14.5px;margin-top:6px;}
  .kit-add{background:var(--primary);color:#fff;padding:9px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;flex-shrink:0;transition:transform .12s ease;}
  .kit-add:active{transform:scale(0.95);}

  /* ===== TESTIMONIALS ===== */
  .rating-line{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
  .testimonial-row{display:grid;grid-template-columns:1fr;gap:12px;padding:0 20px 6px;}
  @media(min-width:640px){.testimonial-row{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:980px){.testimonial-row{grid-template-columns:repeat(3,1fr);}}
  .faq-list{padding:0 20px;display:flex;flex-direction:column;gap:10px;}
  .faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .faq-question{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;text-align:left;font-weight:700;font-size:14.5px;color:var(--ink);background:none;border:none;cursor:pointer;}
  .faq-chevron{flex-shrink:0;color:var(--ink-soft);transition:transform .2s ease;}
  .faq-chevron.open{transform:rotate(180deg);}
  .faq-answer{padding:0 16px 16px;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .testimonial-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;color:var(--ink);line-height:1.5;}
  .testimonial-card .stars{color:var(--amber);font-size:12px;margin-bottom:6px;display:block;}
  .testimonial-card p{margin:0;}
  .testimonial-name{margin-top:10px;font-size:11.5px;color:var(--ink-soft);font-weight:700;}

  /* ===== DISCRETION BAND ===== */
  .discretion-band{margin:34px 0 0;background:var(--navy);color:#fff;padding:36px 20px;}
  .discretion-inner{max-width:1160px;margin:0 auto;}
  .discretion-band h3{font-size:20px;font-weight:800;max-width:360px;}
  .discretion-band>.discretion-inner>p{margin-top:8px;color:#bcd6dc;font-size:13.5px;max-width:420px;line-height:1.55;}
  .discretion-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px;}
  @media(min-width:640px){.discretion-grid{grid-template-columns:repeat(4,1fr);}}
  .discretion-item{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#e3eef0;}
  .discretion-item .ic{font-size:20px;}

  /* ===== WHATSAPP CTA ===== */
  .newsletter-block{text-align:center;background:var(--surface-soft);border-radius:20px;margin:34px 20px 6px;padding:32px 20px;}
  .newsletter-block .section-heading{margin-bottom:8px;}
  .newsletter-text{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;max-width:360px;margin-left:auto;margin-right:auto;}

/* ============== REGISTRO DE ERRORES DEL SISTEMA ==============
   Si algo truena sin que nadie lo esté viendo (un error de JavaScript no capturado, una promesa
   rechazada), se guarda automáticamente en Firestore para que Ale lo pueda ver después en el
   panel — en vez de perderse solo en la consola del navegador de quien lo vivió. Con un tope por
   sesión para no inundar la base de datos si algo entra en bucle de errores. */
let systemErrorsLoggedThisSession = 0;
const SYSTEM_ERROR_LOG_LIMIT = 5;
function logSystemError(message, stack){
  if(systemErrorsLoggedThisSession >= SYSTEM_ERROR_LOG_LIMIT) return;
  systemErrorsLoggedThisSession++;
  try{
    db.collection('systemErrors').add({
      message: String(message||'Error desconocido').slice(0,500),
      stack: String(stack||'').slice(0,2000),
      source: 'index',
      page: location.pathname + location.search,
      userAgent: (navigator.userAgent||'').slice(0,300),
      date: new Date().toISOString(),
    }).catch(()=>{});
  }catch(e){}
}
window.addEventListener('error', (ev)=>{ logSystemError(ev.message, ev.error && ev.error.stack ? ev.error.stack : ''); });
window.addEventListener('unhandledrejection', (ev)=>{
  const r = ev.reason;
  logSystemError(r && r.message ? r.message : String(r), r && r.stack ? r.stack : '');
});

// Folio consecutivo compartido con el Punto de Venta: cada pedido/venta obtiene
// un número único e incremental (#0001, #0002, ...) sin importar de dónde venga.
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}

/* ============== PERSISTENCIA DEL CARRITO ==============
   Antes el carrito solo vivía en memoria: un refresh accidental, cerrar la pestaña, o que el
   celular descargue la pestaña en segundo plano lo borraba por completo sin ningún aviso. Ahora
   se guarda en este mismo celular/navegador (igual que el perfil y la lista de deseos) y se
   restaura solo al volver a entrar. Si algún producto del carrito guardado ya no existe o aún no
   cargó, simplemente no se muestra hasta que el catálogo completo esté disponible (parseCartKey
   ya maneja eso) — no se cae la página. */
const CART_STORAGE_KEY = 'cdlp_cart';
function loadStoredCart(){
  try{
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return (parsed && typeof parsed==='object' && !Array.isArray(parsed)) ? parsed : {};
  }catch(e){ return {}; }
}
function saveCart(){
  try{ localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(state.cart)); }catch(e){ /* almacenamiento no disponible, se ignora */ }
}

let state = { products:[], settings:{...DEFAULT_SETTINGS}, orderCount:0, cart: loadStoredCart(), activeCat:"Todos", activeNeed:null, activeBestSellers:false, searchQuery:"", searchOpen:false, cartOpen:false, checkoutOpen:false, profileOpen:false, profileDraft:null, orderPlaced:false, loaded:false, loadError:false, catalogIncomplete:false, detailProductId:null, detailImageIndex:0, detailSelectedVariant:{}, lastOrderNumber:null, gridRenderLimit:20, submittingOrder:false, couponInput:"", appliedCoupon:null, couponError:"", messageDrawerOpen:false, sendingMessage:false, messageSent:false, messageDraft:{name:'',phone:'',type:'pregunta',text:''}, checkoutReminderOpen:false, checkoutReminderShown:false, openFaqIndex:null, notifySent:{}, notifyName:'', notifyPhone:'', fullCatalogLoaded:false, wishlistOpen:false, compareIds:[], compareOpen:false, cartAbandonSurveyOpen:false, cartAbandonSurveyShown:false, priceMin:'', priceMax:'', privacyPolicyOpen:false };

async function loadData(){
  try{
    const [prodSnap, setSnap, counterSnap] = await Promise.all([
      db.collection('products').orderBy('name').limit(40).get(),
      db.collection('settings').doc('store').get(),
      db.collection('counters').doc('orders').get(),
    ]);
    // "counters/orders" es de lectura pública (lo usa también el checkout para sacar el
    // folio) y se incrementa en cada pedido de la tienda y cada venta del Punto de Venta,
    // así que sirve como número real de pedidos para el rating-line, sin exponer ningún
    // dato de pedidos individuales (eso sigue protegido detrás del permiso "pedidos").
    state.orderCount = counterSnap.exists ? Math.max(0, (counterSnap.data().next||1) - 1) : 0;
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>!p.hidden);
    state.settings = setSnap.exists ? {...DEFAULT_SETTINGS, ...setSnap.data()} : {...DEFAULT_SETTINGS};
    if(!state.settings.categories || !state.settings.categories.length) state.settings.categories = [...DEFAULT_CATEGORIES];
    if(!state.settings.hiddenCategories) state.settings.hiddenCategories = [];
    if(!state.settings.needs || !state.settings.needs.length) state.settings.needs = JSON.parse(JSON.stringify(DEFAULT_NEEDS));
    if(!state.settings.sections || !state.settings.sections.length) state.settings.sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
    if(!state.settings.promoBanner) state.settings.promoBanner = {title:"",text:"",image:"",buttonText:"",buttonLink:""};
    if(!state.settings.featuredProductIds) state.settings.featuredProductIds = [];
    if(!state.settings.testimonials) state.settings.testimonials = [];
    if(!state.settings.wholesaleTiers) state.settings.wholesaleTiers = [];
    if(!state.settings.coupons) state.settings.coupons = [];
    if(!state.settings.promotions) state.settings.promotions = [];
    if(!state.settings.theme) state.settings.theme = {};
  }catch(e){
    console.error(e);
    state.products = []; state.settings = {...DEFAULT_SETTINGS}; state.loadError = true;
  }
  state.loaded = true;
  captureWholesaleCodeFromURL();
  captureKioskModeFromURL();
  render();
  const cssTag = document.getElementById('custom-css-injected');
  if(cssTag) cssTag.textContent = state.settings.customCss || '';
  applyThemeVars();
  trackVisit();
  openProductFromURL();
  // En segundo plano, sin bloquear la primera pantalla: trae el resto del catálogo completo
  // (arriba solo se cargaron los primeros 40, para que la primera pantalla aparezca rápido).
  // Antes, si esto fallaba (señal débil, la app pasó a segundo plano, etc.) no se reintentaba
  // ni se avisaba nada — la persona se quedaba viendo solo esos 40 productos (los primeros en
  // orden alfabético) para siempre, sin enterarse. Si por casualidad ninguno de esos 40 coincidía
  // con la categoría que tenía abierta, o con nada relacionado a lo que llevaba en el carrito,
  // se sentía como si "no hubiera productos" o "no aparecieran sugerencias" — cuando en realidad
  // sí existían, solo que no habían terminado de cargar. Ahora si falla, reintenta solo unas
  // cuantas veces, y si de plano no puede, avisa con un botón para intentar de nuevo a mano.
  if(!state.loadError) loadFullCatalogWithRetry();
}
// Enlace directo a un producto (ej. compartido por WhatsApp): ?producto=ID en la URL. Si ese
// producto no viene entre los primeros 40 que se cargaron de entrada, se trae solo, sin esperar
// a que termine de bajar el catálogo completo — así el enlace abre rápido sin importar qué tan
// grande sea el catálogo. Antes no existía forma de mandar a alguien directo a un producto: todo
// enlace compartido caía en la página principal y la persona tenía que buscarlo desde cero.
// También soporta ?categoria=NombreDeCategoria, para compartir el catálogo ya filtrado a una
// categoría completa (ej. "todo lo de Ropa femenina") en vez de un solo producto.
async function openProductFromURL(){
  const params = new URLSearchParams(location.search);
  const id = params.get('producto');
  const catParam = params.get('categoria');
  if(catParam){
    const url = new URL(location.href); url.searchParams.delete('categoria');
    history.replaceState({}, '', url.toString());
    const match = visibleCategories().find(c=>c.toLowerCase()===catParam.toLowerCase());
    if(match) goToCatalog(match);
    else showToast('Esa categoría ya no está disponible');
  }
  if(!id) return;
  let p = state.products.find(x=>x.id===id);
  if(!p){
    try{
      const doc = await db.collection('products').doc(id).get();
      if(doc.exists){
        p = {id: doc.id, ...doc.data()};
        if(!state.products.find(x=>x.id===p.id)) state.products.push(p);
      }
    }catch(e){ console.error('No se pudo cargar el producto del enlace directo', e); }
  }
  const url = new URL(location.href); url.searchParams.delete('producto');
  history.replaceState({}, '', url.toString());
  if(p && !p.hidden){ openProductDetail(p.id); }
  else { showToast('Ese producto ya no está disponible'); }
}
async function loadFullCatalogWithRetry(attempt){
  attempt = attempt || 1;
  try{
    const fullSnap = await db.collection('products').orderBy('name').get();
    state.products = fullSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>!p.hidden);
    state.catalogIncomplete = false; state.fullCatalogLoaded = true;
    render();
  }catch(e){
    console.error(`No se pudo completar el catálogo en segundo plano (intento ${attempt})`, e);
    if(attempt < 3){
      setTimeout(()=>loadFullCatalogWithRetry(attempt+1), 2000*attempt);
    } else {
      state.catalogIncomplete = true;
      render();
    }
  }
}
function trackVisit(){
  try{ db.collection('visits').add({date: new Date().toISOString(), source: trafficSourceBucket()}); }catch(e){ /* silencioso */ }
}
/* ============== ANALÍTICA: eventos de embudo (vistas de producto, agregar al carrito, inicio de checkout) ==============
   Se guardan en una colección aparte ('analyticsEvents') en vez de 'visits' para no
   inflar esa colección (el admin la trae con límite de 3000 documentos, y mezclar
   eventos de alta frecuencia ahí reduciría la ventana de tiempo que cubre ese límite). */
function trafficSourceBucket(){
  try{
    const ref = document.referrer;
    if(!ref) return 'directo';
    const host = new URL(ref).hostname.replace(/^www\./,'');
    if(/google\./.test(host)) return 'google';
    if(/facebook\.|instagram\.|fb\.com/.test(host)) return 'meta';
    if(/whatsapp\./.test(host)) return 'whatsapp';
    if(/tiktok\./.test(host)) return 'tiktok';
    if(host === location.hostname) return 'directo';
    return host || 'otro';
  }catch(e){ return 'directo'; }
}
function trackEvent(type, extra){
  try{ db.collection('analyticsEvents').add(Object.assign({type, date:new Date().toISOString()}, extra||{})); }catch(e){ /* silencioso */ }
}

/* ============== BORRADOR DE CARRITO (para recuperación por WhatsApp desde el admin) ==============
   En cuanto el cliente escribió su nombre y teléfono en el checkout (y tiene productos en el
   carrito), se guarda un borrador en "abandonedCarts" (un documento por teléfono, se sobreescribe
   con cada cambio). Si completa el pedido, ese borrador se borra. Si lo abandona, el admin puede
   verlo en Pedidos → "Carritos abandonados" y escribirle por WhatsApp. Todo silencioso: nunca debe
   interrumpir el checkout si falla. */
let abandonedCartTimer = null;
function scheduleAbandonedCartSave(){
  clearTimeout(abandonedCartTimer);
  abandonedCartTimer = setTimeout(saveAbandonedCartDraft, 1500);
}
function saveAbandonedCartDraft(){
  try{
    const nameEl = document.getElementById('ck-name'), phoneEl = document.getElementById('ck-phone');
    const addressEl = document.getElementById('ck-address'), notesEl = document.getElementById('ck-notes');
    if(!nameEl || !phoneEl) return;
    const name = nameEl.value.trim(), phone = phoneEl.value.trim();
    const address = addressEl ? addressEl.value.trim() : '', notes = notesEl ? notesEl.value.trim() : '';
    const phoneDigits = phone.replace(/\D/g,'');
    if(!name || phoneDigits.length<8 || cartCount()===0) return;
    const items = Object.entries(state.cart).map(([key,qty])=>{
      const {p,v} = parseCartKey(key);
      if(!p) return null;
      const price = v && v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p);
      return {id:p.id, name: p.name + (v?` (${variantLabel(v)})`:''), price, qty};
    }).filter(Boolean);
    if(!items.length) return;
    db.collection('abandonedCarts').doc(phoneDigits).set({
      name, phone, address, notes, items, total: cartTotal(),
      updatedAt: new Date().toISOString(), completed:false
    });
  }catch(e){ /* silencioso, no debe interrumpir el checkout */ }
}
function clearAbandonedCartDraft(phone){
  try{
    const phoneDigits = (phone||'').replace(/\D/g,'');
    if(phoneDigits) db.collection('abandonedCarts').doc(phoneDigits).delete();
  }catch(e){ /* silencioso */ }
}

/* ============== ENCUESTA RÁPIDA AL ABANDONAR EL CARRITO ==============
   Si el cliente cierra el carrito (la X o tocando fuera) mientras todavía tiene productos
   adentro — es decir, se va sin pasar a pagar — se le pregunta una sola vez por sesión, con
   opciones de un clic, por qué no completó su pedido. Es opcional (se puede cerrar sin
   responder) y nunca vuelve a aparecer en la misma sesión, para no ser invasivos. Las respuestas
   se guardan en Firestore para que el admin las revise en conjunto. */

function dismissCartAbandonSurvey(){ state.cartAbandonSurveyOpen = false; render(); }

function effectivePrice(p){ return (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : p.price; }

/* ============== MAYOREO ============== */
const WHOLESALE_KEY = 'cdlp_wholesale_code';
function captureWholesaleCodeFromURL(){
  const params = new URLSearchParams(location.search);
  const code = params.get('mayoreo');
  if(code){
    const tier = (state.settings.wholesaleTiers||[]).find(t=>t.active && t.code===code.toUpperCase());
    if(tier){
      try{ localStorage.setItem(WHOLESALE_KEY, tier.code); }catch(e){}
      showToast(`Modo mayoreo activado: ${tier.name}`);
    }
    const url = new URL(location.href); url.searchParams.delete('mayoreo');
    history.replaceState({}, '', url.toString());
  }
}
function activeWholesaleTier(){
  let code = null;
  try{ code = localStorage.getItem(WHOLESALE_KEY); }catch(e){}
  if(!code) return null;
  return (state.settings.wholesaleTiers||[]).find(t=>t.active && t.code===code) || null;
}

/* ============== MODO KIOSKO / VITRINA ==============
   Pensado para una tablet en el mostrador de la tienda física: muestra el catálogo para que la
   clienta lo hojee, pero sin botones de comprar ni carrito — solo puede ver productos y precios;
   cualquier compra la hace el personal desde el Punto de Venta. Se activa con ?vitrina=1 en la
   URL (queda guardado en ese dispositivo, no hace falta repetirlo cada vez que se prende la
   tablet) y se apaga con ?vitrina=0. */
const KIOSK_KEY = 'cdlp_kiosk_mode';
function captureKioskModeFromURL(){
  const params = new URLSearchParams(location.search);
  const val = params.get('vitrina');
  if(val==null) return;
  try{
    if(val==='0') localStorage.removeItem(KIOSK_KEY);
    else localStorage.setItem(KIOSK_KEY,'1');
  }catch(e){}
  const url = new URL(location.href); url.searchParams.delete('vitrina');
  history.replaceState({}, '', url.toString());
}
function isKioskMode(){
  try{ return localStorage.getItem(KIOSK_KEY)==='1'; }catch(e){ return false; }
}
function isEligibleForTier(p, tier){
  if(!tier) return false;
  if(tier.scope==='all') return true;
  if(tier.scope==='categories') return productCats(p).some(c=>(tier.categories||[]).includes(c));
  if(tier.scope==='products') return (tier.productIds||[]).includes(p.id);
  return false;
}
function wholesaleCartProgress(tier){
  let amount = 0, qty = 0;
  Object.entries(state.cart).forEach(([key,q])=>{
    const {p} = parseCartKey(key);
    if(p && isEligibleForTier(p, tier)){ amount += effectivePrice(p)*q; qty += q; }
  });
  const current = tier.minType==='amount' ? amount : qty;
  return { current, needed: tier.minValue, unlocked: current >= tier.minValue };
}
function finalPrice(p){
  const tier = activeWholesaleTier();
  const base = effectivePrice(p);
  if(tier && isEligibleForTier(p, tier)){
    const progress = wholesaleCartProgress(tier);
    if(progress.unlocked) return Math.round(p.price*(1-tier.discountPercent/100)*100)/100;
  }
  return base;
}
function clearWholesaleCode(){
  try{ localStorage.removeItem(WHOLESALE_KEY); }catch(e){}
  showToast('Modo mayoreo desactivado'); render();
}
function applyWholesaleCodeManually(){
  const input = document.getElementById('wholesale-code-input');
  const code = (input.value||'').trim().toUpperCase();
  if(!code) return;
  const tier = (state.settings.wholesaleTiers||[]).find(t=>t.active && t.code===code);
  if(!tier){ showToast('Código no válido'); return; }
  try{ localStorage.setItem(WHOLESALE_KEY, tier.code); }catch(e){}
  showToast(`Modo mayoreo activado: ${tier.name}`); render();
}

/* ============== CUPONES DE DESCUENTO ============== */
function isCouponEligible(p, coupon){
  if(coupon.scope==='all') return true;
  if(coupon.scope==='categories') return productCats(p).some(c=>(coupon.categories||[]).includes(c));
  if(coupon.scope==='products') return (coupon.productIds||[]).includes(p.id);
  return false;
}
function cartHasCouponEligibleItem(coupon){
  return Object.keys(state.cart).some(key=>{ const {p}=parseCartKey(key); return p && isCouponEligible(p, coupon); });
}
async function applyCouponCode(){
  const code = (state.couponInput||'').trim().toUpperCase();
  state.couponError = '';
  if(!code){ return; }
  const coupon = (state.settings.coupons||[]).find(c=>c.code===code);
  if(!coupon || !coupon.active){ state.couponError = 'Código no válido'; render(); return; }
  const now = new Date();
  if(coupon.startDate && now < new Date(coupon.startDate)){ state.couponError = 'Este cupón todavía no está vigente'; render(); return; }
  if(coupon.endDate && now > new Date(coupon.endDate+'T23:59:59')){ state.couponError = 'Este cupón ya venció'; render(); return; }
  if(!cartHasCouponEligibleItem(coupon)){ state.couponError = 'Este cupón no aplica a los productos de tu carrito'; render(); return; }
  if(coupon.maxUses>0){
    try{
      const used = await db.collection('couponUsage').where('code','==',code).get();
      if(used.size >= coupon.maxUses){ state.couponError = 'Este cupón ya alcanzó su límite de usos'; render(); return; }
    }catch(e){ console.error(e); }
  }
  // Aviso temprano para cupones de un solo uso por cliente: si ya tenemos su teléfono guardado
  // en este celular (compró antes y guardó sus datos), se revisa de una vez. Si no lo tenemos
  // todavía (primera visita, aún no llega al checkout), la revisión definitiva ocurre de todos
  // modos al confirmar el pedido, en submitOrder — esto es solo para no hacerle perder el tiempo.
  if(coupon.singleUsePerCustomer){
    const savedProfile = loadCustomerProfile();
    if(savedProfile && savedProfile.phone){
      const usedByThisPhone = await couponUsedByPhone(code, savedProfile.phone);
      if(usedByThisPhone){ state.couponError = 'Ya usaste este cupón antes'; render(); return; }
    }
  }
  state.appliedCoupon = coupon; state.couponInput = ''; showToast(`Cupón ${code} aplicado`); render();
}
async function couponUsedByPhone(code, phone){
  const digits = (phone||'').replace(/\D/g,'');
  if(!digits) return false;
  try{
    const snap = await db.collection('couponUsage').where('code','==',code).where('phone','==',digits).get();
    return !snap.empty;
  }catch(e){ console.error(e); return false; }
}
function removeCoupon(){ state.appliedCoupon=null; state.couponError=''; render(); }
function couponDiscountedPrice(p, price){
  if(!state.appliedCoupon || !isCouponEligible(p, state.appliedCoupon)) return price;
  return Math.round(price*(1-state.appliedCoupon.discountPercent/100)*100)/100;
}

/* ============== PROMOCIONES AUTOMÁTICAS ============== */
function activePromotions(){
  const now = new Date();
  return (state.settings.promotions||[]).filter(promo=>{
    if(!promo.active) return false;
    if(promo.startDate && now < new Date(promo.startDate)) return false;
    if(promo.endDate && now > new Date(promo.endDate+'T23:59:59')) return false;
    return true;
  });
}
function isPromoScopeEligible(p, promo){
  if(promo.scope==='all') return true;
  if(promo.scope==='categories') return productCats(p).some(c=>(promo.categories||[]).includes(c));
  if(promo.scope==='products') return (promo.productIds||[]).includes(p.id);
  return false;
}
function cartEligibleQtyAndAmount(promo){
  let qty=0, amount=0;
  Object.entries(state.cart).forEach(([key,q])=>{
    const {p} = parseCartKey(key);
    if(p && isPromoScopeEligible(p, promo)){ qty+=q; amount += finalPrice(p)*q; }
  });
  return {qty, amount};
}
// Precio por unidad después de aplicar la MEJOR promoción automática disponible
// (nunca se combinan varias entre sí: siempre se usa la que más le convenga al cliente).
function automaticDiscountedPrice(p){
  let best = finalPrice(p); // ya incluye precio promocional del producto y mayoreo (si está desbloqueado)
  activePromotions().forEach(promo=>{
    if(promo.type==='cart_discount' && isPromoScopeEligible(p, promo)){
      const {amount} = cartEligibleQtyAndAmount(promo);
      if(amount >= (promo.minAmount||0)){
        const candidate = Math.round(p.price*(1-promo.discountPercent/100)*100)/100;
        if(candidate < best) best = candidate;
      }
    }
    if(promo.type==='progressive' && isPromoScopeEligible(p, promo)){
      const {qty} = cartEligibleQtyAndAmount(promo);
      const applicable = (promo.tiers||[]).filter(t=>qty>=t.minQty).sort((a,b)=>b.discountPercent-a.discountPercent);
      if(applicable.length){
        const candidate = Math.round(p.price*(1-applicable[0].discountPercent/100)*100)/100;
        if(candidate < best) best = candidate;
      }
    }
    if(promo.type==='cross_sell' && promo.discountProductId===p.id){
      const hasTrigger = Object.keys(state.cart).some(key=>{ const {p:pp}=parseCartKey(key); return pp && pp.id===promo.triggerProductId; });
      if(hasTrigger){
        const candidate = Math.round(p.price*(1-promo.discountPercent/100)*100)/100;
        if(candidate < best) best = candidate;
      }
    }
  });
  return best;
}
// "Lleva X y paga Y": junta las unidades elegibles de todo el carrito, y hace gratis
// las más baratas de cada grupo completo de X unidades.
function buyXPayYAdjustment(){
  let discount = 0;
  activePromotions().filter(promo=>promo.type==='buyxpayy').forEach(promo=>{
    const units = [];
    Object.entries(state.cart).forEach(([key,q])=>{
      const {p} = parseCartKey(key);
      if(p && isPromoScopeEligible(p, promo)){
        const unitPrice = automaticDiscountedPrice(p);
        for(let i=0;i<q;i++) units.push(unitPrice);
      }
    });
    if(units.length < promo.buyQty) return;
    units.sort((a,b)=>a-b);
    const freeCount = Math.floor(units.length/promo.buyQty) * (promo.buyQty-promo.payQty);
    for(let i=0;i<freeCount;i++) discount += units[i];
  });
  return discount;
}
function cartSubtotalBeforeGift(){
  let s = 0;
  Object.entries(state.cart).forEach(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    if(!p) return;
    let price = v ? (v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p)) : automaticDiscountedPrice(p);
    price = couponDiscountedPrice(p, price);
    s += price*qty;
  });
  return Math.max(0, s - buyXPayYAdjustment());
}
function activeGift(){
  const subtotal = cartSubtotalBeforeGift();
  // Si el producto de regalo ya se agotó, la promoción se "apaga" sola en la tienda en vez de
  // seguir ofreciendo un regalo que no se puede entregar — Ale no tiene que acordarse de
  // desactivarla a mano cada vez que se acaba ese producto.
  const gift = activePromotions().find(promo=>{
    if(promo.type!=='gift' || subtotal < (promo.minAmount||0)) return false;
    const product = state.products.find(p=>p.id===promo.giftProductId);
    return product && product.stock>0;
  });
  if(!gift) return null;
  const product = state.products.find(p=>p.id===gift.giftProductId);
  return product ? {promo:gift, product} : null;
}
// Sugerencia de producto complementario: reusa las promociones "cross_sell" que ya existen
// (Producto A + Producto B, con % de descuento en B) — en cuanto A está en el carrito, se
// muestra B como sugerencia con su descuento ya listo, sin ser un pop-up que interrumpa.
// Si B ya está en el carrito, deja de sugerirse (ya no hace falta insistir).
function crossSellSuggestions(){
  const inCartIds = new Set(Object.keys(state.cart).map(key=>{ const {p}=parseCartKey(key); return p?p.id:null; }).filter(Boolean));
  return activePromotions()
    .filter(promo=>promo.type==='cross_sell' && inCartIds.has(promo.triggerProductId) && !inCartIds.has(promo.discountProductId))
    .map(promo=>({promo, product: state.products.find(p=>p.id===promo.discountProductId)}))
    // Si el producto con descuento ya se agotó, no tiene caso sugerirlo (no se podría agregar).
    .filter(x=>x.product && x.product.stock>0);
}
// Sugerencias genéricas del carrito ("también te puede interesar"): a diferencia de
// crossSellSuggestions (arriba), estas NO dependen de que Ale haya armado una promoción de
// cruce — solo buscan productos que aún no estén en el carrito, primero de las mismas
// categorías que ya llevas, luego de los destacados, y si falta completar, cualquier otro con
// existencias. Se excluyen los que ya aparecen como sugerencia de una promoción, para no
// repetir el mismo producto dos veces en la misma pantalla.
function genericCartSuggestions(){
  const inCartIds = new Set(Object.keys(state.cart).map(key=>{ const {p}=parseCartKey(key); return p?p.id:null; }).filter(Boolean));
  const promoSuggestedIds = new Set(crossSellSuggestions().map(x=>x.product.id));
  const cartCats = new Set();
  Object.keys(state.cart).forEach(key=>{ const {p}=parseCartKey(key); if(p) productCats(p).forEach(c=>cartCats.add(c)); });
  const pool = dailyShuffledProducts().filter(p=>!inCartIds.has(p.id) && !promoSuggestedIds.has(p.id) && p.stock>0);
  const featuredIds = state.settings.featuredProductIds||[];
  const sameCat = pool.filter(p=>productCats(p).some(c=>cartCats.has(c)));
  const featured = pool.filter(p=>featuredIds.includes(p.id) && !sameCat.includes(p));
  const rest = pool.filter(p=>!sameCat.includes(p) && !featured.includes(p));
  return [...sameCat, ...featured, ...rest].slice(0,4);
}
function productCats(p){ return (p.categories && p.categories.length) ? p.categories : (p.cat ? [p.cat] : []); }
function cartKey(productId, variantId){ return variantId ? `${productId}::${variantId}` : productId; }
function parseCartKey(key){
  const parts = key.split('::');
  const p = state.products.find(x=>x.id===parts[0]);
  const v = (parts[1] && p) ? (p.variants||[]).find(x=>x.id===parts[1]) : null;
  return {p, v};
}
function itemStock(p, v){ return v ? (v.stock||0) : (p ? p.stock : 0); }
// Aviso antes de pasar al checkout: de la lista de productos que Ale marcó como "para recordar
// ofrecer" (lubricante, condones, etc.) en el panel, se sugiere lo que todavía NO lleva en el
// carrito — igual que en el Punto de Venta, pero aquí lo ve la clienta directamente, así que el
// tono es una sugerencia amable, no una instrucción a un cajero.
// Antes, si el carrito ya traía UNO solo de esos productos, se cancelaba el aviso por completo
// y se perdía la oportunidad de sugerir los demás (por ejemplo: ya lleva condones, pero nunca se
// le ofrece el lubricante porque "ya llevaba algo de la lista"). Ahora se detecta, producto por
// producto, cuál ya lleva y cuál no, y solo se le sugiere algo DIFERENTE a lo que ya tiene.
function reminderProductsNotInCart(){
  const reminderIds = state.settings.checkoutReminderProducts || [];
  const inCartIds = new Set(Object.keys(state.cart).map(key=>parseCartKey(key).p).filter(Boolean).map(p=>p.id));
  return reminderIds.filter(id=>!inCartIds.has(id)).map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
}
function proceedToCheckout(){
  if(state.settings.storePaused){ showToast(state.settings.storePausedMessage || 'La tienda está en pausa temporalmente.'); return; }
  if(!state.checkoutReminderShown && reminderProductsNotInCart().length){
    state.checkoutReminderOpen = true;
    render();
    return;
  }
  state.cartOpen=false; state.checkoutOpen=true; trackEvent('checkout_start',{cartTotal: cartTotal()}); render();
}
function addReminderProductToCart(id){
  addToCart(id);
  state.checkoutReminderShown = true;
  state.checkoutReminderOpen = false;
  render();
}
function continueCheckoutWithoutReminder(){

}
function renderCheckoutReminderDrawer(){

      ${items.map(p=>`

          <span style="flex:1;min-width:0;">${p.name}</span><span style="font-weight:800;flex-shrink:0;">${money(effectivePrice(p))}</span>
        </button>`).join('')}
    </div>
    <div class="drawer-foot"><button class="btn-primary" onclick="continueCheckoutWithoutReminder()">Continuar sin agregar</button></div>
  `;

function variantLabel(v){ return v ? Object.values(v.combo||{}).join(' / ') : ''; }
// Aplica los colores/tipografía/estilo elegidos en Diseño → Apariencia (admin.html). Se
// escriben como propiedades inline en <html>, que siempre le ganan a cualquier valor de
// :root del CSS sin importar el orden en que aparezcan — así no hace falta reordenar hojas
// de estilo ni usar !important. Si un campo no está definido (tienda que nunca lo configuró),
// se deja el valor de :root tal cual (los colores/tipografía originales).
function applyThemeVars(){
  const t = state.settings.theme || {};
  const root = document.documentElement.style;
  ['primary','primaryDeep','rose','amber'].forEach(k=>{
    const cssVar = '--' + k.replace(/([A-Z])/g,'-$1').toLowerCase();
    if(t[k]) root.setProperty(cssVar, t[k]);
  });
  if(t.fontHeading) root.setProperty('--font-heading', t.fontHeading);
  if(t.fontBody) root.setProperty('--font-body', t.fontBody);
  if(t.radius==='cuadrado'){
    root.setProperty('--radius-card','8px'); root.setProperty('--radius-sm','6px');
    root.setProperty('--radius-md','8px'); root.setProperty('--radius-lg','10px'); root.setProperty('--radius-pill','8px');
  }
}
function showToast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer); window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  let total = 0;
  Object.entries(state.cart).forEach(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    if(!p) return;
    let price = v ? (v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p)) : automaticDiscountedPrice(p);
    price = couponDiscountedPrice(p, price);
    total += price*qty;
  });
  total -= buyXPayYAdjustment();
  return Math.max(0, total);
}
function waLink(msg){ const num=(state.settings.whatsapp||'').replace(/\D/g,''); return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`; }
// Aviso interno a Slack (opcional, ver Configuración → Datos operativos). Se manda en paralelo
// al mensaje de WhatsApp del cliente, nunca en su lugar, y nunca debe interrumpir el flujo de
// compra si falla o si Ale no configuró ningún webhook. Por una restricción de los navegadores
// (CORS), un webhook de Slack no se puede llamar de la forma normal desde el navegador sin
// servidor propio: se manda con mode "no-cors" y Content-Type "text/plain" (aunque el cuerpo
// sea JSON) para evitar que el navegador la bloquee — a cambio, nunca se sabe si en verdad llegó
// bien, así que esto es "mejor esfuerzo", no garantizado.
function sendSlackNotification(text){
  const url = state.settings.slackWebhookUrl;
  if(!url) return;
  try{
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({text}) }).catch(()=>{});
  }catch(e){ /* silencioso a propósito: Slack es un aviso extra, no debe tronar la compra */ }
}

function addToCart(id, variantId){
  if(isKioskMode()){ return; } // en modo vitrina no se puede agregar al carrito, solo hojear el catálogo
  if(state.settings.storePaused){ showToast(state.settings.storePausedMessage || 'La tienda está en pausa temporalmente.'); return; }
  const p = state.products.find(x=>x.id===id);
  if(!p){ return; }
  if(p.variantGroups && p.variantGroups.length && !variantId){
    openProductDetail(id); return; // necesita elegir variante primero
  }
  const v = variantId ? (p.variants||[]).find(x=>x.id===variantId) : null;
  const key = cartKey(id, variantId);
  const available = itemStock(p, v);
  if(available<=0 || available<=(state.cart[key]||0)){ showToast('Sin existencias'); return; }
  state.cart[key]=(state.cart[key]||0)+1; saveCart(); showToast('Agregado al carrito'); trackEvent('add_to_cart', {productId:id}); render();
}
function changeQty(key,delta){ const cur=state.cart[key]||0; const next=cur+delta; if(next<=0) delete state.cart[key]; else state.cart[key]=next; saveCart(); render(); }
function removeFromCart(key){ delete state.cart[key]; saveCart(); render(); }

function scrollToId(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
function goHome(){ state.searchQuery=''; state.activeCat='Todos'; state.activeNeed=null; state.activeBestSellers=false; render(); window.scrollTo({top:0, behavior:'smooth'}); }
// "Ver más vendidos" ya no lleva a una sección fija de la página — filtra el catálogo para
// mostrar solo esos productos, igual que al elegir una categoría, con un botón claro para
// quitar el filtro y ver todo de nuevo (ver renderGridSection).
function goToFeatured(){
  state.activeBestSellers = true; state.activeCat = 'Todos'; state.activeNeed = null; state.searchQuery = ''; state.gridRenderLimit = 20;
  render();
  requestAnimationFrame(()=>scrollToId('catalogo'));
}
function openProductDetail(id){ state.detailProductId=id; state.detailImageIndex=0; state.detailSelectedVariant={}; trackEvent('product_view', {productId:id}); render(); }
function closeProductDetail(){ state.detailProductId=null; render(); }
function selectVariantOption(groupName, value){
  state.detailSelectedVariant[groupName] = value;
  render();
}
function findMatchingVariant(p){
  if(!p.variantGroups || !p.variantGroups.length) return null;
  const sel = state.detailSelectedVariant;
  const complete = p.variantGroups.every(g=>sel[g.name]);
  if(!complete) return null;
  return (p.variants||[]).find(v=>p.variantGroups.every(g=>v.combo[g.name]===sel[g.name])) || null;
}
function setDetailImage(idx){ state.detailImageIndex=idx; render(); }
function detailPrevImage(){
  const p = state.products.find(x=>x.id===state.detailProductId); if(!p) return;
  const n = (p.images&&p.images.length) || 1;
  state.detailImageIndex = (state.detailImageIndex - 1 + n) % n; render();
}
function detailNextImage(){
  const p = state.products.find(x=>x.id===state.detailProductId); if(!p) return;
  const n = (p.images&&p.images.length) || 1;
  state.detailImageIndex = (state.detailImageIndex + 1) % n; render();
}
let detailTouchStartX = null;
function detailTouchStart(e){ detailTouchStartX = (e.touches?e.touches[0]:e).clientX; }
function detailTouchEnd(e){
  if(detailTouchStartX===null) return;
  const endX = (e.changedTouches?e.changedTouches[0]:e).clientX;
  const delta = endX - detailTouchStartX;
  detailTouchStartX = null;
  if(Math.abs(delta) < 40) return;
  if(delta < 0) detailNextImage(); else detailPrevImage();
}
function goToCatalog(cat){ state.activeBestSellers=false; state.activeCat=cat||'Todos'; state.activeNeed=null; state.searchQuery=''; state.gridRenderLimit=20; render(); requestAnimationFrame(()=>scrollToId('catalogo')); }
function filterByNeed(key){ state.activeBestSellers=false; state.activeNeed=key; state.activeCat='Todos'; state.searchQuery=''; state.gridRenderLimit=20; render(); requestAnimationFrame(()=>scrollToId('catalogo')); }
// Búsquedas sin resultado: cuando alguien escribe algo en el buscador, se espera a que deje de
// teclear; si con el catálogo COMPLETO ya cargado no coincide con ningún producto, se guarda solo
// el texto (anónimo, sin ningún dato de la persona) para que en el panel veas qué te piden y no
// tienes. Una vez por término por visita, y nunca mientras el catálogo sigue cargando (para no
// registrar como "sin resultado" algo que sí existe pero todavía no ha llegado).
let searchMissTimer = null;
const searchMissLogged = {};
function normalizeSearchTerm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function scheduleSearchMissCheck(v){
  clearTimeout(searchMissTimer);
  const norm = normalizeSearchTerm(v);
  if(norm.length < 3) return;
  searchMissTimer = setTimeout(()=>{
    if(!state.fullCatalogLoaded || searchMissLogged[norm]) return;
    const q = (v||'').trim().toLowerCase();
    const found = state.products.some(p=>(p.name||'').toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));
    if(found) return;
    searchMissLogged[norm] = true;
    try{ db.collection('searchMisses').add({query:(v||'').trim().slice(0,80), normalized:norm.slice(0,80), date:new Date().toISOString()}).catch(()=>{}); }catch(e){}
  }, 1600);
}
function onSearchInput(v){ scheduleSearchMissCheck(v); state.activeBestSellers=false; state.searchQuery=v; state.activeCat='Todos'; state.activeNeed=null; state.gridRenderLimit=20; render(); const i=document.getElementById('search-input'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length);} }

/* ============== CAJA SORPRESA / COMBO ALEATORIO ==============
   Al confirmar el pedido (no antes, para que sea una sorpresa real hasta ese momento) se sortean
   productos reales con existencia para completar cada caja — de la categoría que el producto
   "caja sorpresa" tenga configurada (o de cualquier categoría, si se dejó en "Cualquiera"). La
   clienta solo ve el nombre y precio de la caja en su carrito; el detalle de qué le tocó queda
   guardado en el pedido para que el personal sepa exactamente qué empacar. */
function pickMysteryBoxItems(box, qty){
  const wantCategory = box.mysteryCategory && box.mysteryCategory!=='Cualquiera' ? box.mysteryCategory : null;
  const pool = state.products.filter(p=>
    p.id!==box.id && !p.isKit && !p.isMysteryBox && (p.stock==null || p.stock>0) &&
    (!wantCategory || productCats(p).includes(wantCategory))
  );
  const count = Math.max(1, Number(box.mysteryItemCount)||3) * Math.max(1, qty||1);
  if(!pool.length) return [];
  const picks = {};
  for(let i=0;i<count;i++){
    const choice = pool[Math.floor(Math.random()*pool.length)];
    picks[choice.id] = picks[choice.id] || {id:choice.id, name:choice.name, qty:0};
    picks[choice.id].qty += 1;
  }
  return Object.values(picks);
}
async function submitOrder(formData){
  if(state.settings.storePaused){ showToast(state.settings.storePausedMessage || 'La tienda está en pausa temporalmente.'); state.submittingOrder=false; render(); return; }
  if(state.appliedCoupon && state.appliedCoupon.singleUsePerCustomer){
    const alreadyUsed = await couponUsedByPhone(state.appliedCoupon.code, formData.phone);
    if(alreadyUsed){
      showToast('Ese cupón ya lo usaste antes con este teléfono — se quitó de tu pedido');
      state.appliedCoupon = null; state.submittingOrder=false; render(); return;
    }
  }
  const items = Object.entries(state.cart).map(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    let price = v && v.priceOverride>0 ? v.priceOverride : automaticDiscountedPrice(p);
    price = couponDiscountedPrice(p, price);
    const line = {id:p.id, variantId: v?v.id:null, name: p.name + (v?` (${variantLabel(v)})`:''), price, qty};
    if(p.isMysteryBox){
      const picks = pickMysteryBoxItems(p, qty);
      if(picks.length) line.mysteryPicks = picks;
    }
    return line;
  });
  const buyXPayYSavings = buyXPayYAdjustment();
  if(buyXPayYSavings>0){
    items.push({id:'promo_buyxpayy', name:'Promoción (lleva X y paga Y)', price:-buyXPayYSavings, qty:1});
  }
  const gift = activeGift();
  if(gift){
    items.push({id:gift.product.id, name:`${gift.product.name} (regalo)`, price:0, qty:1});
  }
  const orderNumber = await getNextOrderNumber();
  const couponCode = state.appliedCoupon ? state.appliedCoupon.code : null;
  const order = { date:new Date().toISOString(), orderNumber, source:"tienda", customer:formData.name, phone:formData.phone, address:formData.address, notes:formData.notes, items, total: items.reduce((s,it)=>s+it.price*it.qty,0), status:"Nuevo", couponCode };
  try{ await db.collection('orders').add(order); }
  catch(e){ console.error(e); showToast('No se pudo enviar el pedido, intenta de nuevo'); state.submittingOrder=false; render(); return; }
  trackEvent('purchase', {orderTotal: order.total});
  clearTimeout(abandonedCartTimer);
  clearAbandonedCartDraft(formData.phone);
  if(couponCode){
    try{ await db.collection('couponUsage').add({code:couponCode, date:new Date().toISOString(), phone: (formData.phone||'').replace(/\D/g,'')}); }catch(e){ console.error('No se pudo registrar el uso del cupón', e); }
  }
  state.cart = {}; saveCart(); state.checkoutOpen=false; state.cartOpen=false; state.orderPlaced=true; state.lastOrderNumber=orderNumber; state.submittingOrder=false; state.appliedCoupon=null; render();

  // Mensaje de confirmación de compra: se abre solo, listo para que el cliente lo mande por
  // WhatsApp al número de la tienda (state.settings.whatsapp, configurable en Configuración).
  const productLines = items.map(it=>`• ${it.qty}x ${it.name}`).join('\n');
  const msg = `Hola, me gustaria confirmar mi compra:\nProducto: \n${productLines}\nDirección: ${formData.address}\nTotal: ${money(order.total)} (el total no incluye el costo del envío)\n\n¡Gracias!`;
  if(state.settings.whatsapp){
    window.open(waLink(msg), '_blank');
  }
  // Aviso interno a Slack (en paralelo, no en lugar del de WhatsApp) — ver Configuración → Datos operativos.
  sendSlackNotification(`🛒 *Nuevo pedido* ${orderNumber?`#${orderNumber}`:''}\nCliente: ${formData.name} (${formData.phone})\nProducto:\n${productLines}\nDirección: ${formData.address}\nTotal: ${money(order.total)} (no incluye envío)`);
}
function handleCheckoutSubmit(){
  if(state.submittingOrder) return; // evita doble envío si tocan el botón varias veces
  const name = document.getElementById('ck-name').value.trim();
  const phone = document.getElementById('ck-phone').value.trim();
  const address = document.getElementById('ck-address').value.trim();
  const notes = document.getElementById('ck-notes').value.trim();
  const remember = document.getElementById('ck-remember').checked;
  if(!name || !phone || !address){ showToast('Completa nombre, teléfono y dirección'); return; }
  if(phone.replace(/\D/g,'').length < 10){ showToast('Escribe tu WhatsApp con 10 dígitos para poder contactarte'); return; }
  if(needsTermsAcceptance()){
    const termsEl = document.getElementById('ck-terms');
    if(!termsEl || !termsEl.checked){ showToast('Debes aceptar el aviso de privacidad para continuar'); return; }
  }
  if(needsTermsAcceptance()) markTermsAccepted();
  if(remember){ saveCustomerProfile({name,phone,address,notes,remember:true}); }
  else{ clearCustomerProfile(); }
  state.submittingOrder = true; render();
  submitOrder({name,phone,address,notes});
}

/* ============== VERIFICACIÓN DE MAYORÍA DE EDAD ==============
   Antes de ver el catálogo, quien entra debe declarar que es mayor de edad. Se guarda en este
   mismo celular/navegador (igual que el perfil y la lista de deseos) para no volver a

   decide que ya no lo necesita. Si el "No, salir" se toca, se manda a otra página — no hay

const AGE_GATE_KEY = 'cdlp_age_confirmed';

  catch(e){ return true; } // si el almacenamiento está bloqueado, no atrapamos al cliente sin poder entrar nunca
}

/* ============== ACEPTACIÓN DEL AVISO DE PRIVACIDAD ==============
   Es obligatorio aceptarlo para poder comprar, pero solo hace falta hacerlo una vez por
   cliente: en cuanto lo acepta en su primera compra, queda guardado en este mismo
   celular/navegador (igual que el perfil y la mayoría de edad) y ya no se le vuelve a pedir en
   sus compras siguientes desde el mismo dispositivo. Se puede apagar por completo desde
   Configuración → Operativo. */
const TERMS_KEY = 'cdlp_terms_accepted';

/* ============== LISTA DE DESEOS / FAVORITOS (guardada en este celular) ==============
   No requiere cuenta ni teléfono: se guarda como una lista de IDs de producto en este mismo
   dispositivo (igual que el perfil de arriba), así que solo la ve quien la guardó y solo desde
   ese celular/navegador. Cada vez que se AGREGA uno (nunca al quitarlo) se manda también un
   evento 'wishlist_add' a analyticsEvents — igual que 'product_view' — para que el panel de
   Ale pueda ver qué se guarda más como señal de demanda, sin poder ver de quién es cada lista. */
const WISHLIST_KEY = 'cdlp_wishlist';
function loadWishlist(){
  try{ const raw = localStorage.getItem(WISHLIST_KEY); const arr = raw ? JSON.parse(raw) : []; return Array.isArray(arr) ? arr : []; }
  catch(e){ return []; }
}
function saveWishlistIds(ids){
  try{ localStorage.setItem(WISHLIST_KEY, JSON.stringify(ids)); }catch(e){ /* almacenamiento no disponible, se ignora */ }
}
function isWishlisted(id){ return loadWishlist().includes(id); }
function toggleWishlist(id){
  const ids = loadWishlist();
  const idx = ids.indexOf(id);
  if(idx>=0){ ids.splice(idx,1); }
  else { ids.push(id); trackEvent('wishlist_add', {productId:id}); }
  saveWishlistIds(ids);
  render();
}
function wishlistProducts(){
  const ids = loadWishlist();
  return ids.map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
}

/* ============== BUZÓN DE MENSAJES (quejas, sugerencias, preguntas) ==============
   Enlace en el pie de página que abre este formulario. El mensaje se guarda directo en
   Firestore (colección "storeMessages", solo creación pública — ver firestore.rules) para
   que Ale lo revise en el panel de administración, sin depender de que el cliente escriba
   por WhatsApp. Lleva un campo trampa invisible ("website") y un límite de un envío por
   minuto por dispositivo, para frenar el spam automatizado sin necesitar un backend. */
const MESSAGE_MIN_INTERVAL_MS = 60000;
function openMessageDrawer(){ state.messageDrawerOpen=true; state.messageDraft={name:'',phone:'',type:'pregunta',text:''}; render(); }
function closeMessageDrawer(){ state.messageDrawerOpen=false; state.messageSent=false; render(); }
function renderMessageDrawer(){
  if(state.messageSent){
    return `

    <div class="drawer-body">
      <div class="note-box" style="background:#EAF3D8;color:var(--green);font-weight:700;">${icon('check')} ¡Gracias! Tu mensaje fue enviado, lo vamos a revisar pronto.</div>
    </div>
    <div class="drawer-foot"><button class="btn-primary" onclick="closeMessageDrawer()">Cerrar</button></div>`;
  }
  return `
    <div class="drawer-head"><h2>Buzón de sugerencias</h2><button class="close-x" onclick="closeMessageDrawer()">${icon('x')}</button></div>
    <div class="drawer-body">
      <div class="note-box">¿Tienes una queja, sugerencia o pregunta para nosotros? Escríbenos aquí y te respondemos directo por WhatsApp.</div>
      <div class="form-field"><label>Tu nombre</label><input id="msg-name" type="text" placeholder="Tu nombre" value="${(state.messageDraft.name||'').replace(/"/g,'&quot;')}" oninput="state.messageDraft.name=this.value"></div>
      <div class="form-field"><label>WhatsApp / Teléfono</label><input id="msg-phone" type="tel" placeholder="33 1234 5678" value="${(state.messageDraft.phone||'').replace(/"/g,'&quot;')}" oninput="state.messageDraft.phone=this.value"></div>
      <div class="form-field"><label>Tipo de mensaje</label>
        <select id="msg-type" onchange="state.messageDraft.type=this.value">
          <option value="pregunta" ${state.messageDraft.type==='pregunta'?'selected':''}>Pregunta</option>
          <option value="sugerencia" ${state.messageDraft.type==='sugerencia'?'selected':''}>Sugerencia</option>
          <option value="queja" ${state.messageDraft.type==='queja'?'selected':''}>Queja</option>
          <option value="otro" ${state.messageDraft.type==='otro'?'selected':''}>Otro</option>
        </select>
      </div>
      <div class="form-field"><label>Tu mensaje</label><textarea id="msg-text" placeholder="Cuéntanos qué pasó o qué se te ocurre..." oninput="state.messageDraft.text=this.value">${state.messageDraft.text||''}</textarea></div>
      <input id="msg-website" type="text" name="website" autocomplete="off" tabindex="-1" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" aria-hidden="true">
    </div>
    <div class="drawer-foot">
      <button class="btn-primary" ${state.sendingMessage?'disabled style="opacity:.6"':''} onclick="handleSendStoreMessage()">${state.sendingMessage?'Enviando…':'Enviar mensaje'}</button>
    </div>`;
}
async function handleSendStoreMessage(){
  if((document.getElementById('msg-website')||{}).value){ return; } // campo trampa: los bots lo llenan
  const name = (state.messageDraft.name||'').trim();
  const phone = (state.messageDraft.phone||'').trim();
  const type = state.messageDraft.type||'pregunta';
  const message = (state.messageDraft.text||'').trim();
  if(!name || !phone || !message){ showToast('Ponle tu nombre, teléfono y el mensaje'); return; }
  let lastSent = 0;
  try{ lastSent = Number(localStorage.getItem('cdlp_msg_last_sent')||0); }catch(e){}
  if(Date.now() - lastSent < MESSAGE_MIN_INTERVAL_MS){ showToast('Ya enviaste un mensaje hace un momento, espera un poco antes de enviar otro.'); return; }
  state.sendingMessage = true; render();
  try{
    await db.collection('storeMessages').add({ date:new Date().toISOString(), name, phone, type, message, status:'nuevo' });
    try{ localStorage.setItem('cdlp_msg_last_sent', String(Date.now())); }catch(e){}
    state.messageDraft = {name:'',phone:'',type:'pregunta',text:''};
    state.sendingMessage = false; state.messageSent = true; render();
  }catch(e){
    console.error(e); state.sendingMessage = false; render();
    showToast('No se pudo enviar tu mensaje, intenta de nuevo');
  }
}

// "Avísame cuando llegue": para un producto agotado, la persona deja su WhatsApp y el negocio le
// avisa al reponerlo. El documento se identifica por producto+teléfono, así que pedirlo dos veces
// no duplica nada (la segunda vez las reglas lo rechazan y se le dice que ya está en la lista).
function renderNotifyMeBlock(p, v){
  const sentKey = p.id + (v ? '::'+v.id : '');
  if(state.notifySent[sentKey]) return `<div class="note-box" style="margin-top:14px;">Listo 💕 Te escribiremos por WhatsApp en cuanto llegue.</div>`;
  return `
    <div style="margin-top:16px;padding:14px;border:1px dashed var(--border);border-radius:14px;">
      <div style="font-weight:700;margin-bottom:4px;">¿Te avisamos cuando llegue?</div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">Déjanos tu WhatsApp y te escribimos solo por este producto — nada de spam.</div>
      <div class="form-field"><label>Tu nombre</label><input id="notify-name" type="text" placeholder="Tu nombre" value="${(state.notifyName||'').replace(/"/g,'&quot;')}" oninput="state.notifyName=this.value"></div>
      <div class="form-field"><label>Tu WhatsApp</label><input id="notify-phone" type="tel" placeholder="33 1234 5678" value="${(state.notifyPhone||'').replace(/"/g,'&quot;')}" oninput="state.notifyPhone=this.value"></div>
      <button class="btn-primary" onclick="submitNotifyMe('${p.id}'${v?`,'${v.id}'`:''})">Avísame</button>
    </div>`;
}
async function submitNotifyMe(productId, variantId){
  const name = ((document.getElementById('notify-name')||{}).value||'').trim();
  const digits = ((document.getElementById('notify-phone')||{}).value||'').replace(/\D/g,'');
  if(digits.length < 10){ showToast('Escribe tu WhatsApp con 10 dígitos'); return; }
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  const v = variantId ? (p.variants||[]).find(x=>x.id===variantId) : null;
  const sentKey = productId + (variantId ? '::'+variantId : '');
  const docId = productId + (variantId ? '_'+variantId : '') + '_' + digits.slice(-10);
  try{
    await db.collection('restockRequests').doc(docId).set({
      productId, productName: p.name + (v ? ` (${variantLabel(v)})` : ''), name: name.slice(0,80), phone: digits.slice(0,15),
      date: new Date().toISOString(), notified: false,
    });
    state.notifySent[sentKey] = true;
    showToast('¡Listo! Te avisamos en cuanto llegue');
  }catch(e){
    if(e && e.code==='permission-denied'){ state.notifySent[sentKey] = true; showToast('Ya estabas en la lista de espera 💕'); }
    else{ console.error('No se pudo guardar el aviso', e); showToast('No se pudo guardar, intenta de nuevo'); }
  }
  render();
}

      <div class="detail-info">
