        ${r.alreadyImported>0 ? `${r.alreadyImported} de estos pedidos ya están importados — se actualizarán con los mismos datos, sin duplicarse.<br>` : ''}
        ${r.unmatchedLines>0 ? `${r.unmatchedLines} línea(s) de producto no encontraron equivalente en tu catálogo actual (se guardan igual, con el nombre original, pero no se les asocia un producto específico para el detalle por producto).` : ''}
      </div>
      <button class="btn-primary" ${state.histImportBusy?'disabled':''} onclick="confirmHistImport()">${state.histImportBusy?'Importando…':'Importar a Firestore'}</button>
    `) : ''}
    ${state.histImportResult ? `<div class="note-box" style="color:var(--green);">${escDescHtml(state.histImportResult)}</div>` : ''}
  `;
}
function handleHistImportFile(input){
  const file = input.files[0]; if(!file) return;
  state.histImportFileName = file.name;
  state.histImportResult = null;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('el archivo debe ser una lista de pedidos');
      const existingIds = new Set(state.orders.map(o=>o.id));
      let totalRevenue=0, unmatchedLines=0, alreadyImported=0, dateMin=null, dateMax=null;
      data.forEach(o=>{
        totalRevenue += o.total||0;
        (o.items||[]).forEach(it=>{ if(!it.id) unmatchedLines++; });
        if(existingIds.has(o.firestoreId)) alreadyImported++;
        if(o.date){ if(!dateMin||o.date<dateMin) dateMin=o.date; if(!dateMax||o.date>dateMax) dateMax=o.date; }
      });
      state.histImportData = data;
      state.histImportPreview = {
        count: data.length, totalRevenue, unmatchedLines, alreadyImported,
        dateMin: dateMin ? new Date(dateMin).toLocaleDateString('es-MX') : '—',
        dateMax: dateMax ? new Date(dateMax).toLocaleDateString('es-MX') : '—',
      };
    }catch(err){
      state.histImportData = null;
      state.histImportPreview = {error: 'No se pudo leer el archivo: '+(err.message||'formato inválido')};
    }
    render();
  };
  reader.readAsText(file);
}
async function confirmHistImport(){
  const data = state.histImportData;
  if(!data || !data.length) return;
  if(!confirm(`Vas a importar ${data.length} pedidos históricos de Tiendanube a Firestore. Es seguro repetirlo (no duplica), pero sí escribe datos reales en tu base de datos. ¿Continuar?`)) return;
  state.histImportBusy = true; render();
  try{
    for(let i=0;i<data.length;i+=400){
      const chunk = data.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(o=>{
        const {firestoreId, ...payload} = o;
        batch.set(db.collection('sales').doc(firestoreId), payload);
      });
      await batch.commit();
    }
    state.histImportResult = `Listo: se importaron ${data.length} pedidos.`;
    state.histImportData = null; state.histImportPreview = null; state.histImportFileName = '';
    render();
    await loadData();
    showToast('Historial de ventas importado');
  }catch(e){
    console.error(e);
    showToast('Ocurrió un error al importar: '+(e.message||'error desconocido'));
  }
  state.histImportBusy = false; render();
}

async function addCategory(){
  const val = state.newCatInput.trim();
  if(!val) return;
  if(!state.settings.categories.includes(val)) state.settings.categories.push(val);
  state.newCatInput='';

}
async function removeCategory(cat){
  const affected = state.products.filter(p=>(p.categories&&p.categories.includes(cat)) || p.cat===cat);
  if(affected.length>0 && !confirm(`${affected.length} producto(s) tienen esta categoría asignada. Si continúas, se les asignará otra categoría automáticamente. ¿Continuar?`)) return;
  try{
    if(affected.length>0){
      const fallback = state.settings.categories.find(c=>c!==cat) || 'Otros';
      for(let i=0;i<affected.length;i+=400){
        const chunk = affected.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(p=>{
          let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).filter(c=>c!==cat);
          if(categories.length===0) categories = [fallback];
          p.categories = categories;
          if(p.cat===cat) p.cat = categories[0];
          batch.update(db.collection('products').doc(p.id), {categories:p.categories, cat:p.cat});
        });
        await batch.commit();
      }
    }
    state.settings.categories = state.settings.categories.filter(c=>c!==cat);
    if(state.productCatFilter===cat) state.productCatFilter='Todas';
    await saveSettings(); showToast('Categoría eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar la categoría'); }
}
async function moveCategory(idx,dir){
  const arr = state.settings.categories;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  await saveSettings(); render();
}
async function renameCategory(oldName, newLabel){
  const val = (newLabel||'').trim();
  if(!val || val===oldName){ render(); return; }
  if(state.settings.categories.includes(val)){ showToast('Ya existe una categoría con ese nombre'); render(); return; }
  const idx = state.settings.categories.indexOf(oldName);
  if(idx<0) return;
  try{
    state.settings.categories[idx] = val;
    const affected = state.products.filter(p=>(p.categories&&p.categories.includes(oldName)) || p.cat===oldName);
    for(let i=0;i<affected.length;i+=400){
      const chunk = affected.slice(i,i+400);
      const batch = db.batch();
      chunk.forEach(p=>{
        let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).map(c=>c===oldName?val:c);
        p.categories = categories;
        if(p.cat===oldName) p.cat = val;
        batch.update(db.collection('products').doc(p.id), {categories:p.categories, cat:p.cat});
      });
      await batch.commit();
    }
    if(state.productCatFilter===oldName) state.productCatFilter = val;
    await saveSettings(); showToast('Categoría renombrada'); render();
  }catch(e){ console.error(e); showToast('No se pudo renombrar la categoría'); }
}

// Sugerencia automática de "¿Para quién es?" a partir del nombre y la categoría —

// adaptado como botón dentro de la ficha de cada producto nuevo. Es un punto de
// partida, no una asignación final: Ale revisa y ajusta antes de guardar.
function has_(name, ...words){ return words.some(w=>name.includes(w)); }
function suggestNeedsForProduct(p){
  const name = normName(p.name||'');
  const cat = normName((p.categories&&p.categories[0]) || p.cat || '');
  let tags = new Set();

  if(cat==='ropa femenina') tags = new Set(['para-mi','para-ella','para-pareja']);
  else if(cat==='ropa masculina') tags = new Set(['para-mi','para-el','para-pareja']);
  else if(cat==='tarjetas de regalo') tags = new Set();
  else if(cat==='juegos'){
    if(has_(name,'despedida de soltera')) tags = new Set();
    else{ tags.add('compartir-pareja'); if(has_(name,'jenga','dado','dados','cartas','naipes','boletos')) tags.add('empezando'); }
  } else if(cat==='satisfyer'){
    if(has_(name,'parejas')) tags = new Set(['compartir-pareja','para-mi']);
    else if(has_(name,' man ') || name.startsWith('man ') || has_(name,'man heat','para el pene')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'clitoris','panty','cutie')) tags = new Set(['para-ella','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='comestibles'){
    if(has_(name,'pareja')) tags = new Set(['compartir-pareja','para-pareja']);
    else if(has_(name,'hombre','masculin')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'mujer','femenin')) tags = new Set(['para-ella','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='complementos'){
    if(has_(name,'hombre','masculin')) tags = new Set(['para-el','para-mi']);
    else if(has_(name,'mujer','femenin')) tags = new Set(['para-ella','para-mi']);
    else if(has_(name,'latigo','esposas','pinzas para pezon','mascara','antifaz','cadena','vela','petalos','almohada','splash','spray')) tags = new Set(['compartir-pareja','para-mi']);
    else tags.add('para-mi');
  } else if(cat==='sadomasoquismo') tags = new Set(['compartir-pareja','para-mi']);
  else if(cat==='plugs'){
    tags.add('para-mi');
    if(has_(name,'gema','cola de zorro','cola de conejo','corazon')) tags.add('empezando');
  } else if(cat==='dildos'){
    tags = new Set(['para-mi','para-ella']);
    if(/\b([789])(\.\d+)?\s*cm/.test(name) || has_(name,'mini')) tags.add('empezando');
  } else if(cat==='lubricantes'){
    tags.add('para-mi');
    if(has_(name,'femenin','vaginal','estrechador','clitoris')) tags.add('para-ella');
    if(has_(name,'ereccion','erecto','engrosador','garganta profunda','para hombre')) tags.add('para-el');
    if(has_(name,'unisex','pareja','duo','multiorgasmico','condon')) tags.add('compartir-pareja');
  } else if(cat==='ocultos'){
    tags = new Set(['para-mi','compartir-pareja']);
    if(has_(name,'para ella')) tags.add('para-ella');
  } else if(cat==='juguetes'){
    const esMasturbadorMasculino = has_(name,'masturbador','mastubador','funda para pene','funda de pene','funda realista','penis pump','bomba de succion','entrenador para pene','jaula de castidad') ||
      (has_(name,'vagina','boca','garganta','ano') && !has_(name,'succionador','clitoris'));
    if(esMasturbadorMasculino) tags = new Set(['para-el','para-mi','para-pareja']);
    else if(has_(name,'anillo')) tags = new Set(['para-el','compartir-pareja','para-mi']);
    else if(has_(name,'succionador','clitoris','punto g','kegel','pezon','pezonera')) tags = new Set(['para-ella','para-mi']);
    else if(has_(name,'dildo','vibrador','consolador','bala','miembro')) tags = new Set(['para-mi','para-ella']);
    else if(has_(name,'plug','prostat') || (has_(name,'anal') && !has_(name,'masturbador'))) tags.add('para-mi');
    else if(has_(name,'esposas','arnes','arnés','correa','columpio','collar con pinzas','mordaza')) tags = new Set(['compartir-pareja','para-mi']);
    else tags.add('para-mi');
    if(has_(name,'doble cabeza','doble penetracion','para parejas','control remoto','control por app','butterfly','mariposa')) tags.add('compartir-pareja');
    if(has_(name,'pezon','pezonera')) tags.add('para-ella');
    if(has_(name,'mini','pequen','chico','bolsillo')) tags.add('empezando');
  } else {
    tags.add('para-mi');
  }
  return Array.from(tags).filter(k=>(state.settings.needs||DEFAULT_NEEDS).some(n=>n.key===k));
}

function generateSKU(product){
  const catPart = ((product.categories&&product.categories[0])||product.cat||'GEN').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3) || 'GEN';
  const namePart = (product.name||'PROD').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4) || 'PROD';
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${catPart}-${namePart}-${rand}`;
}

            <input type="number" min="0" placeholder="Precio (si es distinto)" value="${v.priceOverride||''}" style="width:110px;padding:9px 8px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;text-align:center;" onchange="setVariantField('${v.id}','priceOverride',this.value)">
            <input type="number" min="0" placeholder="Stock" value="${v.stock||0}" style="width:70px;padding:9px 8px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;text-align:center;" onchange="setVariantField('${v.id}','stock',this.value)">
          </div>
        `).join('')}
      ` : ''}
    </div>`;
}
function addVariantGroup(){
  if(!state.productModal.variantGroups) state.productModal.variantGroups = [];
  state.productModal.variantGroups.push({name:'', values:[]});
  render();
}
function setVariantGroupName(idx, value){ state.productModal.variantGroups[idx].name = value.trim(); }
function setVariantGroupValues(idx, value){
  state.productModal.variantGroups[idx].values = value.split(',').map(v=>v.trim()).filter(Boolean);
}
function removeVariantGroup(idx){
  state.productModal.variantGroups.splice(idx,1);
  render();
}
function generateVariantCombos(){
  const groups = (state.productModal.variantGroups||[]).filter(g=>g.name && g.values && g.values.length);
  if(groups.length===0){ showToast('Agrega al menos un grupo con nombre y valores'); return; }
  let combos = [{}];
  groups.forEach(g=>{
    const next = [];
    combos.forEach(c=>{ g.values.forEach(v=>{ next.push({...c, [g.name]: v}); }); });
    combos = next;
  });
  const existing = state.productModal.variants || [];
  const keyOf = combo => JSON.stringify(Object.entries(combo).sort());
  const existingByKey = {}; existing.forEach(v=>{ existingByKey[keyOf(v.combo)] = v; });
  state.productModal.variants = combos.map(combo=>{
    const key = keyOf(combo);
    if(existingByKey[key]) return existingByKey[key];
    return { id: uid('var_'), combo, sku:'', stock:0 };
  });
  showToast(`${combos.length} variante(s) generada(s)`);
  render();
}
function setVariantField(variantId, field, value){
  const v = (state.productModal.variants||[]).find(x=>x.id===variantId);
  if(!v) return;
  v[field] = (field==='stock'||field==='priceOverride') ? Math.max(0, Number(value)||0) : value;
}
function handleSaveProduct(existingId){
  const name = document.getElementById('pf-name').value.trim();
  const sku = document.getElementById('pf-sku').value.trim();
  const price = Number(document.getElementById('pf-price').value)||0;
  const promoPrice = Number(document.getElementById('pf-promo').value)||0;
  const cost = Number(document.getElementById('pf-cost').value)||0;
  const desc = document.getElementById('pf-desc').value.trim();
  const hidden = document.getElementById('pf-hidden').checked;
  if(!name){ showToast('Ponle un nombre al producto'); return; }
  const categories = (state.productModal.categories && state.productModal.categories.length) ? state.productModal.categories : [state.settings.categories[0]];
  const cat = categories[0];
  const stockByCenter = state.productModal.stockByCenter || {};
  const stock = Object.values(stockByCenter).reduce((s,n)=>s+(n||0),0);
  saveProduct({
    id: existingId||null, name, sku, cat, categories, price, promoPrice, cost, stock, stockByCenter, desc,
    hidden, images: state.productModal.images||[], needs: state.productModal.needs||[],
    variantGroups: state.productModal.variantGroups||[], variants: state.productModal.variants||[],
  });
}

/* ============== PRESERVAR EL CAMPO QUE SE ESTÁ EDITANDO AL VOLVER A DIBUJAR LA PANTALLA ==============
   render() reconstruye TODO el HTML desde cero cada vez (por ejemplo, cuando llega un pedido
   nuevo en segundo plano mientras editas algo). Desde que cada campo de texto importante está
   "atado" al estado (ver los oninput= en los formularios de arriba), ese HTML nuevo ya trae el
   valor correcto — pero igual te saca el foco del campo, como si hubieras hecho click en otro
   lado a media palabra. Esto captura, justo antes de reconstruir la pantalla, en qué campo
   estabas escribiendo y en qué posición iba el cursor, y lo restaura después. De paso, por si
   algún campo quedara sin atar al estado (ahora o en el futuro), respeta el valor que tenías en
   pantalla en ese instante por encima de lo que traiga el estado — así nunca se pierde una letra
   de lo que estabas escribiendo, pase lo que pase en segundo plano. */
function captureFocusState(root){
  const el = document.activeElement;
  if(!el || !root || !root.contains(el) || !el.id) return null;
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return null;
  const info = { id: el.id, value: el.value, scrollTop: root.scrollTop };
  if(typeof el.selectionStart === 'number'){ info.selStart = el.selectionStart; info.selEnd = el.selectionEnd; }
  return info;
}
function restoreFocusState(root, info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  if('value' in el && el.value !== info.value) el.value = info.value;
  el.focus();
  if(info.selStart!=null && el.setSelectionRange){
    try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
  }
  root.scrollTop = info.scrollTop;
}
// Además del campo enfocado, muchas listas (buscar y agregar un producto, elegir alcance de una
// promoción, auditoría, etc.) tienen su propio scroll interno. Sin esto, marcar una casilla o
// agregar un producto de esa lista la reconstruye desde cero y el navegador la regresa hasta
// arriba, aunque el campo enfocado no cambie. En vez de etiquetar cada una a mano (son muchas y
// crecen con el tiempo), se recuerda el scroll de CADA contenedor con scroll propio, en el orden
// en que aparecen en pantalla, y se restaura en ese mismo orden tras el redibujado — funciona
// porque typear o marcar algo cambia el CONTENIDO de esas listas, no cuántas hay ni en qué orden.
const SCROLLABLE_SELECTOR = '[style*="overflow-y:auto"],[style*="overflow-y: auto"],[style*="overflow:auto"],[style*="overflow: auto"]';
function captureScrollPositions(root){
  return Array.from(root.querySelectorAll(SCROLLABLE_SELECTOR)).map(el=>el.scrollTop);
}
function restoreScrollPositions(root, positions){
  if(!positions || !positions.length) return;
  const els = root.querySelectorAll(SCROLLABLE_SELECTOR);
  els.forEach((el,i)=>{ if(positions[i]) el.scrollTop = positions[i]; });
}
function render(){
  const root = document.getElementById('root');
  const focusInfo = captureFocusState(root);
  const scrollPositions = captureScrollPositions(root);
  if(!state.authChecked){ root.innerHTML = `<div class="loading-screen">Verificando sesión…</div>`; restoreFocusState(root, focusInfo); return; }
  if(!state.user){ root.innerHTML = renderLogin(); restoreFocusState(root, focusInfo); return; }
  if(state.totpRequired && !state.totpVerified){ root.innerHTML = renderTotpChallenge(); restoreFocusState(root, focusInfo); return; }
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando panel…</div>`; restoreFocusState(root, focusInfo); return; }
  root.innerHTML = renderAdmin();
  if(!document.getElementById('toast')){ const t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  const pinField = document.getElementById('pin-field'); if(pinField && !focusInfo) pinField.focus();
  const searchField = document.getElementById('global-search-input'); if(searchField && document.activeElement!==searchField && !focusInfo){ searchField.focus(); const v=searchField.value; searchField.setSelectionRange(v.length,v.length); }
  restoreFocusState(root, focusInfo);
  restoreScrollPositions(root, scrollPositions);
}
render();
</script>
