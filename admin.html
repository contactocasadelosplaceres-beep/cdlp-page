<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración — La Casa de los Placeres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#FBF5F2; --surface:#FFFFFF; --surface-soft:#F6E9E6; --ink:#2B1620; --ink-soft:#6E5560;
    --primary:#993477; --primary-deep:#5C1F49; --rose:#BC355C; --coral:#ED7578; --amber:#F6A030;
    --green:#7AB71A; --teal:#20B7CA; --navy:#0A4A5B; --border:#EBD9D3;
    --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-pill:999px;
    --shadow-sm:0 2px 8px -4px rgba(43,22,32,0.14);
    --shadow-md:0 12px 28px -12px rgba(43,22,32,0.20);
    --shadow-lg:0 24px 48px -20px rgba(43,22,32,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;} select,input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1100px;margin:0 auto;min-height:100vh;background:var(--surface);}
  .admin-top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 4px 16px -10px rgba(0,0,0,0.45);position:relative;z-index:25;}
  .admin-top .brand-name{font-size:16px;font-weight:700;font-family:'League Spartan',sans-serif;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;}
  .admin-top .brand-sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .admin-top-actions{display:flex;gap:8px;flex-shrink:0;}
  .logout-link{font-size:12px;background:rgba(255,255,255,0.14);padding:8px 13px;border-radius:var(--radius-pill);color:#fff;font-weight:600;white-space:nowrap;transition:background .15s ease;}
  .logout-link:hover{background:rgba(255,255,255,0.22);}
  @media(max-width:400px){
    .admin-top{padding:12px 16px;}
    .admin-top .brand-name{font-size:14.5px;max-width:50vw;}
    .admin-top .brand-sub{display:none;}
    .logout-link{font-size:11px;padding:7px 11px;}
  }
  .admin-tabs{display:flex;gap:4px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:20;}
  .admin-tabs::-webkit-scrollbar{display:none;}
  .admin-tab{padding:9px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap;transition:all .15s ease;}
  .admin-tab.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(153,52,119,0.5);}
  .admin-tabs-sep{width:1px;flex-shrink:0;background:var(--border);margin:6px 4px;}

  /* Navegación agrupada del admin en celular: reemplaza la franja de 15 pestañas por un
     selector compacto con el nombre de la sección actual, que despliega las pestañas
     agrupadas por tema (Ventas, Catálogo, Personas, Analítica, Sistema). Mismas pestañas,
     mismas funciones — solo cambia la forma de llegar a ellas. */
  .admin-nav-mobile{display:none;}
  @media(max-width:760px){
    .admin-tabs-main{display:none;}
    .admin-nav-mobile{display:block;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);}
    .admin-nav-mobile-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:14.5px;font-weight:800;color:var(--primary-deep);background:#fff;font-family:'League Spartan',sans-serif;}
    .admin-nav-mobile-sheet{max-height:65vh;overflow-y:auto;padding:4px 14px 16px;border-top:1px solid var(--border);background:var(--bg);}
    .admin-nav-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 2px 7px;}
    .admin-nav-group-row{display:flex;flex-wrap:wrap;gap:7px;}
    .admin-nav-mobile .admin-tab{background:#fff;border:1.5px solid var(--border);min-height:38px;}
    .admin-nav-mobile .admin-tab.active{border-color:var(--primary);background:#fff;color:var(--primary-deep);}
  }
  .admin-body{padding:20px 20px 60px;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
  @media(min-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:960px){.stat-grid{grid-template-columns:repeat(6,1fr);}}
  .stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;transition:box-shadow .15s ease,transform .15s ease;}
  .stat-card.primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep));border-color:transparent;}
  .stat-card.primary .stat-label{color:rgba(255,255,255,0.78);}
  .stat-card.primary .stat-value{color:#fff;font-size:26px;}
  @media(max-width:699px){.stat-card.primary{grid-column:span 2;}}
  .stat-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;line-height:1.3;font-weight:600;}
  .stat-value{font-size:22px;font-weight:800;font-family:'League Spartan',sans-serif;color:var(--primary-deep);}
  .stat-delta{font-size:11px;margin-top:4px;font-weight:700;}
  .stat-delta.up{color:var(--green);}
  .stat-delta.down{color:var(--rose);}

  .panel{border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-bottom:20px;background:#fff;box-shadow:var(--shadow-sm);}
  .panel-title{font-size:14.5px;font-weight:700;color:var(--primary-deep);margin-bottom:14px;font-family:'League Spartan',sans-serif;}
  .panel-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:14px;}

  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;overflow-x:auto;}
  .bar-col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-val{font-size:10px;color:var(--ink-soft);margin-bottom:4px;font-weight:700;white-space:nowrap;}
  .bar-fill{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--primary);min-height:3px;transition:height .3s ease;}
  .bar-label{font-size:9.5px;color:var(--ink-soft);margin-top:6px;text-align:center;line-height:1.2;}

  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .hbar-label{width:110px;flex-shrink:0;font-size:12px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{flex:1;height:16px;background:var(--surface-soft);border-radius:8px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:8px;}
  .hbar-val{width:60px;text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:700;flex-shrink:0;}

  .list-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;background:#fff;transition:box-shadow .15s ease;}
  .list-row:hover{box-shadow:var(--shadow-sm);}
  .row-swatch{width:44px;height:44px;border-radius:9px;flex-shrink:0;object-fit:cover;}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:13.5px;font-weight:700;}
  .row-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:32px;height:32px;border-radius:9px;background:var(--surface-soft);color:var(--primary-deep);font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;}
  .icon-btn:hover{background:#efd9d3;}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn.danger{background:#FBE2E6;color:var(--rose);}
  .icon-btn.danger:hover{background:#f7cdd5;}
  .status-badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);color:#fff;flex-shrink:0;}
  .rank-num{width:22px;height:22px;border-radius:50%;background:var(--surface-soft);color:var(--primary-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .btn-add-new{background:var(--primary);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(153,52,119,0.55);transition:transform .12s ease;}
  .btn-add-new:active{transform:scale(0.97);}
  .btn-outline{background:#fff;border:1.5px solid var(--primary);color:var(--primary);padding:10px 17px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;transition:background .15s ease;}
  .btn-outline:hover{background:var(--surface-soft);}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input,.form-field textarea,.form-field select{width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--ink);transition:border-color .15s ease;}
  .form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--primary);outline:none;}
  .form-field textarea{resize:vertical;min-height:60px;}
  .field-input{width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--ink);margin-bottom:8px;transition:border-color .15s ease;}
  .field-input:focus{border-color:var(--primary);outline:none;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .note-box{background:var(--surface-soft);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .btn-primary{background:linear-gradient(135deg,var(--rose),#a92c50);color:#fff;padding:12px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(188,53,92,0.5);transition:transform .12s ease,opacity .12s ease;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:.45;box-shadow:none;}

  /* Sistema de botones por nivel: primario (arriba), secundario, terciario, destructivo */
  .btn-tertiary{background:transparent;color:var(--ink-soft);padding:9px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;border:1.5px dashed var(--border);display:inline-flex;align-items:center;gap:6px;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .btn-tertiary:hover{background:var(--surface-soft);border-color:var(--primary);color:var(--primary-deep);}
  .btn-tertiary svg{flex-shrink:0;}
  .btn-danger{background:#FBE2E6;color:#A02040;padding:11px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;transition:background .15s ease;}
  .btn-danger:hover{background:#F6C9D1;}
  .btn-danger-text{background:transparent;color:#A02040!important;font-weight:700!important;padding:8px 6px;transition:opacity .15s ease;}
  .btn-danger-text:hover{opacity:.75;}
  .toolbar-tools-panel{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface-soft);border-radius:var(--radius-md);padding:12px;margin:-4px 0 12px;}
  .toolbar-tools-panel .btn-outline{background:#fff;}
  /* Encabezado de sección dentro de formularios largos (ej. modal de producto), para que se
     lean como bloques con propósito (Información principal / Precios / Inventario / etc.)
     en vez de una sola lista continua de campos. */
  .form-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--primary);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
  .form-section-label:first-of-type{margin-top:4px;padding-top:0;border-top:none;}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,22,32,0.55);backdrop-filter:blur(1px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.modal-overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:22px 20px;box-shadow:0 -20px 50px -20px rgba(43,22,32,0.35);}
  @media(min-width:600px){.modal{border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);}}
  .modal h3{font-size:17.5px;color:var(--primary-deep);margin-bottom:14px;font-weight:700;font-family:'League Spartan',sans-serif;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;}
  .btn-cancel{background:var(--surface-soft);color:var(--ink-soft);transition:background .15s ease;}
  .btn-cancel:hover{background:#efd9d3;}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
    background:radial-gradient(1200px 600px at 15% -10%, rgba(237,117,120,0.35), transparent 60%),
               radial-gradient(900px 500px at 110% 110%, rgba(32,183,202,0.22), transparent 55%),
               linear-gradient(160deg,var(--primary-deep),#3a1332 72%);}
  .login-card{background:#fff;border-radius:var(--radius-lg);padding:32px 26px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
  .login-card h2{color:var(--primary-deep);font-size:20px;margin-bottom:6px;font-weight:700;}
  .login-card p{color:var(--ink-soft);font-size:12.5px;margin-bottom:18px;line-height:1.5;}
  .login-card input{width:100%;font-size:16px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:10px;transition:border-color .15s ease;background:var(--bg);}
  .login-card input:focus{border-color:var(--primary);outline:none;}
  .login-error{color:var(--rose);font-size:12px;margin-bottom:8px;min-height:14px;font-weight:600;}
  .order-detail{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-top:8px;font-size:12.5px;border:1px solid var(--border);}
  .order-detail div{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
  .status-filter{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;}
  .status-filter::-webkit-scrollbar{display:none;}

  /* ===== TABLA DE PEDIDOS ===== */
  .orders-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
  .orders-table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px;}
  .orders-table th{text-align:left;padding:12px 14px;background:var(--bg);color:var(--ink-soft);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;border-bottom:1px solid var(--border);}
  .orders-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap;}
  /* Inventario por centro: número de columnas variable (una por centro activo), así que en vez
     de forzar tarjetas (aquí sí importa poder comparar cifras en una fila), se deja scroll
     horizontal pero con la columna de producto fija, para no perder de vista qué fila es cuál. */
  .inventario-table th:first-child,.inventario-table td:first-child{position:sticky;left:0;z-index:1;box-shadow:2px 0 5px -3px rgba(0,0,0,0.12);}
  .inventario-table td:first-child{background:#fff;font-weight:600;}
  .inventario-table th:first-child{background:var(--bg);z-index:2;}
  .orders-table tbody tr{transition:background .12s ease;}
  .orders-table tbody tr:hover{background:var(--bg);}
  .orders-table tr:last-child td{border-bottom:none;}
  .orders-table tr.archived-row{opacity:.6;}
  .order-folio{font-weight:800;color:var(--primary-deep);}
  .order-folio-btn{font-weight:800;color:var(--primary-deep);text-decoration:underline;text-underline-offset:2px;padding:0;background:none;border:none;cursor:pointer;font-size:inherit;}
  .order-folio-btn:hover{color:var(--rose);}
  .order-date-main{font-weight:600;}
  .order-date-sub{font-size:11px;color:var(--ink-soft);}
  .order-source-tag{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .order-products-toggle{display:flex;align-items:center;gap:4px;color:var(--primary);font-weight:700;cursor:pointer;background:none;border:none;font-size:13px;padding:0;}
  .order-products-toggle .chev{transition:transform .15s ease;}
  .order-products-toggle.open .chev{transform:rotate(180deg);}
  .order-pay-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--green);background:#EAF3D8;padding:4px 9px;border-radius:var(--radius-pill);white-space:nowrap;}
  .order-pay-pill.split{color:var(--teal);background:#DFF4F6;cursor:help;}
  .order-ship-sub{font-size:11px;color:var(--ink-soft);margin-top:3px;white-space:normal;max-width:180px;}
  .order-actions-cell{position:relative;text-align:right;}
  .order-actions-btn{width:32px;height:32px;border-radius:9px;background:var(--surface-soft);color:var(--primary-deep);font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .order-actions-btn:hover{background:#efd9d3;}
  .order-actions-menu{position:absolute;top:38px;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:20;min-width:170px;padding:6px;white-space:nowrap;}
  .order-actions-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .order-actions-menu button:hover{background:var(--surface-soft);}
  .order-actions-menu button.active-status{color:var(--primary-deep);font-weight:800;}
  .order-actions-menu hr{border:none;border-top:1px solid var(--border);margin:5px 0;}
  .order-actions-overlay{position:fixed;inset:0;z-index:19;}
  .products-detail-row td{background:var(--bg);padding:10px 14px;white-space:normal;}
  .products-detail-row .pd-line{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .products-detail-row .pd-extra{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:3px 0;border-top:1px dashed var(--border);margin-top:4px;}

  /* ===== TABLA DE PEDIDOS EN CELULAR: se convierte en tarjetas, no en tabla con scroll =====
     Solo afecta la tabla de Pedidos (.pedidos-table); la tabla de Inventario por centro,
     que también usa la clase base .orders-table pero tiene columnas distintas, no se toca. */
  @media(max-width:760px){
    .pedidos-table{min-width:0;width:100%;}
    .orders-table-wrap:has(.pedidos-table){overflow-x:visible;border:none;box-shadow:none;background:transparent;}
    .pedidos-table thead{display:none;}
    .pedidos-table tbody{display:block;}
    .pedidos-table tbody tr:not(.products-detail-row){
      display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:6px;
      grid-template-areas:"folio status" "customer customer" "total pay" "date products" "actions actions";
      background:#fff;border:1px solid var(--border);border-radius:var(--radius-md) var(--radius-md) 0 0;
      box-shadow:var(--shadow-sm);padding:13px 14px;margin:0 0 12px;
    }
    .pedidos-table tbody tr:not(.products-detail-row):has(+ tr.products-detail-row){
      border-radius:var(--radius-md) var(--radius-md) 0 0;margin-bottom:0;
    }
    .pedidos-table tr:last-child td{border-bottom:none;}
    .pedidos-table td{padding:0;border-bottom:none;white-space:normal;display:block;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(1){grid-area:folio;align-self:center;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(2){grid-area:date;align-self:center;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(3){grid-area:customer;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(4){grid-area:total;font-size:15px;align-self:center;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(5){grid-area:products;justify-self:end;align-self:center;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(6){grid-area:pay;align-self:center;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(7){grid-area:status;justify-self:end;text-align:right;}
    .pedidos-table tbody tr:not(.products-detail-row) td:nth-child(8){grid-area:actions;margin-top:4px;}
    .pedidos-table tr.products-detail-row{display:block;}

/* ============== LOAD + MIGRATION ============== */
async function loadData(){
  try{
    let prodSnap = await db.collection('products').get();
    if(prodSnap.empty){
      const oldDoc = await db.collection('catalog').doc('products').get();
      const batch = db.batch();
      const seed = (oldDoc.exists && (oldDoc.data().items||[]).length) ? oldDoc.data().items : DEFAULT_PRODUCTS;
      seed.forEach(it=>{
        const ref = db.collection('products').doc();
        batch.set(ref, {name:it.name, cat:it.cat, price:it.price, stock:it.stock, desc:it.desc||'', images: it.images||[]});
      });
      await batch.commit();
      prodSnap = await db.collection('products').get();
    }
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()}));

    const [setSnap, ordersSnap, salesSnap, visitsSnap, cashiersSnap, aiSnap, centersSnap, transfersSnap, auditsSnap, customersSnap, couponUsageSnap, cashRegistersSnap, analyticsEventsSnap] = await Promise.all([
      db.collection('settings').doc('store').get(),
      db.collection('orders').orderBy('date','desc').get(),
      db.collection('sales').orderBy('date','desc').get(),
      db.collection('visits').orderBy('date','desc').limit(3000).get(),
      db.collection('cashiers').get(),
      db.collection('settings').doc('ai').get(),
      db.collection('distributionCenters').get(),
      db.collection('transfers').orderBy('date','desc').limit(200).get(),
      db.collection('audits').orderBy('date','desc').limit(100).get(),
      db.collection('customers').get(),
      db.collection('couponUsage').get(),
      db.collection('cashRegisters').orderBy('openedAt','desc').limit(300).get(),
      // Eventos de embudo (vistas de producto, agregar al carrito, inicio de checkout, compra) de la
      // tienda pública. Colección aparte de "visits" para no reducir la ventana que cubre su límite de 3000.
      db.collection('analyticsEvents').orderBy('date','desc').limit(5000).get(),
    ]);
    let needsSeedSettings = !setSnap.exists;
    state.settings = needsSeedSettings ? {...DEFAULT_SETTINGS} : {...DEFAULT_SETTINGS, ...setSnap.data()};
    if(!state.settings.categories || !state.settings.categories.length) state.settings.categories = [...DEFAULT_CATEGORIES];
    if(!state.settings.hiddenCategories) state.settings.hiddenCategories = [];
    if(!state.settings.needs || !state.settings.needs.length) state.settings.needs = JSON.parse(JSON.stringify(DEFAULT_NEEDS));
    if(!state.settings.sections || !state.settings.sections.length) state.settings.sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
    if(!state.settings.promoBanner) state.settings.promoBanner = {title:"",text:"",image:"",buttonText:"",buttonLink:""};
    if(!state.settings.featuredProductIds) state.settings.featuredProductIds = [];
    if(!state.settings.testimonials) state.settings.testimonials = [];
    if(!state.settings.wholesaleTiers) state.settings.wholesaleTiers = [];
    if(!state.settings.coupons) state.settings.coupons = [];
    if(!state.settings.promotions) state.settings.promotions = [];
    // unen en una sola lista, ordenada por fecha, para verlos juntos en "Pedidos".
    const tiendaOrders = ordersSnap.docs.map(d=>({id:d.id, source:'tienda', archived:false, ...d.data()}));
    const posOrders = salesSnap.docs.map(d=>{
      const data = d.data();
      return { id:d.id, source:'pos', archived:false, status:'Entregado', customer: data.customerName || 'Venta en tienda física', ...data };
    });
    state.orders = [...tiendaOrders, ...posOrders].sort((a,b)=> new Date(b.date) - new Date(a.date));
    state.visits = visitsSnap.docs.map(d=>d.data());
    state.analyticsEvents = analyticsEventsSnap.docs.map(d=>d.data());
    state.cashiers = cashiersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.aiSettings = aiSnap.exists ? {...DEFAULT_AI_SETTINGS, ...aiSnap.data()} : {...DEFAULT_AI_SETTINGS};
    if(needsSeedSettings) await saveSettings();

    // Centros de distribución: si no existe ninguno, se crea "Principal" automáticamente.
    state.centers = centersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.centers.length===0){
      const ref = await db.collection('distributionCenters').add({name:'Principal', isDefault:true, active:true, createdAt:new Date().toISOString()});
      state.centers = [{id:ref.id, name:'Principal', isDefault:true, active:true}];
    }
    state.transfers = transfersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.audits = auditsSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.customers = customersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.couponUsage = couponUsageSnap.docs.map(d=>d.data());
    state.cashRegisters = cashRegistersSnap.docs.map(d=>({id:d.id, ...d.data()}));

    // Migración automática: cualquier producto que todavía no tenga inventario
    // repartido por centro, se le asigna TODO su stock actual al centro Principal.
    const principal = state.centers.find(c=>c.isDefault) || state.centers[0];
    const migrationBatch = db.batch();
    let needsMigration = false;
    state.products.forEach(p=>{
      if(!p.stockByCenter){
        p.stockByCenter = { [principal.id]: p.stock||0 };
        migrationBatch.update(db.collection('products').doc(p.id), {stockByCenter: p.stockByCenter});
        needsMigration = true;
      }
    });
    if(needsMigration){ try{ await migrationBatch.commit(); }catch(e){ console.error('No se pudo migrar el inventario a centros', e); } }
  }catch(e){
    console.error(e);
    state.products = []; state.orders = []; state.visits = []; state.analyticsEvents = []; state.cashiers = []; state.settings = {...DEFAULT_SETTINGS};
    state.centers = []; state.transfers = []; state.audits = []; state.customers = []; state.couponUsage = [];
    state.cashRegisters = [];
    showToast('No se pudo cargar todo desde el servidor');
  }
  computeMyPermissions();
  if(state.myPermissions && !canAccessTab(state.adminTab)) state.adminTab = firstAccessibleTab() || state.adminTab;
  state.loaded = true; render();
}
async function saveOrdersStatus(orderId,status,source){ try{ await db.collection(source==='pos'?'sales':'orders').doc(orderId).update({status}); }catch(e){ console.error(e); showToast('No se pudo actualizar el pedido'); } }

async function saveSettings(){ try{ await db.collection('settings').doc('store').set(state.settings); }catch(e){ console.error(e); showToast('No se pudo guardar la configuración'); } }

/* ============== PERMISOS DE COLABORADOR ==============
   El rol "colaborador" da acceso a admin.html con su propia cuenta de Firebase (creada
   aparte, en la consola de Firebase — ver nota en el modal), pero solo a las secciones
   que aquí se le marquen. La lista de abajo controla tanto lo que VE en el panel (aquí)
   como lo que puede REALMENTE leer/escribir en Firestore: cada vez que se guarda un
   colaborador se refleja en la colección "staffPermissions", indexada por su correo en
   minúsculas, que es la que consultan las reglas de seguridad (firestore.rules). Nunca se
   borra ese documento al desactivar o quitarle acceso a alguien — se deja con todos los
   permisos en falso, para que la restricción siga aplicando aunque la cuenta de Firebase
   de esa persona siga existiendo.
   "Usuarios" (este mismo panel) nunca aparece en la lista: si un colaborador pudiera
   editar permisos, podría dárselos a sí mismo. Administrar usuarios queda reservado a
   cuentas sin restricciones (las que no tienen un documento de colaborador con ese correo). */
const PERMISSION_DEFS = [
  {key:'resumen', label:'Resumen (ventas totales, ingresos)'},
  {key:'pedidos', label:'Pedidos (ver y gestionar pedidos y ventas)'},
  {key:'productos', label:'Productos (editar catálogo e inventario)'},
  {key:'clientes', label:'Clientes'},
  {key:'caja', label:'Caja (apertura/cierre del Punto de Venta)'},
  {key:'centros', label:'Centros de distribución y transferencias'},
  {key:'estadisticas', label:'Estadísticas'},
  {key:'config', label:'Configuración de la tienda (mayoreo, cupones, promociones, diseño, ajustes, asistente IA)'},
];
const TAB_PERMISSION = {
  resumen:'resumen', pedidos:'pedidos', caja:'caja', productos:'productos', centros:'centros',
  mayoreo:'config', cupones:'config', promociones:'config', diseño:'config',
  clientes:'clientes', estadísticas:'estadisticas', 'asistente ia':'config', configuración:'config',
  cajeros:null, // nunca delegable
};
// Sincroniza (o revoca) el espejo en "staffPermissions" que usan las reglas de seguridad.
// email/oldEmail siempre en minúsculas; revoke=true escribe todos los permisos en falso
// en vez de borrar el documento (ver nota arriba de por qué no se borra).
async function syncStaffPermissions(email, permissions, oldEmail){
  const clean = (email||'').trim().toLowerCase();
  const oldClean = (oldEmail||'').trim().toLowerCase();
  try{
    if(oldClean && oldClean!==clean){
      await db.collection('staffPermissions').doc(oldClean).set({permissions:{}});
    }
    if(clean){
      await db.collection('staffPermissions').doc(clean).set({permissions: permissions||{}});
    }
  }catch(e){ console.error('No se pudo sincronizar los permisos', e); }
}
function computeMyPermissions(){
  const myEmail = (state.user && state.user.email || '').trim().toLowerCase();
  const mine = state.cashiers.find(c=>c.role==='colaborador' && (c.email||'').trim().toLowerCase()===myEmail && myEmail);
  state.myPermissions = (mine && mine.active) ? (mine.permissions||{}) : null;
}
function canAccessTab(t){
  if(!state.myPermissions) return true;
  const perm = TAB_PERMISSION[t];
  if(!perm) return false;
  return !!state.myPermissions[perm];
}
function firstAccessibleTab(){
  for(const g of ADMIN_NAV_GROUPS){ for(const t of g.tabs){ if(canAccessTab(t)) return t; } }
  return null;
}

const PAY_METHODS = ["Efectivo","Tarjeta","Transferencia"];
// Desglose de pago de una venta: usa "payments" (ventas divididas, o registradas después de
// este cambio) y cae de vuelta a "paymentMethod" para ventas guardadas antes de este cambio.
function salePayments(s){
  if(s.payments && s.payments.length) return s.payments;
  return [{method: s.paymentMethod || 'Efectivo', amount: s.total||0}];
}
function paymentMethodLabel(o){
  const pays = salePayments(o);
  if(pays.length>1) return 'Dividido: ' + pays.map(p=>`${p.method} ${money(p.amount)}`).join(' · ');
  return pays[0].method;
}
// Versión corta para espacios angostos (la pastilla de la tabla de pedidos): solo dice
// "Dividido" en vez del desglose completo, que se sigue mostrando en el detalle del pedido.
function paymentMethodShortLabel(o){
  const pays = salePayments(o);
  return pays.length>1 ? 'Dividido' : pays[0].method;
}
function formatFolio(n){ return n ? '#' + String(n).padStart(4,'0') : 'Sin folio'; }
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}
async function assignFolioToOrder(id, source){
  const orderNumber = await getNextOrderNumber();
  if(!orderNumber){ showToast('No se pudo generar el folio, intenta de nuevo'); return; }
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update({orderNumber});
    const o = state.orders.find(x=>x.id===id); if(o) o.orderNumber = orderNumber;
    showToast(`Folio ${formatFolio(orderNumber)} asignado`); render();
  }catch(e){ console.error(e); showToast('No se pudo asignar el folio'); }
}
async function deleteOrder(id, source){
  const o = state.orders.find(x=>x.id===id);
  const label = o ? `${formatFolio(o.orderNumber)} — ${o.customer||'este pedido'}` : 'este pedido';
  if(!confirm(`¿Eliminar ${label}? Esta acción no se puede deshacer.`)) return;
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).delete();
    state.orders = state.orders.filter(x=>x.id!==id);
    showToast('Pedido eliminado'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar el pedido'); }
}

function openOrderDetailModal(id){ state.orderDetailModal = id; state.orderDiscountEditing=false; render(); }
function closeOrderDetailModal(){ state.orderDetailModal = null; state.orderDiscountEditing=false; render(); }
function prodCats(p){ return (p.categories && p.categories.length) ? p.categories : (p.cat ? [p.cat] : []); }
function isCouponEligibleItem(prodCategories, prodId, coupon){
  if(coupon.scope==='all') return true;
  if(coupon.scope==='categories') return (prodCategories||[]).some(c=>(coupon.categories||[]).includes(c));
  if(coupon.scope==='products') return (coupon.productIds||[]).includes(prodId);
  return false;
}
function orderCouponEligibleItems(o, coupon){
  return (o.items||[]).map(it=>({it, p: state.products.find(x=>x.id===it.id)})).filter(({p})=>p && isCouponEligibleItem(prodCats(p), p.id, coupon));
}
function orderCouponDiscountAmount(o, coupon){
  return orderCouponEligibleItems(o, coupon).reduce((s,{it})=>s + Math.round(it.price*it.qty*(coupon.discountPercent/100)), 0);
}
function startEditOrderDiscount(id){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  state.orderDiscountEditing = true;
  state.orderDiscountType = o.manualDiscount ? (o.manualDiscount.type||'fixed') : 'fixed';
  state.orderDiscountValueInput = o.manualDiscount && o.manualDiscount.type!=='coupon' ? String(o.manualDiscount.value!=null?o.manualDiscount.value:o.manualDiscount.amount) : '';
  state.orderDiscountCouponInput = o.manualDiscount && o.manualDiscount.type==='coupon' ? (o.manualDiscount.code||'') : '';
  state.orderDiscountReasonInput = o.manualDiscount ? (o.manualDiscount.reason||'') : '';
  render();
}
async function saveOrderDiscount(id, source){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const value = Number(state.orderDiscountValueInput);
  const reason = state.orderDiscountReasonInput.trim();
  if(!state.orderDiscountValueInput.trim() || isNaN(value) || value<=0){ showToast('Ingresa un monto válido'); return; }
  if(state.orderDiscountType==='percent' && value>100){ showToast('El porcentaje no puede ser mayor a 100'); return; }
  if(!reason){ showToast('Escribe un motivo para el ajuste'); return; }
  const subtotal = (o.subtotal!=null) ? o.subtotal : o.total;
  const amount = state.orderDiscountType==='percent' ? Math.round(subtotal*(value/100)) : Math.min(value, subtotal);
  const newTotal = Math.max(0, subtotal - amount);
  const payload = { subtotal, manualDiscount:{type: state.orderDiscountType, value, amount, reason}, total:newTotal };
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update(payload);
    Object.assign(o, payload);
    state.orderDiscountEditing = false;
    showToast('Ajuste guardado'); render();
  }catch(e){ console.error(e); showToast('No se pudo guardar el ajuste'); }
}
async function applyOrderCoupon(id, source){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const code = state.orderDiscountCouponInput.trim().toUpperCase();
  if(!code){ showToast('Ingresa un código de cupón'); return; }
  const coupon = (state.settings.coupons||[]).find(c=>c.code===code);
  if(!coupon || !coupon.active){ showToast('Código no válido'); return; }
  const now = new Date();
  if(coupon.startDate && now < new Date(coupon.startDate)){ showToast('Este cupón todavía no está vigente'); return; }
  if(coupon.endDate && now > new Date(coupon.endDate+'T23:59:59')){ showToast('Este cupón ya venció'); return; }
  const eligible = orderCouponEligibleItems(o, coupon);
  if(eligible.length===0){ showToast('Este cupón no aplica a los productos de este pedido'); return; }
  if(coupon.maxUses>0){
    try{
      const used = await db.collection('couponUsage').where('code','==',code).get();
      if(used.size >= coupon.maxUses){ showToast('Este cupón ya alcanzó su límite de usos'); return; }
    }catch(e){ console.error(e); }
  }
  const subtotal = (o.subtotal!=null) ? o.subtotal : o.total;
  const amount = orderCouponDiscountAmount(o, coupon);
  const newTotal = Math.max(0, subtotal - amount);
  const reason = state.orderDiscountReasonInput.trim() || `Cupón ${code}`;
  const payload = { subtotal, manualDiscount:{type:'coupon', code, amount, reason}, total:newTotal, couponCode: code };
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update(payload);
    Object.assign(o, payload);
    try{
      await db.collection('couponUsage').add({code, date:new Date().toISOString()});
      state.couponUsage.push({code, date:new Date().toISOString()});
    }catch(e){ console.error('No se pudo registrar el uso del cupón', e); }
    state.orderDiscountEditing = false;
    showToast('Cupón aplicado'); render();
  }catch(e){ console.error(e); showToast('No se pudo aplicar el cupón'); }
}
async function removeOrderDiscount(id, source){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const restoredTotal = o.subtotal!=null ? o.subtotal : o.total;
  const payload = { manualDiscount: firebase.firestore.FieldValue.delete(), total: restoredTotal };
  if(o.couponCode) payload.couponCode = firebase.firestore.FieldValue.delete();
  try{
    await db.collection(source==='pos'?'sales':'orders').doc(id).update(payload);
    delete o.manualDiscount; o.total = restoredTotal; delete o.couponCode;
    showToast('Ajuste eliminado'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar el ajuste'); }
}
function waLink(phone, text){
  const num = (phone||'').replace(/\D/g,'');
  return `https://wa.me/${num}?text=${encodeURIComponent(text)}`;
}
// Teléfono de contacto del pedido sin importar si viene de la tienda online (o.phone) o de
// una venta de Punto de Venta (o.customerPhone) — para que "Escribir al cliente" y "Enviar al
// repartidor" funcionen igual sin importar dónde se hizo la venta.
function orderContactPhone(o){ return o.phone || o.customerPhone || ''; }
function buildDeliveryMessage(o){
  const origen = state.settings.storeAddress || '(configura tu dirección de origen en Configuración)';
  const destino = [o.address, o.notes].filter(Boolean).join(' — ') || (o.source==='pos' ? 'Retirado en Punto de Venta' : '(sin dirección)');
  const telefono = orderContactPhone(o);
  return `*PEDIDO ${o.orderNumber || ''}*\n\n` +
         `*De* ${origen}\n\n` +
         `*A* ${destino}\n${telefono}\n\n` +
         `*Producto* $${Math.round(o.total||0)}\n\n` +
         `*Cobrar al cliente* $`;
}
function buildCustomerMessage(o){
  const folio = formatFolio(o.orderNumber);
  const nombre = o.customer || o.customerName || '';
  return `Hola ${nombre}, te escribimos de ${state.settings.storeName||'la tienda'} sobre tu pedido ${folio}. `;
}
function sendToDelivery(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  if(!state.settings.deliveryWhatsapp){ showToast('Configura el WhatsApp del repartidor en la pestaña Configuración'); return; }
  window.open(waLink(state.settings.deliveryWhatsapp, buildDeliveryMessage(o)), '_blank');
}

function showToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');

async function saveProduct(p){
  const newCats = (p.categories||[p.cat]).filter(c=>c && !state.settings.categories.includes(c));
  if(newCats.length){ state.settings.categories.push(...newCats); await saveSettings(); }
  const payload = {
    name:p.name, sku:p.sku||'', cat:p.cat, categories:p.categories||[p.cat],
    price:p.price, promoPrice:p.promoPrice||0, cost:p.cost||0,
    stock:p.stock, desc:p.desc, images:p.images||[], needs:p.needs||[],
    stockByCenter:p.stockByCenter||{}, hidden: !!p.hidden,
    variantGroups: p.variantGroups||[], variants: p.variants||[],
  };
  try{
    if(p.id){
      await db.collection('products').doc(p.id).set(payload);
      const idx = state.products.findIndex(x=>x.id===p.id); state.products[idx] = {id:p.id, ...payload};
    }else{
      const ref = await db.collection('products').add(payload);
      state.products.push({id:ref.id, ...payload});
    }
  }catch(e){ console.error(e); showToast('No se pudo guardar (revisa el tamaño de las imágenes)'); return; }
  state.productModal=null; showToast('Producto guardado'); render();
}
async function regenerateAllSKUs(){
  showToast('Generando SKU nuevos para todos, un momento...');
  const usedSkus = new Set();
  const batch = db.batch();
  state.products.forEach(p=>{
    let sku;
    do{ sku = generateSKU(p); }while(usedSkus.has(sku));
    usedSkus.add(sku);
    p.sku = sku;
    batch.update(db.collection('products').doc(p.id), {sku});
  });
  try{
    await batch.commit();
    showToast(`${state.products.length} SKU regenerados`); render();
  }catch(e){ console.error(e); showToast('No se pudo completar, intenta de nuevo'); }
}
async function generateMissingSKUs(){
  const missing = state.products.filter(p=>!p.sku);
  if(missing.length===0){ showToast('Todos tus productos ya tienen SKU'); return; }
  showToast(`Generando SKU para ${missing.length} producto(s)...`);
  const usedSkus = new Set(state.products.filter(p=>p.sku).map(p=>p.sku));
  const batch = db.batch();
  missing.forEach(p=>{
    let sku;
    do{ sku = generateSKU(p); }while(usedSkus.has(sku));
    usedSkus.add(sku);
    p.sku = sku;
    batch.update(db.collection('products').doc(p.id), {sku});
  });
  try{
    await batch.commit();
    showToast(`${missing.length} SKU generados`); render();
  }catch(e){ console.error(e); showToast('No se pudo completar, intenta de nuevo'); }
}
function looksTruncatedDesc(desc){
  const d = (desc||'').trim();
  if(!d) return false;
  return /\.\.\.$/.test(d) || /…$/.test(d);
}
function exportProductsCSV(){
  const rows = [['id','sku','nombre','categorias','precio','descripcion','longitud_descripcion','posible_descripcion_cortada']];
  state.products.forEach(p=>{
    const desc = p.desc||'';
    rows.push([p.id, p.sku||'', p.name, (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).join('|'), p.price, desc, desc.length, looksTruncatedDesc(desc)?'SI':'']);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["﻿"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='productos_descripciones.csv'; a.click();

}

  if(role==='colaborador' && !email){ showToast('Los colaboradores necesitan el correo con el que van a iniciar sesión'); return; }
  if(role==='colaborador' && (state.user.email||'').trim().toLowerCase()===email.trim().toLowerCase()){ showToast('No puedes usar tu propio correo — te quedarías sin acceso completo'); return; }

  const c = existing ? {...existing, name, email, role, pin, notify, permissions} : {name, email, role, pin, notify, permissions, active:true};
  await saveCashierDoc(c);
  // El acceso real siempre lo decide "staffPermissions", no la lista de cajeros: si el

  await syncStaffPermissions(role==='colaborador' ? email : '', role==='colaborador' ? permissions : {}, oldEmail);

const CROP_SIZE = 280, CROP_OUT = 700;
let cropCtx = null;
function clampCropOffsets(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const dw = cropCtx.natW*scale, dh = cropCtx.natH*scale;
  cropCtx.offX = Math.min(0, Math.max(CROP_SIZE-dw, cropCtx.offX));
  cropCtx.offY = Math.min(0, Math.max(CROP_SIZE-dh, cropCtx.offY));
}
function updateCropImgTransform(){
  const el = document.getElementById('crop-img'); if(!el || !cropCtx) return;
  const scale = cropCtx.baseScale*cropCtx.zoom;
  el.style.width = (cropCtx.natW*scale)+'px';
  el.style.height = (cropCtx.natH*scale)+'px';
  el.style.transform = `translate(${cropCtx.offX}px, ${cropCtx.offY}px)`;
}
function handleImageFileSelected(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const baseScale = CROP_SIZE/Math.min(img.naturalWidth, img.naturalHeight);
      cropCtx = { img, natW:img.naturalWidth, natH:img.naturalHeight, zoom:1, baseScale, offX:0, offY:0 };
      cropCtx.offX = (CROP_SIZE - cropCtx.natW*baseScale)/2;
      cropCtx.offY = (CROP_SIZE - cropCtx.natH*baseScale)/2;
      clampCropOffsets();
      state.cropOpen = true; render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function cropPointerDown(e){
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.dragging = true; cropCtx.startX = pt.clientX; cropCtx.startY = pt.clientY;
  cropCtx.startOffX = cropCtx.offX; cropCtx.startOffY = cropCtx.offY;
}
function cropPointerMove(e){
  if(!cropCtx || !cropCtx.dragging) return;
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  cropCtx.offX = cropCtx.startOffX + (pt.clientX - cropCtx.startX);
  cropCtx.offY = cropCtx.startOffY + (pt.clientY - cropCtx.startY);
  clampCropOffsets();
  updateCropImgTransform();
}
function cropPointerUp(){ if(cropCtx) cropCtx.dragging = false; }
document.addEventListener('mousemove', cropPointerMove);
document.addEventListener('mouseup', cropPointerUp);
document.addEventListener('touchmove', cropPointerMove, {passive:false});
document.addEventListener('touchend', cropPointerUp);
function cropSetZoom(val){
  if(!cropCtx) return;
  cropCtx.zoom = parseFloat(val);
  clampCropOffsets(); updateCropImgTransform();
}
function applyCrop(){
  const scale = cropCtx.baseScale*cropCtx.zoom;
  const sx = -cropCtx.offX/scale, sy = -cropCtx.offY/scale, ssize = CROP_SIZE/scale;
  const canvas = document.createElement('canvas'); canvas.width=CROP_OUT; canvas.height=CROP_OUT;
  canvas.getContext('2d').drawImage(cropCtx.img, sx, sy, ssize, ssize, 0, 0, CROP_OUT, CROP_OUT);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
  if(!state.productModal.images) state.productModal.images = [];
  if(state.productModal.images.length>=5){ showToast('Máximo 5 imágenes por producto'); }
  else state.productModal.images.push(dataUrl);
  state.cropOpen = false; cropCtx = null; render();
}

function moveImage(idx,dir){
  const arr = state.productModal.images;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]]; render();

/* ============== CSV IMPORT ============== */
function parseCSV(text){
  const rows = []; let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQuotes=false;i++;continue; }
      field+=c; i++; continue;
    }else{
      if(c === '"'){ inQuotes=true; i++; continue; }
      if(c === ','){ row.push(field); field=''; i++; continue; }
      if(c === '\n' || c === '\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function rowsToProducts(rows){
  if(!rows.length) return [];
  let start = 0;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const hasHeader = header.some(h=>h.includes('nombre')) || header.some(h=>h.includes('precio'));
  let colMap = {name:0,cat:1,price:2,stock:3,desc:4};
  if(hasHeader){
    start = 1;
    header.forEach((h,idx)=>{
      if(h.includes('nombre')) colMap.name=idx;
      else if(h.includes('categor')) colMap.cat=idx;
      else if(h.includes('precio')) colMap.price=idx;
      else if(h.includes('stock')||h.includes('existenc')) colMap.stock=idx;
      else if(h.includes('desc')) colMap.desc=idx;
    });
  }
  const out = [];
  for(let r=start;r<rows.length;r++){
    const row = rows[r];
    const name = (row[colMap.name]||'').trim();
    if(!name) continue;
    const cat = (row[colMap.cat]||'Otros').trim() || 'Otros';
    const price = Number((row[colMap.price]||'0').replace(/[^0-9.]/g,'')) || 0;
    const stock = Number((row[colMap.stock]||'0').replace(/[^0-9]/g,'')) || 0;
    const desc = (row[colMap.desc]||'').trim();
    out.push({name,cat,price,stock,desc});
  }
  return out;
}
function handleImportFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{ state.importText = e.target.result; state.importPreview = rowsToProducts(parseCSV(state.importText)); render(); };
  reader.readAsText(file);
}

async function commitImport(mode){
  if(state.importPreview.length===0){ showToast('No hay productos para importar'); return; }
  const newCats = new Set(state.settings.categories);
  state.importPreview.forEach(p=>newCats.add(p.cat));
  try{
    if(mode==='replace'){
      const batchDel = db.batch();
      state.products.forEach(p=>batchDel.delete(db.collection('products').doc(p.id)));
      await batchDel.commit();
      const batchAdd = db.batch();
      const newProducts = [];
      state.importPreview.forEach(p=>{
        const ref = db.collection('products').doc();
        const payload = {name:p.name, cat:p.cat, price:p.price, stock:p.stock, desc:p.desc, images:[]};
        batchAdd.set(ref, payload);
        newProducts.push({id:ref.id, ...payload});
      });
      await batchAdd.commit();
      state.products = newProducts;
    }else{
      const batch = db.batch();
      state.importPreview.forEach(p=>{
        const existing = state.products.find(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
        if(existing){
          existing.cat=p.cat; existing.price=p.price; existing.stock=p.stock; existing.desc=p.desc||existing.desc;
          batch.set(db.collection('products').doc(existing.id), {name:existing.name,cat:existing.cat,price:existing.price,stock:existing.stock,desc:existing.desc,images:existing.images||[]});
        }else{
          const ref = db.collection('products').doc();
          const payload = {name:p.name, cat:p.cat, price:p.price, stock:p.stock, desc:p.desc, images:[]};
          batch.set(ref, payload);
          state.products.push({id:ref.id, ...payload});
        }
      });
      await batch.commit();
    }
    state.settings.categories = Array.from(newCats);
    await saveSettings();
    state.importOpen=false; state.importPreview=[]; state.importText='';
    showToast('Catálogo importado');
    render();
  }catch(e){ console.error(e); showToast('Ocurrió un error al importar'); }
}

/* ============== MÉTRICAS ============== */
function computeMetrics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const cancelled = state.orders.filter(o=>o.status==='Cancelado');
  const totalRevenue = valid.reduce((s,o)=>s+o.total,0);
  const avgOrder = valid.length ? totalRevenue/valid.length : 0;
  const avgItems = valid.length ? valid.reduce((s,o)=>s+o.items.reduce((a,it)=>a+it.qty,0),0)/valid.length : 0;
  const pending = state.orders.filter(o=>['Nuevo','Preparando','En camino'].includes(o.status)).length;
  const lowStock = state.products.filter(p=>p.stock<=3);
  const cancelRate = state.orders.length ? Math.round((cancelled.length/state.orders.length)*100) : 0;

  const byPhone = {};
  state.orders.forEach(o=>{ if(!o.phone) return; (byPhone[o.phone] = byPhone[o.phone]||[]).push(o); });
  const uniqueCustomers = Object.keys(byPhone).length;
  const repeatCustomers = Object.values(byPhone).filter(list=>list.length>1).length;
  const repeatRate = uniqueCustomers ? Math.round((repeatCustomers/uniqueCustomers)*100) : 0;
  const topCustomers = Object.entries(byPhone).map(([phone,list])=>({
    phone, name:list[0].customer, spend: list.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0), count:list.length
  })).sort((a,b)=>b.spend-a.spend).slice(0,5);

  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const dayRevenue = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=d && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: rev}; });

  const months = []; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-i); months.push(d); }
  const monthRevenue = months.map((m,idx)=>{
    const next = idx<months.length-1 ? months[idx+1] : new Date(m.getFullYear(), m.getMonth()+1, 1);
    const rev = valid.filter(o=>{const od=new Date(o.date); return od>=m && od<next;}).reduce((s,o)=>s+o.total,0);
    return {label: m.toLocaleDateString('es-MX',{month:'short'}), value: rev};
  });

  const now = new Date();
  const startThis = new Date(now); startThis.setDate(now.getDate()-6); startThis.setHours(0,0,0,0);
  const startLast = new Date(startThis); startLast.setDate(startThis.getDate()-7);
  const revThis = valid.filter(o=>new Date(o.date)>=startThis).reduce((s,o)=>s+o.total,0);
  const revLast = valid.filter(o=>{const d=new Date(o.date); return d>=startLast && d<startThis;}).reduce((s,o)=>s+o.total,0);
  const revDelta = revLast>0 ? Math.round(((revThis-revLast)/revLast)*100) : (revThis>0?100:0);

  const catUnits = {}, catRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.id);
    const cat = prod ? prod.cat : 'Otros';
    catUnits[cat] = (catUnits[cat]||0)+it.qty;
    catRevenue[cat] = (catRevenue[cat]||0)+it.price*it.qty;
  }));
  const catUnitRows = Object.entries(catUnits).sort((a,b)=>b[1]-a[1]);
  const catRevRows = Object.entries(catRevenue).sort((a,b)=>b[1]-a[1]);
  const maxCatUnit = catUnitRows.length ? catUnitRows[0][1] : 1;
  const maxCatRev = catRevRows.length ? catRevRows[0][1] : 1;

  const prodUnits = {}, prodRevenue = {};
  valid.forEach(o=>o.items.forEach(it=>{ prodUnits[it.name]=(prodUnits[it.name]||0)+it.qty; prodRevenue[it.name]=(prodRevenue[it.name]||0)+it.price*it.qty; }));
  const topByUnits = Object.entries(prodUnits).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topByRevenue = Object.entries(prodRevenue).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const soldNames = new Set(Object.keys(prodUnits));
  const noSales = state.products.filter(p=>!soldNames.has(p.name));

  const weekdayTotals = [0,0,0,0,0,0,0]; const weekdayCounts=[0,0,0,0,0,0,0];
  valid.forEach(o=>{ const d=new Date(o.date).getDay(); weekdayTotals[d]+=o.total; weekdayCounts[d]+=1; });
  const weekdayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const weekdayAvg = weekdayTotals.map((t,i)=> weekdayCounts[i] ? t/weekdayCounts[i] : 0);
  const bestDayIdx = weekdayAvg.indexOf(Math.max(...weekdayAvg));

  const inventoryValue = state.products.reduce((s,p)=>s+p.price*p.stock,0);
  const invByCat = {};
  state.products.forEach(p=>{ invByCat[p.cat]=(invByCat[p.cat]||0)+p.price*p.stock; });
  const invRows = Object.entries(invByCat).sort((a,b)=>b[1]-a[1]);
  const maxInv = invRows.length ? invRows[0][1] : 1;

  const statusCounts = {}; STATUS_FLOW.forEach(s=>statusCounts[s]=0);
  state.orders.forEach(o=>statusCounts[o.status]=(statusCounts[o.status]||0)+1);

  return {totalRevenue,avgOrder,avgItems,pending,lowStock,cancelRate,uniqueCustomers,repeatCustomers,repeatRate,topCustomers,
    dayRevenue,monthRevenue,revDelta,catUnitRows,catRevRows,maxCatUnit,maxCatRev,topByUnits,topByRevenue,noSales,
    weekdayNames,weekdayAvg,bestDayIdx,inventoryValue,invRows,maxInv,statusCounts,totalOrders:state.orders.length};
}
function computeVisitMetrics(){
  const totalVisits = state.visits.length;
  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const visitsByDay = days.map(d=>{ const next=new Date(d); next.setDate(d.getDate()+1);
    const count = state.visits.filter(v=>{const vd=new Date(v.date); return vd>=d && vd<next;}).length;
    return {label: d.toLocaleDateString('es-MX',{weekday:'short'}), value: count}; });
  const hourCounts = new Array(24).fill(0);
  state.visits.forEach(v=>{ const h = new Date(v.date).getHours(); hourCounts[h]++; });
  const visitsByHour = hourCounts.map((c,h)=>({label: h+'h', value:c}));
  const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
  const last24h = state.visits.filter(v=>(Date.now()-new Date(v.date).getTime())<86400000).length;
  return {totalVisits, visitsByDay, visitsByHour, peakHour, last24h};
}

/* ============== ESTADÍSTICAS: cálculos nuevos ==============
   Se apoyan en computeMetrics()/computeVisitMetrics() (ya existentes) más los eventos
   de embudo (state.analyticsEvents) y el campo "source" de las visitas, ambos agregados
   junto con esta función. Todo lo que dependa de esos dos campos empieza a llenarse a
   partir de esta actualización — antes no existían, así que no hay datos históricos. */
function computeFunnel(){
  const events = state.analyticsEvents || [];
  const views = events.filter(e=>e.type==='product_view').length;
  const addToCart = events.filter(e=>e.type==='add_to_cart').length;
  const checkoutStarts = events.filter(e=>e.type==='checkout_start').length;
  const purchases = state.orders.filter(o=>o.source==='tienda' && o.status!=='Cancelado').length;
  const pct = (a,b)=> b>0 ? Math.round((a/b)*100) : 0;
  return {
    views, addToCart, checkoutStarts, purchases,
    cartConversion: pct(addToCart, views),
    salesConversion: pct(purchases, views),
    hasData: events.length>0,
  };
}
function computePaymentStats(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const totals = {};
  valid.forEach(o=>{
    if(o.source==='pos'){
      salePayments(o).forEach(p=>{
        const key = p.method || 'Efectivo';
        totals[key] = totals[key] || {amount:0,count:0};
        totals[key].amount += p.amount||0; totals[key].count += 1;
      });
    } else {
      totals['Contra entrega'] = totals['Contra entrega'] || {amount:0,count:0};
      totals['Contra entrega'].amount += o.total||0; totals['Contra entrega'].count += 1;
    }
  });
  const rows = Object.entries(totals).map(([method,v])=>({method, amount:v.amount, count:v.count})).sort((a,b)=>b.amount-a.amount);
  const totalAmount = rows.reduce((s,r)=>s+r.amount,0);
  const colors = {Efectivo:'var(--green)', Tarjeta:'var(--teal)', Transferencia:'var(--amber)', 'Contra entrega':'var(--primary)'};
  const segments = rows.map(r=>({label:r.method, value:r.amount, pct: totalAmount? (r.amount/totalAmount*100):0, color: colors[r.method] || 'var(--rose)'}));
  return {rows, totalAmount, segments};
}
function computeProductAnalytics(){
  const valid = state.orders.filter(o=>o.status!=='Cancelado');
  const unitsById = {}, revenueById = {};
  valid.forEach(o=>o.items.forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    unitsById[it.id] = (unitsById[it.id]||0) + it.qty;
    revenueById[it.id] = (revenueById[it.id]||0) + it.price*it.qty;
  }));
  const viewsById = {};
  (state.analyticsEvents||[]).forEach(e=>{ if(e.type==='product_view' && e.productId) viewsById[e.productId]=(viewsById[e.productId]||0)+1; });
  const withName = (id)=>{ const p = state.products.find(x=>x.id===id); return p ? p.name : '(producto eliminado)'; };
  const soldIds = Object.keys(unitsById);
  const byUnits = soldIds.map(id=>({id,name:withName(id),value:unitsById[id]}));
  const byRevenue = soldIds.map(id=>({id,name:withName(id),value:revenueById[id]}));
  const mostViewed = Object.entries(viewsById).map(([id,v])=>({id,name:withName(id),value:v})).sort((a,b)=>b.value-a.value).slice(0,6);
  const withMargin = state.products.filter(p=>p.cost>0 && p.price>0).map(p=>({
    id:p.id, name:p.name, marginPct: Math.round(((p.price-p.cost)/p.price)*100), profitPerUnit: p.price-p.cost
  }));
  const soldIdSet = new Set(soldIds);
  return {
    topByUnits: [...byUnits].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByUnits: [...byUnits].sort((a,b)=>a.value-b.value).slice(0,6),
    topByRevenue: [...byRevenue].sort((a,b)=>b.value-a.value).slice(0,6),
    leastByRevenue: [...byRevenue].sort((a,b)=>a.value-b.value).slice(0,6),
    mostViewed,
    topMargin: [...withMargin].sort((a,b)=>b.marginPct-a.marginPct).slice(0,6),
    lowMargin: [...withMargin].sort((a,b)=>a.marginPct-b.marginPct).slice(0,6),
    noSales: state.products.filter(p=>!soldIdSet.has(p.id)),
    hasMarginData: withMargin.length>0,
    hasViewData: Object.keys(viewsById).length>0,
  };
}
function computeTrafficSources(){
  const labels = {directo:'Directo', google:'Google', meta:'Meta (FB/IG)', whatsapp:'WhatsApp', tiktok:'TikTok', otro:'Otro'};
  const counts = {};
  (state.visits||[]).forEach(v=>{ const key = v.source || 'sin-dato'; counts[key] = (counts[key]||0)+1; });
  const sinDato = counts['sin-dato']||0; delete counts['sin-dato'];
  const rows = Object.entries(counts).map(([k,v])=>({label: labels[k]||k, value:v})).sort((a,b)=>b.value-a.value);
  return {rows, sinDato, total: state.visits.length};
}
function computeRealtime(){
  const visits = state.recentVisitsLive || state.visits || [];
  const events = state.recentEventsLive || state.analyticsEvents || [];
  const now = Date.now(); const windowMs = 5*60*1000;
  const recentVisits = visits.filter(v=>now-new Date(v.date).getTime()<windowMs);
  const recentEvents = events.filter(e=>now-new Date(e.date).getTime()<windowMs);
  const activityLabel = {product_view:'Vio un producto', add_to_cart:'Agregó al carrito', checkout_start:'Inició su compra', purchase:'Completó una compra'};
  const feed = [...recentEvents].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15).map(e=>{
    const p = e.productId ? state.products.find(x=>x.id===e.productId) : null;
    return { label: activityLabel[e.type]||e.type, detail: p ? p.name : (e.orderTotal?money(e.orderTotal):''), date: e.date };
  });
  return { recentVisitsCount: recentVisits.length, feed };
}
// Refresco automático de "Tiempo real": trae solo lo reciente cada 20s mientras esa
// sub-pestaña esté abierta, y se detiene al salir para no dejar temporizadores vivos.
let realtimeTimer = null;
function ensureRealtimeTimer(active){
  if(active && !realtimeTimer){
    realtimeTimer = setInterval(async ()=>{
      try{
        const [visitsSnap, eventsSnap] = await Promise.all([
          db.collection('visits').orderBy('date','desc').limit(200).get(),
          db.collection('analyticsEvents').orderBy('date','desc').limit(200).get(),
        ]);
        state.recentVisitsLive = visitsSnap.docs.map(d=>d.data());
        state.recentEventsLive = eventsSnap.docs.map(d=>d.data());
        if(state.adminTab==='estadísticas' && state.statsSubview==='tiemporeal') render();
      }catch(e){ /* silencioso */ }
    }, 20000);
  } else if(!active && realtimeTimer){
    clearInterval(realtimeTimer); realtimeTimer = null;
  }
}

function renderDonutChart(segments){
  const withValue = segments.filter(s=>s.value>0);
  if(!withValue.length) return `<div class="empty-state">Aún no hay datos suficientes.</div>`;
  let acc = 0;
  const stops = withValue.map(s=>{ const start=acc; acc+=s.pct; return `${s.color} ${start}% ${acc}%`; }).join(', ');
  return `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;"></div>
      <div style="flex:1;min-width:160px;">
        ${withValue.map(s=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;">

            <strong>${Math.round(s.pct)}%</strong>

    </div>`;
}

function productHasTag(p, kind, value){
  if(kind==='cat') return (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).includes(value);
  return (p.needs||[]).includes(value);
}
async function addProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      const categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[]));
      if(categories.includes(value)){ showToast('Ya estaba en esa categoría'); return; }
      categories.push(value);
      p.categories = categories;
      await db.collection('products').doc(productId).update({categories});
    }else{
      const needs = p.needs||[];
      if(needs.includes(value)){ showToast('Ya tenía esa etiqueta'); return; }
      needs.push(value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto agregado'); render();
  }catch(e){ console.error(e); showToast('No se pudo agregar'); }
}
async function removeProductTag(productId, kind, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  try{
    if(kind==='cat'){
      let categories = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[])).filter(c=>c!==value);
      if(categories.length===0){
        const fallback = state.settings.categories.find(c=>c!==value) || value;
        categories = [fallback];
      }
      p.categories = categories;
      if(p.cat===value) p.cat = categories[0];
      await db.collection('products').doc(productId).update({categories, cat:p.cat});
    }else{
      const needs = (p.needs||[]).filter(n=>n!==value);
      p.needs = needs;
      await db.collection('products').doc(productId).update({needs});
    }
    showToast('Producto quitado de este filtro'); render();
  }catch(e){ console.error(e); showToast('No se pudo quitar'); }
}

function slugifyNeedKey(label){
  const base = (label||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return base || uid('need-');
}
async function addNeed(){
  const label = (state.newNeedInput||'').trim();
  if(!label){ showToast('Ponle un nombre a la etiqueta'); return; }
  if(!state.settings.needs) state.settings.needs = [];
  let key = slugifyNeedKey(label);
  const existingKeys = new Set(state.settings.needs.map(n=>n.key));
  if(existingKeys.has(key)) key = key + '-' + uid('').slice(-4);
  state.settings.needs.push({key, label});
  state.newNeedInput = '';
  await saveSettings(); showToast('Etiqueta agregada'); render();
}
async function moveNeed(idx,dir){
  const arr = state.settings.needs;
  const j = idx+dir; if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  await saveSettings(); render();
}
async function renameNeed(key, newLabel){
  const n = (state.settings.needs||[]).find(x=>x.key===key); if(!n) return;
  const val = newLabel.trim();
  if(!val){ render(); return; }
  n.label = val;
  await saveSettings(); showToast('Etiqueta actualizada'); render();
}
async function removeNeed(key){
  const count = state.products.filter(p=>(p.needs||[]).includes(key)).length;
  if(count>0 && !confirm(`${count} producto(s) tienen esta etiqueta asignada. Si continúas, se la vamos a quitar de esos productos. ¿Continuar?`)) return;
  try{
    if(count>0){
      const affected = state.products.filter(p=>(p.needs||[]).includes(key));
      for(let i=0;i<affected.length;i+=400){
        const chunk = affected.slice(i,i+400);
        const batch = db.batch();
        chunk.forEach(p=>{
          p.needs = (p.needs||[]).filter(k=>k!==key);
          batch.update(db.collection('products').doc(p.id), {needs:p.needs});
        });
        await batch.commit();
      }
    }
    state.settings.needs = (state.settings.needs||[]).filter(n=>n.key!==key);
    if(state.productNeedFilter===key) state.productNeedFilter='Todas';
    await saveSettings(); showToast('Etiqueta eliminada'); render();
  }catch(e){ console.error(e); showToast('No se pudo eliminar la etiqueta'); }
}

function escDescHtml(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normName(s){
  return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function htmlDescToPlainText(html){
  if(!html) return '';
  const container = document.createElement('div');
  container.innerHTML = html;
  container.querySelectorAll('li').forEach(li=>{
    li.insertBefore(document.createTextNode('• '), li.firstChild);
    li.appendChild(document.createTextNode('\n'));
  });
  container.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  container.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,ul,ol,tr').forEach(el=>{
    el.appendChild(document.createTextNode('\n'));
  });
  let text = container.textContent || '';
  text = text.replace(/ /g,' ');
  text = text.replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n');
  text = text.replace(/\n{3,}/g,'\n\n').trim();
  return text;
}
function parseTiendanubeDescCSV(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idxName = header.indexOf('nombre');
  const idxDesc = header.findIndex(h=>h.includes('descripc'));
  if(idxName<0 || idxDesc<0) return null;
  const out = [];
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    const name = (row[idxName]||'').trim();
    if(!name) continue; // fila de variante (Tiendanube repite fila por cada variante, solo la primera trae nombre/descripción)
    out.push({name, descHtml:(row[idxDesc]||'').trim()});
  }
  return out;
}
function buildDescImportPreview(csvRows){
  const byNorm = {};
  state.products.forEach(p=>{ const key = normName(p.name); (byNorm[key]=byNorm[key]||[]).push(p); });
  const matched = [], unmatched = [], ambiguous = [];
  let noChange = 0;
  csvRows.forEach(row=>{
    if(!row.descHtml) return;
    const key = normName(row.name);
    const candidates = byNorm[key];
    if(!candidates || candidates.length===0){ unmatched.push(row.name); return; }
    if(candidates.length>1){ ambiguous.push(row.name); return; }
    const p = candidates[0];
    const newDesc = htmlDescToPlainText(row.descHtml);
    const oldDesc = (p.desc||'').trim();
    if(!newDesc || newDesc===oldDesc){ noChange++; return; }
    matched.push({ productId:p.id, productName:p.name, oldDesc, newDesc, checked: !oldDesc || looksTruncatedDesc(oldDesc) });
  });
  return {matched, unmatched, ambiguous, noChange};
}
function handleDescImportFile(input){
  const file = input.files[0]; if(!file) return;
  const fileName = file.name;
  const reader = new FileReader();
  reader.onload = e=>{
    const csvRows = parseTiendanubeDescCSV(e.target.result);
    if(csvRows===null){ showToast('No se encontraron columnas "Nombre" y "Descripción" en ese archivo'); return; }
    state.descImport = {fileName, ...buildDescImportPreview(csvRows)};
    render();
  };
  reader.readAsText(file);
}

/* ============== IMPORTAR VARIANTES DESDE TIENDANUBE ============== */
// El CSV de Tiendanube trae una fila por variante (mismo "Identificador de URL" repetido);
// solo la primera fila de cada producto trae "Nombre". Las columnas de propiedad (Talla, Color, etc.)
// y las de stock por ubicación ("Stock (...)") varían de nombre, así que se detectan por encabezado.
function parseTiendanubeVariantGroups(text){
  const rows = parseCSV(text);
  if(!rows.length) return null;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idxSlug = header.indexOf('identificador de url');
  const idxName = header.indexOf('nombre');
  const idxPrecio = header.indexOf('precio');
  const idxPromo = header.findIndex(h=>h.includes('precio promocional'));
  const propPairs = [1,2,3].map(n=>({
    nameIdx: header.indexOf(`nombre de propiedad ${n}`),
    valueIdx: header.indexOf(`valor de propiedad ${n}`)
  })).filter(p=>p.nameIdx>=0 && p.valueIdx>=0);
  const stockIdxs = header.map((h,i)=>h.startsWith('stock (')?i:-1).filter(i=>i>=0);
  if(idxSlug<0 || idxName<0 || !propPairs.length) return null;
  const bySlug = {};
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    const slug = (row[idxSlug]||'').trim();
    if(!slug) continue;
    if(!bySlug[slug]) bySlug[slug] = {name:'', rows:[]};
    const name = (row[idxName]||'').trim();
    if(name) bySlug[slug].name = name;
    bySlug[slug].rows.push(row);
  }
  const out = [];
  Object.values(bySlug).forEach(g=>{
    if(!g.name) return;
    const rowCombos = g.rows.map(row=>{
      const combo = {};
      propPairs.forEach(p=>{
        const pname = (row[p.nameIdx]||'').trim();
        const pval = (row[p.valueIdx]||'').trim();
        if(pname && pval) combo[pname] = pval;
      });
      const precio = Number((row[idxPrecio]||'').replace(/[^0-9.]/g,''))||0;
      const promo = idxPromo>=0 ? (Number((row[idxPromo]||'').replace(/[^0-9.]/g,''))||0) : 0;
      const stock = stockIdxs.reduce((s,idx)=>{ const raw=(row[idx]||'').trim(); const n=Number(raw); return s + (raw && !isNaN(n) ? n : 0); }, 0);
      return { combo, price: promo>0?promo:precio, stock };
    }).filter(v=>Object.keys(v.combo).length>0);
    if(!rowCombos.length) return;
    const groupNames = Array.from(new Set(rowCombos.flatMap(v=>Object.keys(v.combo))));
    const groups = groupNames.map(gn=>{
      const values = [];
      rowCombos.forEach(v=>{ if(v.combo[gn] && !values.includes(v.combo[gn])) values.push(v.combo[gn]); });
      return {name:gn, values};
    });
    out.push({name:g.name, groups, variants:rowCombos});
  });
  return out;
}
function buildVariantImportPreview(csvGroups){
  const byNorm = {};
  state.products.forEach(p=>{ const key = normName(p.name); (byNorm[key]=byNorm[key]||[]).push(p); });
  const matched = [], unmatched = [], ambiguous = [];
  csvGroups.forEach(g=>{
    const key = normName(g.name);
    const candidates = byNorm[key];
    if(!candidates || candidates.length===0){ unmatched.push(g.name); return; }
    if(candidates.length>1){ ambiguous.push(g.name); return; }
    const p = candidates[0];
    const variants = g.variants.map(v=>({ id: uid('var_'), combo:v.combo, sku:'', priceOverride:v.price, stock:v.stock }));
    const totalStockSum = variants.reduce((s,v)=>s+(v.stock||0),0);
    matched.push({
      productId:p.id, productName:p.name, groups:g.groups, variants, totalStockSum,
      alreadyHasVariants: !!(p.variants && p.variants.length),
      checked: !(p.variants && p.variants.length)
    });
  });
  return {matched, unmatched, ambiguous};
}
function handleVariantImportFile(input){
  const file = input.files[0]; if(!file) return;
  const fileName = file.name;
  const reader = new FileReader();
  reader.onload = e=>{
    const csvGroups = parseTiendanubeVariantGroups(e.target.result);
    if(csvGroups===null){ showToast('No se encontraron las columnas de propiedades (Talla, Color, etc.) en ese archivo'); return; }
    state.variantImport = {fileName, ...buildVariantImportPreview(csvGroups)};
    render();
  };
  reader.readAsText(file);
}

/* ============== IMPORTAR CATEGORÍAS DESDE TIENDANUBE ============== */
// El CSV de Tiendanube trae la columna "Categorías" (varias separadas por coma) repetida en
// todas las filas de un mismo producto (identificado por "Identificador de URL"); solo hace
// falta leerla de cualquiera de esas filas.
function parseTiendanubeCategorias(text){
  const rows = parseCSV(text);
  if(!rows.length) return null;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idxSlug = header.indexOf('identificador de url');
  const idxName = header.indexOf('nombre');
  const idxCat = header.findIndex(h=>h.includes('categor'));
  if(idxName<0 || idxCat<0) return null;
  const bySlug = {};
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    const slug = idxSlug>=0 ? (row[idxSlug]||'').trim() : String(i);
    if(!bySlug[slug]) bySlug[slug] = {name:'', cats:''};
    const name = (row[idxName]||'').trim();
    if(name) bySlug[slug].name = name;
    const catVal = (row[idxCat]||'').trim();
    if(catVal) bySlug[slug].cats = catVal;
  }
  const out = [];
  Object.values(bySlug).forEach(g=>{
    if(!g.name || !g.cats) return;
    const categories = g.cats.split(',').map(c=>c.trim()).filter(Boolean);
    if(categories.length) out.push({name:g.name, categories});
  });
  return out;
}
function buildCategoryImportPreview(csvRows){
  const byNorm = {};
  state.products.forEach(p=>{ const key = normName(p.name); (byNorm[key]=byNorm[key]||[]).push(p); });
  const matched = [], unmatched = [], ambiguous = [];
  const newCategoryNames = new Set();
  csvRows.forEach(row=>{
    const key = normName(row.name);
    const candidates = byNorm[key];
    if(!candidates || candidates.length===0){ unmatched.push(row.name); return; }
    if(candidates.length>1){ ambiguous.push(row.name); return; }
    const p = candidates[0];
    const current = (p.categories&&p.categories.length?p.categories:(p.cat?[p.cat]:[]));
    const same = current.length===row.categories.length && current.every(c=>row.categories.includes(c));
    if(same) return;
    row.categories.forEach(c=>{ if(!state.settings.categories.includes(c)) newCategoryNames.add(c); });
    matched.push({ productId:p.id, productName:p.name, currentCategories:current, newCategories:row.categories, checked:true });
  });
  return {matched, unmatched, ambiguous, newCategoryNames:Array.from(newCategoryNames)};
}
function handleCategoryImportFile(input){
  const file = input.files[0]; if(!file) return;
  const fileName = file.name;
  const reader = new FileReader();
  reader.onload = e=>{
    const csvRows = parseTiendanubeCategorias(e.target.result);
    if(csvRows===null){ showToast('No se encontraron las columnas "Nombre" y "Categorías" en ese archivo'); return; }
    state.catImport = {fileName, ...buildCategoryImportPreview(csvRows)};
    render();
  };
  reader.readAsText(file);
}
