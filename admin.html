<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración — La Casa de los Placeres</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>
  // Se aplica antes de pintar nada, para que no haya un parpadeo de claro→oscuro al cargar.
  try{ if(localStorage.getItem('adminTheme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<style>
  :root{
    --bg:#FBF5F2; --surface:#FFFFFF; --surface-soft:#F6E9E6; --ink:#2B1620; --ink-soft:#6E5560;
    --primary:#993477; --primary-deep:#5C1F49; --rose:#BC355C; --coral:#ED7578; --amber:#F6A030;
    --green:#7AB71A; --teal:#20B7CA; --navy:#0A4A5B; --border:#EBD9D3;
    --danger-bg:#FBE2E6; --danger-ink:#A02040;
    --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-pill:999px;
    --shadow-sm:0 2px 8px -4px rgba(43,22,32,0.14);
    --shadow-md:0 12px 28px -12px rgba(43,22,32,0.20);
    --shadow-lg:0 24px 48px -20px rgba(43,22,32,0.28);
  }
  /* Tema oscuro: mismas variables, otros valores — todo lo demás en el CSS ya las usa con
     var(--xxx), así que no hace falta tocar ninguna otra regla para que el oscuro se aplique
     en todos lados. Independiente de "Diseño → Colores y tipografía" (eso solo afecta el
     aspecto de la tienda pública en index.html, nunca este panel). */
  :root[data-theme="dark"]{
    --bg:#17111A; --surface:#221A26; --surface-soft:#2C2230; --ink:#F2E8F0; --ink-soft:#B7A2B4;
    --primary:#B8478E; --primary-deep:#F3B4DE; --rose:#E36E8E; --coral:#F0968F; --amber:#F6B85B;
    --green:#93CC49; --teal:#4FD2E2; --navy:#0D2E38; --border:#3B2E3A;
    --danger-bg:#3D2229; --danger-ink:#F3A0B4;
    --shadow-sm:0 2px 8px -4px rgba(0,0,0,0.45);
    --shadow-md:0 12px 28px -12px rgba(0,0,0,0.55);
    --shadow-lg:0 24px 48px -20px rgba(0,0,0,0.65);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;} select,input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1100px;margin:0 auto;min-height:100vh;background:var(--surface);}
  .admin-top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 4px 16px -10px rgba(0,0,0,0.45);position:relative;z-index:25;}
  .admin-top .brand-name{font-size:16px;font-weight:700;font-family:'League Spartan',sans-serif;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;}
  .admin-top .brand-sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .admin-top-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:100%;}
  .logout-link{font-size:12px;background:rgba(255,255,255,0.14);padding:8px 13px;border-radius:var(--radius-pill);color:#fff;font-weight:600;white-space:nowrap;transition:background .15s ease;}
  .logout-link:hover{background:rgba(255,255,255,0.22);}
  @media(max-width:400px){
    .admin-top{padding:12px 16px;}
    .admin-top .brand-name{font-size:14.5px;max-width:50vw;}
    .admin-top .brand-sub{display:none;}
    .logout-link{font-size:11px;padding:7px 11px;}
  }
  .admin-tabs{display:flex;gap:4px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:20;}
  .admin-tabs::-webkit-scrollbar{display:none;}
  .admin-tab{padding:9px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap;transition:all .15s ease;}
  .stats-subtabs-wrap{padding:12px 16px 4px;background:var(--surface);border-bottom:1px solid var(--border);}
  .stats-tab-group{margin-bottom:10px;}
  .stats-tab-group-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;}
  .stats-tab-group-row{display:flex;flex-wrap:wrap;gap:4px;}
  .stats-tab-group-row .admin-tab{background:var(--surface-soft);}
  .admin-tab.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(153,52,119,0.5);}
  .tab-badge{display:inline-block;background:#BC355C;color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;margin-left:5px;vertical-align:2px;}
  .admin-tabs-sep{width:1px;flex-shrink:0;background:var(--border);margin:6px 4px;}

  /* Navegación agrupada del admin en celular: reemplaza la franja de 15 pestañas por un
     selector compacto con el nombre de la sección actual, que despliega las pestañas
     agrupadas por tema (Ventas, Catálogo, Personas, Analítica, Sistema). Mismas pestañas,
     mismas funciones — solo cambia la forma de llegar a ellas. */
  .admin-nav-mobile{display:none;}
  @media(max-width:760px){
    .admin-tabs-main{display:none;}
    .admin-nav-mobile{display:block;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);}
    .admin-nav-mobile-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:14.5px;font-weight:800;color:var(--primary-deep);background:var(--surface);font-family:'League Spartan',sans-serif;}
    .admin-nav-mobile-sheet{max-height:65vh;overflow-y:auto;padding:4px 14px 16px;border-top:1px solid var(--border);background:var(--bg);}
    .admin-nav-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:14px 2px 7px;}
    .admin-nav-group-row{display:flex;flex-wrap:wrap;gap:7px;}
    .admin-nav-mobile .admin-tab{background:var(--surface);border:1.5px solid var(--border);min-height:38px;}
    .admin-nav-mobile .admin-tab.active{border-color:var(--primary);background:var(--surface);color:var(--primary-deep);}
  }
  .admin-body{padding:20px 20px 60px;}

  /* ===== BARRA LATERAL EN ESCRITORIO =====
     Mismo menú, mismas funciones (goTab, handleLogout, toggleTheme, openGlobalSearch) que la
     barra superior + el menú compacto de celular — solo cambia cómo se llega a ellas en
     pantallas grandes. Por debajo de 761px se sigue usando exactamente el menú compacto de
     siempre (.admin-nav-mobile), sin tocarlo. */
  .app-shell{display:block;}
  .admin-sidebar{display:none;}
  .admin-main{min-width:0;}
  @media(min-width:761px){
    .app-shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto;}
    .admin-sidebar{display:flex;flex-direction:column;width:240px;flex-shrink:0;background:var(--navy);min-height:100vh;position:sticky;top:0;padding:20px 12px;}
    .admin-main{flex:1;min-width:0;}
    .app{max-width:none;}
    .admin-top{display:none;}
    .admin-tabs-main{display:none;}
  }
  .sidebar-brand{padding:8px 10px 18px;border-bottom:1px solid rgba(255,255,255,0.14);margin-bottom:14px;}
  .sidebar-brand .brand-name{font-size:16px;font-weight:700;font-family:'League Spartan',sans-serif;color:#fff;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-brand .brand-sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .sidebar-nav{flex:1;overflow-y:auto;}
  .sidebar-group-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,0.4);margin:16px 10px 6px;}
  .sidebar-group-label:first-child{margin-top:0;}
  .sidebar-link{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.82);text-align:left;background:transparent;transition:background .15s ease,color .15s ease;margin-bottom:2px;}
  .sidebar-link svg{flex-shrink:0;opacity:0.85;}
  .sidebar-link:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .sidebar-link.active{background:var(--primary);color:#fff;font-weight:700;}
  .sidebar-link.active svg{opacity:1;}
  .sidebar-link .tab-badge{margin-left:auto;}
  .sidebar-footer{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.14);display:flex;flex-direction:column;gap:2px;}
  .sidebar-footer button,.sidebar-footer a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.7);text-align:left;background:none;transition:background .15s ease,color .15s ease;}
  .sidebar-footer button:hover,.sidebar-footer a:hover{background:rgba(255,255,255,0.08);color:#fff;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
  @media(min-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:960px){.stat-grid{grid-template-columns:repeat(6,1fr);}}
  .stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;transition:box-shadow .15s ease,transform .15s ease;}
  .stat-card.primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep));border-color:transparent;}
  .stat-card.primary .stat-label{color:rgba(255,255,255,0.78);}
  .stat-card.primary .stat-value{color:#fff;font-size:26px;}
  @media(max-width:699px){.stat-card.primary{grid-column:span 2;}}
  .stat-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;line-height:1.3;font-weight:600;}
  .stat-value{font-size:22px;font-weight:800;font-family:'League Spartan',sans-serif;color:var(--primary-deep);}
  .stat-delta{font-size:11px;margin-top:4px;font-weight:700;}
  .stat-delta.up{color:var(--green);}
  .stat-delta.down{color:var(--rose);}

  .panel{border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-bottom:20px;background:var(--surface);box-shadow:var(--shadow-sm);}
  .panel-title{font-size:14.5px;font-weight:700;color:var(--primary-deep);margin-bottom:14px;font-family:'League Spartan',sans-serif;}
  .panel-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:14px;}

  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;overflow-x:auto;}
  .bar-col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-val{font-size:10px;color:var(--ink-soft);margin-bottom:4px;font-weight:700;white-space:nowrap;}
  .bar-fill{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--primary);min-height:3px;transition:height .3s ease;}
  .bar-label{font-size:9.5px;color:var(--ink-soft);margin-top:6px;text-align:center;line-height:1.2;}

  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .hbar-label{width:110px;flex-shrink:0;font-size:12px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{flex:1;height:16px;background:var(--surface-soft);border-radius:8px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:8px;}
  .hbar-val{width:60px;text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:700;flex-shrink:0;}

  .list-row{display:flex;flex-wrap:wrap;row-gap:10px;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;background:var(--surface);transition:box-shadow .15s ease;}
  .list-row:hover{box-shadow:var(--shadow-sm);}
  .row-swatch{width:44px;height:44px;border-radius:9px;flex-shrink:0;object-fit:cover;}
  /* REGLA BASE PARA TODAS LAS FILAS (no opcional): `.row-main` arranca con un ancho real de
     170px antes de poder encogerse, y la fila puede bajar a otro renglón lo que no quepa.
     Con `flex:1` a secas (flex-basis 0%) el navegador no contaba el nombre al decidir qué
     cabía, metía los botones de la derecha en la misma línea y dejaba el nombre en una franja
     de ~30px: una letra por renglón. Antes esto se arregló con una clase opcional (.row-wrap)
     que solo se puso en 4 pantallas y el problema siguió en las demás (Productos, Clientes,
     Mensajes, papelera...). Ahora es el comportamiento de todas las filas. */
  .row-main{flex:1 1 170px;min-width:0;}
  /* Antes, un nombre largo (producto o cliente) no tenía dónde partirse y el navegador lo
     desbordaba visualmente encima del badge o botón de al lado, en vez de ajustarse dentro de
     su propio espacio — se repetía en las 72 pantallas que usan .list-row. Mismo arreglo que
     ya se le dio a .card-name en la tienda. */
  .row-title{font-size:13.5px;font-weight:700;overflow-wrap:anywhere;word-break:break-word;}
  .row-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto;}
  /* (.row-wrap ya no hace falta: su comportamiento es ahora la regla base de arriba) */
  /* Antes la fila de un producto podía llegar a 7 botones de ícono sin bajar de línea (quitar de
     categoría, quitar de etiqueta, duplicar, compartir, copiar enlace, editar, eliminar) — en
     320-375px eso ya pesa más que la pantalla completa, antes de darle una sola columna al
     nombre. Ahora solo Editar/Eliminar quedan a la vista; el resto vive en un menú "⋮", igual al
     patrón que ya usa el POS en su barra superior. */
  .row-more-wrap{position:relative;flex-shrink:0;}
  .row-more-menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:25;min-width:200px;padding:6px;}
  .row-more-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px;min-height:40px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);}
  .row-more-menu button:hover{background:var(--surface-soft);}
  .row-more-menu button.danger{color:var(--danger-ink);}
  .row-more-menu hr{border:none;border-top:1px solid var(--border);margin:5px 0;}
  .row-more-overlay{position:fixed;inset:0;z-index:24;}
  /* 38px -> 44px: mismo tamaño táctil mínimo que ya usan la tienda y el POS, para que las
     3 interfaces se sientan consistentes al tocarlas. */
  .icon-btn{width:44px;height:44px;border-radius:9px;background:var(--surface-soft);color:var(--primary-deep);font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;}
  .icon-btn:hover{background:#efd9d3;}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn.danger{background:var(--danger-bg);color:var(--danger-ink);}
  .icon-btn.danger:hover{filter:brightness(0.94);}
  .status-badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);color:#fff;flex-shrink:0;display:inline-flex;align-items:center;gap:4px;}
  .status-badge svg{flex-shrink:0;}
  .status-badge.status-out{background:var(--navy);}
  .status-badge.status-critical{background:#BC355C;color:#fff;}
  .status-badge.status-low{background:var(--amber);color:#2B1620;}
  .status-badge.status-ok{background:var(--green);color:#2B1620;}
  .rank-num{width:22px;height:22px;border-radius:50%;background:var(--surface-soft);color:var(--primary-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .btn-add-new{background:var(--primary);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(153,52,119,0.55);transition:transform .12s ease,opacity .12s ease;}
  .btn-add-new:active{transform:scale(0.97);}
  .btn-add-new:disabled{opacity:.45;box-shadow:none;}
  .btn-outline{background:var(--surface);border:1.5px solid var(--primary);color:var(--primary);padding:10px 17px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;transition:background .15s ease,opacity .15s ease;}
  .btn-outline:hover{background:var(--surface-soft);}
  .btn-outline:disabled{opacity:.45;}
  .btn-success{background:var(--green);color:#2B1620;padding:12px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(122,183,26,0.45);transition:transform .12s ease,opacity .12s ease;}
  .btn-success:active{transform:scale(0.98);}
  .btn-success:disabled{opacity:.45;box-shadow:none;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input,.form-field textarea,.form-field select{width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--ink);transition:border-color .15s ease;}
  .form-field input[type="color"]{width:100%;height:44px;padding:4px;cursor:pointer;}
  .form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--primary);outline:none;}
  .form-field textarea{resize:vertical;min-height:60px;}
  .field-input{width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--ink);margin-bottom:8px;transition:border-color .15s ease;}
  .field-input:focus{border-color:var(--primary);outline:none;}
  /* Un input/select dentro de una fila flex no se encoge por debajo de su ancho natural a menos
     que tenga min-width:0 — eso empujaba botones como "+ Fijar" o "+ Agregar" fuera de la pantalla. */
  input,select,textarea{min-width:0;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:480px){.two-col{grid-template-columns:1fr;}}
  .note-box{background:var(--surface-soft);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#5C1F49);color:#fff;padding:12px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;box-shadow:0 8px 18px -10px rgba(153,52,119,0.5);transition:transform .12s ease,opacity .12s ease;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:.45;box-shadow:none;}

  /* Sistema de botones por nivel: primario (arriba), secundario, terciario, destructivo */
  .btn-tertiary{background:transparent;color:var(--ink-soft);padding:9px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;border:1.5px dashed var(--border);display:inline-flex;align-items:center;gap:6px;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .btn-tertiary:disabled{opacity:.45;}
  .btn-ver-mas{display:block;width:100%;text-align:center;background:var(--surface-soft);color:var(--primary);padding:11px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;margin-top:8px;border:1.5px solid var(--border);}
  .btn-ver-mas:hover{background:var(--surface);border-color:var(--primary);}
  .btn-tertiary:hover{background:var(--surface-soft);border-color:var(--primary);color:var(--primary-deep);}
  .btn-tertiary svg{flex-shrink:0;}
  .btn-danger{background:var(--danger-bg);color:var(--danger-ink);padding:11px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;transition:filter .15s ease;}
  .btn-danger:hover{filter:brightness(0.94);}
  .btn-danger:disabled{opacity:.45;}
  .btn-danger-text{background:transparent;color:var(--danger-ink)!important;font-weight:700!important;padding:8px 6px;transition:opacity .15s ease;}
  .btn-danger-text:hover{opacity:.75;}
  .toolbar-tools-panel{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface-soft);border-radius:var(--radius-md);padding:12px;margin:-4px 0 12px;}
  .toolbar-tools-panel .btn-outline{background:var(--surface);}
  /* ---- Pantalla Productos ---- */
  .prod-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .prod-title{font-family:var(--font-heading);font-size:24px;font-weight:800;color:var(--primary-deep);line-height:1.1;}

  .btn-tools{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--border);color:var(--ink);padding:10px 15px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;}
  .btn-tools:hover{border-color:var(--primary);color:var(--primary);}
  .tools-menu{min-width:270px;left:auto;right:0;}

  .tools-menu-label{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px 4px;}
  .prod-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;margin-bottom:10px;}
  .prod-filters .prod-search{flex:1 1 260px;min-width:0;margin:0;}
  .prod-select{flex:0 1 210px;min-width:150px;margin:0;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);}
  .prod-select.is-set{border-color:var(--primary);color:var(--primary);background:var(--surface-soft);}
  .prod-clear{display:inline-flex;align-items:center;gap:5px;background:none;color:var(--ink-soft);font-size:13px;font-weight:700;padding:8px 6px;}
  .prod-clear:hover{color:var(--primary);}
  .prod-assign{margin-bottom:4px;}
  .prod-count{font-size:13px;font-weight:800;color:var(--primary-deep);margin:6px 2px 8px;}
  .prod-selectbar{display:flex;align-items:center;gap:10px;padding:6px 12px;margin-bottom:8px;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .prod-selectbar label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .seg-toggle{display:flex;gap:4px;background:var(--surface-soft);border-radius:var(--radius-sm);padding:4px;margin-bottom:10px;}
  .seg-toggle button{flex:1;padding:9px 10px;border-radius:calc(var(--radius-sm) - 2px);background:transparent;color:var(--ink-soft);font-size:13px;font-weight:700;}
  .seg-toggle button.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .dup-group{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 10px 4px;margin-bottom:12px;background:var(--surface-soft);}
  .dup-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .cost-history{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;}
  .cost-history-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--primary-deep);}
  .cost-entry-form{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;background:var(--surface);padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border);}
  .cost-entry-form input,.cost-entry-form select{padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .cost-entry-form > div{grid-column:1/-1;justify-content:flex-end;}
  .cost-history-list{max-height:200px;overflow-y:auto;}
  .cost-history-row{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .cost-history-row .ch-date{color:var(--ink-soft);white-space:nowrap;}
  .cost-history-row .ch-cost{font-weight:700;white-space:nowrap;}
  .cost-history-row .ch-cost em{font-style:normal;font-size:11px;font-weight:700;}
  .cost-history-row .ch-cost em.up{color:var(--danger-ink,#b42318);} .cost-history-row .ch-cost em.down{color:var(--green,#3d7a1a);}
  .cost-history-row .ch-sup{grid-column:1/-1;min-width:0;overflow-wrap:anywhere;color:var(--ink-soft);font-size:12px;} .cost-history-row small{color:var(--ink-soft);}
  .qstock{display:inline-flex;align-items:center;gap:4px;}
  .qstock button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--primary-deep);font-size:16px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .qstock button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
  .qstock button:disabled{opacity:.35;}
  .seg-chip{display:inline-flex;align-items:center;gap:6px;padding:10px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--ink-soft);font-size:13px;font-weight:700;white-space:nowrap;}
  .seg-chip.active{border-color:var(--primary);background:var(--surface-soft);color:var(--primary);}
  .cust-avatar{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .cust-avatar.auto{background:var(--surface-soft);color:var(--primary-deep);}
  .cust-auto{font-weight:600;font-size:10.5px;color:var(--ink-soft);background:var(--surface-soft);padding:2px 7px;border-radius:var(--radius-pill);margin-left:4px;vertical-align:middle;}
  .cust-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
  .cust-total{font-weight:800;color:var(--primary-deep);text-align:right;margin-right:6px;white-space:nowrap;}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:28px 0 12px;padding-top:18px;border-top:1px solid var(--border);}
  .sec-title{font-family:var(--font-heading);font-size:18px;font-weight:800;color:var(--primary-deep);}
  .sec-n{display:inline-block;margin-left:6px;padding:0 8px;border-radius:10px;background:var(--surface-soft);font-size:12px;line-height:20px;font-family:inherit;color:var(--primary);}
  /* Campos sueltos del panel (buscadores, selects fuera de .form-field) con el mismo look que los filtros */
  :where(.admin-body) :where(input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]):not([type=range]):not([type=button]),select,textarea){padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;font-family:inherit;color:var(--ink);}
  :where(.admin-body) :where(input,select,textarea):focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(153,52,119,.12);}
  .prod-link{background:none;color:var(--primary);font-weight:700;font-size:13px;padding:0;text-decoration:underline;}
  @media(max-width:600px){.prod-select{flex:1 1 45%;min-width:0;}.prod-head-actions{width:100%;}.prod-head-actions .btn-add-new{flex:1;}}
  /* Encabezado de sección dentro de formularios largos (ej. modal de producto), para que se
     lean como bloques con propósito (Información principal / Precios / Inventario / etc.)
     en vez de una sola lista continua de campos. */
  .form-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--primary);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
  .form-section-label:first-of-type{margin-top:4px;padding-top:0;border-top:none;}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,22,32,0.55);backdrop-filter:blur(1px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.modal-overlay{align-items:center;}}
  .modal{background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:22px 20px;box-shadow:0 -20px 50px -20px rgba(43,22,32,0.35);}
  @media(min-width:600px){.modal{border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);}}
  .modal h3{font-size:17.5px;color:var(--primary-deep);margin-bottom:14px;font-weight:700;font-family:'League Spartan',sans-serif;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;}
  .btn-cancel{background:var(--surface-soft);color:var(--ink-soft);transition:background .15s ease;}
  .btn-cancel:hover{background:#efd9d3;}
  .btn-cancel:disabled{opacity:.45;}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
    background:radial-gradient(1200px 600px at 15% -10%, rgba(237,117,120,0.35), transparent 60%),
               radial-gradient(900px 500px at 110% 110%, rgba(32,183,202,0.22), transparent 55%),
               linear-gradient(160deg,#5C1F49,#3a1332 72%);}
  .login-card{background:var(--surface);border-radius:var(--radius-lg);padding:32px 26px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
  .login-card h2{color:var(--primary-deep);font-size:20px;margin-bottom:6px;font-weight:700;}
  .login-card p{color:var(--ink-soft);font-size:12.5px;margin-bottom:18px;line-height:1.5;}
  .login-card input{width:100%;font-size:16px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:10px;transition:border-color .15s ease;background:var(--bg);}
  .login-card input:focus{border-color:var(--primary);outline:none;}
  .login-error{color:var(--rose);font-size:12px;margin-bottom:8px;min-height:14px;font-weight:600;}
  .order-detail{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-top:8px;font-size:12.5px;border:1px solid var(--border);}
  .order-detail div{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
  .status-filter{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;}
  .status-filter::-webkit-scrollbar{display:none;}

  /* ===== TABLA DE PEDIDOS ===== */
  .orders-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
  .orders-table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px;}
  .orders-table th{text-align:left;padding:12px 14px;background:var(--bg);color:var(--ink-soft);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;border-bottom:1px solid var(--border);}
  .orders-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap;}
  /* Inventario por centro: número de columnas variable (una por centro activo), así que en vez
     de forzar tarjetas (aquí sí importa poder comparar cifras en una fila), se deja scroll
     horizontal pero con la columna de producto fija, para no perder de vista qué fila es cuál. */
  .inventario-table th:first-child,.inventario-table td:first-child{position:sticky;left:0;z-index:1;box-shadow:2px 0 5px -3px rgba(0,0,0,0.12);}
  .inventario-table td:first-child{background:var(--surface);font-weight:600;}
  .inventario-table th:first-child{background:var(--bg);z-index:2;}
  .orders-table tbody tr{transition:background .12s ease;}
  .orders-table tbody tr:hover{background:var(--bg);}
  .orders-table tr:last-child td{border-bottom:none;}
  .orders-table tr.archived-row{opacity:.6;}
  .order-folio{font-weight:800;color:var(--primary-deep);}
  .order-folio-btn{font-weight:800;color:var(--primary-deep);text-decoration:underline;text-underline-offset:2px;padding:0;background:none;border:none;cursor:pointer;font-size:inherit;}
  .order-folio-btn:hover{color:var(--rose);}
  .order-date-main{font-weight:600;}
  .order-date-sub{font-size:11px;color:var(--ink-soft);}
  .order-source-tag{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .order-products-toggle{display:flex;align-items:center;gap:4px;color:var(--primary);font-weight:700;cursor:pointer;background:none;border:none;font-size:13px;padding:0;}
  .order-products-toggle .chev{transition:transform .15s ease;}
  .order-products-toggle.open .chev{transform:rotate(180deg);}
  .order-pay-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--green);background:#EAF3D8;padding:4px 9px;border-radius:var(--radius-pill);white-space:nowrap;}
  .order-pay-pill.split{color:var(--teal);background:#DFF4F6;cursor:help;}
  .order-ship-sub{font-size:11px;color:var(--ink-soft);margin-top:3px;white-space:normal;max-width:180px;}
  .order-actions-cell{position:relative;text-align:right;}
  .order-actions-btn{width:38px;height:38px;border-radius:9px;background:var(--surface-soft);color:var(--primary-deep);font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .order-actions-btn:hover{background:#efd9d3;}
  .order-actions-menu{position:absolute;top:38px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:20;min-width:190px;padding:6px;white-space:nowrap;text-align:left;}
  .order-actions-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .order-actions-menu button:hover{background:var(--surface-soft);}
  .order-actions-menu button.active-status{color:var(--primary-deep);font-weight:800;}
  .order-actions-menu hr{border:none;border-top:1px solid var(--border);margin:5px 0;}
  .order-actions-overlay{position:fixed;inset:0;z-index:19;}
  .products-detail-row td{background:var(--bg);padding:10px 14px;white-space:normal;}
  .products-detail-row .pd-line{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .products-detail-row .pd-extra{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:3px 0;border-top:1px dashed var(--border);margin-top:4px;}

  /* ===== TABLA DE PEDIDOS =====
     Escritorio: tabla compacta que cabe sin scroll horizontal (columnas con clase c-*).
     Celular y pantallas medianas (<=1080px): cada pedido es una tarjeta. Solo afecta .pedidos-table; la tabla de
     Inventario por centro comparte la clase base .orders-table y no se toca. */
  .ord-wrap{overflow:visible;background:var(--surface);}
  .pedidos-table{min-width:0;table-layout:auto;}
  .pedidos-table th:first-child{border-top-left-radius:var(--radius-md);} .pedidos-table th:last-child{border-top-right-radius:var(--radius-md);}
  .pedidos-table td{white-space:normal;vertical-align:middle;padding:10px 8px;}
  .pedidos-table th{padding:11px 8px;}
  .pedidos-table .c-check{width:34px;padding-right:0;}
  .pedidos-table .c-folio,.pedidos-table .c-status{white-space:nowrap;}
  .pedidos-table .c-cust{min-width:0;max-width:190px;}
  .pedidos-table .ord-cust-name{font-weight:700;overflow-wrap:anywhere;}
  .pedidos-table .order-source-tag{white-space:normal;}
  .pedidos-table .order-ship-sub{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .pedidos-table .c-total{white-space:nowrap;} .pedidos-table .c-total strong{display:block;margin-bottom:3px;}
  .pedidos-table .c-act{white-space:nowrap;width:1%;}
  .pedidos-table .c-act > *{vertical-align:middle;}
  .ord-next{display:inline-flex;align-items:center;margin-right:4px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:12px;font-weight:800;white-space:nowrap;}
  .ord-next:hover{background:var(--primary-deep);}
  .ord-chips{flex-wrap:wrap;margin-bottom:10px;}
  @media(max-width:600px){.ord-chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none;}.ord-chips::-webkit-scrollbar{display:none;}}
  .ord-chips .chip-n{display:inline-block;min-width:18px;margin-left:3px;padding:0 5px;border-radius:9px;background:rgba(0,0,0,.08);font-size:11px;line-height:18px;text-align:center;}
  .ord-chips button.active .chip-n{background:rgba(255,255,255,.28);}
  tr.selected-row{background:var(--surface-soft);}
  @media(max-width:1080px){
    .ord-wrap{border:none;box-shadow:none;background:transparent;}
    .pedidos-table thead{display:none;}
    .pedidos-table tbody{display:block;}
    .pedidos-table tbody tr:not(.products-detail-row){
      display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;row-gap:8px;align-items:center;
      grid-template-areas:"check folio status" "cust cust cust" "total total prod" "act act act";
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
      box-shadow:var(--shadow-sm);padding:12px 14px;margin:0 0 12px;
    }
    .pedidos-table tbody tr:not(.products-detail-row):has(+ tr.products-detail-row){border-radius:var(--radius-md) var(--radius-md) 0 0;margin-bottom:0;}
    .pedidos-table td{padding:0;border-bottom:none;display:block;min-width:0;}
    .pedidos-table .c-check{grid-area:check;width:auto;} .pedidos-table .c-folio{grid-area:folio;}
    .pedidos-table .c-status{grid-area:status;justify-self:end;}
    .pedidos-table .c-cust{grid-area:cust;max-width:none;}
    .pedidos-table .c-total{grid-area:total;font-size:15px;} .pedidos-table .c-total strong{display:inline;margin:0 8px 0 0;}
    .pedidos-table .c-prod{grid-area:prod;justify-self:end;}
    .pedidos-table .c-act{grid-area:act;width:auto;display:flex;gap:8px;align-items:stretch;position:relative;}
    .pedidos-table .c-total{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
    .pedidos-table tr.products-detail-row{display:block;}
    .pedidos-table tr.products-detail-row td{
      display:block;background:var(--bg);border:1px solid var(--border);border-top:none;
      border-radius:0 0 var(--radius-md) var(--radius-md);padding:10px 14px 12px;margin:0 0 12px;
    }
    .pedidos-table .order-products-toggle{padding:6px 4px;}
    .pedidos-table .ord-next{flex:1;justify-content:center;margin:0;height:40px;}
    .pedidos-table .order-actions-btn{flex:1;height:40px;width:auto;border-radius:var(--radius-sm);font-size:0;gap:6px;}
    .pedidos-table .c-act:not(:has(.ord-next)) .order-actions-btn{flex:1 1 100%;}
    .pedidos-table .order-actions-btn::before{content:"Más acciones";font-size:12.5px;font-weight:700;}
    .pedidos-table .order-actions-btn::after{content:"⋮";font-size:16px;}
    .pedidos-table .order-actions-menu{left:0;right:0;top:calc(100% + 4px);}
  }
  .status-filter button{flex-shrink:0;padding:8px 14px;min-height:36px;border-radius:var(--radius-pill);background:var(--surface-soft);color:var(--ink-soft);font-size:12px;font-weight:700;transition:all .15s ease;}
  .status-filter button.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(153,52,119,0.5);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#5C1F49;color:#fff;padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;box-shadow:var(--shadow-md);}
  /* AVISOS APILADOS: varios avisos a la vez, sin taparse entre sí ni con "Deshacer" */
  .toast-stack{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 32px);max-width:480px;z-index:90;pointer-events:none;}
  .toast-stack .toast{position:static;transform:none;opacity:0;max-width:100%;text-align:center;overflow-wrap:anywhere;line-height:1.3;animation:toastIn .22s ease forwards;}
  .toast-stack .toast.show{opacity:1;transform:none;}
  .toast-stack .toast.out{animation:toastOut .22s ease forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(6px)}}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-family:'League Spartan',sans-serif;}
  .cat-manage-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-soft);color:var(--primary-deep);padding:6px 8px 6px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;margin:0 6px 8px 0;transition:box-shadow .15s ease;}
  .cat-manage-chip:hover{box-shadow:var(--shadow-sm);}
  .cat-manage-chip button{background:none;color:var(--rose);font-size:14px;line-height:1;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
  .import-drop{border:1.5px dashed var(--border);border-radius:var(--radius-md);padding:22px 20px;text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:12px;background:var(--bg);}
  .import-drop input[type=file]{margin-top:10px;}
  .preview-count{font-size:12.5px;color:var(--primary-deep);font-weight:700;margin-bottom:10px;}

  .img-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .img-thumb{position:relative;width:86px;height:86px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .img-thumb img{width:100%;height:100%;object-fit:cover;}
  .img-thumb-actions{position:absolute;inset:0;background:rgba(43,22,32,0.55);opacity:0;display:flex;align-items:center;justify-content:center;gap:5px;transition:opacity .15s ease;}
  /* Antes estos 3 botones medían 20x20px dentro de una miniatura de 74x74 — casi imposible de
     tocar con precisión. Se agrandó la miniatura y los botones a lo máximo que cabe sin que se
     encimen entre sí (un objetivo táctil de 44px es geométricamente imposible con 3 botones en
     una sola fila dentro de esta miniatura; esto es lo más grande que cabe). */
  .img-thumb:active .img-thumb-actions, .img-thumb:hover .img-thumb-actions{opacity:1;}
  .img-thumb-actions button{width:26px;height:26px;border-radius:6px;background:var(--surface);color:var(--primary-deep);font-size:12.5px;display:flex;align-items:center;justify-content:center;}
  .add-thumb{display:flex;align-items:center;justify-content:center;background:var(--surface-soft);color:var(--primary-deep);font-size:22px;cursor:pointer;}
  .crop-box{width:280px;height:280px;max-width:100%;margin:0 auto;overflow:hidden;position:relative;border-radius:12px;background:#000;touch-action:none;cursor:grab;}
  #crop-img{position:absolute;top:0;left:0;user-select:none;pointer-events:none;}

  .section-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;background:var(--surface);transition:box-shadow .15s ease;flex-wrap:wrap;row-gap:8px;}
  .section-row:hover{box-shadow:var(--shadow-sm);}
  .section-row.dragging{opacity:0.4;}
  .drag-handle{color:var(--ink-soft);font-size:15px;letter-spacing:-2px;cursor:grab;flex-shrink:0;user-select:none;padding:4px;}
  /* Antes un nombre de sección largo ("Preguntas frecuentes sobre discreción") no tenía dónde
     partirse junto a las flechas de orden y el interruptor Visible/Oculta, y en 320-375px se
     desbordaba empujándolos fuera de la pantalla. */
  .section-name{flex:1;min-width:120px;overflow-wrap:anywhere;word-break:break-word;font-size:13.5px;font-weight:600;color:var(--ink);}
  .section-name.hidden-section{color:var(--ink-soft);}
  .section-arrows{display:flex;gap:3px;flex-shrink:0;}
  .arrow-btn{width:44px;height:44px;border-radius:7px;background:var(--surface-soft);color:var(--primary-deep);font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s ease;}
  .arrow-btn:hover{background:#efd9d3;}
  .visibility-toggle{flex-shrink:0;padding:6px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;white-space:nowrap;}
  .visibility-toggle.on{background:var(--surface-soft);color:var(--primary-deep);}
  .visibility-toggle.off{background:#f1f1f1;color:#9a9a9a;}
  .subpanel-item{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:color .15s ease;}
  .subpanel-item:last-child{border-bottom:none;}
  .subpanel-item:hover{color:var(--primary-deep);}
  .subpanel-item .chev{color:var(--ink-soft);font-size:15px;}
  .subpanel-back{display:inline-flex;align-items:center;gap:4px;background:none;color:var(--primary-deep);font-weight:700;font-size:13.5px;margin-bottom:14px;padding:4px 0;}
  .checkbox-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s ease;}
  .bulk-actions-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--primary-deep);}
  .bulk-actions-bar select{padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:12.5px;font-weight:600;}
  .selected-row{background:var(--surface-soft);}
  .checkbox-row:has(input:checked){border-color:var(--primary);background:var(--surface-soft);}
  .checkbox-row input{width:16px;height:16px;flex-shrink:0;accent-color:var(--primary);}
  .theme-palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:6px;}
  .theme-palette-swatch{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:border-color .15s ease;}
  .theme-palette-swatch:hover{border-color:var(--primary);}
  .theme-palette-swatch.active{border-color:var(--primary);background:var(--surface-soft);}
  .swatch-dots{display:flex;}
  .swatch-dots span{width:18px;height:18px;border-radius:50%;margin-left:-6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);}
  .swatch-dots span:first-child{margin-left:0;}
  .swatch-label{font-size:11.5px;font-weight:700;color:var(--ink);}
  .font-option-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:border-color .15s ease;}
  .font-option-row:hover{border-color:var(--primary);}
  .font-option-row.active{border-color:var(--primary);background:var(--surface-soft);}
  /* Descripciones con IA */
  .ai-desc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .ai-desc-bar select{flex:1 1 150px;min-width:0;width:auto;padding:9px 10px;font-size:12.5px;}
  .ai-desc-bar .btn-tertiary{flex:0 0 auto;}
  .ai-desc-err{margin-top:8px;font-size:12.5px;color:var(--red,#b3261e);background:rgba(179,38,30,.08);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;}
  .ai-desc-preview{margin-top:10px;padding:12px;border-radius:10px;border:1.5px solid var(--primary);background:var(--surface-soft);}
  .ai-desc-text{font-size:13.5px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap;}
  .ai-desc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .ai-desc-actions .btn-primary{width:auto;padding:9px 14px;font-size:13px;}

  /* Campañas */
  .camp-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;}
  .camp-chips button{padding:6px 10px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink);}
  .camp-link-out{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .camp-link-out input{flex:1 1 200px;min-width:0;font-size:12.5px;}
  .camp-list{display:flex;flex-direction:column;gap:10px;}
  .camp-card{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface);}
  .camp-name{font-weight:700;font-size:14px;overflow-wrap:anywhere;margin-bottom:8px;}
  .camp-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px 10px;}
  .camp-metrics div{min-width:0;}
  .camp-metrics span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
  .camp-metrics strong{font-size:14px;overflow-wrap:anywhere;}
  .order-camp-tag{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--primary-deep);background:var(--surface-soft);padding:2px 8px;border-radius:999px;overflow-wrap:anywhere;}
  /* ===== Ventanas y formularios: título y botones fijos, secciones en tarjetas ===== */
  .modal h3{position:sticky;top:-22px;z-index:3;margin:-22px -20px 14px;padding:16px 20px 12px;background:var(--surface);border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
  .modal-actions{position:sticky;bottom:-22px;z-index:3;margin:16px -20px -22px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -8px 16px -12px rgba(43,22,32,.25);}
  .form-section-label{border-top:none;padding:2px 0 2px 10px;margin:22px 0 12px;border-left:3px solid var(--primary);font-size:11.5px;}
  .form-section-label:first-of-type{margin-top:4px;padding-top:2px;}
  .modal .row-main{min-width:0;}
  .modal .row-sub,.modal .row-title{overflow-wrap:anywhere;}
  .pm-modal{max-width:620px;}
  .fsec{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);margin:0 0 14px;box-shadow:var(--shadow-sm);}
  .fsec-head{display:flex;align-items:center;gap:10px;padding:13px 14px;list-style:none;cursor:default;}
  summary.fsec-head{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  summary.fsec-head::-webkit-details-marker{display:none;}
  .fsec-ico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--surface-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;}
  .fsec-titles{flex:1;min-width:0;}
  .fsec-title{font-size:14.5px;font-weight:700;color:var(--primary-deep);font-family:'League Spartan',sans-serif;line-height:1.2;}
  .fsec-hint{font-size:12px;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere;}
  .fsec-badge{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-soft);color:var(--ink-soft);white-space:nowrap;}
  .fsec-chev{flex:0 0 auto;color:var(--ink-soft);transition:transform .15s ease;}
  details.fsec[open]>summary .fsec-chev{transform:rotate(180deg);}
  .fsec-body{padding:2px 14px 14px;}
  details.fsec[open]>summary.fsec-head{padding-bottom:8px;}
  .fsec-body .form-field:last-child{margin-bottom:0;}
  .two-col-keep{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .two-col-keep>*,.two-col>*{min-width:0;}
  .modal input[type=date]{min-width:0;max-width:100%;}
  .pm-switch{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;background:var(--surface-soft);cursor:pointer;margin-top:4px;}
  .pm-switch .pm-switch-txt{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.3;}
  .pm-switch .pm-switch-txt small{display:block;font-weight:400;color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
  .pm-switch input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;transition:background .15s ease;margin:0;padding:0;border:none;}
  .pm-switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s ease;}
  .pm-switch input:checked{background:var(--primary);}
  .pm-switch input:checked::after{transform:translateX(18px);}
  .pm-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:4px;}
  .pm-photos .img-thumb{width:auto;height:auto;aspect-ratio:1;}
  .pm-photos .add-thumb{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--primary);color:var(--primary);background:var(--surface-soft);font-size:26px;cursor:pointer;box-shadow:none;}
  .pm-cover{position:absolute;left:5px;top:5px;z-index:1;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--primary);color:#fff;padding:2px 6px;border-radius:999px;}
  .pm-result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .pm-result>div{background:var(--surface-soft);border-radius:10px;padding:10px 12px;}
  .pm-result .row-sub{font-size:11.5px;}
  .pm-result strong{font-size:18px;display:block;margin-top:2px;}
  .pm-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .pm-chips label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface-soft);padding:8px 11px;border-radius:999px;cursor:pointer;border:1.5px solid transparent;margin:0;}
  .pm-chips label:has(input:checked){background:rgba(153,52,119,.12);border-color:var(--primary);color:var(--primary-deep);}
  .pm-chips label{white-space:nowrap;}
  .pm-chips input{margin:0;width:auto;flex:0 0 auto;}
  .fsub{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;}
  .fsub>summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;padding:4px 0;}
  .fsub>summary::-webkit-details-marker{display:none;}
  .fsub>summary::after{content:"▾";margin-left:auto;transition:transform .15s ease;}
  .fsub[open]>summary::after{transform:rotate(180deg);}
  .pm-barcode{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:10px;}
  .pm-barcode svg{max-width:100%;height:auto;max-height:90px;}
  .pm-stock-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
  .pm-stock-row:first-of-type{border-top:none;}
  .pm-stock-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;background:var(--surface-soft);border-radius:10px;font-size:13px;font-weight:600;}
  /* ---- Aviso "Deshacer" (aparece unos segundos tras archivar, cancelar, eliminar o ajustar) ---- */
  .undo-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);min-width:min(280px,calc(100% - 32px));background:#5C1F49;color:#fff;padding:8px 8px 8px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:85;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;box-shadow:var(--shadow-md);}
  .undo-bar.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(-6px);}
  .toast-stack .undo-bar{position:static;transform:none;display:none;opacity:1;max-width:100%;width:100%;}
  .toast-stack .undo-bar.show{display:flex;transform:none;animation:toastIn .22s ease;}
  .undo-bar .undo-msg{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3;}
  .undo-bar button{flex:0 0 auto;width:auto;min-height:36px;padding:0 16px;border:none;border-radius:var(--radius-pill);background:#fff;color:#5C1F49;font-weight:800;font-size:13px;cursor:pointer;}
  /* ---- Qué hacer hoy + señales de riesgo en pedidos ---- */
  .today-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .today-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;background:var(--surface-soft);border:1px solid var(--border);border-radius:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;}
  .today-item:hover{border-color:var(--primary);}
  .today-dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;}
  .today-dot.rojo{background:var(--rose);} .today-dot.ambar{background:var(--amber);} .today-dot.info{background:var(--primary);}
  .today-n{flex:0 0 auto;min-width:28px;height:28px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fff;border:1px solid var(--border);font-weight:800;font-size:13px;}
  .today-text{flex:1;min-width:0;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere;}
  .today-go{flex:0 0 auto;color:var(--primary-deep);font-weight:700;font-size:12.5px;white-space:nowrap;}
  .today-ok{margin-top:8px;padding:12px 14px;background:var(--surface-soft);border-radius:12px;font-size:13.5px;color:var(--ink-soft);}
  .order-risk-tag{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;font-weight:700;color:#8a5a1a;background:#FDEBD3;padding:4px 8px;border-radius:10px;overflow-wrap:anywhere;}
  .order-risk-tag button{flex:0 0 auto;width:auto;min-height:26px;padding:0 10px;border:1px solid #8a5a1a;background:transparent;color:#8a5a1a;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;}
  /* ---- Pago del pedido, entrega fallida ---- */
  .order-fail-tag{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;font-weight:700;color:#8e1f3b;background:#FBE0E6;padding:4px 8px;border-radius:10px;overflow-wrap:anywhere;}
  .order-pay-pill.paid{background:#DDF3E4;color:#1f6b3a;}
  .order-pay-pill.pending-cash{background:#FDEBD3;color:#8a5a1a;}
  .order-pay-pill.recon{background:#E1ECFA;color:#1d4f8f;}
  .pay-box{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .pay-seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
  .pay-seg button{flex:1 1 0;min-width:92px;min-height:40px;padding:0 10px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;}
  .pay-seg button.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .fail-reasons{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px;}
  .fail-reasons label{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;cursor:pointer;}
  .fail-reasons label.on{border-color:var(--primary);background:var(--surface-soft);font-weight:700;}
  .fail-reasons input{width:auto;flex:0 0 auto;}
  /* ---- Proyección de cierre de mes + calendario de ventas ---- */
  .proj-main{font-size:30px;font-weight:800;color:var(--primary-deep);line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums;}
  .proj-bar{height:14px;border-radius:999px;background:var(--bg);overflow:hidden;margin:10px 0 6px;position:relative;}
  .proj-bar > i{display:block;height:100%;border-radius:999px;background:var(--primary);}
  .proj-lines{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px;}
  .proj-lines div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;}
  .proj-lines div > span:first-child{color:var(--ink-soft);}
  .proj-lines div > span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .cal-nav .cal-title{flex:1;text-align:center;font-weight:800;text-transform:capitalize;font-size:15px;}
  .cal-nav button{flex:0 0 auto;width:44px;min-height:44px;border:1.5px solid var(--border);background:var(--surface);border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink);padding:0;}
  .flash-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px;}
  .flash-chips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-soft);font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;}
  .liq-row{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-soft);margin-bottom:8px;}
  .liq-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .liq-ctl input{width:64px;min-height:40px;padding:0 8px;border:1px solid var(--border);border-radius:10px;font:inherit;text-align:center;background:#fff;}
  .close-item{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 12px;margin-bottom:6px;border:1px solid var(--border);border-radius:12px;background:var(--surface-soft);font:inherit;color:var(--ink);text-align:left;min-height:48px;}
  button.close-item{cursor:pointer;}
  .close-ico{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px;}
  .close-ico.ok{background:var(--green);} .close-ico.warn{background:var(--amber);color:#2B1620;}
  .close-sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px;align-items:baseline;}
  .cal-nav button:disabled{opacity:.35;cursor:default;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;}
  .cal-dow{text-align:center;font-size:10.5px;font-weight:800;color:var(--ink-soft);padding:2px 0;}
  .cal-day{min-width:0;min-height:54px;border:1px solid var(--border);border-radius:8px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:var(--surface);font:inherit;color:var(--ink);cursor:pointer;}
  .cal-day .n{font-size:11px;font-weight:700;opacity:.8;}
  .cal-day .v{font-size:10.5px;font-weight:800;white-space:nowrap;}
  .cal-day.future{opacity:.4;cursor:default;}
  .cal-day.today{outline:2px solid var(--primary);outline-offset:-2px;}
  .cal-day.sel{border-color:var(--primary-deep);box-shadow:inset 0 0 0 2px var(--primary-deep);}
  .cal-blank{min-height:54px;}
  /* ---- Reabasto para temporadas ---- */
  .season-restock-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
  .season-restock-row:first-of-type{border-top:none;}
  .season-restock-row .row-main{flex:1 1 150px;min-width:0;}
  .season-restock-row button{flex:0 0 auto;width:auto;min-height:40px;white-space:nowrap;}

function logSystemError(message, stack){
  if(systemErrorsLoggedThisSession >= SYSTEM_ERROR_LOG_LIMIT) return;
  systemErrorsLoggedThisSession++;
  try{
    db.collection('systemErrors').add({
      message: String(message||'Error desconocido').slice(0,500),
      stack: String(stack||'').slice(0,2000),
      source: 'admin',
      page: location.pathname + location.search,
      userAgent: (navigator.userAgent||'').slice(0,300),
      date: new Date().toISOString(),
    }).catch(()=>{});
  }catch(e){}
}

  logSystemError(r && r.message ? r.message : String(r), r && r.stack ? r.stack : '');
});

    // de forma automática.

    const [setSnap, ordersSnap, salesSnap, visitsSnap, cashiersSnap, aiSnap, centersSnap, transfersSnap, auditsSnap, customersSnap, couponUsageSnap, cashRegistersSnap, analyticsEventsSnap, abandonedCartsSnap, storeMessagesSnap, suppliersSnap, restockItemsSnap, commissionAgentsSnap, activePosSessionsSnap] = await Promise.all([

      db.collection('visits').orderBy('date','desc').limit(3000).get(),

      db.collection('settings').doc('ai').get(),

      db.collection('analyticsEvents').orderBy('date','desc').limit(5000).get(),

    // unen en una sola lista, ordenada por fecha, para verlos juntos en "Pedidos".

    state.expenses = expSnap.docs.map(d=>({id:d.id, ...d.data()}));

    // Centros de distribución: si no existe ninguno, se crea "Principal" automáticamente.
    state.centers = centersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.centers.length===0){
      const ref = await db.collection('distributionCenters').add({name:'Principal', isDefault:true, active:true, createdAt:new Date().toISOString()});
      state.centers = [{id:ref.id, name:'Principal', isDefault:true, active:true}];
    }
    state.transfers = transfersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.audits = auditsSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.customers = customersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.couponUsage = couponUsageSnap.docs.map(d=>d.data());
    state.cashRegisters = cashRegistersSnap.docs.map(d=>({id:d.id, ...d.data()}));

    // Migración automática: cualquier producto que todavía no tenga inventario
    // repartido por centro, se le asigna TODO su stock actual al centro Principal.
    const principal = state.centers.find(c=>c.isDefault) || state.centers[0];
    const migrationBatch = db.batch();
    let needsMigration = false;
    state.products.forEach(p=>{
      if(!p.stockByCenter){
        p.stockByCenter = { [principal.id]: p.stock||0 };
        migrationBatch.update(db.collection('products').doc(p.id), {stockByCenter: p.stockByCenter});
        needsMigration = true;
      }
    });
    if(needsMigration){ try{ await migrationBatch.commit(); }catch(e){ console.error('No se pudo migrar el inventario a centros', e); } }
  }catch(e){
    console.error(e);
    // ANTES: si esta carga fallaba una sola vez (señal débil, internet que se corta), el panel
    // seguía con datos vacíos y la configuración "de fábrica" — y el recálculo automático de
    // "más vendidos" (más abajo) la GUARDABA encima de la configuración real de la tienda:
    // categorías, diseño, cupones y promociones se perdían. Ahora se reintenta, y si de plano no
    // se puede, el panel muestra una pantalla de error con "Reintentar" y no deja guardar nada.
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, 1500*attempt));
      return loadData(attempt+1);
    }
    state.settingsReady = false;
    state.loadFailed = true; state.loaded = true;
    render();
    return;
  }
  computeMyPermissions();
  if(state.myPermissions && !canAccessTab(state.adminTab)) state.adminTab = firstAccessibleTab() || state.adminTab;
  if(!state.lastOrderCheck) state.lastOrderCheck = new Date().toISOString();
  if(!state.lastMessageCheck) state.lastMessageCheck = new Date().toISOString();
  await refreshBestSellersIfStale();
  // Punto de partida para la bitácora de cambios de configuración/diseño: a partir de aquí,
  // cualquier saveSettings() compara contra esta "foto" para saber qué campos cambiaron.
  _settingsAuditBaseline = JSON.stringify(state.settings);
  // Red de seguridad para kits: recalcula su stock contra las existencias reales de sus
  // componentes cada vez que se abre el panel, por si algo lo dejó desactualizado.
  refreshAllKitStocks();
  auditRestoreDraft();
  state.loaded = true; render();
}
// "Más vendidos" automático: analiza lo vendido de verdad (tienda + POS, sin lo cancelado) en
// los últimos 30 días y guarda el resultado en la configuración pública de la tienda (así
// index.html lo puede leer sin necesitar permiso para ver pedidos). Se recalcula solo, sin que
// Ale tenga que hacer nada, cada vez que abre el panel Y ya pasó una semana desde la última vez
// — por eso "se actualiza por semana". Si nunca se ha calculado, se hace ahora mismo.
const BEST_SELLERS_REFRESH_DAYS = 7, BEST_SELLERS_LOOKBACK_DAYS = 30, BEST_SELLERS_COUNT = 10;
function computeBestSellers(){
  const cutoff = Date.now() - BEST_SELLERS_LOOKBACK_DAYS*24*60*60*1000;
  const qtyByProduct = {};
  state.orders.forEach(o=>{
    if(o.status==='Cancelado') return;
    if(new Date(o.date).getTime() < cutoff) return;
    (o.items||[]).forEach(it=>{ if(it.id) qtyByProduct[it.id] = (qtyByProduct[it.id]||0) + (Number(it.qty)||0); });
  });
  // Antes se excluían aquí los productos sin existencia — la intención era no anunciar como
  // "más vendido" algo que no se puede comprar, pero en la práctica eso podía dejar la lista
  // completamente vacía (y la sección "Ver más vendidos" de la tienda sin nada que mostrar)
  // justo cuando los productos que más se venden se agotan, que es lo más probable que pase con
  // los que más rotan. La tienda ya marca "Agotado" en la tarjeta de cualquier producto sin
  // existencia, así que es preferible seguir mostrándolo (la gente entiende que se agotó y puede
  // preguntar por WhatsApp) a que la sección desaparezca. Solo se excluyen los ocultados a mano.
  return Object.entries(qtyByProduct)
    .sort((a,b)=>b[1]-a[1])
    .map(([id])=>id)
    .filter(id=>{ const p = state.products.find(x=>x.id===id); return p && !p.hidden; })
    .slice(0, BEST_SELLERS_COUNT);
}
async function refreshBestSellersIfStale(force){
  const last = state.settings.bestSellersUpdatedAt;
  const staleMs = BEST_SELLERS_REFRESH_DAYS*24*60*60*1000;
  // Si la lista guardada está vacía, no esperamos a que se cumpla la semana para recalcularla:
  // una lista vacía casi seguro significa que se calculó en un mal momento (sin ventas todavía,
  // o los que más vendían se agotaron con la regla vieja) y no vale la pena dejar la sección
  // "Ver más vendidos" de la tienda apagada una semana entera por eso.
  const cachedEmpty = !(state.settings.bestSellerProductIds||[]).length;
  if(!force && !cachedEmpty && last && (Date.now() - new Date(last).getTime()) < staleMs) return;
  state.settings.bestSellerProductIds = computeBestSellers();
  state.settings.bestSellersUpdatedAt = new Date().toISOString();
  try{ await saveSettings(); }catch(e){ console.error('No se pudo guardar la lista de más vendidos', e); }
}
// Aviso de pedido/mensaje nuevo mientras el admin está abierto: revisa cada 45s si llegó algo
// nuevo a "orders", "sales" o "storeMessages" desde la última revisión, sin que Ale tenga que
// estar entrando a Pedidos o Mensajes a cada rato para enterarse. Se detiene si la pestaña no
// está visible (minimizada/en segundo plano) para no gastar lecturas de más.
let newOrderWatcherTimer = null;
function ensureNewOrderWatcher(active){
  if(active && !newOrderWatcherTimer){
    newOrderWatcherTimer = setInterval(checkForNewOrders, 45000);
  } else if(!active && newOrderWatcherTimer){
    clearInterval(newOrderWatcherTimer); newOrderWatcherTimer = null;
  }
}
async function checkForNewOrders(){
  if(document.hidden || !state.user || !state.loaded) return;
  const sinceOrders = state.lastOrderCheck || new Date().toISOString();
  const sinceMessages = state.lastMessageCheck || new Date().toISOString();
  const sinceCarts = state.lastCartCheck || new Date().toISOString();
  try{
    const [ordersSnap, salesSnap, messagesSnap, cartsSnap] = await Promise.all([
      db.collection('orders').where('date','>',sinceOrders).get(),
      db.collection('sales').where('date','>',sinceOrders).get(),
      db.collection('storeMessages').where('date','>',sinceMessages).get(),
      db.collection('abandonedCarts').where('updatedAt','>',sinceCarts).get(),
    ]);
    const newCount = ordersSnap.size + salesSnap.size;
    const newMsgCount = messagesSnap.size;
    const newCartCount = cartsSnap.size;
    state.lastOrderCheck = new Date().toISOString();
    state.lastMessageCheck = new Date().toISOString();
    state.lastCartCheck = new Date().toISOString();
    // Antes esta función solo revisaba pedidos/ventas/mensajes — un carrito abandonado nunca
    // aparecía si el panel ya estaba abierto de antes, porque nada volvía a pedir esa lista
    // hasta recargar la página entera. Ahora también la revisa (sin sonido ni aviso, porque no
    // es urgente como un pedido), y refresca los datos en cuanto hay uno nuevo o actualizado.
    if(newCount>0 || newMsgCount>0 || newCartCount>0){
      if(newCount>0) state.newOrderCount = (state.newOrderCount||0) + newCount;
      if(newMsgCount>0) state.newMessageCount = (state.newMessageCount||0) + newMsgCount;
      if(newCount>0 || newMsgCount>0) playNewOrderChime();
      const parts = [];
      if(newCount>0) parts.push(`${newCount} pedido${newCount>1?'s':''} nuevo${newCount>1?'s':''}`);
      if(newMsgCount>0) parts.push(`${newMsgCount} mensaje${newMsgCount>1?'s':''} nuevo${newMsgCount>1?'s':''}`);
      if(parts.length) showToast(parts.join(' · '));
      await loadData();
    }
  }catch(e){ console.error('No se pudo revisar pedidos/mensajes/carritos nuevos', e); }
}
// Aviso sonoro corto, generado sin archivo de audio (Web Audio API) — dos tonos breves.
function playNewOrderChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [880,1160].forEach((freq,i)=>{
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      osc.connect(gain); gain.connect(ctx.destination);
      const start = ctx.currentTime + i*0.14;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.22);
      osc.start(start); osc.stop(start+0.24);
    });
  }catch(e){}
}

async function saveSettings(){
  // Nunca guardar la configuración si no se pudo leer la real primero: .set() reemplaza el
  // documento completo, así que guardar los valores "de fábrica" borraría los de la tienda.
  if(!state.settingsReady){ showToast('No se guardó: la configuración no terminó de cargar. Recarga la página.'); return; }
  try{
    if(_settingsAuditBaseline){
      try{
        const before = JSON.parse(_settingsAuditBaseline);
        const changed = [];
        new Set([...Object.keys(before), ...Object.keys(state.settings)]).forEach(k=>{
          if(SETTINGS_AUDIT_IGNORE.has(k)) return;
          if(JSON.stringify(before[k]) !== JSON.stringify(state.settings[k])) changed.push(SETTINGS_FIELD_LABELS[k] || k);
        });
        if(changed.length) logAdminAction('cambio_configuracion', 'configuracion', null, `Cambió: ${changed.join(', ')}`);
      }catch(e){ console.error('No se pudo comparar cambios de configuración para la bitácora', e); }
    }
    await db.collection('settings').doc('store').set(state.settings);
    _settingsAuditBaseline = JSON.stringify(state.settings);
  }catch(e){ console.error(e); showToast('No se pudo guardar la configuración'); }
}

async function saveCommissionAgent(){
  const name = document.getElementById('agent-name').value.trim();
  const pct = Number(document.getElementById('agent-pct').value)||0;
  if(!name){ showToast('Ponle un nombre'); return; }
  const existing = state.commissionAgentModal.id;
  const payload = {name, defaultPct: pct};
  try{
    if(existing){
      await db.collection('commissionAgents').doc(existing).set(payload);
      Object.assign(state.commissionAgents.find(a=>a.id===existing), payload);
    }else{
      const ref = await db.collection('commissionAgents').add(payload);
      state.commissionAgents.push({id:ref.id, ...payload});
    }
    logAdminAction(existing?'edicion_comisionista':'alta_comisionista', 'comisionista', name, `${pct}%`);
    state.commissionAgentModal = null; showToast('Guardado'); render();
  }catch(e){ console.error(e); showToast('No se pudo guardar'); }
}
async function deleteCommissionAgent(id){
  const a = state.commissionAgents.find(x=>x.id===id);
  if(!confirm(`¿Eliminar a ${a?a.name:'este comisionista'}? Las ventas que ya se le asignaron conservan su nombre y porcentaje, solo no podrás asignarle ventas nuevas.`)) return;
  try{
