<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de venta — La Casa de los Placeres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#FBF5F2; --surface-soft:#F6E9E6; --ink:#2B1620; --ink-soft:#6E5560;
    --primary:#6E2159; --primary-deep:#4A1642; --rose:#BC355C; --amber:#F6A030;
    --green:#6E9E1A; --navy:#0A4A5B; --border:#EBD9D3; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;} input,select{font-family:inherit;}
  .app{max-width:1100px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  .top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .top .brand{font-size:15.5px;font-weight:600;font-family:'League Spartan',sans-serif;}
  .top .sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .pill-btn{font-size:12px;background:rgba(255,255,255,0.14);padding:8px 13px;border-radius:var(--radius-pill);color:#fff;}
  .login-screen,.select-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--primary-deep);padding:20px;}
  .card{background:#fff;border-radius:18px;padding:30px 26px;max-width:360px;width:100%;text-align:center;}
  .card h2{color:var(--primary-deep);font-size:19px;margin-bottom:6px;}
  .card p{color:var(--ink-soft);font-size:12.5px;margin-bottom:16px;}
  .card input{width:100%;font-size:14px;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px;}
  .card input.pin{text-align:center;letter-spacing:6px;font-size:20px;}
  .err{color:var(--rose);font-size:12px;margin-bottom:8px;min-height:14px;}
  .btn-primary{width:100%;background:var(--rose);color:#fff;padding:13px;border-radius:12px;font-size:14.5px;font-weight:600;}
  .btn-secondary{width:100%;background:var(--surface-soft);color:var(--ink-soft);padding:12px;border-radius:12px;font-size:13.5px;font-weight:600;margin-top:8px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(43,22,32,0.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.modal-overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px;}
  @media(min-width:600px){.modal{border-radius:16px;}}
  .modal h3{font-size:17px;color:var(--primary-deep);margin-bottom:6px;font-weight:700;}
  .order-detail{background:var(--bg);border-radius:10px;padding:12px;font-size:12.5px;}
  .order-detail div{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
  .field-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px;font-size:14px;}
  .cashier-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .cashier-item{background:var(--surface-soft);color:var(--primary-deep);padding:14px;border-radius:12px;font-size:14.5px;font-weight:600;}

  .pos-body{flex:1;min-height:0;display:flex;flex-direction:column;}
  .toolbar{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;}
  .search-row input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);font-size:14px;background:#fff;}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;padding:8px 14px;border-radius:var(--radius-pill);background:#fff;border:1px solid var(--border);color:var(--ink-soft);font-size:13px;font-weight:500;white-space:nowrap;}
  .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .layout{display:flex;flex:1;min-height:0;}
  .prod-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 100px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;}
  @media(min-width:600px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.prod-grid{grid-template-columns:repeat(4,1fr);}}
  .prod-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
  .prod-card:active{transform:scale(0.97);}
  .prod-swatch{width:100%;height:44px;border-radius:8px;}
  .prod-name{font-size:12.5px;font-weight:600;line-height:1.25;}
  .prod-price{font-size:13px;font-weight:700;color:var(--primary-deep);}
  .prod-stock{font-size:10.5px;color:var(--ink-soft);}

  .sale-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);max-height:60vh;display:flex;flex-direction:column;box-shadow:0 -8px 24px -12px rgba(0,0,0,0.15);}
  .sale-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
  .sale-items{overflow-y:auto;padding:8px 16px;flex:1;}
  .sale-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .sale-item .name{flex:1;}
  .qty-btn{width:24px;height:24px;border-radius:6px;background:var(--surface-soft);color:var(--primary-deep);font-size:14px;}
  .sale-foot{padding:12px 16px 16px;border-top:1px solid var(--border);}
  .total-row{display:flex;justify-content:space-between;font-weight:700;color:var(--primary-deep);font-size:16px;margin-bottom:10px;}
  .pay-row{display:flex;gap:8px;margin-bottom:10px;}
  .pay-btn{flex:1;padding:10px;border-radius:10px;background:var(--surface-soft);color:var(--ink-soft);font-size:12.5px;font-weight:600;}
  .pay-btn.active{background:var(--primary);color:#fff;}
  .empty-cart{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-family:'League Spartan',sans-serif;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-deep);color:#fff;padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .receipt-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .receipt-card{background:#fff;border-radius:18px;padding:30px 26px;max-width:340px;text-align:center;}
  .receipt-card .mark{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhPrEfQSfWOjP2X7GtcXKp86RMWHZa-NQ",
  authDomain: "casa-de-los-placeres.firebaseapp.com",
  projectId: "casa-de-los-placeres",
  storageBucket: "casa-de-los-placeres.firebasestorage.app",
  messagingSenderId: "689677749733",
  appId: "1:689677749733:web:3cc2900d04a78b652cf30c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Mismo contador compartido con index.html: folio consecutivo único para
// pedidos de la tienda y ventas del Punto de Venta.
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}
function formatFolio(n){ return n ? '#' + String(n).padStart(4,'0') : ''; }
const auth = firebase.auth();

const PALETTE = ["#BC355C","#6E2159","#1AA0B2","#0A4A5B","#ED7578","#4A1642","#F6A030","#6E9E1A","#8a6b78","#993477","#20B7CA","#7AB71A"];
function catColor(cat){ const i = state.categories.indexOf(cat); return PALETTE[(i<0?0:i) % PALETTE.length]; }
const PAY_METHODS = ["Efectivo","Tarjeta","Transferencia"];

let state = {
  authChecked:false, user:null, loginEmail:"", loginPassword:"", loginError:"",
  loaded:false, products:[], categories:[], cashiers:[], centers:[], activeCenter:null,
  activeCashier:null, pinConfirmed:false, pinInput:"", pinError:"",
  activeCat:"Todos", search:"", cart:{}, payMethod:"Efectivo",
  saleDone:false, lastSaleTotal:0, lastOrderNumber:null, sending:false, variantPickerProduct:null,
  // Apertura/cierre de caja: la caja pertenece a la combinación cajero + centro.
  activeCashRegister:null, cashRegisterChecked:false, cashRegisterLoading:false,
  openingAmountInput:"", openingError:"", openingSubmitting:false,
  cashPanelOpen:false, movementModalOpen:false, movementType:"retiro", movementAmount:"", movementNote:"", movementError:"",
  closingOpen:false, closingLoading:false, closingSummary:null, closingCountedCash:"", closingNotes:"", closingError:"",
  // Cliente, ajuste por envío y notas de la venta actual.
  customers:[], activeCustomer:null, customerPickerOpen:false, customerSearchPOS:"",
  newCustomerMode:false, newCustomerName:"", newCustomerPhone:"",
  manualDiscount:null, discountModalOpen:false, discountAmountInput:"", discountReasonInput:"", discountError:"",
  saleNotes:"", notesModalOpen:false, notesDraft:"",
};
function centerStock(p, centerId){ return (p.stockByCenter && p.stockByCenter[centerId]) || 0; }

async function loadData(){
  try{
    const [prodSnap, setSnap, cashiersSnap, centersSnap, customersSnap] = await Promise.all([
      db.collection('products').get(),
      db.collection('settings').doc('store').get(),
      db.collection('cashiers').get(),
      db.collection('distributionCenters').get(),
      db.collection('customers').get(),
    ]);
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.categories = setSnap.exists ? (setSnap.data().categories||[]) : [];
    state.cashiers = cashiersSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(c=>c.active);
    state.centers = centersSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(c=>c.active);
    state.customers = customersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.centers.length===0){
      const ref = await db.collection('distributionCenters').add({name:'Principal', isDefault:true, active:true, createdAt:new Date().toISOString()});
      state.centers = [{id:ref.id, name:'Principal', isDefault:true, active:true}];
    }
    // Si este dispositivo ya tenía un centro elegido y sigue activo, se retoma solo.
    const savedCenterId = localStorage.getItem('cdlp_pos_center');
    if(savedCenterId){
      const match = state.centers.find(c=>c.id===savedCenterId);
      if(match) state.activeCenter = match;
    }
  }catch(e){ console.error(e); showToast('No se pudo cargar la información'); }
  state.loaded = true; render();
}
function money(n){ return '$' + Number(Math.round(n)).toLocaleString('es-MX') + ' MXN'; }
function onPosSearchInput(v){
  state.search = v;
  render();
  const i = document.getElementById('pos-search-input');
  if(i){ i.focus(); i.setSelectionRange(v.length, v.length); }
}
function showToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

auth.onAuthStateChanged(user=>{
  state.user = user; state.authChecked = true;
  if(user && !state.loaded){ loadData(); } else { render(); }
});
async function handleLogin(){
  state.loginError='';
  try{ await auth.signInWithEmailAndPassword(state.loginEmail.trim(), state.loginPassword); }
  catch(e){ state.loginError='Correo o contraseña incorrectos'; render(); }
}
function handleLogout(){
  auth.signOut(); state.loaded=false; state.activeCashier=null; state.pinConfirmed=false;
  state.activeCashRegister=null; state.cashRegisterChecked=false;
}

function selectCashier(c){ state.activeCashier = c; state.pinInput=''; state.pinError=''; state.pinConfirmed=false; render(); }
function confirmCashierPin(){
  if(state.pinInput === state.activeCashier.pin){ state.pinConfirmed=true; state.pinInput=''; state.pinError=''; render(); }
  else{ state.pinError='PIN incorrecto'; state.pinInput=''; render(); }
}
function changeCashier(){
  state.activeCashier=null; state.pinConfirmed=false; state.cart={};
  state.activeCashRegister=null; state.cashRegisterChecked=false;
  render();
}
function selectCenter(id){
  const c = state.centers.find(x=>x.id===id); if(!c) return;
  state.activeCenter = c; state.cart={};
  state.activeCashRegister=null; state.cashRegisterChecked=false;
  try{ localStorage.setItem('cdlp_pos_center', c.id); }catch(e){}
  render();
}
function changeCenter(){
  state.activeCenter=null; state.cart={};
  state.activeCashRegister=null; state.cashRegisterChecked=false;
  render();
}

/* ============== APERTURA / CIERRE DE CAJA ==============
   La caja pertenece a la combinación cajero + centro: si el mismo cajero vuelve
   a entrar al mismo centro más tarde (incluso desde otro dispositivo), retoma la
   caja que dejó abierta, junto con sus movimientos. */
async function loadCashRegister(){
  state.cashRegisterLoading = true;
  try{
    const snap = await db.collection('cashRegisters')
      .where('cashierId','==', state.activeCashier.id)
      .where('centerId','==', state.activeCenter.id)
      .where('status','==','abierta')
      .limit(1).get();
    state.activeCashRegister = snap.empty ? null : {id:snap.docs[0].id, ...snap.docs[0].data()};
  }catch(e){ console.error(e); showToast('No se pudo verificar la caja'); state.activeCashRegister=null; }
  state.cashRegisterChecked = true; state.cashRegisterLoading = false; render();
}
async function openCashRegister(){
  if(state.openingSubmitting) return;
  const amount = Number(state.openingAmountInput);
  if(state.openingAmountInput.trim()==='' || isNaN(amount) || amount<0){ state.openingError='Ingresa un monto válido'; render(); return; }
  state.openingSubmitting = true; state.openingError=''; render();
  const payload = {
    cashierId: state.activeCashier.id, cashierName: state.activeCashier.name,
    centerId: state.activeCenter.id, centerName: state.activeCenter.name,
    openedAt: new Date().toISOString(), openingAmount: amount,
    status: 'abierta', movements: [],
  };
  try{
    const ref = await db.collection('cashRegisters').add(payload);
    state.activeCashRegister = {id:ref.id, ...payload};
    state.openingAmountInput='';
    showToast('Caja abierta');
  }catch(e){ console.error(e); showToast('No se pudo abrir la caja'); }
  state.openingSubmitting = false; render();
}
function renderCashOpenScreen(){
  return `<div class="select-screen"><div class="card">
    <h2>Abrir caja</h2>
    <p>${state.activeCashier.name} · ${state.activeCenter.name}<br>Registra el fondo inicial en efectivo con el que empiezas el turno.</p>
    <input class="field-input" type="number" inputmode="decimal" placeholder="Fondo inicial (efectivo)" value="${state.openingAmountInput}" oninput="state.openingAmountInput=this.value" onkeydown="if(event.key==='Enter')openCashRegister()">
    <div class="err">${state.openingError||''}</div>
    <button class="btn-primary" ${state.openingSubmitting?'disabled style="opacity:.5"':''} onclick="openCashRegister()">${state.openingSubmitting?'Abriendo…':'Abrir caja'}</button>
    <button class="btn-secondary" onclick="changeCashier()">Cambiar cajero</button>
  </div></div>`;
}

async function saveCashMovement(){
  const amount = Number(state.movementAmount);
  if(state.movementAmount.trim()==='' || isNaN(amount) || amount<=0){ state.movementError='Ingresa un monto válido'; render(); return; }
  const mov = {type: state.movementType, amount, note: state.movementNote.trim(), date: new Date().toISOString()};
  try{
    await db.collection('cashRegisters').doc(state.activeCashRegister.id).update({
      movements: firebase.firestore.FieldValue.arrayUnion(mov)
    });
    if(!state.activeCashRegister.movements) state.activeCashRegister.movements=[];
    state.activeCashRegister.movements.push(mov);
    state.movementModalOpen=false; state.movementAmount=''; state.movementNote=''; state.movementError='';
    showToast(state.movementType==='retiro'?'Retiro registrado':'Ingreso registrado');
  }catch(e){ console.error(e); showToast('No se pudo registrar el movimiento'); }
  render();
}
function renderCashPanelModal(){
  const cr = state.activeCashRegister;
  const movs = cr.movements||[];
  const totalRetiros = movs.filter(m=>m.type==='retiro').reduce((s,m)=>s+m.amount,0);
  const totalIngresos = movs.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.amount,0);
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.cashPanelOpen=false;render();}">
    <div class="modal">
      <h3>Caja · ${cr.centerName}</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">Abierta por ${cr.cashierName} desde ${new Date(cr.openedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</p>
      <div class="order-detail" style="margin-bottom:12px;">
        <div><span>Fondo inicial</span><span>${money(cr.openingAmount)}</span></div>
        <div><span>Ingresos registrados</span><span>${money(totalIngresos)}</span></div>
        <div><span>Retiros registrados</span><span>-${money(totalRetiros)}</span></div>
      </div>
      ${movs.length ? `
        <div style="max-height:150px;overflow-y:auto;margin-bottom:14px;">
          ${movs.slice().reverse().map(m=>`
            <div class="sale-item" style="font-size:12px;padding:6px 0;">
              <div class="name">${m.type==='retiro'?'↓ Retiro':'↑ Ingreso'}${m.note?` — ${m.note}`:''}</div>
              <div style="font-weight:700;">${m.type==='retiro'?'-':''}${money(m.amount)}</div>
            </div>`).join('')}
        </div>` : ''}
      <button class="btn-primary" style="margin-bottom:8px;" onclick="state.cashPanelOpen=false;state.movementModalOpen=true;render()">Registrar retiro / ingreso</button>
      <button class="btn-primary" style="background:var(--navy);margin-bottom:0;" onclick="state.cashPanelOpen=false;openCashClose()">Cerrar caja</button>
      <button class="btn-secondary" onclick="state.cashPanelOpen=false;render()">Cerrar</button>
    </div>
  </div>`;
}
function renderMovementModal(){
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.movementModalOpen=false;render();}">
    <div class="modal" style="max-width:360px;">
      <h3>Registrar movimiento</h3>
      <div class="pay-row" style="margin:14px 0 12px;">
        <button class="pay-btn ${state.movementType==='retiro'?'active':''}" onclick="state.movementType='retiro';render()">Retiro</button>
        <button class="pay-btn ${state.movementType==='ingreso'?'active':''}" onclick="state.movementType='ingreso';render()">Ingreso</button>
      </div>
      <input class="field-input" type="number" inputmode="decimal" placeholder="Monto" value="${state.movementAmount}" oninput="state.movementAmount=this.value">
      <input class="field-input" type="text" placeholder="Motivo (opcional)" value="${state.movementNote}" oninput="state.movementNote=this.value">
      <div class="err">${state.movementError||''}</div>
      <button class="btn-primary" onclick="saveCashMovement()">Guardar</button>
      <button class="btn-secondary" onclick="state.movementModalOpen=false;render()">Cancelar</button>
    </div>
  </div>`;
}

async function openCashClose(){
  state.closingLoading = true; render();
  try{
    const snap = await db.collection('sales').where('cashRegisterId','==', state.activeCashRegister.id).get();
    const sales = snap.docs.map(d=>d.data());
    const byPayment = {};
    PAY_METHODS.forEach(m=>byPayment[m]=0);
    let total=0;
    sales.forEach(s=>{ const m = byPayment.hasOwnProperty(s.paymentMethod) ? s.paymentMethod : 'Efectivo'; byPayment[m]=(byPayment[m]||0)+(s.total||0); total+=s.total||0; });
    const movs = state.activeCashRegister.movements||[];
    const ingresos = movs.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.amount,0);
    const retiros = movs.filter(m=>m.type==='retiro').reduce((s,m)=>s+m.amount,0);
    const expectedCash = (state.activeCashRegister.openingAmount||0) + (byPayment['Efectivo']||0) + ingresos - retiros;
    state.closingSummary = { salesCount: sales.length, total, byPayment, ingresos, retiros, expectedCash };
    state.closingCountedCash=''; state.closingNotes=''; state.closingError='';
    state.closingOpen = true;
  }catch(e){ console.error(e); showToast('No se pudo preparar el cierre de caja'); }
  state.closingLoading=false; render();
}
function renderCashCloseScreen(){
  const s = state.closingSummary, cr = state.activeCashRegister;
  if(!s) return `<div class="loading-screen">Preparando cierre…</div>`;
  const hasCounted = state.closingCountedCash.trim()!=='';
  const counted = Number(state.closingCountedCash)||0;
  const diff = hasCounted ? (counted - s.expectedCash) : null;
  return `<div class="receipt-screen"><div class="receipt-card" style="max-width:400px;text-align:left;">
    <h2 style="text-align:center;margin-bottom:14px;">Cerrar caja</h2>
    <div class="order-detail" style="margin-bottom:12px;">
      <div><span>Cajero</span><span>${cr.cashierName}</span></div>
      <div><span>Centro</span><span>${cr.centerName}</span></div>
      <div><span>Fondo inicial</span><span>${money(cr.openingAmount)}</span></div>

      <div><span>Retiros de caja</span><span>-${money(s.retiros)}</span></div>
      <div style="font-weight:800;border-top:1px dashed var(--border);margin-top:6px;padding-top:6px;"><span>Efectivo esperado</span><span>${money(s.expectedCash)}</span></div>

    ${diff!==null ? `<div style="text-align:center;font-weight:700;margin:-4px 0 10px;color:${diff===0?'var(--green)':(diff>0?'var(--amber)':'var(--rose)')};">${diff===0?'Cuadra exacto':(diff>0?`Sobrante de ${money(diff)}`:`Faltante de ${money(Math.abs(diff))}`)}</div>` : ''}

    <button class="btn-secondary" onclick="state.closingOpen=false;render()">Cancelar</button>
  </div></div>`;
}
async function confirmCashClose(){
  if(state.closingCountedCash.trim()===''){ state.closingError='Ingresa el efectivo contado'; render(); return; }
  const counted = Number(state.closingCountedCash);
  if(isNaN(counted) || counted<0){ state.closingError='Monto inválido'; render(); return; }
  const s = state.closingSummary;
  const diff = counted - s.expectedCash;
  const payload = {
    status:'cerrada', closedAt: new Date().toISOString(),
    salesCount: s.salesCount, totalSales: s.total, salesByPayment: s.byPayment,
    cashIngresos: s.ingresos, cashRetiros: s.retiros,
    expectedCash: s.expectedCash, countedCash: counted, difference: diff,
    closingNotes: state.closingNotes.trim(),
  };
  try{
    await db.collection('cashRegisters').doc(state.activeCashRegister.id).update(payload);
  }catch(e){ console.error(e); showToast('No se pudo cerrar la caja'); return; }
  showToast('Caja cerrada');
  state.activeCashRegister=null; state.cashRegisterChecked=false; state.closingOpen=false; state.closingSummary=null;
  state.activeCashier=null; state.pinConfirmed=false; state.cart={};
  render();
}

function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function effectivePrice(p){ return (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : p.price; }
function cartKey(productId, variantId){ return variantId ? `${productId}::${variantId}` : productId; }
function parseCartKey(key){
  const parts = key.split('::');
  const p = state.products.find(x=>x.id===parts[0]);
  const v = (parts[1] && p) ? (p.variants||[]).find(x=>x.id===parts[1]) : null;
  return {p, v};
}
function itemPrice(p, v){ return v && v.priceOverride>0 ? v.priceOverride : effectivePrice(p); }
function itemStockPOS(p, v){ return v ? (v.stock||0) : centerStock(p, state.activeCenter.id); }
function variantLabel(v){ return v ? Object.values(v.combo||{}).join(' / ') : ''; }
function cartTotal(){ return Object.entries(state.cart).reduce((s,[key,qty])=>{const {p,v}=parseCartKey(key); return s+(p?itemPrice(p,v)*qty:0);},0); }
function addToCart(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  if(p.variantGroups && p.variantGroups.length){ state.variantPickerProduct = id; render(); return; }
  const available = centerStock(p, state.activeCenter.id);
  if(available<=(state.cart[id]||0)){ showToast(`Sin existencias suficientes en ${state.activeCenter.name}`); return; }
  state.cart[id]=(state.cart[id]||0)+1; render();
}
function pickVariant(variantId){
  const p = state.products.find(x=>x.id===state.variantPickerProduct);
  const v = (p.variants||[]).find(x=>x.id===variantId);
  const key = cartKey(p.id, variantId);
  if(itemStockPOS(p,v)<=(state.cart[key]||0)){ showToast('Sin existencias suficientes de esta variante'); return; }
  state.cart[key] = (state.cart[key]||0)+1;
  state.variantPickerProduct = null;
  render();
}
function changeQty(id,delta){ const cur=state.cart[id]||0; const next=cur+delta; if(next<=0) delete state.cart[id]; else state.cart[id]=next; render(); }

/* ============== AJUSTE POR ENVÍO (descuento manual) ==============
   Adicional a los descuentos y promociones ya aplicados en el precio de cada
   producto; requiere siempre un motivo de justificación. */
function saleTotal(){ return Math.max(0, cartTotal() - (state.manualDiscount?state.manualDiscount.amount:0)); }
function openDiscountModal(){
  state.discountAmountInput = state.manualDiscount ? String(state.manualDiscount.amount) : '';
  state.discountReasonInput = state.manualDiscount ? state.manualDiscount.reason : '';
  state.discountError = ''; state.discountModalOpen = true; render();
}
function saveManualDiscount(){
  const amount = Number(state.discountAmountInput);
  const reason = state.discountReasonInput.trim();
  if(state.discountAmountInput.trim()==='' || isNaN(amount) || amount<=0){ state.discountError='Ingresa un monto válido'; render(); return; }
  if(!reason){ state.discountError='Escribe un motivo para el ajuste'; render(); return; }
  state.manualDiscount = {amount, reason};
  state.discountModalOpen = false; render();
}
function removeManualDiscount(){ state.manualDiscount=null; state.discountModalOpen=false; render(); }
function renderDiscountModal(){
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.discountModalOpen=false;render();}">

      <input class="field-input" type="number" inputmode="decimal" placeholder="Monto del ajuste" value="${state.discountAmountInput}" oninput="state.discountAmountInput=this.value">
      <input class="field-input" type="text" placeholder="Motivo (obligatorio)" value="${state.discountReasonInput}" oninput="state.discountReasonInput=this.value">
      <div class="err">${state.discountError||''}</div>
      <button class="btn-primary" onclick="saveManualDiscount()">Aplicar ajuste</button>
      ${state.manualDiscount ? `<button class="btn-secondary" onclick="removeManualDiscount()">Quitar ajuste</button>` : ''}

async function chargeSale(){
  if(cartCount()===0 || state.sending) return;
  if(!state.activeCashRegister){ showToast('Abre la caja antes de vender'); return; }
  state.sending = true; render();
  const centerId = state.activeCenter.id;
  const items = Object.entries(state.cart).map(([key,qty])=>{
    const {p,v} = parseCartKey(key);
    return {id:p.id, variantId: v?v.id:null, name: p.name+(v?` (${variantLabel(v)})`:''), price:itemPrice(p,v), qty};
  });
  const subtotal = items.reduce((s,it)=>s+it.price*it.qty,0);
  const discountAmount = state.manualDiscount ? Math.min(state.manualDiscount.amount, subtotal) : 0;
  const total = subtotal - discountAmount;
  try{
    const orderNumber = await getNextOrderNumber();
    await Promise.all(items.map(it=>{
      const p = state.products.find(x=>x.id===it.id);
      if(it.variantId){
        const v = (p.variants||[]).find(x=>x.id===it.variantId);
        v.stock = Math.max(0, (v.stock||0) - it.qty);
        p.stock = Math.max(0, (p.stock||0) - it.qty);
        return db.collection('products').doc(it.id).update({variants: p.variants, stock: p.stock});
      }
      if(!p.stockByCenter) p.stockByCenter = {};
      p.stockByCenter[centerId] = Math.max(0, (p.stockByCenter[centerId]||0) - it.qty);
      p.stock = Math.max(0, (p.stock||0) - it.qty);
      return db.collection('products').doc(it.id).update({stockByCenter: p.stockByCenter, stock: p.stock});
    }));
    await db.collection('sales').add({
      date: new Date().toISOString(), orderNumber, source:"pos",
      cashierId: state.activeCashier.id, cashierName: state.activeCashier.name,
      centerId, centerName: state.activeCenter.name,
      cashRegisterId: state.activeCashRegister.id,
      items, subtotal, total, paymentMethod: state.payMethod,
      manualDiscount: state.manualDiscount ? {amount: discountAmount, reason: state.manualDiscount.reason} : null,
      customerId: state.activeCustomer ? state.activeCustomer.id : null,
      customerName: state.activeCustomer ? state.activeCustomer.name : null,
      customerPhone: state.activeCustomer ? (state.activeCustomer.phone||'') : null,
      notes: state.saleNotes || '',
    });
    state.lastSaleTotal = total; state.lastOrderNumber = orderNumber; state.cart = {}; state.saleDone = true;
    state.manualDiscount = null; state.activeCustomer = null; state.saleNotes = '';
  }catch(e){
    console.error(e); showToast('No se pudo registrar la venta');
  }
  state.sending = false; render();
}

  return `

function render(){

  if(!state.authChecked){ root.innerHTML = `<div class="loading-screen">Verificando sesión…</div>`; return; }

  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando…</div>`; return; }
  if(!state.activeCashier){ root.innerHTML = renderCashierSelect(); }
  else if(!state.pinConfirmed){ root.innerHTML = renderPinScreen(); }
  else if(!state.activeCenter){ root.innerHTML = renderCenterSelect(); }
  else if(!state.cashRegisterChecked){
    if(!state.cashRegisterLoading) loadCashRegister();
    root.innerHTML = `<div class="loading-screen">Verificando caja…</div>`;
  }
  else if(!state.activeCashRegister){ root.innerHTML = renderCashOpenScreen(); }
  else{
    let html = state.saleDone ? renderReceipt() : (state.closingLoading ? `<div class="loading-screen">Preparando cierre…</div>` : (state.closingOpen ? renderCashCloseScreen() : renderPOS()));
    if(state.cashPanelOpen) html += renderCashPanelModal();
    if(state.movementModalOpen) html += renderMovementModal();
    if(state.customerPickerOpen) html += renderCustomerPickerModal();
    if(state.discountModalOpen) html += renderDiscountModal();
    if(state.notesModalOpen) html += renderNotesModal();
    root.innerHTML = html;
  }
  if(!document.getElementById('toast')){ const t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
}
render();
</script>
</body>
</html>
