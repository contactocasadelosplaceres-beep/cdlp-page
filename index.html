<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Casa de los Placeres — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style id="custom-css-injected"></style>
<style>
  :root{
    --bg: #FBF5F2; --surface: #FFFFFF; --surface-soft: #F6E9E6;
    --ink: #2B1620; --ink-soft: #6E5560;
    --primary: #993477; --primary-deep: #5C1F49; --rose: #BC355C;
    --coral: #ED7578; --amber: #F6A030; --green: #7AB71A; --teal: #20B7CA; --navy: #0A4A5B;
    --border: #EBD9D3; --radius-card: 16px; --radius-pill: 999px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;position:relative;}
  h1,h2,h3,.display{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit;touch-action:manipulation;}
  a{touch-action:manipulation;}
  img{max-width:100%;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1160px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ===== HEADER ===== */
  .topbar{position:fixed;top:0;left:0;right:0;width:100%;z-index:30;background:var(--primary-deep);color:#fff;box-shadow:0 6px 20px -12px rgba(0,0,0,0.4);}
  .topbar-spacer{width:100%;}
  .topbar-main{padding:12px 16px;display:flex;align-items:center;gap:12px;}
  .brand{display:flex;align-items:center;gap:9px;flex-shrink:0;padding:0;margin:0;}
  .brand-mark-img{width:32px;height:32px;border-radius:9px;object-fit:cover;flex-shrink:0;display:block;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--rose),var(--amber));flex-shrink:0;display:none;}
  .brand-text{line-height:1.15;}
  .brand-name{font-family:'League Spartan',sans-serif;font-size:15.5px;font-weight:700;white-space:nowrap;}
  .brand-sub{font-size:10.5px;color:#e9c9dc;letter-spacing:0.02em;}
  .header-nav{display:none;flex:1;justify-content:center;gap:22px;font-size:13.5px;font-weight:600;}
  .header-nav a{opacity:.88;white-space:nowrap;}
  .header-nav a:hover{opacity:1;}
  @media(min-width:860px){.header-nav{display:flex;}}
  .header-actions{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0;}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,0.12);}
  .cart-btn{position:relative;background:rgba(255,255,255,0.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cart-count{position:absolute;top:2px;right:2px;background:var(--amber);color:#3a2200;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--primary-deep);}
  .search-bar{overflow:hidden;max-height:0;transition:max-height .2s ease;}
  .search-bar.open{max-height:60px;}
  .search-bar-inner{padding:0 16px 12px;}
  .search-input{width:100%;padding:12px 14px;border-radius:var(--radius-pill);border:none;font-size:16px;font-family:inherit;background:rgba(255,255,255,0.14);color:#fff;}
  .search-input::placeholder{color:#e9c9dc;}
  @media(max-width:359px){
    .topbar-main{padding:10px 12px;gap:8px;}
    .brand-name{font-size:14px;}
    .brand-sub{display:none;}
    .cart-btn{width:40px;height:40px;}
    .icon-btn{width:40px;height:40px;}
  }


  /* ===== HERO ===== */
  .hero{position:relative;padding:34px 20px 24px;background:linear-gradient(180deg,var(--primary-deep) 0%,var(--primary-deep) 58%,var(--bg) 58%);}
  .hero-inner{background:var(--surface);border-radius:20px;padding:28px 24px;box-shadow:0 20px 40px -24px rgba(74,22,66,0.5);}
  .hero h1{font-size:27px;font-weight:800;color:var(--primary-deep);max-width:480px;line-height:1.14;}
  .hero p{margin-top:10px;color:var(--ink-soft);max-width:460px;font-size:14.5px;line-height:1.55;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .hero-btn-primary{background:var(--rose);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;}
  .hero-btn-ghost{background:var(--surface-soft);color:var(--primary-deep);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;}
  .hero-btn-wa{color:var(--green);padding:12px 6px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  @media(max-width:359px){
    .hero{padding:24px 14px 20px;}
    .hero-inner{padding:20px 16px;border-radius:16px;}
    .hero h1{font-size:22px;}
    .hero p{font-size:13.5px;}
    .hero-btn-primary,.hero-btn-ghost{padding:11px 16px;font-size:13px;}
  }

  /* ===== TRUST BAR ===== */
  .trust-bar{display:flex;overflow-x:auto;gap:0;padding:18px 20px;scrollbar-width:none;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;}
  .trust-bar::-webkit-scrollbar{display:none;}
  .trust-item{flex-shrink:0;display:flex;align-items:center;gap:8px;padding-right:26px;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .trust-item .ic{font-size:16px;}
  @media(min-width:860px){.trust-bar{justify-content:space-between;}.trust-item{padding-right:0;}}

  /* ===== QUÉ BUSCAS ===== */
  .needs-block{padding:30px 20px 6px;}
  .needs-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .needs-row::-webkit-scrollbar{display:none;}
  .need-pill{flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--primary-deep);padding:12px 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;text-decoration:none;}
  .need-pill:hover{border-color:var(--primary);}
  .need-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ===== GENERIC SECTION ===== */
  .section-block{padding:32px 20px 6px;}
  .section-heading{font-family:'League Spartan',sans-serif;font-size:20px;font-weight:800;color:var(--primary-deep);}
  .section-sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .section-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;}

  /* ===== CATEGORY CHIPS ===== */
  .cats{display:flex;gap:8px;overflow-x:auto;padding:26px 20px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;padding:10px 16px;min-height:40px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);font-size:13.5px;font-weight:600;white-space:nowrap;}
  .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ===== PRODUCT GRID / CARD ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 16px 8px;}
  @media(min-width:400px){.grid{gap:16px;padding:16px 20px 8px;}}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:visible;display:flex;flex-direction:column;transition:transform .15s ease;cursor:pointer;}
  .card:active{transform:scale(0.98);}
  .card-media{position:relative;}
  .card-image-wrap{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius-card) var(--radius-card) 0 0;background:linear-gradient(135deg,var(--surface-soft),var(--border));}
  .card-image-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-image-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;}
  .badge-row{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:9.5px;font-weight:700;padding:5px 9px;border-radius:7px;letter-spacing:0.02em;color:#fff;}
  .badge-stock{background:rgba(43,22,32,0.78);}
  .badge-best{background:var(--amber);color:#3a2200;}
  .fab-add{position:absolute;bottom:-18px;right:10px;width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -6px rgba(110,33,89,0.55);}
  .fab-add:disabled{opacity:.4;}
  .card-body{padding:24px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card-cat{min-width:0;font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
  .card-name{min-width:0;overflow-wrap:anywhere;word-break:break-word;font-size:14px;font-weight:700;line-height:1.25;font-family:'League Spartan',sans-serif;}
  .card-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-price{font-weight:800;color:var(--primary-deep);font-size:15px;margin-top:2px;}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}

  /* ===== FIRST-TIME BAND ===== */
  .first-band{margin:34px 20px 6px;border-radius:20px;background:linear-gradient(135deg,var(--amber),#f7b658);padding:28px 24px;color:#3a2200;}
  .first-band h3{font-size:19px;font-weight:800;max-width:340px;}
  .first-band p{margin-top:8px;font-size:13.5px;line-height:1.5;max-width:380px;opacity:.92;}
  .first-band .hero-btn-ghost{background:rgba(255,255,255,0.55);color:#3a2200;margin-top:14px;display:inline-block;}

  /* ===== PROMO BANNER ===== */
  .promo-banner{margin:0 20px 6px;border-radius:20px;overflow:hidden;background:var(--surface-soft);border:1px solid var(--border);display:flex;flex-direction:column;}
  @media(min-width:640px){.promo-banner{flex-direction:row;align-items:stretch;}}
  .promo-banner-img{width:100%;max-height:220px;object-fit:cover;display:block;}
  @media(min-width:640px){.promo-banner-img{width:38%;max-height:none;}}
  .promo-banner-body{padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .promo-banner-title{font-family:'League Spartan',sans-serif;font-size:20px;font-weight:800;color:var(--rose);}
  .promo-banner-text{color:var(--ink-soft);font-size:13.5px;line-height:1.5;}
  .btn-promo{align-self:flex-start;margin-top:6px;background:var(--rose);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;}

  /* ===== KITS ===== */
  .kits-row{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 20px 8px;}
  @media(min-width:640px){.kits-row{grid-template-columns:repeat(2,1fr);}}
  .kit-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;}
  .kit-thumb{width:64px;height:64px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--surface-soft),var(--border));display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px;color:#fff;}
  .kit-thumb img{width:100%;height:100%;object-fit:cover;}
  .kit-info{flex:1;min-width:0;}
  .kit-name{font-weight:700;font-size:14px;font-family:'League Spartan',sans-serif;}
  .kit-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .kit-price{font-weight:800;color:var(--primary-deep);font-size:14.5px;margin-top:6px;}
  .kit-add{background:var(--primary);color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:700;flex-shrink:0;}

  /* ===== TESTIMONIALS ===== */
  .rating-line{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
  .rating-stars{color:var(--amber);font-size:15px;letter-spacing:1px;}
  .rating-num{font-weight:800;color:var(--primary-deep);font-size:15px;}
  .rating-label{font-size:12.5px;color:var(--ink-soft);}
  .testimonial-row{display:grid;grid-template-columns:1fr;gap:12px;padding:0 20px 6px;}
  @media(min-width:640px){.testimonial-row{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:980px){.testimonial-row{grid-template-columns:repeat(3,1fr);}}
  .testimonial-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;color:var(--ink);line-height:1.5;}
  .testimonial-card .stars{color:var(--amber);font-size:12px;margin-bottom:6px;display:block;}
  .testimonial-card p{margin:0;}
  .testimonial-name{margin-top:10px;font-size:11.5px;color:var(--ink-soft);font-weight:700;}

  /* ===== DISCRETION BAND ===== */
  .discretion-band{margin:34px 0 0;background:var(--navy);color:#fff;padding:36px 20px;}
  .discretion-inner{max-width:1160px;margin:0 auto;}
  .discretion-band h3{font-size:20px;font-weight:800;max-width:360px;}
  .discretion-band>.discretion-inner>p{margin-top:8px;color:#bcd6dc;font-size:13.5px;max-width:420px;line-height:1.55;}
  .discretion-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px;}
  @media(min-width:640px){.discretion-grid{grid-template-columns:repeat(4,1fr);}}
  .discretion-item{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#e3eef0;}
  .discretion-item .ic{font-size:20px;}

  /* ===== WHATSAPP CTA ===== */
  .newsletter-block{text-align:center;background:var(--surface-soft);border-radius:20px;margin:34px 20px 6px;padding:32px 20px;}
  .newsletter-block .section-heading{margin-bottom:8px;}
  .newsletter-text{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;max-width:360px;margin-left:auto;margin-right:auto;}

  /* ===== CART / CHECKOUT (unchanged behavior) ===== */
  .overlay{position:fixed;inset:0;background:rgba(43,22,32,0.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:400px;background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .drawer-head h2{font-size:18px;color:var(--primary-deep);font-weight:700;}
  .close-x{background:none;color:var(--ink-soft);font-size:20px;line-height:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:-8px;}

  /* ===== FICHA DE PRODUCTO (GALERÍA) ===== */
  .drawer.drawer-detail{max-width:480px;}
  .detail-main-img-wrap{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface-soft);flex-shrink:0;touch-action:pan-y;}
  .detail-main-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .detail-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(43,22,32,0.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .detail-nav-btn.prev{left:10px;}
  .detail-nav-btn.next{right:10px;}
  .detail-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .detail-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.6);transition:width .15s ease;}
  .detail-dot.active{background:#fff;width:18px;border-radius:4px;}
  .detail-thumbs{display:flex;gap:8px;padding:10px 20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .detail-thumbs::-webkit-scrollbar{display:none;}
  .detail-thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;border:2px solid transparent;flex-shrink:0;padding:0;margin:0;}
  .detail-thumb.active{border-color:var(--primary);}
  .detail-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .detail-info{padding:6px 20px 16px;}
  .detail-cat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;letter-spacing:.04em;}
  .detail-name{font-size:19px;font-weight:800;font-family:'League Spartan',sans-serif;color:var(--ink);margin:4px 0 8px;line-height:1.25;}
  .detail-price{font-size:20px;font-weight:800;color:var(--primary-deep);margin-bottom:4px;}
  .detail-stock{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .detail-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap;}
  .detail-qty-row{display:flex;align-items:center;gap:12px;margin:16px 0 4px;}
  .drawer-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px;}
  .cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .cart-item-swatch{width:48px;height:48px;border-radius:10px;flex-shrink:0;object-fit:cover;}
  .cart-item-info{flex:1;}
  .cart-item-name{font-size:13.5px;font-weight:700;}
  .cart-item-price{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .qty-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .qty-btn{width:32px;height:32px;border-radius:8px;background:var(--surface-soft);color:var(--primary-deep);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qty-val{font-size:13px;font-weight:700;min-width:20px;text-align:center;}
  .remove-link{font-size:11.5px;color:var(--rose);margin-left:auto;font-weight:600;padding:8px 0 8px 8px;}
  .drawer-foot{padding:16px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
  .total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:800;margin-bottom:12px;color:var(--primary-deep);}
  .btn-primary{width:100%;background:var(--rose);color:#fff;padding:14px;min-height:48px;border-radius:12px;font-size:14.5px;font-weight:700;display:block;text-align:center;text-decoration:none;}
  .btn-secondary{width:100%;background:var(--surface-soft);color:var(--primary-deep);padding:14px;min-height:48px;border-radius:12px;font-size:14px;font-weight:700;margin-top:8px;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input,.form-field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:16px;font-family:inherit;background:var(--bg);color:var(--ink);}
  .form-field textarea{resize:vertical;min-height:60px;}
  .note-box{background:var(--surface-soft);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-deep);color:#fff;padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-family:'League Spartan',sans-serif;text-align:center;padding:20px;}
  .success-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .success-card{background:#fff;border-radius:18px;padding:34px 26px;max-width:360px;text-align:center;}
  .success-card .mark{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
  .success-card h2{color:var(--primary-deep);font-size:19px;margin-bottom:8px;font-weight:700;}

<body>
<div id="root"></div>
<script>
/* ============== FIREBASE ============== */
const firebaseConfig = {
  apiKey: "AIzaSyAhPrEfQSfWOjP2X7GtcXKp86RMWHZa-NQ",
  authDomain: "casa-de-los-placeres.firebaseapp.com",
  projectId: "casa-de-los-placeres",
  storageBucket: "casa-de-los-placeres.firebasestorage.app",
  messagingSenderId: "689677749733",
  appId: "1:689677749733:web:3cc2900d04a78b652cf30c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Folio consecutivo compartido con el Punto de Venta: cada pedido/venta obtiene
// un número único e incremental (#0001, #0002, ...) sin importar de dónde venga.
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}
function formatFolio(n){ return n ? '#' + String(n).padStart(4,'0') : ''; }

const PALETTE = ["#BC355C","#993477","#20B7CA","#0A4A5B","#ED7578","#5C1F49","#F6A030","#7AB71A","#8a6b78","#993477","#20B7CA","#7AB71A"];
const ICONS = ["✦","●","◐","▲","♥","◆","■","◯","✧","✺","❖","✤"];
const DEFAULT_CATEGORIES = ["Juguetes","Dildos","Lubricantes","Plugs","Ropa interior","Masturbadores","Dilatadores","Anillos","Otros"];
const NEEDS = [
  {key:'para-mi', label:'Para mí'},
  {key:'para-pareja', label:'Para mi pareja'},
  {key:'para-ella', label:'Para ella'},
  {key:'para-el', label:'Para él'},
  {key:'compartir-pareja', label:'Para compartir en pareja'},
  {key:'empezando', label:'Estoy empezando'},
];
function catColor(cat){ const i = state.settings.categories.indexOf(cat); return PALETTE[(i<0?0:i) % PALETTE.length]; }
function catIcon(cat){ const i = state.settings.categories.indexOf(cat); return ICONS[(i<0?0:i) % ICONS.length]; }

const DEFAULT_SECTIONS = [
  {key:"hero", label:"Mensaje de bienvenida", visible:true},
  {key:"featured", label:"Más vendidos", visible:false},
  {key:"categories", label:"Categorías principales", visible:true},
  {key:"promoBanner", label:"Banner promocional", visible:false},
  {key:"grid", label:"Catálogo completo", visible:true},
  {key:"testimonials", label:"Testimonios", visible:false},
  {key:"newsletter", label:"Contacto directo por WhatsApp", visible:false},
  {key:"footer", label:"Pie de página", visible:true},
];
const DEFAULT_SETTINGS = {
  storeName:"La Casa de los Placeres", whatsapp:"523317494004",
  schedule:"Lun–Vie 10am–9pm · Sáb 10am–2pm",
  heroTitle:"Descubre nuevas formas de disfrutar.",
  heroSubtitle:"Explora nuestro catálogo, recibe tu pedido en la comodidad de tu casa y compra con total discreción.",
  categories:[...DEFAULT_CATEGORIES],
  sections: JSON.parse(JSON.stringify(DEFAULT_SECTIONS)),
  headerSubtitle:"Discreto · Confidencial · A domicilio",
  showHeaderSubtitle:true,
  promoBanner:{title:"", text:"", image:"", buttonText:"", buttonLink:""},
  featuredProductIds:[],
  testimonials:[],
  socialInstagram:"", socialFacebook:"", contactEmail:"",
  customCss:"",
};

let state = { products:[], settings:{...DEFAULT_SETTINGS}, cart:{}, activeCat:"Todos", activeNeed:null, searchQuery:"", searchOpen:false, cartOpen:false, checkoutOpen:false, profileOpen:false, orderPlaced:false, loaded:false, loadError:false, detailProductId:null, detailImageIndex:0, lastOrderNumber:null, gridRenderLimit:20, submittingOrder:false };

async function loadData(){
  try{
    const [prodSnap, setSnap] = await Promise.all([
      db.collection('products').orderBy('name').limit(40).get(),
      db.collection('settings').doc('store').get(),
    ]);
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.settings = setSnap.exists ? {...DEFAULT_SETTINGS, ...setSnap.data()} : {...DEFAULT_SETTINGS};
    if(!state.settings.categories || !state.settings.categories.length) state.settings.categories = [...DEFAULT_CATEGORIES];
    if(!state.settings.sections || !state.settings.sections.length) state.settings.sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
    if(!state.settings.promoBanner) state.settings.promoBanner = {title:"",text:"",image:"",buttonText:"",buttonLink:""};
    if(!state.settings.featuredProductIds) state.settings.featuredProductIds = [];
    if(!state.settings.testimonials) state.settings.testimonials = [];
  }catch(e){
    console.error(e);
    state.products = []; state.settings = {...DEFAULT_SETTINGS}; state.loadError = true;
  }
  state.loaded = true; render();
  const cssTag = document.getElementById('custom-css-injected');
  if(cssTag) cssTag.textContent = state.settings.customCss || '';
  trackVisit();
  // En segundo plano, sin bloquear la primera pantalla: trae el resto del catálogo
  // completo para que la búsqueda y los filtros funcionen sobre todos los productos.
  if(!state.loadError){
    db.collection('products').orderBy('name').get().then(fullSnap=>{
      state.products = fullSnap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }).catch(e=>console.error('No se pudo completar el catálogo en segundo plano', e));
  }
}
function trackVisit(){
  try{ db.collection('visits').add({date: new Date().toISOString()}); }catch(e){ /* silencioso */ }
}

function money(n){ return '$' + Number(Math.round(n)).toLocaleString('es-MX') + ' MXN'; }
function showToast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer); window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(state.cart).reduce((s,[id,qty])=>{const p=state.products.find(x=>x.id===id);return s+(p?p.price*qty:0);},0); }
function waLink(msg){ const num=(state.settings.whatsapp||'').replace(/\D/g,''); return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`; }

function addToCart(id){
  const p = state.products.find(x=>x.id===id);
  if(!p || p.stock<=0){ showToast('Sin existencias'); return; }
  state.cart[id]=(state.cart[id]||0)+1; showToast('Agregado al carrito'); render();
}
function changeQty(id,delta){ const cur=state.cart[id]||0; const next=cur+delta; if(next<=0) delete state.cart[id]; else state.cart[id]=next; render(); }
function removeFromCart(id){ delete state.cart[id]; render(); }

function scrollToId(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
function goHome(){ state.searchQuery=''; state.activeCat='Todos'; state.activeNeed=null; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function goToFeatured(){
  const el = document.getElementById('destacados');
  if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
  else { goToCatalog('Todos'); }
}
function openProductDetail(id){ state.detailProductId=id; state.detailImageIndex=0; render(); }
function closeProductDetail(){ state.detailProductId=null; render(); }
function setDetailImage(idx){ state.detailImageIndex=idx; render(); }
function detailPrevImage(){
  const p = state.products.find(x=>x.id===state.detailProductId); if(!p) return;
  const n = (p.images&&p.images.length) || 1;
  state.detailImageIndex = (state.detailImageIndex - 1 + n) % n; render();
}
function detailNextImage(){
  const p = state.products.find(x=>x.id===state.detailProductId); if(!p) return;
  const n = (p.images&&p.images.length) || 1;
  state.detailImageIndex = (state.detailImageIndex + 1) % n; render();
}
let detailTouchStartX = null;
function detailTouchStart(e){ detailTouchStartX = (e.touches?e.touches[0]:e).clientX; }
function detailTouchEnd(e){
  if(detailTouchStartX===null) return;
  const endX = (e.changedTouches?e.changedTouches[0]:e).clientX;
  const delta = endX - detailTouchStartX;
  detailTouchStartX = null;
  if(Math.abs(delta) < 40) return;
  if(delta < 0) detailNextImage(); else detailPrevImage();
}
function goToCatalog(cat){ state.activeCat=cat||'Todos'; state.activeNeed=null; state.searchQuery=''; state.gridRenderLimit=20; render(); requestAnimationFrame(()=>scrollToId('catalogo')); }
function filterByNeed(key){ state.activeNeed=key; state.activeCat='Todos'; state.searchQuery=''; state.gridRenderLimit=20; render(); requestAnimationFrame(()=>scrollToId('catalogo')); }
function onSearchInput(v){ state.searchQuery=v; state.activeCat='Todos'; state.activeNeed=null; state.gridRenderLimit=20; render(); const i=document.getElementById('search-input'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length);} }

async function submitOrder(formData){
  const items = Object.entries(state.cart).map(([id,qty])=>{const p=state.products.find(x=>x.id===id);return {id,name:p.name,price:p.price,qty};});
  const orderNumber = await getNextOrderNumber();
  const order = { date:new Date().toISOString(), orderNumber, source:"tienda", customer:formData.name, phone:formData.phone, address:formData.address, notes:formData.notes, items, total: items.reduce((s,it)=>s+it.price*it.qty,0), status:"Nuevo" };
  try{ await db.collection('orders').add(order); }
  catch(e){ console.error(e); showToast('No se pudo enviar el pedido, intenta de nuevo'); state.submittingOrder=false; render(); return; }
  state.cart = {}; state.checkoutOpen=false; state.cartOpen=false; state.orderPlaced=true; state.lastOrderNumber=orderNumber; state.submittingOrder=false; render();

  const lines = items.map(it=>`• ${it.qty}x ${it.name} — ${money(it.price*it.qty)}`).join('%0A');
  const msg = `Hola, quiero confirmar mi pedido:%0A${lines}%0A%0ATotal: ${money(order.total)}%0ANombre: ${formData.name}%0ADirección: ${formData.address}%0APago contra entrega.`;
  if(state.settings.whatsapp){
    const num = state.settings.whatsapp.replace(/\D/g,'');
    window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
  }
}
function handleCheckoutSubmit(){
  if(state.submittingOrder) return; // evita doble envío si tocan el botón varias veces
  const name = document.getElementById('ck-name').value.trim();
  const phone = document.getElementById('ck-phone').value.trim();
  const address = document.getElementById('ck-address').value.trim();
  const notes = document.getElementById('ck-notes').value.trim();
  const remember = document.getElementById('ck-remember').checked;
  if(!name || !phone || !address){ showToast('Completa nombre, teléfono y dirección'); return; }
  if(remember){ saveCustomerProfile({name,phone,address,notes,remember:true}); }
  else{ clearCustomerProfile(); }
  state.submittingOrder = true; render();
  submitOrder({name,phone,address,notes});
}

/* ============== PERFIL DEL CLIENTE (guardado en este celular) ============== */
const PROFILE_KEY = 'cdlp_customer_profile';
function loadCustomerProfile(){
  try{ const raw = localStorage.getItem(PROFILE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveCustomerProfile(p){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }catch(e){ /* almacenamiento no disponible, se ignora */ }
}
function clearCustomerProfile(){
  try{ localStorage.removeItem(PROFILE_KEY); }catch(e){}
}
function openProfile(){ state.profileOpen = true; render(); }
function closeProfile(){ state.profileOpen = false; render(); }
function handleSaveProfile(){
  const name = document.getElementById('pf-cli-name').value.trim();
  const phone = document.getElementById('pf-cli-phone').value.trim();
  const address = document.getElementById('pf-cli-address').value.trim();
  if(!name || !phone){ showToast('Ponle al menos tu nombre y teléfono'); return; }
  saveCustomerProfile({name, phone, address, notes:'', remember:true});
  showToast('Tus datos quedaron guardados en este celular');
  closeProfile();
}
function handleForgetProfile(){
  clearCustomerProfile();
  showToast('Se borraron tus datos guardados');
  render();
}
function renderProfileDrawer(){
  const p = loadCustomerProfile() || {};
  return `
    <div class="drawer-head"><h2>Mis datos</h2><button class="close-x" onclick="closeProfile()">✕</button></div>
    <div class="drawer-body">
      <div class="note-box">Guarda tus datos en este celular para que tus próximos pedidos sean más rápidos. No se comparten con nadie más, ni requieren contraseña — solo quedan en este dispositivo.</div>
      <div class="form-field"><label>Nombre completo</label><input id="pf-cli-name" type="text" placeholder="Tu nombre" value="${(p.name||'').replace(/"/g,'&quot;')}"></div>
      <div class="form-field"><label>WhatsApp / Teléfono</label><input id="pf-cli-phone" type="tel" placeholder="33 1234 5678" value="${(p.phone||'').replace(/"/g,'&quot;')}"></div>
      <div class="form-field"><label>Dirección de entrega</label><textarea id="pf-cli-address" placeholder="Calle, número, colonia, referencias">${p.address||''}</textarea></div>
    </div>
    <div class="drawer-foot">
      <button class="btn-primary" onclick="handleSaveProfile()">Guardar mis datos</button>
      ${p.name ? `<button class="btn-secondary" onclick="handleForgetProfile()">Olvidar mis datos en este celular</button>` : ''}
    </div>`;
}

function renderProductDetailDrawer(){
  const p = state.products.find(x=>x.id===state.detailProductId);
  if(!p) return '';
  const images = (p.images && p.images.length) ? p.images : null;
  const idx = Math.min(state.detailImageIndex, images ? images.length-1 : 0);
  const qty = state.cart[p.id] || 0;
  return `
    <div class="drawer-head"><h2>Detalle del producto</h2><button class="close-x" onclick="closeProductDetail()">✕</button></div>
    <div class="drawer-body" style="padding:0;">
      <div class="detail-main-img-wrap" ontouchstart="detailTouchStart(event)" ontouchend="detailTouchEnd(event)">
        ${images
          ? `<img src="${images[idx]}" alt="${p.name}">`
          : `<div class="card-image-fallback" style="background:${catColor(p.cat)};height:100%;">${catIcon(p.cat)}</div>`}
        ${images && images.length>1 ? `
          <button class="detail-nav-btn prev" onclick="detailPrevImage()" aria-label="Imagen anterior">‹</button>
          <button class="detail-nav-btn next" onclick="detailNextImage()" aria-label="Siguiente imagen">›</button>
          <div class="detail-dots">${images.map((_,i)=>`<span class="detail-dot ${i===idx?'active':''}"></span>`).join('')}</div>
        ` : ''}
      </div>
      ${images && images.length>1 ? `
        <div class="detail-thumbs">
          ${images.map((src,i)=>`<button class="detail-thumb ${i===idx?'active':''}" onclick="setDetailImage(${i})"><img src="${src}" alt=""></button>`).join('')}
        </div>` : ''}
      <div class="detail-info">
        <div class="detail-cat">${p.cat}</div>
        <div class="detail-name">${p.name}</div>
        <div class="detail-price">${money(p.price)}</div>
        <div class="detail-stock">${p.stock<=0 ? 'Agotado' : p.stock<=3 ? `Últimas piezas (${p.stock})` : 'Disponible'}</div>
        ${p.desc ? `<div class="detail-desc">${p.desc}</div>` : ''}
      </div>
    </div>
    <div class="drawer-foot">
      ${qty>0 ? `
        <div class="detail-qty-row">
          <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
          <div class="qty-val">${qty} en tu carrito</div>
          <button class="qty-btn" ${p.stock<=qty?'disabled style="opacity:.4"':''} onclick="changeQty('${p.id}',1)">+</button>
        </div>
        <button class="btn-primary" onclick="closeProductDetail();state.cartOpen=true;render()">Ver carrito</button>
      ` : `
        <button class="btn-primary" ${p.stock<=0?'disabled style="opacity:.5"':''} onclick="addToCart('${p.id}')">${p.stock<=0?'Agotado':'Agregar al carrito · '+money(p.price)}</button>
      `}
    </div>`;
}

function productImageHtml(p){
  if(p.images && p.images.length){
    return `<img src="${p.images[0]}" alt="${p.name}" loading="lazy">`;
  }
  return `<div class="card-image-fallback" style="background:${catColor(p.cat)}">${catIcon(p.cat)}</div>`;
}

        </a>
        <button class="cart-btn" onclick="state.cartOpen=true;render()" aria-label="Carrito">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          ${cartCount()>0?`<span class="cart-count">${cartCount()}</span>`:''}
        </button>
      </div>
    </div>
    <div class="search-bar open" id="search-bar-mobile">

        <input id="search-input" class="search-input" type="search" placeholder="Buscar productos…" value="${state.searchQuery.replace(/"/g,'&quot;')}" oninput="onSearchInput(this.value)">
      </div>
    </div>
  `;
}

/* ============== HERO ============== */
function renderHeroSection(){
  return `
  <div class="hero">

function renderTrustBar(){
  const items = [
    {ic:'🔒', label:'Compra segura'},
    {ic:'📦', label:'Empaque discreto'},
    {ic:'💵', label:'Pago contra entrega'},
    {ic:'🏠', label:'Entrega a domicilio'},
    {ic:'💬', label:'Atención personalizada'},
  ];
  return `<div class="trust-bar">${items.map(i=>`<div class="trust-item"><span class="ic">${i.ic}</span>${i.label}</div>`).join('')}</div>`;
}

/* ============== QUÉ ESTÁS BUSCANDO (fixed, va directo a WhatsApp con intención) ============== */
function renderNeedsSection(){
  return `
  <div class="needs-block">
    <div class="section-heading">¿Qué estás buscando?</div>
    <div class="section-sub" style="margin-bottom:14px;">Elige una opción y te mostramos productos pensados para eso.</div>
    <div class="needs-row">${NEEDS.map(n=>`<button class="need-pill ${state.activeNeed===n.key?'active':''}" onclick="filterByNeed('${n.key}')">${n.label}</button>`).join('')}</div>
  </div>`;
}

/* ============== MÁS VENDIDOS (featured, data-driven) ============== */
function renderFeaturedSection(){
  const ids = state.settings.featuredProductIds||[];
  const items = state.products.filter(p=>ids.includes(p.id));
  if(!items.length) return '';
  return `
  <div class="section-block" id="destacados">
    <div class="section-head-row">
      <div>
        <div class="section-heading">Los favoritos de nuestros clientes</div>
        <div class="section-sub">Lo que más piden, una y otra vez.</div>
      </div>
    </div>
    <div class="grid">${items.map(p=>renderProductCard(p,true)).join('')}</div>
  </div>`;
}

/* ============== PRIMERA COMPRA (fixed) ============== */
function renderFirstTimeSection(){
  return `
  <div class="first-band">
    <h3>¿Es tu primera compra?</h3>
    <p>No necesitas saber por dónde empezar. Cuéntanos qué buscas y te ayudamos a encontrar opciones sencillas y fáciles de elegir.</p>
    <a class="hero-btn-ghost" href="${waLink('Es mi primera compra, ¿me pueden ayudar a elegir?')}" target="_blank">Pedir ayuda para empezar</a>
  </div>`;
}

/* ============== CATEGORIES ============== */
function renderCategoriesSection(){
  const cats = ["Todos", ...state.settings.categories];
  return `<div class="cats">${cats.map(c=>`<button class="cat-chip ${state.activeCat===c&&!state.searchQuery&&!state.activeNeed?'active':''}" onclick="goToCatalog('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>`;
}

/* ============== PROMO BANNER ============== */
function renderPromoBannerSection(){
  const p = state.settings.promoBanner;
  if(!p || (!p.title && !p.text && !p.image)) return '';
  return `
  <div class="promo-banner">
    ${p.image ? `<img class="promo-banner-img" src="${p.image}">` : ''}
    <div class="promo-banner-body">
      ${p.title ? `<div class="promo-banner-title">${p.title}</div>` : ''}
      ${p.text ? `<div class="promo-banner-text">${p.text}</div>` : ''}
      ${p.buttonText ? `<button class="btn-promo" onclick="goToCatalog('${(p.buttonLink||'Todos').replace(/'/g,"\\'")}')">${p.buttonText}</button>` : ''}
    </div>
  </div>`;
}

/* ============== KITS (fixed, self-hiding — requiere categoría "Kits") ============== */
function renderKitsSection(){
  const items = state.products.filter(p=>(p.cat||'').toLowerCase()==='kits');
  if(!items.length) return '';
  return `
  <div class="section-block">
    <div class="section-heading">Todo lo que necesitas, en un solo kit</div>
    <div class="section-sub">Soluciones completas, listas para disfrutar.</div>
    <div class="kits-row">
      ${items.map(p=>`
        <div class="kit-card">
          <div class="kit-thumb">${p.images&&p.images.length?`<img src="${p.images[0]}">`:catIcon(p.cat)}</div>
          <div class="kit-info">
            <div class="kit-name">${p.name}</div>
            ${p.desc?`<div class="kit-desc">${p.desc}</div>`:''}
            <div class="kit-price">${money(p.price)}</div>
          </div>
          <button class="kit-add" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}')">Agregar</button>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ============== CATÁLOGO COMPLETO ============== */
function renderGridSection(){
  let filtered = state.products;
  let heading = 'Catálogo completo';
  let emptyMsg = `No encontramos productos que coincidan. Prueba con otra búsqueda o <a style="color:var(--primary);font-weight:700;" href="${waLink('Hola, no encontré lo que buscaba en el catálogo, ¿me ayudan?')}" target="_blank">escríbenos por WhatsApp</a>.`;
  if(state.searchQuery.trim()){
    const q = state.searchQuery.trim().toLowerCase();
    filtered = filtered.filter(p=>(p.name||'').toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));
    heading = `Resultados para "${state.searchQuery.trim()}"`;
  } else if(state.activeNeed){
    const need = NEEDS.find(n=>n.key===state.activeNeed);
    filtered = filtered.filter(p=>(p.needs||[]).includes(state.activeNeed));
    heading = need ? need.label : 'Catálogo completo';
    emptyMsg = `Aún no hemos elegido productos para esta opción. Prueba otra categoría o <a style="color:var(--primary);font-weight:700;" href="${waLink('Hola, no encontré lo que buscaba en el catálogo, ¿me ayudan?')}" target="_blank">escríbenos por WhatsApp</a>.`;
  } else if(state.activeCat!=="Todos"){
    filtered = filtered.filter(p=>p.cat===state.activeCat);
  }
  // Los productos agotados se muestran hasta el final, sin alterar el orden entre sí.
  filtered = filtered
    .map((p,i)=>({p,i}))
    .sort((a,b)=> (a.p.stock<=0)-(b.p.stock<=0) || a.i-b.i)
    .map(x=>x.p);
  const shown = filtered.slice(0, state.gridRenderLimit);
  const hasMore = filtered.length > shown.length;
  return `
  <div id="catalogo" class="section-block" style="padding-top:10px;">
    <div class="section-heading" style="margin-bottom:14px;">${heading}${filtered.length ? ` <span style="color:var(--ink-soft);font-weight:600;font-size:13px;">(${filtered.length})</span>` : ''}</div>
    ${filtered.length
      ? `<div class="grid">${shown.map(p=>renderProductCard(p)).join('')}</div>
         ${hasMore ? `
           <div style="text-align:center;padding:18px 0 6px;">
             <button class="hero-btn-ghost" onclick="loadMoreProducts()">Ver más productos</button>
           </div>
         ` : ''}`
      : `<div class="empty-state">${emptyMsg}</div>`}
  </div>`;
}
const GRID_PAGE_SIZE = 20;
function loadMoreProducts(){ state.gridRenderLimit += GRID_PAGE_SIZE; render(); }

function renderProductCard(p, forceBest){
  const isBest = forceBest || (state.settings.featuredProductIds||[]).includes(p.id);
  const isGenericDesc = p.desc && /^Compra en línea .+ por \$[\d.,]+\.? Haz tu pedido y paga en línea\.?$/i.test(p.desc.trim());
  return `
      <div class="card" onclick="openProductDetail('${p.id}')">
        <div class="card-media">
          <div class="card-image-wrap">
            ${productImageHtml(p)}
            <div class="badge-row">
              ${isBest ? `<span class="badge badge-best">Más vendido</span>` : ''}
              ${p.stock<=3 ? `<span class="badge badge-stock">${p.stock===0?'Agotado':'Últimas piezas'}</span>` : ''}
            </div>
          </div>
          <button class="fab-add" ${p.stock<=0?'disabled':''} onclick="event.stopPropagation();addToCart('${p.id}')">+</button>
        </div>
        <div class="card-body">
          <div class="card-cat">${p.cat}</div>
          <div class="card-name">${p.name}</div>
          ${p.desc && !isGenericDesc ? `<div class="card-desc">${p.desc}</div>` : ''}
          <div class="card-price">${money(p.price)}</div>
        </div>
      </div>`;
}

/* ============== TESTIMONIOS ============== */
function renderTestimonialsSection(){
  const list = state.settings.testimonials||[];
  if(!list.length) return '';
  const avg = list.reduce((s,t)=>s+(Number(t.rating)||5),0)/list.length;
  return `
  <div class="section-block">
    <div class="section-heading" style="margin-bottom:6px;">Lo que dicen nuestros clientes</div>
    <div class="rating-line">
      <span class="rating-stars">★★★★★</span>
      <span class="rating-num">${avg.toFixed(1)}</span>
      <span class="rating-label">Opiniones de clientes</span>
    </div>
  </div>
  <div class="testimonial-row">
      ${list.map(t=>`<div class="testimonial-card"><span class="stars">${'★'.repeat(Number(t.rating)||5)}</span><p>"${t.text}"</p>${t.name?`<div class="testimonial-name">— ${t.name}</div>`:''}</div>`).join('')}
  </div>`;
}

/* ============== DISCRECIÓN (fixed) ============== */
function renderDiscretionSection(){
  return `
  <div class="discretion-band">
    <div class="discretion-inner">
      <h3>Tu privacidad es nuestra prioridad.</h3>
      <p>Preparamos tus pedidos con discreción para que puedas comprar con total tranquilidad, de principio a fin.</p>
      <div class="discretion-grid">
        <div class="discretion-item"><span class="ic">📦</span>Empaque discreto, sin logos visibles</div>
        <div class="discretion-item"><span class="ic">🏠</span>Entrega directa a domicilio</div>
        <div class="discretion-item"><span class="ic">💬</span>Atención privada por WhatsApp</div>
        <div class="discretion-item"><span class="ic">💵</span>Pago contra entrega</div>
      </div>
    </div>
  </div>`;
}

/* ============== WHATSAPP CTA ============== */
function renderNewsletterSection(){
  if(!state.settings.whatsapp) return '';
  return `
  <div class="newsletter-block">
    <div class="section-heading">¿No sabes cuál elegir?</div>
    <div class="newsletter-text">Cuéntanos qué estás buscando y te mostramos opciones, con toda confianza.</div>
    <a class="btn-primary" style="display:inline-block;width:auto;padding:12px 22px;" href="${waLink('Hola, no sé qué producto elegir, ¿me pueden ayudar?')}" target="_blank">Hablar por WhatsApp</a>
  </div>`;
}

/* ============== FOOTER ============== */
function renderFooterSection(){
  const s = state.settings;
  return `
  <div class="site-foot">
    <div class="site-foot-inner">
      <div>
        <div class="foot-brand-name">${s.storeName}</div>
        <div class="foot-tagline">${s.headerSubtitle||'Discreto · Confidencial · A domicilio'}</div>
      </div>
      <div class="foot-col">
        <h4>Explora</h4>
        <a onclick="goToFeatured()">Más vendidos</a>
        <a onclick="goToCatalog('Todos')">Catálogo completo</a>
        ${s.categories.slice(0,4).map(c=>`<a onclick="goToCatalog('${c.replace(/'/g,"\\'")}')">${c}</a>`).join('')}
      </div>
      <div class="foot-col">
        <h4>Contacto</h4>
        <a href="${waLink('Hola, tengo una pregunta.')}" target="_blank">WhatsApp: ${s.whatsapp}</a>
        <div>${s.schedule}</div>
        ${s.socialInstagram?`<div>Instagram: ${s.socialInstagram}</div>`:''}
        ${s.socialFacebook?`<div>Facebook: ${s.socialFacebook}</div>`:''}
        ${s.contactEmail?`<div>${s.contactEmail}</div>`:''}
      </div>
    </div>
    <div class="foot-bottom">Pedidos por catálogo con entrega a domicilio y pago contra entrega.</div>
  </div>`;
}

const SECTION_RENDERERS = {
  hero: renderHeroSection,
  featured: renderFeaturedSection,
  categories: renderCategoriesSection,
  promoBanner: renderPromoBannerSection,
  grid: renderGridSection,
  testimonials: renderTestimonialsSection,
  newsletter: renderNewsletterSection,
  footer: renderFooterSection,
};

function sectionVisible(key){
  const s = (state.settings.sections||[]).find(x=>x.key===key);
  return s ? s.visible : true;
}

function renderCartDrawer(){
  const entries = Object.entries(state.cart);
  return `
    <div class="drawer-head"><h2>Tu carrito</h2><button class="close-x" onclick="state.cartOpen=false;render()">✕</button></div>
    <div class="drawer-body">
      ${entries.length===0 ? `<div class="empty-state">Tu carrito está vacío.</div>` :
        entries.map(([id,qty])=>{const p=state.products.find(x=>x.id===id); if(!p) return ''; return `
          <div class="cart-item">
            ${p.images&&p.images.length ? `<img class="cart-item-swatch" src="${p.images[0]}">` : `<div class="cart-item-swatch" style="background:${catColor(p.cat)}"></div>`}
            <div class="cart-item-info">
              <div class="cart-item-name">${p.name}</div>
              <div class="cart-item-price">${money(p.price)} c/u</div>
              <div class="qty-row">
                <button class="qty-btn" onclick="changeQty('${id}',-1)">−</button>
                <div class="qty-val">${qty}</div>
                <button class="qty-btn" onclick="changeQty('${id}',1)">+</button>
                <a class="remove-link" onclick="removeFromCart('${id}')">Quitar</a>
              </div>
            </div>
          </div>`;}).join('')}
    </div>
    <div class="drawer-foot">
      <div class="total-row"><span>Total</span><span>${money(cartTotal())}</span></div>
      <button class="btn-primary" ${entries.length===0?'disabled style="opacity:.5"':''} onclick="state.cartOpen=false;state.checkoutOpen=true;render()">Continuar pedido</button>
    </div>`;
}

function renderCheckoutDrawer(){
  const p = loadCustomerProfile() || {};
  return `
    <div class="drawer-head"><h2>Datos de entrega</h2><button class="close-x" onclick="state.checkoutOpen=false;render()">✕</button></div>
    <div class="drawer-body">
      <div class="note-box">Pago contra entrega. Tu pedido llega en empaque neutro, sin ningún logo visible.</div>
      <div class="form-field"><label>Nombre completo</label><input id="ck-name" type="text" placeholder="Tu nombre" value="${(p.name||'').replace(/"/g,'&quot;')}"></div>
      <div class="form-field"><label>WhatsApp / Teléfono</label><input id="ck-phone" type="tel" placeholder="33 1234 5678" value="${(p.phone||'').replace(/"/g,'&quot;')}"></div>
      <div class="form-field"><label>Dirección de entrega</label><textarea id="ck-address" placeholder="Calle, número, colonia, referencias">${p.address||''}</textarea></div>
      <div class="form-field"><label>Notas (opcional)</label><textarea id="ck-notes" placeholder="Horario preferido, indicaciones extra...">${p.notes||''}</textarea></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-top:-4px;">
        <input id="ck-remember" type="checkbox" ${p.remember!==false?'checked':''} style="width:16px;height:16px;">
        Recordar mis datos en este celular para la próxima compra
      </label>
    </div>
    <div class="drawer-foot">
      <div class="total-row"><span>Total a pagar</span><span>${money(cartTotal())}</span></div>
      <button class="btn-primary" ${state.submittingOrder?'disabled style="opacity:.6"':''} onclick="handleCheckoutSubmit()">${state.submittingOrder?'Enviando pedido…':'Confirmar pedido'}</button>
      <button class="btn-secondary" onclick="state.checkoutOpen=false;state.cartOpen=true;render()">Volver al carrito</button>
    </div>`;
}

function renderSuccess(){
  return `<div class="success-screen"><div class="success-card">
    <div class="mark">✓</div>
    <h2>¡Pedido recibido!</h2>
    ${state.lastOrderNumber ? `<div style="font-weight:800;color:var(--primary-deep);font-size:15px;margin-bottom:4px;">Pedido ${formatFolio(state.lastOrderNumber)}</div>` : ''}
    <p>Te contactaremos por WhatsApp para confirmar tu pedido y coordinar la entrega. Pago contra entrega, empaque discreto.</p>
    <button class="btn-primary" style="width:auto;display:inline-block;padding:13px 22px;" onclick="state.orderPlaced=false;render()">Seguir explorando el catálogo</button>
  </div></div>`;
}

function renderStore(){
  const order = ['hero','featured','categories','promoBanner','grid','testimonials','newsletter','footer'];
  const before = { grid: ['kits'] }; // fixed sections inserted right before a configurable one
  const after = { hero: ['trust','needs'], grid: ['firsttime'], testimonials: ['discretion'] };
  const FIXED = { trust: renderTrustBar, needs: renderNeedsSection, firsttime: renderFirstTimeSection, kits: renderKitsSection, discretion: renderDiscretionSection };

  let body = '';
  order.forEach(key=>{
    (before[key]||[]).forEach(fk=>{ body += FIXED[fk](); });
    if(sectionVisible(key)) body += SECTION_RENDERERS[key]();
    (after[key]||[]).forEach(fk=>{ body += FIXED[fk](); });
  });

  const showBar = cartCount()>0 && !state.cartOpen && !state.checkoutOpen;
  return `
  <div class="app">
    <div class="topbar">${renderHeader()}</div>
    <div class="topbar-spacer" id="topbar-spacer"></div>
    ${state.loadError ? `<div class="note-box" style="margin:14px 20px 0;">No pudimos conectar con el servidor, intenta recargar la página.</div>` : ''}
    ${body}
    <div class="mobile-cart-spacer ${showBar?'show':''}"></div>
  </div>
  <div class="mobile-cart-bar ${showBar?'show':''}">
    <div class="mobile-cart-bar-info">
      <span class="mobile-cart-bar-count">${cartCount()} artículo${cartCount()===1?'':'s'}</span>
      <span class="mobile-cart-bar-total">${money(cartTotal())}</span>
    </div>
    <button class="mobile-cart-bar-btn" onclick="state.cartOpen=true;render()">Ver carrito</button>
  </div>
  <div class="overlay ${state.cartOpen||state.checkoutOpen||state.detailProductId||state.profileOpen?'open':''}" onclick="state.cartOpen=false;state.checkoutOpen=false;state.profileOpen=false;closeProductDetail();"></div>
  <div class="drawer ${state.cartOpen?'open':''}">${renderCartDrawer()}</div>
  <div class="drawer ${state.checkoutOpen?'open':''}">${renderCheckoutDrawer()}</div>
  <div class="drawer drawer-detail ${state.detailProductId?'open':''}">${state.detailProductId ? renderProductDetailDrawer() : ''}</div>
  <div class="drawer ${state.profileOpen?'open':''}">${state.profileOpen ? renderProfileDrawer() : ''}</div>
  `;
}

function render(){
  const root = document.getElementById('root');
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando catálogo…</div>`; return; }
  root.innerHTML = state.orderPlaced ? renderSuccess() : renderStore();
  if(!document.getElementById('toast')){ const t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  adjustTopbarSpacer();
}
function adjustTopbarSpacer(){
  const bar = document.querySelector('.topbar');
  const spacer = document.getElementById('topbar-spacer');
  if(bar && spacer) spacer.style.height = bar.offsetHeight + 'px';
}
window.addEventListener('resize', adjustTopbarSpacer);
loadData();
</script>
</body>
</html>
