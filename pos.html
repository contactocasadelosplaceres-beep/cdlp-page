<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de venta — La Casa de los Placeres</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#FBF5F2; --surface:#FFFFFF; --surface-soft:#F6E9E6; --ink:#2B1620; --ink-soft:#6E5560;
    --primary:#993477; --primary-deep:#5C1F49; --rose:#BC355C; --coral:#ED7578; --amber:#F6A030;
    --green:#7AB71A; --teal:#20B7CA; --navy:#0A4A5B; --border:#EBD9D3;
    --danger-bg:#FBE2E6; --danger-ink:#A02040;
    --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-pill:999px;
    --shadow-sm:0 2px 8px -4px rgba(43,22,32,0.16);
    --shadow-md:0 12px 28px -12px rgba(43,22,32,0.22);
    --shadow-lg:0 24px 48px -20px rgba(43,22,32,0.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'League Spartan',sans-serif;letter-spacing:0.01em;margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;} input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .app{max-width:1100px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  .top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;row-gap:10px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 16px -10px rgba(0,0,0,0.5);position:relative;z-index:5;}
  /* El nombre del cajero/centro no tenía espacio propio junto a los botones Caja/Ventas/Más —
     con un nombre largo podía encimarse con ellos. Esta barra se ve en toda la pantalla de venta. */
  .top>div:first-child{min-width:0;overflow-wrap:anywhere;word-break:break-word;}
  .top .brand{font-size:15.5px;font-weight:700;font-family:'League Spartan',sans-serif;letter-spacing:0.01em;}
  .top .sub{font-size:11px;color:#a9d4dc;margin-top:2px;}
  .pill-btn{font-size:12px;background:rgba(255,255,255,0.14);padding:8px 13px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--radius-pill);color:#fff;font-weight:600;transition:background .15s ease;}
  .pill-btn:hover{background:rgba(255,255,255,0.22);}
  /* Antes las 7 acciones de la barra superior (Caja, Ventas, Cambio, Almacén, Cambiar centro,
     Cambiar cajero, Salir) tenían todas el mismo peso visual y en celular angosto se partían en
     2-3 filas, empujando los productos hacia abajo. Ahora solo "Caja" y "Ventas" (las de uso
     frecuente durante una venta) quedan a la vista; el resto vive en un menú "Más". */
  .top-more-wrap{position:relative;}
  .top-more-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:20;min-width:180px;padding:6px;}
  .top-more-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 10px;min-height:44px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);}
  .top-more-menu button:hover{background:var(--surface-soft);}
  .top-more-menu hr{border:none;border-top:1px solid var(--border);margin:5px 0;}
  .top-more-overlay{position:fixed;inset:0;z-index:19;}
  /* ===== Clases reutilizadas del sistema visual de Admin, agregadas aquí porque las usan
     Cambio de producto, Almacén, el banner de sin conexión y el escáner, pero nunca se
     definieron en el POS — esas pantallas se veían con el estilo crudo del navegador. ===== */
  .panel-sub{font-size:11.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:14px;}
  .list-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;background:var(--surface);transition:box-shadow .15s ease;}
  .list-row:hover{box-shadow:var(--shadow-sm);}
  .icon-btn{width:44px;height:44px;border-radius:9px;background:var(--surface-soft);color:var(--primary-deep);font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;}
  .icon-btn:hover{background:#efd9d3;}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn.danger{background:var(--danger-bg);color:var(--danger-ink);}
  .icon-btn.danger:hover{filter:brightness(0.94);}
  .note-box{background:var(--surface-soft);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input,.form-field textarea,.form-field select{width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--ink);transition:border-color .15s ease;}
  .form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--primary);outline:none;}
  .form-field textarea{resize:vertical;min-height:60px;}
  .btn-outline{background:var(--surface);border:1.5px solid var(--primary);color:var(--primary);padding:10px 17px;min-height:44px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;transition:background .15s ease,opacity .15s ease;}
  .btn-outline:hover{background:var(--surface-soft);}
  .btn-outline:disabled{opacity:.45;}
  .btn-cancel{background:var(--surface-soft);color:var(--ink-soft);padding:12px;min-height:44px;border-radius:var(--radius-md);font-size:13.5px;font-weight:700;transition:background .15s ease;}
  .btn-cancel:hover{background:#efd9d3;}
  .btn-cancel:disabled{opacity:.45;}
  .login-screen,.select-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
    background:radial-gradient(1200px 600px at 15% -10%, rgba(237,117,120,0.35), transparent 60%),
               radial-gradient(900px 500px at 110% 110%, rgba(32,183,202,0.22), transparent 55%),
               linear-gradient(160deg,var(--primary-deep),#3a1332 72%);}
  .card{position:relative;background:var(--surface);border-radius:var(--radius-lg);padding:32px 26px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
  .card h2{color:var(--primary-deep);font-size:20px;margin-bottom:6px;font-weight:700;}
  .card p{color:var(--ink-soft);font-size:12.5px;margin-bottom:16px;line-height:1.5;}
  .card input{width:100%;font-size:16px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:10px;transition:border-color .15s ease;background:var(--bg);}
  .card input:focus{border-color:var(--primary);outline:none;}
  .card input.pin{text-align:center;letter-spacing:8px;font-size:22px;font-weight:700;}
  .err{color:var(--rose);font-size:12px;margin-bottom:8px;min-height:14px;font-weight:600;}
  .btn-primary{width:100%;background:linear-gradient(135deg,var(--primary),#5C1F49);color:#fff;padding:15px;border-radius:var(--radius-md);font-size:15.5px;font-weight:700;box-shadow:0 10px 20px -10px rgba(153,52,119,0.5);transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;}
  .btn-primary:active{transform:scale(0.98);box-shadow:0 4px 10px -6px rgba(153,52,119,0.45);}
  .btn-primary:disabled{opacity:.45;box-shadow:none;}
  .btn-secondary{width:100%;background:var(--surface-soft);color:var(--ink-soft);padding:12px;border-radius:var(--radius-md);font-size:13.5px;font-weight:700;margin-top:8px;transition:background .15s ease;}
  .btn-secondary:hover{background:#efd9d3;}
  .modal-overlay{position:fixed;inset:0;background:rgba(43,22,32,0.55);backdrop-filter:blur(1px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.modal-overlay{align-items:center;}}
  .modal{background:var(--surface);width:100%;max-width:420px;max-height:88vh;overflow-y:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:22px 20px;box-shadow:0 -20px 50px -20px rgba(43,22,32,0.35);}
  @media(min-width:600px){.modal{border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);}}
  .modal h3{font-size:17.5px;color:var(--primary-deep);margin-bottom:6px;font-weight:700;font-family:'League Spartan',sans-serif;}
  .order-detail{background:var(--bg);border-radius:var(--radius-sm);padding:12px;font-size:12.5px;border:1px solid var(--border);}
  .order-detail div{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
  .field-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:10px;font-size:16px;transition:border-color .15s ease;}
  .field-input:focus{border-color:var(--primary);outline:none;}
  .cashier-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .cashier-item{background:var(--surface-soft);color:var(--primary-deep);padding:14px 16px;border-radius:var(--radius-md);font-size:14.5px;font-weight:700;transition:background .15s ease,transform .1s ease;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px;}
  .cashier-item:active{transform:scale(0.98);}
  .cashier-item:hover{background:#efd9d3;}
  .cashier-item svg{opacity:.5;flex-shrink:0;}
  /* Este botón se reutiliza en Cliente, Almacén, recordatorio de checkout y selector de cajero/
     centro — su primer hijo (nombre) no tenía espacio propio reservado junto al segundo (teléfono,
     precio, flecha), así que un nombre largo se montaba encima en vez de bajar de línea. */
  .cashier-item>span:first-child,.cashier-item>div:first-child{min-width:0;overflow-wrap:anywhere;word-break:break-word;flex:1;}
  .cashier-item>span:last-child,.cashier-item>div:last-child{flex-shrink:0;}

  .pos-body{flex:1;min-height:0;display:flex;flex-direction:column;}
  .toolbar{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;}
  /* El buscador es el punto de entrada principal del flujo (buscar > filtrar > elegir > cobrar),
     así que lleva más peso visual que cualquier otro control de esta pantalla: más alto, ícono
     propio, borde y sombra más marcados al usarlo. */
  .search-row{position:relative;}
  .search-row svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;}
  .search-row input{width:100%;padding:14px 46px 14px 42px;border-radius:var(--radius-md);border:1.5px solid var(--border);font-size:16px;font-weight:500;background:var(--surface);transition:border-color .15s ease,box-shadow .15s ease;box-shadow:var(--shadow-sm);}
  .search-row input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(153,52,119,0.14);}
  .search-row .scan-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);}
  .cats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--radius-sm);background:var(--surface);border:1.5px solid var(--border);color:var(--ink-soft);font-size:12.5px;font-weight:600;white-space:nowrap;transition:all .15s ease;}
  .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 14px -8px rgba(153,52,119,0.5);font-weight:700;}
  .layout{display:flex;flex:1;min-height:0;}
  .prod-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 100px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;}
  @media(min-width:600px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.prod-grid{grid-template-columns:repeat(4,1fr);}}
  .prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .12s ease;}
  .prod-card:active{transform:scale(0.97);box-shadow:none;}
  .prod-swatch{width:100%;aspect-ratio:1/1;border-radius:8px;object-fit:cover;display:block;background-position:center;background-size:cover;}
  .prod-name{font-size:12.5px;font-weight:600;line-height:1.28;min-height:2.56em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .prod-price{font-size:13.5px;font-weight:800;color:var(--primary-deep);}
  .prod-stock{font-size:10.5px;color:var(--ink-soft);}
  /* Estado "sin inventario": la tarjeta se ve claramente distinta (no solo el texto de stock),
     y deja de ser tocable, en vez de dejar que el cajero la toque y reciba un aviso después. */
  .prod-card.out-of-stock{opacity:.6;cursor:not-allowed;}
  .prod-card.out-of-stock .prod-swatch{filter:grayscale(0.6);}
  .stock-out-badge{display:inline-block;background:#FBE2E6;color:var(--rose);font-weight:700;font-size:10px;padding:2px 7px;border-radius:6px;}
  .btn-ver-mas-pos{grid-column:1/-1;text-align:center;background:var(--surface);color:var(--primary);padding:13px;border-radius:var(--radius-md);font-size:13.5px;font-weight:700;border:1.5px solid var(--border);margin-top:2px;}
  .btn-ver-mas-pos:active{background:var(--surface-soft);}
  .stale-cash-banner{background:#FFF3E0;color:#8a5a1a;font-size:12.5px;font-weight:600;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stale-cash-banner button{margin-left:auto;background:#8a5a1a;color:#fff;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;}

  .sale-panel{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-height:60vh;display:flex;flex-direction:column;box-shadow:0 -16px 40px -18px rgba(43,22,32,0.28);}
  .sale-panel::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:3px;background:var(--border);}
  .sale-head{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:relative;}
  .sale-items{overflow-y:auto;padding:8px 16px;flex:1;}
  .sale-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  /* El nombre del producto no tenía espacio propio reservado junto a los botones +/- y el precio;
     con un nombre largo (+ variante) se montaba encima de esos controles en vez de bajar de
     línea — es la pantalla que el cajero mira en cada venta. */
  .sale-item .name{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
  .qty-btn{width:44px;height:44px;border-radius:9px;background:var(--surface-soft);color:var(--primary-deep);font-size:16px;font-weight:700;transition:background .12s ease;}
  .qty-btn:hover{background:#efd9d3;}
  .sale-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
  .total-row{display:flex;justify-content:space-between;font-weight:800;color:var(--primary-deep);font-size:16.5px;margin-bottom:12px;}
  /* 4 métodos de pago en una fila; en pantallas angostas, 2x2 (antes "Transferencia" se cortaba). */
  .pay-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:10px;}
  @media(max-width:400px){.pay-row.pay-methods{grid-auto-flow:row;grid-template-columns:repeat(2,1fr);}}
  .pay-btn{min-width:0;min-height:44px;padding:10px 6px;border-radius:var(--radius-sm);background:var(--surface-soft);color:var(--ink-soft);font-size:12.5px;font-weight:700;transition:all .15s ease;}
  .pay-btn.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(153,52,119,0.5);}
  .empty-cart{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-family:'League Spartan',sans-serif;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-deep);color:#fff;padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;box-shadow:var(--shadow-md);}
  /* AVISOS APILADOS: varios avisos a la vez, sin taparse entre sí ni con "Deshacer" */
  .toast-stack{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 32px);max-width:480px;z-index:90;pointer-events:none;}
  .toast-stack .toast{position:static;transform:none;opacity:0;max-width:100%;text-align:center;overflow-wrap:anywhere;line-height:1.3;animation:toastIn .22s ease forwards;}
  .toast-stack .toast.show{opacity:1;transform:none;}
  .toast-stack .toast.out{animation:toastOut .22s ease forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(6px)}}
  .receipt-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1000px 560px at 50% -10%, rgba(122,183,26,0.12), transparent 60%),var(--bg);}
  .receipt-card{background:var(--surface);border-radius:var(--radius-lg);padding:32px 26px;max-width:340px;text-align:center;box-shadow:var(--shadow-lg);}
  .receipt-card .mark{width:56px;height:56px;border-radius:50%;background:var(--green);color:#2B1620;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;box-shadow:0 10px 22px -10px rgba(122,183,26,0.55);}
  /* Antes no había ninguna regla pensada específicamente para teléfonos muy angostos
     (320-359px, ej. iPhone SE) — todo dependía de que el flex/grid se acomodara solo.
     Funcionaba en la mayoría de los casos, pero esto deja un respaldo explícito en vez de
     dejarlo a la suerte, igual que ya tiene la tienda. */
  @media(max-width:359px){
    .top{padding:12px 14px;gap:8px;}
    .top .brand{font-size:14px;}
    .pill-btn{padding:7px 10px;font-size:11.5px;}
    .toolbar{padding:12px 14px 0;}
    .prod-grid{padding:0 14px 100px;gap:8px;}
    .pay-btn{font-size:11.5px;padding:10px 4px;}
    .sale-head{padding:16px 14px 10px;}
    .sale-items{padding:8px 14px;}
    .sale-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom));}
  }
  /* ---- Arqueo por denominaciones al cerrar caja ---- */
  .close-card{max-width:420px!important;width:100%;padding:26px 14px!important;}
  .denom-toggle{width:100%;min-height:44px;margin:0 0 10px;padding:0 14px;border:1.5px dashed var(--primary);background:var(--surface-soft);color:var(--primary-deep);border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer;}
  .denom-box{border:1px solid var(--border);border-radius:12px;padding:6px 8px;margin-bottom:10px;}
  .denom-group{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:8px 0 2px;}
  .denom-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid var(--border);}
  .denom-group + .denom-row{border-top:none;}
  .denom-label{flex:0 0 46px;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;}
  .denom-step{flex:0 0 auto;display:flex;align-items:center;gap:3px;}
  .denom-step button{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:18px;font-weight:700;line-height:1;cursor:pointer;padding:0;}
  .denom-step input{width:44px!important;min-width:0;height:36px;margin:0!important;padding:0 2px!important;text-align:center;font-size:16px;font-weight:700;border:1.5px solid var(--border);border-radius:10px;}
  .denom-sub{flex:1 1 0;min-width:0;text-align:right;white-space:nowrap;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .denom-total{display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap;padding:10px 0 4px;border-top:2px solid var(--border);margin-top:4px;font-weight:800;}
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.35;cursor:pointer;padding:9px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);}
  .checkbox-row input{margin-top:1px;flex-shrink:0;width:18px;height:18px;}
  .btn-tertiary{background:none;border:0;color:var(--primary-deep);font-weight:700;font-size:13px;padding:8px 4px;cursor:pointer;}

/* ============== REGISTRO DE ERRORES DEL SISTEMA ==============
   Ver la nota completa en index.html — mismo mecanismo, guardando "pos" como origen. */
let systemErrorsLoggedThisSession = 0;
const SYSTEM_ERROR_LOG_LIMIT = 5;
function logSystemError(message, stack){
  if(systemErrorsLoggedThisSession >= SYSTEM_ERROR_LOG_LIMIT) return;
  systemErrorsLoggedThisSession++;
  try{
    db.collection('systemErrors').add({
      message: String(message||'Error desconocido').slice(0,500),
      stack: String(stack||'').slice(0,2000),
      source: 'pos',
      page: location.pathname + location.search,
      userAgent: (navigator.userAgent||'').slice(0,300),
      date: new Date().toISOString(),
    }).catch(()=>{});
  }catch(e){}
}
window.addEventListener('error', (ev)=>{ logSystemError(ev.message, ev.error && ev.error.stack ? ev.error.stack : ''); });
window.addEventListener('unhandledrejection', (ev)=>{
  const r = ev.reason;
  logSystemError(r && r.message ? r.message : String(r), r && r.stack ? r.stack : '');
});

// Mismo contador compartido con index.html: folio consecutivo único para
// pedidos de la tienda y ventas del Punto de Venta.
async function getNextOrderNumber(){
  const counterRef = db.collection('counters').doc('orders');
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().next || 1) : 1;
      tx.set(counterRef, {next: current + 1}, {merge:true});
      return current;
    });
  }catch(e){
    console.error('No se pudo generar el folio', e);
    return null;
  }
}
function formatFolio(n){ return n ? '#' + String(n).padStart(4,'0') : ''; }

// Solo los 7 colores de marca aprobados — antes se mezclaban con 5 tonos fuera de paleta.
const PALETTE = ["#993477","#BC355C","#ED7578","#F6A030","#7AB71A","#20B7CA","#0A4A5B"];
function catColor(cat){ const i = state.categories.indexOf(cat); return PALETTE[(i<0?0:i) % PALETTE.length]; }
const PAY_METHODS = ["Efectivo","Tarjeta","Transferencia"];
// Devuelve el desglose de pago de una venta ya guardada: usa "payments" (ventas divididas
// o registradas después de este cambio) y cae de vuelta a "paymentMethod" para ventas viejas.
function salePayments(s){
  if(s.payments && s.payments.length) return s.payments;
  return [{method: s.paymentMethod || 'Efectivo', amount: s.total||0}];
}
function splitRemaining(){
  const assigned = PAY_METHODS.reduce((s,m)=>s+(Number(state.splitAmounts[m])||0), 0);

state.offlineQueueCount = loadOfflineQueue().length;
// Para un kit, "existencia en este centro" es lo que alcance para armarlo SOLO con lo que hay
// en ese centro (no se puede armar un kit combinando piezas de dos sucursales distintas) — por
// eso centerStock() se apoya en computeKitStockAtCenter() para los kits, y así el buscador, la
// cuadrícula de productos y addToCart (que ya usan centerStock) funcionan igual sin más cambios.
function centerStock(p, centerId){
  if(p && p.isKit) return computeKitStockAtCenter(p, centerId);
  return (p.stockByCenter && p.stockByCenter[centerId]) || 0;
}
/* ---- Variantes con existencias POR CENTRO ----
   v.stockByCenter = {idCentro: piezas}; v.stock siempre es la suma (la tienda en línea lee ese total).
   Una variante antigua (sin stockByCenter) se considera guardada toda en el centro principal. */
function vImage(p, v){ return (v && typeof v.imageIdx==='number' && p && p.images && p.images[v.imageIdx]) || null; }
function posDefaultCenterId(){ const c = (state.centers||[]).find(x=>x.isDefault) || (state.centers||[])[0]; return c ? c.id : ''; }
function vCenterStock(v, cid){
  if(!v) return 0;
  if(v.stockByCenter) return v.stockByCenter[cid]||0;
  return cid===posDefaultCenterId() ? (v.stock||0) : 0;
}
function vSetCenterStock(v, cid, n){
  if(!v.stockByCenter){ v.stockByCenter = {}; const d = posDefaultCenterId(); if(d) v.stockByCenter[d] = v.stock||0; }
  v.stockByCenter[cid] = Math.max(0, Math.floor(Number(n)||0));
  v.stock = Object.values(v.stockByCenter).reduce((s,x)=>s+(x||0),0);
}
// El producto con variantes guarda también su total por centro (suma de sus variantes) para que listas y reportes cuadren.
function vProductSync(p){
  if(!(p.variants && p.variants.length)) return;
  const ids = new Set([posDefaultCenterId()]); (state.centers||[]).forEach(c=>ids.add(c.id));
  p.variants.forEach(v=>Object.keys(v.stockByCenter||{}).forEach(k=>ids.add(k)));
  const sbc = {}; ids.forEach(id=>{ if(!id) return; const n = p.variants.reduce((s,v)=>s+vCenterStock(v,id),0); if(n>0 || (p.stockByCenter&&p.stockByCenter[id]!==undefined)) sbc[id]=n; });
  p.stockByCenter = sbc; p.stock = p.variants.reduce((s,v)=>s+(v.stock||0),0);
}
function totalStock(p){ return p.stockByCenter ? Object.values(p.stockByCenter).reduce((s,n)=>s+(n||0),0) : (p.stock||0); }
function computeKitStockAtCenter(p, centerId){
  const items = p.kitItems||[];
  if(!items.length) return 0;
  let min = Infinity;
  items.forEach(ki=>{
    const comp = state.products.find(x=>x.id===ki.productId);
    const need = ki.qty||1;
    const kv = comp && ki.variantId ? (comp.variants||[]).find(x=>x.id===ki.variantId) : null;
    const avail = comp ? Math.floor((ki.variantId ? (kv ? vCenterStock(kv, centerId) : 0) : ((comp.stockByCenter&&comp.stockByCenter[centerId])||0))/need) : 0;
    if(avail < min) min = avail;
  });
  return min===Infinity ? 0 : Math.max(0, min);
}
// Mismo cálculo que admin.html (agregado de todos los centros): usado para el "stock" que se
// guarda en el producto del kit y que ve la tienda en línea (index.html no distingue centros).
function computeKitStock(p){
  const items = p.kitItems||[];
  if(!items.length) return 0;
  let min = Infinity;
  items.forEach(ki=>{
    const comp = state.products.find(x=>x.id===ki.productId);
    const need = ki.qty||1;
    const kv = comp && ki.variantId ? (comp.variants||[]).find(x=>x.id===ki.variantId) : null;
    const avail = comp ? Math.floor((ki.variantId ? (kv ? (kv.stock||0) : 0) : totalStock(comp))/need) : 0;
    if(avail < min) min = avail;
  });
  return min===Infinity ? 0 : Math.max(0, min);
}

async function loadData(attempt){
  attempt = attempt || 1;
  state.loadFailed = false;
  try{
    const [prodSnap, setSnap, cashiersSnap, centersSnap, customersSnap] = await Promise.all([
      db.collection('products').get(),
      db.collection('settings').doc('store').get(),
      db.collection('cashiers').get(),
      db.collection('distributionCenters').get(),
      db.collection('customers').get(),
    ]);
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>!p.deletedAt); // los que están en la papelera del admin no se venden
    state.settings = setSnap.exists ? setSnap.data() : {};
    state.categories = setSnap.exists ? (setSnap.data().categories||[]) : [];
    state.coupons = setSnap.exists ? (setSnap.data().coupons||[]) : [];
    state.cashiers = cashiersSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(c=>c.active);
    state.centers = centersSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(c=>c.active);
    state.customers = customersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.centers.length===0){
      const ref = await db.collection('distributionCenters').add({name:'Principal', isDefault:true, active:true, createdAt:new Date().toISOString()});
      state.centers = [{id:ref.id, name:'Principal', isDefault:true, active:true}];
    }
    // Si este dispositivo ya tenía un centro elegido y sigue activo, se retoma solo.
    const savedCenterId = localStorage.getItem('cdlp_pos_center');
    if(savedCenterId){
      const match = state.centers.find(c=>c.id===savedCenterId);
      if(match) state.activeCenter = match;
    }
  }catch(e){
    console.error(e);
    // Antes: un solo fallo de conexión dejaba el punto de venta abierto pero SIN productos ni
    // cajeras (solo un aviso de 2 segundos). Ahora reintenta, y si no puede, muestra una
    // pantalla clara con "Reintentar" en vez de una caja vacía.
    if(attempt < 3){ await new Promise(r=>setTimeout(r, 1500*attempt)); return loadData(attempt+1); }
    state.loadFailed = true;
  }
  state.loaded = true; render();
}

// Un escáner de código de barras físico (USB o Bluetooth) casi siempre funciona como si fuera
// un teclado: "escribe" el código carácter por carácter y al final manda un Enter, solo. Por
// eso basta con que el buscador esté enfocado — no hace falta ninguna integración especial más
// que reconocer ese Enter y, si el texto coincide exacto con el SKU de un producto, agregarlo
// solo al carrito en vez de dejarlo como una búsqueda de texto cualquiera.
function handlePosSearchKeydown(e){
  if(e.key !== 'Enter') return;
  const raw = state.search.trim();
  if(!raw) return;
  const match = state.products.find(p=>p.sku && p.sku.toLowerCase()===raw.toLowerCase());
  if(!match){ showToast('Ningún producto tiene ese código'); return; }
  addToCart(match.id);
  state.search = ''; state.prodGridLimit = PROD_GRID_PAGE_SIZE; render();
  const i = document.getElementById('pos-search-input');
  if(i) i.focus();
}
/* ---- Devolución o cambio: el cliente regresa algo (y se lleva otra cosa, o se le devuelve el dinero).
   La pieza que regresa vuelve al inventario del centro (buen estado) o se da de baja como merma (dañada).
   Todo queda registrado, y el dinero en efectivo se anota como movimiento de caja. ---- */
const EXCHANGE_METHODS = ['Efectivo','Transferencia','Tarjeta'];
function exVariantsOf(p){ return (p && p.variants && p.variants.length) ? p.variants : []; }
function openExchangeModal(){
  state.exchangeModalOpen = true; state.exchangeMode='cambio'; state.exchangeSearchOut=''; state.exchangeSearchIn='';
  state.exchangeOut=null; state.exchangeIn=null; state.exchangeVarPick=null; state.exchangeCondition='bueno';
  state.exchangeReason=''; state.exchangeMethod='Efectivo'; state.exchangeBusy=false;
  render();
}
function closeExchangeModal(){ state.exchangeModalOpen = false; render(); }
function setExchangeMode(m){ state.exchangeMode = m; state.exchangeVarPick=null; if(m==='devolucion') state.exchangeIn=null; render(); }
function pickExchangeProduct(side, id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  if(exVariantsOf(p).length){ state.exchangeVarPick = {side, id}; render(); return; }
  setExchangeEntry(side, p, null);
}
function pickExchangeVariant(variantId){
  const vp = state.exchangeVarPick; if(!vp) return;
  const p = state.products.find(x=>x.id===vp.id); if(!p) return;
  const v = exVariantsOf(p).find(x=>x.id===variantId); if(!v) return;
  setExchangeEntry(vp.side, p, v);
}
function setExchangeEntry(side, p, v){
  const entry = {id:p.id, variantId: v?v.id:null, name: p.name+(v?` (${variantLabel(v)})`:''), price: itemPrice(p, v), qty:1};
  if(side==='out'){ state.exchangeOut = entry; state.exchangeSearchOut=''; }
  else{ state.exchangeIn = entry; state.exchangeSearchIn=''; }
  state.exchangeVarPick = null; render();
}
function setExchangeQty(side, qty){
  qty = Math.max(1, qty);
  if(side==='out' && state.exchangeOut) state.exchangeOut.qty = qty;
  if(side==='in' && state.exchangeIn) state.exchangeIn.qty = qty;
  render();
}
function setExchangeOutPrice(v){ if(state.exchangeOut){ state.exchangeOut.price = Math.max(0, Number(v)||0); render(); } }
function exchangeAmount(){
  const out = state.exchangeOut, inp = state.exchangeIn;
  if(!out) return null;
  if(state.exchangeMode==='devolucion') return -(out.price*out.qty);
  if(!inp) return null;
  return (inp.price*inp.qty) - (out.price*out.qty);
}
// Suma (delta>0) o resta (delta<0) piezas de un producto/variante en el centro activo y guarda.
async function exchangeMoveStock(entry, delta){
  const p = state.products.find(x=>x.id===entry.id); if(!p) return;
  const cid = state.activeCenter.id;
  if(entry.variantId){
    const v = (p.variants||[]).find(x=>x.id===entry.variantId); if(!v) return;
    vSetCenterStock(v, cid, vCenterStock(v, cid) + delta); vProductSync(p);
    await db.collection('products').doc(p.id).update({variants:p.variants, stock:p.stock, stockByCenter:p.stockByCenter});
  }else{
    if(!p.stockByCenter) p.stockByCenter = {};
    p.stockByCenter[cid] = Math.max(0, (p.stockByCenter[cid]||0) + delta);
    p.stock = Object.values(p.stockByCenter).reduce((s,n)=>s+(n||0),0);
    await db.collection('products').doc(p.id).update({stockByCenter:p.stockByCenter, stock:p.stock});
  }
}
async function confirmExchange(){
  if(state.exchangeBusy) return;
  const out = state.exchangeOut, inp = state.exchangeIn, mode = state.exchangeMode;
  if(!out){ showToast('Elige el producto que regresa'); return; }
  if(mode==='cambio' && !inp){ showToast('Elige el producto que se lleva'); return; }
  const cid = state.activeCenter.id;
  if(mode==='cambio'){
    const pIn = state.products.find(x=>x.id===inp.id);
    const vIn = inp.variantId ? exVariantsOf(pIn).find(x=>x.id===inp.variantId) : null;
    const availableIn = vIn ? vCenterStock(vIn, cid) : centerStock(pIn, cid);
    if(availableIn < inp.qty){ showToast(`Solo hay ${availableIn} disponible(s) de "${inp.name}" en ${state.activeCenter.name}`); return; }
  }
  const amount = exchangeAmount();           // >0 el cliente paga, <0 se le regresa
  const method = state.exchangeMethod || 'Efectivo';
  const toStock = state.exchangeCondition !== 'merma';
  const reason = (state.exchangeReason||'').trim();
  state.exchangeBusy = true;
  try{
    const pOut = state.products.find(x=>x.id===out.id);
    if(toStock){
      await exchangeMoveStock(out, out.qty);
      logStockMovement(out.id, mode==='cambio'?'cambio_producto':'devolucion_cliente', out.qty, mode==='cambio'?`Cambio: regresó "${out.name}" por "${inp.name}"`:`Devolución de cliente: ${out.name}${reason?' — '+reason:''}`, cid);
    }else{
      const vOut = out.variantId ? exVariantsOf(pOut).find(x=>x.id===out.variantId) : null;
      const unitCost = (vOut && Number(vOut.cost)>0) ? Number(vOut.cost) : (pOut&&pOut.cost)||0;
      await db.collection('shrinkage').add({
        date:new Date().toISOString(), productId:out.id, productName:out.name, variantId:out.variantId||null, qty:out.qty,
        reason:'Devuelto dañado', note: reason || (mode==='cambio'?`Cambio por "${inp.name}"`:'Devolución de cliente'),
        centerId:cid, centerName:state.activeCenter.name, unitCost, totalCost:unitCost*out.qty, user:state.activeCashier.name, source:'pos_devolucion',
      });
    }
    if(mode==='cambio'){
      await exchangeMoveStock(inp, -inp.qty);
      logStockMovement(inp.id, 'cambio_producto', -inp.qty, `Cambio: se llevó "${inp.name}" en vez de "${out.name}"`, cid);
    }
    await db.collection('productExchanges').add({
      type: mode, date: new Date().toISOString(), centerId: cid, centerName: state.activeCenter.name, cashierName: state.activeCashier.name,
      outProduct: out, inProduct: mode==='cambio'?inp:null, priceDifference: amount,
      condition: toStock?'bueno':'merma', reason, method: amount ? method : '',
    });
    // El efectivo que entra o sale queda en la caja abierta (los demás métodos no tocan el efectivo).
    if(amount && method==='Efectivo' && state.activeCashRegister){
      const mov = {type: amount>0?'ingreso':'retiro', amount: Math.abs(amount), note: (mode==='cambio'?'Cambio de producto':'Devolución')+`: ${out.name}`, date:new Date().toISOString()};
      try{
        await db.collection('cashRegisters').doc(state.activeCashRegister.id).update({movements: firebase.firestore.FieldValue.arrayUnion(mov)});
        if(!state.activeCashRegister.movements) state.activeCashRegister.movements=[];
        state.activeCashRegister.movements.push(mov);
      }catch(e){ console.error('No se pudo anotar el efectivo en la caja', e); showToast('Se registró, pero anota el efectivo en la caja a mano'); }
    }
    const tail = toStock ? 'regresó al inventario' : 'se dio de baja como merma';
    showToast(mode==='devolucion' ? `Devolución registrada — se le regresan ${money(-amount)} (${tail})`
      : amount>0 ? `Cambio registrado — el cliente paga ${money(amount)} más` : amount<0 ? `Cambio registrado — se le regresan ${money(-amount)}` : 'Cambio registrado — sin diferencia de precio');
    state.exchangeBusy = false;
    closeExchangeModal();
  }catch(e){ state.exchangeBusy = false; console.error('No se pudo registrar', e); showToast('No se pudo completar el movimiento'); render(); }
}

  const seg = (m,l)=>`<button class="pay-btn ${mode===m?'active':''}" onclick="setExchangeMode('${m}')">${l}</button>`;
  return `

      <div class="panel-sub">${mode==='cambio' ? 'El cliente regresa algo y se lleva otra cosa (u otra talla), sin cancelar la venta original.' : 'El cliente regresa algo y se le devuelve su dinero.'}</div>

        <label class="checkbox-row"><input type="radio" name="excond" ${state.exchangeCondition==='merma'?'checked':''} onchange="state.exchangeCondition='merma';render()"><span>Dañado o sin reventa — se da de baja (merma)</span></label>
      </div>
      <div class="form-field"><label>Motivo (opcional)</label><input class="field-input" placeholder="Ej. talla incorrecta, defecto…" value="${(state.exchangeReason||'').replace(/"/g,'&quot;')}" oninput="state.exchangeReason=this.value"></div>
      ${mode==='cambio' ? pickerBlock('in', 'Producto que se lleva', state.exchangeIn, state.exchangeSearchIn) : ''}
      ${amount!==null ? `<div class="panel-sub" style="font-weight:700;margin:10px 0 6px;">${mode==='devolucion'?`Se le regresan ${money(-amount)}`:amount>0?`El cliente paga ${money(amount)} más`:amount<0?`Se le regresan ${money(-amount)}`:'Sin diferencia de precio'}</div>
        ${amount!==0 ? `<div class="form-field"><label>${amount>0?'Cómo paga la diferencia':'Cómo se le regresa'}</label><div class="pay-row">${EXCHANGE_METHODS.map(m=>`<button class="pay-btn ${state.exchangeMethod===m?'active':''}" onclick="state.exchangeMethod='${m}';render()">${m}</button>`).join('')}</div>${state.exchangeMethod==='Efectivo'?`<div class="panel-sub" style="margin-top:6px;">Se anota como ${amount>0?'ingreso':'retiro'} en la caja abierta.</div>`:''}</div>` : ''}` : ''}
      <button class="btn-primary" style="width:100%;margin-top:6px;" ${state.exchangeBusy?'disabled style="opacity:.5;width:100%;margin-top:6px;"':''} onclick="confirmExchange()">${state.exchangeBusy?'Guardando…':(mode==='cambio'?'Confirmar cambio':'Confirmar devolución')}</button>

// La librería del lector de códigos (html5-qrcode, ~400KB) antes se cargaba siempre al abrir el
// POS, aunque la mayoría de las ventas nunca usan la cámara. Ahora sólo se descarga la primera
// vez que de verdad se abre el escáner, y de ahí en adelante queda en caché para la sesión.
let html5QrcodeLoadPromise = null;
function loadHtml5QrcodeLib(){
  if(typeof Html5Qrcode !== 'undefined') return Promise.resolve();
  if(html5QrcodeLoadPromise) return html5QrcodeLoadPromise;
  html5QrcodeLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = ()=> resolve();
    s.onerror = ()=>{ html5QrcodeLoadPromise = null; reject(new Error('No se pudo descargar el lector')); };
    document.head.appendChild(s);
  });
  return html5QrcodeLoadPromise;
}
function openBarcodeScanner(context){
  state.scannerContext = context || 'checkout';
  state.barcodeScannerOpen = true; state.scannerLoading = true; render();
  loadHtml5QrcodeLib().then(()=>{
    state.scannerLoading = false;
    if(!state.barcodeScannerOpen) return; // se cerró mientras cargaba
    render();
    setTimeout(()=>{
      if(typeof Html5Qrcode === 'undefined'){ showToast('No se pudo cargar el lector de cámara — revisa tu conexión'); closeBarcodeScanner(); return; }
      posScannerInstance = new Html5Qrcode('barcode-scanner-view');
      posScannerInstance.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 260, height: 140 } },
        (decodedText)=> onBarcodeScanned(decodedText),
        ()=>{} // errores de "no encontré nada en este cuadro" — normales mientras apunta, se ignoran
      ).catch(()=>{
        showToast('No se pudo abrir la cámara — revisa que le hayas dado permiso a este sitio');
        closeBarcodeScanner();
      });
    }, 80);
  }).catch(()=>{
    state.scannerLoading = false;
    showToast('No se pudo cargar el lector de cámara — revisa tu conexión');
    closeBarcodeScanner();
  });
}
function onBarcodeScanned(code){
  const match = state.products.find(p=>p.sku && p.sku.toLowerCase()===code.trim().toLowerCase());
  const context = state.scannerContext;
  closeBarcodeScanner();
  if(!match){ showToast(`Código "${code}" no coincide con ningún producto`); return; }
  if(context==='warehouse'){
    state.warehouseOpen = true; state.warehouseSearch = match.name; render();
    return;
  }
  addToCart(match.id);
  showToast(`Agregado: ${match.name}`);
}
function closeBarcodeScanner(){
  state.barcodeScannerOpen = false;
  if(posScannerInstance){
    posScannerInstance.stop().then(()=>{ posScannerInstance.clear(); posScannerInstance=null; }).catch(()=>{ posScannerInstance=null; });
  }
  render();
}
function renderBarcodeScannerModal(){
  return `

/* ============== VENTAS EN ESPERA ==============
   Deja la venta actual guardada (productos, descuento, cliente, notas) para atender a otra persona
   y retomarla después. Se guarda en este dispositivo, por centro. No reserva inventario: el stock
   se valida al cobrar. */
function heldStorageKey(){ return state.activeCenter ? `cdlp_pos_held_${state.activeCenter.id}` : null; }
function loadHeldSales(){
  const k = heldStorageKey(); state.heldSales = [];
  if(!k) return;
  try{ const raw = JSON.parse(localStorage.getItem(k)||'[]'); if(Array.isArray(raw)) state.heldSales = raw.filter(h=>h && h.cart && Object.keys(h.cart).length); }catch(e){}
}
function saveHeldSales(){
  const k = heldStorageKey(); if(!k) return;
  try{ if(state.heldSales.length) localStorage.setItem(k, JSON.stringify(state.heldSales)); else localStorage.removeItem(k); }catch(e){}
}
function holdCurrentSale(silent){
  if(cartCount()===0){ if(!silent) showToast('Agrega productos antes de ponerla en espera'); return false; }
  const n = state.heldSales.length + 1;
  const label = state.activeCustomer ? state.activeCustomer.name : ('Venta en espera ' + n);
  state.heldSales.push({
    id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    label, date: new Date().toISOString(), by: state.activeCashier ? state.activeCashier.name : '',
    cart: JSON.parse(JSON.stringify(state.cart)),
    manualDiscount: state.manualDiscount ? JSON.parse(JSON.stringify(state.manualDiscount)) : null,
    customer: state.activeCustomer ? JSON.parse(JSON.stringify(state.activeCustomer)) : null,
    notes: state.saleNotes || '', payMethod: state.payMethod, splitAmounts: {...(state.splitAmounts||{})},
    total: saleTotal(), count: cartCount(),
  });
  saveHeldSales();
  state.cart = {}; state.manualDiscount = null; state.activeCustomer = null; state.saleNotes = ''; state.splitAmounts = {}; state.payMethod = 'Efectivo';
  savePosCart();
  if(!silent) showToast('Venta puesta en espera. Ya puedes atender a otra persona');
  render();
  return true;
}

/* ============== ANULAR UNA VENTA DESDE EL POS ============== */
const VOID_REASONS = ['Error al capturar','El cliente se arrepintió','Producto defectuoso','Cobro duplicado','Otro'];
function posSaleItemsNet(sale){
  const ret = {}; (sale.returns||[]).forEach(r=>(r.items||[]).forEach(i=>{ ret[i.idx] = (ret[i.idx]||0) + (i.qty||0); }));
  return (sale.items||[]).map((it,idx)=>({...it, qty: Math.max(0,(it.qty||0)-(ret[idx]||0))})).filter(it=>it.qty>0);
}
async function posRestoreStock(sale){
  const centerId = sale.centerId || (state.activeCenter && state.activeCenter.id);
  const demand = new Map();
  const dget = (id)=>{ let d = demand.get(id); if(!d){ d = {center:0, variants:new Map()}; demand.set(id,d); } return d; };
  posSaleItemsNet(sale).forEach(it=>{
    if(!it.id || it.id==='promo_buyxpayy') return;
    const p = state.products.find(x=>x.id===it.id);
    if(p && p.isKit){ (p.kitItems||[]).forEach(ki=>{ const d=dget(ki.productId); if(ki.variantId) d.variants.set(ki.variantId,(d.variants.get(ki.variantId)||0)+(ki.qty||1)*it.qty); else d.center += (ki.qty||1)*it.qty; }); return; }
    if(it.variantId){ const d = dget(it.id); d.variants.set(it.variantId, (d.variants.get(it.variantId)||0)+it.qty); return; }
    dget(it.id).center += it.qty;
  });
  const ids = Array.from(demand.keys());
  if(!ids.length) return [];
  return await db.runTransaction(async (tx)=>{
    const refs = ids.map(id=>db.collection('products').doc(id));
    const snaps = await Promise.all(refs.map(r=>tx.get(r)));
    const done = [];
    snaps.forEach((snap, i)=>{
      if(!snap.exists) return;
      const d = demand.get(ids[i]), data = snap.data(), payload = {};
      if(d.center>0){
        const sbc = {...(data.stockByCenter||{})};
        sbc[centerId] = (sbc[centerId]||0) + d.center;
        payload.stockByCenter = sbc; payload.stock = Object.values(sbc).reduce((a,n)=>a+(n||0),0);
      }
      if(d.variants.size){
        const variants = (data.variants||[]).map(v=>({...v}));
        d.variants.forEach((qty,vid)=>{ const v = variants.find(x=>x.id===vid); if(v){ if(v.stockByCenter) v.stockByCenter = {...v.stockByCenter}; vSetCenterStock(v, centerId, vCenterStock(v,centerId)+qty); } });
        const tmp = {variants, stockByCenter: payload.stockByCenter || data.stockByCenter}; vProductSync(tmp);
        payload.variants = variants; payload.stock = tmp.stock; payload.stockByCenter = tmp.stockByCenter;
      }
      tx.update(refs[i], payload);
      done.push({id:ids[i], payload});
    });
    return done;
  });
}
function openVoidSale(id){
  const v = state.salesListItems.find(x=>x.id===id); if(!v) return;
  if(v.status==='Cancelado'){ showToast('Esa venta ya está cancelada'); return; }

async function confirmVoidSale(){
  const m = state.voidModal; if(!m || m.busy) return;
  const v = state.salesListItems.find(x=>x.id===m.id); if(!v) return;
  if(!navigator.onLine){ showToast('Necesitas conexión para anular una venta'); return; }

    posSaleItemsNet(v).forEach(it=>{ if(it.id && it.id!=='promo_buyxpayy') logStockMovement(it.id, 'cancelacion_pos', it.qty, `Venta ${v.orderNumber?formatFolio(v.orderNumber):''} anulada desde el POS: ${m.reason}`, v.centerId || state.activeCenter.id); });

// de golpe (lento en tablets y hace scroll interminable), se muestran de a poco con

const PROD_GRID_PAGE_SIZE = 24;
function toastStack(){
  let s=document.getElementById('toast-stack');
  if(!s){ s=document.createElement('div'); s.id='toast-stack'; s.className='toast-stack'; s.setAttribute('role','status'); s.setAttribute('aria-live','polite'); document.body.appendChild(s); }
  return s;
}
function showToast(msg){
  const s=toastStack(); msg=String(msg==null?'':msg);
  // el mismo aviso repetido no se duplica: solo reinicia su tiempo
  let t=[...s.querySelectorAll('.toast')].find(x=>x.textContent===msg && !x.classList.contains('out'));
  if(!t){
    t=document.createElement('div'); t.className='toast show'; t.textContent=msg;
    s.insertBefore(t, s.querySelector('.undo-bar')||null);   // el aviso "Deshacer" queda siempre al final (abajo)
    const all=[...s.querySelectorAll('.toast')]; if(all.length>5) all[0].remove();
  }
  clearTimeout(t._t); t._t=setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),230); }, 2600);
}

/* ============== CARRITO DE VENTA: PERSISTENCIA ANTE UN REFRESH ACCIDENTAL ==============
   Antes, si la pantalla se recargaba a media venta (un refresh sin querer, se cerró la pestaña,
   el navegador se reinició), el carrito en curso se perdía por completo y había que volver a
   capturar todo. Se guarda en este dispositivo, por cajero + centro (para no mezclar el carrito
   de alguien más si cambia de cajero o de sucursal), y se borra en cuanto la venta se cobra o se
   cancela — nunca sobrevive más allá de esa sesión de cajero+centro. */
function posCartStorageKey(){
  if(!state.activeCashier || !state.activeCenter) return null;
  return `cdlp_pos_cart_${state.activeCenter.id}_${state.activeCashier.id||state.activeCashier.name}`;
}
function savePosCart(){
  const key = posCartStorageKey(); if(!key) return;
  try{
    if(state.cart && Object.keys(state.cart).length) localStorage.setItem(key, JSON.stringify(state.cart));
    else localStorage.removeItem(key);
  }catch(e){ /* almacenamiento no disponible, se ignora */ }
}
function restorePosCart(){
  loadHeldSales();
  const key = posCartStorageKey(); if(!key) return;
  try{
    const raw = localStorage.getItem(key);
    const parsed = raw ? JSON.parse(raw) : null;
    if(parsed && typeof parsed==='object' && !Array.isArray(parsed) && Object.keys(parsed).length){
      state.cart = parsed;
      showToast('Se recuperó una venta que había quedado a medias');
    }
  }catch(e){ /* dato corrupto, se ignora y el carrito queda vacío */ }
}
function clearPosCart(){
  const key = posCartStorageKey();
  if(key){ try{ localStorage.removeItem(key); }catch(e){} }
}
/* ---- Reporta qué cajero está usando el POS ahora mismo, para que se vea en el panel de
   administración (pestaña Caja). Se guarda un documento por cajero, con un "latido" cada minuto
   para que el panel sepa si la sesión sigue realmente activa o ya se quedó abandonada. ---- */
let posHeartbeatTimer = null;
async function reportActivePosSession(){
  state.posSessionReported = true;
  const docId = state.activeCashier.id || state.activeCashier.name;
  try{
    await db.collection('activePosSessions').doc(docId).set({
      cashierName: state.activeCashier.name, centerId: state.activeCenter.id, centerName: state.activeCenter.name,
      startedAt: new Date().toISOString(), lastActive: new Date().toISOString(),
    });
  }catch(e){ console.error('No se pudo reportar la sesión activa del POS', e); }
  if(posHeartbeatTimer) clearInterval(posHeartbeatTimer);
  posHeartbeatTimer = setInterval(()=>{
    db.collection('activePosSessions').doc(docId).set({lastActive: new Date().toISOString()}, {merge:true}).catch(()=>{});
  }, 60000);
}
async function clearActivePosSession(){
  if(posHeartbeatTimer){ clearInterval(posHeartbeatTimer); posHeartbeatTimer=null; }
  const wasReported = state.posSessionReported;
  state.posSessionReported = false;
  if(!wasReported || !state.activeCashier) return;
  const docId = state.activeCashier.id || state.activeCashier.name;
  try{ await db.collection('activePosSessions').doc(docId).delete(); }catch(e){ console.error('No se pudo cerrar la sesión activa del POS', e); }
}
function changeCashier(){
  clearActivePosSession();

/* ============== APERTURA / CIERRE DE CAJA ==============
   La caja pertenece a la combinación cajero + centro: si el mismo cajero vuelve
   a entrar al mismo centro más tarde (incluso desde otro dispositivo), retoma la
   caja que dejó abierta, junto con sus movimientos. */
async function loadCashRegister(){
  state.cashRegisterLoading = true;
  try{
    const snap = await db.collection('cashRegisters')
      .where('cashierId','==', state.activeCashier.id)
      .where('centerId','==', state.activeCenter.id)
      .where('status','==','abierta')
      .limit(1).get();
    state.activeCashRegister = snap.empty ? null : {id:snap.docs[0].id, ...snap.docs[0].data()};
    // Si la caja que se retoma se abrió otro día (se le olvidó cerrarla al terminar el
    // turno anterior), se avisa en vez de dejarla resumir en silencio como si nada.
    state.cashRegisterStale = state.activeCashRegister ? (new Date(state.activeCashRegister.openedAt).toDateString() !== new Date().toDateString()) : false;
  }catch(e){ console.error(e); showToast('No se pudo verificar la caja'); state.activeCashRegister=null; }
  state.cashRegisterChecked = true; state.cashRegisterLoading = false; render();
}
async function openCashRegister(){
  if(state.openingSubmitting) return;
  const amount = state.openingDenomMode ? denomTotal('o') : Number(state.openingAmountInput);
  if(!state.openingDenomMode && (state.openingAmountInput.trim()==='' || isNaN(amount) || amount<0)){ state.openingError='Ingresa un monto válido'; render(); return; }
  if(state.openingDenomMode && !(state.openingDenoms && Object.values(state.openingDenoms).some(n=>n>0)) ){ state.openingError='Cuenta al menos un billete o moneda, o escribe el total directo'; render(); return; }
  state.openingSubmitting = true; state.openingError=''; render();
  const payload = {
    cashierId: state.activeCashier.id, cashierName: state.activeCashier.name,
    centerId: state.activeCenter.id, centerName: state.activeCenter.name,
    openedAt: new Date().toISOString(), openingAmount: amount,
    status: 'abierta', movements: [],
  };
  if(state.openingDenomMode){
    const bd = {}; CASH_DENOMS.forEach(x=>{ const n=(state.openingDenoms||{})[x.k]||0; if(n>0) bd[x.k]=n; });
    if(Object.keys(bd).length) payload.openingBreakdown = bd;
  }
  try{
    const ref = await db.collection('cashRegisters').add(payload);
    state.activeCashRegister = {id:ref.id, ...payload};
    state.openingAmountInput=''; state.openingDenomMode=false; state.openingDenoms={};
    showToast('Caja abierta');
  }catch(e){ console.error(e); showToast('No se pudo abrir la caja'); }
  state.openingSubmitting = false; render();
}

async function saveCashMovement(){

/* ---- Arqueo por denominaciones: cuenta billetes y monedas, y el total pasa solo a "Efectivo contado". ---- */
const CASH_DENOMS = [
  {k:'b1000', v:1000, label:'$1,000', group:'Billetes'}, {k:'b500', v:500, label:'$500', group:'Billetes'},
  {k:'b200', v:200, label:'$200', group:'Billetes'}, {k:'b100', v:100, label:'$100', group:'Billetes'},
  {k:'b50', v:50, label:'$50', group:'Billetes'}, {k:'b20', v:20, label:'$20', group:'Billetes'},
  {k:'m20', v:20, label:'$20', group:'Monedas'}, {k:'m10', v:10, label:'$10', group:'Monedas'},
  {k:'m5', v:5, label:'$5', group:'Monedas'}, {k:'m2', v:2, label:'$2', group:'Monedas'},
  {k:'m1', v:1, label:'$1', group:'Monedas'}, {k:'m050', v:0.5, label:'50¢', group:'Monedas'},
];
function moneyCompact(n){ return moneyExact(n).replace(' MXN',''); }
function DN(ctx){ return ctx==='o' ? {obj:(state.openingDenoms||(state.openingDenoms={})), pre:'dno-'} : {obj:(state.closingDenoms||(state.closingDenoms={})), pre:'dn-'}; }
function denomTotal(ctx){
  const d = DN(ctx).obj;
  return Math.round(CASH_DENOMS.reduce((s,x)=>s+(d[x.k]||0)*x.v,0)*100)/100;
}
function closeDiffHtml(){
  const s = state.closingSummary; if(!s) return '';
  if(state.closingCountedCash.trim()==='') return '';
  const diff = Math.round(((Number(state.closingCountedCash)||0) - s.expectedCash)*100)/100;
  return `<div style="text-align:center;font-weight:700;margin:-4px 0 10px;color:${diff===0?'var(--green)':(diff>0?'var(--amber)':'var(--rose)')};">${diff===0?'Cuadra exacto':(diff>0?`Sobrante de ${moneyExact(diff)}`:`Faltante de ${moneyExact(Math.abs(diff))}`)}</div>`;
}
// Actualiza solo los números en pantalla (sin volver a dibujar todo) para no perder el foco al teclear.
function refreshCloseTotals(){
  if(state.closingDenomMode){
    const t = denomTotal();
    state.closingCountedCash = t>0 ? String(t) : '';
    CASH_DENOMS.forEach(x=>{ const el=document.getElementById('dn-sub-'+x.k); if(el) el.textContent = moneyCompact((state.closingDenoms[x.k]||0)*x.v); });
    const tt = document.getElementById('dn-total'); if(tt) tt.textContent = moneyExact(t);
  }
  const dv = document.getElementById('close-diff'); if(dv) dv.innerHTML = closeDiffHtml();
}
function refreshOpenTotals(){
  const t = denomTotal('o');
  state.openingAmountInput = t>0 ? String(t) : '';
  CASH_DENOMS.forEach(x=>{ const el=document.getElementById('dno-sub-'+x.k); if(el) el.textContent = moneyCompact((state.openingDenoms[x.k]||0)*x.v); });
  const tt = document.getElementById('dno-total'); if(tt) tt.textContent = moneyExact(t);
}
function setDenom(k, val, ctx){
  const n = Math.max(0, Math.min(99999, parseInt(val,10)||0));
  const {obj,pre} = DN(ctx);
  obj[k] = n;
  const inp = document.getElementById(pre+'in-'+k); if(inp && String(inp.value)!==String(n) && document.activeElement!==inp) inp.value = n;
  if(ctx==='o') refreshOpenTotals(); else refreshCloseTotals();
}
function stepDenom(k, delta, ctx){
  const {obj,pre} = DN(ctx);
  setDenom(k, (obj[k]||0)+delta, ctx);
  const inp = document.getElementById(pre+'in-'+k); if(inp) inp.value = (obj[k]||0);
}
function toggleDenomMode(){
  state.closingDenomMode = !state.closingDenomMode;
  if(state.closingDenomMode){ const t=denomTotal(); state.closingCountedCash = t>0 ? String(t) : ''; }
  render();
}
function toggleOpenDenomMode(){
  state.openingDenomMode = !state.openingDenomMode;
  if(state.openingDenomMode){ const t=denomTotal('o'); state.openingAmountInput = t>0 ? String(t) : ''; }
  render();
}
function renderDenomBox(ctx){
  const {obj:d,pre} = DN(ctx); const cx = ctx==='o' ? ",'o'" : '';
  let lastGroup = '';
  const rows = CASH_DENOMS.map(x=>{
    const head = x.group!==lastGroup ? `<div class="denom-group">${x.group}</div>` : '';
    lastGroup = x.group;
    const n = d[x.k]||0;
    return `${head}<div class="denom-row">
      <div class="denom-label">${x.label}</div>
      <div class="denom-step">
        <button type="button" aria-label="Quitar uno de ${x.group==='Billetes'?'billete':'moneda'} de ${x.label}" onclick="stepDenom('${x.k}',-1${cx})">−</button>
        <input id="${pre}in-${x.k}" type="number" inputmode="numeric" min="0" step="1" value="${n||''}" placeholder="0" aria-label="Cantidad de ${x.group==='Billetes'?'billetes':'monedas'} de ${x.label}" oninput="setDenom('${x.k}',this.value${cx})">
        <button type="button" aria-label="Agregar uno de ${x.group==='Billetes'?'billete':'moneda'} de ${x.label}" onclick="stepDenom('${x.k}',1${cx})">+</button>
      </div>
      <div class="denom-sub" id="${pre}sub-${x.k}">${moneyCompact(n*x.v)}</div>
    </div>`;
  }).join('');
  return `<div class="denom-box">${rows}<div class="denom-total"><span>Total</span><span id="${pre}total">${moneyExact(denomTotal(ctx))}</span></div></div>`;
}
async function openCashClose(){
  state.closingLoading = true; render();
  try{
    const snap = await db.collection('sales').where('cashRegisterId','==', state.activeCashRegister.id).get();
    const sales = snap.docs.map(d=>d.data()).filter(x=>x.status!=='Cancelado');
    const byPayment = {};
    PAY_METHODS.forEach(m=>byPayment[m]=0);
    let total=0;
    sales.forEach(s=>{
      salePayments(s).forEach(pm=>{
        const m = byPayment.hasOwnProperty(pm.method) ? pm.method : 'Efectivo';
        byPayment[m]=(byPayment[m]||0)+(pm.amount||0);
      });
      total+=s.total||0;
    });
    const movs = state.activeCashRegister.movements||[];
    const ingresos = movs.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.amount,0);
    const retiros = movs.filter(m=>m.type==='retiro').reduce((s,m)=>s+m.amount,0);
    const expectedCash = (state.activeCashRegister.openingAmount||0) + (byPayment['Efectivo']||0) + ingresos - retiros;
    state.closingSummary = { salesCount: sales.length, total, byPayment, ingresos, retiros, expectedCash };
    state.closingCountedCash=''; state.closingNotes=''; state.closingError=''; state.closingDenomMode=false; state.closingDenoms={};
    state.closingOpen = true;
  }catch(e){ console.error(e); showToast('No se pudo preparar el cierre de caja'); }
  state.closingLoading=false; render();
}

    </div>

    <div id="close-diff">${closeDiffHtml()}</div>

  </div></div>`;

async function confirmCashClose(){
  if(state.closingCountedCash.trim()===''){ state.closingError='Ingresa el efectivo contado'; render(); return; }
  const counted = Number(state.closingCountedCash);
  if(isNaN(counted) || counted<0){ state.closingError='Monto inválido'; render(); return; }
  const s = state.closingSummary;
  const diff = counted - s.expectedCash;
  const payload = {
    status:'cerrada', closedAt: new Date().toISOString(),
    salesCount: s.salesCount, totalSales: s.total, salesByPayment: s.byPayment,
    cashIngresos: s.ingresos, cashRetiros: s.retiros,
    expectedCash: s.expectedCash, countedCash: counted, difference: diff,
    closingNotes: state.closingNotes.trim(),
  };
  if(state.closingDenomMode){
    const bd = {};
    CASH_DENOMS.forEach(x=>{ const n=(state.closingDenoms||{})[x.k]||0; if(n>0) bd[x.k]=n; });
    if(Object.keys(bd).length) payload.countedBreakdown = bd;
  }
  try{
    await db.collection('cashRegisters').doc(state.activeCashRegister.id).update(payload);
  }catch(e){ console.error(e); showToast('No se pudo cerrar la caja'); return; }
  showToast('Caja cerrada');
  clearActivePosSession();
  clearPosCart();
  state.activeCashRegister=null; state.cashRegisterChecked=false; state.closingOpen=false; state.closingSummary=null;
  state.activeCashier=null; state.pinConfirmed=false; state.cart={};
  render();
}

function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
/* Ofertas relámpago (se programan en Admin → Marketing): mismo cálculo que la tienda. */
function flashFor(p){
  if(!p || p.isKit) return null;
  const now = Date.now(), cats = (p.categories&&p.categories.length)?p.categories:[p.cat];
  const f = ((state.settings&&state.settings.flashSales)||[]).find(x=>x.active!==false && x.percent>0 && x.start && x.end && new Date(x.start).getTime()<=now && new Date(x.end).getTime()>now && ((x.productIds||[]).includes(p.id) || (x.categories||[]).some(c=>cats.includes(c))));
  if(!f) return null;
  const price = Math.round(p.price*(1-f.percent/100)*100)/100;
  return price<p.price ? {sale:f, price} : null;
}
function effectivePrice(p){
  const base = (p.promoPrice>0 && p.promoPrice<p.price) ? p.promoPrice : p.price;
  const fl = flashFor(p);
  return fl && fl.price<base ? fl.price : base;
}
function cartKey(productId, variantId){ return variantId ? `${productId}::${variantId}` : productId; }
function parseCartKey(key){
  const parts = key.split('::');
  const p = state.products.find(x=>x.id===parts[0]);
  const v = (parts[1] && p) ? (p.variants||[]).find(x=>x.id===parts[1]) : null;
  return {p, v};
}
// Aviso al elegir método de pago: si la venta no lleva ninguno de los productos que Ale marcó
// como "para recordar ofrecer" (lubricante, condones, etc.), se detiene un momento antes de
// marcar el método de pago para sugerirlos — una sola vez por venta, no cada vez que se toque
// un botón de método de pago.
function cartHasReminderProduct(){
  const reminderIds = state.settings.checkoutReminderProducts || [];
  if(!reminderIds.length) return true; // sin lista configurada, no hay nada que recordar
  return Object.keys(state.cart).some(key=>{
    const {p, v} = parseCartKey(key);
    return p && (reminderIds.includes(p.id) || (v && reminderIds.includes(p.id+'::'+v.id)));
  });
}
function selectPayMethod(m){
  if(!state.checkoutReminderShown && !cartHasReminderProduct()){
    state.pendingPayMethod = m;
    state.checkoutReminderOpen = true;
    render();
    return;
  }
  state.payMethod = m;
  render();
}
function addReminderProductAndContinue(id, vid){
  if(vid){
    const p = state.products.find(x=>x.id===id), v = p && (p.variants||[]).find(x=>x.id===vid);
    if(p && v){
      const key = cartKey(id, vid);
      if(itemStockPOS(p,v)<=(state.cart[key]||0)){ showToast('Sin existencias suficientes de esta variante'); return; }
      state.cart[key] = (state.cart[key]||0)+1; state.cartPanelOpen=true; trackFrequent(id); savePosCart();
    }
  } else addToCart(id);
  closeCheckoutReminder(true);
}
function closeCheckoutReminder(applyPending){
  state.checkoutReminderOpen = false;
  state.checkoutReminderShown = true; // no volver a interrumpir en esta misma venta
  if(applyPending && state.pendingPayMethod){ state.payMethod = state.pendingPayMethod; }
  state.pendingPayMethod = null;
  render();
}
function renderCheckoutReminderModal(){
  const items = [];
  (state.settings.checkoutReminderProducts||[]).forEach(ref=>{
    const [pid, vid] = String(ref).split('::');
    const p = state.products.find(x=>x.id===pid); if(!p) return;
    if(vid){ const v=(p.variants||[]).find(x=>x.id===vid); if(!v) return; items.push({p, v}); }
    else items.push({p, v:null});
  });
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:380px;">
      <h3>Antes de cobrar…</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px;">¿Ya le preguntaste si necesita algo más? A veces un lubricante hace toda la diferencia.</p>
      ${items.map(({p,v})=>`
        <button class="cashier-item" style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;" onclick="addReminderProductAndContinue('${p.id}'${v?`,'${v.id}'`:''})">
          <span>${p.name}${v?` · ${variantLabel(v)}`:''}</span><span style="font-weight:800;">${money(v?itemPrice(p,v):effectivePrice(p))}</span>
        </button>`).join('')}
      <button class="btn-secondary" style="margin-top:6px;" onclick="closeCheckoutReminder(true)">Ya se lo ofrecí, continuar</button>
    </div>
  </div>`;
}
function variantListPrice(p, v){ return v && v.priceOverride>0 ? v.priceOverride : p.price; }
// Precio por unidad: promoción propia de la variante, luego su precio propio y si no, el del producto con sus promociones.
function itemPrice(p, v){
  if(v){
    const list = variantListPrice(p, v);
    if(v.promoPriceOverride>0 && v.promoPriceOverride<list) return v.promoPriceOverride;
    if(v.priceOverride>0) return v.priceOverride;
  }
  return effectivePrice(p);
}
function posDisplayPrice(p){
  const vs = p.variants||[];
  if(!vs.length || !vs.some(v=>v.priceOverride>0 || v.promoPriceOverride>0)){ const pr = effectivePrice(p); return {price:pr, was:pr<p.price?p.price:0, from:false}; }
  const inStock = vs.filter(v=>vCenterStock(v,state.activeCenter.id)>0), pool = inStock.length ? inStock : vs;
  const rows = pool.map(v=>({v, price:itemPrice(p,v)}));
  const min = rows.reduce((a,b)=>b.price<a.price?b:a);
  const list = variantListPrice(p, min.v);
  return {price:min.price, was:min.price<list?list:0, from:rows.some(r=>Math.round(r.price*100)!==Math.round(min.price*100))};
}
function itemStockPOS(p, v){ return v ? vCenterStock(v, state.activeCenter.id) : centerStock(p, state.activeCenter.id); }
function variantLabel(v){ return v ? Object.values(v.combo||{}).join(' / ') : ''; }
function cartTotal(){ return Object.entries(state.cart).reduce((s,[key,qty])=>{const {p,v}=parseCartKey(key); return s+(p?itemPrice(p,v)*qty:0);},0); }
// "Frecuentes": cada dispositivo recuerda (en localStorage, sin tocar Firestore) qué
// productos se agregan más seguido en ESTE punto de venta, para ofrecer un acceso
// rápido sin tener que escribir el nombre cada vez.
function trackFrequent(productId){
  try{
    const counts = JSON.parse(localStorage.getItem('cdlp_pos_frequent')||'{}');
    counts[productId] = (counts[productId]||0) + 1;
    localStorage.setItem('cdlp_pos_frequent', JSON.stringify(counts));
  }catch(e){}
}
function getFrequentProductIds(limit){
  try{
    const counts = JSON.parse(localStorage.getItem('cdlp_pos_frequent')||'{}');
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit||18).map(([id])=>id);
  }catch(e){ return []; }
}
function addToCart(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  if(p.variantGroups && p.variantGroups.length){ state.variantPickerProduct = id; render(); return; }
  const available = centerStock(p, state.activeCenter.id);
  if(available<=(state.cart[id]||0)){ showToast(`Sin existencias suficientes en ${state.activeCenter.name}`); return; }
  const wasEmpty = cartCount()===0; // primer producto de esta venta: se abre solo para que se note
  state.cart[id]=(state.cart[id]||0)+1;
  if(wasEmpty) state.cartCollapsed=false;
  state.cartPanelOpen=true;
  trackFrequent(id); savePosCart(); render();
}
function pickVariant(variantId){
  const p = state.products.find(x=>x.id===state.variantPickerProduct);
  const v = (p.variants||[]).find(x=>x.id===variantId);
  const key = cartKey(p.id, variantId);
  if(itemStockPOS(p,v)<=(state.cart[key]||0)){ showToast('Sin existencias suficientes de esta variante'); return; }
  const wasEmpty = cartCount()===0;
  state.cart[key] = (state.cart[key]||0)+1;
  state.variantPickerProduct = null;
  if(wasEmpty) state.cartCollapsed = false;
  state.cartPanelOpen=true;
  trackFrequent(p.id);
  savePosCart(); render();
}
function changeQty(id,delta){ const cur=state.cart[id]||0; const next=cur+delta; if(next<=0) delete state.cart[id]; else state.cart[id]=next; savePosCart(); render(); }

/* ============== AJUSTE POR ENVÍO (descuento manual) ==============
   Adicional a los descuentos y promociones ya aplicados en el precio de cada
   producto; requiere siempre un motivo de justificación. */
function prodCats(p){ return (p.categories && p.categories.length) ? p.categories : (p.cat ? [p.cat] : []); }
function isCouponEligibleItem(prodCategories, prodId, coupon){
  if(coupon.scope==='all') return true;
  if(coupon.scope==='categories') return (prodCategories||[]).some(c=>(coupon.categories||[]).includes(c));
  if(coupon.scope==='products') return (coupon.productIds||[]).includes(prodId);
  return false;
}
function couponEligibleCartEntries(coupon){
  return Object.entries(state.cart).map(([key,qty])=>{ const {p,v}=parseCartKey(key); return {key,qty,p,v}; })
    .filter(({p})=>p && isCouponEligibleItem(prodCats(p), p.id, coupon));
}
function couponDiscountAmount(coupon){
  return couponEligibleCartEntries(coupon).reduce((s,{p,v,qty})=>s + Math.round(itemPrice(p,v)*qty*(coupon.discountPercent/100)), 0);
}
function currentDiscountAmount(){
  if(!state.manualDiscount) return 0;
  const subtotal = cartTotal();
  if(state.manualDiscount.type==='percent') return Math.round(subtotal * (state.manualDiscount.value/100));
  if(state.manualDiscount.type==='coupon') return couponDiscountAmount(state.manualDiscount.coupon);
  return Math.min(state.manualDiscount.value, subtotal);
}
function saleTotal(){ return Math.max(0, cartTotal() - currentDiscountAmount()); }
function openDiscountModal(){
  state.discountType = state.manualDiscount ? state.manualDiscount.type : 'fixed';
  state.discountValueInput = state.manualDiscount && state.manualDiscount.type!=='coupon' ? String(state.manualDiscount.value) : '';
  state.discountCouponInput = state.manualDiscount && state.manualDiscount.type==='coupon' ? state.manualDiscount.coupon.code : '';
  state.discountReasonInput = state.manualDiscount ? (state.manualDiscount.reason||'') : '';
  state.discountError = ''; state.discountModalOpen = true; render();
}
function saveManualDiscount(){
  const value = Number(state.discountValueInput);
  const reason = state.discountReasonInput.trim();
  if(state.discountValueInput.trim()==='' || isNaN(value) || value<=0){ state.discountError='Ingresa un monto válido'; render(); return; }
  if(state.discountType==='percent' && value>100){ state.discountError='El porcentaje no puede ser mayor a 100'; render(); return; }
  if(!reason){ state.discountError='Escribe un motivo para el ajuste'; render(); return; }
  state.manualDiscount = {type: state.discountType, value, reason};
  state.discountModalOpen = false; render();
}
async function applyCouponDiscount(){
  const code = state.discountCouponInput.trim().toUpperCase();
  if(!code){ state.discountError='Ingresa un código de cupón'; render(); return; }
  const coupon = (state.coupons||[]).find(c=>c.code===code);
  if(!coupon || !coupon.active){ state.discountError='Código no válido'; render(); return; }
  const now = new Date();
  if(coupon.startDate && now < new Date(coupon.startDate)){ state.discountError='Este cupón todavía no está vigente'; render(); return; }
  if(coupon.endDate && now > new Date(coupon.endDate+'T23:59:59')){ state.discountError='Este cupón ya venció'; render(); return; }
  if(couponEligibleCartEntries(coupon).length===0){ state.discountError='Este cupón no aplica a los productos de la venta actual'; render(); return; }
  if(coupon.maxUses>0){
    try{
      const used = await db.collection('couponUsage').where('code','==',code).get();
      if(used.size >= coupon.maxUses){ state.discountError='Este cupón ya alcanzó su límite de usos'; render(); return; }
    }catch(e){ console.error(e); }
  }
  const reason = state.discountReasonInput.trim();
  state.manualDiscount = {type:'coupon', coupon, reason: reason || `Cupón ${code}`};
  state.discountModalOpen = false; state.discountError=''; render();
}
function removeManualDiscount(){ state.manualDiscount=null; state.discountModalOpen=false; render(); }

      <div class="pay-row" style="margin:0 0 10px;">

        <button class="btn-secondary" onclick="state.discountModalOpen=false;render()">Cancelar</button>
