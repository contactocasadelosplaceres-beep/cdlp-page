/* ============== ORDEN DIARIO DEL CATÁLOGO ==============
   Para que el catálogo no se vea idéntico visita tras visita (antes siempre salía en el mismo
   orden alfabético), el orden base de los productos cambia una vez al día, solo, sin que Ale
   tenga que hacer nada: se calcula un valor "aleatorio" estable por producto a partir de su id
   + el número de día del año (misma fórmula para todos los visitantes ese día, así que no salta
   de un renglón a otro dentro del mismo día ni al usar "cargar más"). Al día siguiente cambia el
   día y con él el orden — no se inventa ni se altera ningún dato del producto, solo el orden en
   que se muestran productos reales que sí existen y sí están en tu catálogo. */
function dailySeed(){ return Math.floor(Date.now()/86400000); }
function seededRank(id, seed){
  let h = seed>>>0;
  const s = String(id||'');
  for(let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 2654435761); h = h>>>0; }
  h = Math.imul(h ^ (h>>>15), 2246822507); h = h>>>0;
  return h;
}
function dailyShuffledProducts(){
  const seed = dailySeed();
  return [...state.products].map(p=>({p, r: seededRank(p.id, seed)})).sort((a,b)=>a.r-b.r).map(x=>x.p);
}

/* ============== FILTRO DE RANGO DE PRECIO ==============
   Se combina con cualquier otro filtro activo (categoría, "para quién" o búsqueda) — nunca lo
   sustituye — comparando contra el precio que el cliente de verdad pagaría (ya con promociones
   y mayoreo aplicados), no el de lista. */
function priceFilterActive(){ return (state.priceMin!=='' && state.priceMin!=null) || (state.priceMax!=='' && state.priceMax!=null); }
function applyPriceFilter(products){
  if(!priceFilterActive()) return products;
  const min = (state.priceMin!=='' && state.priceMin!=null) ? Number(state.priceMin) : -Infinity;
  const max = (state.priceMax!=='' && state.priceMax!=null) ? Number(state.priceMax) : Infinity;
  return products.filter(p=>{ const price = automaticDiscountedPrice(p); return price>=min && price<=max; });
}
// setPriceFilter fuerza un render() completo del catálogo en cada tecla (para reflejar el
// filtro al instante), y ese render() reconstruye el input desde cero — eso le hacía perder el
// foco y el cursor, así que al seguir escribiendo el dígito nuevo no caía donde ibas escribiendo
// sino al final, dando la sensación de que el número "se reordenaba" solo. Se corrige igual que
// ya se hace en el buscador (onSearchInput): después de renderizar, se vuelve a enfocar el mismo
// input y se restaura la posición del cursor donde el usuario iba escribiendo.
function setPriceFilter(which, val){
  state[which] = val; state.gridRenderLimit = 20; render();
  const id = which==='priceMin' ? 'price-min-input' : 'price-max-input';
  const i = document.getElementById(id);
  if(i){ i.focus(); const pos = String(val).length; i.setSelectionRange(pos,pos); }
}
function clearPriceFilter(){ state.priceMin=''; state.priceMax=''; state.gridRenderLimit=20; render(); }
function renderPriceFilterRow(){
  return `
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;">
    <span style="font-size:12.5px;color:var(--ink-soft);font-weight:600;">Precio:</span>
    <input id="price-min-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Mín" value="${state.priceMin}" oninput="setPriceFilter('priceMin', this.value.replace(/[^0-9]/g,''))" style="width:84px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;">
    <span style="color:var(--ink-soft);">—</span>
    <input id="price-max-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Máx" value="${state.priceMax}" oninput="setPriceFilter('priceMax', this.value.replace(/[^0-9]/g,''))" style="width:84px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;">
    ${priceFilterActive() ? `<button class="btn-tertiary" onclick="clearPriceFilter()">Quitar filtro</button>` : ''}
  </div>`;
}

/* ============== CATÁLOGO COMPLETO ============== */
function renderGridSection(){
  let filtered = dailyShuffledProducts();
  let heading = 'Catálogo completo';
  let showClearBtn = false;
  let emptyMsg = `No encontramos productos que coincidan. Prueba con otra búsqueda o <a style="color:var(--primary);font-weight:700;" href="${waLink('Hola, no encontré lo que buscaba en el catálogo, ¿me ayudan?')}" target="_blank">escríbenos por WhatsApp</a>.`;
  if(state.activeBestSellers){
    const manualIds = (state.settings.featuredProductIds||[]).filter(id=>state.products.some(p=>p.id===id));
    const idsList = manualIds.length ? manualIds : (state.settings.bestSellerProductIds||[]);
    filtered = idsList.map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
    heading = 'Más vendidos';
    showClearBtn = true;
    emptyMsg = `Todavía no tenemos suficientes ventas para armar esta lista. Mientras tanto, <a style="color:var(--primary);font-weight:700;" onclick="goToCatalog('Todos')">conoce el catálogo completo</a>.`;
  } else if(state.searchQuery.trim()){
    const q = state.searchQuery.trim().toLowerCase();
    filtered = filtered.filter(p=>(p.name||'').toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));
    heading = `Resultados para "${state.searchQuery.trim()}"`;
  } else if(state.activeNeed){
    const need = (state.settings.needs||DEFAULT_NEEDS).find(n=>n.key===state.activeNeed);
    filtered = filtered.filter(p=>(p.needs||[]).includes(state.activeNeed));
    heading = need ? need.label : 'Catálogo completo';
    emptyMsg = `Aún no hemos elegido productos para esta opción. Prueba otra categoría o <a style="color:var(--primary);font-weight:700;" href="${waLink('Hola, no encontré lo que buscaba en el catálogo, ¿me ayudan?')}" target="_blank">escríbenos por WhatsApp</a>.`;
  } else if(state.activeCat!=="Todos"){
    filtered = filtered.filter(p=>productCats(p).includes(state.activeCat));
    // Si Ale fijó un orden a mano para esta categoría (Productos → filtrar por categoría →
    // flechas), esos productos van primero en ese orden; el resto sigue mezclándose entre sí
    // como siempre (sort estable: los sin orden mantienen su posición relativa del shuffle).
    const cat = state.activeCat;
    filtered = filtered.slice().sort((a,b)=>{
      const ao = (a.categorySortOrder||{})[cat]; const bo = (b.categorySortOrder||{})[cat];
      const av = ao!=null ? ao : Infinity, bv = bo!=null ? bo : Infinity;
      return av - bv;
    });
  }
  // Los productos agotados se muestran hasta el final, sin alterar el orden entre sí.
  filtered = applyPriceFilter(filtered);
  filtered = filtered
    .map((p,i)=>({p,i}))
    .sort((a,b)=> (a.p.stock<=0)-(b.p.stock<=0) || a.i-b.i)
    .map(x=>x.p);
  const shown = filtered.slice(0, state.gridRenderLimit);
  const hasMore = filtered.length > shown.length;
  return `
  <div id="catalogo" class="section-block" style="padding-top:10px;">
    <div class="section-head-row" style="margin-bottom:14px;align-items:center;">
      <h2 class="section-heading" style="margin-bottom:0;">${heading}${filtered.length ? ` <span style="color:var(--ink-soft);font-weight:600;font-size:13px;">(${filtered.length})</span>` : ''}</h2>
      ${showClearBtn ? `<button class="btn-tertiary" onclick="goToCatalog('Todos')">${icon('grid',14)} Ver catálogo completo</button>` : ''}
    </div>
    ${renderPriceFilterRow()}
    ${filtered.length
      ? `<div class="grid">${shown.map(p=>renderProductCard(p, state.activeBestSellers)).join('')}</div>
         ${hasMore ? `
           <div class="load-more-wrap">
             <button class="load-more-btn" onclick="loadMoreProducts()">Ver más productos <span class="lm-chev">${icon('chevron-down',16)}</span></button>
             <span class="load-more-count">${filtered.length - shown.length} producto${filtered.length-shown.length===1?'':'s'} más te esperan</span>
           </div>
         ` : ''}`
      : `<div class="empty-state">${emptyMsg}</div>`}
  </div>`;
}
const GRID_PAGE_SIZE = 20;
function loadMoreProducts(){ state.gridRenderLimit += GRID_PAGE_SIZE; render(); }

// Un producto se considera "Nuevo" durante sus primeros NEW_BADGE_DAYS días de vida, contados
// desde createdAt (solo lo tienen los productos creados desde esta actualización en adelante —
// no se les inventa una fecha a los que ya existían).
const NEW_BADGE_DAYS = 14;
function isNewProduct(p){
  if(!p.createdAt) return false;
  const days = (Date.now() - new Date(p.createdAt).getTime()) / 86400000;
  return days>=0 && days<=NEW_BADGE_DAYS;
}
/* ============== CUENTA REGRESIVA EN PROMOCIONES ==============
   Las promociones automáticas (state.settings.promotions) ya tenían fecha de fin opcional, pero
   nunca se comunicaba al cliente cuánto faltaba para que se acabara — solo dejaba de aplicarse
   en silencio. Ahora, si un producto entra en el alcance de una promo con fecha de fin, se
   muestra una cuenta regresiva junto al precio, usando la fecha más próxima entre las promos
   que le aplican. Un temporizador ligero refresca la pantalla mientras haya alguna cuenta
   regresiva visible, para que no se quede pegada en un número viejo. */
function soonestPromoEndDate(p){
  let soonest = null;
  activePromotions().forEach(promo=>{
    if(!promo.endDate) return;
    let applies = false;
    if(promo.type==='cross_sell') applies = promo.discountProductId===p.id || promo.triggerProductId===p.id;
    else applies = isPromoScopeEligible(p, promo);
    if(!applies) return;
    const end = new Date(promo.endDate+'T23:59:59');
    if(!soonest || end < soonest) soonest = end;
  });
  return soonest;
}
function formatPromoCountdown(endDate){
  const diffMs = endDate.getTime() - Date.now();
  if(diffMs <= 0) return null;
  const totalMinutes = Math.floor(diffMs/60000);
  const days = Math.floor(totalMinutes/1440);
  const hours = Math.floor((totalMinutes%1440)/60);
  const minutes = totalMinutes%60;
  if(days>=1) return `Termina en ${days} día${days===1?'':'s'}`;
  if(hours>=1) return `Termina en ${hours}h ${minutes}min`;
  return `Termina en ${minutes} min`;
}
function renderPromoCountdownBadge(p){
  const end = soonestPromoEndDate(p);
  if(!end) return '';
  const label = formatPromoCountdown(end);
  if(!label) return '';
  return `<span class="badge badge-best promo-countdown" style="background:var(--rose);">⏳ ${label}</span>`;
}
let promoCountdownTimer = null;
function ensurePromoCountdownTimer(){
  const hasCountdown = state.products.some(p=>soonestPromoEndDate(p));
  if(hasCountdown && !promoCountdownTimer){
    promoCountdownTimer = setInterval(()=>{
      if(state.products.some(p=>soonestPromoEndDate(p))) render(); else { clearInterval(promoCountdownTimer); promoCountdownTimer = null; }
    }, 60000);
  } else if(!hasCountdown && promoCountdownTimer){
    clearInterval(promoCountdownTimer); promoCountdownTimer = null;
  }
}
// Antes se podían juntar hasta 7 insignias sobre la misma tarjeta (Nuevo, Más vendido, Combo,
// Caja sorpresa, Oferta, cuenta regresiva, Mayoreo, Agotado/Últimas piezas) — ilegible y le resta
// peso a la que de verdad importa. Aquí se arma la lista completa con una prioridad (lo que más
// ayuda a decidir una compra primero: disponibilidad y urgencia de precio) y se muestran máximo 2.
function renderProductBadges(p, ctx){
  const candidates = [];
  if(p.stock<=3) candidates.push({priority:1, html:`<span class="badge badge-stock">${p.stock===0?'Agotado':'Últimas piezas'}</span>`});
  const countdown = renderPromoCountdownBadge(p);
  if(countdown) candidates.push({priority:2, html:countdown});
  else if(ctx.hasPromo) candidates.push({priority:2, html:`<span class="badge badge-best" style="background:var(--rose);">Oferta</span>`});
  if(ctx.wholesaleEligible) candidates.push({priority:3, html:`<span class="badge badge-best" style="background:var(--navy);">${ctx.wholesaleUnlocked?'Mayoreo activo':'Mayoreo disponible'}</span>`});
  if(p.isKit) candidates.push({priority:4, html:`<span class="badge badge-best" style="background:var(--navy);">Combo</span>`});
  if(p.isMysteryBox) candidates.push({priority:4, html:`<span class="badge badge-best" style="background:var(--navy);">Caja sorpresa</span>`});
  if(ctx.isBest) candidates.push({priority:5, html:`<span class="badge badge-best">Más vendido</span>`});
  if(isNewProduct(p)) candidates.push({priority:6, html:`<span class="badge badge-best" style="background:var(--teal);">Nuevo</span>`});
  return candidates.sort((a,b)=>a.priority-b.priority).slice(0,2).map(c=>c.html).join('');
}
function renderProductCard(p, forceBest){
  const isBest = forceBest || (state.settings.featuredProductIds||[]).includes(p.id);
  const isGenericDesc = p.desc && /^Compra en línea .+ por \$[\d.,]+\.? Haz tu pedido y paga en línea\.?$/i.test(p.desc.trim());
  const hasVariants = p.variantGroups && p.variantGroups.length>0;
  const hasPromo = p.promoPrice>0 && p.promoPrice<p.price;
  const tier = activeWholesaleTier();
  const wholesaleEligible = tier && isEligibleForTier(p, tier);
  const wholesaleUnlocked = wholesaleEligible && wholesaleCartProgress(tier).unlocked;
  return `
      <div class="card" onclick="openProductDetail('${p.id}')">
        <div class="card-media">
          <div class="card-image-wrap">
            ${productImageHtml(p)}
            <div class="badge-row">${renderProductBadges(p, {isBest, hasPromo, wholesaleEligible, wholesaleUnlocked})}</div>
          </div>
          ${isKioskMode() ? '' : `
          <button class="fab-add" ${p.stock<=0?'disabled':''} onclick="event.stopPropagation();${hasVariants?`openProductDetail('${p.id}')`:`addToCart('${p.id}')`}">+</button>
          <button class="wishlist-fab" aria-label="Agregar a favoritos" onclick="event.stopPropagation();toggleWishlist('${p.id}')">

/* ============== COMPARAR PRODUCTOS LADO A LADO ==============
   Hasta 3 productos a la vez, elegidos desde su ficha de detalle (el botón de comparar, junto
   al de favoritos). En cuanto hay 2 o más, aparece una barra fija para abrir la comparación —
   igual que la barra del carrito — con precio, categoría, disponibilidad y descripción una al
   lado de la otra, para decidir entre opciones parecidas sin ir y venir entre fichas. */
const COMPARE_MAX = 3;
function isComparing(id){ return state.compareIds.includes(id); }
function toggleCompare(id){
  // El icono de "comparar" (las dos barras junto al corazón de favoritos) no tenía ninguna
  // confirmación visible al darle clic con un solo producto seleccionado — el único cambio era
  // el color del icono, muy fácil de pasar por alto — por eso parecía que "no hacía nada". Ahora
  // avisamos con un toast en cada clic para que quede claro qué pasó, y solo al llegar a 2
  // productos aparece además la barra "Ver comparación" para abrir el comparativo.
  if(isComparing(id)){
    state.compareIds = state.compareIds.filter(x=>x!==id);
    showToast('Quitado de comparar');
    render(); return;
  }
  if(state.compareIds.length >= COMPARE_MAX){ showToast(`Solo puedes comparar hasta ${COMPARE_MAX} productos a la vez`); return; }
  state.compareIds = [...state.compareIds, id];
  showToast(state.compareIds.length===1 ? 'Agregado a comparar. Elige otro producto para verlos lado a lado.' : `Agregado a comparar (${state.compareIds.length}/${COMPARE_MAX})`);
  render();
}
function clearCompare(){ state.compareIds = []; state.compareOpen = false; render(); }
function compareProducts(){ return state.compareIds.map(id=>state.products.find(p=>p.id===id)).filter(Boolean); }
function renderCompareBar(){
  if(state.compareIds.length < 2 || state.compareOpen) return '';
  return `
  <div class="mobile-cart-bar show" style="background:var(--navy);">

      <span class="mobile-cart-bar-count">Comparando ${state.compareIds.length} producto${state.compareIds.length===1?'':'s'}</span>
    </div>

  </div>`;
}

function renderStore(){
  // El orden real de la tienda ahora sí sigue lo que se guardó en Diseño → Secciones (arrastrar
  // o usar las flechas) — antes ese orden solo servía para mostrar/ocultar, nunca para la
  // posición real, así que reacomodar cualquier sección (el banner incluido) no cambiaba nada
  // en la tienda por más que se moviera ahí. Si aparece una sección nueva que una configuración
  // guardada de antes no conocía todavía, se agrega al final por default, para no perderla.
  const savedSections = (state.settings.sections && state.settings.sections.length) ? state.settings.sections : DEFAULT_SECTIONS;
  const knownKeys = new Set(savedSections.map(s=>s.key));
  const order = [...savedSections.map(s=>s.key), ...DEFAULT_SECTIONS.filter(s=>!knownKeys.has(s.key)).map(s=>s.key)];
  const before = { grid: ['kits'] }; // fixed sections inserted right before a configurable one
  const after = { hero: ['trust','needs'], grid: ['firsttime'], testimonials: ['discretion'] };
  const FIXED = { trust: renderTrustBar, needs: renderNeedsSection, firsttime: renderFirstTimeSection, kits: renderKitsSection, discretion: renderDiscretionSection };

  const searching = state.searchQuery.trim().length>0;
  let body = '';
  if(searching){
    // Con una búsqueda activa, se salta todo lo decorativo (bienvenida, banners, testimonios,
    // etc.) y se va directo a los resultados — antes esas secciones se quedaban arriba y había
    // que bajar para ver algo, dando la sensación de que el buscador no hacía nada.
    body = SECTION_RENDERERS.grid() + SECTION_RENDERERS.footer();
  } else {
    order.forEach(key=>{
      (before[key]||[]).forEach(fk=>{ body += FIXED[fk](); });
      if(sectionVisible(key)) body += SECTION_RENDERERS[key]();
      (after[key]||[]).forEach(fk=>{ body += FIXED[fk](); });
    });
  }

  const showBar = !isKioskMode() && cartCount()>0 && !state.cartOpen && !state.checkoutOpen;
  const showCompareBar = !isKioskMode() && state.compareIds.length>=2 && !state.compareOpen;
  return `
  <div class="app">
    <div class="topbar">${renderHeader()}</div>
    <div class="topbar-spacer" id="topbar-spacer"></div>
    ${state.settings.storePaused ? `<div class="note-box" style="margin:14px 20px 0;background:#F6DDE3;color:#7A2E45;font-weight:600;">${icon('alert-triangle',15)} ${state.settings.storePausedMessage || 'La tienda está en pausa temporalmente y no podemos tomar pedidos.'}</div>` : ''}
    ${state.loadError ? `<div class="note-box" style="margin:14px 20px 0;">No pudimos conectar con el servidor, intenta recargar la página.</div>` : ''}
    ${state.catalogIncomplete ? `<div class="note-box" style="margin:14px 20px 0;">Puede que falten algunos productos por cargar. <button class="btn-tertiary" style="margin-left:4px;" onclick="state.catalogIncomplete=false;render();loadFullCatalogWithRetry();">Reintentar</button></div>` : ''}
    ${body}
    <div class="mobile-cart-spacer ${showBar||showCompareBar?'show':''}"></div>
  </div>
  ${showCompareBar ? `<div style="position:fixed;left:0;right:0;bottom:${showBar?'56px':'0'};z-index:39;">${renderCompareBar()}</div>` : ''}
  <div class="mobile-cart-bar ${showBar?'show':''}">
    <div class="mobile-cart-bar-info">
      <span class="mobile-cart-bar-count">${cartCount()} artículo${cartCount()===1?'':'s'}</span>
      <span class="mobile-cart-bar-total">${money(cartTotal())}</span>
    </div>
    <button class="mobile-cart-bar-btn" onclick="state.cartOpen=true;render()">Ver carrito</button>
  </div>
  <div class="overlay ${state.cartOpen||state.checkoutOpen||state.detailProductId||state.profileOpen||state.messageDrawerOpen||state.checkoutReminderOpen||state.wishlistOpen||state.compareOpen||state.cartAbandonSurveyOpen||state.privacyPolicyOpen?'open':''}" onclick="if(state.cartOpen){closeCartDrawer();}state.checkoutOpen=false;state.profileOpen=false;state.wishlistOpen=false;state.compareOpen=false;state.cartAbandonSurveyOpen=false;state.privacyPolicyOpen=false;closeMessageDrawer();closeProductDetail();"></div>
  <div class="drawer ${state.cartOpen?'open':''}">${renderCartDrawer()}</div>
  <div class="drawer ${state.checkoutOpen?'open':''}">${renderCheckoutDrawer()}</div>
  <div class="drawer drawer-detail ${state.detailProductId?'open':''}">${state.detailProductId ? renderProductDetailDrawer() : ''}</div>
  <div class="drawer ${state.profileOpen?'open':''}">${state.profileOpen ? renderProfileDrawer() : ''}</div>
  <div class="drawer ${state.messageDrawerOpen?'open':''}">${state.messageDrawerOpen ? renderMessageDrawer() : ''}</div>
  <div class="drawer ${state.checkoutReminderOpen?'open':''}">${state.checkoutReminderOpen ? renderCheckoutReminderDrawer() : ''}</div>
  <div class="drawer ${state.wishlistOpen?'open':''}">${state.wishlistOpen ? renderWishlistDrawer() : ''}</div>
  <div class="drawer ${state.compareOpen?'open':''}">${state.compareOpen ? renderCompareDrawer() : ''}</div>
  <div class="drawer ${state.cartAbandonSurveyOpen?'open':''}">${state.cartAbandonSurveyOpen ? renderCartAbandonSurveyDrawer() : ''}</div>
  <div class="drawer ${state.privacyPolicyOpen?'open':''}">${state.privacyPolicyOpen ? renderPrivacyPolicyDrawer() : ''}</div>
  `;
}

/* ============== PRESERVAR EL CAMPO QUE SE ESTÁ EDITANDO AL VOLVER A DIBUJAR LA PANTALLA ==============
   Mismo mecanismo que en admin.html: captura qué campo tenía el foco y en qué posición iba el
   cursor justo antes de que render() reconstruya el HTML, y lo restaura después — así nunca se
   pierde lo que un cliente está escribiendo (su nombre, dirección, etc.) si algo en segundo
   plano dispara un redibujado mientras tanto. */
function captureFocusState(root){
  const el = document.activeElement;
  if(!el || !root || !root.contains(el) || !el.id) return null;
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT') return null;
  const info = { id: el.id, value: el.value, scrollTop: root.scrollTop };
  if(typeof el.selectionStart === 'number'){ info.selStart = el.selectionStart; info.selEnd = el.selectionEnd; }
  return info;
}
function restoreFocusState(root, info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  if('value' in el && el.value !== info.value) el.value = info.value;
  el.focus();
  if(info.selStart!=null && el.setSelectionRange){
    try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
  }
  root.scrollTop = info.scrollTop;
}
const SCROLLABLE_SELECTOR = '[style*="overflow-y:auto"],[style*="overflow-y: auto"],[style*="overflow:auto"],[style*="overflow: auto"]';
function captureScrollPositions(root){
  return Array.from(root.querySelectorAll(SCROLLABLE_SELECTOR)).map(el=>el.scrollTop);
}
function restoreScrollPositions(root, positions){
  if(!positions || !positions.length) return;
  const els = root.querySelectorAll(SCROLLABLE_SELECTOR);
  els.forEach((el,i)=>{ if(positions[i]) el.scrollTop = positions[i]; });
}
function render(){
  const root = document.getElementById('root');
  const focusInfo = captureFocusState(root);
  const scrollPositions = captureScrollPositions(root);
  if(!state.loaded){ root.innerHTML = `<div class="loading-screen">Cargando catálogo…</div>`; restoreFocusState(root, focusInfo); return; }
  if(state.settings.ageGateEnabled!==false && !hasConfirmedAge()){ root.innerHTML = renderAgeGate(); restoreFocusState(root, focusInfo); return; }
  root.innerHTML = state.orderPlaced ? renderSuccess() : renderStore();
  if(!document.getElementById('toast')){ const t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  adjustTopbarSpacer();
  restoreFocusState(root, focusInfo);
  restoreScrollPositions(root, scrollPositions);
  ensurePromoCountdownTimer();
  updateDocumentTitle();
}
// El título de la pestaña antes siempre decía lo mismo sin importar qué se estuviera viendo —
// aquí se actualiza según el producto o la categoría activa, para que se vea bien al compartir
// el enlace o al volver a una pestaña entre varias abiertas, y ayuda un poco al SEO de las
// páginas que Google indexa con JavaScript ejecutado.
const DEFAULT_PAGE_TITLE = document.title;
function updateDocumentTitle(){
  const storeName = state.settings.storeName || 'La Casa de los Placeres';
  if(state.orderPlaced){ document.title = `¡Pedido recibido! — ${storeName}`; return; }
  if(state.detailProductId){
    const p = state.products.find(x=>x.id===state.detailProductId);
    if(p){ document.title = `${p.name} — ${storeName}`; return; }
  }
  if(state.activeBestSellers){ document.title = `Más vendidos — ${storeName}`; return; }
  if(state.activeCat && state.activeCat!=='Todos'){ document.title = `${state.activeCat} — ${storeName}`; return; }
  document.title = DEFAULT_PAGE_TITLE;
}
function adjustTopbarSpacer(){
  const bar = document.querySelector('.topbar');
  const spacer = document.getElementById('topbar-spacer');
  if(bar && spacer) spacer.style.height = bar.offsetHeight + 'px';
}
window.addEventListener('resize', adjustTopbarSpacer);

/* ============== INSINUACIÓN VISUAL DE SCROLL EN CHIPS HORIZONTALES ==============
   "¿Qué estás buscando?" y las categorías son filas que se deslizan horizontalmente,
   pero nada lo indicaba salvo el propio gesto de arrastrar. Para que se note que hay
   más opciones a los lados, la fila se mueve sola muy despacio y de ida y vuelta (nunca
   salta de golpe), se detiene apenas la persona la toca o le da scroll, y no se activa
   si el sistema tiene pedido reducir animaciones. No cambia qué se puede elegir ni cómo:
   solo agrega movimiento a las mismas filas que ya existían. Como toda la página se
   vuelve a dibujar con cada render(), esto busca los elementos en el DOM en cada cuadro
   en vez de guardar una referencia fija, así sigue funcionando después de cualquier click. */
const AUTOSCROLL_SELECTORS = ['.needs-row', '.cats'];
const autoScrollDir = {};
const autoScrollFrac = {}; // resto (menor a 1px) que un movimiento tan lento deja pendiente entre cuadros
const autoScrollPausedUntil = {};
function pauseAutoScrollFor(target){
  AUTOSCROLL_SELECTORS.forEach(sel=>{ if(target.closest && target.closest(sel)) autoScrollPausedUntil[sel] = Date.now() + 4000; });
}
document.addEventListener('pointerdown', (e)=>pauseAutoScrollFor(e.target), {passive:true});
document.addEventListener('wheel', (e)=>pauseAutoScrollFor(e.target), {passive:true});
let autoScrollLastTs = null;
function autoScrollTick(ts){
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dt = autoScrollLastTs===null ? 0 : ts - autoScrollLastTs;
  autoScrollLastTs = ts;
  if(!reduceMotion && dt>0 && dt<200){
    AUTOSCROLL_SELECTORS.forEach(sel=>{
      const el = document.querySelector(sel);
      if(!el) return;
      const maxScroll = el.scrollWidth - el.clientWidth;
      if(maxScroll<=4) return; // no hay nada que deslizar
      if(autoScrollPausedUntil[sel] && Date.now() < autoScrollPausedUntil[sel]) return;
      const dir = autoScrollDir[sel] || 1;
      const speed = 22; // px/segundo, sutil pero visible
      // A esta velocidad el avance por cuadro es menor a 1px, y scrollLeft solo acepta
      // enteros: si se lee y escribe el valor redondeado en cada cuadro, el navegador
      // lo vuelve a redondear hacia abajo y nunca avanza. Por eso el resto (< 1px) se
      // guarda aparte y solo se mueve el elemento cuando ya suma al menos 1px completo.
      const frac = (autoScrollFrac[sel]||0) + dir*speed*(dt/1000);
      const wholePixels = Math.trunc(frac);
      autoScrollFrac[sel] = frac - wholePixels;
      if(wholePixels!==0){
        let next = el.scrollLeft + wholePixels;
        if(next >= maxScroll){ next = maxScroll; autoScrollDir[sel] = -1; autoScrollFrac[sel] = 0; }
        else if(next <= 0){ next = 0; autoScrollDir[sel] = 1; autoScrollFrac[sel] = 0; }
        el.scrollLeft = next;
      }
    });
  }
  requestAnimationFrame(autoScrollTick);
}
requestAnimationFrame(autoScrollTick);

loadData();
</script>
