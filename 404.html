<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página no encontrada — La Casa de los Placeres</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#5C1F49">
<style>
  :root{--primary:#993477;--deep:#5C1F49;--coral:#ED7578;--amber:#F6A030;--bg:#F9F6F8;--ink:#1A1A1A;--soft:#666;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
       font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:24px 16px;}
  .card{max-width:420px;width:100%;background:#fff;border-radius:20px;padding:32px 24px;text-align:center;
        box-shadow:0 16px 32px -16px rgba(74,22,66,.28);border:1px solid #EBD9D3;}
  img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 18px;}
  .code{font-weight:800;letter-spacing:.08em;color:var(--primary);font-size:13px;margin-bottom:6px;}
  h1{font-size:24px;margin:0 0 10px;line-height:1.2;}
  p{color:var(--soft);font-size:15px;line-height:1.5;margin:0 0 22px;}
  a.btn{display:block;background:var(--primary);color:#fff;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:999px;font-size:16px;}
  a.btn:active{background:var(--deep);}
</style>
</head>
<body>
  <main class="card">
    <img src="/logo.png" alt="La Casa de los Placeres">
    <div class="code">ERROR 404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté incompleto o que el producto ya no esté disponible. El catálogo completo te espera en la tienda.</p>
    <a class="btn" href="/">Ir a la tienda</a>
  </main>
</body>
</html>
